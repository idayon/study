name: 알리오 공고 수집

on:
  schedule:
    - cron: "0 22 * * *"   # 매일 07:00 (한국 시간)
  workflow_dispatch:        # Actions 탭에서 수동 실행

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 공고 받아서 거르기
        env:
          ALIO_KEY: ${{ secrets.ALIO_KEY }}
        run: node scripts/alio.js
      - name: 바뀐 게 있으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alio.json
          git diff --cached --quiet || git commit -m "알리오 공고 자동 갱신"
          git push
