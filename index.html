"윤곽선","그룹"],"a":0,"e":"슬라이서는 항목들이 단추 형태로 나열된 필터 창입니다. 부서 슬라이서를 만들면 영업부, 인사부 같은 단추가 뜨고 누르는 대로 피벗이 걸러집니다.\n보고서 필터로도 같은 일을 할 수 있지만 지금 무엇이 선택되어 있는지 한눈에 보이지 않습니다. 슬라이서는 선택 상태가 색으로 표시되어 직관적입니다.\n날짜 전용으로는 시간 표시 막대를 씁니다.\n\n▸ 슬라이서: 클릭으로 필터를 조작하는 시각적 컨트롤.\n▸ 시간 표시 막대: 날짜 범위를 막대로 조절하는 필터."},{"sub":"엑셀 분석작업","q":"피벗 테이블에서 기존 필드를 이용해 새로운 계산 항목을 만드는 기능은?","o":["계산 필드","조건부 서식","값 표시 형식","그룹화"],"a":0,"e":"매출과 원가 필드가 있을 때 이익 필드를 따로 만들고 싶다면 원본 데이터에 열을 추가하거나 피벗 안에서 계산 필드를 만듭니다.\n피벗 테이블 분석 탭의 필드, 항목 및 집합에서 계산 필드를 고르고 이름과 수식을 입력하면 됩니다. 수식에는 다른 필드 이름을 그대로 쓸 수 있습니다.\n필드가 아니라 특정 항목끼리 계산하려면 계산 항목을 씁니다.\n\n▸ 계산 필드: 피벗 안에서 수식으로 새로 만든 필드.\n▸ 값 표시 형식: 이미 있는 값을 비율 등으로 바꿔 보여주는 설정."},{"sub":"엑셀 분석작업","q":"데이터 통합에서 사용할 수 있는 계산 함수가 아닌 것은?","o":["합계","평균","개수","순위"],"a":3,"e":"통합 대화상자의 함수 목록에는 합계, 개수, 평균, 최대, 최소, 곱, 숫자 개수, 표준편차, 분산이 있습니다. 여러 표를 합칠 때 어떤 방식으로 묶을지 고르는 것입니다.\n순위는 값들 사이의 상대적 서열이라 여러 표를 합치는 계산으로 쓸 수 없습니다. 순위가 필요하면 통합한 뒤 RANK 함수를 따로 씁니다.\n\n▸ 통합: 여러 범위의 데이터를 하나로 합쳐 계산하는 기능."},{"sub":"엑셀 분석작업","q":"해 찾기에서 지정할 수 있는 요소가 아닌 것은?","o":["목표 설정 셀","변수 셀","제한 조건","셀의 글꼴 색"],"a":3,"e":"해 찾기는 여러 변수와 제약이 있는 최적화 문제를 푸는 도구입니다.\n목표 설정 셀은 최대나 최소로 만들거나 특정 값이 되게 할 수식 셀이고, 변수 셀은 값을 바꿔가며 찾을 셀들입니다. 제한 조건에는 예산은 1000 이하, 생산량은 정수 같은 조건을 넣습니다.\n서식은 계산과 무관하므로 대상이 아닙니다. 해 찾기는 기본 기능이 아니라 추가 기능이라 먼저 활성화해야 리본에 나타납니다.\n\n▸ 최적화: 제약 안에서 가장 좋은 값을 찾는 것.\n▸ 추가 기능: 옵션에서 켜야 사용할 수 있는 확장 도구."},{"sub":"엑셀 분석작업","q":"부분합을 모두 없애고 원래 표로 되돌리는 방법은?","o":["부분합 대화상자에서 모두 제거를 클릭","윤곽 기호를 숨긴다","필터를 해제한다","시트를 복사한다"],"a":0,"e":"부분합을 실행하면 소계 행이 실제로 삽입되고 왼쪽에 윤곽 기호가 생깁니다. 윤곽 기호를 지우거나 숨겨도 삽입된 소계 행은 그대로 남습니다.\n완전히 되돌리려면 부분합 대화상자를 다시 열고 모두 제거를 눌러야 합니다. 그러면 삽입된 행과 윤곽이 함께 사라집니다.\n\n▸ 윤곽 기호: 왼쪽에 나타나는 1, 2, 3 단추와 접기 표시.\n▸ 모두 제거: 부분합을 삭제하고 원래 데이터로 되돌리는 단추."},{"sub":"엑셀 분석작업","q":"피벗 테이블의 값을 전체 합계에 대한 비율로 표시하려면?","o":["값 표시 형식에서 총합계 비율을 선택","조건부 서식을 적용","계산 필드를 추가","슬라이서를 삽입"],"a":0,"e":"숫자를 그대로 보여주는 대신 비중으로 보고 싶을 때가 있습니다. 값 필드를 우클릭해 값 표시 형식을 열면 총합계 비율, 열 합계 비율, 행 합계 비율, 상위 행 합계 비율 등을 고를 수 있습니다.\n원본 값은 그대로 두고 표시 방식만 바꾸는 것이라 언제든 되돌릴 수 있습니다.\n\n▸ 열 합계 비율: 각 열 안에서 차지하는 비중.\n▸ 행 합계 비율: 각 행 안에서 차지하는 비중."},{"sub":"엑셀 기타작업","q":"작성한 매크로를 모든 통합 문서에서 사용할 수 있게 하려면 저장 위치를 어디로 지정해야 하는가?","o":["현재 통합 문서","새 통합 문서","개인용 매크로 통합 문서","추가 기능"],"a":2,"e":"매크로를 기록할 때 저장 위치를 고르게 되어 있습니다.\n현재 통합 문서를 고르면 그 파일에서만 쓸 수 있습니다. 개인용 매크로 통합 문서를 고르면 PERSONAL.XLSB라는 숨은 파일에 저장되어 엑셀을 열 때마다 함께 열리므로 어떤 파일에서든 쓸 수 있습니다.\n실기 시험에서는 보통 현재 통합 문서에 저장하라고 나옵니다. 채점 대상이 그 파일이기 때문입니다.\n\n▸ PERSONAL.XLSB: 개인용 매크로가 저장되는 숨김 통합 문서.\n▸ 매크로 사용 통합 문서: 매크로가 든 파일은 xlsm 확장자로 저장해야 합니다."},{"sub":"엑셀 기타작업","q":"매크로가 포함된 통합 문서를 저장할 때 사용해야 하는 파일 형식은?","o":["xlsx","xlsm","xlsb만 가능","csv"],"a":1,"e":"일반 xlsx 형식은 보안상 매크로를 담지 못합니다. 매크로가 들어 있는 파일을 xlsx로 저장하면 매크로가 통째로 사라진다는 경고가 뜹니다.\n매크로를 살리려면 xlsm으로 저장해야 합니다. m이 매크로를 뜻합니다. 이진 형식인 xlsb도 매크로를 담을 수 있지만 실기에서는 xlsm을 씁니다.\n\n▸ xlsm: 매크로 사용 통합 문서.\n▸ 매크로 보안: 외부 파일의 매크로를 자동 실행하지 못하게 막는 설정."},{"sub":"엑셀 기타작업","q":"VBA에서 변수를 반드시 선언하도록 강제하는 문장은?","o":["Option Explicit","Option Base 1","Dim All","Set Strict"],"a":0,"e":"VBA는 기본적으로 선언하지 않은 변수도 그냥 쓸 수 있습니다. 편해 보이지만 오타가 나면 새 변수로 인식해버려 찾기 힘든 오류가 생깁니다.\n모듈 맨 위에 Option Explicit을 적어두면 선언하지 않은 변수를 쓸 때 오류를 내줍니다. 덕분에 오타를 바로 잡을 수 있습니다.\n변수 선언은 Dim 변수명 As 자료형 형태로 합니다.\n\n▸ 모듈: VBA 코드를 담는 문서 단위.\n▸ Dim: 변수를 선언하는 키워드.\n▸ 자료형: Integer, String, Double 등 변수에 담을 값의 종류."},{"sub":"엑셀 기타작업","q":"VBA에서 컬렉션의 모든 요소를 하나씩 처리하는 반복문은?","o":["For Each ... Next","Do Until ... Loop","Select Case","With ... End With"],"a":0,"e":"반복문에는 몇 가지가 있습니다.\nFor ... Next는 1부터 10까지처럼 횟수가 정해진 반복입니다. Do While이나 Do Until은 조건이 만족되는 동안 또는 될 때까지 반복합니다. For Each는 범위 안의 셀들이나 시트들처럼 묶음의 각 요소를 하나씩 꺼내 처리합니다.\n선택된 셀마다 무언가를 하려면 For Each c In Selection 형태로 씁니다.\n\n▸ 컬렉션: 같은 종류의 개체가 모인 묶음. Worksheets, Range 등이 있습니다.\n▸ 개체: 시트, 셀, 차트처럼 조작 대상이 되는 요소."},{"sub":"엑셀 기타작업","q":"VBA에서 워크시트의 특정 셀을 지정하는 표현으로 옳은 것은?","o":["Range(\"A1\")","Cell(1,1)","Sheet(A1)","Column(A1)"],"a":0,"e":"셀을 가리키는 방법은 두 가지입니다.\nRange는 주소 문자열로 지정합니다. Range(\"A1\") 또는 Range(\"A1:C10\")처럼 씁니다. Cells는 행과 열 번호로 지정합니다. Cells(1, 1)이 A1입니다. 반복문 안에서 번호를 변수로 바꿔가며 쓸 때는 Cells가 편합니다.\nCell이라는 단수형 개체는 없습니다.\n\n▸ Range: 셀 또는 셀 범위를 나타내는 개체.\n▸ Cells(행, 열): 번호로 셀을 지정하는 방식."},{"sub":"엑셀 기타작업","q":"VBA에서 폼을 화면에서 닫는 명령으로 옳은 것은?","o":["Unload Me","Close Me","Exit Form","End Form"],"a":0,"e":"사용자 정의 폼에서 닫기 단추를 만들 때 쓰는 구문입니다. Me는 지금 코드가 들어 있는 폼 자신을 가리킵니다. Unload Me는 폼을 메모리에서 내려 완전히 닫습니다.\n비슷한 것으로 Me.Hide가 있는데, 이것은 화면에서 감출 뿐 메모리에는 남아 있어 입력된 값이 유지됩니다.\n액세스에서 폼을 닫을 때는 DoCmd.Close를 씁니다.\n\n▸ Me: 현재 폼이나 모듈 자신을 가리키는 키워드.\n▸ Unload: 개체를 메모리에서 제거하는 명령."},{"sub":"엑셀 기타작업","q":"사용자 정의 폼이 화면에 나타나기 직전에 실행되는 이벤트는?","o":["Initialize","Click","Change","Terminate"],"a":0,"e":"폼에도 생애 주기가 있습니다. Initialize는 폼이 메모리에 올라올 때 실행되어 목록 상자에 항목을 채우거나 초기값을 넣는 데 씁니다. Terminate는 폼이 사라질 때 실행됩니다.\n실기에서는 폼이 열릴 때 콤보 상자에 값을 추가하는 문제가 자주 나오는데, 이 코드를 Initialize 안에 넣습니다.\n\n▸ 이벤트: 특정 상황에서 자동으로 실행되는 계기.\n▸ AddItem: 목록에 항목을 추가하는 메서드."},{"sub":"엑셀 기타작업","q":"차트에서 값의 변화 추세를 직선이나 곡선으로 표시해주는 요소는?","o":["추세선","오차 막대","데이터 레이블","눈금선"],"a":0,"e":"추세선은 데이터가 전체적으로 어느 방향으로 가고 있는지를 선으로 보여줍니다. 선형, 지수, 로그, 다항식, 이동 평균 등 종류를 고를 수 있고 수식과 R 제곱 값을 차트에 표시할 수도 있습니다.\n주의할 점은 원형 차트나 도넛형 차트에는 추세선을 넣을 수 없다는 것입니다. 시간 흐름이 없는 구성비 차트이기 때문입니다.\n\n▸ 오차 막대: 값의 오차 범위를 위아래 선으로 표시한 것.\n▸ 눈금선: 값을 읽기 쉽게 배경에 그은 선."},{"sub":"엑셀 기타작업","q":"한 셀 안에 작은 차트를 그려 데이터 흐름을 보여주는 기능은?","o":["스파크라인","슬라이서","조건부 서식 아이콘","그림 영역"],"a":0,"e":"스파크라인은 셀 하나에 들어가는 아주 작은 차트입니다. 월별 매출 12개 값을 옆 셀 하나에 꺾은선으로 그려 흐름만 파악할 때 씁니다.\n종류는 꺾은선형, 열, 승패 세 가지입니다. 최고점과 최저점을 색으로 강조할 수 있고, 여러 행에 한꺼번에 넣을 수도 있습니다.\n일반 차트와 달리 셀 배경에 그려지므로 지울 때는 삭제 키가 아니라 스파크라인 지우기를 써야 합니다.\n\n▸ 승패 스파크라인: 양수와 음수를 위아래 막대로만 표시하는 형태."},{"sub":"엑셀 기타작업","q":"차트의 가로 축과 세로 축에 표시되는 데이터를 서로 바꾸는 기능은?","o":["행/열 전환","축 서식","차트 종류 변경","데이터 원본 삭제"],"a":0,"e":"같은 데이터라도 무엇을 계열로 삼느냐에 따라 차트가 완전히 달라 보입니다. 월별로 지점을 비교할지, 지점별로 월을 비교할지의 차이입니다.\n차트 디자인 탭의 데이터 선택에서 행/열 전환을 누르면 계열과 항목이 서로 바뀝니다. 문제에서 요구하는 형태에 맞춰 눌러주면 됩니다.\n\n▸ 계열: 하나의 색으로 묶여 표현되는 값들.\n▸ 항목: 가로 축에 나열되는 이름들."},{"sub":"엑셀 기타작업","q":"차트에서 세로 축의 최솟값과 최댓값을 직접 지정하려면?","o":["축 서식에서 경계 값을 설정","차트 종류를 변경","데이터 레이블 추가","범례 위치 변경"],"a":0,"e":"엑셀은 값의 범위를 보고 축 눈금을 자동으로 정합니다. 그런데 값들이 90에서 100 사이에 몰려 있으면 0부터 시작하는 축 때문에 차이가 안 보입니다.\n축을 우클릭해 축 서식을 열고 경계의 최소와 최대를 직접 입력하면 원하는 구간만 확대해 보여줄 수 있습니다. 단위를 지정하면 눈금 간격도 조절됩니다.\n\n▸ 경계: 축이 시작하고 끝나는 값.\n▸ 단위: 눈금이 매겨지는 간격."},{"sub":"엑셀 기타작업","q":"매크로 실행 시 오류가 났을 때 코드를 한 줄씩 실행하며 확인하는 기능은?","o":["F8 한 단계씩 코드 실행","F5 실행","Ctrl+S 저장","F2 개체 찾아보기"],"a":0,"e":"VBA 편집기에서 F5를 누르면 코드가 한 번에 끝까지 실행됩니다. 어디서 잘못됐는지 알기 어렵습니다.\nF8을 누르면 한 줄씩 실행되며 지금 어느 줄에 있는지 노란색으로 표시됩니다. 변수 위에 마우스를 올리면 현재 값도 볼 수 있어 오류 지점을 찾기 쉽습니다.\n중단점을 걸어두면 그 줄까지는 한 번에 실행하고 거기서 멈춥니다.\n\n▸ 디버깅: 코드의 오류를 찾아 고치는 작업.\n▸ 중단점: 실행을 멈추게 지정해둔 줄. F9로 설정합니다."},{"sub":"액세스 DB구축","q":"예 또는 아니요 두 값만 저장하는 데이터 형식은?","o":["짧은 텍스트","숫자","Yes/No","일련 번호"],"a":2,"e":"회원 여부, 재직 여부처럼 둘 중 하나인 값은 Yes/No 형식으로 저장합니다. 내부적으로는 참이 -1, 거짓이 0으로 저장됩니다.\n폼에서는 확인란으로 표시되어 체크 여부로 입력합니다. 형식 속성을 바꾸면 예/아니요, 참/거짓, 켜기/끄기 중에서 보이는 방식을 고를 수 있습니다.\n\n▸ 확인란: 체크박스 형태의 입력 컨트롤.\n▸ 데이터 형식: 필드에 저장할 값의 종류를 정하는 설정."},{"sub":"액세스 DB구축","q":"필드의 캡션 속성이 하는 일은?","o":["실제 필드명 대신 화면에 표시할 이름을 지정한다","필드명을 바꾼다","값을 계산한다","입력을 제한한다"],"a":0,"e":"필드명은 영문이나 약어로 짧게 만들어두는 경우가 많습니다. 그대로 화면에 나오면 사용자가 알아보기 어렵습니다.\n캡션에 사원 이름처럼 보기 좋은 이름을 적어두면 폼이나 보고서, 데이터시트에서 그 이름이 대신 보입니다. 실제 필드명은 그대로라 쿼리나 코드에서는 원래 이름을 씁니다.\n\n▸ 캡션: 화면에 표시할 이름.\n▸ 데이터시트 보기: 표 형태로 데이터를 보는 화면."},{"sub":"액세스 DB구축","q":"인덱스 속성을 예(중복 불가능)로 설정했을 때의 효과는?","o":["같은 값을 두 번 입력할 수 없다","값을 반드시 입력해야 한다","값이 자동으로 증가한다","값이 정렬된다"],"a":0,"e":"인덱스는 원래 검색 속도를 높이기 위한 색인입니다. 여기에 중복 불가능 옵션을 주면 그 필드에 같은 값이 두 번 들어가지 못하게 막는 역할도 합니다.\n사원번호나 이메일처럼 유일해야 하는 필드에 씁니다. 기본키는 자동으로 중복 불가능 인덱스가 걸립니다.\n주의할 점은 중복을 막을 뿐 빈 값을 막지는 않는다는 것입니다. 값을 반드시 넣게 하려면 필수 속성을 따로 예로 두어야 합니다.\n\n▸ 인덱스: 검색을 빠르게 하기 위한 색인 구조.\n▸ 유일성: 값이 겹치지 않는 성질."},{"sub":"액세스 DB구축","q":"일대다 관계에서 다 쪽 테이블에 들어가는 필드는?","o":["기본키","외래키","인덱스","캡션"],"a":1,"e":"부서 하나에 사원이 여러 명 있는 구조를 일대다 관계라고 합니다.\n부서 테이블의 부서코드가 기본키이고, 사원 테이블에도 부서코드 필드를 두어 어느 부서 소속인지 표시합니다. 이렇게 다른 테이블의 기본키를 참조하는 필드가 외래키입니다.\n관계를 맺을 때는 기본키 쪽에서 외래키 쪽으로 선을 끌어 연결하고 참조 무결성을 체크합니다.\n\n▸ 외래키: 다른 테이블의 기본키를 가리키는 필드.\n▸ 일대다: 한쪽의 한 레코드가 다른 쪽의 여러 레코드와 연결되는 관계."},{"sub":"액세스 DB구축","q":"유효성 검사 규칙에 >=0 을 입력했을 때의 효과는?","o":["0 미만의 값을 입력할 수 없다","0만 입력할 수 있다","값을 자동으로 0으로 바꾼다","0을 표시하지 않는다"],"a":0,"e":"유효성 검사 규칙은 입력된 값이 조건을 만족하는지 검사해 어긋나면 저장을 막습니다. >=0이면 음수가 들어올 수 없습니다.\n조건은 여러 형태로 쓸 수 있습니다. Between 1 And 100, In(\"남\",\"여\"), Like \"A*\" 같은 식입니다.\n유효성 검사 텍스트에 안내 문구를 적어두면 규칙을 어겼을 때 그 문구가 뜹니다. 적지 않으면 알아보기 어려운 기본 메시지가 나옵니다.\n\n▸ 유효성 검사 텍스트: 규칙 위반 시 보여줄 안내 메시지."},{"sub":"액세스 DB구축","q":"텍스트 필드의 필드 크기 속성이 의미하는 것은?","o":["저장할 수 있는 최대 글자 수","화면에 표시되는 너비","글꼴 크기","레코드 수"],"a":0,"e":"짧은 텍스트 형식의 필드 크기는 최대 몇 글자까지 넣을 수 있는지를 정합니다. 기본은 255이고 그보다 길면 긴 텍스트 형식을 써야 합니다.\n화면에 보이는 열 너비와는 전혀 다른 개념입니다. 열 너비는 보기 설정일 뿐이고 필드 크기는 저장 한계입니다.\n숫자 형식에서 필드 크기는 정수, 실수 같은 숫자의 범위와 정밀도를 정합니다.\n\n▸ 짧은 텍스트: 최대 255자까지 저장하는 문자 형식.\n▸ 긴 텍스트: 대량의 문자를 저장하는 메모 형식."},{"sub":"액세스 DB구축","q":"다른 데이터베이스의 테이블을 액세스에 연결해 사용할 때의 특징은?","o":["원본이 바뀌면 연결된 테이블에도 반영된다","한 번 가져오면 원본과 무관해진다","연결 후에는 원본을 삭제해도 된다","연결 테이블은 조회할 수 없다"],"a":0,"e":"외부 데이터를 다룰 때 방법이 두 가지입니다.\n가져오기는 복사본을 만들어 내 데이터베이스에 넣는 것이라 이후에는 원본과 관계가 끊깁니다. 연결은 원본을 그대로 참조하는 것이라 원본이 바뀌면 그대로 보입니다. 대신 원본 파일이 사라지거나 위치가 바뀌면 열리지 않습니다.\n연결된 테이블은 아이콘에 화살표 표시가 붙어 구분됩니다.\n\n▸ 가져오기: 데이터를 복사해 들여오는 것.\n▸ 연결: 원본을 참조만 하는 것."},{"sub":"액세스 DB구축","q":"조회 속성에서 목록 값만 허용을 예로 설정하면?","o":["목록에 없는 값은 입력할 수 없다","목록이 사라진다","값이 자동 입력된다","중복 입력이 가능해진다"],"a":0,"e":"콤보 상자를 만들어 두어도 사용자가 목록에 없는 값을 직접 타이핑해 넣을 수 있습니다. 그러면 애초에 목록을 만든 이유가 사라집니다.\n목록 값만 허용을 예로 두면 목록 밖의 값은 아예 받아들이지 않습니다. 표기가 통일되어 나중에 집계할 때 문제가 생기지 않습니다.\n\n▸ 행 원본: 콤보 상자에 표시할 값들의 출처.\n▸ 바운드 열: 실제로 저장되는 열의 번호."},{"sub":"액세스 DB구축","q":"기본키를 지정하지 않고 테이블을 저장하려 할 때 액세스의 동작으로 옳은 것은?","o":["기본키를 만들지 묻고 예를 선택하면 일련 번호 필드를 자동 추가한다","저장이 아예 불가능하다","자동으로 첫 필드를 기본키로 지정한다","경고 없이 저장된다"],"a":0,"e":"테이블을 저장할 때 기본키가 없으면 액세스가 기본키를 만들지 물어봅니다. 예를 고르면 ID라는 이름의 일련 번호 필드를 맨 앞에 추가하고 그것을 기본키로 삼습니다.\n아니요를 고르면 기본키 없이도 저장됩니다. 다만 기본키가 없으면 관계를 맺기 어렵고 레코드를 특정하기도 힘들어 대부분 지정합니다.\n\n▸ 일련 번호: 레코드를 추가할 때마다 자동으로 1씩 늘어나는 형식."},{"sub":"액세스 DB구축","q":"필드의 형식 속성과 입력 마스크의 차이로 옳은 것은?","o":["형식은 표시 방법을, 입력 마스크는 입력 방법을 정한다","둘 다 입력을 제한한다","형식이 입력을 강제한다","둘은 같은 속성이다"],"a":0,"e":"형식은 저장된 값을 화면에 어떻게 보여줄지 정합니다. 날짜를 2026-09-10으로 보일지 26/09/10으로 보일지 같은 것입니다. 값 자체는 바뀌지 않습니다.\n입력 마스크는 입력하는 순간 형식을 강제합니다. 하이픈 자리를 미리 그려주고 숫자만 받게 만드는 식입니다.\n둘을 함께 설정하면 입력 마스크로 받고 형식대로 보여줍니다.\n\n▸ 형식: 표시 방법을 정하는 속성.\n▸ 입력 마스크: 입력 형식을 강제하는 속성."},{"sub":"액세스 DB구축","q":"관계 설정에서 관련 필드 모두 업데이트를 체크했을 때의 효과는?","o":["기본키 값을 바꾸면 이를 참조하는 외래키 값도 함께 바뀐다","레코드가 자동으로 추가된다","관계가 해제된다","중복 입력이 허용된다"],"a":0,"e":"부서코드를 A01에서 B01로 바꿔야 한다고 해봅시다. 참조 무결성 때문에 그냥 바꾸면 사원 테이블의 A01들이 존재하지 않는 부서를 가리키게 되어 막힙니다.\n관련 필드 모두 업데이트를 체크해두면 부서 쪽을 바꿀 때 사원 쪽 값도 자동으로 따라 바뀝니다. 비슷하게 관련 레코드 모두 삭제를 체크하면 부서를 지울 때 소속 사원 레코드도 함께 지워집니다. 이쪽은 데이터가 대량으로 사라질 수 있어 신중해야 합니다.\n\n▸ 연쇄 업데이트: 참조하는 쪽까지 값을 함께 갱신하는 것.\n▸ 연쇄 삭제: 참조하는 레코드까지 함께 지우는 것."},{"sub":"액세스 DB구축","q":"하위 데이터시트가 표시되는 조건으로 옳은 것은?","o":["테이블 간에 일대다 관계가 설정되어 있을 때","기본키가 없을 때","필드가 10개 이상일 때","인덱스가 없을 때"],"a":0,"e":"부서 테이블을 데이터시트로 열면 각 행 왼쪽에 더하기 표시가 보일 때가 있습니다. 누르면 그 부서에 속한 사원들이 펼쳐집니다. 이것이 하위 데이터시트입니다.\n일대다 관계가 맺어져 있어야 나타나며, 테이블 속성의 하위 데이터시트 이름에서 어떤 테이블을 펼칠지 지정하거나 없음으로 꺼둘 수도 있습니다.\n\n▸ 하위 데이터시트: 관련된 다 쪽 레코드를 펼쳐 보여주는 영역."},{"sub":"액세스 쿼리","q":"조건 Like \"김*\" 이 찾는 값으로 옳은 것은?","o":["김으로 시작하는 모든 값","김이 포함된 모든 값","김으로 끝나는 값","정확히 김인 값"],"a":0,"e":"Like는 패턴으로 찾는 연산자입니다. 별표는 아무 글자가 몇 개든 올 수 있다는 뜻입니다.\n김*은 김으로 시작하는 값, *김은 김으로 끝나는 값, *김*은 김이 어디에든 들어 있는 값을 찾습니다. 물음표는 아무 글자 한 개를 뜻해서 김?수는 김철수, 김영수 같은 세 글자 이름을 찾습니다.\n샵 기호는 숫자 한 자리를 뜻합니다.\n\n▸ Like: 패턴 일치를 검사하는 연산자.\n▸ 와일드카드: 임의의 글자를 대신하는 기호."},{"sub":"액세스 쿼리","q":"조건 Between 100 And 200 과 같은 의미인 것은?","o":[">=100 And <=200",">100 And <200",">=100 Or <=200","=100 And =200"],"a":0,"e":"Between은 양쪽 끝값을 포함합니다. 100과 200도 조건에 들어갑니다.\n날짜에도 자주 씁니다. Between #2026-01-01# And #2026-12-31# 처럼 우물 정 기호로 날짜를 감싸 씁니다. 액세스에서 날짜는 이 기호로 구분합니다.\n\n▸ Between A And B: A 이상 B 이하.\n▸ #: 액세스에서 날짜와 시간 값을 감싸는 기호."},{"sub":"액세스 쿼리","q":"조건 In(\"서울\",\"부산\",\"대구\") 의 의미로 옳은 것은?","o":["세 값 중 하나와 일치하는 레코드를 찾는다","세 값을 모두 가진 레코드를 찾는다","세 값을 제외한다","세 값을 합친다"],"a":0,"e":"In은 여러 값 중 하나라도 맞으면 되는 조건입니다. Or를 여러 번 쓰는 것보다 짧고 읽기 쉽습니다.\n반대로 제외하려면 Not In(\"서울\",\"부산\")처럼 앞에 Not을 붙입니다.\n\n▸ In: 나열한 값 목록 중 하나와 일치하는지 검사.\n▸ Not: 조건을 반대로 뒤집는 연산자."},{"sub":"액세스 쿼리","q":"값이 입력되지 않은 레코드를 찾는 조건은?","o":["Is Null","= \"\"","Is Empty","= 0"],"a":0,"e":"액세스에서 아무 값도 없는 상태는 Null입니다. 같다는 기호로는 비교할 수 없고 Is Null이라고 써야 합니다.\n값이 있는 레코드를 찾으려면 Is Not Null입니다. 주의할 점은 빈 문자열과 Null이 다르다는 것입니다. 빈 문자열은 길이가 0인 문자가 들어 있는 상태로 = \"\" 로 찾습니다.\n\n▸ Null: 값이 없는 상태.\n▸ 빈 문자열: 길이가 0인 문자. 값이 있긴 있는 상태입니다."},{"sub":"액세스 쿼리","q":"쿼리에서 새로운 계산 필드를 만들 때 사용하는 표기로 옳은 것은?","o":["필드 칸에 이름: 식 형태로 입력","조건 칸에 식만 입력","정렬 칸에 식 입력","요약 칸에 식 입력"],"a":0,"e":"쿼리 디자인의 빈 필드 칸에 이익: [매출]-[원가] 처럼 씁니다. 콜론 앞이 새로 만들 필드의 이름이고 뒤가 계산식입니다.\n필드명은 대괄호로 감싸는 것이 안전합니다. 이름을 붙이지 않으면 식1, 식2 같은 자동 이름이 붙어 알아보기 어렵습니다.\n식이 길면 식 작성기를 열어 만들 수도 있습니다.\n\n▸ 계산 필드: 저장된 값이 아니라 쿼리를 실행할 때 계산되는 필드.\n▸ 식 작성기: 함수와 필드를 골라 식을 만드는 도구."},{"sub":"액세스 쿼리","q":"조건에 따라 두 값 중 하나를 반환하는 액세스 함수는?","o":["IIf","IfError","Switch만 가능","Choose"],"a":0,"e":"IIf는 엑셀의 IF와 같은 일을 합니다. IIf(조건, 참일 때 값, 거짓일 때 값) 형태입니다. 아이 두 개로 시작한다는 점에 주의하세요.\n조건이 세 갈래 이상이면 IIf를 중첩하거나 Switch를 씁니다. Switch는 조건과 값을 쌍으로 나열하는 방식이라 갈래가 많을 때 읽기 좋습니다.\n\n▸ IIf: Immediate If. 즉시 판정 함수.\n▸ Switch: 여러 조건과 결과를 쌍으로 나열하는 함수."},{"sub":"액세스 쿼리","q":"Null 값을 다른 값으로 대체할 때 사용하는 액세스 함수는?","o":["Nz","IsNull","Trim","Val"],"a":0,"e":"Null이 섞여 있으면 계산 결과가 통째로 Null이 되어버립니다. 100 더하기 Null은 100이 아니라 Null입니다.\nNz는 이 문제를 막습니다. Nz([보너스], 0)이라고 쓰면 보너스가 비어 있을 때 0으로 취급합니다. 문자라면 Nz([비고], \"없음\") 처럼 쓸 수 있습니다.\nIsNull은 Null인지 참거짓으로 판정만 하는 함수라 역할이 다릅니다.\n\n▸ Nz: Null을 지정한 값으로 바꿔주는 함수.\n▸ Null 전파: Null이 섞이면 계산 결과 전체가 Null이 되는 현상."},{"sub":"액세스 쿼리","q":"쿼리 결과에서 상위 몇 개의 레코드만 표시하도록 지정하는 속성은?","o":["상위 값","고유 값","정렬","요약"],"a":0,"e":"쿼리 디자인의 상위 값 칸에 숫자나 백분율을 넣으면 그만큼만 보여줍니다. 5를 넣으면 다섯 건, 5%를 넣으면 상위 5퍼센트입니다.\n반드시 먼저 정렬을 해야 의미가 있습니다. 급여 내림차순으로 정렬한 뒤 상위 값 5를 넣어야 고액 연봉자 5명이 나옵니다. 정렬하지 않으면 그냥 앞의 다섯 건이 나옵니다.\nSQL에서는 SELECT TOP 5 형태로 씁니다.\n\n▸ 상위 값: 결과에서 앞쪽 몇 건만 남기는 설정."},{"sub":"액세스 쿼리","q":"서로 다른 두 쿼리의 결과를 위아래로 이어 붙이는 쿼리는?","o":["통합 쿼리(UNION)","크로스탭 쿼리","매개 변수 쿼리","업데이트 쿼리"],"a":0,"e":"조인은 두 테이블을 옆으로 이어 붙여 열이 늘어납니다. 통합 쿼리는 위아래로 이어 붙여 행이 늘어납니다.\n작년 판매 테이블과 올해 판매 테이블을 하나로 합쳐 보고 싶을 때 씁니다. 조건이 있는데 두 결과의 필드 개수가 같아야 하고 순서와 자료형도 맞아야 합니다.\n통합 쿼리는 디자인 보기로 만들 수 없고 SQL 보기에서 직접 작성해야 합니다.\n\n▸ UNION: 중복을 제거하고 합칩니다.\n▸ UNION ALL: 중복까지 그대로 다 합칩니다."},{"sub":"액세스 쿼리","q":"다른 테이블의 값을 하나 찾아오는 도메인 함수는?","o":["DLookup","DSum","DCount","DMax"],"a":0,"e":"도메인 함수는 폼이나 보고서에서 다른 테이블의 값을 참조할 때 씁니다. D로 시작하는 것이 특징입니다.\nDLookup(\"필드\", \"테이블\", \"조건\") 형태로 조건에 맞는 첫 값을 가져옵니다. DSum은 합계, DCount는 개수, DMax는 최댓값을 구합니다.\n편리하지만 레코드마다 계산이 돌아 느려질 수 있어, 가능하면 쿼리로 미리 만들어 쓰는 편이 낫습니다.\n\n▸ 도메인: 값을 찾아올 대상 테이블이나 쿼리.\n▸ 조건: 큰따옴표로 감싼 문자열로 씁니다."},{"sub":"액세스 폼·보고서","q":"여러 레코드를 한 화면에 죽 나열해 보여주는 폼 보기 형식은?","o":["단일 폼","연속 폼","데이터시트","분할 폼"],"a":1,"e":"폼의 기본 보기 속성에 따라 화면이 달라집니다.\n단일 폼은 한 번에 한 레코드만 보여줍니다. 연속 폼은 본문 구역이 레코드 수만큼 반복되어 여러 건이 아래로 나열됩니다. 데이터시트는 엑셀 표처럼 보이고, 분할 폼은 위에 단일 폼 아래에 데이터시트가 함께 나옵니다.\n목록을 보여주는 하위 폼은 보통 연속 폼이나 데이터시트로 만듭니다.\n\n▸ 기본 보기: 폼을 열었을 때 나타날 형식을 정하는 속성."},{"sub":"액세스 폼·보고서","q":"컨트롤 원본이 지정되어 테이블의 필드와 연결된 컨트롤을 무엇이라 하는가?","o":["바운드 컨트롤","언바운드 컨트롤","계산 컨트롤","레이블"],"a":0,"e":"컨트롤은 세 종류로 나뉩니다.\n바운드 컨트롤은 컨트롤 원본에 필드명이 들어 있어 그 필드의 값을 보여주고 수정하면 저장까지 됩니다. 언바운드 컨트롤은 원본이 비어 있어 데이터와 무관하며 제목이나 로고에 씁니다. 계산 컨트롤은 원본에 등호로 시작하는 식이 들어 있어 계산 결과를 보여주지만 수정은 할 수 없습니다.\n\n▸ 컨트롤 원본: 컨트롤이 표시할 내용의 출처.\n▸ 바운드: 데이터와 묶여 있다는 뜻."},{"sub":"액세스 폼·보고서","q":"보고서에서 같은 값이 연속으로 나올 때 첫 번째만 표시하는 속성은?","o":["중복 내용 숨기기","확장 가능","누적 합계","표시"],"a":0,"e":"부서별로 정렬된 명단에서 부서명이 모든 줄에 반복되면 지저분합니다. 중복 내용 숨기기를 예로 설정하면 값이 바뀔 때만 표시되고 같은 값이 이어지는 동안은 비워둡니다.\n인쇄물의 가독성을 높이는 데 쓰이며 보고서에서만 의미가 있는 속성입니다.\n\n▸ 확장 가능: 내용이 길면 컨트롤 높이가 자동으로 늘어나게 하는 속성."},{"sub":"액세스 폼·보고서","q":"보고서에서 레코드가 진행되며 값을 누적해 더해 나가는 속성은?","o":["누적 합계","중복 내용 숨기기","페이지 바꿈","자동 크기 조정"],"a":0,"e":"누적 합계 속성을 그룹으로 설정하면 그룹이 바뀔 때마다 0에서 다시 시작하며 더해 나가고, 전체로 설정하면 보고서 처음부터 끝까지 계속 누적됩니다.\n입출금 내역서의 잔액 열이나 순번을 매길 때 씁니다. 순번은 값이 1인 텍스트 상자에 누적 합계를 걸면 1, 2, 3으로 매겨집니다.\n\n▸ 누적 합계: Running Sum. 앞선 값들을 계속 더해가는 설정."},{"sub":"액세스 폼·보고서","q":"폼이 열릴 때 레코드 원본이 결정되기 전에 발생하는 이벤트는?","o":["Open","Load","Current","Close"],"a":0,"e":"폼이 열릴 때 이벤트가 순서대로 일어납니다. Open이 먼저이고 그다음이 Load, 그다음이 Current입니다.\nOpen은 아직 데이터가 올라오기 전이라 조건에 따라 폼 열기를 취소하는 데 씁니다. Load는 데이터가 올라온 뒤라 컨트롤 값을 다루기에 적합합니다. Current는 레코드를 이동할 때마다 반복해서 발생합니다.\n\n▸ 이벤트 순서: Open → Load → Current 순으로 발생합니다.\n▸ Cancel: Open 이벤트에서 열기를 취소할 때 쓰는 인수."},{"sub":"액세스 폼·보고서","q":"폼에서 레코드 이동 단추를 화면에 표시할지 정하는 속성은?","o":["탐색 단추","레코드 선택기","구분 선","자동 가운데 맞춤"],"a":0,"e":"폼 아래쪽에 처음, 이전, 다음, 마지막으로 이동하는 단추 묶음이 탐색 단추입니다. 아니요로 설정하면 사라집니다.\n레코드 선택기는 폼 왼쪽에 붙는 세로 막대로, 현재 레코드를 선택하는 표시입니다. 조회 전용 화면을 깔끔하게 만들 때 두 속성을 함께 아니요로 두는 경우가 많습니다.\n\n▸ 탐색 단추: 레코드 사이를 이동하는 단추.\n▸ 레코드 선택기: 폼 왼쪽 가장자리의 선택 막대."},{"sub":"액세스 폼·보고서","q":"목록 상자와 콤보 상자의 차이로 옳은 것은?","o":["콤보 상자는 목록이 접혀 있고 직접 입력도 가능하다","목록 상자는 항상 접혀 있다","둘은 완전히 같다","콤보 상자는 항상 펼쳐져 있다"],"a":0,"e":"목록 상자는 항목들이 처음부터 펼쳐진 상태로 보입니다. 자리를 많이 차지하지만 선택지가 한눈에 들어옵니다.\n콤보 상자는 평소에는 한 줄이고 화살표를 눌러야 펼쳐집니다. 자리를 아낄 수 있고, 목록 값만 허용을 아니요로 두면 직접 타이핑도 가능합니다.\n선택지가 적고 항상 보여야 하면 목록 상자, 많고 자리를 아껴야 하면 콤보 상자를 씁니다.\n\n▸ 행 원본: 목록에 채울 값의 출처.\n▸ 다중 선택: 목록 상자에서 여러 항목을 고를 수 있게 하는 속성."},{"sub":"액세스 폼·보고서","q":"보고서를 인쇄했을 때의 모습 그대로 화면에서 확인하는 보기는?","o":["인쇄 미리 보기","디자인 보기","레이아웃 보기","보고서 보기"],"a":0,"e":"보고서에는 보기 방식이 여러 개 있습니다.\n디자인 보기는 구역과 컨트롤을 배치하는 설계 화면이라 실제 데이터가 안 보입니다. 레이아웃 보기는 데이터를 보면서 크기와 위치를 조정할 수 있습니다. 보고서 보기는 데이터를 화면에서 이어 보는 형태로 페이지 구분이 없습니다. 인쇄 미리 보기만 페이지 나눔과 여백까지 실제 인쇄물과 똑같이 보여줍니다.\n\n▸ 여백: 종이 가장자리에서 내용까지의 빈 공간.\n▸ 페이지 설정: 용지 방향, 크기, 여백, 열 개수를 정하는 대화상자."},{"sub":"액세스 폼·보고서","q":"명함처럼 한 페이지에 여러 열로 나누어 인쇄하려면 어디에서 설정하는가?","o":["페이지 설정의 열 탭","그룹화 및 정렬","조건부 서식","탭 순서"],"a":0,"e":"보고서를 세로로 길게 뽑는 대신 한 장에 여러 줄기로 나눠 찍고 싶을 때가 있습니다. 라벨이나 명함이 그렇습니다.\n페이지 설정 대화상자의 열 탭에서 열 개수, 행 간격, 열 간격, 열 크기를 지정합니다. 인쇄 방향도 아래로 다음 열로 갈지 옆으로 갈지 고를 수 있습니다.\n\n▸ 열 개수: 한 페이지에 배치할 세로 단의 수."},{"sub":"액세스 폼·보고서","q":"폼에서 특정 조건의 레코드만 보이게 하는 속성은?","o":["필터","레코드 원본","캡션","탭 순서"],"a":0,"e":"레코드 원본을 통째로 바꾸지 않고 일부만 보고 싶을 때 필터를 씁니다. 폼의 필터 속성에 조건식을 넣고 로드할 때 필터링을 예로 두면 열릴 때부터 적용됩니다.\nVBA에서는 Me.Filter = \"부서='영업부'\" 로 조건을 주고 Me.FilterOn = True 로 켭니다. 조건 안의 문자는 작은따옴표로 감쌉니다.\n\n▸ FilterOn: 필터를 적용할지 여부를 정하는 속성.\n▸ 로드할 때 필터링: 폼을 열 때 필터를 자동 적용하는 설정."},{"sub":"액세스 폼·보고서","q":"보고서 안에 다른 보고서를 넣어 함께 인쇄하는 컨트롤은?","o":["하위 보고서","페이지 나누기","이미지","탭 컨트롤"],"a":0,"e":"거래처별 정보 아래에 그 거래처의 주문 내역을 이어 붙여 인쇄하고 싶을 때 하위 보고서를 씁니다.\n하위 폼과 마찬가지로 기본 필드 연결과 하위 필드 연결 속성으로 두 보고서를 이어야 거래처가 바뀔 때 내역도 따라 바뀝니다. 연결하지 않으면 모든 페이지에 전체 내역이 반복됩니다.\n\n▸ 하위 보고서: 보고서 안에 삽입된 또 다른 보고서.\n▸ 연결 필드: 두 보고서를 이어주는 공통 필드."},{"sub":"액세스 폼·보고서","q":"폼이나 보고서에서 조건에 따라 특정 값의 글꼴 색이나 배경색을 바꾸려면?","o":["조건부 서식","입력 마스크","유효성 검사","탭 정지"],"a":0,"e":"액세스에도 엑셀과 비슷한 조건부 서식이 있습니다. 컨트롤을 선택하고 서식 탭에서 조건부 서식을 열어 규칙을 추가합니다.\n필드 값이 특정 범위일 때, 식이 참일 때, 컨트롤에 포커스가 있을 때 등의 기준을 고를 수 있고 굵게, 기울임, 글꼴 색, 배경색을 지정합니다. 데이터 막대를 넣어 값의 크기를 막대로 보여줄 수도 있습니다.\n\n▸ 포커스: 지금 커서가 놓여 활성화된 상태.\n▸ 식이 참일 때: 직접 조건식을 적어 판정하는 방식."},{"sub":"엑셀 함수","q":"COUNTA와 COUNT의 차이로 옳은 것은?","o":["COUNT는 숫자만, COUNTA는 비어 있지 않은 모든 셀을 센다","COUNT는 모든 셀, COUNTA는 숫자만 센다","둘은 같다","COUNTA는 빈 셀만 센다"],"a":0,"e":"COUNT는 숫자가 든 셀만 셉니다. 이름이나 글자는 세지 않습니다.\nCOUNTA는 A가 All을 뜻해서 숫자든 글자든 뭐라도 들어 있으면 셉니다. 이름 목록의 인원수를 셀 때는 COUNTA를 써야 합니다.\n반대로 빈 셀만 세려면 COUNTBLANK를 씁니다.\n\n▸ COUNTBLANK: 비어 있는 셀의 개수를 세는 함수.\n▸ 빈 문자열: 수식 결과가 \"\"인 셀. 눈에는 비었지만 COUNTA는 셉니다."},{"sub":"엑셀 함수","q":"필터로 숨겨진 행을 제외하고 합계를 구하려 할 때 사용하는 함수는?","o":["SUM","SUBTOTAL","SUMPRODUCT","AGGREGATE만 가능"],"a":1,"e":"SUM은 화면에 안 보이는 행까지 전부 더합니다. 필터를 걸어 일부만 보고 있어도 결과가 그대로입니다.\nSUBTOTAL은 필터로 걸러진 행을 계산에서 빼줍니다. 첫 인수로 무슨 계산을 할지 번호를 넣는데, 9는 합계, 1은 평균, 2는 개수, 4는 최댓값입니다. 여기에 100을 더한 109를 넣으면 수동으로 숨긴 행까지 제외합니다.\n\n▸ SUBTOTAL(함수번호, 범위): 필터 상태를 반영해 계산하는 함수.\n▸ 함수번호: 9는 SUM, 1은 AVERAGE, 2는 COUNT, 3은 COUNTA, 4는 MAX, 5는 MIN."},{"sub":"엑셀 함수","q":"VLOOKUP의 네 번째 인수를 TRUE로 지정할 때의 전제 조건은?","o":["찾을 범위의 첫 열이 오름차순으로 정렬되어 있어야 한다","범위가 내림차순이어야 한다","정렬과 무관하다","숫자만 사용할 수 있다"],"a":0,"e":"TRUE는 근사값 찾기입니다. 정확히 일치하는 값이 없으면 찾는 값보다 작으면서 가장 가까운 값을 고릅니다.\n점수 구간별 등급을 매길 때 많이 씁니다. 0 이상은 가, 60 이상은 양, 70 이상은 미 하는 식의 기준표를 만들어두고 쓰는 것입니다.\n다만 위에서부터 훑다가 값을 넘어서는 순간 멈추는 방식이라 첫 열이 오름차순이 아니면 엉뚱한 결과가 나옵니다.\n\n▸ 근사값 찾기: 정확히 같은 값이 없을 때 가장 가까운 아래 값을 고르는 방식.\n▸ 구간표: 각 구간의 시작값과 결과를 적어둔 참조표."},{"sub":"엑셀 함수","q":"문자열 양쪽 끝과 단어 사이의 불필요한 공백을 제거하는 함수는?","o":["TRIM","CLEAN","SUBSTITUTE","REPLACE"],"a":0,"e":"외부에서 가져온 데이터에는 눈에 안 보이는 공백이 붙어 있는 경우가 많습니다. 이 공백 때문에 VLOOKUP이 값을 못 찾는 일이 자주 생깁니다.\nTRIM은 앞뒤 공백을 모두 없애고 단어 사이 공백은 하나만 남깁니다. CLEAN은 인쇄되지 않는 제어 문자를 없앱니다.\n특정 글자를 다른 글자로 바꾸려면 SUBSTITUTE, 위치를 지정해 바꾸려면 REPLACE를 씁니다.\n\n▸ SUBSTITUTE(문자열, 찾을글자, 바꿀글자): 글자를 기준으로 교체.\n▸ REPLACE(문자열, 시작위치, 글자수, 바꿀글자): 위치를 기준으로 교체."},{"sub":"엑셀 함수","q":"FIND와 SEARCH 함수의 차이로 옳은 것은?","o":["FIND는 대소문자를 구분하고 SEARCH는 구분하지 않는다","FIND는 구분하지 않고 SEARCH는 구분한다","둘 다 대소문자를 구분한다","둘 다 구분하지 않는다"],"a":0,"e":"둘 다 어떤 글자가 문자열의 몇 번째에 있는지 알려줍니다.\n차이는 두 가지입니다. FIND는 대소문자를 구분하고 와일드카드를 쓸 수 없습니다. SEARCH는 대소문자를 구분하지 않고 물음표나 별표 같은 와일드카드를 쓸 수 있습니다.\n찾는 글자가 없으면 둘 다 오류를 내므로 보통 IFERROR로 감쌉니다.\n\n▸ 와일드카드: 아무 글자나 대신하는 기호. ?는 한 글자, *는 여러 글자입니다."},{"sub":"엑셀 함수","q":"=EOMONTH(\"2026-09-10\", 0) 의 결과는?","o":["2026-09-01","2026-09-10","2026-09-30","2026-10-31"],"a":2,"e":"EOMONTH는 End Of Month, 즉 그 달의 마지막 날을 구합니다. 두 번째 인수는 몇 달 뒤를 볼지입니다.\n0을 넣으면 그 달의 말일이므로 9월 30일이 나옵니다. 1을 넣으면 10월 31일, -1을 넣으면 8월 31일입니다.\n결과는 날짜 일련번호로 나오므로 셀 서식을 날짜로 지정해야 날짜 모양으로 보입니다. 비슷한 함수로 몇 달 뒤 같은 날짜를 구하는 EDATE가 있습니다.\n\n▸ 날짜 일련번호: 엑셀이 날짜를 저장하는 숫자. 1900년 1월 1일이 1입니다.\n▸ EDATE: 지정한 개월 수 뒤의 같은 날짜를 구하는 함수."},{"sub":"엑셀 함수","q":"=IF(AND(A1>=80, B1>=80), \"합격\", \"불합격\") 에서 AND가 하는 역할은?","o":["두 조건이 모두 참일 때만 참을 반환한다","둘 중 하나만 참이어도 참이다","조건을 뒤집는다","값을 더한다"],"a":0,"e":"논리 함수는 세 가지를 기억하면 됩니다.\nAND는 나열한 조건이 전부 참일 때만 참입니다. OR는 하나라도 참이면 참입니다. NOT은 참과 거짓을 뒤집습니다.\n이 문제는 두 과목 모두 80점 이상이어야 합격이므로 AND를 씁니다. 한 과목만 넘어도 합격이면 OR로 바꾸면 됩니다.\n\n▸ 논리값: 참(TRUE)과 거짓(FALSE).\n▸ IF(조건, 참일때, 거짓일때): 조건에 따라 다른 값을 내놓는 함수."},{"sub":"엑셀 함수","q":"문자로 저장된 숫자 \"1000\"을 계산 가능한 숫자로 바꾸는 함수는?","o":["VALUE","TEXT","FIXED","NUMBERSTRING"],"a":0,"e":"외부 시스템에서 내려받은 데이터는 숫자처럼 보여도 실제로는 문자인 경우가 많습니다. 셀 왼쪽에 붙어 있고 합계를 내면 0이 나옵니다.\nVALUE는 이런 문자를 진짜 숫자로 바꿔줍니다. 반대로 숫자를 원하는 형식의 문자로 바꾸는 것이 TEXT입니다. 이름이 헷갈리기 쉬운데 방향이 서로 반대라고 기억하면 됩니다.\n\n▸ 좌측 정렬: 문자 데이터의 기본 정렬. 숫자는 우측 정렬됩니다.\n▸ VALUE: 문자를 숫자로.\n▸ TEXT: 숫자를 문자로."},{"sub":"엑셀 함수","q":"=INDEX(A1:C10, 3, 2) 가 반환하는 셀은?","o":["A3","B3","C3","B2"],"a":1,"e":"INDEX는 지정한 범위 안에서 몇 번째 행, 몇 번째 열에 있는 값을 꺼냅니다. 주의할 점은 시트 전체 기준이 아니라 지정한 범위 안에서 센다는 것입니다.\nA1:C10 범위에서 3행 2열이므로 범위의 세 번째 행이자 두 번째 열, 즉 B3이 됩니다.\n보통 MATCH와 함께 써서 행 번호와 열 번호를 자동으로 구합니다.\n\n▸ INDEX(범위, 행번호, 열번호): 위치를 지정해 값을 꺼내는 함수.\n▸ 상대 위치: 범위의 시작점을 1로 두고 세는 방식."},{"sub":"엑셀 배열수식","q":"배열 수식 =SUM((B2:B10>=80)*1) 이 구하는 값은?","o":["80 이상인 값들의 합계","80 이상인 셀의 개수","전체 합계","최댓값"],"a":1,"e":"조건식은 참이면 TRUE, 거짓이면 FALSE가 됩니다. 여기에 1을 곱하면 TRUE는 1, FALSE는 0으로 바뀝니다.\n이 1과 0을 모두 더하면 조건을 만족한 셀이 몇 개인지, 즉 개수가 나옵니다. 1을 곱하는 대신 앞에 마이너스를 두 번 붙여 --(B2:B10>=80)으로 쓰기도 하는데 같은 원리입니다.\n값을 더하고 싶다면 마지막에 값 범위를 곱해야 합니다.\n\n▸ 논리값의 산술 변환: TRUE는 1, FALSE는 0으로 계산됩니다."},{"sub":"엑셀 배열수식","q":"배열 수식으로 조건에 맞는 셀의 개수를 구하는 형태로 옳은 것은?","o":["{=COUNT(IF(조건, 1))}","{=COUNT(조건)}","{=COUNTIF(조건)}","{=SUM(조건)}"],"a":0,"e":"IF가 조건에 맞는 자리에만 1을 남기고 나머지는 FALSE로 만들면, COUNT가 숫자인 1만 세어 개수를 구합니다. COUNT는 논리값을 세지 않기 때문에 이 방식이 성립합니다.\n반드시 Ctrl+Shift+Enter로 입력해야 합니다. 그냥 Enter를 누르면 첫 셀만 검사해 잘못된 값이 나옵니다.\n같은 일을 COUNTIFS로도 할 수 있지만, 실기에서는 배열 수식으로 풀라는 조건이 붙는 경우가 있습니다.\n\n▸ COUNT: 숫자만 세는 함수. TRUE와 FALSE는 세지 않습니다."},{"sub":"엑셀 배열수식","q":"배열 수식으로 특정 값의 순위를 구하는 =SUM((범위>값)*1)+1 에서 마지막에 1을 더하는 이유는?","o":["자기 자신을 포함시키기 위해","오차를 보정하기 위해","0을 피하기 위해","의미 없는 관행이다"],"a":0,"e":"이 수식은 나보다 큰 값이 몇 개인지를 셉니다. 나보다 큰 값이 3개라면 나는 4등입니다. 큰 값의 개수에 자기 자신 한 칸을 더해야 순위가 되므로 마지막에 1을 더합니다.\n나보다 큰 값이 하나도 없으면 0 + 1 = 1등이 됩니다.\nRANK.EQ 함수로도 같은 결과를 얻지만, 조건이 붙은 순위를 구할 때는 이 배열 방식이 유용합니다.\n\n▸ 순위: 정렬했을 때 몇 번째에 오는지를 나타내는 수."},{"sub":"엑셀 배열수식","q":"배열 수식을 입력한 뒤 수식 입력줄에 중괄호가 보이지 않는다면 무엇을 확인해야 하는가?","o":["Ctrl+Shift+Enter로 입력했는지","셀 서식이 숫자인지","시트가 보호되어 있는지","범위에 색이 칠해져 있는지"],"a":0,"e":"중괄호는 엑셀이 배열 수식으로 인식했다는 표시입니다. 이 표시가 없다면 일반 수식으로 들어간 것이라 결과가 틀립니다.\n다시 그 셀을 편집 상태로 들어가 Ctrl+Shift+Enter를 눌러야 합니다. 중괄호를 손으로 타이핑하면 문자로 인식되어 오류가 납니다.\n최신 버전 엑셀은 동적 배열을 지원해 그냥 Enter로도 동작하는 경우가 있지만, 시험 환경에서는 CSE를 원칙으로 삼는 것이 안전합니다.\n\n▸ 수식 입력줄: 셀에 들어 있는 수식이 표시되는 위쪽 입력 칸."},{"sub":"엑셀 기본작업","q":"사용자 지정 표시 형식에서 네 번째 구역이 적용되는 대상은?","o":["양수","음수","0","문자"],"a":3,"e":"표시 형식은 세미콜론으로 최대 네 구역까지 나눕니다. 순서는 양수, 음수, 0, 문자로 고정되어 있습니다.\n네 번째 구역에는 보통 골뱅이 기호를 씁니다. 골뱅이는 입력된 문자 그 자체를 뜻해서, @\"님\"이라고 쓰면 홍길동이라고 입력했을 때 홍길동님으로 보입니다.\n구역을 두 개만 쓰면 앞은 양수와 0, 뒤는 음수 규칙이 됩니다.\n\n▸ @: 입력된 문자를 그대로 나타내는 기호.\n▸ 구역: 세미콜론으로 나뉜 각 부분."},{"sub":"엑셀 기본작업","q":"조건부 서식에서 여러 규칙이 동시에 만족될 때 적용 순서로 옳은 것은?","o":["규칙 관리자에서 위에 있는 규칙이 우선 적용된다","아래 규칙이 우선한다","무작위로 적용된다","모두 무시된다"],"a":0,"e":"조건부 서식 규칙 관리자에는 규칙들이 목록으로 쌓입니다. 위에 있을수록 우선순위가 높아 먼저 적용됩니다.\n화살표 단추로 순서를 올리고 내릴 수 있고, 조건 만족 시 중지 항목을 체크하면 그 규칙이 적용된 셀에는 아래 규칙을 검사하지 않습니다.\n서로 충돌하지 않는 서식이라면 여러 규칙이 겹쳐서 함께 적용되기도 합니다.\n\n▸ 규칙 관리자: 조건부 서식 규칙을 모아 관리하는 대화상자.\n▸ 조건 만족 시 중지: 이후 규칙 검사를 멈추게 하는 옵션."},{"sub":"엑셀 기본작업","q":"조건부 서식의 시각화 방식에 해당하지 않는 것은?","o":["데이터 막대","색조","아이콘 집합","스파크라인"],"a":3,"e":"조건부 서식에는 셀 안에 막대를 그리는 데이터 막대, 값 크기에 따라 색을 그라데이션으로 입히는 색조, 화살표나 신호등을 붙이는 아이콘 집합이 있습니다.\n스파크라인은 셀 안에 작은 차트를 그리는 별도 기능으로, 삽입 탭에 있습니다. 조건부 서식이 아닙니다.\n\n▸ 데이터 막대: 값의 크기를 셀 안 막대 길이로 표현.\n▸ 스파크라인: 한 셀에 들어가는 축소형 차트."},{"sub":"엑셀 기본작업","q":"모든 페이지에 표의 제목 행을 반복해서 인쇄하려면 어떤 설정을 사용하는가?","o":["인쇄 제목의 반복할 행","틀 고정","머리글 편집","페이지 나누기"],"a":0,"e":"틀 고정은 화면에서 스크롤할 때만 효과가 있고 인쇄물에는 영향을 주지 않습니다.\n인쇄할 때 매 페이지 위에 제목 행이 나오게 하려면 페이지 레이아웃 탭의 인쇄 제목에서 반복할 행에 $1:$1처럼 행을 지정해야 합니다. 왼쪽 열을 반복하려면 반복할 열에 지정합니다.\n\n▸ 인쇄 제목: 매 페이지마다 반복 출력할 행이나 열을 지정하는 기능.\n▸ 머리글: 페이지 맨 위 여백에 들어가는 문구. 표의 제목 행과는 다릅니다."},{"sub":"엑셀 기본작업","q":"한 페이지에 인쇄되도록 크기를 자동 조정하는 설정은?","o":["자동 맞춤(배율 조정)","페이지 나누기 미리보기","인쇄 영역 설정","눈금선 인쇄"],"a":0,"e":"페이지 설정의 배율에서 자동 맞춤을 쓰면 용지 너비와 높이에 맞게 축소해 인쇄합니다. 너비만 1페이지로 맞추고 높이는 자동으로 두는 설정이 실무에서 가장 많이 쓰입니다.\n페이지 나누기 미리보기는 어디서 페이지가 잘리는지 파란 선으로 보여주고 선을 끌어 조정하는 화면이며, 인쇄 영역 설정은 지정한 부분만 인쇄하도록 범위를 정하는 기능입니다.\n\n▸ 배율: 원래 크기 대비 인쇄 크기의 비율.\n▸ 인쇄 영역: 인쇄할 셀 범위를 한정하는 설정."},{"sub":"엑셀 기본작업","q":"셀에 입력한 값을 여러 줄로 나누어 표시하려 할 때 사용하는 단축키는?","o":["Alt+Enter","Ctrl+Enter","Shift+Enter","Ctrl+Shift+Enter"],"a":0,"e":"한 셀 안에서 줄을 바꾸려면 Alt를 누른 채 Enter를 칩니다.\n혼동하기 쉬운 것들이 있습니다. Ctrl+Enter는 선택한 여러 셀에 같은 값을 한꺼번에 입력하는 것이고, Shift+Enter는 위 셀로 이동, Ctrl+Shift+Enter는 배열 수식 입력입니다.\n셀 서식의 자동 줄 바꿈을 켜면 열 너비에 맞춰 자동으로 줄이 나뉩니다.\n\n▸ 자동 줄 바꿈: 열 너비에 맞춰 내용을 여러 줄로 표시하는 서식."},{"sub":"엑셀 기본작업","q":"외부 데이터를 가져온 뒤 원본이 바뀔 때 결과를 갱신하는 기능은?","o":["새로 고침","다시 계산","연결 끊기","되돌리기"],"a":0,"e":"CSV나 다른 통합 문서, 데이터베이스에서 데이터를 가져오면 엑셀은 그 원본과의 연결을 기억합니다.\n원본이 바뀌었을 때 데이터 탭의 새로 고침을 누르면 최신 내용을 다시 읽어옵니다. 연결 속성에서 파일을 열 때 자동으로 새로 고치도록 설정할 수도 있습니다.\n연결을 끊으면 그 시점의 값만 남고 이후에는 갱신되지 않습니다.\n\n▸ 쿼리 및 연결: 외부 데이터 연결 목록을 관리하는 창.\n▸ 연결 끊기: 원본과의 연결을 해제해 값만 남기는 것."},{"sub":"엑셀 분석작업","q":"피벗 테이블에서 여러 필드를 단추 형태로 눌러 걸러내는 기능은?","o":["슬라이서","필터 행","그룹화","계산 필드"],"a":0,"e":"슬라이서는 필터 조건을 큼직한 단추로 만들어 화면에 띄워주는 기능입니다. 목록을 열어 체크할 필요 없이 눌러서 바로 걸러집니다.\n날짜 전용으로는 시간 표시 막대가 있어 기간을 끌어서 선택할 수 있습니다. 슬라이서 하나를 여러 피벗 테이블에 연결하면 한 번의 조작으로 여러 표가 함께 걸러집니다.\n\n▸ 슬라이서: 시각적 필터 단추.\n▸ 보고서 연결: 슬라이서를 여러 피벗에 연동하는 설정."},{"sub":"엑셀 분석작업","q":"피벗 테이블에서 기존 필드들을 이용해 새로운 계산 항목을 만드는 기능은?","o":["계산 필드","그룹화","슬라이서","정렬"],"a":0,"e":"매출과 원가 필드가 있을 때 이익을 보고 싶다면 원본 표에 열을 추가하지 않고도 피벗 안에서 만들 수 있습니다.\n피벗 테이블 분석 탭의 필드, 항목 및 집합에서 계산 필드를 고르고 이름과 수식을 넣으면 됩니다. 예를 들어 매출 - 원가라고 쓰면 이익 필드가 생깁니다.\n주의할 점은 계산 필드가 합계된 값끼리 계산한다는 것입니다. 비율처럼 행마다 따로 계산해야 하는 항목은 결과가 달라질 수 있습니다.\n\n▸ 계산 필드: 피벗 안에서 수식으로 만든 새 필드.\n▸ 계산 항목: 같은 필드 안의 항목들끼리 계산해 만든 새 항목."},{"sub":"엑셀 분석작업","q":"목표를 만족하면서 여러 제약 조건을 동시에 고려해 최적해를 찾는 도구는?","o":["해 찾기","목표값 찾기","시나리오","데이터 표"],"a":0,"e":"목표값 찾기는 변수가 하나뿐이고 제약 조건도 없습니다. 해 찾기는 변수를 여러 개 두고 제약 조건을 걸 수 있습니다.\n예를 들어 예산은 1억 이하, 인원은 10명 이하라는 조건 아래 이익을 최대로 만드는 조합을 찾는 식입니다. 목표 설정을 최대, 최소, 특정 값 중에서 고를 수 있습니다.\n해 찾기는 기본으로 꺼져 있어 옵션의 추가 기능에서 켜야 데이터 탭에 나타납니다.\n\n▸ 제약 조건: 해가 반드시 만족해야 하는 조건.\n▸ 추가 기능: 필요할 때 켜서 쓰는 선택적 기능."},{"sub":"엑셀 분석작업","q":"부분합을 적용한 뒤 요약 결과만 보이게 하려면 사용하는 것은?","o":["윤곽 기호(1, 2, 3 단추)","필터","숨기기","그룹 해제"],"a":0,"e":"부분합을 실행하면 화면 왼쪽에 1, 2, 3 같은 숫자 단추와 세로줄이 생깁니다. 이것이 윤곽 기호입니다.\n1을 누르면 총합계만, 2를 누르면 그룹별 소계까지, 3을 누르면 모든 데이터가 보입니다. 요약본만 복사하려면 이 상태에서 이동 옵션의 화면에 보이는 셀만을 선택한 뒤 복사해야 숨겨진 행이 따라오지 않습니다.\n\n▸ 윤곽선: 데이터를 계층 구조로 접었다 펼 수 있게 하는 기능.\n▸ 화면에 보이는 셀만: 숨겨진 행을 제외하고 선택하는 옵션."},{"sub":"엑셀 분석작업","q":"데이터 통합에서 첫 행과 왼쪽 열을 레이블로 사용하도록 지정하는 이유는?","o":["항목 이름을 기준으로 같은 항목끼리 합치기 위해","서식을 유지하기 위해","정렬 순서를 맞추기 위해","인쇄 영역을 정하기 위해"],"a":0,"e":"통합은 여러 표를 하나로 합칩니다. 이때 표마다 항목 순서가 다를 수 있습니다. A지점은 사과, 배, 감 순이고 B지점은 배, 감, 사과 순일 수 있습니다.\n레이블 사용을 체크하지 않으면 위치만 보고 더해서 사과와 배가 뒤섞입니다. 체크하면 이름을 보고 같은 항목끼리 정확히 합칩니다.\n\n▸ 레이블: 표의 행 제목과 열 제목.\n▸ 위치 기준 통합: 이름을 무시하고 같은 자리끼리 더하는 방식."},{"sub":"엑셀 분석작업","q":"피벗 테이블의 값 표시 형식에서 총합계에 대한 비율을 보려면?","o":["총합계 비율로 설정한다","값 필드를 개수로 바꾼다","그룹화를 실행한다","슬라이서를 추가한다"],"a":0,"e":"값 필드 설정의 값 표시 형식 탭에서 계산 결과를 비중으로 바꿔 보여줄 수 있습니다.\n총합계 비율은 전체 대비 몇 퍼센트인지, 열 합계 비율은 그 열 안에서의 비중, 행 합계 비율은 그 행 안에서의 비중을 보여줍니다. 누계나 순위로 표시하는 옵션도 있습니다.\n원본 값은 그대로이고 보여주는 방식만 바뀌는 것입니다.\n\n▸ 값 표시 형식: 계산 결과를 어떤 방식으로 보여줄지 정하는 설정."},{"sub":"엑셀 기타작업","q":"모든 통합 문서에서 사용할 수 있도록 매크로를 저장하는 위치는?","o":["개인용 매크로 통합 문서","현재 통합 문서","새 통합 문서","추가 기능"],"a":0,"e":"매크로를 현재 통합 문서에 저장하면 그 파일에서만 쓸 수 있습니다.\n개인용 매크로 통합 문서에 저장하면 PERSONAL.XLSB라는 숨겨진 파일에 들어가 엑셀을 켤 때마다 자동으로 열립니다. 그래서 어떤 파일에서든 그 매크로를 쓸 수 있습니다.\n실기에서는 보통 현재 통합 문서에 저장합니다.\n\n▸ 통합 문서: 엑셀 파일 하나를 가리키는 말.\n▸ PERSONAL.XLSB: 개인용 매크로가 저장되는 숨김 파일."},{"sub":"엑셀 기타작업","q":"매크로 바로 가기 키를 지정할 때 대문자를 입력하면?","o":["Ctrl+Shift+해당 키가 된다","Alt+해당 키가 된다","지정할 수 없다","Ctrl+해당 키와 같다"],"a":0,"e":"매크로 기록 대화상자의 바로 가기 키 칸에 소문자를 넣으면 Ctrl과 그 키의 조합이 됩니다.\n대문자를 넣으면 Shift가 자동으로 끼어들어 Ctrl+Shift 조합이 됩니다. 엑셀이 이미 쓰는 단축키와 겹치지 않게 하려고 대문자를 쓰는 경우가 많습니다.\n지정한 키가 기존 기능과 겹치면 매크로가 우선합니다.\n\n▸ 바로 가기 키: 매크로를 실행하는 단축키."},{"sub":"엑셀 기타작업","q":"VBA 편집기를 여는 단축키는?","o":["Alt+F11","Ctrl+F11","F5","Alt+F8"],"a":0,"e":"Alt+F11을 누르면 VBA 편집기가 열립니다. 여기서 기록된 매크로 코드를 확인하고 고칠 수 있습니다.\n헷갈리기 쉬운 단축키가 몇 개 있습니다. Alt+F8은 매크로 목록 창을 열어 실행하는 것이고, VBA 편집기 안에서 F5는 현재 프로시저 실행, F8은 한 줄씩 실행하는 단계별 실행입니다.\n\n▸ VBE: Visual Basic Editor. VBA 코드를 작성하는 창.\n▸ 모듈: 코드를 담아두는 문서 단위."},{"sub":"엑셀 기타작업","q":"VBA에서 A1 셀에 값을 넣는 코드로 옳은 것은?","o":["Range(\"A1\").Value = 100","Cell(A1) = 100","A1.Value = 100","Set A1 = 100"],"a":0,"e":"VBA에서 셀을 가리키는 방법은 두 가지입니다.\nRange는 주소를 문자로 씁니다. Range(\"A1\")처럼 큰따옴표가 필요합니다. Cells는 행과 열을 숫자로 씁니다. Cells(1, 1)이 A1입니다. 반복문 안에서 숫자를 증가시키며 셀을 옮겨 다닐 때는 Cells가 편합니다.\n값을 넣을 때는 뒤에 .Value를 붙이고 등호로 대입합니다.\n\n▸ 개체: Range나 Worksheet처럼 조작 대상이 되는 것.\n▸ 속성: Value, Font처럼 개체가 가진 성질."},{"sub":"엑셀 기타작업","q":"VBA에서 지정한 횟수만큼 반복하는 구문은?","o":["For ... Next","If ... End If","Select Case","With ... End With"],"a":0,"e":"반복문에는 몇 가지가 있습니다.\nFor i = 1 To 10 ... Next 는 정해진 횟수만큼 돕니다. For Each는 컬렉션의 요소를 하나씩 훑습니다. Do While은 조건이 참인 동안 계속 돌고, Do Until은 조건이 참이 될 때까지 돕니다.\nIf와 Select Case는 반복이 아니라 조건 분기이고, With는 같은 개체의 속성을 여러 줄 설정할 때 반복 입력을 줄여주는 구문입니다.\n\n▸ 컬렉션: 같은 종류의 개체를 모아둔 묶음.\n▸ 무한 루프: 조건이 끝나지 않아 계속 도는 상태. Ctrl+Break로 중단합니다."},{"sub":"엑셀 기타작업","q":"VBA에서 사용자에게 값을 입력받는 함수는?","o":["MsgBox","InputBox","Print","Debug"],"a":1,"e":"MsgBox는 메시지를 보여주고 확인이나 취소 같은 선택을 받습니다. 값을 직접 받지는 못합니다.\nInputBox는 입력 칸이 있는 창을 띄워 사용자가 친 값을 받아옵니다. 받은 값은 변수에 담아 씁니다.\n주의할 점은 InputBox가 돌려주는 값이 문자라는 것입니다. 숫자로 계산하려면 Val이나 CInt로 바꿔야 합니다.\n\n▸ 변수: 값을 담아두는 이름 붙은 그릇.\n▸ 형 변환: 문자를 숫자로 바꾸는 것처럼 데이터 종류를 바꾸는 것."},{"sub":"엑셀 기타작업","q":"폼을 화면에 표시하는 VBA 코드로 옳은 것은?","o":["UserForm1.Show","UserForm1.Open","Show UserForm1","Load Form1.Display"],"a":0,"e":"VBA 폼은 개체 이름 뒤에 Show 메서드를 붙여 띄웁니다. 닫을 때는 Unload를 씁니다.\n폼 자신의 코드 안에서 자기를 닫을 때는 Unload Me라고 씁니다. Me는 지금 이 폼을 가리키는 말입니다. Hide는 화면에서 감추기만 하고 메모리에는 남겨둡니다.\n\n▸ 메서드: 개체에게 시키는 동작. Show, Hide, Unload 등.\n▸ Me: 현재 코드가 속한 개체 자신을 가리키는 키워드."},{"sub":"엑셀 기타작업","q":"차트에서 값의 흐름을 나타내는 선을 추가해 앞으로의 방향을 보여주는 요소는?","o":["추세선","오차 막대","데이터 레이블","축 제목"],"a":0,"e":"추세선은 데이터 점들의 흐름을 대표하는 선을 그어 전체 방향을 보여줍니다. 선형, 지수, 다항식 등 종류를 고를 수 있고 앞뒤로 예측 구간을 늘려 그릴 수도 있습니다.\n수식과 R 제곱 값을 차트에 표시하는 옵션도 있습니다. R 제곱은 그 추세선이 데이터를 얼마나 잘 설명하는지를 0과 1 사이 값으로 나타냅니다.\n주의할 점은 원형 차트에는 추세선을 넣을 수 없다는 것입니다.\n\n▸ 오차 막대: 값의 오차 범위를 위아래로 표시한 선.\n▸ R 제곱: 설명력을 나타내는 값. 1에 가까울수록 잘 맞습니다."},{"sub":"엑셀 기타작업","q":"차트의 세로 축 눈금 범위를 직접 지정하려면?","o":["축 서식에서 최소값과 최대값을 설정한다","차트 제목을 수정한다","범례 위치를 바꾼다","데이터 레이블을 추가한다"],"a":0,"e":"엑셀은 값에 맞춰 축 범위를 자동으로 정합니다. 그런데 값들이 비슷비슷하면 차이가 잘 안 보이거나, 반대로 0부터 시작해 변화가 작아 보이는 경우가 있습니다.\n축을 우클릭해 축 서식을 열고 경계의 최소와 최대를 직접 입력하면 원하는 범위로 고정됩니다. 단위에서 눈금 간격도 정할 수 있습니다.\n다만 최소값을 0이 아닌 값으로 올리면 차이가 과장되어 보이므로 주의가 필요합니다.\n\n▸ 주 단위: 눈금선이 그려지는 간격.\n▸ 경계: 축이 시작하고 끝나는 값."},{"sub":"엑셀 기타작업","q":"차트에 각 데이터 값을 숫자로 직접 표시하는 요소는?","o":["데이터 레이블","범례","눈금선","축 제목"],"a":0,"e":"데이터 레이블은 막대나 점 위에 그 값을 숫자로 붙여줍니다. 값 대신 항목 이름이나 계열 이름, 백분율을 표시하도록 고를 수도 있습니다.\n원형 차트에서는 백분율과 항목 이름을 함께 표시하는 경우가 많고, 이때 범례를 빼기도 합니다.\n표시 위치도 안쪽 끝, 바깥쪽 끝, 가운데 중에서 고를 수 있습니다.\n\n▸ 범례: 계열의 색과 이름을 알려주는 안내.\n▸ 눈금선: 값을 읽기 쉽게 그어둔 가로세로 선."}]}];
