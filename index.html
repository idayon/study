\n보험사가 평균 위험으로 보험료 매김\n→ 건강한 사람은 \"비싸네\" 하고 나감\n→ 아픈 사람만 남음\n→ 보험료 또 올림\n→ 또 나감... **무한 악순환**\n\n> 🚨 끝까지 가면 시장 자체가 붕괴함. 이게 **레몬시장**임.\n> **감춰진 특성**의 문제.\n\n### 도덕적 해이 = 계약 **후**\n> 보험 들었으니 **조심을 안 함.**\n\n화재보험 들었으니 소화기 점검 안 함. 고의로 불 지르는 건 보험사기고 이건 그냥 방심임.\n> **감춰진 행동**의 문제.\n\n> 🚨 구분법 딱 하나. **계약 전이냐 후냐.** 이거면 끝.\n\n## 대응 수단 ⭐\n### 역선택 대응 (걸러내기)\n- **언더라이팅(계약심사)** ← 핵심\n- 고지의무\n- 위험집단별 요율 차등\n- 단체보험, 강제가입\n\n### 도덕적 해이 대응 (조심하게 만들기)\n- **자기부담금(공제)** ← 핵심\n- 공동보험조항\n- 보상한도\n- 사고 이력 따라 요율 조정\n\n> 🚨 성격이 다름.\n> 역선택 → **누구를 받을지 가려내기**\n> 도덕적 해이 → **가입 후에도 조심하게 만들기**\n> 대응책 짝 바꿔서 냄.\n\n## 무보에 어떻게 적용되냐 (논술 소재)\n수출기업이 부실한 바이어랑 거래하면서 \"어차피 보험 있으니까\" 하는 게 도덕적 해이임.\n\n> 그래서 무보는\n> - **해외 수입자 신용조사** → 역선택 대응 (언더라이팅)\n> - 신용등급별 인수한도·요율 차등 → 역선택 대응\n> - **부보율** (손실 일부는 수출기업이 부담) → 도덕적 해이 대응\n>\n> 이 구조를 논술에 쓰면 좋음. \"무역보험이 정보 비대칭을 어떻게 관리하는가\"로 한 편 나옴.\n\n▸ 부보율: 손실 중 보험이 보상하는 비율."},{"sub":"보험학","title":"④ 보험료 산정과 재보험","body":"## 보험료의 구성\n> **영업보험료 = 순보험료 + 부가보험료**\n\n- **순보험료**: 보험금 지급 재원. 위험보험료 + 저축보험료\n- **부가보험료**: 사업비 재원. 신계약비, 유지비, 수금비\n\n> 같은 보장인데 온라인 보험이 싼 이유가 여기 있습니다. 설계사 수당이 없어 부가보험료가 작습니다.\n\n## 3이원 방식\n보험료 계산에 쓰이는 세 가지 가정입니다.\n- **예정위험률(예정사망률)**: 사고가 날 확률\n- **예정이율**: 받은 보험료를 굴려 얻을 것으로 보는 수익률\n- **예정사업비율**: 사업비로 쓸 비율\n\n> 방향이 중요합니다. **예정이율이 높을수록 보험료가 싸집니다.** 굴려서 벌 돈이 많으니 덜 받아도 되기 때문입니다.\n> 예정위험률과 예정사업비율은 높을수록 보험료가 비싸집니다.\n\n## 3이원 차익\n실제와 가정의 차이에서 생기는 손익입니다.\n- **사차익**: 실제 사고가 예상보다 적어서 생긴 이익\n- **이차익**: 실제 운용수익이 예정이율보다 높아서\n- **비차익**: 실제 사업비가 예정보다 적어서\n\n## 보험요율 산정의 원칙\n- **적정성**: 보험사가 유지될 수 있을 것\n- **공정성**: 위험에 상응할 것\n- **비과도성**: 지나치게 비싸지 않을 것\n\n> 셋이 서로 긴장 관계입니다. 공정하게 위험별로 차등하면 고위험자가 감당 못 하고, 비과도하게 낮추면 적정성이 깨집니다.\n\n## 재보험\n보험사가 인수한 위험을 다시 다른 보험사에 넘기는 것입니다.\n> 보험사도 큰 사고를 한 번에 맞으면 망합니다. 재보험은 **보험사의 보험**입니다.\n\n### 기능\n- 위험 분산과 인수 능력 확대\n- 대형 위험의 인수 가능\n- 실적 안정화\n- 신설 보험사의 사업 지원\n\n### 방식\n- **비례적 재보험**: 보험금액을 일정 비율로 나눔 (비례재보험, 초과액재보험)\n- **비비례적 재보험**: 손해액 기준으로 일정 금액을 넘는 부분만 부담 (초과손해액재보험, 초과손해율재보험)\n\n> 무역보험은 국가가 운영하지만 일부 위험은 국제 재보험 시장에 출재하기도 합니다. 국가 재정 부담을 줄이는 수단입니다.\n\n▸ 출재: 위험을 다른 보험사에 넘기는 것. 받는 쪽은 수재.\n▸ 예정이율: 보험료를 굴려 얻을 것으로 가정한 수익률.\n▸ 사차익: 예상보다 사고가 적어 생긴 이익.","alt":"## 보험료 구성 ⭐\n> **영업보험료 = 순보험료 + 부가보험료**\n- **순보험료**: 나중에 보험금으로 나갈 돈\n- **부가보험료**: 설계사 수당, 사무실 운영비\n\n> 🚨 온라인 보험이 싼 이유가 이거임. **설계사 수당이 없어서 부가보험료가 작음.**\n> 보장은 똑같은데 값이 다른 게 이 차이임.\n\n## 3이원 방식 ⭐⭐\n보험료 계산에 쓰는 3가지 가정.\n- **예정위험률**: 사고 날 확률\n- **예정이율**: 받은 돈 굴려서 벌 수익률\n- **예정사업비율**: 운영비 비율\n\n> 🚨 방향이 시험 포인트임\n> **예정이율 ↑ → 보험료 ↓** (굴려서 벌 게 많으니 덜 받아도 됨)\n> 예정위험률 ↑ → 보험료 ↑\n> 예정사업비율 ↑ → 보험료 ↑\n>\n> 예정이율만 방향이 반대임. 이거 뒤집어서 냄.\n\n## 3이원 차익\n- **사차익**: 사고가 예상보다 적어서\n- **이차익**: 운용수익이 예정이율보다 높아서\n- **비차익**: 사업비가 예상보다 적어서\n\n## 요율 산정 3원칙\n**적정성 / 공정성 / 비과도성**\n> 🚨 셋이 서로 싸움.\n> 공정하게 하면 고위험자가 감당 못 함. 싸게 하면 보험사가 망함.\n> 이 긴장 관계를 논술에 쓸 수 있음.\n\n## 재보험 = 보험사의 보험 ⭐\n보험사도 대형 사고 한 방 맞으면 망함. 그래서 자기가 받은 위험을 또 넘김.\n\n### 기능\n위험 분산 / **인수 능력 확대** / 대형 위험 인수 가능 / 실적 안정화 / 신설사 지원\n\n### 방식 2종\n- **비례적**: 보험금액을 **비율로** 나눔\n- **비비례적**: 손해액이 **일정 금액 넘는 부분만** 부담\n\n> 🚨 비율로 나누냐, 초과분만 받냐. 이걸로 구분.\n\n> 무역보험도 일부 위험은 국제 재보험 시장에 넘김. 국가 재정 부담 줄이는 수단. 논술에 쓸 수 있음.\n\n▸ 출재: 위험 넘기기. 받는 건 수재."},{"sub":"보험학","title":"⑤ 무역보험 (핵심)","body":"## 무역보험이 왜 필요한가\n수출은 대금 회수까지 시간이 걸리고 상대가 외국에 있습니다. 여기서 두 종류의 위험이 생깁니다.\n\n> **신용위험**: 수입자가 파산하거나 대금을 안 주는 위험\n> **비상위험(정치적 위험)**: 수입국의 전쟁, 내란, 외환 통제, 송금 금지처럼 **당사자 잘못이 아닌** 국가 차원의 위험\n\n민영보험은 비상위험을 감당하기 어렵습니다. 손실이 거대하고 한 번에 몰려서 터지기 때문입니다.\n> 그래서 **국가가 운영**합니다. 무역보험공사가 정부 기관인 근본 이유입니다.\n\n## 무역보험의 기능\n- **위험 담보**: 수출대금 미회수 위험을 덮어줌\n- **금융 보완**: 보험에 들면 은행이 수출기업에 대출해줍니다. 보험증권이 담보 역할을 합니다\n- **수출 진흥**: 위험한 신흥시장에도 진출할 수 있게 함\n- 해외 신용정보 제공\n\n> **금융 보완 기능이 논술 핵심**입니다. 무역보험은 단순한 보상 제도가 아니라 **수출금융을 가능하게 만드는 인프라**입니다.\n\n## 주요 제도\n### 단기수출보험\n결제기간 2년 이내 수출 계약에서 대금을 못 받을 위험을 담보합니다. 가장 기본적인 제도입니다.\n\n### 중장기수출보험\n플랜트, 선박처럼 결제기간이 2년을 넘는 대형 거래를 담보합니다.\n\n### 수출신용보증\n중소기업이 은행에서 수출 관련 자금을 빌릴 때 공사가 보증을 섭니다. 담보가 부족한 중소기업의 자금조달을 돕습니다.\n\n### 환변동보험\n> 환율 변동으로 생기는 손실을 보상하고, 반대로 이익이 나면 환수합니다.\n> 수출기업이 환율을 신경 쓰지 않고 영업에 집중하게 하는 것이 목적입니다. **이익 환수가 있다는 점**이 특징입니다.\n\n### 수입보험\n원자재나 시설재 수입을 위해 선급금을 보냈는데 물건이 안 오는 위험, 또는 수입자금 대출 위험을 담보합니다.\n\n### 해외투자보험\n우리 기업이 해외에 투자했다가 수용, 전쟁, 송금 제한 등으로 손실을 입을 때 보상합니다.\n\n## 무역보험의 특징\n- **정책보험**: 이윤이 목적이 아니라 수출 진흥이 목적\n- 기금으로 운영되며 국가가 최종 책임\n- **부보율**: 손실의 전부가 아니라 일정 비율만 보상해 도덕적 해이를 억제\n\n▸ 비상위험: 국가 차원의 사유로 생기는 위험. 정치적 위험이라고도 합니다.\n▸ 부보율: 손실 중 보상되는 비율. 보통 90~100% 수준입니다.\n▸ 정책보험: 국가 정책 목적으로 운영하는 보험.","alt":"## 무역보험이 왜 필요함\n수출은 **돈 받기까지 오래 걸리고 상대가 외국**에 있음. 위험 두 종류가 생김.\n\n> 🚨 **신용위험**: 수입자가 망하거나 돈을 안 줌 (상대방 문제)\n> **비상위험(정치적 위험)**: 전쟁, 내란, **외환통제, 송금금지** (국가 문제)\n\n> 비상위험이 핵심임. 수입자는 멀쩡히 돈을 보내려는데 **그 나라 정부가 송금을 막아버리는** 상황.\n> 이건 아무도 잘못한 게 없는데 돈을 못 받음.\n\n민영보험은 이걸 못 함. **한 나라가 무너지면 그 나라 거래가 한꺼번에 다 터짐.** 감당이 안 됨.\n> 그래서 **국가가 함.** 무보가 왜 공기업인지 = 여기가 답임. 논술에 무조건 쓸 내용.\n\n## 기능 4개 ⭐\n- 위험 담보\n- **금융 보완** ← 이게 제일 중요\n- 수출 진흥\n- 해외 신용정보 제공\n\n> 🚨 **금융 보완**이 논술 핵심임.\n> 중소기업이 수출 계약 땄는데 은행이 대출을 안 해줌. 돈 떼일지 모르니까.\n> → 무역보험 가입 → 보험증권이 담보가 됨 → **은행이 대출해줌**\n>\n> 즉 무역보험은 보상만 하는 게 아니라 **수출금융 자체를 가능하게 만드는 인프라**임.\n> \"무역보험의 역할을 서술하시오\" 나오면 이 문단이 답의 절반임.\n\n## 주요 제도 ⭐\n- **단기수출보험**: 결제기간 **2년 이내**. 제일 기본\n- **중장기수출보험**: **2년 초과**. 플랜트, 선박\n- **수출신용보증**: 중소기업 은행 대출에 **공사가 보증**\n- **환변동보험** ⭐\n- **수입보험**: 선급금 보냈는데 물건 안 오는 위험\n- **해외투자보험**: 해외 투자했다가 수용·전쟁으로 날림\n\n> 🚨 **환변동보험**이 특이함\n> 환율 때문에 손해 나면 **보상해주는데, 이익 나면 환수함.**\n> 즉 환율을 아예 고정시켜주는 거임. 기업은 환율 신경 안 쓰고 영업만 하라는 취지.\n> **이익 환수가 있다는 점**이 시험 포인트임. \"손실만 보상한다\" → 오답.\n\n## 특징\n- **정책보험**: 돈 벌려고 하는 게 아니라 **수출 진흥**이 목적\n- 기금 운영, **국가가 최종 책임**\n- **부보율**: 100% 안 해줌. 일부는 기업이 부담 → 도덕적 해이 억제\n\n▸ 비상위험 = 정치적 위험. 같은 말임."},{"sub":"보험학","title":"⑥ 금융 보완 기능 (논술 필수)","body":"## 먼저 장면 하나로 이해하세요\n\n부산의 중소기업 A사가 미국 바이어로부터 **100만 달러 수출 계약**을 따냈습니다. 좋은 일입니다. 그런데 문제가 생깁니다.\n\n물건을 만들려면 **원자재를 먼저 사야 합니다.** 그런데 대금은 물건을 보내고 3개월 뒤에나 들어옵니다. 지금 당장 쓸 돈이 없습니다.\n\nA사는 은행에 갑니다. \"수출 계약 땄으니 돈 좀 빌려주세요.\"\n은행이 묻습니다. **\"담보 있으세요?\"**\n\nA사는 공장도 임대이고 내놓을 담보가 없습니다. 은행 입장에서는 이렇습니다.\n> 미국 바이어가 돈을 안 주면? 물건 보내고 대금을 못 받으면? 그럼 A사는 우리 대출을 못 갚는다. 그 위험을 우리가 왜 져야 하나.\n\n**은행이 거절합니다. 계약을 따고도 수출을 못 합니다.**\n\n## 여기서 무역보험이 들어옵니다\n\nA사가 무역보험공사의 **단기수출보험**에 가입합니다. 바이어가 대금을 안 주면 공사가 보상해줍니다.\n\n그러면 은행의 계산이 달라집니다.\n> 바이어가 돈을 안 줘도 공사가 보상한다. 그 보험금을 우리가 받도록 해두면 우리 대출은 안전하다.\n\n**은행이 대출을 해줍니다.** A사는 원자재를 사고 물건을 만들어 수출합니다.\n\n## 이것이 금융 보완 기능입니다\n\n> **무역보험은 사고가 났을 때 돈을 주는 제도에 그치지 않습니다.**\n> **보험증권이 담보 역할을 해서, 담보가 없는 기업도 수출자금을 빌릴 수 있게 만듭니다.**\n\n즉 무역보험은 **보상 제도이자 동시에 금융 인프라**입니다. 논술에서 이 두 겹을 구분해 쓰면 깊이가 달라집니다.\n\n## 왜 이 기능이 중요한가\n\n중소기업에게 진짜 장벽은 위험이 아니라 **돈입니다.**\n- 대기업은 신용이 좋아 은행이 알아서 빌려줍니다\n- 중소기업은 계약을 따도 자금이 없어 포기합니다\n\n무역보험이 없으면 **수출은 담보가 있는 기업만 할 수 있는 일**이 됩니다. 무역보험은 그 문턱을 낮춰 중소기업도 수출 시장에 들어올 수 있게 합니다.\n\n## 금융 보완을 직접 담당하는 제도\n\n### 수출신용보증\n공사가 아예 **은행 대출의 보증**을 섭니다. 보험보다 한 발 더 나간 형태로, 담보 부족을 직접 메웁니다.\n- 선적 전: 물건을 만들 자금을 빌릴 때\n- 선적 후: 대금 회수 전에 수출채권을 담보로 자금을 융통할 때\n\n### 단기수출보험\n보험금 청구권을 은행에 넘기는 방식으로 담보 역할을 합니다.\n\n## 논술에 쓸 문장\n\n> 무역보험은 위험을 담보하는 데 그치지 않고, 보험증권이 담보로 기능함으로써 신용이 부족한 중소기업의 수출자금 조달을 가능하게 한다. 이 점에서 무역보험은 보상 제도를 넘어 수출금융의 기반 인프라로 작동한다.\n\n이 두 문장만 외워 두셔도 한 문단이 채워집니다.\n\n▸ 금융 보완: 보험이 신용을 보강해 자금 조달을 가능하게 하는 기능.\n▸ 수출신용보증: 공사가 은행 대출에 보증을 서는 제도.\n▸ 보험금 청구권 양도: 보험금을 받을 권리를 은행에 넘겨 담보로 삼는 것.","alt":"## 장면으로 이해하셈\n\n부산 중소기업 A사가 미국 바이어한테 **100만 달러 수출 계약** 땄음. 개꿀?\n\n근데 문제 생김.\n> 물건 만들려면 **원자재부터 사야 함.** 근데 돈은 물건 보내고 3개월 뒤에 들어옴.\n> 지금 당장 쓸 돈이 없음.\n\n은행 감. \"계약 땄어요, 돈 좀 빌려주세요.\"\n은행: **\"담보 있으세요?\"**\n\nA사는 공장도 월세임. 담보 없음.\n\n은행 속마음:\n> 미국 바이어가 돈 안 주면? 그럼 얘는 우리 돈 못 갚음. 그 위험을 우리가 왜 짊어짐?\n\n**거절당함. 계약 따고도 수출 못 함.** 😭\n\n## 여기서 무역보험이 등장\n\nA사가 **단기수출보험** 가입함. 바이어가 돈 안 주면 공사가 대신 물어줌.\n\n그럼 은행 계산이 바뀜.\n> 바이어가 떼먹어도 **공사가 보상함.** 그 보험금 우리가 받게 해두면 우리 돈은 안전함.\n\n**은행이 대출해줌.** → A사 원자재 사고 → 물건 만들고 → 수출 성공.\n\n## 이게 금융 보완 기능임 ⭐\n\n> 🚨 **무역보험 = 사고 나면 돈 주는 제도, 로 끝이 아님.**\n> **보험증권이 담보 역할을 해서, 담보 없는 기업도 돈을 빌릴 수 있게 만듦.**\n\n즉 무역보험은 **보상 제도 + 금융 인프라** 두 겹임.\n논술에서 이 두 겹을 구분해서 쓰면 확 달라짐. 대부분 앞의 한 겹만 쓰거든.\n\n## 왜 중요하냐\n\n> 🚨 중소기업의 진짜 장벽은 **위험이 아니라 돈**임.\n> 대기업은 신용 좋아서 은행이 알아서 빌려줌.\n> 중소기업은 계약 따고도 돈이 없어서 포기함.\n\n무역보험 없으면 **수출 = 담보 있는 기업만 하는 일**이 됨.\n무역보험이 그 문턱을 낮춰서 중소기업도 수출판에 들어오게 함.\n\n## 금융 보완 담당 제도 2개\n\n### 수출신용보증 ⭐\n공사가 아예 **은행 대출 보증**을 섬. 보험보다 한 발 더 나간 거임.\n- **선적 전**: 물건 만들 돈 빌릴 때\n- **선적 후**: 대금 들어오기 전에 채권 담보로 돈 융통할 때\n\n### 단기수출보험\n보험금 청구권을 은행에 넘겨서 담보로 씀.\n\n## 논술용 문장 (이거 외우셈) ⭐\n\n> **\"무역보험은 위험을 담보하는 데 그치지 않고, 보험증권이 담보로 기능함으로써 신용이 부족한 중소기업의 수출자금 조달을 가능하게 한다. 이 점에서 무역보험은 보상 제도를 넘어 수출금융의 기반 인프라로 작동한다.\"**\n\n이 두 문장만 외워도 **한 문단이 통째로 채워짐.** 아까 못 쓰신 그 부분임.\n\n▸ 금융 보완: 보험이 신용을 보강해서 돈 빌릴 수 있게 하는 기능.\n▸ 보험금 청구권 양도: 보험금 받을 권리를 은행한테 넘겨 담보로 쓰는 것."},{"sub":"국제금융론","title":"① 환율의 기초","body":"## 환율 표시\n우리나라는 **자국통화표시법**을 씁니다. 1달러 = 1,300원처럼 씁니다.\n> **환율 상승 = 원화 가치 하락 = 절하**\n> 숫자가 커지는데 가치는 떨어집니다. 이 방향을 반대로 잡으면 관련 문제를 전부 틀립니다.\n\n## 환율 변동의 효과\n| | 환율 상승(원화 약세) | 환율 하락(원화 강세) |\n|---|---|---|\n| 수출 | 증가 | 감소 |\n| 수입 | 감소 | 증가 |\n| 경상수지 | 개선 | 악화 |\n| 국내 물가 | 상승 압력 | 하락 압력 |\n| 외화부채 부담 | 증가 | 감소 |\n\n> 수출기업은 환율 상승이 유리하고, 원자재를 수입하는 기업과 외화 빚이 있는 기업은 불리합니다.\n\n## J커브 효과\n환율이 올라도 경상수지가 **처음에는 오히려 나빠졌다가** 나중에 개선됩니다.\n> 계약이 이미 되어 있어 물량은 당장 안 변하는데 가격만 먼저 반영되기 때문입니다. 시간이 지나 물량이 조정되면 개선됩니다.\n\n## 마셜-러너 조건\n환율 상승이 경상수지를 개선하려면 **수출수요탄력성 + 수입수요탄력성 > 1**이어야 합니다.\n> 탄력성이 작으면 가격만 나빠지고 물량이 안 늘어 오히려 악화됩니다.\n\n## 환율제도\n- **고정환율제**: 환율을 일정 수준에 묶어둠. 안정적이지만 통화정책의 독립성을 잃음\n- **변동환율제**: 시장에서 결정. 통화정책이 자유롭지만 변동성이 큼\n- 관리변동환율제: 기본은 변동이되 급변 시 개입\n\n## 삼불원칙(트릴레마)\n> **자유로운 자본이동 / 고정환율 / 독자적 통화정책**\n> 이 셋 중 **동시에 두 가지까지만** 가질 수 있습니다.\n\n자본이 자유롭게 드나드는데 환율을 고정하려면, 금리를 상대국에 맞춰야 하므로 통화정책을 포기해야 합니다.\n\n## 먼델-플레밍 모형\n자본이동이 자유로운 개방경제에서 정책 효과가 환율제도에 따라 뒤바뀝니다.\n> **변동환율제: 통화정책 유효, 재정정책 무력**\n> **고정환율제: 재정정책 유효, 통화정책 무력**\n\n▸ 절하: 자국 통화 가치가 떨어지는 것.\n▸ 경상수지: 상품·서비스·본원소득·이전소득 수지의 합.\n▸ 자본이동: 국경을 넘는 투자자금의 이동.","alt":"## 환율 방향부터 ⭐\n1달러 = 1300원 (자국통화표시법)\n> 🚨 **환율 상승 = 원화 가치 하락**\n> 숫자는 올라가는데 가치는 떨어짐. 1300원 주던 걸 1400원 줘야 하니 원화가 싸진 거임.\n> 이거 반대로 잡으면 관련 문제 전부 틀림.\n\n## 환율 오르면 (원화 약세)\n수출 **↑** / 수입 **↓** / 경상수지 개선 / 국내물가 **↑** / 외화빚 부담 **↑**\n\n> 수출기업은 좋고, 원자재 수입기업이랑 달러 빚 있는 기업은 죽음.\n\n## J커브 ⭐\n> 🚨 환율 올랐는데 경상수지가 **처음엔 더 나빠짐.** 나중에 좋아짐.\n> 계약은 이미 되어 있어서 물량은 그대론데 **가격만 먼저** 반영되니까.\n> 그래프가 J자라서 J커브.\n\n## 마셜-러너 조건\n> 환율 올려서 경상수지 개선되려면 **수출탄력성 + 수입탄력성 > 1**\n> 탄력성이 작으면 물량은 안 늘고 가격만 나빠져서 **오히려 악화**됨.\n\n## 환율제도\n- **고정**: 안정적. 근데 **통화정책 독립성 잃음**\n- **변동**: 통화정책 자유. 근데 변동성 큼\n- 관리변동: 기본은 변동, 급변하면 개입\n\n## 삼불원칙(트릴레마) ⭐\n> **자본이동 자유 / 고정환율 / 독자적 통화정책**\n> 셋 중 **두 개까지만.**\n\n> 🚨 왜 셋 다 안 되냐\n> 자본이 자유롭게 드나드는데 환율을 고정하려면? 우리 금리를 미국에 맞춰야 함.\n> 우리가 금리 내리면 돈이 미국으로 빠져나가서 환율이 튐. 고정하려면 못 내림.\n> → **통화정책을 포기하는 것.** 그래서 셋 다는 불가능함.\n\n## 먼델-플레밍 ⭐\n> **변동환율제 → 통화정책 유효 / 재정정책 무력**\n> **고정환율제 → 재정정책 유효 / 통화정책 무력**\n> 정반대임. 그냥 외우셈.\n\n▸ 절하: 내 돈 가치 떨어짐."},{"sub":"국제금융론","title":"② 환율 결정이론","body":"## 구매력평가설 (PPP)\n**일물일가의 법칙**에서 출발합니다. 같은 물건은 어디서나 같은 값이어야 합니다.\n> 그렇다면 환율은 **양국 물가수준의 비율**로 결정됩니다.\n\n- **절대적 PPP**: 환율 = 자국 물가 ÷ 외국 물가\n- **상대적 PPP**: 환율 변화율 = 자국 물가상승률 − 외국 물가상승률\n\n> 물가가 더 많이 오르는 나라의 통화는 가치가 떨어집니다. 돈의 값어치가 떨어졌으니 당연합니다.\n> **빅맥지수**가 이 이론의 응용입니다.\n\n한계는 분명합니다. 운송비, 관세, 비교역재(부동산, 이발) 때문에 현실에서는 잘 안 맞습니다.\n> 그래서 PPP는 **장기** 설명에 적합합니다.\n\n## 이자율평가설 (IRP)\n자금은 수익률이 높은 곳으로 움직입니다. 그런데 환율 변동을 고려하면 결국 수익률이 같아집니다.\n> **자국 이자율 = 외국 이자율 + 예상 환율 변동률**\n\n- **유위험 이자율평가**: 예상 환율을 기준으로\n- **무위험 이자율평가(CIP)**: 선물환율로 환위험을 제거한 상태에서. 선물환율과 현물환율의 차이가 양국 금리차와 같아야 합니다\n\n> 어긋나면 **차익거래**가 발생해 다시 균형으로 돌아갑니다.\n> IRP는 **단기** 설명에 적합합니다.\n\n## 국제피셔효과\n> 명목이자율이 높은 나라의 통화는 그만큼 절하됩니다.\n\n피셔 방정식(명목 = 실질 + 기대인플레이션)과 PPP를 결합한 결과입니다. 이자율이 높다는 것은 인플레이션 기대가 높다는 뜻이고, 인플레이션이 높으면 통화가 절하되기 때문입니다.\n\n> 그래서 **고금리 통화에 투자하면 이자는 더 받지만 환차손으로 상쇄**된다는 결론이 나옵니다. 현실에서는 이 관계가 자주 깨지고, 그 틈을 노리는 것이 **캐리 트레이드**입니다.\n\n## 정리\n| 이론 | 결정 요인 | 적합한 시계 |\n|---|---|---|\n| 구매력평가설 | 물가 비율 | 장기 |\n| 이자율평가설 | 이자율 차이 | 단기 |\n| 국제피셔효과 | 명목금리 차이 | 중장기 |\n\n▸ 비교역재: 국경을 넘어 거래하기 어려운 재화나 서비스.\n▸ 캐리 트레이드: 저금리 통화로 빌려 고금리 통화에 투자하는 거래.\n▸ 선물환율: 미래 특정 시점에 적용하기로 미리 정한 환율.","alt":"## 구매력평가설(PPP) ⭐\n**일물일가의 법칙**: 같은 물건은 어디서나 같은 값이어야 함.\n> 그럼 환율 = **양국 물가 비율**로 결정됨.\n\n- 절대적 PPP: 환율 = 자국물가 ÷ 외국물가\n- 상대적 PPP: 환율변화율 = 자국물가상승률 − 외국물가상승률\n\n> 🚨 물가 많이 오르는 나라 돈은 가치가 떨어짐. 돈값이 떨어진 거니까 당연함.\n> **빅맥지수**가 이거 응용임. 빅맥 값 비교해서 환율이 적정한지 봄.\n\n한계: 운송비, 관세, **비교역재**(부동산, 이발) 때문에 현실에선 잘 안 맞음.\n> 그래서 PPP는 **장기용**임.\n\n## 이자율평가설(IRP)\n돈은 수익 높은 데로 감. 근데 환율 변동까지 따지면 결국 같아짐.\n> **자국금리 = 외국금리 + 예상 환율변동률**\n\n- 유위험: 예상 환율 기준\n- **무위험(CIP)**: 선물환으로 환위험 제거. **선물환율-현물환율 차이 = 양국 금리차**\n\n> 어긋나면 **차익거래** 들어와서 다시 맞춰짐.\n> IRP는 **단기용**임.\n\n## 국제피셔효과\n> **금리 높은 나라 통화는 그만큼 절하됨.**\n\n> 🚨 논리: 금리 높다 = 인플레 기대가 높다 = 그 돈 가치가 떨어질 거다 → 절하\n>\n> 결론이 중요함. **고금리 통화에 투자하면 이자는 더 받는데 환차손으로 상쇄됨.**\n> 즉 공짜 점심은 없다는 얘기.\n> 근데 현실에선 자주 깨짐. 그 틈 노리는 게 **캐리 트레이드**임. 엔화 싸게 빌려서 고금리 통화에 넣는 거.\n\n## 정리표 ⭐\n| 이론 | 결정 요인 | 시계 |\n|---|---|---|\n| **구매력평가설** | **물가** | **장기** |\n| **이자율평가설** | **이자율** | **단기** |\n| 국제피셔효과 | 명목금리 | 중장기 |\n\n> 🚨 물가면 PPP·장기, 이자율이면 IRP·단기. 이 짝만 외우면 됨.\n\n▸ 비교역재: 국경 넘겨 거래 못 하는 것. 부동산, 이발."},{"sub":"국제금융론","title":"③ 환위험과 관리기법","body":"## 환위험의 세 종류\n- **거래위험(Transaction)**: 이미 발생한 외화 채권·채무의 결제 금액이 환율 변동으로 달라지는 위험. 가장 직접적\n- **환산위험(Translation)**: 해외 자회사 재무제표를 자국 통화로 환산할 때 생기는 회계상 위험. 실제 현금흐름과는 무관\n- **경제적위험(Economic)**: 환율 변동이 미래 매출과 경쟁력에 미치는 장기적 영향. 가장 포괄적이고 측정이 어려움\n\n> 셋의 구분이 시험에 나옵니다. **거래는 이미 확정된 것, 환산은 장부상, 경제적은 미래 경쟁력**입니다.\n\n## 내부적 관리기법\n회사 안에서 처리하는 방법입니다.\n- **매칭(Matching)**: 외화 수입과 지출의 통화·시기를 맞춰 상쇄\n- **네팅(Netting)**: 계열사 간 채권채무를 상계하고 차액만 결제\n- **리딩과 래깅(Leading & Lagging)**: 결제 시기를 앞당기거나 늦춤\n> 환율 상승이 예상되면 외화 수취는 늦추고(래깅) 외화 지급은 앞당깁니다(리딩).\n- **통화 다변화**: 여러 통화로 분산\n- **결제통화 조정**: 자국 통화로 결제하도록 계약\n\n## 외부적 관리기법\n금융시장을 이용하는 방법입니다.\n- **선물환(Forward)**: 미래 환율을 지금 확정. 가장 널리 쓰임\n- **통화선물(Futures)**: 거래소에서 표준화된 계약\n- **통화옵션**: 유리하면 행사하고 불리하면 버림. **프리미엄**을 냄\n- **통화스왑**: 서로 다른 통화의 원리금을 교환\n- **환변동보험**: 무역보험공사가 제공. 손실을 보상하고 이익은 환수\n\n> **선물환과 옵션의 차이**가 중요합니다. 선물환은 환율을 완전히 고정하지만 유리한 방향으로 움직여도 이익을 못 봅니다. 옵션은 불리할 때만 행사해 상승 이익을 남길 수 있지만 프리미엄을 냅니다.\n\n## 헤지의 목적\n> 헤지는 **이익을 늘리는 것이 아니라 결과를 안정시키는 것**입니다.\n> 환율이 유리하게 움직였을 때 이익을 포기하는 것이 대가입니다. 이 점을 논술에서 명확히 써야 합니다.\n\n## 무역보험공사의 환변동보험\n중소기업은 선물환 거래를 하려 해도 은행이 신용한도를 잘 안 줍니다. 담보가 부족하기 때문입니다.\n> 환변동보험은 그 공백을 메웁니다. 공사가 환율을 보장해주어 중소 수출기업이 환위험 없이 영업할 수 있게 합니다.\n> **손실 보상과 이익 환수가 함께 있다는 점**이 특징이며, 이는 투기가 아니라 안정이 목적이기 때문입니다.\n\n▸ 네팅: 서로 주고받을 금액을 상계하고 차액만 정산하는 것.\n▸ 선물환: 미래 일정 시점의 환율을 미리 약정하는 계약.\n▸ 헤지: 위험을 상쇄하기 위한 반대 방향 거래.","alt":"## 환위험 3종 ⭐\n- **거래위험**: 이미 생긴 외화 채권·채무. 결제할 때 환율 변해서 손해. **가장 직접적**\n- **환산위험**: 해외 자회사 재무제표 환산할 때. **장부상**일 뿐 현금 안 나감\n- **경제적위험**: 환율이 미래 매출·경쟁력에 주는 영향. **가장 포괄적**, 측정 어려움\n\n> 🚨 구분법\n> **거래 = 이미 확정된 것 / 환산 = 장부상 / 경제적 = 미래 경쟁력**\n> 셋 섞어서 냄.\n\n## 내부 기법 (회사 안에서)\n- **매칭**: 외화 수입과 지출의 통화·시기 맞추기\n- **네팅**: 계열사끼리 상계하고 **차액만** 결제\n- **리딩 & 래깅** ⭐\n- 통화 다변화 / 결제통화 조정\n\n> 🚨 리딩·래깅 방향\n> **환율 오를 것 같으면** → 외화 받는 건 **늦추고(래깅)**, 외화 주는 건 **앞당김(리딩)**\n> 나중에 받으면 더 비싸게 받고, 지금 주면 싸게 주니까. 논리로 이해하면 안 헷갈림.\n\n## 외부 기법 (금융시장 이용)\n- **선물환**: 미래 환율 지금 확정. 제일 많이 씀\n- 통화선물: 거래소 표준화 계약\n- **통화옵션**: 유리하면 쓰고 불리하면 버림. **프리미엄** 냄\n- **통화스왑**: 서로 다른 통화 원리금 교환\n- **환변동보험**: 무보 제공\n\n> 🚨 **선물환 vs 옵션** 차이가 핵심임\n> **선물환**: 환율 완전 고정. 근데 유리하게 움직여도 **이익 못 봄**. 공짜\n> **옵션**: 불리할 때만 행사 → **상승 이익 남길 수 있음**. 대신 **프리미엄** 냄\n>\n> 즉 옵션은 돈 내고 선택권을 사는 거임.\n\n## 헤지의 목적 ⭐\n> 🚨 **헤지는 돈 버는 게 아니라 결과를 안정시키는 것임.**\n> 유리하게 움직였을 때 이익을 포기하는 게 대가임.\n> 논술에서 이거 명확히 안 쓰면 감점임. \"헤지로 수익을 극대화한다\" 같은 표현 쓰면 안 됨.\n\n## 무보 환변동보험 (논술 소재)\n> 중소기업은 선물환 하고 싶어도 **은행이 신용한도를 안 줌.** 담보가 없으니까.\n> 환변동보험이 그 공백을 메움. 공사가 환율을 보장해줘서 중소기업도 환위험 없이 영업.\n>\n> 🚨 **손실 보상 + 이익 환수**가 같이 있음. 투기가 아니라 **안정**이 목적이라서.\n\n▸ 네팅: 상계하고 차액만 정산."},{"sub":"국제금융론","title":"④ 국제수지와 무역결제","body":"## 국제수지표\n- **경상수지**: 상품수지, 서비스수지, 본원소득수지, 이전소득수지\n- **자본수지**: 자본이전 등\n- **금융계정**: 직접투자, 증권투자, 파생금융상품, 기타투자, **준비자산**\n\n> 직접투자와 증권투자는 경상수지가 아니라 **금융계정**입니다. 이걸 경상수지 항목으로 껴 넣는 문제가 자주 나옵니다.\n\n## 경상수지 흑자의 양면\n- 긍정: 외화 확보, 대외 신인도 상승, 고용 증가\n- 부정: 통화량 증가로 인플레이션 압력, 환율 하락 압력, 교역상대국과 마찰\n\n> 흑자가 무조건 좋은 것은 아니라는 점을 논술에서 균형 있게 써야 합니다.\n\n## 무역결제 방식\n### 신용장(L/C)\n> 수입자의 거래은행이 대금 지급을 **약속**하는 증서입니다.\n> 수출자는 수입자를 못 믿어도 은행을 믿고 물건을 보낼 수 있습니다. 은행의 신용이 수입자의 신용을 대체하는 구조입니다.\n\n특징은 **독립성과 추상성**입니다. 신용장 거래는 매매계약과 독립적이고, 은행은 서류만 보고 판단하며 실제 물건의 상태는 따지지 않습니다.\n\n### 무신용장 방식\n- **D/P(지급인도)**: 대금을 지급해야 선적서류를 넘겨줌\n- **D/A(인수인도)**: 어음을 인수하면 서류를 넘겨주고 대금은 나중에. **수출자 위험이 큼**\n- **O/A(사후송금)**: 물건 먼저 보내고 나중에 송금받음. 수출자 위험이 가장 큼\n- 선지급(T/T 등): 수입자 위험이 큼\n\n> 결제 방식에 따라 위험이 누구에게 쏠리는지가 달라집니다.\n> **O/A와 D/A처럼 수출자가 위험을 지는 방식일수록 무역보험의 필요성이 커집니다.** 이 연결이 논술 포인트입니다.\n\n## 국제통화제도의 변천\n- **금본위제**: 금에 통화가치를 고정\n- **브레튼우즈 체제**: 달러를 금에 연동하고 각국 통화를 달러에 고정. 1971년 붕괴\n- **킹스턴 체제**: 변동환율제를 공식 인정\n\n> 브레튼우즈 붕괴의 원인으로 **트리핀 딜레마**가 언급됩니다. 달러가 국제 유동성을 공급하려면 미국이 적자를 내야 하는데, 적자가 계속되면 달러 신뢰가 무너진다는 모순입니다.\n\n▸ 준비자산: 외환보유액.\n▸ 신용장: 은행이 대금 지급을 확약하는 증서.\n▸ 트리핀 딜레마: 기축통화국이 겪는 유동성과 신뢰의 상충.","alt":"## 국제수지 구성 ⭐\n- **경상수지** = 상품 + 서비스 + 본원소득 + 이전소득\n- 자본수지\n- **금융계정** = 직접투자 + 증권투자 + 파생상품 + 기타 + **준비자산**\n\n> 🚨 **직접투자·증권투자는 금융계정임. 경상수지 아님.**\n> 경상수지 항목 고르라고 하고 직접투자 껴놓음. 단골 함정.\n\n## 경상수지 흑자가 무조건 좋냐?\n- 좋은 점: 외화 확보, 신인도 상승, 고용 증가\n- 나쁜 점: **통화량 증가 → 물가 압력**, 환율 하락 압력, **교역국과 마찰**\n\n> 🚨 논술에서 \"흑자 = 좋음\"으로만 쓰면 감점임. 양면을 써야 함.\n> 흑자 나면 달러가 들어와서 원화 강세 → 수출 다시 불리해짐. 자동 조절되는 면도 있음.\n\n## 무역결제 방식 ⭐\n### 신용장(L/C)\n> **수입자 거래은행이 대금 지급을 약속**하는 증서.\n> 수출자가 수입자를 못 믿어도 **은행을 믿고** 물건 보냄. 은행 신용이 수입자 신용을 대체.\n\n특징: **독립성 + 추상성**\n> 은행은 **서류만 보고** 판단함. 물건이 실제로 어떤지는 안 따짐.\n> 서류가 완벽하면 물건이 벽돌이어도 돈을 줌. 이게 추상성임.\n\n### 무신용장 방식 (위험이 누구한테 쏠리나)\n- **D/P**: 돈 줘야 서류 넘김\n- **D/A**: 어음 인수하면 서류 넘기고 돈은 나중 → **수출자 위험 큼**\n- **O/A**: 물건 먼저 보내고 나중에 송금 → **수출자 위험 최대**\n- 선지급: **수입자 위험 큼**\n\n> 🚨 논술 연결 포인트\n> **O/A, D/A처럼 수출자가 위험 지는 방식일수록 무역보험이 꼭 필요해짐.**\n> 요즘은 바이어가 우위라 O/A가 늘어남 → 무역보험 수요 증가\n> 이 흐름을 쓰면 논술이 살아남.\n\n## 국제통화제도 변천\n금본위제 → **브레튼우즈**(달러-금 연동) → 1971 붕괴 → **킹스턴**(변동환율 공식화)\n\n> 🚨 **트리핀 딜레마**\n> 달러가 세계에 유동성을 공급하려면 미국이 **적자**를 내야 함\n> 근데 적자가 계속되면 **달러를 못 믿게 됨**\n> 유동성과 신뢰가 서로 모순. 이게 브레튼우즈가 무너진 이유임.\n\n▸ 준비자산: 외환보유액."},{"sub":"논술 대비","title":"① 답안 작성의 기본","body":"## 채점자는 무엇을 보는가\n논술 100점은 글솜씨를 보는 시험이 아닙니다. **개념을 정확히 알고 논리적으로 배열할 수 있는가**를 봅니다.\n> 화려한 문장보다 **개념어를 정확히 쓰고 구조가 보이는 답안**이 점수를 받습니다.\n\n## 기본 구조\n### 기술형 (개념 설명)\n> **정의 → 구성요소 또는 유형 → 의의나 한계**\n\n예를 들어 \"역선택과 도덕적 해이를 설명하시오\"라면\n1. 정보 비대칭이라는 공통 배경을 먼저 제시\n2. 역선택은 계약 **전**, 감춰진 특성\n3. 도덕적 해이는 계약 **후**, 감춰진 행동\n4. 각각의 대응 수단\n5. 무역보험에서의 적용\n\n### 논술형 (견해 요구)\n> **서론: 문제 제기와 논점 정리**\n> **본론: 근거 2~3개를 소제목처럼 구분**\n> **결론: 균형 잡힌 정리와 시사점**\n\n## 반드시 지킬 다섯 가지\n**① 두괄식으로 쓸 것**\n결론을 첫 문장에 두면 채점자가 방향을 바로 잡습니다.\n\n**② 개념어를 정확히 쓸 것**\n\"위험을 나눈다\"보다 \"위험을 분산한다\"가, \"돈 못 받을 위험\"보다 \"신용위험\"이 낫습니다. 개념어 하나가 점수입니다.\n\n**③ 구조를 눈에 보이게 할 것**\n첫째, 둘째, 셋째. 또는 소제목. 채점자는 수백 장을 봅니다. 구조가 보이는 답안이 유리합니다.\n\n**④ 양면을 쓸 것**\n장점만 쓰면 얕아 보입니다. \"다만 ~한 한계가 있다\"를 한 줄 넣으면 균형이 생깁니다.\n\n**⑤ 백지를 만들지 말 것**\n> 모르는 주제가 나와도 아는 개념을 연결해 반드시 채웁니다. 논술은 부분점수가 있습니다. 백지는 0점입니다.\n\n## 시간 배분\n100점 배점에 기술형과 논술형이 함께 나옵니다.\n> **개요를 먼저 3분 잡고 쓰기 시작하세요.** 바로 쓰기 시작하면 중간에 방향을 잃고 지웁니다. 목차만 잡아도 구조 점수를 확보합니다.\n\n▸ 두괄식: 결론을 앞에 두는 글쓰기.\n▸ 부분점수: 완전하지 않아도 맞는 부분에 주는 점수.\n▸ 개요: 본격적으로 쓰기 전에 잡는 뼈대.","alt":"## 채점자가 뭘 보냐\n> 🚨 논술은 **글솜씨 시험이 아님.** 개념을 정확히 알고 논리적으로 배열하는지를 봄.\n> 문학적으로 쓰지 마셈. **개념어 정확히 쓰고 구조 보이게** 쓰는 게 점수임.\n\n## 구조\n### 기술형 (설명해라)\n> **정의 → 구성요소·유형 → 의의·한계**\n\n\"역선택과 도덕적 해이를 설명하시오\" 나오면\n1. 정보 비대칭이 공통 배경\n2. 역선택 = 계약 **전**, 감춰진 특성\n3. 도덕적 해이 = 계약 **후**, 감춰진 행동\n4. 각각 대응책\n5. 무역보험 적용\n\n이 순서로 쓰면 됨.\n\n### 논술형 (의견 내라)\n> 서론(논점 정리) → 본론(근거 2~3개) → 결론(균형 + 시사점)\n\n## 무조건 지킬 5개 ⭐\n\n**① 두괄식**\n결론부터. 채점자가 방향을 바로 잡음.\n\n**② 개념어 정확히**\n> 🚨 \"돈 못 받을 위험\" ❌ → \"**신용위험**\" ⭕\n> \"위험을 나눈다\" ❌ → \"위험을 **분산**한다\" ⭕\n> 개념어 하나가 점수임. 아는 단어는 무조건 정확한 용어로 쓰셈.\n\n**③ 구조 보이게**\n첫째, 둘째, 셋째. 또는 소제목.\n> 채점자는 수백 장 봄. 줄글로 빽빽하면 뭘 썼는지 안 보임.\n\n**④ 양면 쓰기**\n> 🚨 좋은 점만 쓰면 얕아 보임. **\"다만 ~한 한계가 있다\"** 한 줄이면 급이 달라짐.\n\n**⑤ 백지 금지**\n> 🚨 모르는 게 나와도 **아는 개념 끌어와서 채우셈.**\n> 논술은 부분점수 있음. 반쯤 써도 점수 나옴. **백지는 0점임.**\n> 8일 준비로 완벽할 수 없음. 채우는 게 전략임.\n\n## 시간\n> 🚨 **개요부터 3분.** 바로 쓰면 중간에 방향 잃고 지움.\n> 목차만 잡아도 구조 점수는 먹고 들어감.\n\n▸ 두괄식: 결론 먼저."},{"sub":"논술 대비","title":"② 예상 주제와 논점","body":"## 이 기관에서 나올 만한 주제\n무역보험공사 논술은 **보험학과 국제금융을 기관 업무와 연결**하는 방향으로 나올 가능성이 높습니다.\n\n## 주제 1. 무역보험의 필요성과 역할\n> **핵심 논점**: 민영보험이 감당할 수 없는 **비상위험**을 국가가 인수한다. 그리고 단순 보상을 넘어 **금융 보완** 기능으로 수출금융을 가능하게 한다.\n\n- 서론: 수출거래의 두 위험 (신용위험, 비상위험)\n- 본론1: 시장실패 — 비상위험은 손실이 거대하고 동시다발적이라 민영보험이 인수 불가\n- 본론2: 금융 보완 — 보험증권이 담보 역할을 해 중소기업 대출이 가능해짐\n- 본론3: 수출 진흥 — 신흥시장 진출 지원\n- 결론: 다만 도덕적 해이 억제와 재정 건전성 확보라는 과제도 있음\n\n## 주제 2. 정보 비대칭과 무역보험의 관리\n> **핵심 논점**: 역선택은 언더라이팅으로, 도덕적 해이는 부보율로 대응한다.\n\n- 역선택: 부실 바이어와 거래하는 기업일수록 가입 유인이 큼 → **해외 수입자 신용조사**, 신용등급별 인수한도\n- 도덕적 해이: 보험만 믿고 바이어 관리를 소홀히 함 → **부보율**, 사고 이력 반영\n\n## 주제 3. 환위험 관리와 환변동보험\n> **핵심 논점**: 중소기업은 선물환 접근이 어렵다. 그 공백을 정책보험이 메운다.\n\n- 환위험 3종 (거래·환산·경제적)\n- 내부기법과 외부기법\n- 선물환과 옵션의 차이 (고정 vs 선택권)\n- 환변동보험의 특징: 손실 보상과 **이익 환수**의 병존, 목적은 투기가 아니라 안정\n\n## 주제 4. 경상수지와 환율\n> **핵심 논점**: 환율 상승이 수지를 개선하지만 조건이 있고 부작용도 있다.\n\n- J커브 효과, 마셜-러너 조건\n- 물가 상승 압력, 외화부채 부담\n- 결론: 환율에 의존한 수출 경쟁력은 지속 가능하지 않으며 품질과 기술 경쟁력이 필요\n\n## 주제 5. 재무·회계 기반 기업 심사\n> 무역보험공사의 조사·인수 직무는 기업의 신용을 평가합니다.\n\n- 유동비율, 부채비율, 이자보상비율의 의미\n- **이자보상비율 1 미만이면 영업이익으로 이자도 못 냄**\n- 현금흐름의 중요성, **흑자도산**\n- 재무제표만으로 부족한 이유: 비재무 정보, 산업 전망, 경영진\n\n## 마지막 조언\n> 어떤 주제가 나와도 **\"수출기업이 겪는 위험 → 시장이 해결 못 하는 이유 → 공사의 역할 → 남는 과제\"** 이 뼈대로 끌고 갈 수 있습니다.\n> 하나의 틀을 확실히 익혀두면 낯선 주제에도 대응됩니다.\n\n▸ 시장실패: 시장에 맡겼을 때 효율적 배분이 안 되는 상태.\n▸ 언더라이팅: 위험을 평가해 인수 여부와 조건을 정하는 일.\n▸ 이자보상비율: 영업이익 ÷ 이자비용.","alt":"## 나올 만한 주제\n무보 논술은 **보험학 + 국제금융을 기관 업무에 붙이는** 방향으로 나올 확률 높음.\n\n## 주제 1. 무역보험의 필요성 ⭐ (1순위)\n> 🚨 핵심: **민영이 못 하는 비상위험을 국가가 받는다 + 금융 보완**\n\n구조 잡아드림.\n- 서론: 수출거래엔 **신용위험 + 비상위험** 두 개가 있다\n- 본론1: **시장실패** — 비상위험은 한 방에 다 터져서 민영이 못 받음\n- 본론2: **금융 보완** — 보험증권이 담보 → 중소기업이 대출 가능\n- 본론3: 수출 진흥 — 위험한 신흥시장도 갈 수 있게\n- 결론: **다만** 도덕적 해이 억제, 재정 건전성 과제\n\n이거 그대로 외워두셈. 제일 나올 확률 높음.\n\n## 주제 2. 정보 비대칭 관리\n> 핵심: **역선택 → 언더라이팅 / 도덕적 해이 → 부보율**\n\n- 역선택: 부실 바이어랑 거래하는 애가 더 가입하려 함 → **신용조사**, 등급별 한도\n- 도덕적 해이: 보험 믿고 바이어 관리 안 함 → **부보율**, 사고 이력 반영\n\n## 주제 3. 환위험과 환변동보험\n> 핵심: **중소기업은 선물환을 못 씀. 그 공백을 정책보험이 메움**\n\n- 환위험 3종\n- 선물환 vs 옵션 (고정 vs 선택권)\n- 환변동보험: **손실 보상 + 이익 환수**. 목적은 투기 아니라 안정\n\n## 주제 4. 경상수지와 환율\n> 핵심: **환율 올리면 좋긴 한데 조건 있고 부작용도 있다**\n\n- J커브, **마셜-러너 조건**\n- 물가 압력, 외화부채 부담\n- 결론: **환율에 기댄 경쟁력은 지속 불가.** 품질·기술로 가야 함\n\n## 주제 5. 기업 심사 (재무 기반)\n무보 조사·인수 직무 = 기업 신용 평가임.\n- 유동비율, 부채비율, **이자보상비율**\n- 🚨 **이자보상비율 1 미만 = 영업이익으로 이자도 못 냄 (좀비기업)**\n- **흑자도산** — 장부는 흑자인데 현금 없어서 망함\n- 재무제표만으론 부족: 비재무 정보, 산업 전망, 경영진\n\n## 마지막 팁 ⭐\n> 🚨 뭐가 나와도 이 뼈대로 끌고 갈 수 있음.\n>\n> **\"수출기업이 겪는 위험 → 시장이 왜 해결 못 하나 → 공사가 뭘 하나 → 남는 과제\"**\n>\n> 이 틀 하나만 확실히 익히면 처음 보는 주제도 60~70점은 나옴. 백지만 안 만들면 됨.\n\n▸ 시장실패: 시장에 맡기면 배분이 망하는 상태."},{"title":"① 경영학의 흐름","sub":"경영학","body":"## 고전적 관리론\n### 테일러의 과학적 관리법\n주먹구구로 하던 작업을 과학적으로 분석했습니다.\n- **시간연구와 동작연구**로 표준 작업량을 정함\n- **차별성과급**: 표준을 넘으면 높은 임률, 못 미치면 낮은 임률\n- 기능식 직장제도, 계획과 작업의 분리\n\n> 사람을 기계처럼 본다는 비판을 받습니다. 인간을 경제적 유인으로만 움직인다고 전제했기 때문입니다.\n\n### 포드 시스템\n컨베이어 벨트를 이용한 **이동조립법**입니다. 표준화, 단순화, 전문화를 통해 대량생산과 저가격을 실현했습니다.\n> 포드는 저가격·고임금을 주장했습니다. 봉사주의 경영이념이라고 부릅니다.\n\n### 페이욜의 일반관리론\n테일러가 작업 현장을 봤다면 페이욜은 **경영자의 관리 기능**을 봤습니다.\n관리 5요소는 계획, 조직, 지휘, 조정, 통제입니다.\n14가지 관리원칙 중 **명령일원화의 원칙**과 **분업의 원칙**이 자주 나옵니다.\n\n## 인간관계론\n### 호손실험\n조명 밝기를 바꿔가며 생산성을 측정했는데, 밝기와 무관하게 생산성이 올랐습니다.\n> 결론은 이랬습니다. **물리적 조건보다 관심받고 있다는 인식과 동료 관계가 생산성에 영향을 준다.**\n> 비공식 조직의 중요성이 여기서 드러났습니다.\n\n## 현대적 관점\n- **시스템 이론**: 조직을 투입-과정-산출-피드백의 열린 체계로 봄\n- **상황적합이론**: **최선의 방법은 없다.** 환경과 기술, 규모에 따라 적합한 조직이 다르다고 봄\n\n> 상황이론의 핵심 명제는 \"하나의 정답은 없다\"입니다. 고전이론이 유일 최선의 방법을 찾으려 한 것과 대비됩니다.\n\n## 맥그리거의 X이론과 Y이론\n- **X이론**: 사람은 일을 싫어하므로 통제하고 강제해야 한다\n- **Y이론**: 사람은 스스로 동기를 갖고 책임을 진다\n\n> X이론은 과학적 관리법, Y이론은 인간관계론과 이어집니다.\n\n▸ 임률: 단위당 지급하는 임금 비율.\n▸ 비공식 조직: 조직도에 없는 자연발생적 인간관계.\n▸ 상황적합이론: 상황에 맞는 조직 설계가 있다는 이론.","alt":"## 고전 관리론\n### 테일러 과학적 관리법\n주먹구구를 과학으로 바꿈.\n- **시간연구·동작연구**로 표준 작업량 정함\n- **차별성과급**: 표준 넘으면 많이, 못 넘으면 적게\n- 계획이랑 작업을 분리\n\n> 🚨 비판 포인트: 사람을 기계로 봄. **경제적 유인으로만** 움직인다고 전제함. 이게 인간관계론이 나온 이유임.\n\n### 포드 시스템\n컨베이어 벨트 = **이동조립법**. 표준화·단순화·전문화(3S)로 대량생산.\n> 포드는 **저가격 + 고임금** 주장함. 물건 싸게 팔고 직원 월급 많이 줌. 봉사주의 경영이념.\n\n### 페이욜\n> 🚨 테일러는 **작업 현장**을 봤고 페이욜은 **경영자의 관리 기능**을 봄. 시선이 다름.\n> 관리 5요소: 계획 / 조직 / 지휘 / 조정 / 통제\n> 14원칙 중 **명령일원화**랑 **분업**이 자주 나옴.\n\n## 인간관계론\n### 호손실험 ⭐\n조명 밝기 바꿔가며 생산성 측정함. 근데 밝기랑 상관없이 계속 올라감.\n> 왜? \"누가 나를 지켜보고 있다\"는 인식 때문임.\n> 결론: **물리적 조건보다 관심과 인간관계가 생산성에 영향을 줌.**\n> 비공식 조직의 중요성이 여기서 드러남.\n\n## 현대 관점\n- **시스템 이론**: 조직 = 투입-과정-산출-피드백. 열린 체계\n- **상황적합이론**: ⭐ **최선의 방법은 없다**\n\n> 🚨 상황이론 핵심 = \"정답은 없다. 상황 따라 다르다.\"\n> 고전이론이 \"유일 최선의 방법\"을 찾으려 한 거랑 정반대임. 이 대비로 문제 냄.\n\n## 맥그리거 X·Y이론\n- **X**: 사람은 일 싫어함 → 통제하고 강제해야 함\n- **Y**: 사람은 알아서 함 → 자율 주면 됨\n\n> X = 과학적 관리법 계열 / Y = 인간관계론 계열. 이렇게 묶어서 기억."},{"title":"② 경영전략","sub":"경영학","body":"## 전략 수립 절차\n전략목표 설정 → 환경분석 → 경영전략 도출 → 실행 → 평가 및 피드백\n\n> 첫 단계가 **전략목표 설정**입니다. 환경분석이 먼저라고 나오면 오답입니다.\n\n## SWOT 분석\n내부의 강점·약점과 외부의 기회·위협을 교차합니다.\n- **SO**: 강점으로 기회 활용 (공격적)\n- **ST**: 강점으로 위협 회피 (다각화)\n- **WO**: 약점 보완해 기회 활용 (우회)\n- **WT**: 약점과 위협 최소화 (방어적, 철수)\n\n## 포터의 5 Forces\n산업의 매력도를 보는 틀입니다.\n- 기존 기업 간 경쟁\n- 신규 진입자의 위협\n- 대체재의 위협\n- 구매자의 교섭력\n- 공급자의 교섭력\n\n> 정부 규제, 보완재는 5 Forces에 **포함되지 않습니다.** 선택지에 껴 나옵니다.\n\n## 포터의 본원적 경쟁전략\n- **원가우위**: 낮은 비용으로 승부\n- **차별화**: 독특한 가치로 승부\n- **집중화**: 특정 시장에 좁게 집중\n\n> 원가우위와 차별화를 동시에 추구하면 **어중간한 상태(stuck in the middle)**에 빠진다고 봤습니다.\n\n## BCG 매트릭스\n시장성장률과 상대적 시장점유율 두 축입니다.\n| | 점유율 높음 | 점유율 낮음 |\n|---|---|---|\n| **성장률 높음** | 별(Star) | 물음표(Question Mark) |\n| **성장률 낮음** | 현금젖소(Cash Cow) | 개(Dog) |\n\n> **현금젖소**가 벌어들인 돈으로 **물음표**를 키워 **별**로 만드는 것이 기본 흐름입니다.\n> 개는 철수 대상입니다.\n\n## 앤소프의 제품시장 매트릭스\n| | 기존 제품 | 신제품 |\n|---|---|---|\n| **기존 시장** | 시장침투 | 제품개발 |\n| **신시장** | 시장개발 | 다각화 |\n\n> 위험이 가장 낮은 것이 **시장침투**, 가장 높은 것이 **다각화**입니다.\n\n## 가치사슬\n기업 활동을 주활동과 지원활동으로 나눕니다.\n- **주활동**: 물류 투입, 운영, 물류 산출, 마케팅과 판매, 서비스\n- **지원활동**: 기업 하부구조, 인적자원관리, 기술개발, 조달\n\n▸ 본원적 전략: 산업과 무관하게 적용되는 기본 경쟁전략.\n▸ 상대적 시장점유율: 최대 경쟁사 대비 자사 점유율.\n▸ 다각화: 새 시장에 새 제품으로 진출하는 것.","alt":"## 전략 수립 순서\n**전략목표 설정 → 환경분석 → 전략 도출 → 실행 → 평가**\n\n> 🚨 첫 단계가 **목표 설정**임. \"환경분석이 먼저\" 나오면 오답. 어디로 갈지 정하고 나서 지형을 보는 거임.\n\n## SWOT 4전략\n- **SO**: 강점 + 기회 → 공격\n- **ST**: 강점으로 위협 막기\n- **WO**: 약점 보완해서 기회 잡기\n- **WT**: 둘 다 최소화 → 방어, 철수\n\n## 포터 5 Forces\n기존 경쟁 / 신규진입 위협 / 대체재 위협 / **구매자 교섭력** / **공급자 교섭력**\n\n> 🚨 **정부 규제, 보완재는 안 들어감.** 껴놓고 고르라 함.\n\n## 본원적 경쟁전략 3개\n**원가우위 / 차별화 / 집중화**\n\n> 🚨 원가우위랑 차별화를 **동시에 하면 안 됨.**\n> 어중간해져서 이도저도 아니게 됨. 포터가 이걸 \"stuck in the middle\"이라 부름.\n\n## BCG 매트릭스 ⭐\n| | 점유율 ↑ | 점유율 ↓ |\n|---|---|---|\n| **성장률 ↑** | **별** | **물음표** |\n| **성장률 ↓** | **현금젖소** | **개** |\n\n> 흐름: **현금젖소로 돈 벌어서 → 물음표에 투자 → 별로 키움 → 시장 성숙되면 현금젖소 됨**\n> 개는 철수.\n> 성장률 낮은데 점유율 높은 게 왜 좋냐면, 더 투자할 필요가 없어서 돈이 남기 때문임.\n\n## 앤소프 매트릭스\n| | 기존 제품 | 신제품 |\n|---|---|---|\n| **기존 시장** | 시장침투 | 제품개발 |\n| **신시장** | 시장개발 | **다각화** |\n\n> 🚨 위험 최저 = **시장침투** / 위험 최고 = **다각화**\n> 둘 다 새로운 거니까 다각화가 제일 무서운 거임.\n\n## 가치사슬\n- **주활동**: 투입물류, 운영, 산출물류, 마케팅·판매, 서비스\n- **지원활동**: 하부구조, 인적자원, 기술개발, 조달\n\n> 🚨 인적자원관리랑 조달이 **지원활동**임. 주활동에 껴놓고 고르라 함."},{"title":"③ 조직구조와 조직문화","sub":"경영학","body":"## 조직구조의 기본 개념\n- **분업**: 일을 나누는 것\n- **부문화**: 나눈 일을 묶는 기준. 기능별, 제품별, 지역별, 고객별\n- **통제의 범위**: 관리자 한 명이 관리하는 부하 수. 좁으면 조직이 높아지고 넓으면 납작해집니다\n- **집권화와 분권화**: 의사결정 권한이 위에 몰려 있는가\n\n## 조직 형태\n### 기능별 조직\n생산, 영업, 인사처럼 기능으로 묶습니다. 전문성이 쌓이고 중복이 없습니다.\n> 다만 부서 간 벽이 생기고 제품별 책임 소재가 불분명합니다. 환경 변화에 느립니다.\n\n### 사업부제 조직\n제품이나 지역별로 독립된 단위를 만듭니다. 책임이 명확하고 대응이 빠릅니다.\n> 다만 인사·회계 같은 **기능이 사업부마다 중복**되어 자원이 낭비됩니다.\n\n### 매트릭스 조직\n기능과 프로젝트 두 축을 겹칩니다. 인력을 유연하게 쓸 수 있습니다.\n> 다만 두 상사의 지시를 받게 되어 **명령일원화 원칙이 깨지고** 갈등이 생깁니다.\n\n### 네트워크 조직\n핵심 역량만 남기고 나머지는 외부와 계약합니다.\n\n## 기계적 조직 vs 유기적 조직\n| | 기계적 | 유기적 |\n|---|---|---|\n| 규칙 | 엄격 | 느슨 |\n| 권한 | 집권화 | 분권화 |\n| 소통 | 공식적, 수직적 | 비공식적, 수평적 |\n| 적합 환경 | 안정적 | 변화가 심함 |\n\n## 조직문화 7S 모형\n공유가치(Shared Value), 전략(Strategy), 구조(Structure), 제도(System), 구성원(Staff), 기술(Skill), 리더십 스타일(Style)\n> 이 중 **공유가치가 중심**에 있습니다. 나머지 6S를 연결하는 축입니다.\n> 고객(Customer)은 7S에 없습니다. 3C의 요소입니다.\n\n## 공식조직과 비공식조직\n- 공식조직: 조직도에 나타나는 공적 관계\n- 비공식조직: 자연발생적 인간관계\n\n> 비공식조직은 소속감을 높이고 소통을 원활히 하는 순기능이 있습니다. 다만 파벌화되면 공식 목표를 해칠 수 있습니다. 무조건 부정적으로 보는 선택지는 오답입니다.\n\n▸ 통제의 범위: 한 관리자가 감독하는 부하의 수.\n▸ 라인과 스태프: 직접 목표 달성에 관여하는 부문과 지원하는 부문.\n▸ 7S: 조직을 진단하는 일곱 가지 요소.","alt":"## 기본 개념\n- **분업**: 일 나누기\n- **부문화**: 묶는 기준 (기능별/제품별/지역별/고객별)\n- **통제의 범위**: 한 명이 몇 명 관리? 좁으면 조직이 **높아지고** 넓으면 **납작**해짐\n- **집권 vs 분권**: 권한이 위에 몰렸나\n\n## 조직 형태 4개\n### 기능별\n생산·영업·인사로 묶음. 전문성 쌓임, 중복 없음.\n> 단점: 부서 간 벽 생김, 제품별 책임 불분명, 변화에 느림\n\n### 사업부제\n제품·지역별 독립 단위. 책임 명확, 대응 빠름.\n> 🚨 단점: **기능이 사업부마다 중복**됨. 인사팀이 3개 생기는 식. 자원 낭비.\n\n### 매트릭스\n기능 + 프로젝트 두 축 겹침. 인력 유연하게 씀.\n> 🚨 단점: 상사가 둘 → **명령일원화 깨짐** → 갈등. 이게 단골 답임.\n\n### 네트워크\n핵심만 남기고 나머지 외주.\n\n## 기계적 vs 유기적 ⭐\n| | 기계적 | 유기적 |\n|---|---|---|\n| 규칙 | 빡셈 | 느슨 |\n| 권한 | 집권 | 분권 |\n| 소통 | 공식·수직 | 비공식·수평 |\n| 환경 | **안정적** | **변화 심함** |\n\n> 안정된 환경엔 기계적, 변화 심하면 유기적. 이 짝만 맞추면 됨.\n\n## 조직문화 7S\n공유가치 / 전략 / 구조 / 제도 / 구성원 / 기술 / 스타일\n\n> 🚨 **공유가치가 한가운데** 있고 나머지 6개를 연결함.\n> 그리고 **고객(Customer)은 7S 아님.** 그건 3C임. 이거 껴놓고 고르라 함.\n\n## 공식 vs 비공식 조직\n> 🚨 비공식조직을 **무조건 나쁘게** 써놓은 선택지는 오답임.\n> 소속감 높이고 소통 원활하게 하는 **순기능**이 있음.\n> 다만 파벌 되면 문제. 양면성으로 서술한 게 정답임.\n\n▸ 통제의 범위: 한 관리자가 보는 부하 수."},{"title":"④ 동기부여 이론","sub":"경영학","body":"## 내용이론 (무엇이 동기를 만드는가)\n### 매슬로우 욕구단계설\n생리 → 안전 → 소속과 애정 → 존경 → 자아실현\n> 하위 욕구가 충족되어야 상위 욕구가 동기가 됩니다. 이미 충족된 욕구는 더 이상 동기부여 요인이 아닙니다.\n> 한 번에 하나의 욕구만 작용한다고 본 점이 비판받습니다.\n\n### 알더퍼 ERG이론\n매슬로우를 셋으로 줄였습니다. **존재(Existence), 관계(Relatedness), 성장(Growth)**\n> 차이가 중요합니다. 매슬로우와 달리 **여러 욕구가 동시에 작용**할 수 있고, 상위 욕구가 좌절되면 하위로 내려가는 **좌절-퇴행**을 인정합니다.\n\n### 허즈버그 2요인이론\n- **위생요인**: 임금, 작업조건, 회사 정책, 대인관계, 감독. 없으면 불만이 생기지만 있어도 만족을 주지 못함\n- **동기요인**: 성취, 인정, 책임, 일 자체, 성장. 있으면 만족을 줌\n\n> 핵심은 **만족의 반대가 불만족이 아니라는 것**입니다. 불만족의 반대는 불만족 없음일 뿐입니다.\n> 그래서 임금을 아무리 올려도 불만만 없어질 뿐 동기가 생기지는 않습니다. 직무충실화가 처방입니다.\n\n### 맥클리랜드 성취동기이론\n성취욕구, 권력욕구, 친교욕구. 특히 **성취욕구가 높은 사람**은 중간 정도의 난이도와 즉각적 피드백을 선호합니다.\n\n## 과정이론 (어떻게 동기가 생기는가)\n### 브룸 기대이론\n> **동기 = 기대(Expectancy) × 수단성(Instrumentality) × 유인가(Valence)**\n- 기대: 노력하면 성과가 날까\n- 수단성: 성과를 내면 보상이 올까\n- 유인가: 그 보상이 나에게 가치 있나\n\n> **곱셈**이라는 점이 핵심입니다. 하나라도 0이면 동기가 0이 됩니다.\n\n### 아담스 공정성이론\n자신의 투입 대비 산출 비율을 **타인과 비교**합니다. 불공정을 느끼면 이를 줄이려 행동합니다.\n> 투입 조절, 산출 조절, 인지 왜곡, 비교대상 변경, 이직 등의 반응이 나타납니다.\n> 과소보상뿐 아니라 **과대보상도 불공정**으로 인식됩니다.\n\n### 로크 목표설정이론\n구체적이고 어려운 목표가 성과를 높입니다. 다만 수용 가능해야 하고 피드백이 있어야 합니다.\n> MBO의 이론적 근거입니다.\n\n### 강화이론 (스키너)\n- 정적 강화: 좋은 것을 줌\n- 부적 강화: 싫은 것을 없앰\n- 벌: 싫은 것을 줌\n- 소거: 좋은 것을 없앰\n\n> **부적 강화와 벌은 다릅니다.** 부적 강화는 행동을 늘리고 벌은 줄입니다. 이 구분이 자주 나옵니다.\n\n▸ 직무충실화: 일에 자율성과 책임을 더해 동기요인을 늘리는 것.\n▸ 유인가: 보상에 대해 개인이 느끼는 가치.\n▸ 소거: 강화를 중단해 행동을 줄이는 것.","alt":"## 내용이론 = \"뭐가 동기를 만드나\"\n\n### 매슬로우 5단계\n생리 → 안전 → 소속 → 존경 → 자아실현\n> 🚨 **이미 충족된 욕구는 동기가 안 됨.** 배부른 사람한테 밥 주면 감동 없음.\n> 비판: 한 번에 하나씩만 작용한다고 봄.\n\n### 알더퍼 ERG\n매슬로우를 3개로 압축. **존재 / 관계 / 성장**\n> 🚨 매슬로우랑 다른 점 2개가 시험 포인트\n> ① **여러 욕구가 동시에** 작용 가능\n> ② **좌절-퇴행** 인정 (위가 막히면 아래로 내려감)\n> 승진 막히니까 회식이나 하자는 게 좌절-퇴행임.\n\n### 허즈버그 2요인 ⭐\n- **위생요인**: 임금, 작업조건, 회사 정책, 대인관계 → 없으면 불만, 있어도 만족은 없음\n- **동기요인**: 성취, 인정, 책임, 일 자체, 성장 → 있으면 만족\n\n> 🚨 핵심 문장: **만족의 반대는 불만족이 아님.**\n> 불만족의 반대는 그냥 \"불만족 없음\"임.\n> 그래서 월급 아무리 올려줘도 불만만 사라질 뿐 신나서 일하진 않음. 처방은 **직무충실화**.\n\n### 맥클리랜드\n성취 / 권력 / 친교\n> 성취욕구 높은 사람 = **중간 난이도** 선호 + 즉각 피드백 원함.\n> 너무 쉬우면 재미없고 너무 어려우면 운빨이라 성취감이 없음.\n\n## 과정이론 = \"어떻게 동기가 생기나\"\n\n### 브룸 기대이론 ⭐\n> **동기 = 기대 × 수단성 × 유인가**\n- 기대: 노력하면 성과 날까\n- 수단성: 성과 내면 보상 올까\n- 유인가: 그 보상이 나한테 가치 있나\n\n> 🚨 **곱셈**이 핵심임. 하나라도 0이면 전체가 0.\n> 아무리 열심히 해도 승진 안 시켜줄 거 같으면(수단성 0) 동기 0임.\n\n### 아담스 공정성이론\n내 투입 대비 산출을 **남이랑 비교**함.\n> 🚨 **과대보상도 불공정으로 느낌.** 덜 받는 것만 문제가 아님.\n> 반응: 투입 줄이기, 인지 왜곡, 비교대상 바꾸기, 이직\n\n### 로크 목표설정이론\n**구체적이고 어려운** 목표가 성과를 높임. 단 수용 가능하고 피드백 있어야 함.\n> MBO의 근거임.\n\n### 강화이론 (스키너)\n> 🚨 여기 함정 있음\n> **부적 강화 ≠ 벌**\n> 부적 강화 = 싫은 걸 **없애줌** → 행동 **증가**\n> 벌 = 싫은 걸 **줌** → 행동 **감소**\n> 방향이 반대임. 잔소리 안 하는 게 부적 강화, 잔소리 하는 게 벌."},{"title":"⑤ 리더십","sub":"경영학","body":"## 특성이론\n훌륭한 리더에게는 공통된 자질이 있다고 봅니다. 지능, 자신감, 결단력 등입니다.\n> 일관된 특성을 찾지 못해 한계에 부딪혔습니다.\n\n## 행동이론\n### 오하이오 연구\n- **구조주도**: 과업과 역할을 명확히 하는 행동\n- **배려**: 부하의 감정과 관계를 챙기는 행동\n> 두 차원은 독립적입니다. 둘 다 높은 것이 바람직하다고 봤습니다.\n\n### 관리격자 (블레이크와 무튼)\n생산에 대한 관심과 인간에 대한 관심을 각각 9단계로 봅니다.\n- (1,1) 무기력형 / (9,1) 과업형 / (1,9) 컨트리클럽형 / (5,5) 중도형 / **(9,9) 팀형이 이상적**\n\n## 상황이론\n### 피들러의 상황적합이론\n리더십 스타일을 **LPC 점수**로 측정합니다. 가장 싫어하는 동료를 좋게 평가하면 관계지향적, 나쁘게 평가하면 과업지향적입니다.\n> 상황이 매우 유리하거나 매우 불리할 때는 **과업지향적** 리더가, 중간일 때는 **관계지향적** 리더가 효과적입니다.\n> 피들러는 리더의 스타일이 잘 안 바뀐다고 보아 **상황을 리더에 맞추라**고 했습니다.\n\n### 허시와 블랜차드의 상황대응 리더십\n부하의 **성숙도**에 따라 스타일을 바꿉니다.\n- 성숙도 낮음 → 지시형\n- 낮은 중간 → 설득형\n- 높은 중간 → 참여형\n- 성숙도 높음 → 위임형\n\n> 부하가 성장할수록 리더가 손을 떼는 방향입니다.\n\n### 경로-목표이론 (하우스)\n리더는 부하가 목표에 이르는 **길을 닦아주는** 역할을 합니다. 지시적, 지원적, 참여적, 성취지향적 스타일을 상황에 따라 씁니다.\n\n## 현대적 리더십\n### 거래적 리더십\n성과에 대한 보상을 교환합니다. 조건적 보상, 예외에 의한 관리.\n\n### 변혁적 리더십\n> 부하의 가치관과 태도 자체를 바꿔 기대 이상의 성과를 끌어냅니다.\n> 네 요소는 **카리스마(이상적 영향력), 영감적 동기부여, 지적 자극, 개별적 배려**입니다.\n\n### 서번트 리더십\n리더가 구성원을 섬기고 성장시키는 데 초점을 둡니다.\n\n▸ LPC: 가장 선호하지 않는 동료에 대한 평가 점수.\n▸ 성숙도: 부하의 능력과 의지 수준.\n▸ 거래적 vs 변혁적: 보상 교환이냐 가치 변화냐.","alt":"## 특성이론\n훌륭한 리더는 타고난다. 지능·자신감·결단력.\n> 근데 공통 특성을 못 찾아서 망함.\n\n## 행동이론\n### 오하이오 연구\n- **구조주도**: 일 시키고 역할 정하는 행동\n- **배려**: 사람 챙기는 행동\n> 둘은 독립적임. 둘 다 높은 게 좋다고 봄.\n\n### 관리격자\n생산 관심 × 인간 관심, 각각 9단계.\n> (1,1) 무기력 / (9,1) 과업형 / (1,9) 컨트리클럽 / (5,5) 중도 / **(9,9) 팀형 = 이상형**\n> 앞 숫자가 생산, 뒤가 인간임. 순서 헷갈리지 마셈.\n\n## 상황이론\n### 피들러 ⭐\n**LPC 점수**로 스타일 측정. 제일 싫은 동료를 좋게 평가 = 관계지향, 나쁘게 = 과업지향.\n\n> 🚨 결론이 반직관적이라 자주 나옴\n> **상황이 매우 좋거나 매우 나쁠 때 → 과업지향형**\n> **상황이 중간일 때 → 관계지향형**\n>\n> 위기 상황엔 인간적으로 굴 시간이 없음. 완전 편할 때도 굳이 챙길 필요 없음. 애매할 때만 관계가 중요함.\n>\n> 그리고 피들러는 **스타일이 안 바뀐다**고 봐서 **상황을 리더에 맞추라**고 함. 다른 이론들과 반대 방향임.\n\n### 허시-블랜차드\n부하 **성숙도**에 따라 바꿈.\n> 지시 → 설득 → 참여 → **위임**\n> 부하가 클수록 리더가 손 뗌. 순서 그대로 나옴.\n\n### 경로-목표이론 (하우스)\n리더는 부하가 목표까지 가는 **길을 닦아주는** 사람.\n지시적 / 지원적 / 참여적 / 성취지향적\n\n## 현대 리더십 ⭐\n### 거래적\n성과 주면 보상 줌. 거래임.\n\n### 변혁적\n> 부하의 **가치관 자체를 바꿔서** 기대 이상을 끌어냄.\n> 4요소: **카리스마 / 영감적 동기부여 / 지적 자극 / 개별적 배려**\n> 이 4개 그대로 물어봄.\n\n### 서번트\n리더가 구성원을 **섬김**. 성장시키는 데 초점.\n\n▸ LPC: 제일 싫은 동료 평가 점수."},{"title":"⑥ 인사관리","sub":"경영학","body":"## 직무분석\n어떤 일인지, 어떤 사람이 필요한지 정리하는 작업입니다.\n결과물이 두 가지입니다.\n> - **직무기술서**: 일의 내용, 책임, 작업조건. **일**에 관한 문서\n> - **직무명세서**: 학력, 경력, 능력, 자격. **사람**에 관한 문서\n\n이 둘을 바꿔 내는 문제가 자주 나옵니다.\n\n## 직무평가\n직무의 상대적 가치를 매겨 임금 체계의 기초로 삼습니다.\n- 비양적 방법: 서열법, 분류법\n- 양적 방법: **점수법**, 요소비교법\n\n## 직무설계\n- **직무확대**: 수평적으로 일의 범위를 넓힘 (양적 확대)\n- **직무충실화**: 수직적으로 권한과 책임을 더함 (질적 심화)\n- 직무순환: 여러 직무를 돌아가며 경험\n\n> 직무충실화가 허즈버그의 동기요인과 연결됩니다.\n\n### 직무특성모형 (해크만과 올드햄)\n기술다양성, 과업정체성, 과업중요성, **자율성**, **피드백** 다섯 가지가 동기를 높입니다.\n\n## 선발\n### 신뢰성과 타당성\n- **신뢰성**: 같은 사람을 여러 번 측정해도 일관된 결과가 나오는가\n- **타당성**: 측정하려는 것을 실제로 측정하고 있는가\n\n> 신뢰성이 없으면 타당성도 없습니다. 그러나 신뢰성이 있다고 타당성이 보장되지는 않습니다. 이 관계가 시험에 나옵니다.\n\n### 선발 오류\n- 1종 오류: 뽑았어야 할 사람을 탈락시킴\n- 2종 오류: 뽑지 말았어야 할 사람을 채용함\n\n## 인사고과 오류\n- **후광효과**: 한 가지 두드러진 특성이 전체 평가를 물들임\n- **관대화 경향**: 전반적으로 후하게 평가\n- **중심화 경향**: 중간 점수로 몰림\n- **최근효과**: 최근 실적만 반영\n- **대비오차**: 바로 앞 사람과 비교해 평가\n- **상동적 태도**: 출신지, 성별 등 집단 특성으로 판단\n\n> 관대화와 중심화를 막기 위해 **강제할당법**을 씁니다.\n\n## 교육훈련 평가 (커크패트릭 4단계)\n반응 → 학습 → 행동 → 결과\n\n▸ 직무기술서: 일에 관한 문서.\n▸ 직무명세서: 사람에 관한 문서.\n▸ 강제할당법: 등급별 인원 비율을 미리 정해두는 평가 방식.","alt":"## 직무분석 ⭐\n결과물 2개. 이거 바꿔서 진짜 자주 냄.\n> 🚨 **직무기술서 = 일에 대한 문서** (내용, 책임, 작업조건)\n> **직무명세서 = 사람에 대한 문서** (학력, 경력, 능력)\n>\n> 외우는 법: **명**세서에 사람 스펙(성**명** 쓰는 느낌). 기술서는 일을 기술.\n\n## 직무평가\n직무 가치 매겨서 임금 기준 잡기.\n- 비양적: 서열법, 분류법\n- 양적: **점수법**, 요소비교법\n\n## 직무설계 ⭐\n- **직무확대**: 옆으로 넓힘 (일 종류 늘림) = **양적**\n- **직무충실화**: 위로 깊게 (권한·책임 줌) = **질적**\n\n> 🚨 확대는 수평, 충실화는 수직. 이거 바꿔서 냄.\n> 충실화가 허즈버그 **동기요인**이랑 연결됨.\n\n### 직무특성모형\n기술다양성 / 과업정체성 / 과업중요성 / **자율성** / **피드백** 5개.\n\n## 선발\n### 신뢰성 vs 타당성 ⭐\n- **신뢰성**: 재고 또 재도 같은 값 나오나 (일관성)\n- **타당성**: 재려던 걸 제대로 재고 있나 (정확성)\n\n> 🚨 관계가 중요함\n> **신뢰성 없으면 타당성도 없음.** 근데 **신뢰성 있다고 타당성 보장은 안 됨.**\n> 고장난 저울이 매번 5kg 더 나옴 → 신뢰성은 있는데 타당성은 없음. 이 예시로 기억.\n\n### 선발 오류\n- 1종: 뽑았어야 할 사람 떨어뜨림\n- 2종: 뽑지 말았어야 할 사람 뽑음\n\n## 인사고과 오류 (다 나옴)\n- **후광효과**: 하나 잘하면 다 잘해 보임\n- **관대화**: 다 후하게\n- **중심화**: 다 중간으로\n- **최근효과**: 최근 것만 기억\n- **대비오차**: 앞 사람이랑 비교\n- **상동적 태도**: 출신·성별로 판단\n\n> 관대화·중심화 막으려고 **강제할당법** 씀. S등급 몇 %, A등급 몇 % 정해놓는 거.\n\n## 교육훈련 평가 4단계\n**반응 → 학습 → 행동 → 결과** (커크패트릭)"},{"title":"⑦ 보상과 노사관계","sub":"경영학","body":"## 임금 체계\n- **연공급**: 근속연수 기준. 안정적이지만 성과 반영이 어려움\n- **직무급**: 직무의 가치 기준. 동일노동 동일임금 원칙에 맞음\n- **직능급**: 직무수행 능력 기준\n- **성과급**: 성과 기준\n\n## 임금 관련 개념\n- **임금수준**: 얼마나 주느냐. 기업 지불능력, 생계비, 노동시장 수준이 결정\n- **임금체계**: 어떤 기준으로 배분하느냐\n- **임금형태**: 어떻게 지급하느냐 (시급, 월급, 성과급)\n\n### 성과급 제도\n- 개인 성과급: 단순성과급, **테일러식 차별성과급**\n- 집단 성과급: **스캔론 플랜**(매출액 대비 인건비 절감분 배분), **럭커 플랜**(부가가치 기준)\n\n## 복리후생\n- 법정 복리후생: 4대보험, 퇴직급여\n- 법정 외 복리후생: 회사가 자율로 제공\n- **카페테리아식 복리후생**: 직원이 원하는 항목을 골라 쓰는 방식\n\n## 노동조합\n### 조직 형태\n- 직업별 조합, 산업별 조합, 기업별 조합, 일반 조합\n\n### 숍 제도 (자주 나옴)\n> - **클로즈드 숍**: 조합원만 채용할 수 있음. 조합의 힘이 가장 강함\n> - **유니언 숍**: 채용은 자유지만 채용 후 일정 기간 안에 조합에 가입해야 함\n> - **오픈 숍**: 가입 여부가 자유. 조합의 힘이 가장 약함\n\n## 노동쟁의\n- 근로자 측: **파업**, 태업, 보이콧, 피케팅\n- 사용자 측: **직장폐쇄**\n\n> 직장폐쇄는 사용자의 유일한 쟁의행위이며, 노조의 쟁의행위에 대한 **대항수단**으로만 인정됩니다. 선제적으로는 할 수 없습니다.\n\n## 경영참가제도\n- **자본참가**: 우리사주제 등 주식 보유로 참여\n- **이윤참가**: 성과 배분으로 참여\n- **경영참가**: 의사결정에 참여 (노사협의회, 공동결정제)\n\n> 세 가지 유형을 묻고 엉뚱한 것을 껴 넣는 문제가 나옵니다.\n\n▸ 스캔론 플랜: 매출액 대비 인건비 절감액을 나누는 집단 성과급.\n▸ 숍 제도: 조합 가입과 고용의 관계를 정한 제도.\n▸ 직장폐쇄: 사용자가 사업장을 닫아 임금 지급을 면하는 쟁의행위.","alt":"## 임금 체계 4종\n- **연공급**: 근속연수. 안정적인데 성과 반영 안 됨\n- **직무급**: 일의 가치. 동일노동 동일임금\n- **직능급**: 능력 기준\n- **성과급**: 성과 기준\n\n## 헷갈리는 3형제\n- **임금수준**: 얼마 주냐\n- **임금체계**: 무슨 기준으로 나누냐\n- **임금형태**: 어떻게 주냐 (시급/월급/성과급)\n\n### 집단 성과급 ⭐\n- **스캔론 플랜**: **매출액** 대비 인건비 절감분 배분\n- **럭커 플랜**: **부가가치** 기준\n\n> 🚨 매출액이냐 부가가치냐로 갈림. 바꿔서 냄. 스캔론-매출, 럭커-부가가치.\n\n## 복리후생\n- 법정: 4대보험, 퇴직급여\n- 법정 외: 회사 자율\n- **카페테리아식**: 직원이 원하는 항목 **골라 씀**\n\n## 숍 제도 ⭐ (진짜 자주 나옴)\n> **클로즈드 숍**: 조합원만 채용 가능. **조합 힘 최강**\n> **유니언 숍**: 채용은 자유, 근데 들어오면 **일정 기간 내 가입 의무**\n> **오픈 숍**: 가입 자유. **조합 힘 최약**\n\n> 순서: 클로즈드 > 유니언 > 오픈. 조합 힘 세기 순임.\n\n## 쟁의행위\n- 근로자: **파업**, 태업, 보이콧, 피케팅\n- 사용자: **직장폐쇄**\n\n> 🚨 **직장폐쇄는 사용자의 유일한 쟁의수단**임.\n> 그리고 노조가 먼저 쟁의한 다음에만 쓸 수 있는 **대항수단**임. 먼저 못 씀.\n> \"사용자는 언제든 직장폐쇄를 할 수 있다\" → 오답.\n\n## 경영참가 3유형 ⭐\n- **자본참가**: 주식 보유 (우리사주)\n- **이윤참가**: 성과 배분\n- **경영참가**: 의사결정 참여 (노사협의회)\n\n> 🚨 여기에 \"생산참가\", \"단체교섭\" 같은 거 껴놓고 고르라 함. 3개만 있음."},{"title":"⑧ 마케팅의 기초와 STP","sub":"경영학","body":"## 마케팅 개념의 발전\n생산 → 제품 → 판매 → **마케팅** → 사회적 마케팅 순으로 발전했습니다.\n- **생산 개념**: 싸고 많이 만들면 팔린다\n- **제품 개념**: 좋은 제품이면 팔린다. 여기서 **마케팅 근시안**이 생깁니다\n- **판매 개념**: 밀어붙여 팔면 된다\n- **마케팅 개념**: 고객의 욕구에서 출발한다\n- **사회적 마케팅**: 고객과 기업뿐 아니라 사회 전체의 이익까지 고려한다\n\n> **마케팅 근시안**은 제품 자체에 매몰되어 고객이 진짜 원하는 것을 놓치는 오류입니다. 철도회사가 자신을 운송업이 아닌 철도업으로 규정해 쇠퇴한 사례가 유명합니다.\n\n## 시장세분화(Segmentation)\n시장을 비슷한 욕구를 가진 집단으로 나눕니다.\n### 세분화 기준\n- **인구통계적**: 나이, 성별, 소득, 직업\n- **지리적**: 지역, 도시 규모, 기후\n- **심리분석적**: 라이프스타일, 개성, 가치관\n- **행동적**: 사용량, 추구편익, 브랜드 충성도, 사용 상황\n\n### 좋은 세분시장의 조건\n측정 가능성, 접근 가능성, 규모의 적정성, 차별화 가능성, 실행 가능성\n\n## 표적시장 선정(Targeting)\n- **비차별적 마케팅**: 전체를 하나로 보고 동일한 마케팅. 원가 절감에 유리\n- **차별적 마케팅**: 세분시장마다 다른 마케팅. 매출은 늘지만 비용도 늘어남\n- **집중적 마케팅**: 하나의 세분시장에 집중. 자원이 적은 기업에 적합하지만 위험이 큼\n\n## 포지셔닝(Positioning)\n표적 고객의 마음속에 자사 제품의 위치를 심는 작업입니다.\n> 절차: 경쟁자 확인 → 경쟁자 포지션 분석 → 자사 포지션 개발 → 포지셔닝 확인과 재포지셔닝\n> 포지셔닝 맵을 그려 빈 공간을 찾는 방식이 흔히 쓰입니다.\n\n## 마케팅 믹스 4P\n- **Product**: 제품, 품질, 브랜드, 포장, 서비스\n- **Price**: 가격, 할인, 신용조건\n- **Place**: 유통경로, 재고, 물류\n- **Promotion**: 광고, 판매촉진, 인적판매, PR\n\n> 서비스 마케팅에서는 사람(People), 물리적 증거(Physical evidence), 프로세스(Process)를 더해 **7P**로 확장합니다.\n> 고객 관점에서 재구성한 **4C**(Customer value, Cost, Convenience, Communication)도 있습니다.\n\n▸ 마케팅 근시안: 제품에 갇혀 고객 욕구를 놓치는 오류.\n▸ 추구편익: 소비자가 그 제품에서 얻으려는 이득.\n▸ 포지셔닝 맵: 소비자 인식 속 위치를 좌표로 그린 그림.","alt":"## 마케팅 개념 발전 순서\n**생산 → 제품 → 판매 → 마케팅 → 사회적 마케팅**\n- 생산: 싸게 많이 만들면 팔림\n- 제품: 좋게 만들면 팔림 → 여기서 **마케팅 근시안** 생김\n- 판매: 밀어붙여 팔면 됨\n- 마케팅: **고객 욕구에서 출발**\n- 사회적: 사회 전체 이익까지\n\n> 🚨 **마케팅 근시안**\n> 철도회사가 자기를 \"철도업\"이라 규정함 → 자동차·비행기 나오니까 망함\n> \"운송업\"이라고 봤으면 살았음. 제품에 갇혀서 고객이 진짜 원하는 걸 놓친 거임.\n\n## S — 시장세분화\n### 기준 4개\n- **인구통계**: 나이, 성별, 소득\n- **지리적**: 지역, 기후\n- **심리분석**: 라이프스타일, 개성\n- **행동적**: 사용량, 추구편익, 충성도\n\n### 좋은 세분시장 조건\n측정 가능 / 접근 가능 / 규모 적정 / 차별화 가능 / 실행 가능\n\n## T — 표적시장\n- **비차별적**: 전체를 하나로. 원가 절감\n- **차별적**: 세분시장마다 다르게. 매출 ↑ 비용도 ↑\n- **집중적**: 하나에 몰빵. 자원 적은 기업용, 근데 위험함\n\n## P — 포지셔닝\n고객 머릿속에 자리 잡기.\n> 절차: 경쟁자 확인 → 경쟁자 포지션 분석 → 자사 포지션 개발 → 확인·재포지셔닝\n> 포지셔닝 맵 그려서 **빈 칸** 찾는 게 실무 방식.\n\n## 4P\n**Product / Price / Place / Promotion**\n\n> 🚨 **Positioning은 4P 아님.** STP의 P임. 껴놓고 고르라고 함.\n\n확장판도 나옴.\n- 서비스는 **7P**: +People, Physical evidence, Process\n- 고객 관점 **4C**: Customer value, Cost, Convenience, Communication\n\n▸ 추구편익: 소비자가 그 제품에서 얻으려는 이득."},{"title":"⑨ 제품과 가격 전략","sub":"경영학","body":"## 제품의 세 수준\n- **핵심제품**: 고객이 진짜 사는 편익. 드릴을 사는 사람은 구멍을 산다\n- **실제제품**: 브랜드, 품질, 디자인, 포장\n- **확장제품**: 배송, 설치, A/S, 보증\n\n## 제품수명주기(PLC)\n| 단계 | 매출 | 이익 | 전략 |\n|---|---|---|---|\n| 도입기 | 낮음 | 적자 | 인지도 확보, 광고 집중 |\n| 성장기 | 급증 | 증가 | 시장 확대, 유통 확충 |\n| **성숙기** | 정체 | 정점 후 감소 | **경쟁 최고조**, 차별화·시장 세분화 |\n| 쇠퇴기 | 감소 | 감소 | 철수 또는 원가 절감 |\n\n> **경쟁이 가장 치열한 단계는 성숙기**입니다. 시장이 더 안 커지니 남의 몫을 뺏어야 하기 때문입니다.\n\n## 브랜드\n- **브랜드 자산**: 브랜드 때문에 생기는 추가 가치\n- **브랜드 확장**: 기존 브랜드로 새 제품군에 진출\n- **라인 확장**: 같은 제품군 안에서 품목을 늘림\n\n> 확장은 비용이 적게 들지만 실패하면 모브랜드까지 타격을 입습니다.\n\n## 가격 결정 방법\n- **원가기준**: 원가에 마진을 붙임. 계산이 쉽지만 수요를 무시함\n- **경쟁기준**: 경쟁사 가격을 기준으로\n- **소비자기준**: 소비자가 느끼는 가치를 기준으로\n\n## 신제품 가격전략 (자주 나옴)\n- **스키밍(초기고가)**: 처음에 비싸게 받고 점차 내림. 가격에 둔감한 혁신 수용층에서 마진 회수. 경쟁자 진입이 어려울 때 유효\n- **침투가격(초기저가)**: 처음부터 싸게 팔아 점유율 확보. 규모의 경제가 크고 수요가 탄력적일 때 유효\n\n> 방향이 반대이므로 조건도 반대입니다. 어떤 상황에 어느 쪽이 맞는지를 묻습니다.\n\n## 심리적 가격전략\n- **단수가격**: 9,900원처럼 끝자리를 낮춰 싸 보이게 함\n- **관습가격**: 오랫동안 굳어진 가격\n- **준거가격**: 소비자가 마음속에 갖고 있는 기준 가격\n- **명성가격**: 비쌀수록 품질이 좋다고 느끼는 심리를 이용\n\n## 기타 가격전략\n- **묶음가격**: 여러 제품을 묶어 할인\n- **종속제품 가격**: 본체는 싸게, 소모품은 비싸게. 프린터와 잉크\n- **캡티브 프라이싱**: 종속제품 가격의 다른 이름\n\n▸ 모브랜드: 확장의 바탕이 되는 기존 브랜드.\n▸ 혁신 수용층: 신제품을 가장 먼저 사는 소비자 집단.\n▸ 준거가격: 소비자가 적정하다고 여기는 기준 가격.","alt":"## 제품 3수준\n- **핵심제품**: 진짜 사는 이유. 드릴 사는 사람은 **구멍**을 사는 거임\n- **실제제품**: 브랜드, 품질, 디자인, 포장\n- **확장제품**: 배송, 설치, A/S, 보증\n\n## PLC (제품수명주기) ⭐\n| 단계 | 매출 | 이익 | 특징 |\n|---|---|---|---|\n| 도입기 | 낮음 | **적자** | 인지도 확보 |\n| 성장기 | 급증 | 증가 | 시장 확대 |\n| **성숙기** | 정체 | 감소 시작 | **경쟁 최고조** |\n| 쇠퇴기 | 감소 | 감소 | 철수 |\n\n> 🚨 **경쟁이 제일 치열한 건 성장기가 아니라 성숙기**임.\n> 시장이 더 안 커지니까 남의 파이를 뺏는 수밖에 없음. 그래서 치킨게임이 벌어짐.\n> 도입기에 이익이 **적자**라는 것도 자주 나옴. 광고비가 많이 드니까.\n\n## 브랜드\n- 브랜드 자산 / **브랜드 확장**(다른 제품군) / **라인 확장**(같은 제품군 안)\n> 확장은 싸게 먹히는데 망하면 **본 브랜드까지 같이 죽음.**\n\n## 가격 결정 3방법\n원가기준 / 경쟁기준 / 소비자기준(가치기준)\n\n## 신제품 가격 ⭐\n- **스키밍(초기고가)**: 비싸게 시작해서 내림. 초기에 사는 얼리어답터한테 마진 뽑음. **경쟁자 진입 어려울 때**\n- **침투가격(초기저가)**: 싸게 시작해서 점유율 먹음. **규모의 경제 크고 수요 탄력적일 때**\n\n> 🚨 방향이 반대니까 조건도 반대임.\n> 아이폰 = 스키밍 / 쿠팡 초기 = 침투가격\n> 어떤 상황에 뭐가 맞냐를 물어봄.\n\n## 심리적 가격\n- **단수가격**: 9,900원 (10,000원보다 훨씬 싸 보임)\n- **관습가격**: 오래 굳어진 가격\n- **준거가격**: 내 머릿속 기준 가격\n- **명성가격**: 비싸야 좋아 보이는 심리 이용 (명품)\n\n## 기타\n- **묶음가격**: 세트로 할인\n- **종속제품 가격(캡티브)**: **본체 싸게, 소모품 비싸게**\n> 프린터 싸게 팔고 잉크로 뽑아먹기. 면도기랑 면도날도 같음.\n\n▸ 모브랜드: 확장의 바탕이 되는 기존 브랜드."},{"title":"⑩ 유통과 촉진","sub":"경영학","body":"## 유통경로의 기능\n생산자와 소비자 사이의 간극을 메웁니다.\n- 시간, 장소, 소유의 불일치를 해소\n- 거래 횟수를 줄여 효율을 높임\n\n> 생산자 3명과 소비자 3명이 직접 거래하면 9번의 거래가 필요하지만, 중간상 1명을 두면 6번으로 줄어듭니다. 이것이 **총거래수 최소화의 원칙**입니다.\n\n## 유통경로의 유형\n- **소비재**: 생산자 → 도매상 → 소매상 → 소비자\n- **산업재**: 경로가 짧습니다. 직접 판매가 많습니다\n\n## 유통 집약도\n- **집약적(개방적) 유통**: 가능한 한 많은 점포에서 판매. 편의품(음료, 과자)\n- **선택적 유통**: 일정 자격을 갖춘 점포만. 선매품(가전, 의류)\n- **전속적 유통**: 한 지역에 하나의 점포만. 전문품(고급차, 명품)\n\n> 제품 유형과 유통 방식이 짝을 이룹니다. 이 대응을 묻는 문제가 나옵니다.\n\n## 수직적 마케팅 시스템(VMS)\n- **기업형**: 한 회사가 유통 단계를 소유\n- **계약형**: 프랜차이즈처럼 계약으로 결합\n- **관리형**: 힘 있는 기업이 주도\n\n## 촉진 믹스 네 가지\n- **광고**: 대중매체를 통한 비인적 커뮤니케이션. 도달 범위가 넓지만 피드백이 없음\n- **인적판매**: 직접 만나 파는 것. 설득력이 높지만 비용이 큼\n- **판매촉진**: 쿠폰, 할인, 샘플. 단기 효과가 크지만 브랜드 이미지를 해칠 수 있음\n- **PR(홍보)**: 언론 보도 등. 신뢰도가 높지만 통제가 어려움\n\n> 각각의 장단점을 바꿔 내는 문제가 나옵니다. **광고는 통제 가능하지만 신뢰도가 낮고, PR은 신뢰도가 높지만 통제가 어렵다**는 대비를 기억하세요.\n\n## 푸시 전략과 풀 전략\n- **푸시(Push)**: 생산자가 중간상에게, 중간상이 소비자에게 밀어냄. **인적판매와 중간상 판촉** 중심\n- **풀(Pull)**: 소비자가 찾게 만들어 중간상이 따라오게 함. **광고와 소비자 판촉** 중심\n\n▸ 편의품: 자주 사고 비교 없이 사는 저관여 제품.\n▸ 선매품: 여러 곳을 비교하고 사는 제품.\n▸ 전문품: 브랜드 충성도가 높아 대체를 잘 안 하는 제품.","alt":"## 유통경로가 왜 필요하냐\n시간·장소·소유의 불일치를 메움. 그리고 거래 횟수를 줄임.\n\n> 🚨 **총거래수 최소화의 원칙**\n> 생산자 3명 × 소비자 3명 직거래 = **9번**\n> 중간상 1명 끼면 = 3 + 3 = **6번**\n> 중간상이 낀다고 무조건 비효율이 아니라는 논리임. 계산으로 나옴.\n\n## 유통 집약도 ⭐ (제품 유형과 짝)\n- **집약적(개방적)**: 아무 데나 다 깔기 → **편의품** (음료, 과자)\n- **선택적**: 자격 되는 곳만 → **선매품** (가전, 의류)\n- **전속적**: 한 지역에 딱 하나 → **전문품** (명품, 고급차)\n\n> 🚨 짝을 바꿔서 냄. 편의품-집약적 / 선매품-선택적 / 전문품-전속적.\n> 논리는 간단함. 자주 사는 싼 물건일수록 아무 데나 있어야 함.\n\n## VMS (수직적 마케팅 시스템)\n- 기업형: 직접 소유\n- 계약형: **프랜차이즈**\n- 관리형: 힘센 기업이 주도\n\n## 촉진 믹스 4개 ⭐\n| | 장점 | 단점 |\n|---|---|---|\n| 광고 | 도달 범위 넓음, **통제 가능** | 신뢰도 낮음, 피드백 없음 |\n| 인적판매 | 설득력 최고 | **비용 큼** |\n| 판매촉진 | 단기 효과 큼 | **브랜드 이미지 손상** |\n| PR | **신뢰도 높음** | **통제 어려움** |\n\n> 🚨 **광고 = 통제 O, 신뢰도 낮음 / PR = 통제 X, 신뢰도 높음**\n> 이 대비를 뒤집어서 냄. 광고는 내가 돈 내고 하는 거라 마음대로 할 수 있지만 다들 광고인 줄 앎. PR은 기자가 쓰는 거라 못 건드리지만 사람들이 믿음.\n\n## 푸시 vs 풀 ⭐\n- **푸시**: 생산자 → 중간상 → 소비자로 **밀어냄**. **인적판매·중간상 판촉** 중심\n- **풀**: 소비자가 찾게 만들어 중간상이 **끌려오게**. **광고·소비자 판촉** 중심\n\n> 밀 푸시, 당길 풀. 수단이 뭐냐로 구분함.\n\n▸ 편의품: 비교 안 하고 그냥 사는 것.\n▸ 선매품: 여기저기 비교하고 사는 것."},{"title":"⑪ 생산운영관리","sub":"경영학","body":"## 생산방식의 분류\n- **주문생산 vs 계획생산**\n- **소품종 대량생산 vs 다품종 소량생산**\n- 공정별 배치(Job shop) vs 제품별 배치(Flow shop)\n\n> 다품종 소량생산에는 공정별 배치가, 소품종 대량생산에는 제품별 배치가 맞습니다.\n\n## 라인밸런싱\n조립 라인의 각 공정 작업시간을 고르게 맞추는 작업입니다.\n> 전체 생산 속도는 **가장 느린 공정**이 결정합니다. 이를 **애로공정(병목)**이라고 합니다.\n> 병목을 개선하지 않으면 다른 공정을 아무리 빠르게 해도 전체 산출량이 늘지 않습니다.\n\n## 재고관리\n재고를 갖는 이유는 수요 변동 대응, 규모의 경제, 결품 방지입니다. 반면 보관비와 자금 부담이 생깁니다.\n\n### 경제적 주문량(EOQ)\n주문비용과 재고유지비용의 합을 최소로 만드는 주문량입니다.\n> 한 번에 많이 주문하면 주문 횟수가 줄어 주문비용은 감소하지만 쌓아두는 재고가 늘어 유지비가 증가합니다. 이 두 곡선이 교차하는 지점이 EOQ입니다.\n> **EOQ에서는 연간 주문비용과 연간 재고유지비용이 같아집니다.** 이 성질이 시험에 나옵니다.\n\n가정: 수요가 일정하고 알려져 있으며, 조달기간이 일정하고, 재고부족이 없습니다.\n\n### 안전재고와 재주문점\n- 안전재고: 수요나 조달기간의 변동에 대비한 여유 재고\n- 재주문점 = 조달기간 중 예상 수요 + 안전재고\n\n## JIT와 MRP\n- **JIT(적시생산)**: 필요한 때 필요한 만큼만. 재고를 낭비로 봅니다. **풀(Pull) 방식**이며 간판(칸반)으로 신호를 보냅니다\n- **MRP(자재소요계획)**: 생산계획에서 거꾸로 계산해 자재를 준비합니다. **푸시(Push) 방식**\n\n> JIT는 재고를 극도로 줄이므로 공급이 끊기면 라인이 즉시 멈춥니다. 유연성과 취약성이 동전의 양면입니다.\n\n## 공급사슬관리\n### 채찍효과(Bullwhip Effect)\n소비자 수요의 작은 변동이 유통 단계를 거슬러 올라가며 **점점 크게 증폭**되는 현상입니다.\n> 원인: 수요 예측의 왜곡, 일괄주문, 가격 변동과 할인 행사, 결품 우려로 인한 과대주문\n> 대책: 정보 공유, 주문 단위 축소, 상시저가정책(EDLP)\n\n▸ 애로공정: 전체 흐름을 제약하는 가장 느린 공정.\n▸ 칸반: JIT에서 후공정이 전공정에 필요량을 알리는 신호 카드.\n▸ EDLP: 매일 낮은 가격을 유지해 수요 변동을 줄이는 정책.","alt":"## 생산방식\n- 주문생산 vs 계획생산\n- 소품종 대량 vs 다품종 소량\n> **다품종 소량 → 공정별 배치 / 소품종 대량 → 제품별 배치**\n\n## 라인밸런싱 ⭐\n공정마다 작업시간을 고르게 맞추는 것.\n> 🚨 전체 속도는 **제일 느린 공정**이 결정함. 이게 **애로공정(병목)**.\n> 병목 안 고치고 다른 데만 빠르게 해봤자 전체 산출량은 그대로임.\n> 고속도로 공사 구간 하나 때문에 전체가 막히는 거랑 같음.\n\n## 재고관리\n### EOQ (경제적 주문량) ⭐\n주문비용 + 재고유지비용의 합이 **최소**가 되는 주문량.\n\n> 한 번에 많이 주문 → 주문 횟수 ↓ (주문비용 ↓) 근데 쌓아둠 (유지비 ↑)\n> 조금씩 자주 → 반대\n> 두 곡선이 만나는 지점이 EOQ.\n\n> 🚨 **EOQ에서는 연간 주문비용 = 연간 재고유지비용**임. 이 성질 물어봄.\n\n가정: 수요 일정 / 조달기간 일정 / 재고부족 없음\n\n### 재주문점\n= 조달기간 중 예상 수요 + **안전재고**\n\n## JIT vs MRP ⭐\n- **JIT**: 필요할 때 필요한 만큼. 재고 = 낭비. **풀(Pull)** 방식. **칸반**으로 신호\n- **MRP**: 생산계획에서 역산해 자재 준비. **푸시(Push)** 방식\n\n> 🚨 **JIT = Pull / MRP = Push.** 바꿔서 냄.\n> JIT 약점: 재고가 없으니 **공급 끊기면 라인 즉시 정지**. 코로나 때 반도체 없어서 자동차 못 만든 게 이거임.\n\n## 채찍효과 ⭐\n소비자 수요가 조금 변했는데 유통 단계를 거슬러 올라갈수록 **점점 크게 증폭**됨.\n> 채찍 손잡이는 조금 움직였는데 끝은 크게 휘두르는 모양이라 붙은 이름.\n\n원인: 수요 예측 왜곡 / 일괄주문 / **할인 행사** / 품절 무서워서 과대주문\n대책: **정보 공유** / 주문 단위 축소 / **EDLP(상시저가)**\n\n> 할인 행사가 원인인 게 포인트임. 쌀 때 왕창 사두니까 수요가 튀어 보임. 그래서 EDLP로 가격을 고정하면 변동이 줄어듦.\n\n▸ 칸반: 후공정이 전공정에 \"이만큼 필요\" 알리는 카드."},{"title":"⑫ 품질경영","sub":"경영학","body":"## 품질의 개념\n- **설계품질**: 제품을 어떻게 설계했는가\n- **적합품질**: 설계대로 만들어졌는가\n- **사용품질**: 고객이 쓰면서 느끼는 품질\n\n## 품질비용\n- **예방비용**: 불량을 막기 위한 비용. 교육, 설계 개선\n- **평가비용**: 검사와 시험 비용\n- **내부실패비용**: 출하 전에 발견된 불량. 재작업, 폐기\n- **외부실패비용**: 고객에게 간 뒤 발견된 불량. 리콜, 클레임, 신뢰 손상\n\n> 예방비용을 늘리면 실패비용이 크게 줄어듭니다. **뒤로 갈수록 비용이 기하급수적으로 커집니다.** 이것이 예방에 투자하라는 근거입니다.\n\n## TQM (전사적 품질경영)\n품질을 검사 부서만의 일이 아니라 **전 구성원의 일**로 봅니다.\n- 고객 중심\n- 전원 참여\n- **지속적 개선(카이젠)**\n- 사실에 근거한 의사결정\n\n> 기존 품질관리가 만든 뒤 걸러내는 것이었다면, TQM은 **처음부터 잘 만드는 것**으로 초점을 옮겼습니다.\n\n## 6시그마\n100만 개당 결함 **3.4개** 수준을 목표로 하는 품질 혁신 활동입니다.\n> 추진 절차는 **DMAIC**입니다. Define(정의) → Measure(측정) → Analyze(분석) → Improve(개선) → Control(관리)\n> 벨트 제도로 인력을 육성합니다. 챔피언, 마스터 블랙벨트, 블랙벨트, 그린벨트\n\n## 통계적 품질관리\n### 관리도\n공정이 안정적인지 보는 그래프입니다. 중심선과 관리상한선, 관리하한선을 그립니다.\n> 점이 관리한계를 벗어나면 **이상원인**이 있는 것으로 보고 조치합니다. 한계 안에서 흔들리는 것은 **우연원인**으로 보고 두어도 됩니다.\n\n### 표본검사와 전수검사\n- 전수검사: 모두 검사. 파괴검사에는 쓸 수 없음\n- 표본검사: 일부만 검사. 생산자위험과 소비자위험이 존재\n\n## ISO 9000\n품질경영시스템에 대한 국제 표준입니다. 제품 자체가 아니라 **품질을 관리하는 체계**를 인증합니다.\n> 제품 품질을 보증하는 것이 아니라는 점이 시험 포인트입니다.\n\n▸ 카이젠: 작은 개선을 지속적으로 쌓아가는 방식.\n▸ 우연원인: 공정에 늘 존재하는 자연스러운 변동.\n▸ 이상원인: 조치가 필요한 특별한 원인.","alt":"## 품질비용 4종 ⭐\n- **예방비용**: 불량 막으려는 비용 (교육, 설계)\n- **평가비용**: 검사·시험\n- **내부실패**: 출하 전 발견 (재작업, 폐기)\n- **외부실패**: 고객한테 간 뒤 발견 (**리콜, 클레임**)\n\n> 🚨 **뒤로 갈수록 비용이 기하급수로 커짐.**\n> 설계 단계에서 고치면 1원, 공장에서 고치면 10원, 고객이 발견하면 100원 + 브랜드 신뢰 손상.\n> 그래서 예방에 투자하라는 거임. 이 논리가 나옴.\n\n## TQM\n품질은 검사팀 일이 아니라 **전 직원 일**임.\n- 고객 중심 / 전원 참여 / **지속적 개선(카이젠)** / 사실 기반 의사결정\n\n> 🚨 기존 품질관리 = 만들고 나서 **걸러내기**\n> TQM = **처음부터 잘 만들기**\n> 초점이 옮겨간 게 핵심임.\n\n## 6시그마 ⭐\n목표: 100만 개당 결함 **3.4개**\n> 🚨 숫자 그대로 나옴. 3.4 PPM.\n\n절차 = **DMAIC**\n**D**efine → **M**easure → **A**nalyze → **I**mprove → **C**ontrol\n> 이 순서 물어봄. 정의-측정-분석-개선-관리.\n\n인력: 챔피언 / 마스터 블랙벨트 / 블랙벨트 / 그린벨트\n\n## 관리도\n공정이 안정적인지 보는 그래프. 중심선 + 관리상한 + 관리하한.\n> 🚨 **한계 벗어남 → 이상원인** → 조치해야 함\n> **한계 안에서 흔들림 → 우연원인** → 그냥 둬도 됨\n> 다 잡으려 들면 오히려 공정이 망가짐.\n\n## ISO 9000\n> 🚨 **제품 품질을 인증하는 게 아님.**\n> **품질을 관리하는 시스템**을 인증하는 거임.\n> \"ISO 인증 받으면 제품이 좋다는 뜻\" → 오답. 이거 함정.\n\n▸ 카이젠: 작은 개선을 계속 쌓기."},{"title":"⑬ 재무관리의 기초","sub":"경영학","body":"## 재무관리의 목표\n> **기업가치(주주 부)의 극대화**입니다. 이익 극대화가 아닙니다.\n\n이익 극대화를 목표로 하지 않는 이유는 세 가지입니다.\n- 이익은 회계 기준에 따라 달라질 수 있음\n- **시간가치**를 반영하지 못함\n- **위험**을 반영하지 못함\n\n## 화폐의 시간가치\n오늘의 1만원과 1년 뒤의 1만원은 다릅니다. 오늘 받으면 굴릴 수 있기 때문입니다.\n- **미래가치 FV = PV × (1 + r)^n**\n- **현재가치 PV = FV ÷ (1 + r)^n**\n\n> 이자율 10%일 때 1년 뒤 110만원의 현재가치는 110 ÷ 1.1 = 100만원입니다.\n\n### 연금과 영구연금\n- 연금: 일정 금액이 일정 기간 반복되는 현금흐름\n- **영구연금 현재가치 = C ÷ r**\n\n## 투자안 평가 방법\n### 순현재가치법(NPV)\n미래 현금흐름의 현재가치 합에서 투자액을 뺍니다.\n> **NPV > 0이면 채택**합니다. 여러 안 중에서는 NPV가 가장 큰 것을 고릅니다.\n> 가치가산의 원칙이 성립하고 기업가치 극대화 목표에 부합해 **이론적으로 가장 우수**한 방법으로 평가됩니다.\n\n### 내부수익률법(IRR)\nNPV를 0으로 만드는 할인율입니다.\n> **IRR > 자본비용이면 채택**합니다.\n> 한계: 현금흐름 부호가 여러 번 바뀌면 IRR이 복수로 나오거나 존재하지 않을 수 있고, 재투자수익률 가정이 비현실적입니다. NPV와 결론이 엇갈릴 수 있는데 이때는 **NPV를 따릅니다.**\n\n### 회수기간법\n투자금을 회수하는 데 걸리는 기간입니다. 간단하지만 **화폐의 시간가치를 무시**하고 회수 이후의 현금흐름도 무시합니다.\n\n### 수익성지수(PI)\n현금흐름 현재가치 ÷ 투자액. **PI > 1이면 채택**합니다. 투자 규모가 다른 안을 비교할 때 유용합니다.\n\n▸ 자본비용: 자금을 조달하는 데 드는 비용. 할인율로 쓰입니다.\n▸ 가치가산의 원칙: 여러 투자안의 가치를 더할 수 있다는 성질.\n▸ 현금흐름: 실제로 오가는 현금. 회계상 이익과 다릅니다.","alt":"## 재무관리 목표 ⭐\n> 🚨 **기업가치(주주 부)의 극대화.** **이익 극대화가 아님.**\n\n왜 이익 극대화가 아니냐?\n- 이익은 회계 기준 따라 **조작 가능**\n- **시간가치** 무시함 (올해 100억이랑 10년 뒤 100억이 같냐)\n- **위험** 무시함 (도박해서 번 100억이랑 안정적 100억이 같냐)\n\n이 세 가지가 그대로 선택지로 나옴.\n\n## 화폐의 시간가치\n오늘 1만원 ≠ 1년 뒤 1만원. 오늘 받으면 굴릴 수 있으니까.\n- **FV = PV × (1+r)ⁿ**\n- **PV = FV ÷ (1+r)ⁿ**\n\n> 이자율 10%, 1년 뒤 110만원 → 현재가치 = 110/1.1 = **100만원**\n\n- **영구연금 현재가치 = C ÷ r** (이건 공식 외워)\n\n## 투자안 평가 4방법 ⭐\n\n### NPV (순현재가치)\n미래 현금흐름 현재가치 합 − 투자액\n> **NPV > 0 → 채택.** 여러 개면 제일 큰 거.\n> **이론적으로 제일 우수**함. 기업가치 극대화 목표에 딱 맞으니까.\n\n### IRR (내부수익률)\nNPV를 0으로 만드는 할인율.\n> **IRR > 자본비용 → 채택**\n> 🚨 한계: 현금흐름 부호가 여러 번 바뀌면 IRR이 **여러 개** 나옴. 재투자 가정도 비현실적.\n> **NPV랑 결론 갈리면 NPV 따름.** 이거 나옴.\n\n### 회수기간법\n투자금 뽑는 데 걸리는 기간.\n> 🚨 **시간가치 무시** + 회수 후 현금흐름 무시. 간단한 대신 허술함.\n\n### 수익성지수(PI)\n현재가치 ÷ 투자액. **PI > 1 → 채택**\n> 투자 규모가 다른 안 비교할 때 유용.\n\n▸ 자본비용: 돈 빌려오는 비용. 할인율로 씀.\n▸ 현금흐름: 실제 오가는 현금. 회계 이익이랑 다름."},{"title":"⑭ 자본구조와 포트폴리오","sub":"경영학","body":"## 자본조달의 두 갈래\n- **자기자본**: 주식 발행. 갚을 의무가 없지만 배당과 지분 희석 부담\n- **타인자본**: 차입과 사채. 이자를 내야 하지만 **이자비용이 손금으로 인정되어 절세효과**가 있습니다\n\n## 가중평균자본비용(WACC)\n자기자본비용과 타인자본비용을 자본구조 비중으로 가중평균한 값입니다.\n> 타인자본비용은 **세후**로 계산합니다. 이자가 세금을 줄여주기 때문입니다.\n> WACC는 투자안 평가의 할인율로 쓰이며, WACC가 낮을수록 기업가치가 높아집니다.\n\n## MM 이론\n### 무관련 명제 (세금 없는 경우)\n완전자본시장에서는 **자본구조가 기업가치에 영향을 주지 않습니다.** 부채를 늘려도 기업가치는 그대로입니다.\n> 부채를 늘리면 값싼 타인자본 비중이 커지지만, 동시에 주주의 위험이 커져 자기자본비용이 올라가 상쇄됩니다.\n\n### 수정 명제 (법인세 고려)\n이자의 절세효과 때문에 **부채가 많을수록 기업가치가 커집니다.** 이론상 부채비율 100%가 최적이 됩니다.\n\n### 현실의 절충\n파산비용과 대리인비용을 고려하면 부채를 무한정 늘릴 수 없습니다. 절세효과와 파산비용이 균형을 이루는 지점에 **최적 자본구조**가 존재한다고 봅니다. 이를 **상충이론**이라고 합니다.\n\n## 레버리지\n- **영업레버리지**: 고정비 비중이 클수록 매출 변동에 따른 영업이익 변동이 커집니다\n- **재무레버리지**: 부채가 많을수록 영업이익 변동에 따른 순이익 변동이 커집니다\n- 결합레버리지 = 영업 × 재무\n\n> 레버리지는 이익도 손실도 함께 키웁니다. 좋기만 한 것이 아닙니다.\n\n## 포트폴리오 이론\n### 위험의 분류\n- **체계적 위험**: 시장 전체 요인. 금리, 경기, 전쟁. **분산으로 제거 불가**\n- **비체계적 위험**: 개별 기업 요인. 분산으로 제거 가능\n\n> 종목 수를 늘리면 비체계적 위험은 줄지만 일정 수준을 넘으면 감소 효과가 급격히 둔화됩니다. 체계적 위험이 바닥으로 남기 때문입니다.\n\n### 분산효과\n상관계수가 낮을수록 분산효과가 큽니다. **-1이면 위험을 완전히 제거**할 수 있습니다.\n\n### CAPM\n> **기대수익률 = 무위험이자율 + 베타 × (시장수익률 − 무위험이자율)**\n\n베타는 시장 대비 민감도입니다. 1보다 크면 공격적, 작으면 방어적입니다.\n> 무위험이자율 3%, 시장위험프리미엄 6%, 베타 1.2면 → 3 + 1.2 × 6 = **10.2%**\n\n### 배당이론\n- **배당무관련설(MM)**: 완전시장에서 배당정책은 기업가치와 무관\n- **고객효과**: 투자자마다 선호하는 배당 정책이 달라 그에 맞는 주주가 모임\n- **신호효과**: 배당 증가는 경영진이 미래를 긍정적으로 본다는 신호로 해석됨\n\n▸ 손금: 세법상 비용으로 인정되어 소득을 줄여주는 항목.\n▸ 대리인비용: 주주와 경영자, 채권자 사이의 이해 충돌에서 생기는 비용.\n▸ 베타: 시장 변동에 대한 개별 자산의 민감도.","alt":"## 돈 조달하는 2가지\n- **자기자본**(주식): 갚을 의무 없음. 근데 배당 줘야 하고 지분 나눠야 함\n- **타인자본**(빚): 이자 내야 함. 근데 **이자가 비용 처리돼서 세금이 줄어듦(절세효과)**\n\n## WACC\n자기자본비용 + 타인자본비용을 비중으로 가중평균.\n> 🚨 타인자본비용은 **세후**로 계산함. 이자가 세금 깎아주니까.\n> WACC 낮을수록 기업가치 높음.\n\n## MM 이론 ⭐\n### 무관련 명제 (세금 없을 때)\n> **자본구조는 기업가치와 무관.** 빚을 늘려도 가치 그대로.\n>\n> 왜? 빚이 싸긴 한데, 빚이 늘면 주주가 위험해져서 **자기자본비용이 올라감.** 딱 상쇄됨.\n\n### 수정 명제 (법인세 있을 때)\n이자 절세효과 때문에 **빚 많을수록 가치 ↑.** 이론상 부채 100%가 최적.\n\n### 현실\n> 🚨 근데 진짜 100% 빚으로 하면? 망함.\n> **파산비용 + 대리인비용** 때문임. 그래서 절세효과랑 파산비용이 균형 잡히는 지점에 **최적 자본구조**가 있음 = **상충이론**\n\n## 레버리지\n- **영업레버리지**: **고정비** 클수록 영업이익 변동 큼\n- **재무레버리지**: **부채** 많을수록 순이익 변동 큼\n- 결합 = 둘 곱하기\n\n> 🚨 레버리지는 **이익도 손실도 같이** 키움. 좋기만 한 게 아님.\n\n## 포트폴리오\n### 위험 2종\n- **체계적**: 시장 전체. 금리, 경기, 전쟁. **분산으로 제거 불가**\n- **비체계적**: 개별 기업. 분산으로 제거 가능\n\n> 종목 늘리면 비체계적 위험은 줄어듦. 근데 30개쯤 넘으면 효과 거의 없음. 체계적 위험이 바닥으로 깔려 있으니까.\n\n### 분산효과\n상관계수 낮을수록 큼. **-1이면 위험 완전 제거** 가능.\n\n### CAPM ⭐\n> **기대수익률 = 무위험이자율 + 베타 × (시장수익률 − 무위험이자율)**\n\n무위험 3%, 시장프리미엄 6%, 베타 1.2\n→ 3 + 1.2×6 = **10.2%**\n\n베타 1보다 크면 공격적, 작으면 방어적.\n\n## 배당이론\n- **MM 배당무관련설**: 완전시장이면 배당정책 무관\n- **고객효과**: 배당 좋아하는 사람끼리 모임\n- **신호효과**: 배당 늘리면 \"회사가 자신 있나 보다\" 신호로 읽힘\n\n▸ 손금: 세법상 비용 인정되는 항목."},{"title":"⑮ 회계의 기초","sub":"경영학","body":"## 회계등식\n> **자산 = 부채 + 자본**\n\n이것이 재무상태표의 뼈대입니다. 왼쪽에 자산, 오른쪽에 부채와 자본을 놓아 항상 균형을 이룹니다.\n> 자산에서 부채를 뺀 것이 자본, 즉 순자산입니다.\n\n## 재무제표 다섯 가지\n- **재무상태표**: **일정 시점**의 자산·부채·자본. 저량(stock)\n- **손익계산서**: **일정 기간**의 수익·비용·이익. 유량(flow)\n- **현금흐름표**: 일정 기간의 현금 유출입. 영업·투자·재무활동으로 구분\n- **자본변동표**: 일정 기간의 자본 변동\n- **주석**: 본문에 담지 못한 설명\n\n> 시점을 보는 것은 **재무상태표 하나뿐**입니다. 이 구분을 묻는 문제가 자주 나옵니다.\n\n## 발생주의\n현금이 오갔는지가 아니라 **거래가 발생한 시점**에 수익과 비용을 인식합니다.\n> 12월에 물건을 팔고 대금은 1월에 받아도 매출은 12월에 잡습니다.\n> 발생주의 때문에 매출채권, 미지급비용, 선급비용 같은 계정이 생깁니다.\n> 그리고 **이익이 났는데 현금이 없는** 상황이 생길 수 있습니다. 흑자도산의 원인입니다.\n\n## 수익·비용 대응의 원칙\n수익을 인식한 기간에 그 수익을 얻기 위해 쓴 비용을 함께 인식합니다.\n\n## 계정의 분류\n- **자산**: 유동자산(당좌자산, 재고자산), 비유동자산(투자·유형·무형자산)\n- **부채**: 유동부채(1년 내 만기), 비유동부채\n- **자본**: 자본금, 자본잉여금, 이익잉여금 등\n\n> 유동과 비유동을 가르는 기준은 **1년** 또는 정상영업주기입니다.\n\n## 감가상각\n유형자산의 취득원가를 사용 기간에 나누어 비용으로 배분하는 절차입니다.\n> 자산의 가치를 평가하는 것이 아니라 **원가를 배분**하는 것입니다. 이 표현이 그대로 나옵니다.\n\n- **정액법** = (취득원가 − 잔존가치) ÷ 내용연수\n- **정률법**: 기초 장부금액에 일정률을 곱함. 초기에 비용이 크게 잡힘\n- 생산량비례법\n\n> 취득원가 1,000만, 잔존가치 100만, 내용연수 5년 → 정액법 연 **180만원**\n\n## 재고자산 평가\n- **선입선출법(FIFO)**: 먼저 산 것부터 팔린 것으로 봄\n- **후입선출법(LIFO)**: 나중에 산 것부터. **한국채택국제회계기준에서는 인정되지 않습니다**\n- 가중평균법\n\n> 물가 상승기에 선입선출법을 쓰면 싼 재고가 먼저 나가므로 **매출원가가 낮고 이익과 기말재고가 높게** 나타납니다.\n\n▸ 매출채권: 팔았지만 아직 못 받은 돈.\n▸ 흑자도산: 장부상 이익은 났는데 현금이 없어 망하는 것.\n▸ 잔존가치: 내용연수가 끝났을 때 남을 것으로 보는 가치.","alt":"## 회계등식\n> **자산 = 부채 + 자본**\n왼쪽 자산, 오른쪽 부채+자본. 항상 균형.\n자산 − 부채 = 자본(순자산).\n\n## 재무제표 5개 ⭐\n- **재무상태표**: **일정 시점**. 저량\n- **손익계산서**: 일정 기간. 유량\n- **현금흐름표**: 기간. 영업·투자·재무 3구분\n- **자본변동표**: 기간\n- **주석**\n\n> 🚨 **시점을 보는 건 재무상태표 하나뿐임.** 나머지 다 기간.\n> \"일정 시점의 재무상태를 나타내는 것은?\" → 재무상태표. 이거 무조건 나옴.\n\n## 발생주의 ⭐\n현금이 아니라 **거래가 발생한 때** 인식.\n> 12월에 팔고 돈은 1월에 받음 → 매출은 **12월**에 잡음.\n\n> 🚨 그래서 **이익은 났는데 통장에 돈이 없는** 일이 생김.\n> 이게 **흑자도산**임. 장부는 흑자인데 당장 줄 돈이 없어서 망하는 거.\n> 매출채권, 미지급비용, 선급비용 같은 계정이 다 발생주의 때문에 생김.\n\n## 계정 분류\n- 자산: 유동(당좌·재고) / 비유동(투자·유형·무형)\n- 부채: 유동 / 비유동\n- 자본: 자본금, 자본잉여금, 이익잉여금\n\n> 유동/비유동 가르는 기준 = **1년** 또는 정상영업주기\n\n## 감가상각 ⭐\n> 🚨 **가치 평가가 아니라 원가 배분임.**\n> \"자산의 가치를 평가하는 절차\" → **오답.** 얼마짜리인지 재는 게 아니라 산 값을 기간에 나눠 뿌리는 거임.\n\n- **정액법 = (취득원가 − 잔존가치) ÷ 내용연수**\n- **정률법**: 초기에 비용 많이 잡힘\n- 생산량비례법\n\n> 1000만 / 잔존 100만 / 5년 → (1000−100)/5 = **연 180만원**\n> 🚨 잔존가치 빼는 거 까먹지 마셈. 200만원 나오면 틀린 거임.\n\n## 재고자산 평가\n- **선입선출(FIFO)**: 먼저 산 거 먼저 나감\n- **후입선출(LIFO)**: 🚨 **한국채택국제회계기준(K-IFRS)에서 인정 안 됨**\n- 가중평균법\n\n> 🚨 물가 오를 때 선입선출 쓰면?\n> 싼 거 먼저 나감 → **매출원가 낮음 → 이익 높음 → 기말재고도 높음**\n> 방향 하나만 잡으면 나머지가 따라옴.\n\n▸ 흑자도산: 장부는 흑자인데 현금 없어서 망함."},{"title":"⑯ 재무비율과 원가분석","sub":"경영학","body":"## 재무비율 네 갈래\n### 유동성 비율 (단기 지급능력)\n- **유동비율 = 유동자산 ÷ 유동부채**. 200% 이상이면 양호하다고 봅니다\n- **당좌비율 = 당좌자산 ÷ 유동부채**. 재고자산을 뺀 것이라 더 엄격합니다\n\n> 재고는 당장 현금으로 바꾸기 어렵기 때문에 빼고 보는 것입니다.\n\n### 안정성(레버리지) 비율\n- **부채비율 = 부채총계 ÷ 자기자본**. 100% 이하가 안정적\n- 이자보상비율 = 영업이익 ÷ 이자비용. **1 미만이면 영업이익으로 이자도 못 냅니다**\n\n### 수익성 비율\n- **ROE = 당기순이익 ÷ 자기자본**. 주주 관점\n- **ROA = 당기순이익 ÷ 총자산**. 자산 활용 관점\n- 매출액순이익률 = 당기순이익 ÷ 매출액\n\n### 활동성 비율\n- 총자산회전율 = 매출액 ÷ 총자산\n- 재고자산회전율 = 매출원가 ÷ 평균재고. 높을수록 재고가 빨리 돕니다\n\n## 듀폰 분석\n> **ROE = 매출액순이익률 × 총자산회전율 × (총자산 ÷ 자기자본)**\n\n수익성, 활동성, 레버리지 세 요소로 ROE를 분해합니다. ROE가 높아도 그것이 레버리지 때문인지 진짜 수익성 때문인지 구분할 수 있습니다.\n\n## 원가의 분류\n- **고정비 vs 변동비**: 조업도에 따라 변하는가\n- **직접비 vs 간접비**: 특정 제품에 직접 추적할 수 있는가\n- **제품원가 vs 기간원가**\n\n> 직접재료비 + 직접노무비 + 제조간접비 = **제조원가**\n\n## 손익분기점(BEP)\n> **BEP 판매량 = 고정비 ÷ (단위당 판매가 − 단위당 변동비)**\n> 분모를 **단위당 공헌이익**이라고 합니다.\n\n고정비 1,000만원, 판매가 5만원, 변동비 3만원이면\n→ 공헌이익 2만원 → BEP = 1,000만 ÷ 2만 = **500개**\n\n### 목표이익 달성 판매량\n> **(고정비 + 목표이익) ÷ 단위당 공헌이익**\n\n### 공헌이익률\n= 공헌이익 ÷ 매출액. 금액 기준 BEP를 구할 때 씁니다.\n> **BEP 매출액 = 고정비 ÷ 공헌이익률**\n\n## 안전한계\n실제 매출이 손익분기점을 얼마나 넘어서는지를 나타냅니다. 클수록 여유가 있습니다.\n\n▸ 공헌이익: 매출에서 변동비를 뺀 것. 고정비 회수에 기여하는 몫.\n▸ 조업도: 생산이나 판매의 수준.\n▸ 이자보상비율: 영업이익으로 이자를 몇 배 감당할 수 있는지.","alt":"## 재무비율 4갈래\n\n### 유동성 (단기 지급능력)\n- **유동비율 = 유동자산 ÷ 유동부채** (200% 이상 양호)\n- **당좌비율 = 당좌자산 ÷ 유동부채**\n\n> 🚨 차이는 **재고자산**임. 당좌비율은 재고를 뺌.\n> 재고는 당장 현금화가 안 되니까. 더 빡센 기준임.\n\n### 안정성\n- **부채비율 = 부채 ÷ 자기자본** (100% 이하 안정)\n- **이자보상비율 = 영업이익 ÷ 이자비용**\n> 🚨 **1 미만이면 영업해서 번 돈으로 이자도 못 냄.** 좀비기업임.\n\n### 수익성\n- **ROE = 순이익 ÷ 자기자본** (주주 관점)\n- **ROA = 순이익 ÷ 총자산** (자산 관점)\n\n> 🚨 ROE랑 ROA 분모 바꿔서 냄. E는 Equity(자기자본), A는 Asset(자산).\n\n### 활동성\n- 총자산회전율 = 매출액 ÷ 총자산\n- 재고자산회전율 = 매출원가 ÷ 평균재고 (높을수록 잘 돎)\n\n## 듀폰 분석 ⭐\n> **ROE = 매출액순이익률 × 총자산회전율 × (총자산÷자기자본)**\n> = 수익성 × 활동성 × **레버리지**\n\n> 🚨 왜 쓰냐면, ROE가 높아도 그게 **진짜 잘해서인지 빚 왕창 써서인지** 구분하려고.\n> 마지막 항이 레버리지라 빚만 늘려도 ROE가 올라감. 그래서 쪼개보는 거임.\n\n## 원가 분류\n- 고정비 vs 변동비 (조업도 따라 변하나)\n- 직접비 vs 간접비 (제품에 직접 추적되나)\n> **직접재료비 + 직접노무비 + 제조간접비 = 제조원가**\n\n## 손익분기점 ⭐ (계산 무조건 나옴)\n> **BEP 수량 = 고정비 ÷ 단위당 공헌이익**\n> **단위당 공헌이익 = 판매가 − 변동비**\n\n고정비 1000만 / 판매가 5만 / 변동비 3만\n→ 공헌이익 = 2만\n→ BEP = 1000만 ÷ 2만 = **500개**\n\n### 목표이익 있으면\n> **(고정비 + 목표이익) ÷ 단위당 공헌이익**\n> 고정비에 목표이익을 더해서 똑같이 나누면 됨.\n\n### 금액으로 구하려면\n> **BEP 매출액 = 고정비 ÷ 공헌이익률**\n> (공헌이익률 = 공헌이익 ÷ 매출액)\n\n## 안전한계\n실제 매출이 BEP를 얼마나 넘냐. 클수록 여유 있음.\n\n▸ 공헌이익: 매출 − 변동비. 고정비 갚는 데 기여하는 몫."}],"questions":[{"sub":"경영학","q":"유동비율을 구하는 산식으로 옳은 것은?","o":["유동자산 ÷ 유동부채","당좌자산 ÷ 유동부채","유동부채 ÷ 자기자본","매출액 ÷ 총자산"],"a":0,"e":"유동비율은 유동자산을 유동부채로 나눈 값으로 단기 지급능력을 봅니다. 재고자산을 뺀 당좌자산으로 계산하면 당좌비율이고, 유동부채를 자기자본으로 나눈 것은 부채비율의 일부 형태입니다."},{"sub":"경영학","q":"일정 시점의 재무상태를 나타내는 재무제표는?","o":["손익계산서","재무상태표","현금흐름표","자본변동표"],"a":1,"e":"재무상태표는 특정 시점의 자산·부채·자본을 보여주는 저량(stock) 개념의 표입니다. 손익계산서, 현금흐름표, 자본변동표는 일정 기간의 변동을 보여주는 유량(flow) 개념입니다."},{"sub":"경영학","q":"이자율이 연 10%일 때 1년 후 받게 될 110만원의 현재가치는?","o":["99만원","100만원","101만원","110만원"],"a":1,"e":"현재가치는 미래가치를 (1 + 이자율)로 나눈 값이므로 110 ÷ 1.1 = 100만원입니다. 화폐의 시간가치 문제는 할인율을 분모에 두는 구조만 익히면 형태가 바뀌어도 대응됩니다."},{"sub":"경영학","q":"고정비가 1,000만원, 단위당 판매가격이 5만원, 단위당 변동비가 3만원일 때 손익분기점 판매량은?","o":["200개","333개","500개","1,000개"],"a":2,"e":"단위당 공헌이익은 5만 - 3만 = 2만원이고, 손익분기점 수량은 고정비를 단위당 공헌이익으로 나눈 값이므로 1,000만 ÷ 2만 = 500개입니다."},{"sub":"경영학","q":"마케팅 믹스 4P에 해당하지 않는 것은?","o":["Product","Price","Promotion","Positioning"],"a":3,"e":"4P는 Product, Price, Place, Promotion입니다. Positioning은 STP 전략의 마지막 단계로 4P와는 다른 층위의 개념입니다."},{"sub":"경영학","q":"STP 전략의 순서로 옳은 것은?","o":["표적시장 선정 → 시장세분화 → 포지셔닝","시장세분화 → 표적시장 선정 → 포지셔닝","포지셔닝 → 시장세분화 → 표적시장 선정","시장세분화 → 포지셔닝 → 표적시장 선정"],"a":1,"e":"먼저 시장을 나누고(Segmentation), 그중 공략할 시장을 고르고(Targeting), 그 시장에서 자사 제품의 위치를 각인시킵니다(Positioning)."},{"sub":"경영학","q":"매슬로우의 욕구단계이론에서 가장 상위에 있는 욕구는?","o":["안전의 욕구","소속과 애정의 욕구","존경의 욕구","자아실현의 욕구"],"a":3,"e":"생리적 욕구 → 안전 → 소속과 애정 → 존경 → 자아실현 순입니다. 하위 욕구가 충족되어야 상위 욕구가 동기부여 요인이 된다는 것이 이 이론의 핵심 가정입니다."},{"sub":"경영학","q":"허즈버그의 2요인이론에서 위생요인에 해당하는 것은?","o":["성취감","인정","작업조건과 임금","일 자체의 책임감"],"a":2,"e":"위생요인은 임금, 작업조건, 회사 정책, 대인관계처럼 충족되지 않으면 불만을 낳지만 충족되어도 적극적 만족을 주지 못하는 요인입니다. 성취, 인정, 책임, 성장은 동기요인입니다."},{"sub":"경영학","q":"포터의 산업구조분석(5 Forces)에 포함되지 않는 것은?","o":["기존 기업 간 경쟁","신규 진입자의 위협","대체재의 위협","정부 규제의 강도"],"a":3,"e":"5 Forces는 기존 경쟁, 신규 진입 위협, 대체재 위협, 구매자의 교섭력, 공급자의 교섭력입니다. 정부 규제는 산업환경 요인이긴 하나 이 모형의 다섯 요인에는 포함되지 않습니다."},{"sub":"경영학","q":"취득원가 1,000만원, 잔존가치 100만원, 내용연수 5년인 기계를 정액법으로 상각할 때 연간 감가상각비는?","o":["150만원","180만원","200만원","220만원"],"a":1,"e":"정액법은 (취득원가 - 잔존가치)를 내용연수로 나눕니다. (1,000만 - 100만) ÷ 5 = 180만원입니다. 잔존가치를 빼지 않고 계산하지 않도록 주의하세요."},{"sub":"경영학","q":"회계등식으로 옳은 것은?","o":["자산 = 부채 + 자본","자산 = 부채 - 자본","자본 = 자산 + 부채","수익 = 비용 + 자산"],"a":0,"e":"자산은 부채와 자본의 합과 항상 일치하며 이것이 재무상태표의 기본 구조입니다. 자산에서 부채를 뺀 값이 자본, 즉 순자산입니다."},{"sub":"경영학","q":"발생주의 회계에 관한 설명으로 옳은 것은?","o":["현금이 실제로 오간 시점에 수익과 비용을 인식한다","거래가 발생한 시점에 수익과 비용을 인식한다","수익만 현금주의로 인식한다","중소기업에만 적용된다"],"a":1,"e":"발생주의는 현금 수수와 무관하게 거래가 발생한 기간에 인식하므로 기간 손익이 정확해집니다. 매출채권, 미지급비용, 선급비용 같은 계정이 여기서 생깁니다."},{"sub":"경영학","q":"물가가 지속적으로 상승하는 상황에서 선입선출법을 적용할 때 나타나는 결과는?","o":["매출원가가 높아지고 당기순이익이 낮아진다","매출원가가 낮아지고 당기순이익이 높아진다","기말재고가 과소평가된다","후입선출법과 결과가 같다"],"a":1,"e":"선입선출법은 먼저 산 싼 재고를 먼저 팔린 것으로 보므로 매출원가가 낮게 잡히고 이익과 기말재고가 높게 나타납니다."},{"sub":"경영학","q":"부채비율을 구하는 산식으로 옳은 것은?","o":["부채총계 ÷ 자기자본","부채총계 ÷ 자산총계","자기자본 ÷ 자산총계","유동부채 ÷ 유동자산"],"a":0,"e":"부채비율은 타인자본을 자기자본으로 나눈 값으로 재무 안정성을 봅니다. 부채를 자산으로 나눈 것은 부채구성비율입니다."},{"sub":"경영학","q":"자기자본이익률(ROE)의 산식으로 옳은 것은?","o":["당기순이익 ÷ 자기자본","당기순이익 ÷ 총자산","영업이익 ÷ 매출액","매출액 ÷ 자기자본"],"a":0,"e":"ROE는 주주가 투자한 자본으로 얼마의 이익을 냈는지 보는 지표입니다. 당기순이익을 총자산으로 나누면 ROA가 됩니다."},{"sub":"경영학","q":"순현재가치법(NPV)에 따른 투자안 채택 기준으로 옳은 것은?","o":["NPV가 0보다 크면 채택","NPV가 0보다 작으면 채택","NPV가 1보다 크면 채택","NPV와 무관하게 회수기간이 짧으면 채택"],"a":0,"e":"NPV가 양수라는 것은 투자안이 자본비용을 넘는 가치를 창출한다는 뜻입니다. 여러 투자안을 비교할 때는 NPV가 가장 큰 것을 선택합니다."},{"sub":"경영학","q":"가중평균자본비용(WACC)에 관한 설명으로 옳은 것은?","o":["타인자본비용만을 의미한다","자기자본비용과 타인자본비용을 자본구조 비중으로 가중평균한 값이다","항상 자기자본비용보다 높다","법인세와 무관하다"],"a":1,"e":"WACC는 기업이 조달한 자본 전체의 평균 비용이며 투자안 평가의 할인율로 쓰입니다. 이자비용의 절세효과 때문에 타인자본비용은 세후로 계산합니다."},{"sub":"경영학","q":"BCG 매트릭스에서 시장성장률은 낮으나 상대적 시장점유율이 높은 사업은?","o":["물음표","별","현금젖소","개"],"a":2,"e":"현금젖소는 추가 투자 부담이 적으면서 현금을 창출하므로 다른 사업의 자금원이 됩니다. 성장률과 점유율이 모두 높으면 별, 모두 낮으면 개입니다."},{"sub":"경영학","q":"앤소프의 제품시장 매트릭스에서 기존 시장에 기존 제품을 더 많이 판매하는 전략은?","o":["시장침투","시장개발","제품개발","다각화"],"a":0,"e":"시장침투는 위험이 가장 낮은 성장전략입니다. 기존 제품을 새 시장에 팔면 시장개발, 기존 시장에 새 제품을 내면 제품개발, 둘 다 새로우면 다각화입니다."},{"sub":"경영학","q":"매트릭스 조직의 단점으로 옳은 것은?","o":["전문성이 축적되지 않는다","명령일원화의 원칙이 지켜지지 않아 갈등이 생길 수 있다","환경 변화에 대응하기 어렵다","인력을 유연하게 배치할 수 없다"],"a":1,"e":"매트릭스 조직은 기능과 프로젝트 두 계통의 지시를 받으므로 보고 체계가 이원화됩니다. 전문성 축적과 인력 활용의 유연성은 장점입니다."},{"sub":"경영학","q":"테일러의 과학적 관리법의 핵심 내용으로 옳은 것은?","o":["시간연구와 동작연구를 통한 표준 작업량 설정","인간관계와 비공식 집단의 중시","자아실현 욕구의 충족","환경 적합성에 따른 조직 설계"],"a":0,"e":"테일러는 작업을 과학적으로 분석해 표준을 정하고 차별성과급을 적용했습니다. 인간관계를 중시한 것은 호손실험에서 출발한 인간관계론입니다."},{"sub":"경영학","q":"호손실험이 밝혀낸 주요 결론은?","o":["물리적 작업조건이 생산성을 좌우한다","임금 수준만이 동기부여 요인이다","비공식 조직과 심리적 요인이 생산성에 영향을 준다","분업의 정도가 생산성을 결정한다"],"a":2,"e":"조명 밝기 같은 물리적 조건보다 관심받고 있다는 인식과 동료 관계가 생산성에 크게 작용한다는 점이 확인되었습니다. 이것이 인간관계론의 출발점입니다."},{"sub":"경영학","q":"브룸의 기대이론에서 동기부여의 크기를 결정하는 세 요소는?","o":["기대, 수단성, 유인가","위생요인, 동기요인, 성취","존재, 관계, 성장","공정성, 비교, 보상"],"a":0,"e":"동기의 강도는 기대와 수단성, 유인가의 곱으로 결정되며 하나라도 0이면 동기가 생기지 않습니다. 존재와 관계, 성장은 알더퍼의 ERG 이론입니다."},{"sub":"경영학","q":"목표관리(MBO)의 특징으로 옳지 않은 것은?","o":["상급자와 하급자가 함께 목표를 설정한다","목표는 구체적이고 측정 가능해야 한다","일정 기간 후 결과를 함께 평가한다","목표는 상급자가 일방적으로 지시한다"],"a":3,"e":"MBO는 참여를 통한 목표 설정이 핵심입니다. 일방적 지시는 MBO의 취지에 반하며, 계량화가 어려운 업무에는 적용이 힘들다는 한계가 있습니다."},{"sub":"경영학","q":"한 가지 두드러진 특성이 다른 평가 항목 전체에 영향을 미치는 인사평가 오류는?","o":["관대화 경향","중심화 경향","후광효과","최근효과"],"a":2,"e":"후광효과는 인상적인 한 특성이 전반적 평가를 물들이는 오류입니다. 관대화는 후하게, 중심화는 중간으로 몰리는 경향이며 최근효과는 최근 실적만 반영하는 오류입니다."},{"sub":"경영학","q":"직무분석의 결과로 직무의 내용과 요건을 정리한 문서 중 사람의 자격요건을 기술한 것은?","o":["직무기술서","직무명세서","직무평가표","조직도"],"a":1,"e":"직무기술서는 일의 내용과 책임, 작업조건을 담고 직무명세서는 그 일을 수행할 사람의 학력, 경험, 능력을 담습니다."},{"sub":"경영학","q":"제품수명주기에서 매출 증가율이 둔화되고 경쟁이 가장 치열해지는 단계는?","o":["도입기","성장기","성숙기","쇠퇴기"],"a":2,"e":"성숙기에는 시장이 포화되어 점유율 경쟁이 심해지고 가격 인하와 차별화 압력이 커집니다. 도입기에는 인지도 확보, 성장기에는 시장 확대가 과제입니다."},{"sub":"경영학","q":"신제품을 처음에 높은 가격으로 출시한 뒤 점차 가격을 내리는 전략은?","o":["시장침투 가격전략","스키밍 가격전략","원가가산 가격전략","묶음 가격전략"],"a":1,"e":"스키밍은 가격에 둔감한 초기 수용자에게서 높은 마진을 회수한 뒤 가격을 낮춰 시장을 넓힙니다. 반대로 처음부터 낮게 책정해 점유율을 확보하는 것이 침투 가격전략입니다."},{"sub":"경영학","q":"필요한 때에 필요한 양만큼 생산하여 재고를 최소화하는 생산방식은?","o":["JIT 생산방식","대량생산방식","배치생산방식","주문생산방식"],"a":0,"e":"JIT는 도요타에서 출발한 방식으로 재고를 낭비로 보고 이를 제거하는 데 초점을 둡니다. 다만 공급망이 끊기면 생산이 즉시 멈추는 취약성이 있습니다."},{"sub":"경영학","q":"영업레버리지가 높은 기업의 특징으로 옳은 것은?","o":["고정비 비중이 높아 매출 변동에 따른 영업이익 변동폭이 크다","변동비 비중이 높아 이익이 안정적이다","부채가 전혀 없다","손익분기점이 매우 낮다"],"a":0,"e":"고정비 비중이 크면 매출이 늘 때 이익이 급증하지만 줄 때 손실도 급격히 커집니다. 부채 사용에 따른 이익 확대 효과는 재무레버리지입니다."},{"sub":"보험학","q":"보험료 총액과 보험금 총액이 균형을 이루어야 한다는 원칙은?","o":["수지상등의 원칙","급부·반대급부 균등의 원칙","이득금지의 원칙","실손보상의 원칙"],"a":0,"e":"수지상등은 보험사 전체를 놓고 들어오는 돈과 나가는 돈이 같아야 한다는 단체 기준의 원칙입니다. 개별 계약자의 보험료가 사고확률과 보험금의 곱과 같아야 한다는 것은 급부·반대급부 균등의 원칙으로, 이쪽은 개인 기준입니다."},{"sub":"보험학","q":"개별 계약자의 보험료가 사고발생확률과 보험금의 곱과 같아야 한다는 원칙은?","o":["수지상등의 원칙","급부·반대급부 균등의 원칙","대수의 법칙","최대선의의 원칙"],"a":1,"e":"급부·반대급부 균등의 원칙은 개인 기준입니다. 위험이 큰 사람이 더 많은 보험료를 내야 공평하다는 뜻입니다. 수지상등은 단체 기준이라는 점에서 구분됩니다."},{"sub":"보험학","q":"피보험이익의 원칙을 두는 주된 이유로 옳은 것은?","o":["보험료를 낮추기 위해","보험의 도박화를 막기 위해","보험금 지급을 빠르게 하기 위해","재보험 출재를 쉽게 하기 위해"],"a":1,"e":"경제적 이해관계가 없는 사람이 보험에 들 수 있다면 남의 재산에 보험을 걸고 사고가 나기를 바라게 됩니다. 이는 도박이 되고 방화 같은 도덕적 위험도 커집니다. 그래서 이해관계가 있는 사람만 가입할 수 있게 제한합니다."},{"sub":"보험학","q":"보험금을 지급한 보험자가 피보험자의 제3자에 대한 손해배상청구권을 취득하는 것은?","o":["잔존물대위","청구권대위","비례분담","공동보험"],"a":1,"e":"사고를 낸 제3자가 따로 있는데 피보험자가 보험금까지 받으면 이중으로 이득을 봅니다. 이를 막기 위해 보험사가 그 청구권을 넘겨받아 대신 행사합니다. 손해 입은 물건의 잔존물에 대한 권리를 취득하는 것은 잔존물대위입니다."},{"sub":"보험학","q":"보험가액 1억원인 물건에 보험금액 5천만원으로 가입한 뒤 4천만원의 손해가 발생했다. 지급되는 보험금은? (비례보상)","o":["1천만원","2천만원","4천만원","5천만원"],"a":1,"e":"보험금액이 보험가액에 못 미치는 일부보험입니다. 가입 비율이 50%이므로 손해액 4천만원의 절반인 2천만원만 지급됩니다. 손해액이 보험금액보다 작으니 전액 받는다고 착각하기 쉬운 유형입니다."},{"sub":"보험학","q":"보험계약에서 계약 체결 전에 위험이 높은 사람이 더 적극적으로 가입하려는 현상은?","o":["도덕적 해이","역선택","대수의 법칙","이득금지"],"a":1,"e":"역선택은 계약 전 단계의 문제로 감춰진 특성에서 비롯됩니다. 보험사가 평균 위험으로 요율을 매기면 저위험자가 이탈하고 고위험자만 남아 요율이 계속 오르는 악순환이 생깁니다. 계약 후 주의를 게을리하는 것은 도덕적 해이입니다."},{"sub":"보험학","q":"도덕적 해이를 억제하기 위한 수단으로 가장 적절한 것은?","o":["언더라이팅 강화","자기부담금 설정","고지의무 부과","위험집단별 요율 차등"],"a":1,"e":"자기부담금은 손해의 일부를 계약자가 지게 해서 가입 후에도 조심하도록 유도합니다. 언더라이팅과 고지의무, 요율 차등은 가입 전에 누구를 받을지 가려내는 역선택 대응 수단입니다."},{"sub":"보험학","q":"영업보험료의 구성으로 옳은 것은?","o":["순보험료 + 부가보험료","위험보험료 + 저축보험료","예정이율 + 예정사업비율","보험금 + 사업비"],"a":0,"e":"영업보험료는 보험금 지급 재원인 순보험료와 사업비 재원인 부가보험료로 나뉩니다. 순보험료가 다시 위험보험료와 저축보험료로 나뉩니다. 온라인 전용 보험이 저렴한 이유는 부가보험료가 작기 때문입니다."},{"sub":"보험학","q":"3이원 방식에서 예정이율이 높아질 때 보험료는 어떻게 되는가?","o":["높아진다","낮아진다","변하지 않는다","예정위험률에 따라 결정된다"],"a":1,"e":"예정이율은 받은 보험료를 굴려 얻을 것으로 가정한 수익률입니다. 운용으로 벌 돈이 많다고 보면 그만큼 덜 받아도 되므로 보험료가 낮아집니다. 예정위험률과 예정사업비율은 높아질수록 보험료가 비싸져 방향이 반대입니다."},{"sub":"보험학","q":"재보험의 기능으로 보기 어려운 것은?","o":["보험사의 인수 능력 확대","대형 위험의 인수 가능","실적 안정화","계약자의 보험금 청구권 소멸"],"a":3,"e":"재보험은 보험사가 인수한 위험을 다시 다른 보험사에 넘기는 것으로, 보험사 간의 관계입니다. 계약자는 여전히 원래 보험사에 보험금을 청구하며 그 권리에는 아무 영향이 없습니다."},{"sub":"보험학","q":"무역보험에서 수입국의 전쟁, 내란, 외환 송금 제한 등으로 생기는 위험을 무엇이라 하는가?","o":["신용위험","비상위험","환위험","운영위험"],"a":1,"e":"비상위험은 정치적 위험이라고도 하며 당사자의 잘못 없이 국가 차원의 사유로 발생합니다. 손실이 거대하고 동시다발적이라 민영보험이 인수하기 어렵고, 이것이 무역보험을 국가가 운영하는 근본 이유입니다. 수입자의 파산이나 지급 지체는 신용위험입니다."},{"sub":"보험학","q":"무역보험의 기능 중 보험증권이 담보 역할을 하여 수출기업의 자금 조달을 돕는 것은?","o":["위험 담보 기능","금융 보완 기능","수출 진흥 기능","신용정보 제공 기능"],"a":1,"e":"금융 보완 기능입니다. 은행은 대금 미회수 위험 때문에 수출기업에 대출을 꺼리는데, 무역보험에 가입하면 그 위험이 덮여 대출이 가능해집니다. 무역보험이 단순 보상 제도를 넘어 수출금융의 인프라로 기능하는 지점입니다."},{"sub":"보험학","q":"환변동보험의 특징으로 옳은 것은?","o":["손실만 보상하고 이익은 그대로 둔다","손실을 보상하고 이익이 발생하면 환수한다","환율을 예측해 투기적 수익을 추구한다","대기업만 가입할 수 있다"],"a":1,"e":"환변동보험은 손실을 보상하는 동시에 이익이 나면 환수합니다. 목적이 투기가 아니라 환율을 사실상 고정해 기업이 영업에 집중하게 하는 데 있기 때문입니다. 선물환 접근이 어려운 중소 수출기업의 공백을 메우는 정책보험입니다."},{"sub":"보험학","q":"결제기간이 2년을 초과하는 수출거래를 담보하는 무역보험 제도는?","o":["단기수출보험","중장기수출보험","수입보험","해외투자보험"],"a":1,"e":"결제기간 2년을 기준으로 단기와 중장기가 나뉩니다. 중장기수출보험은 플랜트나 선박처럼 대금 회수에 오랜 기간이 걸리는 대형 거래를 담보합니다. 수입보험은 선급금 미회수 위험 등을 다룹니다."},{"sub":"국제금융론","q":"원달러 환율이 1,300원에서 1,400원으로 상승했을 때의 의미로 옳은 것은?","o":["원화 가치가 상승했다","원화 가치가 하락했다","달러 가치가 하락했다","수입이 유리해졌다"],"a":1,"e":"자국통화표시법에서 환율 숫자가 커지면 같은 1달러를 얻는 데 더 많은 원화가 필요하다는 뜻이므로 원화 가치가 떨어진 것입니다. 수출에는 유리하고 수입과 외화부채 상환에는 불리해집니다."},{"sub":"국제금융론","q":"환율 상승 직후 경상수지가 오히려 악화되었다가 시간이 지나며 개선되는 현상은?","o":["J커브 효과","마셜-러너 조건","트리핀 딜레마","피셔 효과"],"a":0,"e":"계약이 이미 체결되어 있어 물량은 당장 변하지 않는데 가격만 먼저 반영되기 때문입니다. 시간이 지나 수출 물량이 늘고 수입 물량이 줄면 개선됩니다. 그래프 모양이 J자를 닮아 붙은 이름입니다."},{"sub":"국제금융론","q":"환율 변동이 경상수지를 개선하기 위한 조건으로 옳은 것은?","o":["수출입 수요탄력성의 합이 1보다 커야 한다","수출입 수요탄력성의 합이 1보다 작아야 한다","탄력성과 무관하다","수입탄력성만 1보다 크면 된다"],"a":0,"e":"마셜-러너 조건입니다. 탄력성의 합이 1보다 작으면 가격 조건만 나빠지고 물량이 충분히 반응하지 않아 경상수지가 오히려 악화될 수 있습니다."},{"sub":"국제금융론","q":"구매력평가설에 따른 환율 결정 요인은?","o":["양국의 이자율 차이","양국의 물가수준 비율","양국의 경제성장률 차이","양국의 실업률 차이"],"a":1,"e":"구매력평가설은 일물일가의 법칙에서 출발해 환율이 양국 물가수준의 비율로 결정된다고 봅니다. 빅맥지수가 이 이론의 응용이며 장기 설명에 적합합니다. 이자율 차이로 설명하는 것은 이자율평가설로 단기 설명에 쓰입니다."},{"sub":"국제금융론","q":"이미 발생한 외화 채권·채무의 결제 금액이 환율 변동으로 달라지는 위험은?","o":["거래위험","환산위험","경제적위험","운영위험"],"a":0,"e":"거래위험은 이미 확정된 외화 거래에서 생기는 가장 직접적인 환위험입니다. 해외 자회사 재무제표를 환산할 때 생기는 장부상 위험은 환산위험이고, 환율이 미래 경쟁력에 미치는 장기적 영향은 경제적위험입니다."},{"sub":"국제금융론","q":"환율 상승이 예상될 때 수출기업이 취할 리딩·래깅 전략으로 옳은 것은?","o":["외화 수취를 늦추고 외화 지급을 앞당긴다","외화 수취를 앞당기고 외화 지급을 늦춘다","모든 결제를 동시에 처리한다","결제통화를 외화로 변경한다"],"a":0,"e":"환율이 오르면 나중에 받는 외화가 더 많은 원화로 바뀌므로 수취는 늦추는 것이 유리하고, 지급은 지금 하는 편이 원화 부담이 적습니다. 환율 하락이 예상되면 방향이 반대가 됩니다."},{"sub":"국제금융론","q":"선물환과 통화옵션의 차이로 옳은 것은?","o":["선물환은 프리미엄을 지급한다","옵션은 유리한 방향의 이익을 남길 수 있다","선물환은 권리만 있고 의무가 없다","옵션은 환율을 완전히 고정한다"],"a":1,"e":"선물환은 환율을 완전히 고정해 유리한 방향으로 움직여도 이익을 얻지 못합니다. 옵션은 불리할 때만 행사하므로 유리한 방향의 이익을 남길 수 있고, 그 대가로 프리미엄을 지급합니다."},{"sub":"국제금융론","q":"신용장(L/C) 거래의 특징으로 옳은 것은?","o":["은행이 물품의 실제 상태를 확인한 뒤 지급한다","은행은 서류만을 근거로 판단한다","매매계약과 법적으로 동일한 계약이다","수입자의 신용이 그대로 적용된다"],"a":1,"e":"신용장 거래는 독립성과 추상성을 특징으로 합니다. 매매계약과 독립적이며 은행은 제시된 서류가 조건에 맞는지만 심사하고 실제 물품의 상태는 확인하지 않습니다. 수입자 대신 은행의 신용이 적용되므로 수출자가 안심할 수 있습니다."},{"sub":"국제금융론","q":"국제수지표에서 금융계정에 해당하는 것은?","o":["상품수지","서비스수지","직접투자","이전소득수지"],"a":2,"e":"경상수지는 상품, 서비스, 본원소득, 이전소득 수지로 구성됩니다. 직접투자와 증권투자, 파생금융상품, 준비자산은 금융계정에 속합니다. 직접투자를 경상수지 항목으로 껴 넣는 문제가 자주 출제됩니다."},{"sub":"국제금융론","q":"기축통화국이 국제 유동성을 공급하려면 적자를 감수해야 하지만 그 적자가 통화 신뢰를 훼손하는 모순을 무엇이라 하는가?","o":["트리핀 딜레마","J커브 효과","마셜-러너 조건","캐리 트레이드"],"a":0,"e":"트리핀 딜레마는 브레튼우즈 체제 붕괴를 설명하는 개념입니다. 달러가 세계에 공급되려면 미국이 경상수지 적자를 내야 하는데, 적자가 누적되면 달러의 금 태환 능력에 의문이 생겨 신뢰가 무너집니다."},{"sub":"국제금융론","q":"자유로운 자본이동, 고정환율, 독자적 통화정책 중 동시에 달성할 수 없다는 명제는?","o":["삼불원칙(트릴레마)","먼델-플레밍 모형","구매력평가설","국제피셔효과"],"a":0,"e":"셋 중 두 가지까지만 가질 수 있습니다. 자본이 자유롭게 이동하는데 환율을 고정하려면 금리를 상대국에 맞춰야 하므로 독자적 통화정책을 포기해야 합니다."},{"sub":"보험학","q":"관찰 대상이 많아질수록 실제 사고발생률이 이론적 확률에 근접하는 현상은?","o":["대수의 법칙","수지상등의 원칙","이득금지의 원칙","최대선의의 원칙"],"a":0,"e":"대수의 법칙은 보험이 성립하는 통계적 기초입니다. 개인의 사고는 예측할 수 없지만 다수를 모으면 전체 발생률이 안정적으로 예측되므로 보험료를 계산할 수 있습니다. 계약 건수가 적으면 예측이 빗나가 보험사가 위험해집니다."},{"sub":"보험학","q":"보험가능 위험의 요건에 해당하지 않는 것은?","o":["다수의 동질적 위험이 존재할 것","손실이 우연할 것","손실이 측정 가능할 것","손실 규모가 클수록 좋을 것"],"a":3,"e":"손실이 지나치게 거대하면 보험사가 감당할 수 없어 오히려 보험가능성이 떨어집니다. 전쟁이나 대규모 자연재해가 민영보험에서 제외되는 이유이며, 이런 위험은 국가가 인수하게 됩니다."},{"sub":"보험학","q":"순수위험과 투기위험의 구분으로 옳은 것은?","o":["순수위험은 손실만 발생하고 투기위험은 이익 가능성도 있다","순수위험은 이익 가능성이 있다","둘 다 보험 대상이다","투기위험만 보험 대상이다"],"a":0,"e":"화재나 사망처럼 손실만 발생하는 것이 순수위험이고, 주식 투자나 사업처럼 이익도 손실도 가능한 것이 투기위험입니다. 보험은 원칙적으로 순수위험만 담보합니다."},{"sub":"보험학","q":"위험관리 기법 중 위험 자체를 발생시키지 않도록 활동을 하지 않는 방법은?","o":["위험 회피","위험 예방","위험 보유","위험 전가"],"a":0,"e":"위험 회피는 그 활동 자체를 하지 않는 가장 소극적인 방법입니다. 예방은 발생 확률을 낮추는 것, 보유는 스스로 감당하는 것, 전가는 보험 등으로 남에게 넘기는 것입니다."},{"sub":"보험학","q":"기업이 스스로 기금을 적립해 손실에 대비하는 방식은?","o":["재보험","자가보험","공동보험","공제"],"a":1,"e":"자가보험은 위험 보유의 한 형태로, 외부 보험사에 맡기지 않고 내부에 기금을 쌓아 대응합니다. 사업비가 절약되지만 대형 손실을 감당하기 어렵고 위험 분산 효과가 제한적입니다."},{"sub":"보험학","q":"보험계약의 법적 성질에 해당하지 않는 것은?","o":["낙성계약","불요식계약","유상·쌍무계약","요물계약"],"a":3,"e":"보험계약은 당사자의 합의만으로 성립하는 낙성계약이며 특별한 형식이 필요 없는 불요식계약입니다. 보험증권은 계약 성립의 증거일 뿐 성립요건이 아니므로 요물계약이 아닙니다."},{"sub":"보험학","q":"보험약관의 뜻이 명확하지 않을 때 적용되는 해석 원칙은?","o":["작성자 불이익의 원칙","최대선의의 원칙","이득금지의 원칙","실손보상의 원칙"],"a":0,"e":"약관은 보험사가 일방적으로 만들기 때문에 모호한 부분이 있으면 작성자인 보험사에게 불리하게 해석합니다. 이 밖에 개별약정 우선의 원칙, 신의성실의 원칙 등이 약관 해석에 적용됩니다."},{"sub":"보험학","q":"보험계약자와 피보험자, 보험수익자에 관한 설명으로 옳은 것은?","o":["보험계약자는 보험료를 납부하는 자이다","피보험자는 항상 보험금을 받는 자이다","보험수익자는 보험료를 납부한다","세 지위는 반드시 다른 사람이어야 한다"],"a":0,"e":"보험계약자는 계약을 체결하고 보험료를 내는 사람입니다. 생명보험에서 피보험자는 보험사고의 대상이 되는 사람이고 보험금을 받는 사람은 보험수익자입니다. 세 지위가 같은 사람일 수도 있습니다."},{"sub":"보험학","q":"상법상 보험금청구권의 소멸시효 기간은?","o":["1년","2년","3년","5년"],"a":2,"e":"보험금청구권과 보험료반환청구권은 3년, 보험료청구권은 2년의 소멸시효에 걸립니다. 일반 상사채권 5년보다 짧게 정해 법률관계를 신속히 확정하려는 취지입니다."},{"sub":"보험학","q":"고지의무에 관한 설명으로 옳은 것은?","o":["계약 체결 시 중요사항을 알릴 의무이다","계약 후 위험 변경을 알릴 의무이다","보험사가 계약자에게 지는 의무이다","위반해도 아무 효과가 없다"],"a":0,"e":"고지의무는 계약 체결 단계에서 계약자가 지는 의무이고, 계약 후 위험이 현저히 변경·증가했을 때 알리는 것은 통지의무입니다. 고지의무를 위반하면 보험사가 계약을 해지할 수 있습니다."},{"sub":"보험학","q":"보험가액을 초과하여 보험금액을 정한 계약의 효력으로 옳은 것은?","o":["전부 무효이다","초과된 부분이 무효이다","전부 유효하다","보험가액까지만 보험료를 반환한다"],"a":1,"e":"초과보험에서 초과 부분은 무효입니다. 실제 가치보다 많이 보상받으면 이득금지 원칙에 어긋나고 고의 사고를 유발할 수 있기 때문입니다. 계약자가 선의라면 보험료 감액을 청구할 수 있습니다."},{"sub":"보험학","q":"동일한 목적물에 여러 개의 보험계약이 체결된 경우의 처리로 옳은 것은?","o":["각 보험사가 보험금액 전액을 각각 지급한다","보험금액 비율에 따라 비례 분담한다","가장 먼저 체결한 보험사만 지급한다","계약이 모두 무효가 된다"],"a":1,"e":"중복보험에서도 실제 손해액을 넘어 받을 수 없으며 보험사들이 각자의 보험금액 비율로 나누어 부담합니다. 이 역시 이득금지 원칙의 적용입니다."},{"sub":"보험학","q":"보험사가 지급한 보험금 한도에서 손해를 입은 물건의 잔존물에 대한 권리를 취득하는 것은?","o":["청구권대위","잔존물대위","비례분담","공동보험"],"a":1,"e":"잔존물대위는 전손 보험금을 지급한 보험사가 그 물건의 남은 가치를 가져가는 것입니다. 보험금도 받고 잔존물도 가지면 이중 이득이 되기 때문입니다."},{"sub":"보험학","q":"보험사가 위험을 평가해 인수 여부와 조건을 결정하는 업무는?","o":["언더라이팅","클레임","리인슈어런스","액추어리"],"a":0,"e":"언더라이팅은 계약심사로, 역선택을 막는 가장 기본적인 장치입니다. 위험이 높은 지원자를 걸러내거나 그에 맞는 요율을 적용해 위험집단의 균질성을 유지합니다."},{"sub":"보험학","q":"순보험료를 구성하는 것으로 옳은 것은?","o":["위험보험료와 저축보험료","신계약비와 유지비","예정이율과 예정사업비율","사차익과 이차익"],"a":0,"e":"순보험료는 보험금 지급 재원으로 위험보험료와 저축보험료로 구성됩니다. 신계약비, 유지비, 수금비는 부가보험료의 구성 항목입니다."},{"sub":"보험학","q":"실제 사업비가 예정사업비보다 적게 들어 발생한 이익은?","o":["사차익","이차익","비차익","환차익"],"a":2,"e":"비차익은 사업비 관련 이익입니다. 실제 사고가 예상보다 적어 생기는 것이 사차익, 운용수익이 예정이율을 웃돌아 생기는 것이 이차익입니다."},{"sub":"보험학","q":"보험요율 산정의 원칙에 해당하지 않는 것은?","o":["적정성","공정성","비과도성","수익 극대화"],"a":3,"e":"요율 산정은 적정성, 공정성, 비과도성을 원칙으로 합니다. 보험은 공공성이 강해 수익 극대화 자체를 요율 원칙으로 삼지 않으며, 특히 정책보험은 더욱 그렇습니다."},{"sub":"보험학","q":"손해액이 일정 금액을 초과하는 부분만 재보험자가 부담하는 방식은?","o":["비례재보험","초과액재보험","초과손해액재보험","공동재보험"],"a":2,"e":"초과손해액재보험은 비비례적 재보험의 대표 형태로 손해액 기준으로 초과분만 부담합니다. 보험금액을 일정 비율로 나누는 비례재보험과 구분됩니다."},{"sub":"보험학","q":"손해보험과 생명보험의 차이로 옳은 것은?","o":["손해보험은 실손보상, 생명보험은 정액보상이 원칙이다","둘 다 실손보상이 원칙이다","생명보험에만 피보험이익이 필요하다","손해보험에는 대위가 인정되지 않는다"],"a":0,"e":"손해보험은 실제 손해액만큼 보상하고 생명보험은 약정한 금액을 지급합니다. 사람의 생명은 금전으로 평가할 수 없어 정액보상 방식을 씁니다. 대위는 손해보험에서 인정되고 생명보험에서는 원칙적으로 인정되지 않습니다."},{"sub":"보험학","q":"무역보험이 국가에 의해 운영되는 근본적인 이유로 옳은 것은?","o":["보험료 수입이 크기 때문","비상위험은 손실이 거대하고 동시다발적이어서 민영보험이 인수하기 어렵기 때문","수출기업이 요구했기 때문","국제협약에 따른 의무이기 때문"],"a":1,"e":"전쟁이나 외환 송금 제한 같은 비상위험은 한 국가에서 동시에 대규모로 발생해 민영보험이 감당할 수 없습니다. 시장실패 영역이므로 국가가 개입해 인수합니다."},{"sub":"보험학","q":"단기수출보험이 담보하는 결제기간의 기준은?","o":["6개월 이내","1년 이내","2년 이내","3년 이내"],"a":2,"e":"결제기간 2년을 기준으로 단기와 중장기가 나뉩니다. 2년 이내는 단기수출보험, 초과하면 플랜트나 선박 등을 담보하는 중장기수출보험이 적용됩니다."},{"sub":"보험학","q":"중소기업이 은행에서 수출 관련 자금을 조달할 때 공사가 보증을 제공하는 제도는?","o":["수출신용보증","환변동보험","해외투자보험","수입보험"],"a":0,"e":"수출신용보증은 담보가 부족한 중소 수출기업의 자금조달을 돕는 제도로, 무역보험의 금융 보완 기능을 잘 보여줍니다. 공사의 보증이 담보를 대신합니다."},{"sub":"보험학","q":"우리 기업이 해외에 투자한 뒤 수용이나 전쟁, 송금 제한으로 손실을 입을 때 보상하는 제도는?","o":["단기수출보험","해외투자보험","수출신용보증","환변동보험"],"a":1,"e":"해외투자보험은 투자 대상국의 정치적 위험을 담보합니다. 수용은 투자국 정부가 자산을 몰수하거나 국유화하는 것을 말합니다."},{"sub":"보험학","q":"무역보험에서 손실의 일정 비율만 보상하고 나머지는 수출기업이 부담하게 하는 장치는?","o":["부보율","면책기간","보험가액","재보험"],"a":0,"e":"부보율은 손실 중 보험으로 보상되는 비율입니다. 전액을 보상하면 수출기업이 바이어 관리를 소홀히 하는 도덕적 해이가 생기므로 일부를 스스로 부담하게 합니다."},{"sub":"보험학","q":"무역보험이 정책보험으로 분류되는 이유로 옳은 것은?","o":["이윤 극대화가 아니라 수출 진흥이 목적이기 때문","보험료가 비싸기 때문","민영보험사가 판매하기 때문","가입이 자유롭기 때문"],"a":0,"e":"정책보험은 국가 정책 목적을 위해 운영되는 보험입니다. 무역보험은 수출 진흥과 무역 촉진을 목적으로 하며 기금으로 운영되고 국가가 최종 책임을 집니다."},{"sub":"보험학","q":"무역보험공사가 해외 수입자 신용조사를 수행하는 주된 목적은?","o":["도덕적 해이를 사후에 제재하기 위해","역선택을 방지하고 적정한 인수 조건을 결정하기 위해","보험금 지급을 지연하기 위해","환율을 예측하기 위해"],"a":1,"e":"신용조사는 계약 전 단계에서 위험을 평가하는 언더라이팅 활동으로 역선택 대응 수단입니다. 조사 결과에 따라 인수 한도와 보험료율이 달라집니다."},{"sub":"국제금융론","q":"환율이 하락(원화 강세)할 때 유리해지는 주체로 옳은 것은?","o":["수출기업","외화부채를 보유한 기업","해외에서 원자재를 수입하는 기업","해외 관광객 유치 기업"],"a":2,"e":"원화가 강해지면 같은 원화로 더 많은 외화를 살 수 있어 수입 비용이 줄어듭니다. 외화부채 상환 부담도 줄어 그 기업에도 유리합니다. 반면 수출기업과 관광 유치 기업에는 불리합니다."},{"sub":"국제금융론","q":"고정환율제도의 특징으로 옳은 것은?","o":["환율 변동성이 크다","독자적 통화정책 운용이 제약된다","국제수지 자동조절 기능이 뛰어나다","외환보유액이 필요 없다"],"a":1,"e":"환율을 일정 수준에 묶어두려면 시장 개입이 필요하고 금리를 상대국에 맞춰야 하므로 통화정책의 독립성을 잃습니다. 개입을 위해 충분한 외환보유액도 필요합니다."},{"sub":"국제금융론","q":"먼델-플레밍 모형에서 변동환율제이고 자본이동이 자유로울 때 효과적인 정책은?","o":["재정정책","통화정책","보호무역정책","가격통제"],"a":1,"e":"변동환율제에서는 통화정책이 유효하고 재정정책은 무력합니다. 재정 확대로 금리가 오르면 자본이 유입되어 환율이 하락하고 순수출이 줄어 효과가 상쇄되기 때문입니다. 고정환율제에서는 반대가 됩니다."},{"sub":"국제금융론","q":"절대적 구매력평가설에 따른 환율 산식으로 옳은 것은?","o":["자국 물가 ÷ 외국 물가","외국 물가 ÷ 자국 물가","자국 금리 − 외국 금리","자국 GDP ÷ 외국 GDP"],"a":0,"e":"일물일가의 법칙에 따라 같은 재화가 같은 값이 되려면 환율은 자국 물가를 외국 물가로 나눈 값이 됩니다. 자국 물가가 더 오르면 환율이 상승해 자국 통화가 절하됩니다."},{"sub":"국제금융론","q":"무위험 이자율평가(CIP)가 성립할 때 선물환율과 현물환율의 차이는 무엇과 같아지는가?","o":["양국의 물가상승률 차이","양국의 명목금리 차이","양국의 경제성장률 차이","양국의 실업률 차이"],"a":1,"e":"선물환으로 환위험을 제거하면 어느 통화로 운용하든 수익률이 같아져야 합니다. 따라서 선물환율과 현물환율의 차이인 스왑레이트가 양국 금리차와 일치합니다. 어긋나면 차익거래가 발생합니다."},{"sub":"국제금융론","q":"저금리 통화로 자금을 조달해 고금리 통화 자산에 투자하는 거래는?","o":["캐리 트레이드","헤지 거래","차익거래","스왑 거래"],"a":0,"e":"캐리 트레이드는 국제피셔효과가 현실에서 자주 깨지는 점을 이용합니다. 다만 조달통화가 갑자기 강세로 돌아서면 큰 손실이 날 수 있어 위험이 작지 않습니다."},{"sub":"국제금융론","q":"국제피셔효과에 따르면 명목이자율이 높은 국가의 통화는 어떻게 되는가?","o":["절상된다","절하된다","변동이 없다","고정된다"],"a":1,"e":"명목이자율이 높다는 것은 기대 인플레이션이 높다는 뜻이고, 물가가 더 오르는 통화는 구매력이 떨어져 절하됩니다. 결국 높은 이자 수익은 환차손으로 상쇄된다는 결론이 나옵니다."},{"sub":"국제금융론","q":"해외 자회사의 재무제표를 자국 통화로 환산할 때 발생하는 환위험은?","o":["거래위험","환산위험","경제적위험","결제위험"],"a":1,"e":"환산위험은 회계상 나타나는 위험으로 실제 현금흐름과는 직접 관련이 없습니다. 이미 확정된 외화 채권채무의 결제 금액이 변하는 것은 거래위험입니다."},{"sub":"국제금융론","q":"환율 변동이 기업의 미래 매출과 시장 경쟁력에 미치는 장기적 영향을 나타내는 위험은?","o":["거래위험","환산위험","경제적위험","신용위험"],"a":2,"e":"경제적위험은 가장 포괄적이고 측정이 어려운 환위험입니다. 환율 변화로 경쟁국 제품 대비 가격 경쟁력이 달라지면서 장기 현금흐름이 영향을 받는 것을 말합니다."},{"sub":"국제금융론","q":"계열사 간 채권과 채무를 상계하고 차액만 결제하는 환위험 관리 기법은?","o":["매칭","네팅","리딩","래깅"],"a":1,"e":"네팅은 그룹 내부에서 서로 주고받을 금액을 상쇄해 실제 환전 규모를 줄이는 방법입니다. 매칭은 외화 수입과 지출의 통화와 시기를 맞추는 것입니다."},{"sub":"국제금융론","q":"환율 하락이 예상될 때 수출기업이 취할 적절한 전략은?","o":["외화 수취를 앞당기고 외화 지급을 늦춘다","외화 수취를 늦추고 외화 지급을 앞당긴다","아무 조치도 하지 않는다","외화 자산을 늘린다"],"a":0,"e":"환율이 떨어지면 나중에 받는 외화의 원화 가치가 줄어들므로 수취는 앞당기는 것이 유리합니다. 반대로 지급은 늦추면 더 적은 원화로 갚을 수 있습니다."},{"sub":"국제금융론","q":"통화스왑에 관한 설명으로 옳은 것은?","o":["서로 다른 통화의 원리금을 교환하는 계약이다","주식을 교환하는 계약이다","보험계약의 일종이다","이자만 교환하고 원금은 교환하지 않는다"],"a":0,"e":"통화스왑은 서로 다른 통화로 표시된 원금과 이자를 교환합니다. 금리스왑이 같은 통화 내에서 고정금리와 변동금리를 교환하는 것과 구분됩니다."},{"sub":"국제금융론","q":"선물환 거래의 특징으로 옳은 것은?","o":["프리미엄을 지급하고 권리를 취득한다","환율을 확정하지만 유리한 방향의 이익도 포기한다","거래소에서 표준화되어 거래된다","만기 전 자유롭게 포기할 수 있다"],"a":1,"e":"선물환은 미래 환율을 확정하는 계약으로 반드시 이행해야 합니다. 불리한 변동을 막는 대신 유리한 변동의 이익도 얻지 못합니다. 프리미엄을 내고 선택권을 갖는 것은 옵션입니다."},{"sub":"국제금융론","q":"경상수지에 포함되지 않는 항목은?","o":["상품수지","서비스수지","본원소득수지","증권투자"],"a":3,"e":"경상수지는 상품, 서비스, 본원소득, 이전소득 수지로 구성됩니다. 증권투자와 직접투자, 파생금융상품, 준비자산은 금융계정에 속합니다."},{"sub":"국제금융론","q":"경상수지 흑자가 지속될 때 나타날 수 있는 부작용으로 옳은 것은?","o":["외환보유액 감소","통화량 증가로 인한 물가 상승 압력","환율 상승 압력","대외 신인도 하락"],"a":1,"e":"흑자로 외화가 유입되면 이를 원화로 바꾸는 과정에서 통화량이 늘어 물가 압력이 생깁니다. 또 원화 강세 압력과 교역상대국과의 통상 마찰이 생길 수 있습니다."},{"sub":"국제금융론","q":"신용장 거래의 독립성 원칙이 의미하는 것은?","o":["신용장은 매매계약과 독립된 별개의 계약이다","신용장은 매매계약에 종속된다","은행이 물품을 직접 검사한다","수입자가 대금을 직접 지급한다"],"a":0,"e":"독립성은 신용장이 근거가 된 매매계약과 법적으로 분리된다는 뜻입니다. 매매계약에 분쟁이 있어도 은행은 신용장 조건에 맞는 서류가 제시되면 대금을 지급해야 합니다."},{"sub":"국제금융론","q":"수출자에게 대금 미회수 위험이 가장 큰 결제방식은?","o":["신용장(L/C)","D/P","선지급(T/T)","O/A(사후송금)"],"a":3,"e":"O/A는 물품을 먼저 보내고 나중에 대금을 받는 방식이라 수출자가 위험을 전부 집니다. 신용장은 은행이 지급을 확약해 가장 안전하고, 선지급은 반대로 수입자가 위험을 집니다."},{"sub":"국제금융론","q":"D/A(인수인도) 방식의 특징으로
