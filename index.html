 효율적이지는 않습니다."},{"sub":"미시경제","q":"최저임금제와 같이 균형가격보다 높은 수준의 가격하한제를 시행할 때 나타나는 현상은?","o":["초과수요","초과공급","가격 하락","거래량 증가"],"a":1,"e":"균형보다 높은 가격에서는 공급량이 수요량을 초과합니다. 노동시장에서 이 초과공급이 곧 실업으로 나타납니다."},{"sub":"미시경제","q":"수요의 소득탄력성이 음수인 재화는?","o":["정상재","사치재","필수재","열등재"],"a":3,"e":"소득탄력성은 수요량 변화율을 소득 변화율로 나눈 값입니다. 음수이면 열등재, 0과 1 사이면 필수재, 1보다 크면 사치재로 분류합니다."},{"sub":"미시경제","q":"코즈 정리에 관한 설명으로 옳은 것은?","o":["외부효과는 정부 개입 없이는 해결할 수 없다","재산권이 명확하고 협상비용이 없다면 당사자 간 협상으로 효율적 결과에 도달할 수 있다","외부효과는 세금으로만 해결된다","공공재는 항상 정부가 공급해야 한다"],"a":1,"e":"코즈 정리는 재산권이 명확히 설정되고 거래비용이 없다면 누구에게 권리가 있든 협상으로 효율적 자원배분에 이른다는 주장입니다. 현실에서는 협상비용과 당사자 수 때문에 한계가 있습니다."},{"sub":"거시경제","q":"명목GDP를 실질GDP로 나눈 뒤 100을 곱한 값은?","o":["소비자물가지수","생산자물가지수","GDP 디플레이터","실질임금지수"],"a":2,"e":"GDP 디플레이터는 국내에서 생산된 모든 재화와 서비스를 대상으로 하는 포괄적 물가지표입니다. 수입품은 포함되지 않는다는 점에서 소비자물가지수와 다릅니다."},{"sub":"거시경제","q":"국내총생산의 지출 측면 구성으로 옳은 것은?","o":["소비 + 투자 + 정부지출 + 순수출","소비 + 저축 + 조세","임금 + 이자 + 지대 + 이윤","통화량 × 유통속도"],"a":0,"e":"Y = C + I + G + (X - M)입니다. 생산 측면은 부가가치의 합, 분배 측면은 임금·이자·지대·이윤의 합으로 세 접근의 결과가 일치합니다."},{"sub":"거시경제","q":"경기침체로 인해 발생하는 실업의 유형은?","o":["마찰적 실업","구조적 실업","경기적 실업","계절적 실업"],"a":2,"e":"경기적 실업은 총수요 부족으로 생기며 자연실업률에는 포함되지 않습니다. 자연실업률은 마찰적 실업과 구조적 실업으로 구성됩니다."},{"sub":"거시경제","q":"원자재 가격 급등으로 총공급곡선이 왼쪽으로 이동할 때 나타나는 현상은?","o":["물가 하락과 생산 증가","물가 상승과 생산 감소","물가와 생산 모두 증가","물가와 생산 모두 감소"],"a":1,"e":"비용인상 인플레이션은 물가가 오르면서 생산이 줄어드는 스태그플레이션을 낳습니다. 수요견인 인플레이션에서는 물가와 생산이 함께 늘어납니다."},{"sub":"거시경제","q":"법정지급준비율이 10%이고 본원통화가 100억원일 때 이론적 최대 통화량은? (현금 보유와 초과지준 없음)","o":["100억원","500억원","1,000억원","1,100억원"],"a":2,"e":"통화승수는 지급준비율의 역수이므로 10입니다. 100억원 × 10 = 1,000억원이며, 현실에서는 현금 누출과 초과지준 때문에 이보다 작습니다."},{"sub":"거시경제","q":"화폐의 기능에 해당하지 않는 것은?","o":["교환의 매개수단","가치의 척도","가치의 저장수단","생산의 원천"],"a":3,"e":"화폐의 3대 기능은 교환의 매개, 가치 척도, 가치 저장입니다. 화폐 자체가 부가가치를 생산하지는 않습니다."},{"sub":"거시경제","q":"원달러 환율이 상승할 때 일반적으로 예상되는 효과는?","o":["수출 감소, 수입 증가","수출 증가, 수입 감소","수출과 수입 모두 증가","수출과 수입 모두 감소"],"a":1,"e":"환율 상승은 원화 가치 하락을 뜻하므로 수출품의 외화 표시 가격이 낮아져 수출에 유리하고, 수입품의 원화 가격은 올라 수입이 줄어듭니다."},{"sub":"거시경제","q":"구매력평가설에 따른 환율 결정 요인은?","o":["양국의 이자율 차이","양국의 물가수준 비율","양국의 경제성장률 차이","양국의 실업률 차이"],"a":1,"e":"구매력평가설은 동일 재화가 어디서나 같은 가격을 가진다는 일물일가의 법칙에서 출발해 환율이 양국 물가수준의 비율로 결정된다고 봅니다. 이자율 차이로 설명하는 것은 이자율평가설입니다."},{"sub":"거시경제","q":"LM곡선을 오른쪽으로 이동시키는 요인은?","o":["통화량의 증가","물가의 상승","화폐수요의 증가","정부지출의 증가"],"a":0,"e":"LM곡선은 화폐시장의 균형을 나타내며 실질통화량이 늘면 우측으로 이동합니다. 물가 상승은 실질통화량을 줄여 좌측 이동 요인이 됩니다."},{"sub":"거시경제","q":"실질GDP 증가율과 실업률 변화 사이의 음의 관계를 나타내는 법칙은?","o":["오쿤의 법칙","세이의 법칙","그레셤의 법칙","왈라스 법칙"],"a":0,"e":"오쿤의 법칙은 경제성장률이 높아지면 실업률이 낮아지는 경험적 관계를 말합니다. 세이의 법칙은 공급이 스스로 수요를 창출한다는 고전학파의 명제입니다."},{"sub":"거시경제","q":"비교우위에 관한 설명으로 옳은 것은?","o":["절대우위가 없으면 무역 이익이 발생하지 않는다","기회비용이 상대적으로 낮은 재화에 특화하면 무역 이익이 발생한다","무역은 항상 한쪽만 이득을 본다","모든 재화에서 절대우위를 가진 나라는 무역할 필요가 없다"],"a":1,"e":"리카도의 비교우위론에 따르면 모든 재화에서 절대열위인 나라도 기회비용이 상대적으로 낮은 재화에 특화하면 양국 모두 이익을 얻습니다."},{"sub":"거시경제","q":"경상수지의 구성 항목에 해당하지 않는 것은?","o":["상품수지","서비스수지","본원소득수지","직접투자"],"a":3,"e":"경상수지는 상품, 서비스, 본원소득, 이전소득 수지로 구성됩니다. 직접투자와 증권투자는 금융계정에 속합니다."},{"sub":"거시경제","q":"유동성 함정 상태에서 나타나는 현상으로 옳은 것은?","o":["통화정책의 효과가 크게 나타난다","이자율이 매우 낮아 통화량을 늘려도 이자율이 더 내려가지 않는다","재정정책이 무력해진다","물가가 급등한다"],"a":1,"e":"이자율이 극도로 낮으면 화폐수요가 무한탄력적이 되어 통화 공급을 늘려도 이자율이 떨어지지 않습니다. 이때는 통화정책이 무력해지고 재정정책의 효과가 커집니다."},{"sub":"거시경제","q":"소비자물가지수에 관한 설명으로 옳은 것은?","o":["국내에서 생산된 모든 재화를 대상으로 한다","가계가 소비하는 대표 품목의 가격 변동을 측정한다","수입품 가격은 반영되지 않는다","기업 간 거래되는 원자재 가격을 측정한다"],"a":1,"e":"소비자물가지수는 가계 소비 품목의 가격을 가중평균한 지표이며 수입 소비재도 포함합니다. 기업 간 거래 단계의 물가는 생산자물가지수로 측정합니다."},{"sub":"경영학","q":"회계등식으로 옳은 것은?","o":["자산 = 부채 + 자본","자산 = 부채 - 자본","자본 = 자산 + 부채","수익 = 비용 + 자산"],"a":0,"e":"자산은 부채와 자본의 합과 항상 일치하며 이것이 재무상태표의 기본 구조입니다. 자산에서 부채를 뺀 값이 자본, 즉 순자산입니다."},{"sub":"경영학","q":"발생주의 회계에 관한 설명으로 옳은 것은?","o":["현금이 실제로 오간 시점에 수익과 비용을 인식한다","거래가 발생한 시점에 수익과 비용을 인식한다","수익만 현금주의로 인식한다","중소기업에만 적용된다"],"a":1,"e":"발생주의는 현금 수수와 무관하게 거래가 발생한 기간에 인식하므로 기간 손익이 정확해집니다. 매출채권, 미지급비용, 선급비용 같은 계정이 여기서 생깁니다."},{"sub":"경영학","q":"물가가 지속적으로 상승하는 상황에서 선입선출법을 적용할 때 나타나는 결과는?","o":["매출원가가 높아지고 당기순이익이 낮아진다","매출원가가 낮아지고 당기순이익이 높아진다","기말재고가 과소평가된다","후입선출법과 결과가 같다"],"a":1,"e":"선입선출법은 먼저 산 싼 재고를 먼저 팔린 것으로 보므로 매출원가가 낮게 잡히고 이익과 기말재고가 높게 나타납니다."},{"sub":"경영학","q":"부채비율을 구하는 산식으로 옳은 것은?","o":["부채총계 ÷ 자기자본","부채총계 ÷ 자산총계","자기자본 ÷ 자산총계","유동부채 ÷ 유동자산"],"a":0,"e":"부채비율은 타인자본을 자기자본으로 나눈 값으로 재무 안정성을 봅니다. 부채를 자산으로 나눈 것은 부채구성비율입니다."},{"sub":"경영학","q":"자기자본이익률(ROE)의 산식으로 옳은 것은?","o":["당기순이익 ÷ 자기자본","당기순이익 ÷ 총자산","영업이익 ÷ 매출액","매출액 ÷ 자기자본"],"a":0,"e":"ROE는 주주가 투자한 자본으로 얼마의 이익을 냈는지 보는 지표입니다. 당기순이익을 총자산으로 나누면 ROA가 됩니다."},{"sub":"경영학","q":"순현재가치법(NPV)에 따른 투자안 채택 기준으로 옳은 것은?","o":["NPV가 0보다 크면 채택","NPV가 0보다 작으면 채택","NPV가 1보다 크면 채택","NPV와 무관하게 회수기간이 짧으면 채택"],"a":0,"e":"NPV가 양수라는 것은 투자안이 자본비용을 넘는 가치를 창출한다는 뜻입니다. 여러 투자안을 비교할 때는 NPV가 가장 큰 것을 선택합니다."},{"sub":"경영학","q":"가중평균자본비용(WACC)에 관한 설명으로 옳은 것은?","o":["타인자본비용만을 의미한다","자기자본비용과 타인자본비용을 자본구조 비중으로 가중평균한 값이다","항상 자기자본비용보다 높다","법인세와 무관하다"],"a":1,"e":"WACC는 기업이 조달한 자본 전체의 평균 비용이며 투자안 평가의 할인율로 쓰입니다. 이자비용의 절세효과 때문에 타인자본비용은 세후로 계산합니다."},{"sub":"경영학","q":"BCG 매트릭스에서 시장성장률은 낮으나 상대적 시장점유율이 높은 사업은?","o":["물음표","별","현금젖소","개"],"a":2,"e":"현금젖소는 추가 투자 부담이 적으면서 현금을 창출하므로 다른 사업의 자금원이 됩니다. 성장률과 점유율이 모두 높으면 별, 모두 낮으면 개입니다."},{"sub":"경영학","q":"앤소프의 제품시장 매트릭스에서 기존 시장에 기존 제품을 더 많이 판매하는 전략은?","o":["시장침투","시장개발","제품개발","다각화"],"a":0,"e":"시장침투는 위험이 가장 낮은 성장전략입니다. 기존 제품을 새 시장에 팔면 시장개발, 기존 시장에 새 제품을 내면 제품개발, 둘 다 새로우면 다각화입니다."},{"sub":"경영학","q":"매트릭스 조직의 단점으로 옳은 것은?","o":["전문성이 축적되지 않는다","명령일원화의 원칙이 지켜지지 않아 갈등이 생길 수 있다","환경 변화에 대응하기 어렵다","인력을 유연하게 배치할 수 없다"],"a":1,"e":"매트릭스 조직은 기능과 프로젝트 두 계통의 지시를 받으므로 보고 체계가 이원화됩니다. 전문성 축적과 인력 활용의 유연성은 장점입니다."},{"sub":"경영학","q":"테일러의 과학적 관리법의 핵심 내용으로 옳은 것은?","o":["시간연구와 동작연구를 통한 표준 작업량 설정","인간관계와 비공식 집단의 중시","자아실현 욕구의 충족","환경 적합성에 따른 조직 설계"],"a":0,"e":"테일러는 작업을 과학적으로 분석해 표준을 정하고 차별성과급을 적용했습니다. 인간관계를 중시한 것은 호손실험에서 출발한 인간관계론입니다."},{"sub":"경영학","q":"호손실험이 밝혀낸 주요 결론은?","o":["물리적 작업조건이 생산성을 좌우한다","임금 수준만이 동기부여 요인이다","비공식 조직과 심리적 요인이 생산성에 영향을 준다","분업의 정도가 생산성을 결정한다"],"a":2,"e":"조명 밝기 같은 물리적 조건보다 관심받고 있다는 인식과 동료 관계가 생산성에 크게 작용한다는 점이 확인되었습니다. 이것이 인간관계론의 출발점입니다."},{"sub":"경영학","q":"브룸의 기대이론에서 동기부여의 크기를 결정하는 세 요소는?","o":["기대, 수단성, 유인가","위생요인, 동기요인, 성취","존재, 관계, 성장","공정성, 비교, 보상"],"a":0,"e":"동기의 강도는 기대와 수단성, 유인가의 곱으로 결정되며 하나라도 0이면 동기가 생기지 않습니다. 존재와 관계, 성장은 알더퍼의 ERG 이론입니다."},{"sub":"경영학","q":"목표관리(MBO)의 특징으로 옳지 않은 것은?","o":["상급자와 하급자가 함께 목표를 설정한다","목표는 구체적이고 측정 가능해야 한다","일정 기간 후 결과를 함께 평가한다","목표는 상급자가 일방적으로 지시한다"],"a":3,"e":"MBO는 참여를 통한 목표 설정이 핵심입니다. 일방적 지시는 MBO의 취지에 반하며, 계량화가 어려운 업무에는 적용이 힘들다는 한계가 있습니다."},{"sub":"경영학","q":"한 가지 두드러진 특성이 다른 평가 항목 전체에 영향을 미치는 인사평가 오류는?","o":["관대화 경향","중심화 경향","후광효과","최근효과"],"a":2,"e":"후광효과는 인상적인 한 특성이 전반적 평가를 물들이는 오류입니다. 관대화는 후하게, 중심화는 중간으로 몰리는 경향이며 최근효과는 최근 실적만 반영하는 오류입니다."},{"sub":"경영학","q":"직무분석의 결과로 직무의 내용과 요건을 정리한 문서 중 사람의 자격요건을 기술한 것은?","o":["직무기술서","직무명세서","직무평가표","조직도"],"a":1,"e":"직무기술서는 일의 내용과 책임, 작업조건을 담고 직무명세서는 그 일을 수행할 사람의 학력, 경험, 능력을 담습니다."},{"sub":"경영학","q":"제품수명주기에서 매출 증가율이 둔화되고 경쟁이 가장 치열해지는 단계는?","o":["도입기","성장기","성숙기","쇠퇴기"],"a":2,"e":"성숙기에는 시장이 포화되어 점유율 경쟁이 심해지고 가격 인하와 차별화 압력이 커집니다. 도입기에는 인지도 확보, 성장기에는 시장 확대가 과제입니다."},{"sub":"경영학","q":"신제품을 처음에 높은 가격으로 출시한 뒤 점차 가격을 내리는 전략은?","o":["시장침투 가격전략","스키밍 가격전략","원가가산 가격전략","묶음 가격전략"],"a":1,"e":"스키밍은 가격에 둔감한 초기 수용자에게서 높은 마진을 회수한 뒤 가격을 낮춰 시장을 넓힙니다. 반대로 처음부터 낮게 책정해 점유율을 확보하는 것이 침투 가격전략입니다."},{"sub":"경영학","q":"필요한 때에 필요한 양만큼 생산하여 재고를 최소화하는 생산방식은?","o":["JIT 생산방식","대량생산방식","배치생산방식","주문생산방식"],"a":0,"e":"JIT는 도요타에서 출발한 방식으로 재고를 낭비로 보고 이를 제거하는 데 초점을 둡니다. 다만 공급망이 끊기면 생산이 즉시 멈추는 취약성이 있습니다."},{"sub":"경영학","q":"영업레버리지가 높은 기업의 특징으로 옳은 것은?","o":["고정비 비중이 높아 매출 변동에 따른 영업이익 변동폭이 크다","변동비 비중이 높아 이익이 안정적이다","부채가 전혀 없다","손익분기점이 매우 낮다"],"a":0,"e":"고정비 비중이 크면 매출이 늘 때 이익이 급증하지만 줄 때 손실도 급격히 커집니다. 부채 사용에 따른 이익 확대 효과는 재무레버리지입니다."}],"notes":[{"title":"① 민법이란 무엇인가","sub":"민법총칙","body":"## 민법이 다루는 것\n민법은 개인과 개인 사이의 일을 다루는 법입니다. 물건을 사고팔고, 돈을 빌리고, 집을 빌리고, 결혼하고 상속하는 일이 전부 민법의 영역입니다.\n국가가 개인을 처벌하는 형법이나, 국가 기관의 일을 정하는 행정법과는 성격이 다릅니다. 민법에서는 국가가 심판 역할만 하고 실제 당사자는 개인끼리입니다.\n\n## 민법의 3대 기본원리\n근대 민법은 세 가지 원칙 위에 서 있습니다.\n- 사유재산권 존중: 내 재산은 내 마음대로 쓸 수 있다\n- 사적자치(계약자유): 누구와 어떤 내용으로 계약할지 스스로 정한다\n- 과실책임: 잘못이 있어야 책임을 진다\n\n> 시험에 자주 나오는 지점은 이 원칙들이 지금은 수정되었다는 것입니다. 재산권도 공공복리에 따라 제한되고, 계약도 사회질서에 어긋나면 무효가 되며, 위험한 사업을 하는 사람에게는 잘못이 없어도 책임을 지우기도 합니다. 이를 각각 소유권의 사회성, 계약공정의 원칙, 무과실책임이라고 부릅니다.\n\n## 총칙이 왜 앞에 있나\n민법은 총칙, 물권, 채권, 친족, 상속의 다섯 편으로 되어 있습니다.\n총칙은 뒤에 나오는 모든 편에 공통으로 적용되는 규칙을 앞으로 빼놓은 것입니다. 사람이 누구인지, 계약이 언제 성립하는지, 언제 무효가 되는지 같은 이야기입니다.\n공기업 시험에서 민법이 나오면 총칙 비중이 가장 높습니다. 범위가 좁으면서 논점이 정형화되어 있어 점수를 얻기 가장 좋은 구간입니다.\n\n▸ 사법: 개인 사이의 관계를 다루는 법. 민법과 상법이 대표적입니다.\n▸ 공법: 국가와 개인의 관계를 다루는 법. 헌법, 형법, 행정법 등.\n▸ 임의규정: 당사자가 다르게 정하면 그 뜻이 우선하는 규정.\n▸ 강행규정: 당사자 뜻과 무관하게 반드시 적용되는 규정.","alt":"## 민법이 뭐냐면\n국가가 끼는 게 아니라 사람 대 사람 일을 다루는 법임.\n중고나라에서 사기당함, 전세금 못 받음, 돈 빌려주고 못 받음. 다 민법.\n형법은 국가가 널 잡아가는 거고 민법은 옆집이랑 싸우는 거임. 국가는 심판만 봄.\n\n## 3대 원리 (외워라 나옴)\n- 내 재산 내 맘대로 (사유재산권 존중)\n- 누구랑 뭘 계약하든 내 맘 (사적자치)\n- 잘못했을 때만 책임짐 (과실책임)\n\n> 근데 여기서 끝나면 시험문제가 안 되겠지. 셋 다 수정됐다는 게 포인트임.\n> 재산도 공공복리 때문에 제한되고, 계약도 사회질서 어기면 무효고, 위험한 사업 하는 놈은 잘못 없어도 책임짐.\n> 순서대로 소유권의 사회성 / 계약공정의 원칙 / 무과실책임. 이거 물어봄.\n\n## 총칙이 왜 맨 앞이냐\n민법 = 총칙 + 물권 + 채권 + 친족 + 상속.\n뒤에 나오는 애들한테 공통으로 쓰이는 규칙만 앞으로 빼놓은 게 총칙임. 공통 함수 빼놓은 거랑 똑같음.\n\n공기업 시험에서 민법 나오면 총칙이 제일 많이 나옴. 범위 좁고 나오는 것만 계속 나옴. 여기가 제일 가성비 좋음.\n\n▸ 사법: 개인끼리 관계. 민법 상법.\n▸ 공법: 국가 대 개인. 헌법 형법 행정법.\n▸ 임의규정: 둘이 다르게 정하면 그거 따름.\n▸ 강행규정: 둘이 뭐라 하든 무조건 적용. 어기면 무효.","links":[{"title":"KOCW 민법총칙 (건국대 정기웅)","url":"http://kocw.net/home/cview.do?mty=p&kemId=315094","note":"무료 대학 공개강의 · 2011년 강의라 개정 미반영 주의"},{"title":"공인중개사 기본이론 민법 (패스랩)","url":"https://www.youtube.com/playlist?list=PLmOOiUmxVVPFTfY3qEywXJ4dJHLM7JeZO","note":"유튜브 무료 · 총칙 부분만 골라 볼 것"}]},{"title":"② 권리의 종류","sub":"민법총칙","body":"## 권리를 나누는 두 가지 축\n민법 문제는 결국 \"누가 누구에게 뭘 요구할 수 있나\"를 묻습니다. 그래서 권리의 종류를 알아두면 문제가 읽힙니다.\n\n## 재산권과 비재산권\n- 재산권: 물권, 채권, 지식재산권\n- 비재산권: 인격권, 가족권(신분권)\n\n### 물권 vs 채권 (제일 중요)\n- **물권**: 물건을 직접 지배하는 권리. 소유권, 전세권, 저당권. 누구에게나 주장 가능(절대권)\n- **채권**: 특정인에게 뭘 해달라고 요구하는 권리. 그 사람에게만 주장 가능(상대권)\n\n> 집을 산 사람은 등기하기 전까지는 \"집 넘겨달라\"는 **채권**만 있고, 등기해야 **물권**인 소유권이 생깁니다. 이 차이가 이중매매 문제의 뿌리입니다.\n\n## 작용에 따른 분류 (여기가 시험 포인트)\n- **지배권**: 대상을 직접 지배. 소유권\n- **청구권**: 남에게 해달라고 요구. 채권\n- **형성권**: 한쪽이 일방적으로 법률관계를 바꿔버림. 취소권, 해제권, 추인권, 상계권\n- **항변권**: 상대의 청구를 막는 권리. 동시이행항변권, 최고·검색의 항변권\n\n> 형성권이 핵심입니다. 상대방 동의 없이 내 의사표시만으로 효과가 생깁니다. 그래서 형성권은 소멸시효가 아니라 **제척기간**이 걸립니다. 취소권의 3년·10년이 그래서 제척기간인 겁니다.\n\n▸ 절대권: 모든 사람에게 주장할 수 있는 권리.\n▸ 상대권: 특정한 사람에게만 주장할 수 있는 권리.\n▸ 상계: 서로 빚이 있을 때 맞비겨 없애는 것.","alt":"## 권리 종류 왜 알아야 하냐\n민법 문제 = \"누가 누구한테 뭘 요구 가능?\" 이거임. 종류 알면 문제가 읽힘.\n\n## 물권 vs 채권 (이게 제일 중요)\n- **물권**: 물건을 직접 지배함. 소유권, 전세권, 저당권. **아무한테나** 주장 가능\n- **채권**: 특정인한테 \"해줘\" 요구. **그 사람한테만** 주장 가능\n\n> 🚨 집 계약만 하고 등기 안 함 → 아직 **채권**임. \"집 넘겨줘\" 요구할 권리만 있음.\n> 등기해야 **소유권(물권)** 생김.\n> 이래서 이중매매에서 먼저 등기한 놈이 이기는 거임. 계약 먼저 한 게 중요한 게 아님.\n\n## 작용별 4종 (시험 포인트)\n- **지배권**: 직접 지배. 소유권\n- **청구권**: \"해줘\" 요구. 채권\n- **형성권**: 나 혼자 선언하면 관계가 바뀜. 취소권, 해제권, 추인권, 상계권\n- **항변권**: 상대 요구 막기. 동시이행항변권\n\n> 🚨 형성권이 핵심임.\n> 상대방 동의 필요 없음. 내가 \"취소\" 하면 그냥 취소됨. 개사기 권리임.\n> 근데 이렇게 센 권리를 오래 들고 있으면 상대가 불안하잖음. 그래서 형성권은 **제척기간**이 걸림. 소멸시효 아님.\n> 취소권 3년/10년이 제척기간인 이유가 이거임.\n\n▸ 절대권: 아무한테나 주장 가능.\n▸ 상대권: 정해진 사람한테만 가능.\n▸ 상계: 서로 빚 있으면 퉁치는 거."},{"title":"③ 신의성실의 원칙","sub":"민법총칙","body":"## 한 문장으로\n권리를 행사하고 의무를 이행할 때는 신의를 지키고 성실하게 하라는 원칙입니다. 민법 제2조에 있습니다.\n법 조문에 딱 맞더라도 그 방식이 너무 얄밉거나 부당하면 법원이 제동을 걸 수 있게 해두는 안전장치라고 보면 됩니다.\n\n## 네 가지 파생원칙\n시험은 거의 이 네 가지를 구분할 수 있는지 묻습니다.\n\n### 사정변경의 원칙\n계약할 때와 사정이 근본적으로 달라져서 원래대로 지키게 하는 것이 너무 가혹하면 계약을 고치거나 풀 수 있다는 원칙입니다.\n\n### 실효의 원칙\n권리가 있는데도 오랫동안 쓰지 않아 상대방이 이제 안 쓰겠구나 하고 믿게 되었다면, 뒤늦게 꺼내 쓰는 것을 막습니다.\n\n### 모순행위 금지(금반언)\n앞에서 한 말과 뒤에서 하는 행동이 어긋나면 안 된다는 것입니다. 스스로 유효하다고 해놓고 나중에 무효라고 주장하는 식은 허용되지 않습니다.\n\n### 권리남용 금지\n권리를 쓰긴 쓰는데 자기 이익은 거의 없고 상대를 괴롭히려는 목적이 뚜렷하면 그 행사를 인정하지 않습니다.\n\n> 함정 하나. 사적자치의 원칙은 신의칙의 파생원칙이 아닙니다. 민법 전체의 기본원리입니다. 선택지에 섞여 나오면 이것을 골라야 합니다.\n\n▸ 신의칙: 신의성실의 원칙을 줄여 부르는 말.\n▸ 금반언: 앞서 한 말을 뒤집지 못한다는 뜻.\n▸ 직권판단: 당사자가 주장하지 않아도 법원이 스스로 판단하는 것. 신의칙 위반과 권리남용이 여기에 해당합니다.","alt":"## 한 줄 요약\n\"법대로 하긴 했는데 너 좀 양심 없다\" 싶을 때 법원이 브레이크 거는 조항. 민법 2조.\n조문에 딱 안 걸려도 이걸로 잡을 수 있음. 만능키 같은 거.\n\n## 파생원칙 4개 (이게 시험 전부임)\n\n### 사정변경\n계약할 때랑 세상이 완전 달라짐. 원래대로 하라고 하면 너무 가혹함. 그럼 고치거나 엎을 수 있음.\n\n### 실효\n권리 있는데 10년째 안 씀. 상대방은 \"얘 그냥 포기했나 보다\" 하고 삶. 근데 갑자기 튀어나옴. 이건 못 하게 막음.\n\n### 모순행위 금지 (금반언)\n앞에선 \"유효함 ㅇㅇ\" 해놓고 뒤에서 \"저거 무효임\" 하는 거. 안 됨. 말 바꾸지 말라는 거.\n\n### 권리남용 금지\n내 이익은 1도 없는데 상대 괴롭히려고만 권리 행사함. 그럼 인정 안 해줌.\n\n> 🚨 함정 나옴\n> \"사적자치의 원칙\"이 선택지에 껴 있으면 그게 답임. 얘는 신의칙 자식이 아니라 민법 전체 대장임. 족보 다름.\n\n▸ 신의칙: 신의성실의 원칙 줄임말.\n▸ 금반언: 뱉은 말 주워담지 마라.\n▸ 직권판단: 아무도 주장 안 해도 법원이 알아서 판단하는 거. 신의칙 위반이랑 권리남용이 여기 해당함."},{"title":"④ 권리능력과 행위능력","sub":"민법총칙","body":"## 두 능력은 다릅니다\n이 둘을 섞으면 문제를 틀립니다.\n\n### 권리능력\n권리와 의무의 주인이 될 수 있는 자격입니다. 사람이면 누구나 있습니다. 갓난아기도, 의식이 없는 사람도 재산을 가질 수 있습니다.\n시작은 출생한 때, 끝은 사망한 때입니다. 그 사이에는 어떤 이유로도 없어지지 않습니다.\n\n### 행위능력\n혼자서 유효한 계약을 맺을 수 있는 자격입니다. 판단력이 부족한 사람은 이 능력이 제한됩니다.\n아기도 권리능력은 있지만 행위능력은 없습니다. 대신 부모가 법정대리인으로서 대신 해줍니다.\n\n## 태아는 예외적으로 보호합니다\n아직 태어나지 않았으니 원칙적으로 권리능력이 없습니다. 그러나 몇 가지 경우에는 이미 태어난 것으로 봐줍니다.\n- 불법행위로 인한 손해배상청구\n- 상속\n- 유증\n- 인지\n\n> 근로계약 체결은 여기 없습니다. 선택지에 자주 끼워 넣는 오답입니다.\n\n## 제한능력자 세 종류\n- 미성년자: 만 19세 미만\n- 피한정후견인: 판단력이 부족해 법원이 후견을 개시한 사람\n- 피성년후견인: 판단력이 지속적으로 결여되어 법원이 후견을 개시한 사람\n\n### 미성년자가 혼자 할 수 있는 것\n원칙은 법정대리인의 동의가 필요하고, 동의 없이 한 행위는 취소할 수 있습니다. 다만 예외가 있습니다.\n- 단순히 권리만 얻거나 의무를 면하는 행위\n- 법정대리인이 처분을 허락한 재산의 처분\n- 허락받은 영업에 관한 행위\n- 대리행위, 유언(만 17세 이상)\n\n> 부담부 증여를 받는 것은 의무가 따라오므로 안 됩니다. 자기 채권에 대한 변제를 받는 것도 채권이 사라지므로 안 된다는 것이 통설입니다. 이 두 개가 단골 오답입니다.\n\n▸ 법정대리인: 법이 정한 대리인. 미성년자는 보통 친권자인 부모입니다.\n▸ 취소: 일단 유효하게 성립했지만 나중에 없던 일로 되돌리는 것.\n▸ 상대방의 최고권과 철회권: 제한능력자와 거래한 상대방이 불안정한 상태를 정리하기 위해 갖는 권리.","alt":"## 둘이 완전 다름. 섞으면 틀림\n\n### 권리능력 = 주인이 될 자격\n숨만 쉬어도 있음. 갓난아기도 건물주 가능함. 진짜임.\n출생하면 생기고 죽으면 없어짐. 그 사이엔 뭔 일이 있어도 안 없어짐.\n\n### 행위능력 = 혼자 계약할 자격\n판단력 딸리면 제한됨.\n아기는 건물주는 될 수 있는데 그 건물 혼자 못 팖. 부모가 대신 해줌. 이 차이임.\n\n## 태아 (여기 무조건 나옴)\n아직 안 태어났으니 원칙은 권리능력 없음. 근데 예외 4개는 이미 태어난 걸로 쳐줌.\n- 불법행위 손해배상청구\n- 상속\n- 유증\n- 인지\n\n> 🚨 \"근로계약 체결\" 껴 있으면 그게 답임. 뱃속에서 취업하냐고. 매번 나오는 오답.\n\n## 제한능력자 3종\n미성년자(19세 미만) / 피한정후견인 / 피성년후견인\n\n### 미성년자가 혼자 해도 되는 거\n기본은 부모 동의 필요. 동의 없이 하면 취소 가능. 근데 예외 있음.\n- 걍 이득만 보는 행위\n- 부모가 \"이건 써도 됨\" 하고 준 돈 쓰기\n- 허락받은 영업 관련\n- 대리행위, 유언(17세부터)\n\n> 🚨 여기 단골 함정 2개\n> \"부담부 증여 받기\" → 공짜 같은데 의무가 딸려옴. 안 됨.\n> \"내 돈 받는 거(변제 수령)\" → 돈 받으면 채권이 사라지잖음. 권리를 잃는 거라 안 됨. 이거 진짜 헷갈림.\n\n▸ 법정대리인: 법이 정해준 대리인. 보통 부모.\n▸ 취소: 일단 유효했는데 나중에 없던 걸로 되돌리기.\n▸ 최고권/철회권: 미성년자랑 거래한 상대방이 \"할 거야 말 거야\" 물어보고 튈 수 있는 권리."},{"title":"⑤ 제한능력자 제도","sub":"민법총칙","body":"## 왜 있는 제도인가\n판단력이 부족한 사람이 손해 보는 계약을 해도 되돌릴 수 있게 해주는 장치입니다. 보호가 목적이라 항상 **제한능력자 쪽에 유리하게** 설계되어 있습니다.\n\n## 네 가지 유형\n### 미성년자\n만 19세 미만. 법정대리인 동의 없이 한 행위는 취소 가능.\n\n### 피성년후견인\n질병·장애 등으로 사무처리 능력이 **지속적으로 결여**된 사람. 가정법원이 선고합니다.\n원칙적으로 모든 법률행위를 취소할 수 있습니다. 다만 법원이 정한 범위와 일용품 구입 같은 일상행위는 취소 못 합니다.\n\n### 피한정후견인\n능력이 **부족한** 사람. 원칙적으로 행위능력이 있고, 법원이 정한 특정 행위만 후견인 동의가 필요합니다.\n> 성년후견은 원칙 취소, 한정후견은 원칙 유효. 방향이 반대입니다.\n\n### 피특정후견인\n일시적·특정 사무만 후원받는 사람. **행위능력이 제한되지 않습니다.** 선택지에 제한능력자로 껴 나오면 오답입니다.\n\n## 상대방 보호 장치 (자주 나옴)\n제한능력자와 거래한 사람은 계약이 언제 취소될지 몰라 불안합니다. 그래서 세 가지를 줍니다.\n- **최고권**: 추인할지 답하라고 촉구. 정해진 기간에 답이 없으면 추인한 것으로 봄\n- **철회권**: 계약을 물림. **선의**의 상대방만 가능\n- **거절권**: 단독행위에 대해 거절\n\n> 최고에 답이 없을 때의 결과가 헷갈립니다. 제한능력자 쪽은 능력자가 된 뒤 답이 없으면 **추인**으로 보고, 법정대리인이 특별한 절차가 필요한 행위에 답을 안 하면 **취소**로 봅니다.\n\n## 속임수를 쓴 경우\n제한능력자가 자기가 능력자인 것처럼 속이거나 동의를 받은 것처럼 속였다면 **취소할 수 없습니다.** 보호할 가치가 없어지기 때문입니다.\n\n▸ 법정대리인: 미성년자는 친권자, 후견 개시된 경우는 후견인.\n▸ 일용품: 일상생활에 필요하고 대가가 과도하지 않은 물건.\n▸ 추인: 취소하지 않겠다고 확정하는 것.","alt":"## 이 제도 목적\n판단력 딸리는 사람이 호구 잡히면 되돌릴 수 있게 해주는 거임. 목적이 보호니까 **무조건 제한능력자 편**으로 설계돼 있음.\n\n## 4종류\n\n### 미성년자\n19세 미만. 동의 없이 하면 취소 가능.\n\n### 피성년후견인\n능력이 **아예 없는** 수준. 법원이 선고함.\n**원칙 전부 취소 가능.** 단 법원이 정한 범위랑 편의점에서 삼각김밥 사는 정도는 취소 못 함.\n\n### 피한정후견인\n능력이 **좀 모자란** 수준.\n**원칙 유효.** 법원이 콕 집은 행위만 동의 필요.\n\n> 🚨 성년후견 = 원칙 취소 / 한정후견 = 원칙 유효. **방향이 정반대**임. 여기 뒤집어서 냄.\n\n### 피특정후견인\n잠깐 특정 일만 도와주는 거. **행위능력 제한 안 됨.**\n> 🚨 \"제한능력자에 해당하는 자는?\" 하고 얘를 껴놓음. 얘는 아님.\n\n## 상대방 보호 3종\n제한능력자랑 거래한 사람은 언제 취소당할지 몰라 불안하잖음. 그래서 줌.\n- **최고권**: \"할 거야 말 거야\" 물어봄\n- **철회권**: 계약 물리기. **선의**인 사람만\n- **거절권**: 단독행위 거절\n\n> 🚨 최고했는데 답 없으면?\n> 능력자 된 본인이 답 없음 → **추인** (계약 살아있음)\n> 법정대리인이 특별절차 필요한 거에 답 없음 → **취소**\n> 방향이 다름. 이거 물어봄.\n\n## 속임수 쓰면 끝\n\"저 성인인데요\" 하고 뻥침 → **취소 못 함.**\n보호해줄 이유가 없어짐. 사기 친 놈까지 보호할 순 없잖음.\n\n▸ 법정대리인: 부모 또는 후견인.\n▸ 일용품: 일상에 필요하고 비싸지 않은 거.\n▸ 추인: \"안 취소할게\" 확정."},{"title":"⑥ 부재자와 실종선고","sub":"민법총칙","body":"## 사람이 사라졌을 때\n어떤 사람이 집을 나가 소식이 끊기면 그 사람의 재산과 가족 관계가 붕 뜹니다. 민법은 두 단계로 대응합니다.\n\n### 1단계 부재자 재산관리\n아직 살아 있을 가능성이 있는 단계입니다. 법원이 재산관리인을 정해 재산이 망가지지 않게 관리만 합니다. 신분관계는 건드리지 않습니다.\n\n### 2단계 실종선고\n오래 지나 사망했다고 보는 것이 자연스러운 단계입니다. 법원이 실종선고를 하면 그 사람은 사망한 것으로 봅니다. 상속이 개시되고 혼인도 해소됩니다.\n\n## 실종기간\n- 보통실종: 5년. 마지막 소식이 있던 때부터 셉니다.\n- 특별실종: 1년. 전쟁, 선박 침몰, 항공기 추락 등 사망 가능성이 큰 사고를 겪은 경우입니다.\n\n> 사망으로 보는 시점이 시험에 나옵니다. 선고를 받은 날이 아니라 실종기간이 끝난 때에 사망한 것으로 봅니다.\n\n## 살아 돌아오면\n실종선고는 자동으로 없어지지 않습니다. 법원에 취소를 청구해야 합니다.\n취소하면 원칙적으로 처음부터 없던 일이 되지만, 그 사이에 선의로 이루어진 거래는 보호합니다. 재산을 받은 사람은 이익이 남아 있는 한도에서만 돌려주면 됩니다.\n\n▸ 선의: 어떤 사실을 몰랐다는 뜻. 착하다는 의미가 아닙니다.\n▸ 악의: 그 사실을 알고 있었다는 뜻.\n▸ 현존이익: 지금 남아 있는 이익. 이미 써버려 없어진 부분은 반환하지 않습니다.","alt":"## 사람이 증발했을 때\n집 나가서 연락 두절. 재산이랑 가족관계가 붕 뜸. 법은 2단계로 처리함.\n\n### 1단계 부재자 재산관리\n\"아직 살아있을 수도 있음\" 단계. 법원이 관리인 붙여서 재산만 지킴. 결혼 상태 이런 건 안 건드림.\n\n### 2단계 실종선고\n\"이 정도면 죽은 거 아님?\" 단계. 법원이 선고하면 사망으로 침. 상속 시작되고 혼인도 끝남.\n\n## 기간\n- 보통실종 5년: 그냥 연락 끊긴 경우\n- 특별실종 1년: 전쟁, 배 침몰, 비행기 추락. 죽었을 확률 높은 상황\n\n> 🚨 사망으로 보는 시점이 핵심임\n> 선고받은 날이 아님. **기간 끝난 날**임. 5년 지난 그 시점에 죽은 걸로 소급함. 이거 틀리라고 내는 문제 많음.\n\n## 근데 살아 돌아옴\n자동으로 안 없어짐. 법원 가서 취소 청구해야 함.\n취소하면 원칙적으로 없던 일 되는데, 그 사이 선의로 한 거래는 살려줌.\n재산 받아간 사람은 **남아 있는 만큼만** 돌려주면 됨. 이미 다 써버렸으면 배 째라 가능. (현존이익)\n\n▸ 선의: 몰랐다는 뜻. 착한 거 아님. 법에서 계속 나오니까 이거 꼭 기억.\n▸ 악의: 알고 있었다는 뜻.\n▸ 현존이익: 지금 남아있는 이익."},{"title":"⑦ 법인","sub":"민법총칙","body":"## 법인이 왜 필요한가\n회사나 학교, 재단은 사람이 아닌데도 재산을 갖고 계약을 합니다. 법이 그런 조직에 사람과 같은 자격을 인정해준 것이 법인입니다.\n\n## 두 종류\n### 사단법인\n사람의 모임입니다. 사원이 있고 사원총회가 최고 의사결정기관입니다. 정관을 사원들이 바꿀 수 있습니다.\n\n### 재단법인\n재산의 모임입니다. 설립자가 내놓은 재산이 중심이고 사원이 없습니다. 따라서 사원총회도 없습니다.\n\n> 사단법인은 영리와 비영리 모두 가능하지만 재단법인은 비영리만 가능합니다. 영리를 목적으로 하는 사단법인이 곧 회사입니다.\n\n## 기관\n- 이사: 법인을 대표하고 사무를 집행합니다. 반드시 두어야 합니다.\n- 감사: 감독기관이지만 임의기관입니다. 없어도 됩니다.\n- 사원총회: 사단법인의 최고기관. 재단법인에는 없습니다.\n\n## 법인의 불법행위책임\n민법 제35조입니다. 이사 같은 대표기관이 직무에 관하여 남에게 손해를 입히면 법인이 배상합니다.\n이때 행위를 한 대표기관 개인도 책임을 면하지 못합니다. 둘이 함께 책임지는 구조입니다.\n\n> 직무에 관하여라는 요건이 중요합니다. 외형상 직무 범위 안으로 보이면 실제로는 권한을 넘었더라도 법인이 책임집니다.\n\n▸ 정관: 법인의 조직과 운영에 관한 근본 규칙.\n▸ 설립등기: 법인은 등기를 해야 성립합니다. 등기가 성립요건입니다.\n▸ 권리능력 없는 사단: 종중이나 동창회처럼 실체는 사단인데 법인 등기를 하지 않은 단체.","alt":"## 왜 만들었냐\n삼성전자는 사람이 아닌데 건물 사고 계약함. 이상하잖음.\n그래서 법이 \"얘도 사람 취급해줄게\" 한 게 법인임.\n\n## 2종류\n\n### 사단법인 = 사람 모임\n회원(사원) 있음. 사원총회가 최고 결정기관. 정관도 자기들이 바꿈.\n\n### 재단법인 = 돈 모임\n설립자가 던진 재산이 주인공. 사원 없음. 그러니까 **사원총회도 없음**.\n\n> 🚨 사단법인은 영리도 비영리도 됨. 재단법인은 비영리만 됨.\n> 영리 목적 사단법인 = 그게 회사임.\n\n## 기관\n- 이사: 필수. 대표하고 일함.\n- 감사: **임의기관**. 없어도 됨. 이거 함정으로 나옴.\n- 사원총회: 사단법인만 있음.\n\n## 35조 불법행위책임 (제일 많이 나옴)\n대표기관이 **직무에 관하여** 남한테 손해 입히면 법인이 물어줌.\n근데 사고 친 개인도 같이 책임짐. 둘 다 물어내는 구조임. \"개인은 책임 없다\"고 써있으면 오답.\n\n> \"직무에 관하여\"가 핵심임. 겉보기에 직무처럼 보이면 실제로 권한 넘었어도 법인이 책임짐. 상대방 입장에선 알 수가 없으니까.\n\n▸ 정관: 법인 헌법 같은 거.\n▸ 설립등기: 등기해야 법인 생김. 등기가 성립요건임.\n▸ 권리능력 없는 사단: 종중, 동창회처럼 모임은 모임인데 등기 안 한 애들."},{"title":"⑧ 법인의 기관과 소멸","sub":"민법총칙","body":"## 기관 정리\n### 이사\n필수기관입니다. 법인을 대표하고 사무를 집행합니다. 이사가 여럿이면 각자 법인을 대표하는 것이 원칙입니다.\n이사의 대표권 제한은 **정관에 적고 등기해야** 제3자에게 대항할 수 있습니다.\n\n### 감사\n**임의기관**입니다. 없어도 됩니다. 이 점이 시험에 자주 나옵니다.\n\n### 사원총회\n사단법인의 최고 의사결정기관입니다. 재단법인에는 없습니다.\n- 통상총회: 매년 1회 이상\n- 임시총회: 이사가 필요하다고 인정할 때, 또는 총사원 5분의 1 이상의 청구가 있을 때\n\n## 정관 변경\n### 사단법인\n총사원 3분의 2 이상의 동의가 필요하고 주무관청의 허가를 받아야 효력이 생깁니다.\n\n### 재단법인\n설립자의 뜻이 굳어 있어 원칙적으로 변경할 수 없습니다. 다만 정관에 변경 방법을 정해두었거나, 목적 달성이 불가능해진 경우 등 예외가 있습니다.\n\n## 해산과 청산\n법인이 없어지는 것은 두 단계입니다.\n- **해산**: 활동을 멈추는 것. 존립기간 만료, 목적 달성 불능, 파산, 설립허가 취소, 사원총회 결의 등\n- **청산**: 남은 재산을 정리하는 것\n\n> 해산했다고 법인이 바로 사라지지 않습니다. 청산이 끝날 때까지 **청산의 목적 범위 안에서** 계속 존속합니다. 이 표현 그대로 나옵니다.\n\n잔여재산은 정관에 정한 자 → 주무관청 허가를 얻어 유사 목적에 처분 → 국고 귀속 순서로 갑니다.\n\n▸ 주무관청: 그 법인을 감독하는 정부 부처.\n▸ 청산인: 청산 사무를 처리하는 사람. 보통 기존 이사가 됩니다.\n▸ 대항하지 못한다: 그 사람에게 주장할 수 없다.","alt":"## 기관 3개\n\n### 이사 (필수)\n법인 대표하고 일함. 여럿이면 각자 대표가 원칙.\n> 🚨 대표권 제한은 **정관에 적고 등기까지** 해야 제3자한테 통함. 정관에만 적으면 소용없음.\n\n### 감사 (임의)\n> 🚨 **없어도 됨.** \"반드시 두어야 한다\" 나오면 오답. 진짜 자주 나옴.\n\n### 사원총회\n사단법인 최고기관. 재단법인엔 없음.\n임시총회는 총사원 **5분의 1 이상**이 요구하면 열림. 숫자 나옴.\n\n## 정관 변경\n- 사단법인: 총사원 **3분의 2** 동의 + 주무관청 허가\n- 재단법인: **원칙 변경 불가.** 설립자 뜻이 박제된 거라서. 예외는 정관에 방법을 적어놨거나 목적 달성이 불가능해진 경우\n\n## 해산이랑 청산\n- **해산**: 영업 종료. 셔터 내림\n- **청산**: 남은 재산 정리. 뒷정리\n\n> 🚨 해산했다고 법인이 증발 안 함.\n> **청산 목적 범위 내에서 계속 존속함.** 이 문장 그대로 선택지에 나옴.\n> 폐업 신고했다고 미수금 안 받고 튀는 거 아니잖음. 그거랑 같음.\n\n남은 재산 순서: 정관에 정한 사람 → 허가받아 비슷한 목적에 씀 → **국고 귀속**\n\n▸ 주무관청: 감독하는 부처.\n▸ 청산인: 뒷정리 담당. 보통 기존 이사."},{"title":"⑨ 권리능력 없는 사단","sub":"민법총칙","body":"## 이게 뭐냐면\n종중, 동창회, 아파트 입주자대표회의처럼 **실질은 단체인데 법인 등기를 안 한** 모임입니다.\n법인이 아니니 법인 규정을 그대로 쓸 수는 없지만, 개인들의 단순한 모임으로 보기에는 조직이 너무 갖춰져 있습니다. 그래서 법이 어중간한 지위를 인정해줍니다.\n\n## 성립 요건\n- 단체로서의 조직을 갖출 것 (대표자, 의사결정 방법 등)\n- 구성원이 바뀌어도 단체가 유지될 것\n- 대표의 방법, 총회 운영, 재산관리 등이 정해져 있을 것\n\n## 재산은 어떻게 갖나\n**총유**입니다. 이게 핵심입니다.\n- 공유: 각자 지분이 있고 마음대로 처분 가능\n- 합유: 지분은 있지만 마음대로 처분 못 함 (조합)\n- **총유: 지분 자체가 없음.** 단체가 통째로 가짐\n\n총유 재산의 처분은 **사원총회의 결의**를 거쳐야 합니다. 대표자가 마음대로 팔 수 없습니다.\n\n## 소송은 할 수 있나\n할 수 있습니다. 대표자나 관리인이 있으면 **단체 이름으로** 당사자가 될 수 있습니다.\n부동산 등기도 단체 이름으로 할 수 있습니다.\n\n> 정리하면 이렇습니다. 법인은 아니지만 소송도 하고 등기도 합니다. 다만 재산 보유 방식이 총유라는 점, 처분에 총회 결의가 필요하다는 점이 다릅니다.\n\n▸ 총유: 지분 없이 단체가 통째로 소유하는 형태.\n▸ 종중: 같은 조상의 후손들로 이루어진 친족 집단.\n▸ 당사자능력: 소송에서 원고나 피고가 될 수 있는 자격.","alt":"## 뭔 소리냐\n종중, 동창회, 입주자대표회의 같은 거임.\n모임은 모임인데 **법인 등기를 안 함.** 근데 조직은 갖춰져 있음. 애매하잖음. 그래서 법이 반쯤 인정해줌.\n\n## 요건\n- 조직 갖춤 (대표, 의사결정 방법)\n- 사람 바뀌어도 단체는 유지됨\n- 총회 운영, 재산관리 방법 정해져 있음\n\n## 재산 갖는 방식 = 총유 (이게 핵심)\n소유 형태 3종 비교하면 이해 빠름.\n- **공유**: 내 지분 있음. 내 맘대로 팔아도 됨\n- **합유**: 지분 있는데 맘대로 못 팜 (조합)\n- **총유**: **지분 자체가 없음.** 단체 통짜 소유\n\n> 🚨 총유 재산 팔려면 **사원총회 결의** 필요함.\n> 회장이 혼자 종중 땅 팔면? 무효임. 이거 판례로도 문제 나옴.\n\n## 소송이랑 등기\n둘 다 됨.\n대표자만 있으면 **단체 이름으로** 소송 당사자 됨. 부동산 등기도 단체 이름으로 가능함.\n\n> 정리: 법인 아닌데 소송하고 등기함. 차이는 재산이 **총유**라는 거랑 처분에 **총회 결의** 필요하다는 거. 딱 이 두 개만 기억하면 됨.\n\n▸ 총유: 지분 없이 통짜 소유.\n▸ 종중: 같은 조상 후손 모임.\n▸ 당사자능력: 소송에서 원고·피고 될 자격."},{"title":"⑩ 물건과 과실","sub":"민법총칙","body":"## 물건의 요건\n민법에서 물건이란 유체물과 전기 기타 관리할 수 있는 자연력입니다. 조건이 세 가지 있습니다.\n- 관리할 수 있을 것\n- 사람의 몸이 아닐 것\n- 독립한 존재일 것\n\n> 살아 있는 사람의 몸은 물건이 아닙니다. 몸에서 분리된 머리카락이나 혈액은 물건이 됩니다.\n\n## 부동산과 동산\n- 부동산: 토지와 그 정착물\n- 동산: 부동산이 아닌 모든 물건\n\n토지에 붙어 있는 건물은 우리 법에서 토지와 별개의 부동산입니다. 이것이 외국과 다른 큰 특징이라 시험에 나옵니다.\n자동차, 선박, 항공기는 동산이지만 등기나 등록을 하게 되어 있어 부동산처럼 다뤄지는 부분이 있습니다.\n\n## 주물과 종물\n주된 물건에 딸린 물건을 종물이라고 합니다. 배와 노, 자물쇠와 열쇠 같은 관계입니다.\n핵심 규정은 하나입니다. 종물은 주물의 처분에 따릅니다. 집을 팔면 딸린 창고도 함께 넘어갑니다.\n\n> 이 규정은 임의규정입니다. 당사자가 창고는 빼고 팔기로 하면 그렇게 됩니다. 또한 주물과 종물은 소유자가 같아야 합니다.\n\n## 원물과 과실\n과실은 물건에서 나오는 수익입니다.\n- 천연과실: 물건 자체에서 자연적으로 나오는 것. 과일, 새끼, 우유.\n- 법정과실: 물건을 남에게 쓰게 하고 받는 대가. 임대료, 이자.\n\n천연과실은 분리되는 때에 그것을 수취할 권리가 있는 사람이 갖습니다. 법정과실은 존속기간에 따라 날짜로 나눠 갖습니다.\n\n▸ 정착물: 토지에 고정되어 계속 붙어 있는 물건. 건물, 수목 등.\n▸ 수취권: 과실을 가져갈 권리.","alt":"## 물건 조건 3개\n- 관리 가능할 것\n- 사람 몸 아닐 것\n- 독립된 것일 것\n\n> 🚨 살아있는 몸은 물건 아님. 근데 잘라낸 머리카락, 뽑은 피는 물건 됨. 좀 기괴한데 나옴.\n\n## 부동산 vs 동산\n- 부동산: 토지 + 정착물\n- 동산: 나머지 전부\n\n> 🚨 한국 특징: 건물이 토지랑 **별개 부동산**임. 외국은 땅 사면 건물 딸려오는데 우리는 따로임. 이래서 지상권 이런 게 생김.\n\n자동차 배 비행기는 동산인데 등록하니까 부동산처럼 취급되는 부분 있음.\n\n## 주물이랑 종물\n배랑 노, 자물쇠랑 열쇠 관계.\n**종물은 주물 따라감.** 집 팔면 딸린 창고도 같이 넘어감. 이거 한 줄이 전부임.\n\n> 근데 임의규정임. \"창고는 빼고 팔게요\" 하면 그렇게 됨.\n> 그리고 주물이랑 종물은 **주인이 같아야 함**. 남의 창고는 안 딸려감.\n\n## 과실 (열매)\n- 천연과실: 물건에서 자연적으로 나옴. 사과, 송아지, 우유.\n- 법정과실: 빌려주고 받는 돈. 월세, 이자.\n\n천연과실은 **분리될 때** 권리자가 먹음.\n법정과실은 **날짜 비례로** 나눔. 월 중간에 집 팔면 월세도 일할 계산.\n\n▸ 정착물: 땅에 박혀서 계속 붙어있는 거.\n▸ 수취권: 열매 가져갈 권리."},{"title":"⑪ 법률행위와 의사표시","sub":"민법총칙","body":"## 법률행위란\n사람이 원하는 대로 법적 효과를 만들어내는 행위입니다. 계약, 유언, 해제 같은 것들입니다.\n핵심은 의사표시입니다. 내가 이렇게 하고 싶다는 뜻을 밖으로 드러내면 법이 그대로 효과를 붙여줍니다. 이것이 사적자치가 작동하는 방식입니다.\n\n## 종류\n- 단독행위: 한 사람의 의사표시로 성립. 유언, 해제, 취소.\n- 계약: 두 사람의 의사가 맞아야 성립. 매매, 임대차.\n- 합동행위: 여러 사람이 같은 방향으로 뜻을 모음. 사단법인 설립.\n\n## 법률행위가 유효하려면\n네 가지가 모두 갖춰져야 합니다.\n- 확정성: 내용이 정해질 수 있을 것\n- 가능성: 실현할 수 있을 것\n- 적법성: 강행규정에 어긋나지 않을 것\n- 사회적 타당성: 선량한 풍속 기타 사회질서에 어긋나지 않을 것\n\n## 제103조 반사회질서 행위\n사회질서에 반하는 법률행위는 무효입니다. 도박자금 대여, 범죄를 조건으로 한 계약, 첩 계약 등이 예입니다.\n부동산 이중매매는 원칙적으로 유효합니다. 다만 두 번째 매수인이 매도인의 배임행위에 적극 가담했다면 무효가 됩니다.\n\n## 제104조 불공정한 법률행위\n폭리행위라고도 합니다. 세 요건이 모두 필요합니다.\n- 피해자의 궁박, 경솔 또는 무경험\n- 급부와 반대급부 사이의 현저한 불균형\n- 상대방이 그 사정을 알고 이용하려는 의사\n\n> 단순히 값이 비싸다는 것만으로는 무효가 되지 않습니다. 세 요건을 함께 묻는 문제가 자주 나옵니다.\n\n▸ 급부: 계약에서 주고받기로 한 것.\n▸ 궁박: 몹시 곤궁하고 절박한 상태.\n▸ 배임: 맡은 임무를 저버리는 것.","alt":"## 법률행위가 뭐냐\n내가 원하는 대로 법적 효과 만드는 거. 계약, 유언, 해제 다 여기 들어감.\n핵심은 **의사표시**임. 내가 \"이거 살래\" 하고 밖으로 뱉으면 법이 효과 붙여줌. 이게 사적자치 작동 원리.\n\n## 종류\n- 단독행위: 혼자 뱉으면 끝. 유언, 해제, 취소\n- 계약: 둘이 맞아야 함. 매매, 임대차\n- 합동행위: 여럿이 같은 방향. 법인 설립\n\n## 유효하려면 4개 필요\n확정 가능 / 실현 가능 / 적법 / 사회질서 안 어김\n\n## 103조 반사회질서 → 무효\n도박자금 빌려주기, 범죄 조건 계약, 첩 계약. 이런 거.\n\n> 🚨 부동산 이중매매 (진짜 자주 나옴)\n> 그냥 두 번 파는 거? **유효함.** 먼저 등기한 놈이 임자임.\n> 근데 두 번째 사람이 \"야 저 사람이랑 계약했다며? 나한테 팔아\" 하고 **적극 가담**하면 그때 무효됨.\n> \"악의면 무효\"라고 써있으면 오답임. 알기만 한 거랑 부추긴 거랑 다름.\n\n## 104조 불공정한 법률행위 (폭리행위)\n3개 다 있어야 무효임. 하나라도 빠지면 안 됨.\n- 피해자가 궁박/경솔/무경험\n- 주고받는 게 심하게 불균형\n- 상대방이 그거 알고 이용함\n\n> 그냥 비싸게 팔았다고 무효 아님. 3개 세트로 물어봄.\n\n▸ 급부: 주고받기로 한 거.\n▸ 궁박: 엄청 급하고 절박한 상태.\n▸ 배임: 맡은 일 배신하는 거."},{"title":"⑫ 법률행위의 해석","sub":"민법총칙","body":"## 왜 해석이 필요한가\n계약서에 적힌 말이 애매할 때가 있습니다. 그때 무슨 뜻으로 볼지 정하는 작업이 해석입니다.\n\n## 세 가지 방법\n### 자연적 해석\n표현이 뭐였든 **당사자가 실제로 뜻한 바**를 찾습니다.\n둘 다 같은 오해를 하고 있었다면 그 오해대로 계약이 성립합니다. 이걸 오표시 무해의 원칙이라고 합니다.\n\n> 예를 들어 둘 다 A토지를 거래할 생각이었는데 계약서에 실수로 B토지라고 적었다면, A토지 계약으로 봅니다. 이때는 **착오 취소 문제도 생기지 않습니다.** 애초에 뜻이 일치했으니까요.\n\n### 규범적 해석\n당사자의 뜻이 서로 다를 때, **상대방이 이해했을 만한 의미**로 정합니다. 표시를 신뢰한 쪽을 보호하는 방향입니다.\n\n### 보충적 해석\n계약에 빠진 부분이 있을 때, 당사자였다면 어떻게 정했을지를 따져 메웁니다.\n\n## 해석의 순서와 기준\n1. 당사자가 정한 것\n2. 관습 (사실인 관습)\n3. 임의규정\n4. 조리\n\n> 순서가 시험에 나옵니다. **임의규정보다 관습이 앞섭니다.** 민법 제106조에 그렇게 되어 있습니다. 강행규정은 당연히 이 모든 것보다 앞섭니다.\n\n▸ 오표시 무해: 잘못 적었어도 뜻이 통했으면 문제없다는 원칙.\n▸ 사실인 관습: 사회에서 실제로 통용되는 관행.\n▸ 조리: 사물의 이치. 판단 기준이 아무것도 없을 때 마지막으로 기대는 것.","alt":"## 왜 필요함\n계약서 문구가 애매할 때 \"이거 무슨 뜻임?\" 정하는 작업임.\n\n## 3가지 방법\n\n### 자연적 해석\n글자가 뭐든 **실제로 뭘 원했는지**를 봄.\n둘 다 똑같이 착각했으면 그 착각대로 계약 성립함. 이걸 **오표시 무해의 원칙**이라 함.\n\n> 🚨 둘 다 A땅 거래할 생각이었는데 계약서에 B땅이라 적음 → **A땅 계약**으로 봄.\n> 그리고 여기서 중요한 거. 이 경우 **착오 취소 문제 안 생김.**\n> 왜? 애초에 둘 뜻이 맞았으니까. 착오가 아니라 그냥 오타임.\n> 이거 함정으로 나옴. \"착오로 취소할 수 있다\" 하면 오답.\n\n### 규범적 해석\n둘 뜻이 다름 → **상대방이 알아들었을 의미**로 정함. 표시 믿은 쪽 보호.\n\n### 보충적 해석\n계약에 빈칸 있음 → \"얘네가 정했으면 이렇게 했겠지\" 하고 메움.\n\n## 적용 순서 (외워)\n당사자가 정한 거 → **관습** → **임의규정** → 조리\n\n> 🚨 **관습이 임의규정보다 앞섬.** 106조.\n> 법보다 관습이 먼저라는 게 이상해 보여서 뒤집어 냄. 근데 임의규정은 어차피 \"안 정했으면 이렇게 해\"인 거라 관습이 있으면 관습이 이김.\n> 강행규정은 당연히 다 씹고 1등임.\n\n▸ 오표시 무해: 잘못 적었어도 뜻 통했으면 OK.\n▸ 조리: 사물 이치. 진짜 아무것도 없을 때 마지막 카드."},{"title":"⑬ 의사표시의 하자","sub":"민법총칙","body":"## 네 가지를 구분하는 것이 전부\n어떤 이유로 뜻이 삐뚤어졌는지에 따라 결과가 다릅니다. 무효인지 취소인지, 제3자 보호가 되는지를 표로 외우는 것이 가장 빠릅니다.\n\n### 비진의표시 (제107조)\n속으로는 그럴 뜻이 없으면서 겉으로만 표시한 경우입니다. 농담이나 형식적인 사표 제출 같은 것입니다.\n원칙은 유효입니다. 다만 상대방이 진의 아님을 알았거나 알 수 있었다면 무효가 됩니다.\n\n### 통정허위표시 (제108조)\n상대방과 짜고 거짓으로 꾸민 경우입니다. 빚을 피하려고 친구에게 집을 파는 척하는 것이 예입니다.\n당사자 사이에서는 무효입니다. 그러나 그 무효를 선의의 제3자에게는 주장할 수 없습니다.\n\n### 착오 (제109조)\n잘못 알고 표시한 경우입니다. 법률행위 내용의 중요부분에 착오가 있으면 취소할 수 있습니다.\n다만 표의자에게 중대한 과실이 있으면 취소하지 못합니다.\n\n### 사기와 강박 (제110조)\n속아서 하거나 겁을 먹고 한 경우입니다. 취소할 수 있습니다.\n제3자가 사기나 강박을 한 경우에는 상대방이 그 사실을 알았거나 알 수 있었을 때만 취소할 수 있습니다.\n\n## 공통으로 나오는 함정\n> 위 네 가지 모두 그 무효나 취소를 선의의 제3자에게 대항하지 못합니다. 거래의 안전을 지키기 위한 장치입니다.\n> 제3자는 선의이기만 하면 되고 무과실까지는 요구되지 않는다는 것이 판례입니다. 선택지에 선의·무과실이라고 써두면 오답입니다.\n\n▸ 표의자: 의사표시를 한 사람.\n▸ 중대한 과실: 조금만 주의했다면 알 수 있었을 정도의 큰 부주의.\n▸ 대항하지 못한다: 그 사람에게는 주장할 수 없다는 뜻.","alt":"## 이 단원은 표로 외우는 게 답임\n왜 뜻이 삐뚤어졌냐에 따라 무효냐 취소냐가 갈림.\n\n### 비진의표시 (107조) — 뻥\n속마음은 아닌데 겉으로만 말함. 홧김에 낸 사표 같은 거.\n**원칙 유효.** 진짜 사표 처리됨.\n근데 상대방이 \"쟤 홧김이네\" 알았거나 알 수 있었으면 무효.\n\n### 통정허위표시 (108조) — 짜고 침\n상대방이랑 짜고 가짜 계약. 빚 피하려고 친구한테 집 넘긴 척.\n당사자끼리는 **무효**. 근데 모르고 산 제3자한테는 무효라고 못 우김.\n\n### 착오 (109조) — 잘못 앎\n중요부분에 착오 있으면 **취소 가능**.\n근데 내가 너무 대충 확인해서 그런 거면(중대한 과실) 취소 못 함. 자업자득.\n\n### 사기·강박 (110조) — 속거나 협박당함\n**취소 가능**.\n제3자가 사기 친 경우엔 상대방이 알았거나 알 수 있었을 때만 취소 됨.\n\n## 4개 다 공통인 거 (이게 핵심)\n> 🚨 무효든 취소든 **선의의 제3자한테는 못 우김.** 거래 안전 지켜야 하니까.\n> 그리고 제3자는 **선의면 끝**임. 과실 있어도 보호받음.\n> 선택지에 \"선의이고 무과실이어야\" 써있으면 그거 오답임. 100% 나옴.\n\n▸ 표의자: 의사표시 한 사람.\n▸ 중대한 과실: 조금만 봤어도 알았을 정도로 대충함.\n▸ 대항하지 못한다: 걔한테는 주장 못 한다."},{"title":"⑭ 착오","sub":"민법총칙","body":"## 착오가 뭔가\n잘못 알고 의사표시를 한 경우입니다. 내가 표시한 것과 내 진짜 뜻이 다른데, 그걸 나도 모르고 있는 상태입니다.\n비진의표시는 나는 알고 있는 것이고, 착오는 나도 모르는 것입니다. 이 차이가 구분 기준입니다.\n\n## 취소 요건 두 가지\n### 법률행위 내용의 중요부분에 착오가 있을 것\n- 그 착오가 없었다면 그런 의사표시를 하지 않았을 것 (주관적 인과관계)\n- 보통 사람이라도 그랬을 것 (객관적 현저성)\n\n두 가지가 다 있어야 중요부분입니다.\n\n### 표의자에게 중대한 과실이 없을 것\n조금만 주의했으면 알 수 있었는데 안 봤다면 취소하지 못합니다.\n\n> 다만 예외가 있습니다. **상대방이 표의자의 착오를 알면서 이용한 경우**에는 표의자에게 중대한 과실이 있어도 취소할 수 있습니다. 판례입니다.\n\n## 동기의 착오\n계약 내용 자체가 아니라 그렇게 하게 된 **이유**를 착각한 경우입니다.\n예를 들어 도로가 뚫린다는 소문을 믿고 땅을 샀는데 사실이 아닌 경우입니다.\n원칙적으로 취소할 수 없습니다. 동기는 계약 내용이 아니기 때문입니다.\n\n> 다만 그 동기가 **상대방에게 표시되어 계약 내용으로 편입**되었다면 취소할 수 있습니다. 이게 시험에 나오는 지점입니다. \"동기의 착오는 언제나 취소할 수 있다\"는 오답이고, \"언제나 취소할 수 없다\"도 오답입니다.\n\n## 효과\n취소할 수 있고, 취소하면 처음부터 무효가 됩니다.\n그 취소를 **선의의 제3자에게는 대항하지 못합니다.**\n\n> 착오로 취소한 사람이 상대방에게 손해배상을 해야 하는지가 논점인데, 판례는 **불법행위가 성립하지 않는다**고 봅니다. 법이 인정한 권리를 행사한 것뿐이기 때문입니다.\n\n▸ 표의자: 의사표시를 한 사람.\n▸ 중대한 과실: 보통의 주의만 기울였어도 알았을 정도의 부주의.\n▸ 편입: 계약의 내용으로 들어가는 것.","alt":"## 착오 = 나도 모르게 잘못 앎\n표시한 거랑 진심이 다른데 **나도 모름**.\n비진의표시는 내가 **알면서** 다르게 말한 거. 이게 차이임.\n\n## 취소하려면 2개 필요\n\n### 1. 중요부분 착오일 것\n- 그거 알았으면 계약 안 했을 것 (나 기준)\n- 보통 사람도 그랬을 것 (남 기준)\n\n둘 다 있어야 함. 나만 중요하게 생각한 건 안 됨.\n\n### 2. 나한테 중대한 과실 없을 것\n대충 보고 사인해놓고 취소하겠다? 안 됨.\n\n> 🚨 근데 예외 있음. 진짜 자주 나옴.\n> **상대방이 내 착오를 알면서 이용해먹었으면** 나한테 중과실 있어도 **취소 가능**함.\n> 알고도 낚은 놈까지 보호할 순 없잖음.\n\n## 동기의 착오 (여기가 핵심)\n계약 내용이 아니라 **왜 그랬는지**를 착각한 거.\n\"길 뚫린대\" 듣고 땅 샀는데 뻥이었음. 이런 거.\n\n**원칙 취소 불가.** 동기는 계약 내용이 아니니까. 니 사정임.\n\n> 🚨 근데 그 동기를 **상대방한테 말해서 계약 내용에 넣었으면** 취소 가능함.\n> \"길 뚫린다길래 사는 겁니다\" 하고 계약서에 박아놨으면 됨.\n> 선택지에 \"동기의 착오는 언제나 취소할 수 있다\" → 오답\n> \"언제나 취소할 수 없다\" → 이것도 오답\n> **언제나**가 들어가면 대체로 오답임.\n\n## 효과\n취소 가능. 취소하면 처음부터 무효.\n**선의의 제3자한테는 못 우김.** (이건 하자 4형제 공통)\n\n> 🚨 착오로 취소한 사람이 상대방한테 손해배상 해야 하나?\n> 판례: **불법행위 아님.** 법이 준 권리 쓴 건데 왜 배상함.\n\n▸ 표의자: 의사표시 한 사람.\n▸ 중대한 과실: 조금만 봤어도 알았을 부주의.\n▸ 편입: 계약 내용으로 들어가는 거."},{"title":"⑮ 사기와 강박","sub":"민법총칙","body":"## 둘의 차이\n- **사기**: 속여서 착각하게 만든 것\n- **강박**: 겁을 줘서 어쩔 수 없이 하게 만든 것\n\n둘 다 **취소할 수 있습니다.** 무효가 아닙니다.\n\n## 사기의 요건\n- 상대방을 속이려는 고의 (2단의 고의)\n- 기망행위가 있을 것\n- 그 기망이 위법할 것\n- 기망으로 착오에 빠져 의사표시를 했을 것\n\n> **침묵도 기망이 될 수 있습니다.** 알려줄 신의칙상 의무가 있는데 숨긴 경우입니다. 반면 상품을 파는 사람이 어느 정도 과장해서 광고하는 것은 위법한 기망으로 보지 않습니다. 이 두 가지가 자주 나옵니다.\n\n## 강박의 요건\n- 겁을 주려는 고의\n- 해악을 고지할 것\n- 위법할 것\n- 그로 인해 공포심이 생겨 의사표시를 했을 것\n\n> **강박의 정도가 극심해서 의사결정의 자유가 완전히 박탈된 경우에는 취소가 아니라 무효**입니다. 판례입니다. 여기가 함정으로 나옵니다.\n\n## 제3자가 사기·강박을 한 경우\n계약 상대방이 아니라 다른 사람이 속인 경우입니다.\n**상대방이 그 사실을 알았거나 알 수 있었을 때만** 취소할 수 있습니다.\n아무것도 모르는 상대방까지 피해를 볼 수는 없기 때문입니다.\n\n> 다만 상대방의 대리인이나 피용자가 사기를 한 경우는 제3자로 보지 않습니다. 상대방 쪽 사람이니까요. 이때는 그냥 취소할 수 있습니다.\n\n## 효과와 경합\n취소할 수 있고, 선의의 제3자에게는 대항하지 못합니다.\n사기를 당한 사람은 취소하는 대신 **불법행위로 손해배상을 청구할 수도** 있습니다. 취소와 손해배상은 함께 갈 수 있습니다.\n\n▸ 기망: 사실이 아닌 것을 사실인 것처럼 꾸미는 것.\n▸ 해악의 고지: 나쁜 일이 생길 거라고 알리는 것.\n▸ 2단의 고의: 착오에 빠뜨리려는 고의 + 그로 인해 의사표시를 하게 하려는 고의.","alt":"## 차이\n- **사기**: 속여서 착각시킴\n- **강박**: 겁줘서 억지로 시킴\n\n둘 다 **취소**임. 무효 아님. 이거 헷갈리는 사람 많음.\n\n## 사기 요건\n속이려는 고의 + 기망행위 + 위법 + 그것 때문에 계약함\n\n> 🚨 여기 2개 나옴\n> **침묵도 사기 됨.** 말해줄 의무 있는데 숨기면 기망임.\n> 근데 **광고 과장은 사기 아님.** \"이거 대박입니다\" 정도는 다들 하는 거라 위법 아님.\n> 이 두 개 방향이 반대라 같이 외워야 함.\n\n## 강박 요건\n겁주려는 고의 + 해악 고지 + 위법 + 무서워서 계약함\n\n> 🚨 **강박이 너무 심해서 의사결정 자유가 완전히 없어졌으면 → 취소 아니고 무효.**\n> 칼 들이대고 사인시킨 수준. 그건 애초에 의사표시라고 볼 수가 없음.\n> \"강박은 항상 취소사유다\" → 오답. 이거 함정임.\n\n## 제3자가 사기 친 경우\n계약 상대방 말고 딴 놈이 속였음.\n→ **상대방이 알았거나 알 수 있었을 때만** 취소 가능.\n모르는 상대방까지 피 볼 순 없잖음.\n\n> 🚨 근데 상대방의 **대리인이나 직원**이 사기 쳤으면? 얘넨 제3자 아님. 상대방 식구임.\n> 그냥 취소 가능함. 이거 구분해서 냄.\n\n## 효과\n취소 가능. **선의의 제3자한테는 못 우김.**\n그리고 취소 말고 **손해배상 청구도 가능**함. 둘 다 해도 됨.\n\n▸ 기망: 뻥치는 거.\n▸ 해악의 고지: \"너 이렇게 될 줄 알아\" 하는 거.\n▸ 2단의 고의: 착각시키려는 고의 + 그래서 계약시키려는 고의."},{"title":"⑯ 의사표시의 효력발생","sub":"민법총칙","body":"## 언제부터 효력이 생기나\n편지로 계약을 해지한다고 보냈습니다. 쓴 때? 부친 때? 도착한 때? 읽은 때?\n민법 제111조는 **도달한 때**로 정합니다. 이것을 도달주의라고 합니다.\n\n## 도달의 의미\n상대방이 실제로 읽어야 하는 것은 아닙니다. **알 수 있는 상태에 놓이면** 도달입니다.\n우편함에 들어갔으면 도달입니다. 뜯어보지 않았어도 마찬가지입니다.\n\n> 상대방이 정당한 이유 없이 수령을 거절한 경우에도 도달로 봅니다. 안 받으면 그만이라는 식은 통하지 않습니다.\n\n## 발신 후에 생기는 일\n### 표의자가 죽거나 능력을 잃은 경우\n의사표시의 효력에 **영향이 없습니다.** 이미 보낸 것은 그대로 효력이 생깁니다.\n\n### 도달 전에 철회할 수 있나\n도달하기 전이면 철회할 수 있습니다. 아직 효력이 안 생겼으니까요. 다만 철회 통지가 원래 통지보다 먼저 또는 동시에 도달해야 합니다.\n\n## 예외적으로 발신주의를 쓰는 경우\n원칙은 도달주의지만 예외가 있습니다.\n- 제한능력자의 상대방이 하는 최고에 대한 확답\n- 사원총회 소집 통지\n- 격지자 간 계약의 승낙\n\n> 특히 **격지자 간 계약은 승낙의 통지를 발송한 때 성립**합니다. 계약을 빨리 확정시키기 위한 예외입니다. 시험에 자주 나옵니다.\n\n## 상대방이 누구인지 모를 때\n공시송달 제도를 씁니다. 법원 게시판 등에 게시하는 방식으로 도달한 것으로 봅니다.\n\n▸ 도달주의: 상대방에게 도착해야 효력이 생긴다는 원칙.\n▸ 발신주의: 보낸 때 이미 효력이 생긴다는 예외.\n▸ 격지자: 서로 떨어져 있어 의사 전달에 시간이 걸리는 당사자.","alt":"## 언제부터 효력 생김?\n계약 해지한다고 편지 보냄. 쓴 때? 부친 때? 도착한 때? 읽은 때?\n\n민법 111조: **도달한 때.** 이걸 도달주의라고 함.\n\n## 도달이 뭔데\n> 🚨 **읽을 필요 없음.** 알 수 있는 상태면 도달임.\n> 우편함에 들어감 → 도달. 안 뜯어봤어도 도달.\n> 안 받고 버팀 → 정당한 이유 없이 수령 거절하면 그것도 **도달**로 봄. 잠수 타도 소용없음.\n\n## 보낸 다음에 일 생기면\n\n### 보낸 사람이 죽거나 능력 잃음\n> 🚨 **효력 그대로 유지됨.** 영향 없음.\n> 이미 화살 쐈으면 쏜 사람이 어떻게 되든 화살은 날아감.\n\n### 도달 전에 취소 가능?\n가능함. 아직 효력 안 생겼으니까.\n단 철회 통지가 **원래 것보다 먼저 또는 동시에** 도착해야 함.\n\n## 예외로 발신주의 쓰는 것들\n원칙은 도달주의인데 예외가 있음.\n- 제한능력자 상대방의 최고에 대한 확답\n- 사원총회 소집 통지\n- **격지자 간 계약의 승낙**\n\n> 🚨 마지막 거 진짜 자주 나옴.\n> 멀리 떨어진 사람끼리 계약할 때 승낙은 **발송한 때** 계약 성립임. 도착 안 해도 성립.\n> 계약을 빨리 확정시키려고 만든 예외임.\n\n## 상대방이 누군지 모름\n공시송달 씀. 법원 게시판에 붙여놓고 도달한 걸로 침.\n\n▸ 도달주의: 도착해야 효력.\n▸ 발신주의: 보내면 효력. 예외.\n▸ 격지자: 멀리 떨어져 있는 당사자."},{"title":"⑰ 대리","sub":"민법총칙","body":"## 대리의 구조\n본인, 대리인, 상대방 세 사람이 등장합니다. 대리인이 상대방과 계약하지만 그 효과는 본인에게 생깁니다.\n\n성립하려면 세 가지가 필요합니다.\n- 대리권이 있을 것\n- 본인을 위한 것임을 표시할 것(현명주의)\n- 대리인이 유효한 의사표시를 할 것\n\n> 현명하지 않으면 대리인 자신을 위한 것으로 봅니다. 다만 상대방이 대리행위임을 알았거나 알 수 있었다면 본인에게 효과가 생깁니다.\n\n## 임의대리와 법정대리\n임의대리는 본인이 스스로 권한을 준 경우, 법정대리는 법이 정한 경우입니다. 부모의 친권이 법정대리입니다.\n\n### 복대리\n대리인이 다시 대리인을 세우는 것입니다.\n- 임의대리인: 본인의 승낙이 있거나 부득이한 사유가 있어야만 가능\n- 법정대리인: 언제든 가능하되 책임이 무거움\n\n복대리인은 본인의 대리인입니다. 대리인의 대리인이 아닙니다. 복대리인을 세워도 원래 대리권은 그대로 남습니다.\n\n## 무권대리\n대리권 없이 대리인 행세를 한 경우입니다. 본인이 추인하면 유효해지고 추인을 거절하면 무효입니다.\n상대방은 두 가지 권리를 갖습니다.\n- 최고권: 추인할지 답하라고 촉구. 답이 없으면 거절한 것으로 봄\n- 철회권: 계약을 물릴 수 있음. 선의의 상대방만 가능\n\n## 표현대리\n대리권이 없는데도 있는 것처럼 보였고 상대방이 그렇게 믿을 만했다면, 본인이 책임을 집니다.\n- 제125조: 대리권 수여의 표시에 의한 표현대리\n- 제126조: 권한을 넘은 표현대리\n- 제129조: 대리권 소멸 후의 표현대리\n\n> 표현대리가 성립하면 본인이 책임을 집니다. 책임을 면한다고 써 있으면 오답입니다.\n\n## 대리권의 소멸\n본인의 사망, 대리인의 사망·성년후견개시·파산으로 소멸합니다. 임의대리는 여기에 더해 원인된 법률관계의 종료와 수권행위의 철회로도 소멸합니다.\n\n▸ 현명: 누구를 위한 대리인지 밝히는 것.\n▸ 추인: 나중에 인정해 유효하게 만드는 것.\n▸ 수권행위: 대리권을 주는 행위.","alt":"## 구조\n본인 / 대리인 / 상대방 3명 나옴.\n대리인이 계약하는데 효과는 본인한테 감. 이게 전부임.\n\n## 성립 조건 3개\n- 대리권 있을 것\n- \"나 본인 대신 왔음\" 밝힐 것 (현명주의)\n- 대리인이 제정신으로 의사표시할 것\n\n> 안 밝히면 대리인 본인 계약으로 침. 근데 상대방이 눈치챘거나 챌 수 있었으면 본인한테 효과 감.\n\n## 복대리 (대리인이 또 대리인 세움)\n- 임의대리인: 본인 승낙 있거나 어쩔 수 없을 때만 가능. 함부로 못 넘김\n- 법정대리인: 걍 가능. 대신 책임 무거움\n\n> 🚨 복대리인은 **본인의 대리인**임. \"대리인의 대리인\"이라고 써있으면 오답.\n> 그리고 복대리인 세워도 원래 대리권 안 없어짐. 둘 다 살아있음.\n\n## 무권대리 (권한 없이 대리인 코스프레)\n본인이 추인하면 유효, 거절하면 무효.\n상대방은 두 가지 할 수 있음.\n- 최고권: \"할 거임 말 거임?\" 물어봄. 답 없으면 **거절한 걸로** 봄\n- 철회권: 계약 물림. 선의인 사람만 가능\n\n## 표현대리 (권한 없는데 있어 보임)\n상대방이 믿을 만했으면 본인이 책임짐.\n- 125조: 본인이 \"얘한테 권한 줬음\" 하고 말했을 때\n- 126조: 권한은 있는데 넘어섰을 때\n- 129조: 권한 끝났는데 계속 했을 때\n\n> 🚨 \"표현대리 성립하면 본인은 책임을 면한다\" → 오답임.\n> 애초에 상대방 보호하려고 만든 제도인데 본인이 튀면 제도가 왜 있음. 무조건 본인이 뒤집어씀.\n\n## 대리권 소멸\n본인 사망 / 대리인 사망·성년후견·파산.\n임의대리는 여기에 원인관계 종료, 수권행위 철회 추가.\n> 🚨 \"대리인의 혼인\" 이런 거 껴 있으면 그게 답임. 결혼한다고 대리권 날아가냐고.\n\n▸ 현명: 누구 대신인지 밝히기.\n▸ 추인: 나중에 \"ㅇㅇ 인정\" 하는 거.\n▸ 수권행위: 대리권 주는 행위."},{"title":"⑱ 무권대리","sub":"민법총칙","body":"## 무권대리란\n대리권이 없는데 대리인 행세를 하고 계약한 경우입니다. 두 종류로 나뉩니다.\n- 협의의 무권대리: 순수하게 권한이 없는 경우\n- 표현대리: 권한은 없지만 있어 보였던 경우 (다음 편에서 다룹니다)\n\n## 효력은 유동적 무효\n본인에게 효과가 생기지 않습니다. 다만 확정적으로 무효인 것은 아니고, 본인이 추인하면 유효해집니다. 그래서 유동적 무효라고 부릅니다.\n\n## 본인이 할 수 있는 것\n### 추인\n\"그거 인정한다\"고 하면 **계약한 때로 소급하여** 유효해집니다. 소급효가 있다는 점이 중요합니다.\n추인은 상대방에게 해도 되고 무권대리인에게 해도 됩니다. 다만 무권대리인에게만 했다면 상대방이 그 사실을 알기 전까지는 상대방에게 주장할 수 없습니다.\n\n### 추인 거절\n거절하면 확정적으로 무효가 됩니다.\n\n## 상대방이 할 수 있는 것\n### 최고권\n상당한 기간을 정해 추인할지 답하라고 촉구합니다. 기간 안에 답이 없으면 **추인을 거절한 것으로 봅니다.**\n> 제한능력자 제도의 최고는 답이 없으면 추인으로 보는데, 무권대리는 거절로 봅니다. **방향이 반대**입니다. 자주 뒤집어 냅니다.\n\n최고권은 **악의의 상대방도** 행사할 수 있습니다.\n\n### 철회권\n계약을 물릴 수 있습니다. 다만 **선의의 상대방만** 가능하고, 본인이 추인하기 전에 해야 합니다.\n\n## 무권대리인의 책임\n본인이 추인하지 않으면 무권대리인이 책임집니다. 상대방의 선택에 따라 **계약을 이행하거나 손해를 배상**해야 합니다.\n다만 상대방이 무권대리임을 알았거나 알 수 있었던 경우, 무권대리인이 제한능력자인 경우에는 책임을 지지 않습니다.\n\n▸ 유동적 무효: 지금은 효력이 없지만 추인하면 유효해질 수 있는 상태.\n▸ 소급효: 과거로 거슬러 올라가 효력이 생기는 것.\n▸ 상당한 기간: 답하기에 합리적인 정도의 기간.","alt":"## 무권대리 = 권한 없이 대리인 행세\n두 종류임.\n- 협의의 무권대리: 그냥 권한 없음\n- 표현대리: 권한 없는데 있어 보였음 (다음 편)\n\n## 효력 = 유동적 무효\n본인한테 효과 안 감. 근데 완전히 죽은 건 아님. 본인이 추인하면 살아남.\n그래서 **유동적 무효**라고 부름. 좀비 상태.\n\n## 본인이 할 수 있는 거\n\n### 추인\n\"인정\" 하면 **계약한 때로 소급해서** 유효해짐.\n> 🚨 여기 소급효 **있음.**\n> 무효행위의 추인은 소급효 없는데 무권대리 추인은 있음. 헷갈리게 하려고 같이 냄.\n\n추인은 상대방한테 해도 되고 무권대리인한테 해도 됨.\n\n### 추인 거절\n거절 → 확정 무효.\n\n## 상대방이 할 수 있는 거\n\n### 최고권\n\"할 거야 말 거야\" 물어봄. 답 없으면 **거절한 걸로** 봄.\n\n> 🚨 이거 진짜 중요함\n> 제한능력자 최고 → 답 없으면 **추인**\n> 무권대리 최고 → 답 없으면 **거절**\n> **방향이 반대**임. 매번 뒤집어서 냄. 이거 하나만 잡아도 한 문제 먹음.\n\n최고권은 **악의여도 가능**함. 알고 있었어도 물어볼 순 있음.\n\n### 철회권\n계약 물리기. **선의만 가능.** 그리고 본인이 추인하기 전에 해야 함.\n\n## 무권대리인 본인은?\n본인이 추인 안 하면 무권대리인이 뒤집어씀.\n상대방이 고르는 대로 **계약 이행하거나 손해배상**. 상대방이 갑임.\n\n> 근데 면제되는 경우 있음. 상대방이 무권대리인 거 알았거나 알 수 있었으면, 또는 무권대리인이 제한능력자면 책임 없음.\n\n▸ 유동적 무효: 지금은 무효인데 살아날 수 있는 상태.\n▸ 소급효: 과거로 거슬러 올라감."},{"title":"⑲ 표현대리","sub":"민법총칙","body":"## 왜 이 제도가 있나\n대리권이 없는데도 있는 것처럼 보였고 상대방이 그렇게 믿을 만했다면, 그 믿음을 보호해야 거래가 돌아갑니다.\n그래서 본인에게 책임을 지웁니다. 본인이 그런 외관을 만드는 데 어느 정도 원인을 제공했다는 점도 근거입니다.\n\n## 세 가지 유형\n### 제125조 대리권 수여의 표시에 의한 표현대리\n본인이 제3자에게 \"이 사람에게 권한을 줬다\"고 표시했는데 실제로는 안 준 경우입니다.\n위임장을 만들어 줬는데 실제 권한은 없는 경우가 대표적입니다.\n\n### 제126조 권한을 넘은 표현대리\n대리권은 있는데 그 범위를 넘어선 경우입니다.\n**기본대리권이 있어야** 성립합니다. 그리고 상대방에게 권한이 있다고 믿을 만한 **정당한 이유**가 있어야 합니다.\n> 세 유형 중 시험에 가장 많이 나옵니다.\n\n### 제129조 대리권 소멸 후의 표현대리\n전에는 권한이 있었는데 이미 소멸한 뒤에 대리행위를 한 경우입니다.\n\n## 공통 요건\n- 상대방이 **선의이고 무과실**일 것\n\n> 여기가 중요합니다. 의사표시 하자에서 제3자는 선의면 충분했지만, **표현대리의 상대방은 무과실까지 요구**됩니다. 두 가지를 섞어 내니 구분해야 합니다.\n\n## 효과\n표현대리가 성립하면 **본인이 책임을 집니다.** 계약이 본인에게 효력이 생깁니다.\n> \"본인은 책임을 면한다\"는 선택지는 항상 오답입니다. 상대방 보호가 목적인 제도인데 본인이 빠져나가면 제도가 성립하지 않습니다.\n\n## 알아둘 점\n표현대리도 넓게 보면 무권대리입니다. 따라서 상대방은 표현대리를 주장하지 않고 무권대리인의 책임을 묻는 쪽을 택할 수도 있습니다.\n또한 표현대리가 성립해도 **본인이 상대방에게 과실상계를 주장할 수는 없다**는 것이 판례입니다.\n\n▸ 외관: 겉으로 보이는 모습.\n▸ 기본대리권: 범위를 넘기 전에 원래 갖고 있던 대리권.\n▸ 정당한 이유: 그렇게 믿을 만했다고 인정되는 사정.","alt":"## 왜 있냐\n권한 없는데 있어 보였고 상대방이 믿을 만했음. 그럼 그 믿음을 지켜줘야 거래가 돌아감.\n그래서 **본인이 책임짐.** 본인도 그런 오해 만드는 데 일조했으니까.\n\n## 3종류\n\n### 125조 — \"권한 줬다\"고 말함\n본인이 \"얘한테 권한 줬음\" 하고 떠벌림. 실제로는 안 줌.\n위임장 만들어줬는데 실권한은 없는 경우.\n\n### 126조 — 권한 넘음 ⭐\n권한은 있는데 선을 넘음.\n> 🚨 **기본대리권이 있어야** 성립함. 아예 아무 권한도 없으면 126조 안 됨.\n> 그리고 상대방한테 믿을 만한 **정당한 이유**도 있어야 함.\n> 셋 중에 제일 많이 나옴.\n\n### 129조 — 권한 끝났는데 계속함\n예전엔 권한 있었음. 근데 끝난 뒤에도 계속 대리행위 함.\n\n## 공통 요건 (여기 핵심)\n상대방이 **선의 + 무과실**일 것\n\n> 🚨 이거 진짜 중요함\n> 의사표시 하자(통정허위 등)에서 제3자 → **선의면 끝**\n> 표현대리 상대방 → **선의 + 무과실**\n> 요구 수준이 다름. 둘을 섞어서 냄. 여기서 많이 틀림.\n\n## 효과\n> 🚨 **본인이 책임짐.**\n> \"본인은 책임을 면한다\" → 무조건 오답임. 예외 없음.\n> 상대방 보호하려고 만든 제도인데 본인이 튀면 제도가 왜 있음.\n\n## 추가로 알 거\n표현대리도 크게 보면 무권대리임. 그래서 상대방이 표현대리 주장 안 하고 **무권대리인한테 책임 물어도 됨.** 골라서 하면 됨.\n그리고 본인이 \"상대방도 좀 잘못했잖아요\" 하면서 **과실상계 못 함.** 판례임.\n\n▸ 외관: 겉보기 모습.\n▸ 기본대리권: 넘기 전에 원래 있던 권한.\n▸ 과실상계: 상대방 잘못만큼 책임 깎는 거."},{"title":"⑳ 무효와 취소","sub":"민법총칙","body":"## 결정적 차이\n- 무효: 처음부터 아무 효력이 없음. 시간이 지나도 그대로.\n- 취소: 일단 유효하지만 취소권을 행사하면 처음부터 없던 것이 됨.\n\n즉 취소는 누군가 행동해야 효과가 생기고, 무효는 가만히 있어도 효력이 없습니다.\n\n## 무효 사유\n- 의사무능력자의 행위\n- 반사회질서 행위(제103조)\n- 불공정한 법률행위(제104조)\n- 통정허위표시\n- 원시적 불능\n\n## 취소 사유\n- 제한능력자의 행위\n- 착오에 의한 의사표시\n- 사기 또는 강박에 의한 의사표시\n\n> 이 목록을 뒤섞어 어느 쪽인지 묻는 문제가 매년 나옵니다. 무효 다섯 개, 취소 세 개로 묶어 외우세요.\n\n## 취소권자와 기간\n취소할 수 있는 사람은 제한능력자 본인, 착오나 사기·강박을 당한 사람, 그 대리인과 승계인입니다.\n행사기간은 추인할 수 있는 날부터 3년, 법률행위를 한 날부터 10년입니다. 둘 중 하나만 지나도 소멸합니다.\n\n## 추인\n### 취소할 수 있는 행위의 추인\n이제 취소하지 않겠다고 확정하는 것입니다. 추인하면 유효로 확정되고 다시 취소할 수 없습니다.\n법정추인이라는 것도 있습니다. 이행, 이행청구, 경개, 담보제공, 권리양도, 강제집행처럼 추인으로 볼 만한 행동을 하면 자동으로 추인한 것으로 봅니다.\n\n### 무효행위의 추인\n무효인 것을 추인해도 처음부터 유효해지지는 않습니다. 추인한 때부터 새로운 법률행위를 한 것으로 봅니다. 소급효가 없다는 점이 핵심입니다.\n\n## 무효행위의 전환\n어떤 행위로는 무효지만 다른 행위로 보면 유효할 때, 당사자가 그것을 원했으리라고 인정되면 그 다른 행위로 효력을 인정합니다.\n\n▸ 소급효: 과거로 거슬러 올라가 효력이 생기는 것.\n▸ 경개: 기존 채무를 없애고 새 채무를 만드는 계약.\n▸ 승계인: 권리나 지위를 이어받은 사람.","alt":"## 차이 한 줄\n- 무효: 처음부터 그냥 없음. 가만있어도 없음.\n- 취소: 일단 살아있음. 누가 취소해야 없어짐.\n\n즉 취소는 **누가 행동해야** 하고 무효는 **가만있어도** 됨.\n\n## 무효 5개\n- 의사무능력자 행위\n- 반사회질서 (103조)\n- 불공정한 법률행위 (104조)\n- 통정허위표시\n- 원시적 불능\n\n## 취소 3개\n- 제한능력자 행위\n- 착오\n- 사기·강박\n\n> 🚨 이거 섞어서 \"다음 중 무효인 것은?\" 매년 나옴. **무효 5개 / 취소 3개** 이렇게 통으로 외워.\n> 특히 착오랑 사기가 무효인 줄 아는 사람 많은데 **취소**임.\n\n## 취소 기간\n추인할 수 있는 날부터 **3년**, 행위한 날부터 **10년**.\n둘 중 하나만 지나도 끝. 그리고 이건 제척기간이라 중단 없음.\n\n## 추인 (여기가 진짜 함정)\n\n### 취소할 수 있는 행위의 추인\n\"안 취소할게\" 확정하는 거. 하면 다시 취소 못 함.\n**법정추인**도 있음. 이행하거나, 이행 청구하거나, 담보 잡히거나, 권리 넘기면 자동으로 추인한 걸로 침. 말 안 해도 행동으로 인정된 거.\n\n### 무효행위의 추인\n> 🚨 무효인 걸 추인해도 **처음부터 유효 안 됨.**\n> 추인한 날부터 새 계약 한 걸로 침. **소급효 없음.** 이게 취소 추인이랑 결정적 차이.\n\n## 무효행위의 전환\nA로 보면 무효인데 B로 보면 유효함. 당사자가 B라도 원했을 것 같으면 B로 살려줌.\n\n▸ 소급효: 과거로 거슬러 올라가서 효력 생기는 거.\n▸ 경개: 기존 빚 없애고 새 빚 만드는 계약.\n▸ 승계인: 권리 물려받은 사람."},{"title":"㉑ 조건·기한·기간","sub":"민법총칙","body":"## 조건\n장래에 일어날지 안 일어날지 모르는 사실에 법률행위의 효력을 매다는 것입니다.\n\n- 정지조건: 조건이 이루어지면 효력이 생김. 시험에 붙으면 차를 사주겠다.\n- 해제조건: 조건이 이루어지면 효력이 사라짐. 낙제하면 장학금을 끊겠다.\n\n### 특수한 조건들\n- 불법조건: 조건만이 아니라 법률행위 전부가 무효\n- 불능조건: 정지조건이면 무효, 해제조건이면 조건 없는 법률행위\n- 기성조건: 이미 이루어진 조건. 정지조건이면 조건 없는 행위, 해제조건이면 무효\n\n> 표로 외우는 것이 빠릅니다. 정지조건과 해제조건에 따라 결과가 정반대가 되는 구조입니다.\n\n## 기한\n반드시 오기는 오는데 시점이 문제인 경우입니다. 조건과의 차이가 여기 있습니다. 사람은 반드시 죽으므로 내가 죽으면은 조건이 아니라 기한입니다.\n\n- 시기: 그때부터 효력이 생김\n- 종기: 그때 효력이 사라짐\n\n기한의 이익은 채무자를 위한 것으로 추정합니다. 포기할 수 있지만 상대방의 이익을 해치지는 못합니다.\n\n## 기간\n- 시, 분, 초로 정한 때: 즉시 기산\n- 일, 주, 월, 년으로 정한 때: 초일불산입이 원칙\n\n예외가 둘 있습니다. 기간이 오전 0시부터 시작하는 경우와 연령을 계산하는 경우에는 초일을 넣습니다.\n말일이 토요일이나 공휴일이면 그 다음 날에 만료합니다.\n\n▸ 기산: 세기 시작하는 것.\n▸ 초일불산입: 첫날을 세지 않는다는 원칙.\n▸ 기한의 이익: 기한이 올 때까지 이행하지 않아도 되는 이익.","alt":"## 조건 vs 기한 구분법\n- 조건: 올지 안 올지 **모름**\n- 기한: 오긴 **무조건 옴**. 언제인지가 문제\n\n> 🚨 \"내가 죽으면\" → 이거 조건 아니고 **기한**임. 사람은 반드시 죽으니까. 매번 나옴.\n\n## 조건 2종\n- 정지조건: 조건 이뤄지면 **효력 생김**. \"합격하면 차 사줄게\"\n- 해제조건: 조건 이뤄지면 **효력 사라짐**. \"낙제하면 장학금 끊는다\"\n\n### 이상한 조건들 (표로 외워)\n- 불법조건 → 조건만 무효가 아니라 **계약 전체 무효**\n- 불능조건 → 정지조건이면 무효 / 해제조건이면 조건 없는 계약\n- 기성조건 → 정지조건이면 조건 없는 계약 / 해제조건이면 무효\n\n> 정지랑 해제에 따라 결과가 정반대로 뒤집힘. 이 뒤집힘을 노리고 냄.\n\n## 기한의 이익\n**채무자를 위한 걸로 추정.** 빌린 사람이 이득이라는 뜻. 갚을 날까지 안 갚아도 되니까.\n포기 가능한데 상대방 손해 끼치면 안 됨.\n\n## 기간 계산\n- 시·분·초 → 바로 셈\n- 일·주·월·년 → **초일불산입** (첫날 안 셈)\n\n예외 2개: 오전 0시부터 시작 / **나이 계산**. 얘들은 첫날 넣음.\n말일이 토요일이나 공휴일이면 다음 날 만료.\n\n▸ 기산: 세기 시작.\n▸ 초일불산입: 첫날 빼고 세기.\n▸ 기한의 이익: 기한 올 때까지 안 해도 되는 이득."},{"title":"㉒ 소멸시효","sub":"민법총칙","body":"## 왜 이런 제도가 있나\n권리가 있어도 오래 안 쓰면 없어집니다. 세 가지 이유가 있습니다. 오래된 일은 증거가 사라져 다투기 어렵고, 그동안 형성된 사실 상태를 보호할 필요가 있으며, 권리 위에 잠자는 사람을 보호할 이유가 없다는 것입니다.\n\n## 기간\n- 일반 민사채권: 10년\n- 상행위로 인한 채권: 5년\n- 3년: 의사·조산사·간호사의 치료비, 이자·부양료·급료 등 1년 이내 정기로 지급되는 채권, 도급받은 자의 공사채권\n- 1년: 음식료, 숙박료, 입장료, 대여료\n\n> 이 네 단계는 반드시 통째로 외워야 합니다. 어느 쪽인지 묻는 문제가 거의 매번 나옵니다.\n\n소유권은 소멸시효에 걸리지 않습니다.\n\n## 기산점\n권리를 행사할 수 있는 때부터 셉니다. 권리자가 몰랐다는 사실상의 장애는 원칙적으로 영향을 주지 않습니다.\n\n## 중단과 정지\n### 중단 (제168조)\n지금까지 지나간 기간이 없어지고 처음부터 다시 셉니다.\n- 청구\n- 압류 또는 가압류, 가처분\n- 승인\n\n### 정지\n일정 기간 동안 시효가 완성되지 않게 미뤄줍니다. 지나간 기간은 그대로 남습니다. 제한능력자에게 법정대리인이 없는 경우, 천재 기타 사변 등이 사유입니다.\n\n> 천재 기타 사변은 정지 사유이지 중단 사유가 아닙니다. 중단 사유를 묻는 문제의 단골 오답입니다.\n\n## 효과\n소멸시효는 그 기산일에 소급하여 효력이 생깁니다. 그 사이 이자도 함께 사라집니다.\n시효의 이익은 미리 포기할 수 없습니다. 다만 완성된 뒤에는 포기할 수 있습니다.\n\n## 제척기간과의 비교\n| | 소멸시효 | 제척기간 |\n|---|---|---|\n| 중단·정지 | 있음 | 없음 |\n| 소급효 | 있음 | 없음 |\n| 포기 | 완성 후 가능 | 불가 |\n\n취소권의 3년과 10년은 제척기간입니다.\n\n▸ 원용: 시효로 소멸했다고 주장하는 것.\n▸ 제척기간: 권리를 빨리 확정시키려고 정해둔 존속기간.\n▸ 시효이익의 포기: 시효 완성의 혜택을 받지 않겠다고 하는 것.","alt":"## 왜 이런 게 있냐\n권리 있어도 오래 방치하면 날아감. 이유 3개.\n- 오래되면 증거가 없어서 재판 못 함\n- 그동안 만들어진 상태를 보호해야 함\n- **권리 위에 잠자는 자는 보호 안 함** (이 표현 그대로 나옴)\n\n## 기간 (이거 못 외우면 못 품)\n- **10년**: 일반 민사채권\n- **5년**: 상행위로 생긴 채권\n- **3년**: 의사 치료비 / 이자·급료 같이 1년 안쪽 정기로 받는 거 / 공사대금\n- **1년**: 음식값, 숙박비, 입장료, 대여료\n\n> 술값 밥값이 1년, 병원비가 3년. 이 두 개만 확실히 잡아도 절반은 맞음.\n> 소유권은 소멸시효 안 걸림. 이것도 나옴.\n\n## 언제부터 세냐\n**권리를 행사할 수 있는 때**부터.\n\"난 몰랐는데요\" → 안 통함. 사실상 장애는 안 쳐줌.\n\n## 중단 vs 정지 (여기가 핵심)\n\n### 중단 = 리셋\n지금까지 센 거 다 날아가고 **처음부터 다시**.\n- 청구\n- 압류·가압류·가처분\n- 승인\n\n이 3개가 전부임.\n\n### 정지 = 일시정지\n잠깐 멈춰줌. 지나간 건 그대로 남음.\n제한능력자한테 대리인 없을 때, 천재지변 등.\n\n> 🚨 \"천재 기타 사변\"이 중단사유 선택지에 껴서 나옴. **정지**사유임. 이거 단골.\n\n## 효과\n**기산일로 소급**해서 없어짐. 그 사이 이자도 같이 증발.\n시효 이익은 **미리 포기 못 함.** 완성된 다음엔 포기 가능.\n\n## 제척기간이랑 비교\n| | 소멸시효 | 제척기간 |\n|---|---|---|\n| 중단·정지 | 있음 | **없음** |\n| 소급효 | 있음 | **없음** |\n| 미리 포기 | 불가 | 불가 |\n\n취소권 3년/10년은 **제척기간**임. 소멸시효 아님.\n\n▸ 원용: \"시효 지났음\" 하고 주장하는 거.\n▸ 제척기간: 빨리 확정시키려고 정해둔 기간."},{"title":"① 상법이란 무엇인가","sub":"상법","body":"## 민법과 뭐가 다른가\n민법은 사람 사이의 일반적인 관계를 다루고, 상법은 그중에서 **장사와 기업**에 관한 부분만 떼어낸 법입니다.\n같은 돈거래라도 친구끼리면 민법, 회사끼리면 상법이 먼저 적용됩니다.\n\n## 적용 순서\n1. **상사자치법** (정관, 회사 내부 규칙)\n2. **상법**\n3. **상관습법**\n4. **민법**\n\n> 여기가 시험 포인트입니다. **상관습법이 민법보다 앞섭니다.** 상거래는 실제 관행이 법보다 현실을 잘 반영하기 때문입니다. 민법에서 관습이 임의규정보다 앞서는 것과 같은 논리입니다.\n\n## 왜 따로 만들었나\n장사에는 세 가지 특성이 있습니다.\n- **신속성**: 빨리 처리해야 함 → 상사시효가 5년으로 짧음\n- **유상성**: 공짜가 없음 → 상인은 보수를 청구할 수 있음\n- **정형성**: 반복되고 대량임 → 약관과 정형 거래가 발달\n\n민법 규정을 그대로 쓰면 거래가 느려지고 손해를 봅니다. 그래서 특칙을 둔 겁니다.\n\n## 상법의 구성\n- 제1편 총칙: 상인, 상업사용인, 상호, 상업장부, 상업등기, 영업양도\n- 제2편 상행위: 상행위 특칙, 각종 상행위\n- 제3편 회사: 회사의 종류, 주식회사가 대부분\n- 제4편 보험 / 제5편 해상 / 제6편 항공운송\n\n> 공기업 시험은 **총칙, 상행위, 회사(주식회사)**에 집중됩니다. 보험·해상·항공은 거의 안 나옵니다. 어음·수표도 지금은 별도 법이라 범위 밖입니다.\n\n▸ 정관: 회사의 근본 규칙. 회사판 헌법입니다.\n▸ 상관습법: 상거래에서 반복되어 법처럼 굳어진 관행.\n▸ 특칙: 일반 규정과 다르게 따로 정해둔 규정.","alt":"## 민법이랑 뭐가 다름\n민법은 사람 사이 일반 관계 전부. 상법은 그중 **장사·기업** 부분만 떼어낸 거.\n같은 돈거래도 친구끼리면 민법, 회사끼리면 상법 먼저 적용됨.\n\n## 적용 순서 (외워)\n**상사자치법(정관) → 상법 → 상관습법 → 민법**\n\n> 🚨 **상관습법이 민법보다 앞섬.**\n> 이상해 보이는데, 상거래는 실제 관행이 법전보다 현실을 잘 반영하니까 그럼.\n> 민법에서 관습이 임의규정보다 앞서는 거랑 같은 논리임. 세트로 외우면 편함.\n\n## 왜 따로 만들었냐\n장사는 특성이 3개 있음.\n- **신속성**: 빨리 끝내야 함 → 그래서 상사시효가 **5년** (민법 10년보다 짧음)\n- **유상성**: 공짜 없음 → 상인은 그냥 해줘도 **보수 청구 가능**\n- **정형성**: 반복·대량 → 약관 발달\n\n민법 그대로 쓰면 거래가 느려서 손해임. 그래서 특칙 만든 거.\n\n## 구성\n- 1편 총칙: 상인, 사용인, 상호, 장부, 등기, 영업양도\n- 2편 상행위\n- 3편 회사 ← **여기가 제일 많이 나옴**\n- 4~6편 보험/해상/항공\n\n> 공기업 시험은 **총칙 + 상행위 + 주식회사**만 나옴.\n> 보험 해상 항공은 버려도 됨. 어음수표도 지금은 딴 법이라 범위 밖임.\n\n▸ 정관: 회사 헌법.\n▸ 상관습법: 굳어진 상거래 관행.\n▸ 특칙: 일반 규정 말고 따로 정해둔 거."},{"title":"② 상인과 상행위","sub":"상법","body":"## 상인이 되는 두 가지 길\n### 당연상인\n**자기 명의로 상행위를 하는 자**입니다. 상법 제46조에 나열된 기본적 상행위를 업으로 하면 됩니다.\n매매, 임대차, 제조, 운송, 금융, 보험, 출판 등 22가지가 열거되어 있습니다.\n\n> \"자기 명의로\"가 중요합니다. 실제로 누가 이익을 갖느냐가 아니라 **거래의 법적 주체가 누구 이름이냐**를 봅니다.\n\n### 의제상인\n상행위를 하지 않아도 상인으로 봐주는 경우입니다.\n- **설비상인**: 점포 등 설비를 갖추고 상인적 방법으로 영업하는 자\n- **민사회사**: 상행위를 하지 않더라도 회사 형태를 갖춘 것\n\n> 농업, 어업, 광업은 상법 제46조에 없습니다. 그래서 농부는 당연상인이 아닙니다. 다만 점포를 차리고 상인적 방법으로 팔면 의제상인이 됩니다.\n\n## 소상인\n자본금 1천만원 미만의 상인 중 회사가 아닌 자입니다.\n지배인, 상호, 상업장부, 상업등기 규정이 적용되지 않습니다.\n\n## 상행위의 종류\n- **기본적 상행위**: 제46조에 열거된 것\n- **준상행위**: 의제상인이 하는 행위\n- **보조적 상행위**: 영업을 위해 하는 부수적 행위 (사무실 임차, 직원 채용)\n\n> 보조적 상행위가 자주 나옵니다. 상인이 영업을 위해 하는 행위는 **상행위로 추정**됩니다. 커피숍 주인이 원두를 사는 것뿐 아니라 은행에서 돈을 빌리는 것도 상행위입니다.\n\n## 일방적 상행위\n당사자 중 **한쪽에게만** 상행위여도 양쪽 모두에게 상법이 적용됩니다.\n개인이 은행에서 대출받으면 개인에게는 상행위가 아니지만, 그 거래 전체에 상법이 적용됩니다.\n\n▸ 업으로 한다: 영리 목적으로 반복·계속하는 것.\n▸ 의제: 실제로는 아니지만 그런 것으로 취급하는 것.\n▸ 추정: 일단 그렇다고 보되 반증이 있으면 뒤집히는 것.","alt":"## 상인 되는 법 2가지\n\n### 당연상인\n**자기 이름으로 상행위**를 업으로 하는 자.\n46조에 매매, 임대차, 제조, 운송, 금융, 보험 등 22개 열거돼 있음. 이거 하면 당연상인.\n\n> 🚨 \"자기 명의로\"가 포인트. 누가 돈 버냐가 아니라 **누구 이름으로 거래하냐**임.\n\n### 의제상인\n상행위 안 해도 상인으로 쳐주는 애들.\n- **설비상인**: 점포 차리고 장사꾼처럼 영업함\n- **민사회사**: 상행위 안 해도 회사 형태만 갖추면 됨\n\n> 🚨 농업 어업 광업은 46조에 **없음.** 그래서 농부는 당연상인 아님.\n> 근데 가게 차리고 팔면 의제상인 됨. 이 흐름으로 문제 냄.\n\n## 소상인\n자본금 1천만원 미만 + 회사 아님.\n> 🚨 얘한테는 **지배인, 상호, 상업장부, 상업등기** 규정 적용 안 됨. 이 4개 세트로 나옴.\n\n## 상행위 종류\n- **기본적 상행위**: 46조 목록\n- **준상행위**: 의제상인이 하는 거\n- **보조적 상행위**: 영업하려고 부수적으로 하는 거\n\n> 🚨 보조적 상행위 자주 나옴.\n> 상인이 영업 위해 하는 행위는 **상행위로 추정됨.**\n> 카페 주인이 원두 사는 것뿐 아니라 **은행에서 대출받는 것도** 상행위임. 사무실 계약, 직원 채용도.\n\n## 일방적 상행위\n> 🚨 한쪽만 상행위여도 **양쪽 다 상법 적용됨.**\n> 내가 은행에서 대출받음 → 나한텐 상행위 아님. 근데 그 거래엔 상법 적용됨. 그래서 시효도 5년임.\n\n▸ 업으로 한다: 돈 벌 목적으로 반복함.\n▸ 의제: 아닌데 그런 걸로 침.\n▸ 추정: 일단 그렇다 치고, 아니라는 증거 있으면 뒤집힘."},{"title":"③ 상업사용인","sub":"상법","body":"## 상업사용인이란\n상인에 종속되어 영업을 보조하는 사람입니다. 대리권의 범위에 따라 세 종류로 나뉩니다.\n\n## 지배인\n**영업에 관한 재판상 또는 재판 외의 모든 행위**를 할 수 있습니다. 권한이 가장 넓습니다.\n- 선임과 해임은 **등기**해야 합니다\n- 지배인의 대리권 제한은 **선의의 제3자에게 대항하지 못합니다**\n\n> 사장이 \"지배인은 1억 넘는 계약은 하지 마라\"고 정해도, 그 사실을 모르는 거래 상대방에게는 소용없습니다. 계약은 유효합니다.\n\n### 표현지배인\n지배인이 아닌데 본점·지점의 본부장, 지점장 같은 명칭을 쓴 사람입니다.\n그 명칭을 믿은 **선의의 제3자**에게는 지배인과 같은 권한이 있는 것으로 봅니다.\n> 다만 **재판상 행위는 제외**됩니다. 소송은 대리할 수 없습니다. 이 단서가 자주 나옵니다.\n\n## 부분적 포괄대리권을 가진 사용인\n부장, 과장처럼 영업의 특정 부분에 대해서만 포괄적 권한을 가진 사람입니다. 등기하지 않습니다.\n\n## 물건판매점포의 사용인\n매장 직원입니다. 그 점포에 있는 물건을 파는 권한이 있는 것으로 **봅니다**.\n> 실제로 권한을 안 줬어도 상관없습니다. 손님이 일일이 확인할 수 없으니까요.\n\n## 상업사용인의 의무 (경업금지·겸직금지)\n영업주의 허락 없이 다음을 하지 못합니다.\n- 자기 또는 제3자의 계산으로 **영업주의 영업부류에 속한 거래**\n- 다른 회사의 **무한책임사원, 이사, 다른 상인의 사용인**이 되는 것\n\n> 앞은 경업금지, 뒤는 겸직금지입니다. 겸직금지는 같은 업종이 아니어도 적용됩니다. 여기서 갈립니다.\n\n위반하면 영업주는 계약을 해지하고 손해배상을 청구할 수 있으며, **개입권**을 행사할 수 있습니다.\n\n▸ 개입권: 사용인이 얻은 이익을 영업주가 자기 것으로 가져가는 권리.\n▸ 재판상 행위: 소송에 관한 행위.\n▸ 포괄대리권: 일일이 정하지 않아도 그 범위 전부에 미치는 권한.","alt":"## 상업사용인 = 사장 밑에서 일하는 사람\n권한 범위에 따라 3종류.\n\n## 지배인 (권한 최강)\n**영업에 관한 재판상·재판 외 모든 행위** 가능. 사실상 사장 대리인.\n- 선임·해임 **등기해야 함**\n- 권한 제한은 **선의의 제3자한테 못 우김**\n\n> 🚨 사장이 \"1억 넘는 계약은 하지 마\" 해놓음. 지배인이 2억 계약함.\n> 상대방이 그 제한 몰랐으면? **계약 유효함.** 사장이 뒤집어씀.\n> 속으로 정해놓은 걸 상대방이 어떻게 앎.\n\n### 표현지배인\n지배인 아닌데 **지점장, 본부장** 같은 명함 쓴 사람.\n선의의 제3자한텐 지배인 취급해줌.\n> 🚨 근데 **재판상 행위는 빼고.** 소송은 대리 못 함.\n> 이 단서 빼먹게 하려고 \"모든 행위를 할 수 있다\"고 써놓음. 오답임.\n\n## 부분적 포괄대리권 사용인\n부장 과장급. 자기 담당 부분만 포괄 권한. **등기 안 함.**\n\n## 물건판매점포 사용인\n매장 알바생. 그 매장 물건 파는 권한 **있는 걸로 봄.**\n> 실제로 권한 안 줬어도 상관없음. 손님이 알바한테 \"권한 있어요?\" 물어보고 살 순 없잖음.\n\n## 의무 2개 (경업금지 + 겸직금지)\n사장 허락 없이 못 하는 거.\n- 사장이랑 **같은 업종 거래** (경업금지)\n- 다른 회사 **무한책임사원·이사·다른 상인의 사용인** 되기 (겸직금지)\n\n> 🚨 여기 차이 중요함.\n> 경업금지 = **같은 업종**이어야 걸림\n> 겸직금지 = **업종 달라도** 걸림\n> 카페 알바가 옆 카페서 알바 → 경업. 카페 알바가 세탁소 이사 → 겸직. 둘 다 안 됨.\n\n위반하면 해지 + 손배 + **개입권**.\n\n▸ 개입권: 걔가 번 돈을 사장이 내 거라고 가져가는 권리. 이름이 어려운데 뜻은 단순함."},{"title":"④ 상호","sub":"상법","body":"## 상호란\n상인이 영업할 때 쓰는 이름입니다. 자연인의 성명에 해당합니다.\n**문자로 표시되고 발음할 수 있어야** 합니다. 도형이나 기호는 상호가 될 수 없습니다.\n\n## 상호 선정의 자유와 제한\n원칙적으로 자유롭게 정할 수 있습니다. 다만 제한이 있습니다.\n- **회사는 상호에 회사의 종류를 표시**해야 합니다 (주식회사, 합자회사 등)\n- 회사가 아니면 상호에 회사라는 문자를 쓸 수 없습니다\n- 부정한 목적으로 타인의 영업으로 오인시킬 상호를 쓸 수 없습니다\n\n## 하나의 영업에 하나의 상호\n개인상인은 **영업 하나에 상호 하나**입니다. 영업이 여러 개면 각각 다른 상호를 쓸 수 있습니다.\n반면 **회사는 회사 전체에 상호 하나**입니다. 사업이 여러 개여도 상호는 하나입니다.\n\n## 상호의 양도\n> 상호는 재산적 가치가 있어 양도할 수 있습니다. 다만 조건이 있습니다.\n> **영업을 폐지하거나 영업과 함께 하는 경우에만** 양도할 수 있습니다.\n> 상호만 따로 팔면 거래 상대방이 착각하기 때문입니다. 양도는 **등기해야 제3자에게 대항**할 수 있습니다.\n\n## 상호권\n- **상호사용권**: 남의 방해 없이 쓸 권리\n- **상호전용권**: 남이 못 쓰게 막을 권리\n\n등기하지 않아도 부정한 목적으로 쓰는 자에게는 폐지를 청구할 수 있습니다.\n등기하면 **동일한 특별시·광역시·시·군에서 동종 영업의 동일 상호 등기를 막을 수 있습니다.**\n\n## 명의대여자의 책임 (자주 나옴)\n자기 이름이나 상호를 남에게 빌려주어 영업하게 한 사람은, 그를 영업주로 믿고 거래한 **선의의 제3자에게 연대책임**을 집니다.\n> 이름만 빌려줬을 뿐이라는 변명은 통하지 않습니다.\n\n▸ 오인: 잘못 알아보는 것.\n▸ 연대책임: 여러 사람이 각자 전액을 책임지는 것.\n▸ 대항하지 못한다: 그 사람에게 주장할 수 없다.","alt":"## 상호 = 장사할 때 쓰는 이름\n사람으로 치면 이름임.\n> 🚨 **문자여야 하고 발음 가능해야 함.** 로고나 그림은 상호 아님.\n\n## 정하는 건 자유. 근데 제한 있음\n- **회사는 상호에 회사 종류를 박아야 함** (주식회사, 합자회사 등)\n- 회사 아니면 \"회사\"라는 글자 못 씀\n- 남의 영업으로 착각시킬 목적이면 안 됨\n\n## 개수 규칙 (헷갈림)\n- **개인상인**: 영업 1개당 상호 1개. 영업 3개면 상호 3개 가능\n- **회사**: 회사 전체에 상호 1개. 사업 아무리 많아도 1개\n\n> 이거 방향이 반대라 뒤집어서 냄.\n\n## 양도\n> 🚨 상호는 팔 수 있음. 근데 아무 때나는 아님.\n> **영업을 접거나, 영업이랑 같이** 넘길 때만 가능.\n> 상호만 따로 팔면 손님들이 \"어? 그 집 맞나?\" 하고 속으니까.\n> 양도는 **등기해야** 제3자한테 통함.\n\n## 상호권 2개\n- **사용권**: 내가 쓸 권리\n- **전용권**: 남 못 쓰게 막을 권리\n\n등기 안 해도 부정한 목적으로 쓰는 놈은 막을 수 있음.\n등기하면 **같은 시·군에서 같은 업종 같은 상호 등기**를 막을 수 있음.\n\n## 명의대여자 책임 ⭐\n> 🚨 이거 진짜 자주 나옴.\n> 내 상호를 빌려줬음. 걔가 사고 침. 나도 **연대책임** 짐.\n> \"난 이름만 빌려줬는데요\" → 안 통함.\n> 상대방은 그 이름 보고 믿은 거니까. 선의의 제3자한테는 같이 물어줘야 함.\n\n▸ 오인: 잘못 알아봄.\n▸ 연대책임: 각자 전액 다 물어야 함. 나눠서가 아님."},{"title":"⑤ 상업장부와 상업등기","sub":"상법","body":"## 상업장부\n상인이 영업상 재산과 손익을 밝히기 위해 작성하는 장부입니다.\n- **회계장부**: 거래와 재산에 영향이 있는 사항을 기재\n- **대차대조표**: 일정 시점의 재산 상태\n\n작성 의무가 있고, **10년간 보존**해야 합니다. 전표나 이와 유사한 서류는 5년입니다.\n> 소상인에게는 상업장부 규정이 적용되지 않습니다.\n\n## 상업등기\n상법에 따라 등기할 사항을 등기부에 기재하는 것입니다.\n지배인 선임, 상호, 회사의 설립·변경·해산 등이 대상입니다.\n\n## 등기의 효력 (핵심)\n### 등기 전 — 소극적 공시력\n등기하기 전에는 **선의의 제3자에게 대항하지 못합니다.**\n지배인을 해임했는데 등기를 안 했다면, 그를 지배인으로 믿고 거래한 사람에게 \"이미 해임했다\"고 말할 수 없습니다.\n\n### 등기 후 — 적극적 공시력\n등기한 뒤에는 제3자에게 대항할 수 있습니다. 모르고 있었더라도 마찬가지입니다.\n> 다만 **정당한 사유로 알지 못한 제3자에게는 대항하지 못합니다.** 이 단서가 붙습니다.\n\n## 부실등기의 효력\n고의나 과실로 사실과 다른 사항을 등기한 자는, 그것이 사실과 다르다는 것을 **선의의 제3자에게 대항하지 못합니다.**\n> 잘못 등기해놓고 나중에 \"저건 틀린 거예요\"라고 할 수 없다는 뜻입니다. 등기를 믿은 사람을 보호합니다.\n\n## 창설적 효력\n대부분의 등기는 이미 생긴 사실을 알리는 것이지만, 일부는 등기해야 비로소 효력이 생깁니다.\n- **회사의 설립**: 설립등기를 해야 회사가 성립\n- **회사의 합병**: 등기해야 효력 발생\n\n▸ 대차대조표: 지금은 재무상태표라고 부릅니다.\n▸ 공시: 널리 알려 누구나 알 수 있게 하는 것.\n▸ 창설적 효력: 등기로 비로소 권리관계가 만들어지는 효력.","alt":"## 상업장부\n장사하면서 재산이랑 손익 기록하는 장부.\n- **회계장부**: 거래 내역\n- **대차대조표**: 특정 시점 재산 상태 (지금은 재무상태표라고 부름)\n\n> 🚨 보존기간 **10년**. 전표류는 5년. 숫자 물어봄.\n> 소상인은 이거 안 해도 됨.\n\n## 상업등기 효력 (여기가 핵심)\n\n### 등기 전 — 소극적 공시력\n> 🚨 등기 안 했으면 **선의의 제3자한테 못 우김.**\n> 지배인 잘랐는데 등기 안 함 → 그 사람이 계약 따옴 → 상대방이 모르고 믿었음 → **회사가 책임짐.**\n> \"우리 걔 잘랐는데요\" 안 통함. 등기를 안 했잖음.\n\n### 등기 후 — 적극적 공시력\n등기했으면 상대방이 몰랐어도 우길 수 있음.\n> 단서 하나 있음. **정당한 사유로 몰랐던 제3자**한텐 못 우김. 이 단서 빼놓고 냄.\n\n## 부실등기\n> 🚨 실수든 고의든 **틀리게 등기해놓고** 나중에 \"저거 틀린 건데요\" 못 함.\n> 선의의 제3자한테는 그대로 책임짐. 니가 잘못 올렸잖음.\n\n## 창설적 효력 (등기해야 생기는 것)\n보통 등기는 \"이미 일어난 일 알림\"인데, 얘들은 등기해야 **비로소 생김.**\n- **회사 설립** ← 설립등기해야 회사 탄생\n- **회사 합병**\n\n> 회사는 등기해야 태어남. 이거 자주 나옴.\n\n▸ 공시: 널리 알려서 아무나 볼 수 있게 함.\n▸ 창설적 효력: 등기가 방아쇠라 등기해야 효력 생김."},{"title":"⑥ 영업양도","sub":"상법","body":"## 영업양도란\n영업용 재산을 개별로 파는 것이 아니라, **조직화된 영업 전체를 통째로** 넘기는 것입니다.\n건물, 기계, 재고, 거래처, 노하우, 직원까지 유기적으로 결합된 상태 그대로 넘어갑니다.\n\n> 그래서 기계만 파는 것은 영업양도가 아닙니다. **영업의 동일성이 유지**되어야 합니다.\n\n## 양도인의 경업금지의무 (핵심)\n영업을 팔아놓고 바로 옆에 같은 가게를 열면 산 사람은 헛돈을 쓴 셈입니다. 그래서 법이 막습니다.\n\n- 다른 약정이 없으면 **10년간**, 동일한 특별시·광역시·시·군과 인접 지역에서 동종 영업을 하지 못합니다\n- 경업하지 않기로 **약정한 경우에는 20년을 넘지 않는 범위**에서 유효합니다\n\n> 숫자 두 개가 시험에 그대로 나옵니다. **기본 10년, 약정하면 최대 20년**입니다.\n\n## 상호를 계속 사용하는 경우\n양수인이 **양도인의 상호를 그대로 쓰면** 양도인의 영업으로 인한 채무에 대해 **양수인도 책임**을 집니다.\n> 손님 입장에서는 간판이 그대로니 주인이 바뀐 줄 모릅니다. 그래서 보호합니다.\n\n책임을 면하려면 지체 없이 **채무를 인수하지 않았다는 뜻을 등기**하거나, 양도인과 양수인이 제3자에게 통지해야 합니다.\n\n## 상호를 계속 사용하지 않는 경우\n원칙적으로 양수인은 책임지지 않습니다.\n다만 **채무를 인수한다는 뜻을 광고**했다면 책임집니다.\n\n## 채권자 보호\n양도인의 책임은 영업양도 후 **2년이 지나면 소멸**합니다.\n\n▸ 영업의 동일성: 넘어간 뒤에도 같은 영업이라고 볼 수 있는 상태.\n▸ 경업: 같은 종류의 영업을 하는 것.\n▸ 인수: 남의 채무를 떠안는 것.","alt":"## 영업양도 = 가게 통째로 넘기기\n기계만, 건물만 파는 게 아님. **조직화된 영업 전체**를 넘김.\n거래처, 노하우, 직원까지 세트로.\n\n> 🚨 **영업의 동일성**이 유지돼야 영업양도임. 기계만 팔면 그냥 매매지 영업양도 아님.\n\n## 양도인 경업금지 ⭐ (숫자 나옴)\n가게 팔아놓고 바로 옆에 똑같은 가게 열면 산 사람은 호구 되잖음. 그래서 막음.\n\n> 🚨 **약정 없으면 10년** / **약정하면 최대 20년**\n> 같은 시·군 + 인접 지역에서 같은 업종 금지.\n> 이 두 숫자 그대로 나옴. 10 / 20 외우면 됨.\n\n## 상호 그대로 쓰면? (이게 핵심)\n> 🚨 양수인이 **간판 안 바꾸고 그대로 쓰면** → 양도인 빚도 **양수인이 같이 책임짐.**\n> 손님 입장에선 간판 똑같은데 주인 바뀐 걸 어떻게 앎. 그래서 보호해줌.\n\n책임 빼려면 **\"빚 안 떠안음\" 등기**하거나 채권자한테 통지해야 함.\n\n## 상호 안 쓰면?\n원칙 책임 없음.\n> 근데 **\"빚 갚아드립니다\" 광고했으면** 책임짐. 말을 뱉었으면 지켜야지.\n\n## 양도인은 언제까지 책임?\n> 🚨 영업양도 후 **2년** 지나면 소멸. 이것도 숫자 나옴.\n\n정리하면 숫자 3개임. **경업금지 10년 / 약정 20년 / 양도인 책임 2년.**\n\n▸ 영업의 동일성: 넘긴 뒤에도 같은 영업으로 보이는 상태.\n▸ 경업: 같은 업종 영업.\n▸ 인수: 남 빚 떠안기."},{"title":"⑦ 상행위의 특칙","sub":"상법","body":"## 민법과 다른 점만 모아둔 편입니다\n장사는 빠르고 유상이어야 하므로 민법 규정을 손봤습니다. 시험은 **민법과 어떻게 다른지**를 묻습니다.\n\n## 시효와 이율\n- **상사시효 5년** (민법은 10년)\n- **상사법정이율 연 6%** (민법은 연 5%)\n\n## 보수와 이자\n- 상인이 영업 범위 내에서 타인을 위해 행위를 하면 **보수를 청구할 수 있습니다.** 민법의 위임은 원칙적으로 무상입니다\n- 상인 간 금전 소비대차는 **약정이 없어도 이자를 청구**할 수 있습니다\n\n## 연대성\n- 수인이 그 1인 또는 전원에게 상행위가 되는 행위로 채무를 부담하면 **연대채무**가 됩니다. 민법은 분할채무가 원칙입니다\n- 상행위로 생긴 채무의 보증은 **연대보증**이 됩니다. 보증인은 최고·검색의 항변권이 없습니다\n\n> 민법은 나눠서, 상법은 연대로. 이 방향만 기억하면 됩니다.\n\n## 상사매매의 특칙\n### 매수인의 목적물 검사·통지의무\n상인 간 매매에서 매수인은 목적물을 받으면 **지체 없이 검사**하고 하자나 수량 부족을 발견하면 **즉시 통지**해야 합니다.\n즉시 발견할 수 없는 하자는 **6개월 내**에 발견해 통지해야 합니다.\n통지하지 않으면 계약 해제나 손해배상을 청구하지 못합니다.\n\n> 민법에서는 하자를 안 날부터 6개월이면 되는데, 상법은 훨씬 엄격합니다. 거래를 빨리 확정시키기 위해서입니다.\n\n### 매도인의 공탁·경매권\n매수인이 목적물 수령을 거부하면 매도인은 공탁하거나 경매할 수 있습니다.\n\n## 유질계약 허용\n민법은 질권 설정 시 변제기 전에 質物을 처분하기로 하는 약정을 금지하지만, **상행위로 생긴 채권에서는 허용**됩니다.\n\n▸ 소비대차: 돈이나 물건을 빌려주고 같은 것으로 돌려받는 계약.\n▸ 최고·검색의 항변권: 보증인이 \"먼저 주채무자에게 청구하라\"고 버틸 수 있는 권리.\n▸ 공탁: 법원에 맡겨 채무를 면하는 것.","alt":"## 이 편은 \"민법이랑 뭐가 다르냐\"만 봄\n장사는 빨라야 하고 공짜가 없어야 하니까 민법을 손본 거임. 차이만 외우면 됨.\n\n## 숫자 2개 ⭐\n- **상사시효 5년** (민법 10년)\n- **상사법정이율 연 6%** (민법 5%)\n\n> 5년/6% vs 10년/5%. 이거 그냥 통으로 외워.\n\n## 공짜 없음\n- 상인이 남 일 해주면 **보수 청구 가능.** 민법 위임은 원칙 무상인데 반대임\n- 상인끼리 돈 빌려주면 **약정 없어도 이자 받음**\n\n## 연대 (방향만 기억)\n> 🚨 **민법 = 나눠서(분할) / 상법 = 뭉쳐서(연대)**\n> 여럿이 상행위로 빚지면 → **연대채무**\n> 상행위 채무 보증하면 → **연대보증**. 그래서 보증인이 \"주채무자한테 먼저 가세요\" 못 함 (최고·검색 항변권 없음)\n\n## 상사매매 검사·통지의무 ⭐\n> 🚨 물건 받으면 **지체 없이 검사** → 하자 발견하면 **즉시 통지**\n> 바로 못 찾는 하자는 **6개월 내**\n> 통지 안 하면? 해제도 손배도 **못 함.** 그냥 끝임.\n\n민법은 \"안 날부터 6개월\"인데 상법은 훨씬 빡셈. 거래 빨리 확정시키려고 그럼.\n쿠팡에서 산 거 반품 안 하고 3개월 뒤에 \"불량이던데요\" 하면 안 되는 거랑 비슷함.\n\n## 유질계약\n민법은 금지. **상행위 채권에서는 허용.**\n> 담보 잡은 물건을 변제기 전에 처분하기로 약정하는 거. 민법은 서민 보호하려고 막는데 상인끼리는 알아서 하라고 풀어줌.\n\n▸ 소비대차: 빌려주고 같은 걸로 돌려받기.\n▸ 최고·검색 항변권: 보증인이 \"본인한테 먼저 받으세요\" 버티는 권리."},{"title":"⑧ 각종 상행위","sub":"상법","body":"## 헷갈리는 네 가지를 구분하는 편입니다\n누구 이름으로 하느냐, 누구 계산으로 하느냐가 구분 기준입니다.\n\n## 대리상\n일정한 상인을 위하여 **상시** 그 영업부류에 속하는 거래를 **대리하거나 중개**하는 자입니다.\n- 특정 상인과 계속적 관계를 맺습니다\n- **본인의 이름으로** 거래합니다\n- 경업금지의무가 있습니다\n- 보수청구권과 함께 **유치권**이 인정됩니다\n\n## 중개인\n**타인 간의** 상행위를 **중개**하는 자입니다. 부동산 중개업자를 떠올리면 됩니다.\n- 자신은 계약 당사자가 아닙니다\n- 특정인과 계속적 관계일 필요가 없습니다\n- 계약이 성립하면 **결약서**를 작성해 교부해야 합니다\n\n## 위탁매매인 (제일 많이 나옴)\n**자기 명의로써 타인의 계산으로** 물건이나 유가증권의 매매를 하는 자입니다.\n- 거래 상대방에게는 위탁매매인이 당사자입니다\n- 경제적 효과는 위탁자에게 돌아갑니다\n- 위탁자의 지정가액을 준수해야 하며, 어겨서 손해가 나면 위탁매매인이 부담합니다\n- **개입권**이 인정됩니다. 거래소 시세가 있는 물건은 자신이 직접 매수인이나 매도인이 될 수 있습니다\n\n> \"자기 명의, 타인의 계산\" 이 문구가 그대로 선택지에 나옵니다. 위탁매매인의 정의입니다.\n\n## 운송주선인\n**자기 명의로** 물건운송의 **주선**을 영업으로 하는 자입니다. 직접 운송하지 않고 운송인을 알선합니다.\n\n## 정리\n| | 누구 이름으로 | 누구 계산으로 |\n|---|---|---|\n| 대리상 | 본인 이름 | 본인 계산 |\n| 중개인 | 당사자 아님 | — |\n| 위탁매매인 | **자기 이름** | **타인 계산** |\n| 운송주선인 | 자기 이름 | 위탁자 계산 |\n\n▸ 계산: 경제적 손익이 누구에게 돌아가느냐.\n▸ 결약서: 중개인이 계약 성립 내용을 적어 당사자에게 주는 서면.\n▸ 유치권: 받을 돈을 받을 때까지 물건을 붙잡아 둘 권리.","alt":"## 이 4개만 구분하면 끝\n기준은 딱 2개임. **누구 이름으로?** 그리고 **누구 돈으로?**\n\n## 대리상\n특정 상인이랑 **계속** 붙어서 거래를 대리하거나 중개함.\n- **본인(사장) 이름으로** 거래\n- 경업금지 있음\n- 보수 못 받으면 **유치권** 행사 가능\n\n## 중개인\n**남남끼리** 거래를 중개함. 부동산 중개인 생각하면 됨.\n- 자기는 계약 당사자 아님\n- 특정인이랑 계속 붙어있을 필요 없음 (대리상과 차이)\n- 계약되면 **결약서** 써줘야 함\n\n## 위탁매매인 ⭐ (제일 많이 나옴)\n> 🚨 **자기 명의로써 타인의 계산으로** 매매하는 자.\n> 이 문구 그대로 선택지에 나옴. 통으로 외워.\n> 즉 계약서엔 내 이름, 돈은 남이 벌고 남이 잃음.\n> 그리고 **개입권** 있음. 시세 있는 물건이면 자기가 직접 사거나 팔아도 됨.\n\n## 운송주선인\n**자기 이름으로** 운송을 **주선**함. 직접 운송 안 하고 운송사 연결해줌.\n\n## 표로 정리 (이것만 봐도 됨)\n| | 이름 | 돈 |\n|---|---|---|\n| 대리상 | 사장 | 사장 |\n| 중개인 | 당사자 아님 | — |\n| **위탁매매인** | **자기** | **남** |\n| 운송주선인 | 자기 | 위탁자 |\n\n> 위탁매매인만 \"자기 이름 + 남 돈\"임. 여기만 확실히 잡으면 나머지는 소거로 풀림.\n\n▸ 계산: 돈이 누구한테 가고 오냐.\n▸ 결약서: 중개인이 써주는 계약 내용 문서.\n▸ 유치권: 돈 받을 때까지 물건 안 주고 붙잡는 권리."},{"title":"⑨ 회사의 종류와 능력","sub":"상법","body":"## 회사란\n상행위나 그 밖의 영리를 목적으로 설립한 **법인**입니다. 두 가지가 핵심입니다. 영리성과 법인성입니다.\n> 사단성은 2011년 개정으로 조문에서 빠졌습니다. 1인 회사가 인정되기 때문입니다.\n\n## 다섯 종류\n| 회사 | 사원 구성 | 특징 |\n|---|---|---|\n| 합명회사 | 무한책임사원만 | 인적 신뢰 중심 |\n| 합자회사 | 무한 + 유한책임사원 | 무한책임사원이 경영 |\n| **유한책임회사** | 유한책임사원만 | 2011년 신설, 내부는 조합처럼 |\n| **주식회사** | 주주(유한책임) | 자본 중심, 시험의 대부분 |\n| 유한회사 | 사원(유한책임) | 폐쇄적, 사채 발행 불가 |\n\n> 익명조합, 합작회사, 지주회사는 상법상 회사 종류가 아닙니다. 선택지에 껴 나옵니다.\n\n## 무한책임과 유한책임\n- **무한책임**: 회사 재산으로 빚을 못 갚으면 사원이 개인 재산으로 끝까지 갚습니다\n- **유한책임**: 출자한 금액만 날리면 끝입니다\n\n주식회사가 널리 쓰이는 이유가 이것입니다. 투자자가 잃을 최대 금액이 정해져 있어야 돈이 모입니다.\n\n## 회사의 능력\n### 권리능력\n법인이므로 권리능력이 있습니다. 다만 성질상 제한이 있습니다.\n- **생명·신체에 관한 권리**는 가질 수 없습니다\n- **다른 회사의 무한책임사원이 될 수 없습니다**\n\n> 두 번째가 시험에 나옵니다. 무한책임을 지면 그 부담이 주주에게 전가되기 때문입니다.\n\n### 목적에 의한 제한\n정관에 적은 목적 범위를 벗어난 행위가 무효인지 다툼이 있는데, **판례는 목적 범위를 넓게 해석**해 사실상 제한하지 않습니다.\n\n## 법인격 부인\n회사가 사실상 개인의 도구로만 쓰이는 경우, 특정 사안에 한해 법인격을 무시하고 배후자에게 직접 책임을 물을 수 있습니다.\n> 회사를 없애는 것이 아니라 **그 사건에서만** 법인격을 무시하는 것입니다.\n\n▸ 사원: 회사의 구성원. 직원이 아닙니다. 주식회사에서는 주주입니다.\n▸ 출자: 회사에 돈이나 재산을 내는 것.\n▸ 법인격: 법인으로서 권리·의무의 주체가 되는 자격.","alt":"## 회사 = 영리 + 법인\n이 둘이 핵심.\n> 사단성은 2011년에 조문에서 빠짐. **1인 회사** 인정되니까.\n\n## 5종류 (이거만 회사임)\n| 회사 | 사원 | 한줄 |\n|---|---|---|\n| 합명 | 무한책임만 | 다 같이 무한책임 |\n| 합자 | 무한 + 유한 | 무한책임사원이 경영 |\n| 유한책임회사 | 유한만 | 2011년 신설 |\n| **주식회사** | 주주 | **시험의 90%** |\n| 유한회사 | 사원 | 폐쇄적, **사채 발행 불가** |\n\n> 🚨 **익명조합, 합작회사, 지주회사** → 회사 아님. 선택지에 껴 나옴.\n\n## 무한 vs 유한\n- **무한**: 회사 돈 다 털려도 내 집 팔아서 갚아야 함\n- **유한**: 낸 돈만 날리면 끝\n\n주식회사가 세상을 먹은 이유가 이거임. 최대 손실이 정해져야 사람들이 돈을 넣지.\n\n## 회사 능력 제한\n> 🚨 회사는 **다른 회사의 무한책임사원이 될 수 없음.**\n> 왜? 무한책임 지면 그 부담이 결국 주주한테 넘어가니까. 주주는 유한책임으로 들어온 건데 말이 안 됨.\n> 이거 자주 나옴.\n\n당연히 생명·신체 관련 권리도 없음. 회사가 결혼하거나 상속받진 않잖음.\n\n## 목적에 의한 제한\n정관 목적 벗어난 행위가 무효냐? 다툼 있는데 **판례는 목적을 넓게 봐서** 사실상 제한 안 함.\n\n## 법인격 부인\n> 회사가 사실상 사장 개인 지갑으로만 쓰임 → 그 건에서만 회사 껍데기 무시하고 사장한테 직접 책임 물림.\n> 🚨 회사를 없애는 게 아님. **그 사건에서만** 무시하는 거임.\n\n▸ 사원: 구성원. 직원 아님. 주식회사에선 주주.\n▸ 법인격: 법인으로서 권리·의무 주체 되는 자격."},{"title":"⑩ 주식회사의 설립","sub":"상법","body":"## 두 가지 방법\n### 발기설립\n발기인이 **주식 전부를 인수**합니다. 소규모 회사에서 씁니다.\n- 창립총회가 **없습니다**\n- 이사와 감사는 발기인이 선임합니다\n\n### 모집설립\n발기인이 일부만 인수하고 **나머지는 주주를 모집**합니다.\n- **창립총회를 열어야** 합니다\n- 이사와 감사는 창립총회에서 선임합니다\n\n> 창립총회 유무가 두 방식의 결정적 차이입니다. 시험에 그대로 나옵니다.\n\n## 절차\n정관 작성 → 주식 인수 → 출자 이행 → 기관 구성 → **설립등기**\n\n## 정관의 절대적 기재사항\n하나라도 빠지면 정관이 무효가 됩니다.\n- 목적\n- 상호\n- 회사가 발행할 주식의 총수\n- 1주의 금액\n- 회사 설립 시에 발행하는 주식의 총수\n- 본점 소재지\n- 회사가 공고하는 방법\n- 발기인의 성명·주민등록번호·주소\n\n> 자본금은 절대적 기재사항이 **아닙니다.** 최저자본금 제도가 폐지되었기 때문입니다. 이 함정이 나옵니다.\n\n정관은 공증인의 인증을 받아야 효력이 생깁니다. 다만 자본금 10억원 미만으로 발기설립하는 경우는 발기인의 기명날인으로 갈음할 수 있습니다.\n\n## 변태설립사항 (위험한 약속들)\n정관에 적어야 효력이 있는 사항입니다. 회사 재산을 축낼 위험이 있어 감시합니다.\n- 발기인이 받을 특별이익\n- **현물출자**\n- 재산인수\n- 회사가 부담할 설립비용과 발기인의 보수\n\n> 원칙적으로 법원이 선임한 검사인의 조사를 받아야 합니다.\n\n## 설립등기\n등기해야 **회사가 성립**합니다. 창설적 효력입니다.\n1주의 금액은 **100원 이상**이어야 합니다.\n\n▸ 발기인: 회사 설립을 주도하고 정관에 서명한 사람.\n▸ 현물출자: 돈 대신 부동산이나 기계 같은 재산으로 출자하는 것.\n▸ 갈음하다: 대신하다.","alt":"## 설립 2가지\n\n### 발기설립\n발기인이 **주식 전부** 먹음. 소규모 회사.\n> 🚨 **창립총회 없음.** 이사·감사는 발기인이 뽑음.\n\n### 모집설립\n발기인이 일부만 먹고 **나머지는 공개 모집**.\n> 🚨 **창립총회 있음.** 이사·감사는 창립총회에서 뽑음.\n\n> 🚨 **창립총회 유무**가 두 방식 차이의 핵심임. 이거 하나만 알아도 문제 풀림.\n\n## 순서\n정관 작성 → 주식 인수 → 돈 냄 → 기관 구성 → **설립등기**\n\n## 정관 절대적 기재사항 (빠지면 정관 무효)\n목적 / 상호 / 발행예정주식총수 / 1주 금액 / 설립 시 발행주식총수 / 본점 소재지 / 공고 방법 / 발기인 인적사항\n\n> 🚨 **\"자본금\"은 여기 없음.**\n> 최저자본금 폐지됐으니까. 선택지에 자본금 껴놓고 \"절대적 기재사항인 것은?\" 물어봄. 함정임.\n\n## 변태설립사항 (이름이 웃긴데 진짜 이름임)\n정관에 적어야만 효력 생기는 위험한 약속들. 회사 돈 빼먹을 여지가 있어서 감시함.\n- 발기인 특별이익\n- **현물출자**\n- 재산인수\n- 설립비용 + 발기인 보수\n\n> 원칙적으로 법원이 뽑은 검사인이 조사함.\n\n## 설립등기\n> 🚨 **등기해야 회사가 태어남.** 창설적 효력.\n> 그리고 **1주 금액은 100원 이상.** 숫자 나옴.\n\n▸ 발기인: 설립 주도하고 정관에 도장 찍은 사람.\n▸ 현물출자: 돈 말고 건물이나 기계로 출자."},{"title":"⑪ 주식과 주주","sub":"상법","body":"## 주식이란\n자본금을 잘게 나눈 단위이자 주주의 지위를 뜻합니다.\n**액면주식은 1주 100원 이상**이어야 하고, 정관으로 정하면 **무액면주식**도 발행할 수 있습니다. 다만 둘을 동시에 발행할 수는 없습니다.\n\n## 주주평등의 원칙\n주주는 **가진 주식 수에 따라** 평등하게 대우받습니다. 사람 수가 아니라 주식 수 기준입니다.\n\n## 주주의 권리\n### 자익권 (내 지갑)\n이익배당청구권, 잔여재산분배청구권, 신주인수권\n\n### 공익권 (회사 감시)\n의결권, 대표소송제기권, 회계장부열람권, 주주총회 소집청구권\n\n> 자익권과 공익권을 구분하는 문제가 나옵니다. 돈을 받는 것이면 자익권, 회사를 감시하거나 참여하는 것이면 공익권입니다.\n\n### 단독주주권과 소수주주권\n한 주만 있어도 되는 것이 단독주주권, 일정 지분이 필요한 것이 소수주주권입니다.\n- 주주제안권: 3%\n- 주주총회 소집청구권: 3%\n- 회계장부열람권: 3%\n- 이사 해임청구권: 3%\n- 대표소송제기권: **1%**\n- 위법행위 유지청구권: 1%\n\n> 대부분 3%인데 소송 관련이 1%입니다. 이렇게 묶어 외우면 편합니다. 상장회사는 더 낮은 특례가 있습니다.\n\n## 주주의 의무\n**출자의무 하나뿐**입니다. 인수한 주식의 인수가액을 납입하면 끝입니다. 그 이상 책임지지 않습니다.\n\n## 주식의 양도\n원칙적으로 자유롭습니다. 다만 **정관으로 이사회 승인을 받도록 제한할 수 있습니다.**\n> 정관으로도 양도를 전면 금지할 수는 없습니다.\n\n## 자기주식\n과거에는 원칙적으로 금지였으나, 2011년 개정으로 **배당가능이익 범위에서 취득**할 수 있게 되었습니다.\n취득한 자기주식에는 **의결권이 없습니다.**\n\n▸ 액면주식: 1주 금액이 정해진 주식.\n▸ 배당가능이익: 배당으로 나눠줄 수 있는 이익. 자본금을 건드리지 않는 범위입니다.\n▸ 유지청구: 하지 말라고 요구하는 것.","alt":"## 주식 = 자본금 쪼갠 조각 + 주주 지위\n- **액면주식: 1주 100원 이상**\n- 무액면주식도 가능. 근데 **둘을 동시에는 못 함**\n\n## 주주평등\n사람 수가 아니라 **주식 수** 기준으로 평등. 1인 1표 아니고 1주 1표임.\n\n## 권리 2분류\n- **자익권** = 내 지갑: 배당, 잔여재산, 신주인수권\n- **공익권** = 회사 감시: 의결권, 대표소송, 회계장부열람, 총회소집청구\n\n> 🚨 구분법 간단함. **돈 받으면 자익권, 감시하면 공익권.**\n\n## 소수주주권 지분 (숫자 나옴)\n> 🚨 **거의 다 3%인데 소송만 1%**\n> 3%: 주주제안, 총회소집청구, 회계장부열람, 이사해임청구\n> **1%: 대표소송, 위법행위 유지청구**\n>\n> 소송은 문턱을 낮춰야 견제가 되니까 1%로 내린 거임. 이렇게 이해하면 안 까먹음.\n> 상장회사는 더 낮은 특례 따로 있음.\n\n## 주주 의무\n> 🚨 **출자의무 딱 하나.** 주식값 내면 끝임.\n> 회사가 망해도 추가로 물어낼 거 없음. 이게 유한책임임.\n\n## 양도\n원칙 자유. 근데 **정관으로 이사회 승인 받게 제한 가능.**\n> 🚨 근데 **전면 금지는 못 함.** \"정관으로 양도를 금지할 수 있다\" → 오답.\n\n## 자기주식\n> 예전엔 원칙 금지였는데 2011년에 풀림. **배당가능이익 범위에서 취득 가능.**\n> 🚨 그리고 회사가 산 자기주식엔 **의결권 없음.** 자기가 자기한테 투표하면 이상하잖음.\n\n▸ 배당가능이익: 나눠줘도 되는 이익. 자본금은 못 건드림.\n▸ 유지청구: \"하지 마\" 하고 막는 거."},{"title":"⑫ 주주총회","sub":"상법","body":"## 주주총회란\n주주들이 모여 회사의 중요 사항을 결정하는 **최고 의사결정기관**입니다. 다만 상법과 정관이 정한 사항만 결의할 수 있습니다.\n\n## 결의 요건 (제일 중요)\n### 보통결의\n**출석 주주 의결권의 과반수 + 발행주식총수의 4분의 1 이상**\n- 이사·감사의 선임, 재무제표 승인, 이익배당, 이사 보수 결정\n\n### 특별결의\n**출석 주주 의결권의 3분의 2 이상 + 발행주식총수의 3분의 1 이상**\n- 정관 변경, 영업의 전부 또는 중요한 일부의 양도, 합병·분할, 자본금 감소, **이사의 해임**, 주식의 포괄적 교환\n\n> 함정이 하나 있습니다. **이사 선임은 보통결의, 이사 해임은 특별결의**입니다. 뽑기는 쉽고 자르기는 어렵습니다.\n\n### 특수결의\n총주주의 동의가 필요한 경우입니다. 이사의 회사에 대한 책임 면제 등이 해당합니다.\n\n## 소집\n- 이사회가 소집을 결정하고 대표이사가 소집합니다\n- **소집 통지는 회의일 2주 전**에 서면 또는 전자문서로 보냅니다\n- 소수주주(3%)나 감사도 소집을 청구할 수 있습니다\n\n## 의결권\n**1주 1의결권**이 원칙입니다. 정관으로도 이를 달리 정할 수 없습니다.\n\n의결권이 제한되는 경우가 있습니다.\n- 회사가 가진 **자기주식**\n- 상호주 (회사가 다른 회사 주식의 10% 초과 보유 시 그 회사가 가진 우리 주식)\n- **특별이해관계인**이 가진 주식\n- 감사 선임 시 **3% 초과분**\n\n## 결의의 하자\n| 소송 | 사유 | 제소기간 |\n|---|---|---|\n| 결의취소의 소 | 절차상 하자, 내용의 정관 위반 | 결의일부터 **2개월** |\n| 결의무효확인의 소 | 내용이 법령 위반 | 제한 없음 |\n| 결의부존재확인의 소 | 하자가 극심해 결의가 없다고 볼 정도 | 제한 없음 |\n\n▸ 특별이해관계인: 그 결의로 개인적 이익을 얻는 주주.\n▸ 상호주: 서로 상대 회사 주식을 갖고 있는 관계.\n▸ 제소기간: 소송을 낼 수 있는 기간.","alt":"## 주주총회 = 최고 의사결정기관\n근데 아무거나 정하는 건 아님. 상법이랑 정관이 정한 것만 결의 가능.\n\n## 결의 요건 ⭐ (여기가 전부임)\n\n### 보통결의\n**출석 과반수 + 발행주식총수 1/4**\n→ 이사·감사 **선임**, 재무제표 승인, 배당, 이사 보수\n\n### 특별결의\n**출석 2/3 + 발행주식총수 1/3**\n→ 정관변경, 영업양도, 합병·분할, 자본금 감소, **이사 해임**\n\n> 🚨 여기 함정 진짜 자주 나옴\n> **이사 선임 = 보통결의 / 이사 해임 = 특별결의**\n> 뽑는 건 쉽고 자르는 건 어려움. 안 그러면 대주주가 맘에 안 든다고 계속 갈아치우니까.\n\n### 특수결의\n총주주 동의. 이사 책임 면제 같은 거.\n\n## 소집\n> 🚨 **회의일 2주 전** 통지. 숫자 나옴.\n소수주주(3%)나 감사도 소집 청구 가능.\n\n## 의결권\n**1주 1의결권.** 정관으로도 못 바꿈.\n\n의결권 없어지는 경우 4개:\n- 회사가 산 **자기주식**\n- **상호주** (10% 초과 보유하면 상대가 가진 내 주식 의결권 죽음)\n- **특별이해관계인** 주식\n- 감사 선임 때 **3% 초과분**\n\n## 결의 하자 3종 (표로 외워)\n| 소송 | 언제 | 기간 |\n|---|---|---|\n| **취소** | 절차 하자, 정관 위반 | **2개월** |\n| **무효** | 내용이 법령 위반 | 제한 없음 |\n| **부존재** | 아예 결의라고 볼 수 없음 | 제한 없음 |\n\n> 🚨 **취소만 2개월 제한 있음.** 나머진 언제든 가능.\n> 절차 문제는 빨리 확정시켜야 하고, 내용이 위법한 건 시간 지난다고 봐줄 수 없으니까.\n\n▸ 특별이해관계인: 그 결의로 개인적 이득 보는 주주.\n▸ 제소기간: 소송 낼 수 있는 기간."},{"title":"⑬ 이사와 이사회","sub":"상법","body":"## 이사\n주주총회에서 **보통결의**로 선임합니다.\n- 임기는 **3년을 초과하지 못합니다**\n- 원칙적으로 3명 이상. 다만 **자본금 10억원 미만이면 1명 또는 2명**도 가능합니다\n- 해임은 **특별결의**입니다. 정당한 이유 없이 임기 만료 전에 해임하면 손해배상을 해야 합니다\n\n## 이사의 의무\n### 선관주의의무\n회사의 수임인으로서 선량한 관리자의 주의로 직무를 수행해야 합니다.\n\n### 충실의무\n회사를 위하여 직무를 충실히 수행해야 합니다.\n\n### 경업금지\n이사회 승인 없이 자기 또는 제3자의 계산으로 회사의 영업부류에 속한 거래를 하거나, 동종 영업을 목적으로 하는 회사의 무한책임사원·이사가 될 수 없습니다.\n\n### 자기거래 제한\n이사가 자기 또는 제3자의 계산으로 회사와 거래하려면 **이사회에서 미리 중요사실을 밝히고 승인**을 받아야 합니다. 이때 **이사 3분의 2 이상의 찬성**이 필요합니다.\n\n### 회사기회 유용 금지\n회사의 사업기회를 이사가 가로챌 수 없습니다. 이용하려면 이사회 승인이 필요합니다.\n\n### 비밀유지의무\n재임 중은 물론 **퇴임 후에도** 직무상 알게 된 비밀을 누설할 수 없습니다.\n\n## 이사회\n### 결의 요건\n**이사 과반수 출석 + 출석이사 과반수 찬성**입니다. 정관으로 비율을 높일 수는 있어도 낮출 수는 없습니다.\n> **대리 출석이 허용되지 않습니다.** 이사는 개인의 능력을 보고 뽑았기 때문입니다. 주주총회와 다른 점입니다.\n\n특별이해관계 있는 이사는 의결권을 행사하지 못합니다.\n\n## 대표이사\n이사회 결의로 선임합니다. 정관으로 주주총회에서 뽑도록 정할 수도 있습니다.\n회사를 대표하고 업무를 집행합니다. 대표권의 제한은 **선의의 제3자에게 대항하지 못합니다.**\n\n## 이사의 책임\n- 회사에 대한 책임: 법령·정관 위반이나 임무 해태로 손해를 입히면 연대배상. 면제하려면 **총주주의 동의**가 필요합니다\n- 제3자에 대한 책임: **고의 또는 중대한 과실**이 있어야 합니다. 경과실로는 책임지지 않습니다\n\n▸ 해태: 게을리하는 것.\n▸ 수임인: 일을 맡은 사람.\n▸ 경과실: 가벼운 부주의.","alt":"## 이사\n주주총회 **보통결의**로 선임.\n> 🚨 숫자 3개\n> **임기 3년 초과 불가**\n> 원칙 **3명 이상**. 근데 **자본금 10억 미만이면 1~2명**도 됨\n> 해임은 **특별결의**\n\n정당한 이유 없이 임기 전에 자르면 **손해배상** 해야 함.\n\n## 이사 의무 (6개)\n- **선관주의의무**: 성실하게 일해라\n- **충실의무**: 회사 위해 충실히\n- **경업금지**: 같은 업종 거래 금지 (이사회 승인 필요)\n- **자기거래 제한**: 회사랑 거래하려면 이사회 승인. **이사 2/3 찬성** 필요\n- **회사기회 유용 금지**: 회사가 먹을 사업 가로채기 금지\n- **비밀유지**: **퇴임 후에도** 유지. 이거 함정으로 나옴\n\n> 🚨 자기거래 승인은 그냥 과반수가 아니라 **2/3**임. 이사회 일반 결의랑 다름.\n\n## 이사회 결의\n**이사 과반수 출석 + 출석 과반수 찬성.** 정관으로 높이는 건 되고 낮추는 건 안 됨.\n\n> 🚨 **대리 출석 안 됨.**\n> 주주총회는 대리인 보낼 수 있는데 이사회는 안 됨.\n> 주주는 돈 넣은 사람이라 누가 오든 상관없지만, 이사는 그 사람 능력 보고 뽑은 거니까 대타가 말이 안 됨.\n> 이 차이 물어봄.\n\n## 대표이사\n이사회가 뽑음 (정관으로 주총에서 뽑게 할 수도 있음).\n> 🚨 대표권 제한은 **선의의 제3자한테 못 우김.** 지배인이랑 같은 논리.\n\n## 이사 책임\n- **회사에 대해**: 면제하려면 **총주주 동의**. 한 명이라도 반대하면 못 함\n- **제3자에 대해**: **고의 또는 중과실**이어야 책임짐. 경과실로는 안 짐\n\n> 🚨 제3자 책임은 문턱이 높음. \"과실이 있으면 책임진다\" → 오답. **중과실**이어야 함.\n\n▸ 해태: 게을리함.\n▸ 경과실: 가벼운 실수."},{"title":"⑭ 감사와 감사위원회","sub":"상법","body":"## 감사\n이사의 직무집행을 감독하는 기관입니다. 주주총회에서 선임합니다.\n\n### 3% 룰\n> 감사 선임 시 의결권 있는 주식의 **3%를 초과하는 부분은 의결권을 행사하지 못합니다.**\n> 대주주가 자기 사람을 감사로 앉히면 감시가 안 되기 때문에, 대주주의 힘을 일부러 눌러놓은 것입니다.\n\n### 임기와 겸직\n- 임기는 취임 후 **3년 내의 최종 결산기에 관한 정기총회 종결 시**까지입니다\n- 감사는 회사 및 자회사의 **이사나 지배인, 그 밖의 사용인을 겸하지 못합니다**\n\n### 권한\n- 영업보고 요구권, 업무·재산상태 조사권\n- 이사회 출석·의견진술권\n- 이사의 위법행위 **유지청구권**\n- 회사와 이사 간 소송에서 **회사를 대표**\n\n## 감사위원회\n감사를 대신하는 이사회 내 위원회입니다. 감사와 **택일**입니다. 둘 다 둘 수는 없습니다.\n- **3명 이상의 이사**로 구성\n- 그중 **3분의 2 이상이 사외이사**여야 합니다\n\n## 상장회사 특례\n- 자산총액 1천억원 이상: 상근감사 1명 이상 의무\n- 자산총액 2조원 이상: **감사위원회 설치 의무**, 사외이사를 이사 총수의 과반수이면서 3명 이상\n\n## 준법지원인\n자산총액 5천억원 이상 상장회사는 준법통제기준을 마련하고 준법지원인을 두어야 합니다.\n\n## 외부감사인\n회계 처리의 적정성을 감사하는 공인회계사입니다. 상법상 기관인 감사와는 다릅니다.\n> 감사는 회사 내부기관, 외부감사인은 외부 전문가입니다. 섞어 내는 경우가 있습니다.\n\n▸ 사외이사: 회사에 상근하지 않고 경영진과 이해관계가 없는 이사.\n▸ 상근감사: 회사에 상시 출근하는 감사.\n▸ 유지청구: 위법행위를 하지 말라고 요구하는 것.","alt":"## 감사\n이사 감시하는 기관. 주주총회에서 뽑음.\n\n### 3% 룰 ⭐\n> 🚨 감사 뽑을 때 **3% 초과분은 의결권 없음.**\n> 왜? 60% 대주주가 자기 친구를 감사로 앉히면 감시가 되겠음? 그래서 일부러 힘을 눌러놓은 거임.\n> 이 취지까지 알아두면 안 까먹음.\n\n### 겸직 금지\n> 🚨 감사는 회사·자회사의 **이사, 지배인, 사용인 겸직 불가.**\n> 자기가 자기를 감시할 순 없잖음.\n\n### 권한\n영업보고 요구 / 업무·재산 조사 / 이사회 출석 / 이사 위법행위 **유지청구** / 회사와 이사 소송 시 **회사 대표**\n\n> 마지막 게 재밌음. 회사가 이사 고소할 때 대표이사가 대표하면 자기가 자기 고소하는 꼴이라 감사가 대신 나섬.\n\n## 감사위원회\n감사 대신 두는 이사회 내 위원회.\n> 🚨 감사랑 **둘 중 하나만.** 같이 못 둠.\n> **이사 3명 이상**, 그중 **2/3 이상이 사외이사**.\n\n## 상장회사 특례 (숫자)\n- 자산 **1천억 이상**: 상근감사 1명 이상\n- 자산 **2조 이상**: **감사위원회 의무** + 사외이사 과반수이면서 3명 이상\n- 자산 **5천억 이상**: 준법지원인\n\n> 1천억 → 상근감사 / 5천억 → 준법지원인 / 2조 → 감사위원회. 순서대로 외우면 됨.\n\n## 감사 vs 외부감사인\n> 🚨 헷갈리게 냄.\n> **감사** = 상법상 회사 **내부기관**\n> **외부감사인** = 외부 회계법인, 공인회계사\n> 이름만 비슷하지 완전 다른 존재임.\n\n▸ 사외이사: 출근 안 하고 경영진이랑 이해관계 없는 이사.\n▸ 유지청구: \"하지 마\" 하고 막는 거."},{"title":"⑮ 신주발행·사채·합병","sub":"상법","body":"## 신주발행 (자기자본 조달)\n회사가 돈이 필요할 때 새 주식을 찍어 파는 것입니다.\n- 원칙적으로 **이사회가 결정**합니다\n- **주주가 소유 주식 수에 비례해 신주를 배정받을 권리**를 가집니다\n\n### 제3자 배정\n정관에 정한 경우에 한하여, **신기술 도입이나 재무구조 개선 등 경영상 목적을 달성하기 위해 필요한 경우**에만 가능합니다.\n> 경영권 방어를 위한 제3자 배정은 무효라는 것이 판례입니다. 이 논점이 나옵니다.\n\n## 사채 (타인자본 조달)\n회사가 빚을 내는 것입니다.\n- **이사회가 발행을 결정**합니다\n- 사채권자는 채권자일 뿐 의결권이 없습니다\n- 회사가 잘돼도 정해진 이자만 받고, 망하면 주주보다 먼저 받습니다\n\n### 특수사채\n- **전환사채(CB)**: 주식으로 전환할 수 있는 권리. 전환하면 사채는 소멸\n- **신주인수권부사채(BW)**: 신주를 인수할 권리. 행사해도 사채는 남음\n\n> 유한회사는 **사채를 발행할 수 없습니다.**\n\n## 자본금의 감소\n- **결손 보전 목적**이면 보통결의\n- 그 외에는 **특별결의 + 채권자 보호절차**\n\n> 자본금이 줄면 채권자의 담보가 줄어드니 이의를 제기할 기회를 줍니다.\n\n## 합병\n- **주주총회 특별결의**\n- **채권자 보호절차** (이의제출 공고)\n- 반대주주에게 **주식매수청구권**\n\n### 소멸회사의 권리의무\n합병으로 소멸하는 회사의 권리와 의무는 **포괄적으로 승계**됩니다. 개별 이전 절차가 필요 없습니다.\n\n## 해산과 청산\n해산 사유는 존립기간 만료, 합병, 파산, 법원의 해산명령, 주주총회 특별결의 등입니다.\n> 해산해도 **청산의 목적 범위 내에서 존속**합니다. 청산이 끝나야 완전히 소멸합니다.\n\n▸ 결손: 자본금보다 순자산이 적은 상태.\n▸ 주식매수청구권: 반대하는 주주가 회사에 자기 주식을 사달라고 요구하는 권리.\n▸ 포괄승계: 하나하나 옮기지 않고 통째로 넘어가는 것.","alt":"## 신주발행 = 자기자본 (동업자 늘리기)\n새 주식 찍어서 팜.\n- **이사회가 결정**\n- **기존 주주가 비율대로 받을 권리** 있음\n\n### 제3자 배정\n> 🚨 정관에 정해두고, **경영상 목적**(신기술 도입, 재무구조 개선)이 있을 때만 가능.\n> 그리고 **경영권 방어하려고 제3자한테 몰아주면 무효**임. 판례. 이거 논점으로 나옴.\n\n## 사채 = 타인자본 (빚내기)\n- **이사회가 결정** (신주도 이사회, 사채도 이사회)\n- 사채권자는 의결권 **없음**. 채권자니까\n- 회사 대박나도 이자만 받고, 망하면 주주보다 **먼저** 받음\n\n### 특수사채 2개\n- **CB(전환사채)**: 주식으로 **바꿈** → 사채 사라짐\n- **BW(신주인수권부사채)**: 주식 살 **쿠폰** → 사채는 **남음**\n\n> 🚨 이 차이 나옴. 바뀌면 없어지고, 쿠폰이면 남음.\n> 그리고 **유한회사는 사채 발행 못 함.**\n\n## 자본금 감소\n- **결손 보전용**이면 보통결의\n- 그 외엔 **특별결의 + 채권자 보호절차**\n\n> 자본금 줄면 채권자 담보가 줄잖음. 그래서 \"이의 있으면 말해라\" 하고 물어봐야 함.\n\n## 합병\n**특별결의 + 채권자 보호절차 + 반대주주 주식매수청구권**\n> 🚨 소멸회사 권리의무는 **포괄승계**됨. 하나하나 옮길 필요 없이 통째로 넘어감.\n\n## 해산·청산\n> 🚨 해산해도 **청산 목적 범위에서 존속함.** 청산 끝나야 진짜 소멸.\n> 이 문장 민법 법인 편에도 똑같이 나옴. 세트로 기억.\n\n▸ 결손: 자본금보다 순자산이 적은 상태.\n▸ 주식매수청구권: 반대 주주가 \"내 주식 사가라\" 요구하는 권리."},{"title":"⑯ 이사의 의무와 책임","sub":"상법","body":"## 이사가 지는 의무\n이사는 회사의 재산을 맡아 굴리는 사람입니다. 그래서 일반 계약보다 무거운 의무를 집니다.\n\n### 선관주의의무\n회사와 이사는 위임관계입니다. 따라서 **선량한 관리자의 주의**로 사무를 처리해야 합니다. 자기 재산 다루듯 대충 하면 안 되고 그 지위에 요구되는 수준의 주의를 기울여야 합니다.\n\n### 충실의무 (제382조의3)\n법령과 정관에 따라 회사를 위하여 그 직무를 충실하게 수행해야 합니다. 회사 이익과 자기 이익이 충돌할 때 회사를 앞세우라는 뜻입니다.\n\n### 경업금지의무 (제397조)\n이사는 **이사회의 승인** 없이 자기 또는 제3자의 계산으로 회사의 영업부류에 속한 거래를 하거나, 동종 영업을 목적으로 하는 다른 회사의 무한책임사원이나 이사가 되지 못합니다.\n위반하면 회사는 **개입권**을 행사할 수 있습니다.\n\n### 자기거래 제한 (제398조)\n이사가 자기 또는 제3자의 계산으로 회사와 거래하려면 **미리 이사회에서 중요사실을 밝히고 이사 3분의 2 이상의 찬성**으로 승인받아야 합니다.\n> 일반 이사회 결의는 과반수인데 자기거래는 3분의 2입니다. 요건이 더 무겁습니다.\n\n### 회사기회 유용금지 (제397조의2)\n회사에 이익이 될 수 있는 사업기회를 이사가 가로채는 것을 금지합니다. 역시 이사 3분의 2 이상의 승인이 필요합니다.\n\n## 이사의 책임\n### 회사에 대한 책임\n법령이나 정관을 위반하거나 임무를 게을리한 이사는 회사에 **연대하여 손해배상책임**을 집니다.\n이 책임은 **총주주의 동의**로 면제할 수 있습니다. 정관으로 일정 한도까지 감경할 수도 있습니다.\n\n### 제3자에 대한 책임\n이사가 **고의 또는 중대한 과실**로 임무를 게을리해 제3자에게 손해를 입히면 제3자에게도 배상책임을 집니다.\n> 경과실은 제외됩니다. 회사에 대한 책임은 경과실도 포함하는데 제3자에 대해서는 중과실 이상이어야 합니다. 이 차이가 나옵니다.\n\n▸ 선관주의의무: 그 지위에 있는 보통 사람에게 요구되는 정도의 주의.\n▸ 개입권: 이사가 얻은 이익을 회사가 가져가는 권리.\n▸ 경영판단의 원칙: 합리적 절차를 거친 경영 판단이 결과적으로 실패해도 책임을 묻지 않는다는 법리.","alt":"## 이사가 지는 의무 (다 나옴)\n\n### 선관주의의무\n회사랑 이사는 위임관계임. 그래서 **선량한 관리자 주의**로 일해야 함. 대충 하면 책임짐.\n\n### 충실의무\n회사 이익 vs 내 이익 충돌하면 **회사 먼저**.\n\n### 경업금지 (397조)\n**이사회 승인** 없이 같은 업종 거래 못 하고 경쟁회사 이사도 못 됨.\n어기면 회사가 **개입권** 행사함. 번 돈 내놔.\n\n### 자기거래 (398조) ⭐\n이사가 회사랑 거래하려면 → 미리 이사회에 밝히고 **이사 3분의 2 이상** 찬성.\n\n> 🚨 여기 숫자 주의.\n> 일반 이사회 결의 = **과반수**\n> 자기거래 = **3분의 2**\n> 더 무겁게 만들어놨음. 이거 바꿔서 냄.\n\n### 회사기회 유용금지\n회사가 먹을 수 있던 사업을 이사가 가로채기 금지. 이것도 **3분의 2**.\n\n## 이사의 책임 ⭐\n\n### 회사한테\n법령·정관 위반하거나 임무 게을리함 → **연대해서 손해배상**.\n> 면제하려면? **총주주 동의.** 한 명이라도 반대하면 못 함.\n\n### 제3자한테\n> 🚨 여기가 핵심임\n> 회사한테는 **경과실도** 책임짐\n> 제3자한테는 **고의 또는 중대한 과실**이어야 책임짐\n> 요구 수준이 다름. \"경미한 과실로 제3자에게 손해를 입힌 경우에도 책임진다\" → 오답.\n\n▸ 선관주의의무: 그 자리 사람이면 이 정도는 해야지 수준의 주의.\n▸ 개입권: 이사가 번 이익 회사가 뺏는 권리.\n▸ 경영판단의 원칙: 절차 제대로 밟고 판단했으면 망해도 책임 안 묻는다는 법리."},{"title":"⑰ 소수주주권과 주주 보호","sub":"상법","body":"## 왜 소수주주권이 있나\n주식회사는 다수결로 움직입니다. 그러면 대주주가 마음대로 하고 소액주주는 당하기만 합니다.\n그래서 일정 지분만 모으면 행사할 수 있는 권리를 따로 만들어 두었습니다. 이것이 소수주주권입니다.\n\n## 단독주주권 vs 소수주주권\n- **단독주주권**: 한 주만 있어도 행사 가능. 의결권, 설립무효의 소, 신주발행유지청구권, 정관열람권\n- **소수주주권**: 일정 지분 이상이어야 행사 가능\n\n## 지분 요건 (숫자가 그대로 나옵니다)\n| 권리 | 비상장 | 상장 |\n|---|---|---|\n| 주주제안권 | 3% | 1% (자본금 1천억 이상은 0.5%) |\n| 임시주주총회 소집청구권 | 3% | 1.5% |\n| 회계장부열람권 | 3% | 0.1% |\n| 이사·감사 해임청구권 | 3% | 0.5% |\n| 대표소송제기권 | 1% | 0.01% |\n\n> **대표소송만 1%**이고 나머지는 대체로 3%입니다. 이 한 가지만 따로 기억하면 헷갈리지 않습니다.\n> 상장회사는 주식이 널리 흩어져 있어 요건을 크게 낮춰줍니다.\n\n## 대표소송\n이사가 회사에 손해를 입혔는데 회사가 소송을 걸지 않을 때, 주주가 **회사를 대신해** 이사에게 책임을 묻는 소송입니다.\n먼저 회사에 소 제기를 청구하고, 30일 안에 회사가 소를 걸지 않으면 주주가 직접 제기할 수 있습니다.\n승소해도 배상금은 **회사에** 귀속됩니다. 주주가 가져가는 것이 아닙니다.\n\n## 주식매수청구권\n합병, 영업양도처럼 회사의 근본이 바뀌는 결정에 반대하는 주주는, 회사에 **자기 주식을 사가라고 요구**할 수 있습니다.\n반대 의사를 미리 서면으로 통지하고 총회에서 반대해야 행사할 수 있습니다.\n\n> 다수결로 밀어붙이되 반대하는 사람에게는 나갈 문을 열어주는 구조입니다.\n\n▸ 소수주주: 지배력이 없는 소액주주.\n▸ 유지청구권: 위법한 행위를 멈추라고 요구하는 권리.\n▸ 대표소송: 주주가 회사를 대신해 제기하는 소송.","alt":"## 왜 있냐\n주식회사는 다수결임. 그럼 대주주가 다 해먹고 소액주주는 당하기만 함.\n그래서 지분 좀 모으면 쓸 수 있는 권리를 따로 만들어둠.\n\n## 단독 vs 소수\n- **단독주주권**: 1주만 있어도 됨. 의결권, 설립무효의 소, 정관열람\n- **소수주주권**: 지분 일정 이상 필요\n\n## 지분 요건 (숫자 그대로 나옴) ⭐\n| 권리 | 비상장 | 상장 |\n|---|---|---|\n| 주주제안권 | 3% | 1% |\n| 임시총회 소집청구 | 3% | 1.5% |\n| 회계장부열람 | 3% | 0.1% |\n| 이사·감사 해임청구 | 3% | 0.5% |\n| **대표소송** | **1%** | 0.01% |\n\n> 🚨 외우는 요령\n> **대부분 3%. 대표소송만 1%.**\n> 이거 하나만 따로 기억하면 됨. 왜 낮냐면 대표소송은 회사를 위해 싸워주는 거라 문턱을 낮춘 거임.\n> 상장회사는 주식이 흩어져 있어서 요건을 확 낮춰줌.\n\n## 대표소송\n이사가 회사에 손해 입혔는데 회사가 소송을 안 검. 사장 친구니까.\n→ 주주가 **회사 대신** 이사한테 소송 검.\n\n절차: 회사에 먼저 \"소송 걸어라\" 요구 → **30일** 안에 안 걸면 주주가 직접 제기.\n\n> 🚨 이기면 돈은 누가 먹음? **회사가 먹음.** 소송한 주주가 아님.\n> 회사 대신 싸워준 거니까 당연함. 근데 이거 함정으로 나옴.\n\n## 주식매수청구권\n합병이나 영업양도처럼 회사 뿌리가 바뀌는 결정에 반대함\n→ **\"내 주식 니가 사가라\"** 요구 가능.\n\n조건: 미리 서면으로 반대 통지 + 총회에서 반대해야 함. 그냥 나중에 딴소리하면 안 됨.\n\n> 다수결로 밀어붙이되 싫은 사람은 나갈 문 열어주는 구조임.\n\n▸ 유지청구권: 위법행위 멈추라고 요구하는 권리."},{"title":"⑱ 인적회사와 유한회사","sub":"상법","body":"## 인적회사와 물적회사\n- **인적회사**: 사원 개인의 신용이 중요. 합명회사, 합자회사\n- **물적회사**: 회사 재산이 중요. 주식회사, 유한회사\n\n인적회사는 사람 사이의 신뢰로 굴러가므로 지분 양도가 어렵고, 물적회사는 재산이 중심이라 사람이 바뀌어도 됩니다.\n\n## 합명회사\n**모든 사원이 무한책임**을 집니다. 회사 재산으로 빚을 못 갚으면 사원이 개인 재산으로 갚습니다.\n사원 전원이 업무집행권과 대표권을 갖는 것이 원칙입니다.\n지분을 양도하려면 **다른 사원 전원의 동의**가 필요합니다.\n\n## 합자회사\n**무한책임사원 + 유한책임사원**으로 구성됩니다.\n- 무한책임사원: 업무집행과 대표를 맡습니다\n- 유한책임사원: 출자액 한도로만 책임지고 **업무집행권과 대표권이 없습니다**. 다만 감시권은 있습니다\n\n> 유한책임사원은 돈만 대고 경영에는 참여하지 않는 구조입니다. 이 점이 시험에 나옵니다.\n\n## 유한책임회사\n2011년에 도입된 형태입니다. 사원 전원이 유한책임을 지면서 내부 운영은 조합처럼 자유롭게 정할 수 있습니다.\n벤처나 소규모 창업에 맞게 만든 것입니다. 사원이 아닌 자도 업무집행자로 정할 수 있습니다.\n\n## 유한회사\n주식회사와 비슷하지만 폐쇄적입니다.\n- 사원은 출자액 한도로 유한책임\n- **사채를 발행할 수 없습니다**\n- 지분 양도가 주식보다 제한적입니다\n- **감사는 임의기관**입니다. 두지 않아도 됩니다\n\n> 주식회사는 사채 발행이 가능한데 유한회사는 불가능합니다. 이 대비가 자주 출제됩니다.\n\n## 정리\n| | 책임 | 사채발행 | 지분양도 |\n|---|---|---|---|\n| 합명 | 전원 무한 | — | 전원 동의 |\n| 합자 | 무한+유한 | — | 제한적 |\n| 유한책임 | 전원 유한 | 불가 | 제한적 |\n| 유한 | 전원 유한 | **불가** | 제한적 |\n| 주식 | 전원 유한 | **가능** | 자유 |\n\n▸ 무한책임: 회사 빚을 개인 재산으로도 갚아야 하는 책임.\n▸ 업무집행권: 회사 일을 실제로 처리할 권한.\n▸ 폐쇄적: 외부인이 들어오기 어려운 구조.","alt":"## 인적 vs 물적\n- **인적회사**: 사람 신용이 중요. 합명, 합자\n- **물적회사**: 회사 재산이 중요. 주식, 유한\n\n사람이 중요하면 지분 넘기기 어렵고, 재산이 중요하면 사람 바뀌어도 상관없음. 이 논리로 다 설명됨.\n\n## 합명회사\n**전원 무한책임.** 회사 돈 없으면 내 집 팔아서라도 갚아야 함.\n전원이 업무집행권 + 대표권 가짐.\n지분 넘기려면 **다른 사원 전원 동의**. 빡셈.\n\n## 합자회사\n**무한책임사원 + 유한책임사원** 섞임.\n- 무한: 일하고 대표함\n- 유한: 돈만 댐. **업무집행권·대표권 없음**\n\n> 🚨 유한책임사원은 **경영 참여 못 함.** 감시권만 있음.\n> \"합자회사의 유한책임사원은 업무를 집행한다\" → 오답. 자주 나옴.\n\n## 유한책임회사\n2011년에 새로 만든 거. 전원 유한책임인데 내부 운영은 조합처럼 자유롭게.\n벤처·소규모 창업용임. 사원 아닌 사람도 업무집행자 가능.\n\n## 유한회사\n주식회사 축소판인데 폐쇄적임.\n- 전원 유한책임\n- **사채 발행 불가** ⭐\n- 지분 양도 제한적\n- **감사 임의기관** (없어도 됨)\n\n## 표로 정리 ⭐\n| | 책임 | 사채 |\n|---|---|---|\n| 합명 | 전원 무한 | — |\n| 합자 | 무한+유한 | — |\n| 유한책임 | 전원 유한 | 불가 |\n| **유한** | 전원 유한 | **불가** |\n| **주식** | 전원 유한 | **가능** |\n\n> 🚨 **사채 발행은 주식회사만 됨.** 유한회사는 안 됨.\n> 이 대비 진짜 자주 냄.\n\n▸ 무한책임: 내 재산까지 털림.\n▸ 업무집행권: 실제로 일 처리할 권한."},{"title":"⑲ 회사의 해산과 법인격 부인","sub":"상법","body":"## 해산과 청산\n회사가 없어지는 것도 두 단계입니다.\n- **해산**: 영업활동을 멈추는 것\n- **청산**: 남은 재산과 채무를 정리하는 것\n\n> 해산해도 회사는 바로 사라지지 않습니다. **청산의 목적 범위 안에서 존속**합니다. 이 표현이 그대로 나옵니다.\n\n### 주식회사의 해산 사유\n- 존립기간의 만료, 정관에 정한 사유의 발생\n- 합병, 분할\n- 파산\n- 법원의 해산명령이나 해산판결\n- **주주총회의 특별결의**\n\n### 휴면회사의 해산 의제\n최후 등기 후 **5년**이 지난 회사는 법원의 공고 후 신고하지 않으면 해산한 것으로 봅니다.\n\n## 회사의 계속\n해산했더라도 청산이 끝나기 전이라면 다시 살릴 수 있습니다. 존립기간 만료나 총회 결의로 해산한 경우 특별결의로 회사를 계속할 수 있습니다.\n> 파산이나 해산명령으로 해산한 경우에는 계속할 수 없습니다.\n\n## 법인격 부인론\n회사는 주주와 별개의 인격이므로 회사 빚을 주주에게 물을 수 없는 것이 원칙입니다.\n그런데 회사가 **껍데기에 불과하고 주주 개인의 도구로 쓰인 경우**, 그 사안에 한하여 회사의 독립성을 무시하고 주주에게 직접 책임을 묻습니다.\n\n인정되는 대표적 상황은 이렇습니다.\n- 회사와 주주의 재산이 뒤섞여 구분되지 않음\n- 자본이 지나치게 부족함\n- 채무를 피하려고 회사 형태를 남용함\n\n> 이때 법인격이 아예 없어지는 것이 아닙니다. **그 사건에 한해서만** 무시합니다. \"법인격이 소멸한다\"는 선택지는 오답입니다.\n\n▸ 청산: 남은 재산과 빚을 정리하는 절차.\n▸ 해산 의제: 실제로 해산 절차를 밟지 않아도 해산한 것으로 보는 것.\n▸ 법인격: 회사가 사람처럼 권리와 의무의 주체가 되는 자격.","alt":"## 해산이랑 청산\n- **해산**: 영업 중단. 셔터 내림\n- **청산**: 재산이랑 빚 정리. 뒷정리\n\n> 🚨 해산했다고 회사가 증발 안 함.\n> **청산 목적 범위 내에서 존속함.** 이 문장 그대로 나옴.\n\n### 주식회사 해산 사유\n존립기간 만료 / 정관 사유 / 합병·분할 / 파산 / 법원의 해산명령·판결 / **주총 특별결의**\n\n### 휴면회사\n> 🚨 최후 등기 후 **5년** 지나면 법원이 공고하고, 신고 안 하면 **해산한 걸로 봄.**\n> 서류상으로만 남아있는 유령회사 정리하는 제도임. 5년이라는 숫자 나옴.\n\n## 회사의 계속\n해산했어도 청산 끝나기 전이면 되살릴 수 있음. 특별결의로 계속.\n> 🚨 근데 **파산이나 해산명령으로 해산한 건 못 살림.** 이건 예외.\n\n## 법인격 부인론 ⭐\n원칙: 회사랑 주주는 별개 인격임. 회사 빚을 사장한테 못 받음.\n\n근데 회사가 **껍데기뿐이고 사장 개인 지갑처럼 쓰였으면?**\n→ 그 사안에 한해 회사 껍데기 무시하고 **사장한테 직접 청구**함.\n\n인정되는 상황:\n- 회사 돈이랑 사장 돈이 구분 안 됨\n- 자본이 터무니없이 부족함\n- 빚 떼먹으려고 회사 형태 악용\n\n> 🚨 여기 함정\n> 법인격이 **아예 없어지는 게 아님.** 그 사건에서만 무시하는 거임.\n> \"법인격이 소멸한다\" → 오답. 회사는 그대로 살아있음.\n\n▸ 해산 의제: 절차 안 밟아도 해산한 걸로 치는 것.\n▸ 법인격: 회사가 사람처럼 권리·의무 주체가 되는 자격."},{"title":"① 경제학의 출발점","sub":"미시경제","body":"## 희소성이 모든 것의 시작\n원하는 것은 많은데 자원은 한정되어 있습니다. 이것이 희소성입니다.\n희소성이 있으니 **선택**을 해야 하고, 선택을 하면 **포기하는 것**이 생깁니다. 경제학은 이 선택을 다루는 학문입니다.\n\n## 기회비용\n어떤 것을 선택하면서 **포기한 대안 중 가치가 가장 큰 것**입니다.\n회사를 그만두고 공부를 하기로 했다면, 학원비뿐 아니라 **못 받게 된 월급**도 비용입니다.\n\n기회비용은 두 덩어리입니다.\n- **명시적 비용**: 실제로 돈이 나가는 것. 학원비, 교재비\n- **암묵적 비용**: 돈은 안 나가지만 포기한 것. 월급\n\n> 경제학에서 비용이라고 하면 항상 기회비용입니다. 회계상 비용과 다릅니다. 그래서 회계상 이익이 나도 경제적 이익은 마이너스일 수 있습니다.\n\n## 매몰비용\n이미 써버려서 되돌릴 수 없는 비용입니다.\n> **매몰비용은 의사결정에 고려하지 않습니다.** 이미 나간 돈이라 앞으로의 선택을 바꿔도 회수되지 않기 때문입니다.\n> 영화가 재미없으면 티켓값이 아까워도 나오는 게 합리적입니다. 티켓값은 나오든 앉아 있든 똑같이 사라졌습니다.\n\n## 합리적 선택의 기준\n경제학에서 합리적이란 **한계적으로** 따진다는 뜻입니다.\n전체를 볼 게 아니라 **한 단위 더** 했을 때 얻는 것과 잃는 것을 비교합니다.\n- 한계편익 > 한계비용 → 더
