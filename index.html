<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D5B52">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="문제 드릴">
<title>문제 드릴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFF1EE; --surface:#FFFFFF; --ink:#17282A; --muted:#5F7275;
  --rule:#D3DBD8; --accent:#0D5B52;
  --ok:#14634B; --okbg:#DDEDE4; --no:#96382C; --nobg:#F5E1DC;
  --shade:#E4E8E4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1618; --surface:#162124; --ink:#E4EDEA; --muted:#8FA5A3;
    --rule:#253538; --accent:#58BBA4;
    --ok:#58BBA4; --okbg:#14312B; --no:#E28C7A; --nobg:#35201C; --shade:#1C282B;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1618; --surface:#162124; --ink:#E4EDEA; --muted:#8FA5A3;
  --rule:#253538; --accent:#58BBA4;
  --ok:#58BBA4; --okbg:#14312B; --no:#E28C7A; --nobg:#35201C; --shade:#1C282B;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
#shell{display:flex;flex-direction:column;height:100vh;height:100dvh}
#scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
body{
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:15px; line-height:1.6; -webkit-text-size-adjust:100%;
}
.wrap{max-width:620px;margin:0 auto;padding:0 20px 40px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

.masthead{padding:44px 0 6px}
.masthead h1{font-family:"Gowun Batang",serif;font-size:30px;font-weight:700;margin:0}
.masthead p{font-size:13px;color:var(--muted);margin:8px 0 0}

.hero{padding:44px 0 32px}
.hero .when{font-size:13px;color:var(--muted)}
.hero .num{font-family:"Gowun Batang",serif;font-size:96px;line-height:.92;font-weight:700;
  font-variant-numeric:tabular-nums;margin:10px 0 0;color:var(--accent)}
.hero .unit{font-family:"Gowun Batang",serif;font-size:18px;margin-top:8px}
.hero .sub{font-size:13px;color:var(--muted);margin-top:14px;line-height:1.7}

.sectitle{font-size:12px;color:var(--muted);padding:26px 0 8px;border-bottom:1px solid var(--rule)}
.row{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;
  border-bottom:1px solid var(--rule);padding:15px 2px;text-align:left;min-height:58px}
.row:hover .rname{color:var(--accent)}
.rname{font-size:15px;font-weight:500;display:block}
.rsub{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.rnum{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rpct{width:52px;text-align:right;font-size:14px;font-variant-numeric:tabular-nums;color:var(--muted)}
.rpct.has{color:var(--ink);font-weight:600}
.bar{height:2px;background:var(--shade);margin-top:7px;width:100%;display:block}
.bar > i{display:block;height:100%;background:var(--accent)}
.del{border:0;background:none;color:var(--muted);font-size:13px;padding:8px}

.actions{margin-top:28px;display:flex;flex-direction:column;gap:10px}
.btn{display:block;width:100%;padding:17px 18px;border:1px solid var(--accent);
  background:var(--accent);color:var(--bg);border-radius:2px;font-weight:600;font-size:15px;text-align:center}
.btn.ghost{background:none;color:var(--accent)}
.btn.quiet{background:none;border-color:var(--rule);color:var(--muted);font-weight:400}
.btn[disabled]{opacity:.4;pointer-events:none}
.note{font-size:12.5px;color:var(--muted);margin-top:22px;line-height:1.75}
.note code{background:var(--shade);padding:1px 5px;border-radius:2px;font-size:12px}

.empty{padding:56px 0 8px;border-top:1px solid var(--rule);margin-top:8px}
.empty h2{font-family:"Gowun Batang",serif;font-size:22px;margin:0 0 12px;font-weight:700}
.empty p{color:var(--muted);font-size:14px;margin:0;line-height:1.75}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px;
  position:sticky;top:0;background:var(--bg);z-index:5}
.back{background:none;border:0;padding:6px 8px 6px 0;color:var(--muted);font-size:14px}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pbar{height:2px;background:var(--shade);position:sticky;top:52px;z-index:5}
.pbar > i{display:block;height:100%;background:var(--accent);transition:width .25s ease}

.tag{font-size:12px;color:var(--muted);margin:28px 0 12px}
.stem{font-family:"Gowun Batang",serif;font-size:20px;line-height:1.62;font-weight:700;
  margin:0 0 26px;word-break:keep-all;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;padding:14px 15px;min-height:58px;
  background:var(--surface);border:1px solid var(--rule);border-radius:2px;text-align:left;
  line-height:1.55;word-break:keep-all;transition:border-color .15s ease, background .15s ease}
.opt:hover{border-color:var(--accent)}
.opt .mark{font-variant-numeric:tabular-nums;color:var(--muted);flex:none;font-size:14px;padding-top:1px}
.opt.picked-ok{background:var(--okbg);border-color:var(--ok)}
.opt.picked-ok .mark{color:var(--ok)}
.opt.picked-no{background:var(--nobg);border-color:var(--no)}
.opt.picked-no .mark{color:var(--no)}
.opt.reveal{border-color:var(--ok)}
.opt.reveal .mark{color:var(--ok)}
.opt.dim{opacity:.5}
.opts.done .opt{pointer-events:none}

.verdict{margin:24px 0 0;padding-top:20px;border-top:1px solid var(--rule)}
.verdict h4{margin:0 0 8px;font-size:14px;font-weight:600}
.verdict h4.o{color:var(--ok)}
.verdict h4.x{color:var(--no)}
.verdict p{margin:0;font-size:14.5px;line-height:1.72;word-break:keep-all;white-space:pre-wrap}

.calcbtn{background:none;border:1px solid var(--rule);border-radius:2px;color:var(--muted);
  font-size:12.5px;padding:5px 10px;margin-left:8px}
.calcbtn.on{border-color:var(--accent);color:var(--accent)}
#calc{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--rule);padding:12px 20px}
#calc .inner{max-width:620px;margin:0 auto}
#calc .disp{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:24px;text-align:right;
  padding:10px 12px;background:var(--bg);border:1px solid var(--rule);border-radius:2px;
  overflow-x:auto;white-space:nowrap;font-variant-numeric:tabular-nums}
#calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}
#calc .keys button{min-height:46px;font-size:17px;background:var(--bg);border:1px solid var(--rule);
  border-radius:2px;color:var(--ink);font-variant-numeric:tabular-nums}
#calc .keys button.op{color:var(--accent);font-weight:600}
#calc .keys button.eq{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:600}
.dock{flex:0 0 auto;background:var(--bg);border-top:1px solid var(--rule);
  padding:12px 20px calc(12px + env(safe-area-inset-bottom))}
.dock .inner{max-width:620px;margin:0 auto}

.score{padding:48px 0 8px}
.score .num{font-family:"Gowun Batang",serif;font-size:78px;line-height:1;font-weight:700;
  font-variant-numeric:tabular-nums;color:var(--accent)}
.score .of{font-family:"Gowun Batang",serif;font-size:22px;color:var(--muted)}
.score .lab{font-size:13px;color:var(--muted);margin-top:14px}
.misslist{margin-top:26px;border-top:1px solid var(--rule)}
.miss{padding:14px 2px;border-bottom:1px solid var(--rule)}
.miss .mtag{font-size:12px;color:var(--muted)}
.miss .mq{font-family:"Gowun Batang",serif;font-size:15.5px;margin-top:5px;word-break:keep-all}

.note-body{padding:6px 0 20px}
.note-body h3{font-family:"Gowun Batang",serif;font-size:20px;font-weight:700;margin:30px 0 10px;word-break:keep-all}
.note-body h3:first-child{margin-top:8px}
.note-body h4{font-size:15px;font-weight:600;margin:22px 0 8px;color:var(--accent)}
.note-body p{margin:0 0 13px;line-height:1.85;word-break:keep-all}
.note-body ul{margin:0 0 14px;padding-left:19px}
.note-body li{margin-bottom:7px;line-height:1.8;word-break:keep-all}
.note-body .term{border-left:2px solid var(--accent);padding:2px 0 2px 12px;margin:0 0 9px;
  font-size:14px;color:var(--muted);line-height:1.72;word-break:keep-all}
.note-body .term b{color:var(--ink);font-weight:600}
.note-body .call{background:var(--shade);padding:13px 15px;border-radius:2px;margin:0 0 15px;
  font-size:14.5px;line-height:1.8;word-break:keep-all}
.note-lead{font-size:13px;color:var(--muted);margin:0 0 4px}
.styletog{background:none;border:1px solid var(--rule);border-radius:2px;color:var(--muted);
  font-size:12.5px;padding:7px 12px;margin:4px 0 2px}
.styletog.on{border-color:var(--accent);color:var(--accent)}
textarea{width:100%;min-height:190px;background:var(--surface);color:var(--ink);
  border:1px solid var(--rule);border-radius:2px;padding:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12.5px;line-height:1.6;resize:vertical}
.msg{font-size:13.5px;margin-top:14px;padding:12px 14px;border-radius:2px;line-height:1.6}
.msg.ok{background:var(--okbg);color:var(--ok)}
.msg.no{background:var(--nobg);color:var(--no)}
.filebtn{display:block;width:100%;padding:17px 18px;border:1px solid var(--accent);background:none;
  color:var(--accent);border-radius:2px;font-weight:600;text-align:center}
input[type=file]{display:none}
.hidden{display:none}
</style>
</head>
<body>
<div id="shell">
  <div id="scroll"><div class="wrap" id="app"></div></div>
  <div id="calc" class="hidden"><div class="inner">
    <div class="disp" id="cdisp">0</div>
    <div class="keys">
      <button data-k="C">C</button><button data-k="DEL">←</button><button data-k="%" class="op">%</button><button data-k="/" class="op">÷</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="*" class="op">×</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="-" class="op">−</button>
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="+" class="op">+</button>
      <button data-k="0">0</button><button data-k="000">000</button><button data-k=".">.</button><button data-k="=" class="eq">=</button>
    </div>
  </div></div>
  <div class="dock hidden" id="dock"><div class="inner"><button class="btn" id="dockbtn"></button></div></div>
</div>

<script>
/* ======================= 저장소 ======================= */
var PK="drill.packs.v1", SK="drill.stats.v1";
var packs=[], stats={}, updated=0, db=null, tmr=null;

function refreshBuiltin(){
  // 내장 꾸러미는 파일에 들어 있으므로 항상 최신으로 덮어쓴다.
  // 사용자가 직접 넣은 꾸러미만 저장소에서 유지한다.
  if(typeof BUILTIN==="undefined"||!BUILTIN.length) return;
  var ids={};
  var fresh=[];
  BUILTIN.forEach(function(raw){
    try{ var p=normalize(raw,null); ids[p.id]=1; fresh.push(p); }catch(e){}
  });
  var mine=packs.filter(function(x){ return !ids[x.id]; });
  packs=fresh.concat(mine);
  writePacks();
}
function readLS(){
  try{ var p=localStorage.getItem(PK); if(p) packs=JSON.parse(p)||[]; }catch(e){packs=[];}
  try{ var s=localStorage.getItem(SK); if(s){var o=JSON.parse(s); stats=o.stats||{}; updated=o.updated||0;} }catch(e){}
}
function writePacks(){ try{localStorage.setItem(PK,JSON.stringify(packs));}catch(e){alert("저장 공간이 부족합니다. 사용하지 않는 꾸러미를 지워 주세요.");} }
function writeStats(){
  updated=Date.now();
  try{localStorage.setItem(SK,JSON.stringify({stats:stats,updated:updated}));}catch(e){}
  if(!db) return;
  clearTimeout(tmr);
  tmr=setTimeout(function(){
    try{ db.doc("progress/main").set({stats:stats,updated:updated}).catch(function(){}); }catch(e){}
  },900);
}
function syncPack(p){
  if(!db) return;
  try{ db.doc("packs/"+p.id).set({pack:p,at:Date.now()}).catch(function(){}); }catch(e){}
}
function initSync(){
  if(!window.claude||!claude.use) return;
  claude.use("db").then(function(d){
    if(!d) return; db=d;
    db.doc("progress/main").get().then(function(s){
      if(s&&s.exists){ var v=s.data();
        if(v&&v.stats&&(v.updated||0)>updated){ stats=v.stats; updated=v.updated;
          try{localStorage.setItem(SK,JSON.stringify({stats:stats,updated:updated}));}catch(e){}
          if(view==="shelf") shelf();
        } }
    }).catch(function(){});
    db.collection("packs").get().then(function(qs){
      var added=false;
      qs.docs.forEach(function(doc){
        var v=doc.data(); if(!v||!v.pack) return;
        if(!packs.some(function(p){return p.id===v.pack.id;})){ packs.push(v.pack); added=true; }
      });
      if(added){ writePacks(); if(view==="shelf") shelf(); }
    }).catch(function(){});
  }).catch(function(){});
}

/* ======================= 꾸러미 처리 ======================= */
function hash(s){
  var h=5381,i=0; for(;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0;}
  return (h>>>0).toString(36);
}
function normalize(raw,fallbackName){
  var meta={}, list=null;
  if(Array.isArray(raw)) list=raw;
  else if(raw&&Array.isArray(raw.questions)){ list=raw.questions; meta=raw; }
  else throw new Error("questions 배열을 찾을 수 없습니다.");

  var name=(meta.name||fallbackName||"이름 없는 꾸러미").toString().trim();
  var id=(meta.id||"p_"+hash(name)).toString().replace(/[^A-Za-z0-9_.~:@+-]/g,"_").slice(0,120);

  var qs=[];
  list.forEach(function(q,i){
    if(!q||typeof q.q!=="string") return;
    if(!Array.isArray(q.o)||q.o.length<2) return;
    var a=q.a;
    if(typeof a!=="number"||a<0||a>=q.o.length) return;
    qs.push({
      id:id+":"+hash(q.q),
      sub:(q.sub||meta.name||"전체").toString(),
      q:q.q, o:q.o.map(String), a:a, e:(q.e||"").toString()
    });
  });
  if(!qs.length) throw new Error("유효한 문항이 없습니다. q, o, a 항목을 확인해 주세요.");

  var notes=[];
  if(Array.isArray(meta.notes)){
    meta.notes.forEach(function(n){
      if(!n||typeof n.title!=="string"||typeof n.body!=="string") return;
      var lk=[];
      if(Array.isArray(n.links)) n.links.forEach(function(l){
        if(l&&typeof l.url==="string"&&/^https?:\/\//.test(l.url)) lk.push({title:(l.title||l.url).toString(), url:l.url, note:(l.note||"").toString()});
      });
      notes.push({id:id+"#"+hash(n.title), title:n.title, sub:(n.sub||"").toString(), body:n.body, alt:(typeof n.alt==="string"?n.alt:null), links:lk});
    });
  }
  return {id:id,name:name,exam:meta.exam||null,note:meta.note||"",questions:qs,notes:notes};
}
function addPack(p){
  var at=-1;
  packs.forEach(function(x,i){ if(x.id===p.id) at=i; });
  if(at>=0) packs[at]=p; else packs.push(p);
  writePacks(); syncPack(p);
  return at>=0;
}

/* ======================= 통계 ======================= */
function st(id){ return stats[id]||{s:0,c:0,last:null}; }
function record(id,ok){
  var r=stats[id]||{s:0,c:0,last:null};
  r.s+=1; if(ok) r.c+=1; r.last=ok?"o":"x";
  stats[id]=r; writeStats();
}
function packStat(p){
  var seen=0,att=0,corr=0;
  p.questions.forEach(function(q){var r=st(q.id); if(r.s>0){seen++;att+=r.s;corr+=r.c;}});
  return {total:p.questions.length,seen:seen,pct:att?Math.round(corr/att*100):null};
}
function subStat(p,sub){
  var qs=p.questions.filter(function(q){return q.sub===sub;});
  var seen=0,att=0,corr=0;
  qs.forEach(function(q){var r=st(q.id); if(r.s>0){seen++;att+=r.s;corr+=r.c;}});
  return {total:qs.length,seen:seen,pct:att?Math.round(corr/att*100):null};
}
function subsOf(p){
  var out=[],seen={};
  p.questions.forEach(function(q){ if(!seen[q.sub]){seen[q.sub]=1;out.push(q.sub);} });
  (p.notes||[]).forEach(function(n){ if(n.sub&&!seen[n.sub]){seen[n.sub]=1;out.push(n.sub);} });
  return out;
}
function notesOf(p,sub){
  return (p.notes||[]).filter(function(n){ return (n.sub||"")===sub; });
}
function qsOf(p,sub){
  return p.questions.filter(function(q){ return q.sub===sub; });
}
function dday(iso){
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||""));
  if(!m) return null;
  var d=new Date(+m[1],+m[2]-1,+m[3]);
  var t=new Date(); t.setHours(0,0,0,0);
  return Math.max(0,Math.round((d-t)/86400000));
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pickDaily(p,n){
  var w=shuffle(p.questions.filter(function(q){return st(q.id).last==="x";}));
  var f=shuffle(p.questions.filter(function(q){return st(q.id).s===0;}));
  var r=shuffle(p.questions.filter(function(q){var x=st(q.id);return x.s>0&&x.last!=="x";}));
  return w.concat(f,r).slice(0,n);
}

/* ======================= 렌더 ======================= */
var app=document.getElementById("app"), dock=document.getElementById("dock"), dockbtn=document.getElementById("dockbtn");
var view="shelf", cur=null, curSub=null, session=[], idx=0, answered=false, hits=0, misses=[], curOrder=null;
var calcExpr="0";
function calcRender(){ var d=document.getElementById("cdisp"); if(d) d.textContent=calcExpr; }
function calcKey(k){
  try{
    if(k==="C"){ calcExpr="0"; }
    else if(k==="DEL"){ calcExpr=calcExpr.length>1?calcExpr.slice(0,-1):"0"; }
    else if(k==="="){
      var e=calcExpr.replace(/%/g,"/100");
      if(!/^[0-9+\-*/().\s]+$/.test(e)) return;
      var v=Function('"use strict";return ('+e+')')();
      if(typeof v==="number"&&isFinite(v)){
        calcExpr=String(Math.round(v*1e8)/1e8);
      }
    }
    else{
      if(calcExpr==="0"&&/[0-9.]/.test(k)) calcExpr=(k==="000"?"0":k);
      else calcExpr+=k;
    }
  }catch(e){ calcExpr="0"; }
  calcRender();
}
function calcToggle(force){
  var el=document.getElementById("calc");
  if(!el) return;
  var show=(typeof force==="boolean")?force:el.classList.contains("hidden");
  if(show){ el.classList.remove("hidden"); } else { el.classList.add("hidden"); }
  var b=document.getElementById("calcbtn");
  if(b){ if(show) b.classList.add("on"); else b.classList.remove("on"); }
}
function toTop(){ var el=document.getElementById("scroll"); if(el){el.scrollTop=0;} else {toTop();} }
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function setDock(l,fn){ if(!l){dock.classList.add("hidden");dockbtn.onclick=null;return;} dock.classList.remove("hidden"); dockbtn.textContent=l; dockbtn.onclick=fn; }

function shelf(){
  view="shelf"; calcToggle(false); cur=null; setDock(null); toTop();
  var h='<div class="masthead"><h1>문제 드릴</h1><p>문제와 개념 정리</p></div>';
  if(!packs.length){
    h+='<div class="empty"><h2>아직 꾸러미가 없습니다</h2>'+
       '<p>JSON 파일을 불러오면 여기에 쌓입니다. 시험별로 하나씩 두고 필요할 때 골라 푸세요.</p></div>';

      '</div>';
    });

function importView(){
  view="import"; setDock(null); toTop();
  app.innerHTML=
    '<div class="topbar"><button class="back" id="bk">← 보관함</button></div>'+
    '<div class="masthead" style="padding-top:12px"><h1>꾸러미 추가</h1>'+
    '<p>JSON 파일을 고르거나 내용을 그대로 붙여 넣으세요</p></div>'+
    '<div class="actions" style="margin-top:26px">'+
      '<label class="filebtn" for="fp">파일에서 불러오기</label>'+
      '<input type="file" id="fp" accept=".json,application/json,text/plain" multiple>'+
    '</div>'+
    '<div class="sectitle" style="margin-top:8px">붙여넣기</div>'+
    '<textarea id="ta" placeholder="여기에 JSON을 붙여 넣으세요" spellcheck="false"></textarea>'+
    '<div class="actions" style="margin-top:12px"><button class="btn ghost" id="paste">붙여넣은 내용 추가</button></div>'+
    '<div id="msg"></div>'+
    '<p class="note">형식은 <code>{"name":"...","questions":[{"sub":"...","q":"...","o":["","","",""],"a":0,"e":"..."}]}</code> 입니다. '+
    '<code>a</code>는 정답 선택지의 번호이며 0부터 셉니다. <code>exam</code>에 <code>"2026-10-18"</code>처럼 날짜를 넣으면 남은 일수가 표시됩니다. '+
    '같은 <code>id</code>로 다시 넣으면 덮어씁니다.</p>';
  document.getElementById("bk").onclick=shelf;

  function report(results){
    var okList=results.filter(function(r){return r.ok;});
    var bad=results.filter(function(r){return !r.ok;});
    var h="";
    if(okList.length) h+='<div class="msg ok">'+okList.map(function(r){return esc(r.name)+" · "+r.n+"문항 "+(r.replaced?"교체됨":"추가됨");}).join("<br>")+'</div>';
    if(bad.length) h+='<div class="msg no">'+bad.map(function(r){return esc(r.name)+" · "+esc(r.err);}).join("<br>")+'</div>';
    document.getElementById("msg").innerHTML=h;
    if(okList.length) setDock("보관함으로",shelf);
  }
  function take(text,fname){
    try{
      var p=normalize(JSON.parse(text),fname);
      var replaced=addPack(p);
      return {ok:true,name:p.name,n:p.questions.length,replaced:replaced};
    }catch(e){
      return {ok:false,name:fname||"붙여넣은 내용",err:e.message||"형식을 읽을 수 없습니다."};
    }
  }
  document.getElementById("fp").onchange=function(ev){
    var files=Array.prototype.slice.call(ev.target.files||[]);
    if(!files.length) return;
    var out=[],done=0;
    files.forEach(function(f){
      var rd=new FileReader();
      rd.onload=function(){ out.push(take(String(rd.result),f.name.replace(/\.json$/i,""))); if(++done===files.length) report(out); };
      rd.onerror=function(){ out.push({ok:false,name:f.name,err:"파일을 읽지 못했습니다."}); if(++done===files.length) report(out); };
      rd.readAsText(f,"utf-8");
    });
  };
  document.getElementById("paste").onclick=function(){
    var t=document.getElementById("ta").value.trim();
    if(!t){ document.getElementById("msg").innerHTML='<div class="msg no">붙여 넣은 내용이 없습니다.</div>'; return; }
    report([take(t,null)]);
  };
}

function pickDailySub(qs,n){
  var w=shuffle(qs.filter(function(q){return st(q.id).last==="x";}));
  var f=shuffle(qs.filter(function(q){return st(q.id).s===0;}));
  var r=shuffle(qs.filter(function(q){var x=st(q.id);return x.s>0&&x.last!=="x";}));
  return w.concat(f,r).slice(0,n);
}

function mdNote(src){
  var out="", ul=false;
  esc(src).split("\n").forEach(function(ln){
    var t=ln.replace(/\s+$/,"");
    function closeUl(){ if(ul){ out+="</ul>"; ul=false; } }
    if(!t){ closeUl(); return; }
    if(t.indexOf("## ")===0){ closeUl(); out+="<h3>"+t.slice(3)+"</h3>"; }
    else if(t.indexOf("### ")===0){ closeUl(); out+="<h4>"+t.slice(4)+"</h4>"; }
    else if(t.indexOf("- ")===0){ if(!ul){out+="<ul>";ul=true;} out+="<li>"+t.slice(2)+"</li>"; }
    else if(t.indexOf("&gt; ")===0){ closeUl(); out+='<p class="call">'+t.slice(5)+"</p>"; }
    else if(t.indexOf("▸ ")===0){
      closeUl();
      var b=t.slice(2), k=b.indexOf(":");
      out+='<p class="term">'+(k>0?"<b>"+b.slice(0,k)+"</b>"+b.slice(k):b)+"</p>";
    }
    else { closeUl(); out+="<p>"+t+"</p>"; }
  });
  if(ul) out+="</ul>";
  return out;
}

function reads(id){
  try{ return parseInt(localStorage.getItem("reads:"+id)||"0",10)||0; }catch(e){ return 0; }
}
function bumpRead(id){
  try{ localStorage.setItem("reads:"+id, String(reads(id)+1)); }catch(e){}
}
function noteStyle(){
  try{ return localStorage.getItem("notestyle")==="casual"?"casual":"plain"; }catch(e){ return "plain"; }
}
function renderNote(sub,k){ calcToggle(false);
  if(!cur){shelf();return;}
  var list=notesOf(cur,sub); var n=list[k];
  if(!n){ openSubject(sub); return; }
  curSub=sub;
  view="note"; setDock(null); toTop();
  var rc=reads(n.id);
  var casual=(noteStyle()==="casual" && n.alt);
  var body=casual?n.alt:n.body;
  var h='<div class="topbar"><button class="back" id="bk">← '+esc(sub)+'</button>'+
      '<span class="count">'+(k+1)+' / '+list.length+(rc?' · '+rc+'회독':'')+'</span></div>'+
      (n.alt?'<button class="styletog'+(casual?" on":"")+'" id="tog">'+(casual?"편하게 읽는 중 · 정석으로 바꾸기":"정석으로 읽는 중 · 편하게 바꾸기")+'</button>':'')+
      '<div class="note-body">'+mdNote(body)+'</div>'+
      ((n.links&&n.links.length)?('<div class="sectitle">참고 강의</div>'+
        n.links.map(function(l){
          return '<a class="row" href="'+esc(l.url)+'" target="_blank" rel="noopener noreferrer" style="text-decoration:none;color:inherit">'+
            '<span style="flex:1"><span class="rname">'+esc(l.title)+'</span>'+
            (l.note?'<span class="rsub">'+esc(l.note)+'</span>':'')+'</span>'+
            '<span class="rnum">열기 ↗</span></a>';
        }).join('')):'');
  app.innerHTML=h;
  document.getElementById("bk").onclick=function(){openSubject(sub);};
  var tg=document.getElementById("tog");
  if(tg) tg.onclick=function(){
    try{ localStorage.setItem("notestyle", casual?"plain":"casual"); }catch(e){}
    renderNote(sub,k);
  };
  var last=(k===list.length-1);
  setDock(last?"다 읽음 · 목록으로":"다 읽음 · 다음 정리",function(){
    bumpRead(n.id);
    if(last) openSubject(sub); else renderNote(sub,k+1);
  });
}

function start(list){ if(!list.length){ if(curSub) openSubject(curSub); else openPack(cur.id); return; } session=list; idx=0; hits=0; misses=[]; renderQ(); }

function renderQ(){
  view="quiz"; toTop();
  var q=session[idx]; answered=false;
  var marks=["①","②","③","④","⑤","⑥"];
  var h='<div class="topbar"><button class="back" id="bk">← 나가기</button>'+
        '<span><span class="count">'+(idx+1)+' / '+session.length+'</span>'+
        '<button class="calcbtn" id="calcbtn">계산기</button></span></div>'+
        '<div class="pbar"><i style="width:'+Math.round(idx/session.length*100)+'%"></i></div>'+
        '<div class="tag">'+esc(q.sub)+'</div>'+
        '<p class="stem">'+esc(q.q)+'</p><div class="opts" id="opts">';
  curOrder=shuffle(q.o.map(function(_,i){return i;}));
  curOrder.forEach(function(real,disp){
    h+='<button class="opt" data-i="'+disp+'"><span class="mark">'+(marks[disp]||(disp+1))+'</span><span>'+esc(q.o[real])+'</span></button>';
  });
  h+='</div><div id="vd"></div>';
  app.innerHTML=h; setDock(null);
  document.getElementById("bk").onclick=function(){ calcToggle(false); if(curSub) openSubject(curSub); else openPack(cur.id); };
  var cb=document.getElementById("calcbtn");
  if(cb){ if(!document.getElementById("calc").classList.contains("hidden")) cb.classList.add("on");
          cb.onclick=function(){ calcToggle(); }; }
  Array.prototype.forEach.call(app.querySelectorAll(".opt"),function(b){
    b.onclick=function(){answer(parseInt(b.getAttribute("data-i"),10));};
  });
}

function answer(pick){
  if(answered) return; answered=true;
  var q=session[idx];
  var realPicked=(curOrder?curOrder[pick]:pick);
  var ok=(realPicked===q.a);
  var dispCorrect=(curOrder?curOrder.indexOf(q.a):q.a);
  if(ok) hits++; else misses.push(q);
  record(q.id,ok);
  var box=document.getElementById("opts"); box.classList.add("done");
  Array.prototype.forEach.call(box.querySelectorAll(".opt"),function(b){
    var i=parseInt(b.getAttribute("data-i"),10);
    if(i===pick) b.classList.add(ok?"picked-ok":"picked-no");
    else if(i===dispCorrect) b.classList.add("reveal");
    else b.classList.add("dim");
  });
  document.getElementById("vd").innerHTML=
    '<div class="verdict"><h4 class="'+(ok?"o":"x")+'">'+(ok?"정답입니다":"오답입니다 · 정답은 "+(["①","②","③","④","⑤","⑥"][dispCorrect]||(dispCorrect+1)))+'</h4>'+
    (q.e?'<p>'+esc(q.e)+'</p>':'')+'</div>';
  var last=(idx===session.length-1);
  setDock(last?"결과 보기":"다음 문제",function(){ if(last) renderResult(); else {idx++;renderQ();} });
}

function renderResult(){ calcToggle(false);
  view="result"; setDock(null); toTop();
  var h='<div class="score"><span class="num">'+hits+'</span><span class="of"> / '+session.length+'</span>'+
    '<div class="lab">'+(misses.length?"틀린 문제는 과목 화면에서 다시 풀 수 있습니다":"전부 맞혔습니다")+'</div></div>';
  if(misses.length){
    h+='<div class="misslist">';
    misses.forEach(function(q){ h+='<div class="miss"><div class="mtag">'+esc(q.sub)+'</div><div class="mq">'+esc(q.q)+'</div></div>'; });
    h+='</div>';
  }
  h+='<div class="actions"><button class="btn" id="bk2">돌아가기</button></div>';
  app.innerHTML=h;
  document.getElementById("bk2").onclick=function(){ if(curSub) openSubject(curSub); else openPack(cur.id); };
}

var BUILTIN = [{"id":"jcg-ict","name":"정보처리기사 (조폐공사 ICT)","exam":"2026-10-31","note":"한국조폐공사 필기 10.31(토) 서울 · 정보처리기사 수준 + NCS","notes":[{"sub":"1과목 소프트웨어 설계","title":"① 요구사항과 UML","body":"## 소프트웨어는 요구사항에서 시작합니다\n만들기 전에 **무엇을 만들지** 정해야 합니다. 이 단계가 요구사항 분석입니다.\n\n### 요구사항의 두 종류\n- **기능 요구사항**: 시스템이 **무엇을 하는가**. 로그인, 검색, 결제\n- **비기능 요구사항**: 시스템이 **어떻게 동작하는가**. 성능, 보안, 신뢰성, 사용성\n\n> 응답 속도 2초 이내, 동시 접속 1만 명 같은 조건은 비기능 요구사항입니다. 기능 자체가 아니라 품질 조건이기 때문입니다.\n\n### 요구사항 개발 절차\n> **도출 → 분석 → 명세 → 확인(검증)**\n\n순서가 시험에 나옵니다.\n\n## UML\n시스템을 그림으로 표현하는 **표준 모델링 언어**입니다.\n\n### 구성요소\n- **사물(Things)**: 모델을 이루는 요소\n- **관계(Relationships)**: 사물 사이의 연결\n- **다이어그램(Diagram)**: 사물과 관계를 그림으로 표현\n\n### 다이어그램 분류 (핵심)\n**구조 다이어그램** (정적, 무엇이 있는가)\n- 클래스, 객체, 컴포넌트, 배치, 패키지, 복합구조\n\n**행위 다이어그램** (동적, 어떻게 움직이는가)\n- **유스케이스**, **시퀀스**, 커뮤니케이션, **상태**, **활동**, 타이밍\n\n> 어느 쪽인지 구분하는 문제가 자주 나옵니다. **시간 흐름이나 동작이 보이면 행위, 구조만 보이면 구조**입니다.\n\n### 자주 나오는 다이어그램\n- **유스케이스**: 사용자 관점에서 시스템이 제공하는 기능. 액터와 유스케이스로 구성\n- **클래스**: 클래스와 속성, 메서드, 관계\n- **시퀀스**: 객체 사이 메시지를 **시간 순서**로 표현\n\n### 관계의 종류\n- **연관**: 서로 관련 있음\n- **집합(Aggregation)**: 전체와 부분, 부분이 독립적으로 존재 가능\n- **포함(Composition)**: 전체와 부분, 전체가 사라지면 부분도 사라짐\n- **일반화**: 상속 관계 (is-a)\n- **의존**: 잠깐 사용하는 관계\n- **실체화**: 인터페이스를 구현\n\n▸ 액터: 시스템과 상호작용하는 외부 존재. 사람일 수도 다른 시스템일 수도 있음.\n▸ 정적 모델: 시간과 무관한 구조.\n▸ 동적 모델: 시간에 따른 동작.","alt":"## 소프트웨어는 \"뭘 만들래?\"부터\n만들기 전에 **뭘 만들지** 정해야 함. 이게 요구사항 분석.\n\n### 요구사항 2종 ⭐\n- **기능**: 시스템이 **뭘 하냐**. 로그인, 검색, 결제\n- **비기능**: **어떻게 동작하냐**. 성능, 보안, 신뢰성\n\n> 🚨 \"응답속도 2초 이내\" → 이거 **비기능**임.\n> 기능 자체가 아니라 품질 조건이니까. 헷갈리게 냄.\n\n### 요구사항 개발 순서\n> **도출 → 분석 → 명세 → 확인**\n\n순서 그대로 나옴. \"도분명확\"으로 외우셈.\n\n## UML = 그림으로 설계하는 표준 언어\n\n### 구성요소 3개\n**사물 / 관계 / 다이어그램**\n\n### 다이어그램 분류 ⭐⭐ (제일 자주 나옴)\n**구조 다이어그램** (뭐가 있냐, 정적)\n→ 클래스, 객체, 컴포넌트, 배치, 패키지, 복합구조\n\n**행위 다이어그램** (어떻게 움직이냐, 동적)\n→ **유스케이스, 시퀀스**, 커뮤니케이션, **상태, 활동**, 타이밍\n\n> 🚨 구분법: **시간 흐름·동작이 보이면 행위, 구조만 보이면 구조.**\n> 유스케이스를 구조로 착각하는 사람 많은데 **행위**임.\n\n### 자주 나오는 3개\n- **유스케이스**: 사용자 입장에서 뭘 할 수 있냐. 액터 + 유스케이스\n- **클래스**: 클래스, 속성, 메서드, 관계\n- **시퀀스**: 객체끼리 메시지를 **시간 순서대로**\n\n### 관계 종류 ⭐\n- **연관**: 그냥 관련 있음\n- **집합**: 전체-부분인데 **부분이 혼자 살 수 있음** (컴퓨터-마우스)\n- **포함**: 전체-부분인데 **전체 죽으면 부분도 죽음** (집-방)\n- **일반화**: 상속 (is-a)\n- **의존**: 잠깐 빌려 씀\n- **실체화**: 인터페이스 구현\n\n> 🚨 집합 vs 포함이 제일 헷갈림.\n> 컴퓨터 버려도 마우스는 딴 데 꽂아 쓸 수 있음 → **집합**\n> 집 부수면 방도 같이 사라짐 → **포함**\n\n▸ 액터: 시스템 밖에서 시스템이랑 상호작용하는 놈. 사람 또는 다른 시스템."},{"sub":"1과목 소프트웨어 설계","title":"② 설계 원칙과 디자인 패턴","body":"## 좋은 설계의 기준\n> **결합도는 낮게, 응집도는 높게**\n\n모듈끼리는 느슨하게 연결되고, 모듈 안은 한 가지 일에 집중해야 합니다. 그래야 하나를 고쳐도 다른 곳이 안 깨집니다.\n\n### 결합도 (낮을수록 좋음)\n> **자료 < 스탬프 < 제어 < 외부 < 공통 < 내용**\n\n- **자료**: 값만 주고받음. 가장 좋음\n- **스탬프**: 자료구조를 통째로 넘김\n- **제어**: 상대의 동작을 제어하는 신호를 넘김\n- **외부**: 외부에 선언된 데이터를 참조\n- **공통**: 전역변수를 함께 사용\n- **내용**: 상대 모듈 내부를 직접 참조. 가장 나쁨\n\n### 응집도 (높을수록 좋음)\n> **기능 > 순차 > 교환(통신) > 절차 > 시간 > 논리 > 우연**\n\n- **기능**: 하나의 기능만 수행. 가장 좋음\n- **우연**: 아무 관련 없는 것들이 모여 있음. 가장 나쁨\n\n> 순서를 통째로 외워야 합니다. 거의 매 회 나옵니다.\n\n## 객체지향 설계 원칙 SOLID\n- **S** 단일 책임: 클래스는 하나의 책임만\n- **O** 개방-폐쇄: 확장에는 열려 있고 수정에는 닫혀 있어야\n- **L** 리스코프 치환: 자식 클래스는 부모 클래스를 대체할 수 있어야\n- **I** 인터페이스 분리: 쓰지 않는 메서드에 의존하지 않게\n- **D** 의존 역전: 구체적인 것이 아니라 추상적인 것에 의존\n\n## 디자인 패턴 (GoF)\n자주 나오는 설계 문제의 해법을 정리해둔 것입니다.\n\n### 생성 패턴 (객체를 어떻게 만드나)\n- **싱글톤**: 인스턴스를 하나만 만듦\n- **팩토리 메서드**: 객체 생성을 하위 클래스에 맡김\n- 추상 팩토리, 빌더, 프로토타입\n\n### 구조 패턴 (어떻게 조합하나)\n- **어댑터**: 호환 안 되는 인터페이스를 연결\n- **프록시**: 대리자를 두어 접근 제어\n- 브리지, 컴포지트, 데코레이터, 퍼사드, 플라이웨이트\n\n### 행위 패턴 (어떻게 소통하나)\n- **옵저버**: 한 객체가 변하면 구독자에게 알림\n- **전략**: 알고리즘을 바꿔 끼울 수 있게\n- 템플릿 메서드, 커맨드, 이터레이터, 상태, 방문자, 중재자, 메멘토, 책임 연쇄, 인터프리터\n\n> 패턴이 어느 분류에 속하는지 묻는 문제가 나옵니다. **생성 5개**를 먼저 외우세요. 싱글톤, 팩토리 메서드, 추상 팩토리, 빌더, 프로토타입. 이게 나오면 생성이고 나머지는 구조나 행위입니다.\n\n▸ 모듈: 프로그램을 기능 단위로 나눈 조각.\n▸ 인스턴스: 클래스로 실제로 만들어낸 객체.\n▸ 전역변수: 프로그램 어디서든 접근할 수 있는 변수.","alt":"## 좋은 설계 한 줄\n> **결합도 ↓ 응집도 ↑**\n\n모듈끼리는 느슨하게, 모듈 안은 한 가지만.\n그래야 하나 고쳐도 딴 데가 안 터짐.\n\n### 결합도 (낮을수록 좋음) ⭐⭐\n> **자료 < 스탬프 < 제어 < 외부 < 공통 < 내용**\n\n> 🚨 외우는 법: **\"자스제외공내\"**\n> 자료가 제일 착하고 내용이 제일 나쁨.\n> **내용 결합** = 남의 모듈 속을 직접 뒤짐. 최악임.\n> **공통 결합** = 전역변수 같이 씀. 하나 바꾸면 다 터짐.\n\n### 응집도 (높을수록 좋음) ⭐⭐\n> **기능 > 순차 > 교환 > 절차 > 시간 > 논리 > 우연**\n\n> 🚨 외우는 법: **\"기순교절시논우\"**\n> 기능이 제일 좋고 우연이 제일 나쁨.\n> **우연 응집** = 아무 상관없는 게 한 모듈에 모여 있음. 잡동사니 서랍.\n\n**이 두 순서는 거의 매 회 나옴. 무조건 외우셈.**\n\n## SOLID\n- **S** 단일 책임: 한 클래스 = 한 가지 일\n- **O** 개방-폐쇄: 확장 OK, 수정 NO\n- **L** 리스코프 치환: 자식이 부모 자리에 들어가도 멀쩡해야\n- **I** 인터페이스 분리: 안 쓰는 기능에 묶이지 마\n- **D** 의존 역전: 구체적인 거 말고 추상적인 거에 기대\n\n## 디자인 패턴 (GoF)\n자주 나오는 문제의 모범답안 모음.\n\n### 생성 패턴 (객체 만드는 법) ⭐\n> 🚨 **이 5개만 외우셈: 싱글톤, 팩토리 메서드, 추상 팩토리, 빌더, 프로토타입**\n> 이게 나오면 생성. 나머지는 구조 아니면 행위.\n\n- **싱글톤**: 인스턴스 딱 하나만. (설정 관리자 같은 거)\n- **팩토리 메서드**: 객체 만드는 걸 자식한테 떠넘김\n\n### 구조 패턴 (조립하는 법)\n- **어댑터**: 안 맞는 걸 연결. 110V 돼지코 생각하셈\n- **프록시**: 대리인 세워서 접근 통제\n- 브리지, 컴포지트, 데코레이터, 퍼사드, 플라이웨이트\n\n### 행위 패턴 (소통하는 법)\n- **옵저버**: 하나 바뀌면 구독자한테 알림. 유튜브 구독 알림\n- **전략**: 알고리즘 갈아끼우기\n- 템플릿 메서드, 커맨드, 이터레이터, 상태, 방문자, 중재자, 메멘토 등\n\n> 전략 짜는 요령: 생성 5개 확실히 → 구조는 \"어브컴데퍼플프\" → 나머지는 행위.\n\n▸ 인스턴스: 클래스로 실제로 찍어낸 객체."},{"sub":"2과목 소프트웨어 개발","title":"③ 자료구조와 정렬","body":"## 선형 자료구조\n### 스택 (Stack)\n> **LIFO: 나중에 들어간 것이 먼저 나옴**\n접시를 쌓는 것과 같습니다. 맨 위에 올린 걸 먼저 꺼냅니다.\n- 연산: push(넣기), pop(꺼내기)\n- 활용: 함수 호출, 되돌리기, 수식 계산, 괄호 검사\n\n### 큐 (Queue)\n> **FIFO: 먼저 들어간 것이 먼저 나옴**\n줄 서기와 같습니다.\n- 연산: enqueue(넣기), dequeue(꺼내기)\n- 활용: 작업 대기열, 프린터 스풀, 운영체제 스케줄링\n\n### 데크 (Deque)\n양쪽 끝에서 넣고 뺄 수 있습니다.\n\n## 비선형 자료구조\n### 트리\n계층 구조입니다. 사이클이 없습니다.\n- **루트**: 맨 위 노드\n- **단말 노드(리프)**: 자식이 없는 노드\n- **차수**: 한 노드의 자식 수\n\n### 트리 순회 (자주 나옴)\n- **전위(Preorder)**: 루트 → 왼쪽 → 오른쪽\n- **중위(Inorder)**: 왼쪽 → 루트 → 오른쪽\n- **후위(Postorder)**: 왼쪽 → 오른쪽 → 루트\n\n> 이름이 **루트를 언제 방문하느냐**를 뜻합니다. 전위는 먼저, 중위는 중간, 후위는 나중.\n\n### 그래프\n정점과 간선으로 이루어지며 사이클이 있을 수 있습니다.\n- 방향 그래프, 무방향 그래프\n- 탐색: **DFS(깊이 우선, 스택)**, **BFS(너비 우선, 큐)**\n\n## 정렬 알고리즘\n| 정렬 | 평균 | 최악 |\n|---|---|---|\n| 버블 | O(n²) | O(n²) |\n| 선택 | O(n²) | O(n²) |\n| 삽입 | O(n²) | O(n²) |\n| **퀵** | **O(n log n)** | **O(n²)** |\n| 합병(병합) | O(n log n) | O(n log n) |\n| 힙 | O(n log n) | O(n log n) |\n\n> **퀵 정렬은 평균은 빠르지만 최악은 O(n²)**입니다. 이게 함정으로 나옵니다.\n> 합병과 힙은 최악에도 O(n log n)을 보장합니다.\n\n### 각 정렬의 원리\n- **버블**: 인접한 두 개를 비교해 자리 바꿈\n- **선택**: 가장 작은 것을 골라 앞으로\n- **삽입**: 이미 정렬된 부분에 끼워 넣음\n- **퀵**: 기준값(피벗)을 정해 작은 것과 큰 것으로 나눔\n- **합병**: 반으로 쪼갠 뒤 합치면서 정렬\n\n▸ 시간복잡도: 입력 크기에 따라 실행 시간이 얼마나 늘어나는지.\n▸ 피벗: 퀵 정렬에서 나누는 기준이 되는 값.\n▸ 노드: 자료구조를 이루는 하나하나의 원소.","alt":"## 스택 vs 큐 ⭐⭐\n### 스택 = LIFO (나중에 넣은 게 먼저 나옴)\n> 접시 쌓기. 맨 위에 올린 거 먼저 꺼냄.\n- push(넣기) / pop(꺼내기)\n- 쓰는 곳: 함수 호출, **Ctrl+Z**, 괄호 검사\n\n### 큐 = FIFO (먼저 넣은 게 먼저 나옴)\n> 편의점 줄. 먼저 선 사람이 먼저 계산.\n- enqueue / dequeue\n- 쓰는 곳: 프린터 대기열, 작업 스케줄링\n\n> 🚨 LIFO가 스택, FIFO가 큐. 이거 바꿔서 냄.\n> **L**ast **I**n **F**irst **O**ut = 나중에 들어온 놈이 먼저 나감 = 스택\n\n### 데크\n양쪽 끝으로 다 넣고 뺄 수 있음.\n\n## 트리\n계층 구조. 사이클 없음. 조직도 생각하셈.\n- 루트: 맨 위\n- 리프(단말): 자식 없는 놈\n- 차수: 자식 몇 개냐\n\n### 트리 순회 ⭐⭐ (계산 문제 나옴)\n- **전위**: **루트** → 왼 → 오\n- **중위**: 왼 → **루트** → 오\n- **후위**: 왼 → 오 → **루트**\n\n> 🚨 외우는 법: 이름 = **루트를 언제 찍냐**\n> 전위 = 루트 **먼저** / 중위 = 루트 **중간** / 후위 = 루트 **마지막**\n> 왼쪽이 항상 오른쪽보다 먼저라는 건 공통임.\n\n## 그래프\n정점 + 간선. 사이클 있어도 됨.\n- **DFS(깊이 우선) → 스택 사용**\n- **BFS(너비 우선) → 큐 사용**\n\n> 🚨 DFS는 한 방향으로 끝까지 파고듦 → 돌아올 때 스택\n> BFS는 가까운 것부터 넓게 → 줄 세우기 큐\n\n## 정렬 ⭐\n| 정렬 | 평균 | 최악 |\n|---|---|---|\n| 버블·선택·삽입 | n² | n² |\n| **퀵** | **n log n** | **n²** |\n| 합병·힙 | n log n | n log n |\n\n> 🚨 **퀵 정렬 함정**: 평균은 빠른데 **최악은 n²**임.\n> \"퀵은 항상 빠르다\" → 오답.\n> 합병이랑 힙은 **최악에도** n log n 보장.\n\n### 원리 한 줄씩\n- **버블**: 옆에 거랑 비교해서 바꿈\n- **선택**: 제일 작은 거 골라서 앞으로\n- **삽입**: 정렬된 데 끼워 넣음 (카드 정리)\n- **퀵**: 기준(피벗) 잡고 작은 거/큰 거로 나눔\n- **합병**: 반으로 쪼갠 뒤 합치면서 정렬\n\n▸ 시간복잡도: 데이터 늘면 시간이 얼마나 늘어나냐."},{"sub":"2과목 소프트웨어 개발","title":"④ 소프트웨어 테스트","body":"## 테스트의 원리\n- 테스트는 **결함이 있음을 보여줄 수는 있지만 없음을 증명할 수는 없다**\n- **완벽한 테스트는 불가능**하다\n- **결함 집중**: 결함의 대부분은 소수의 모듈에 몰려 있다 (파레토 법칙)\n- **살충제 패러독스**: 같은 테스트를 반복하면 새 결함을 못 찾는다\n- **오류-부재의 궤변**: 결함이 없어도 사용자 요구를 못 맞추면 쓸모없다\n\n## 블랙박스 vs 화이트박스 (핵심)\n### 블랙박스 테스트\n> **내부 구조를 모른 채 입력과 출력만 보고** 테스트\n기능 명세를 기준으로 합니다.\n- **동등 분할**: 입력을 유효·무효 그룹으로 나눠 대표값만 테스트\n- **경계값 분석**: 경계 근처에서 오류가 많으므로 경계값을 집중 테스트\n- **원인-결과 그래프**: 입력 조건과 출력의 관계를 그래프로\n- **오류 예측**: 경험으로 오류가 날 만한 곳을 테스트\n\n### 화이트박스 테스트\n> **내부 코드와 구조를 보면서** 테스트\n- **기초 경로 검사**: 모든 독립 경로를 한 번 이상 실행\n- **제어 구조 검사**: 조건 검사, 루프 검사, 데이터 흐름 검사\n\n> 구분법은 간단합니다. **코드를 보면 화이트박스, 안 보면 블랙박스.** 동등 분할과 경계값 분석이 어느 쪽인지 묻는 문제가 자주 나옵니다. 둘 다 블랙박스입니다.\n\n## 테스트 단계 (V모델)\n개발 단계와 테스트 단계가 짝을 이룹니다.\n> **단위 → 통합 → 시스템 → 인수**\n\n- **단위 테스트**: 모듈 하나를 개별로\n- **통합 테스트**: 모듈끼리 연결했을 때\n- **시스템 테스트**: 전체 시스템이 요구사항을 만족하는지\n- **인수 테스트**: 사용자가 최종 확인\n\n### 통합 테스트 방식\n- **하향식**: 위에서 아래로. 아직 없는 하위 모듈은 **스텁(Stub)**으로 대체\n- **상향식**: 아래에서 위로. 상위 모듈은 **드라이버(Driver)**로 대체\n\n> **하향식은 스텁, 상향식은 드라이버.** 이 짝이 시험에 거의 매번 나옵니다.\n\n### 인수 테스트\n- **알파 테스트**: **개발자 환경**에서 사용자가 테스트\n- **베타 테스트**: **사용자 환경**에서 사용자가 테스트\n\n▸ 결함: 소프트웨어가 기대대로 동작하지 않게 만드는 원인.\n▸ 스텁: 하위 모듈 대신 쓰는 임시 가짜 모듈.\n▸ 드라이버: 상위 모듈 대신 하위 모듈을 호출하는 임시 모듈.","alt":"## 테스트 원리 (외우셈)\n- 테스트는 **결함이 있음은 보여줘도 없음은 증명 못 함**\n- **완벽한 테스트는 불가능**\n- **결함 집중**: 버그는 소수 모듈에 몰려 있음 (파레토)\n- **살충제 패러독스**: 같은 테스트 반복하면 새 버그 못 찾음. 벌레가 내성 생기듯\n- **오류-부재의 궤변**: 버그 없어도 사용자가 원하는 게 아니면 쓰레기\n\n## 블랙박스 vs 화이트박스 ⭐⭐\n### 블랙박스 = 속은 안 보고 입출력만\n> 자판기에 돈 넣고 음료 나오는지만 봄. 안에 뭐가 돌아가는지 모름.\n- **동등 분할**: 입력을 그룹으로 나눠서 대표값만\n- **경계값 분석**: 경계에서 버그 많이 나니까 경계만 집중 (0, -1, 100, 101)\n- 원인-결과 그래프\n- 오류 예측\n\n### 화이트박스 = 코드 까보면서\n> 자판기 뜯어서 회로를 직접 봄.\n- **기초 경로 검사**: 모든 경로 한 번씩 다 돌려봄\n- 제어 구조 검사 (조건, 루프, 데이터 흐름)\n\n> 🚨 구분법 딱 하나: **코드 보면 화이트, 안 보면 블랙.**\n> **동등분할, 경계값 = 블랙박스.** 이거 화이트로 착각하게 냄.\n\n## 테스트 단계 (V모델) ⭐\n> **단위 → 통합 → 시스템 → 인수**\n- 단위: 모듈 하나\n- 통합: 모듈끼리 붙였을 때\n- 시스템: 전체가 요구사항 만족하나\n- 인수: 사용자가 최종 OK\n\n### 통합 테스트 방식 ⭐⭐\n- **하향식**: 위→아래. 아직 없는 아래 모듈은 **스텁**으로 땜빵\n- **상향식**: 아래→위. 위 모듈은 **드라이버**로 땜빵\n\n> 🚨 **하향식 = 스텁 / 상향식 = 드라이버.** 거의 매번 나옴.\n> 외우는 법: 위에서 내려오는데 아래가 없음 → 아래를 가짜로 채움 = **스텁**\n> 아래서 올라가는데 위가 없음 → 위에서 불러줄 놈이 필요 = **드라이버**\n\n### 인수 테스트\n- **알파**: **개발자 환경**에서 사용자가\n- **베타**: **사용자 환경**에서 사용자가\n\n> 🚨 둘 다 사용자가 하는데 **장소가 다름.** 게임 베타 테스트는 우리 집에서 하잖음. 그게 베타.\n\n▸ 스텁: 아래 모듈 대신 쓰는 가짜.\n▸ 드라이버: 위에서 불러주는 가짜."},{"sub":"3과목 데이터베이스 구축","title":"⑤ 데이터베이스와 키","body":"## 데이터베이스 기본 용어\n| 관계형 DB | 일상 용어 |\n|---|---|\n| 릴레이션 | 테이블 |\n| **튜플** | **행 (레코드)** |\n| **속성** | **열 (컬럼)** |\n| 도메인 | 속성이 가질 수 있는 값의 범위 |\n\n- **차수(Degree)**: 속성(열)의 개수\n- **카디널리티(Cardinality)**: 튜플(행)의 개수\n\n> 차수와 카디널리티를 바꿔서 내는 문제가 자주 나옵니다. **차수는 열, 카디널리티는 행**입니다.\n\n## 키의 종류 (핵심)\n- **슈퍼키**: 튜플을 유일하게 식별할 수 있는 속성의 집합. **유일성만** 만족\n- **후보키**: **유일성 + 최소성**을 모두 만족\n- **기본키**: 후보키 중 하나를 선택한 것. **NULL 불가, 중복 불가**\n- **대체키**: 후보키 중 기본키로 선택되지 않은 나머지\n- **외래키**: 다른 테이블의 기본키를 참조하는 속성\n\n> 유일성은 겹치지 않는 것, 최소성은 꼭 필요한 속성만 있는 것입니다.\n> 학번은 후보키입니다. 학번 + 이름은 슈퍼키이지만 이름이 없어도 식별되므로 최소성을 만족하지 않아 후보키는 아닙니다.\n\n## 무결성 제약조건\n- **개체 무결성**: 기본키는 **NULL이나 중복 값을 가질 수 없음**\n- **참조 무결성**: 외래키는 **참조하는 테이블의 기본키 값이거나 NULL**이어야 함\n- **도메인 무결성**: 속성 값은 정해진 도메인에 속해야 함\n\n## 트랜잭션과 ACID\n트랜잭션은 **한 번에 수행되어야 하는 작업의 논리적 단위**입니다. 계좌이체처럼 출금과 입금이 둘 다 되거나 둘 다 안 되어야 하는 작업입니다.\n\n- **A 원자성(Atomicity)**: 전부 실행되거나 전부 실행되지 않음\n- **C 일관성(Consistency)**: 실행 후에도 데이터가 일관된 상태\n- **I 격리성(Isolation)**: 동시에 실행되는 트랜잭션끼리 간섭하지 않음\n- **D 지속성(Durability)**: 완료된 결과는 영구히 반영\n\n### 관련 연산\n- **COMMIT**: 트랜잭션 결과를 확정\n- **ROLLBACK**: 트랜잭션을 취소하고 이전 상태로\n\n## 뷰(View)\n하나 이상의 테이블에서 유도된 **가상 테이블**입니다.\n- 보안: 필요한 데이터만 보여줌\n- 논리적 독립성 제공\n- **뷰 위에 또 뷰를 만들 수 있음**\n- 삽입·삭제·갱신에 제약이 있음\n- **ALTER로 정의를 변경할 수 없고** 삭제 후 다시 만들어야 함\n\n▸ NULL: 값이 없음. 0이나 공백과 다름.\n▸ 릴레이션 스키마: 테이블의 구조(속성 이름과 도메인).\n▸ 릴레이션 인스턴스: 실제로 들어 있는 데이터.","alt":"## 용어부터 ⭐\n| DB 용어 | 엑셀로 치면 |\n|---|---|\n| 릴레이션 | 표 전체 |\n| **튜플** | **가로줄 (행)** |\n| **속성** | **세로줄 (열)** |\n| 도메인 | 그 열에 들어갈 수 있는 값 범위 |\n\n- **차수** = **열** 개수\n- **카디널리티** = **행** 개수\n\n> 🚨 이 둘 바꿔서 진짜 자주 냄.\n> 외우는 법: **카디널리티 = 카운트(개수) = 데이터가 몇 줄이냐 = 행**\n\n## 키 5종 ⭐⭐\n- **슈퍼키**: 유일성**만** OK\n- **후보키**: 유일성 + **최소성** 둘 다\n- **기본키**: 후보키 중 뽑힌 놈. **NULL X, 중복 X**\n- **대체키**: 후보키 중 떨어진 놈들\n- **외래키**: 다른 테이블 기본키를 가리킴\n\n> 🚨 슈퍼키 vs 후보키가 핵심임.\n> 학번 → 혼자서 사람 구분됨 → **후보키**\n> 학번 + 이름 → 구분은 되는데 이름은 없어도 됨(군더더기) → **슈퍼키지만 후보키 아님**\n> 최소성 = \"하나라도 빼면 구분 안 되는 상태\"\n\n## 무결성 ⭐\n- **개체 무결성**: 기본키는 **NULL, 중복 불가**\n- **참조 무결성**: 외래키는 **참조하는 곳의 기본키 값이거나 NULL**\n- 도메인 무결성: 값이 정해진 범위 안에\n\n## 트랜잭션 ACID ⭐⭐\n계좌이체 생각하셈. 내 통장에서 빠졌는데 상대 통장에 안 들어가면 난리 나잖음.\n- **원자성**: 전부 되거나 전부 안 되거나. 반만 되는 거 없음\n- **일관성**: 끝나고도 데이터가 말이 되는 상태\n- **격리성**: 동시에 돌아가는 애들끼리 간섭 X\n- **지속성**: 끝난 건 영원히 남음. 서버 꺼져도\n\n> 🚨 설명 주고 ACID 중 뭐냐 고르는 문제 나옴.\n> \"전부 아니면 전무\" = 원자성 / \"간섭 없음\" = 격리성\n\n- **COMMIT**: 확정\n- **ROLLBACK**: 취소하고 되돌리기\n\n## 뷰(View)\n실제로 없는 **가상 테이블**. 필요한 것만 보여주는 창문.\n- 보안에 좋음\n- 뷰 위에 또 뷰 가능\n- 수정에 제약 있음\n- 🚨 **ALTER로 수정 불가.** 지우고 다시 만들어야 함. 이거 나옴.\n\n▸ NULL: 값이 없음. **0이랑 공백이랑 다름.**"},{"sub":"3과목 데이터베이스 구축","title":"⑥ 정규화와 이상현상","body":"## 왜 정규화를 하나\n테이블을 잘못 설계하면 데이터가 중복되고, 그 때문에 **이상현상**이 생깁니다.\n\n### 이상현상 세 가지\n- **삽입 이상**: 원하지 않는 데이터까지 함께 넣어야 하는 문제\n- **삭제 이상**: 지우려는 데이터 외에 필요한 데이터까지 함께 지워지는 문제\n- **갱신 이상**: 중복된 데이터 중 일부만 수정되어 불일치가 생기는 문제\n\n> 예를 들어 학생과 수강과목을 한 테이블에 두면, 수강신청을 안 한 학생은 등록할 수 없고(삽입 이상), 마지막 수강을 취소하면 학생 정보까지 사라집니다(삭제 이상).\n\n정규화는 **테이블을 쪼개서 이상현상을 없애는 과정**입니다.\n\n## 함수적 종속\nX 값이 정해지면 Y 값이 하나로 정해질 때 **Y는 X에 함수적으로 종속**된다고 하고 X → Y로 씁니다.\n> 학번 → 이름. 학번을 알면 이름이 정해집니다.\n\n## 정규형 단계 (핵심)\n> **1NF → 2NF → 3NF → BCNF → 4NF → 5NF**\n\n| 단계 | 조건 |\n|---|---|\n| **1NF** | 모든 속성 값이 **원자값** (더 쪼갤 수 없는 값) |\n| **2NF** | **부분 함수 종속 제거** |\n| **3NF** | **이행 함수 종속 제거** |\n| **BCNF** | **결정자가 모두 후보키** |\n| 4NF | 다치 종속 제거 |\n| 5NF | 조인 종속 제거 |\n\n> 외우는 문장이 있습니다. **\"도부이결다조\"** — 도메인 원자값, 부분 종속, 이행 종속, 결정자, 다치 종속, 조인 종속.\n\n### 부분 함수 종속\n기본키가 여러 속성으로 이루어졌을 때, **기본키의 일부에만 종속**되는 속성이 있는 것입니다.\n> 기본키가 (학번, 과목코드)인데 이름이 학번에만 종속되면 부분 종속입니다.\n\n### 이행 함수 종속\nX → Y이고 Y → Z일 때 **X → Z가 성립**하는 것입니다.\n> 학번 → 학과, 학과 → 학과장이면 학번 → 학과장은 이행 종속입니다.\n\n## 반정규화\n정규화로 쪼갠 테이블을 **성능을 위해 일부러 다시 합치거나 중복을 허용**하는 것입니다. 조회가 잦고 조인 비용이 클 때 씁니다.\n\n▸ 원자값: 더 이상 나눌 수 없는 하나의 값.\n▸ 결정자: 함수적 종속에서 다른 속성을 결정하는 쪽.\n▸ 조인: 여러 테이블을 연결해 조회하는 것.","alt":"## 왜 정규화?\n테이블 대충 만들면 데이터가 중복됨 → 그래서 **이상현상** 터짐.\n\n### 이상현상 3종 ⭐\n- **삽입 이상**: 넣고 싶은 거 넣으려는데 쓸데없는 것도 같이 넣어야 함\n- **삭제 이상**: 하나 지웠는데 필요한 것까지 같이 날아감\n- **갱신 이상**: 중복된 거 일부만 고쳐져서 데이터가 안 맞음\n\n> 학생 + 수강과목을 한 테이블에 때려넣음\n> → 수강 안 한 신입생은 등록 불가 (**삽입** 이상)\n> → 마지막 과목 취소하면 학생 정보까지 증발 (**삭제** 이상)\n> → 학과 바뀌었는데 몇 줄만 고침 (**갱신** 이상)\n\n정규화 = **테이블 쪼개서 이거 없애기.**\n\n## 함수적 종속\nX 정해지면 Y가 딱 하나로 정해짐 → **X → Y**\n> 학번 → 이름. 학번 알면 이름 나옴.\n\n## 정규형 단계 ⭐⭐⭐ (매번 나옴)\n| 단계 | 뭘 없애냐 |\n|---|---|\n| **1NF** | **원자값**으로 (한 칸에 값 하나만) |\n| **2NF** | **부분 함수 종속** 제거 |\n| **3NF** | **이행 함수 종속** 제거 |\n| **BCNF** | **결정자가 전부 후보키** |\n| 4NF | 다치 종속 제거 |\n| 5NF | 조인 종속 제거 |\n\n> 🚨 외우는 주문: **\"도부이결다조\"**\n> **도**메인 원자값 → **부**분 → **이**행 → **결**정자 → **다**치 → **조**인\n> 이것만 입에 붙이면 반은 먹고 들어감.\n\n### 부분 함수 종속\n기본키가 2개 이상 속성인데 **일부에만** 종속된 놈이 있음.\n> 기본키 (학번, 과목코드) / 이름은 학번만 알아도 나옴 → **부분 종속** → 2NF에서 제거\n\n### 이행 함수 종속\nX → Y, Y → Z 이면 X → Z (징검다리)\n> 학번 → 학과 → 학과장 이면 학번 → 학과장 → **이행 종속** → 3NF에서 제거\n\n## 반정규화\n쪼갠 걸 **성능 때문에 일부러 다시 합침.**\n> 너무 쪼개면 조회할 때마다 조인하느라 느려짐. 그래서 일부러 중복 허용.\n\n▸ 원자값: 더 못 쪼개는 값. \"010-1234, 010-5678\"을 한 칸에 넣으면 1NF 위반."},{"sub":"3과목 데이터베이스 구축","title":"⑦ SQL","body":"## SQL 명령어 분류 (핵심)\n| 분류 | 역할 | 명령어 |\n|---|---|---|\n| **DDL** (정의어) | 구조를 만들고 바꿈 | **CREATE, ALTER, DROP**, TRUNCATE |\n| **DML** (조작어) | 데이터를 다룸 | **SELECT, INSERT, UPDATE, DELETE** |\n| **DCL** (제어어) | 권한과 트랜잭션 | **GRANT, REVOKE**, COMMIT, ROLLBACK |\n\n> 어느 분류인지 묻는 문제가 매번 나옵니다. **구조는 DDL, 데이터는 DML, 권한은 DCL.**\n> COMMIT과 ROLLBACK은 TCL로 따로 분류하기도 합니다.\n\n## DROP, DELETE, TRUNCATE 차이\n- **DELETE**: 데이터만 삭제. 조건을 줄 수 있음. **ROLLBACK 가능** (DML)\n- **TRUNCATE**: 데이터를 전부 삭제. 구조는 남음. 되돌릴 수 없음 (DDL)\n- **DROP**: 테이블 **구조까지** 통째로 삭제 (DDL)\n\n## SELECT 문 구조\n```\nSELECT 속성\nFROM 테이블\nWHERE 조건\nGROUP BY 속성\nHAVING 그룹 조건\nORDER BY 속성 [ASC | DESC]\n```\n\n> **WHERE는 그룹으로 묶기 전**에 거르고, **HAVING은 묶은 뒤**에 거릅니다.\n> ORDER BY 기본값은 **오름차순(ASC)**입니다.\n\n### 실행 순서\n작성 순서와 실행 순서가 다릅니다.\n> **FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY**\n\n## 자주 나오는 문법\n- **DISTINCT**: 중복 제거\n- **LIKE**: 패턴 검색. `%`는 여러 글자, `_`는 한 글자\n- **BETWEEN A AND B**: A 이상 B 이하\n- **IN (값1, 값2)**: 목록 중 하나\n- **IS NULL**: NULL인지 확인. `= NULL`로 쓰면 안 됨\n\n## 집계 함수\nCOUNT, SUM, AVG, MAX, MIN\n> COUNT(*)는 NULL을 포함한 모든 행, COUNT(속성)은 NULL을 제외합니다.\n\n## 조인\n- **INNER JOIN**: 양쪽에 모두 있는 것만\n- **LEFT OUTER JOIN**: 왼쪽은 전부, 오른쪽은 맞는 것만\n- **RIGHT OUTER JOIN**: 반대\n- **FULL OUTER JOIN**: 양쪽 전부\n\n## 권한 부여\n```\nGRANT SELECT ON 테이블 TO 사용자 [WITH GRANT OPTION];\nREVOKE SELECT ON 테이블 FROM 사용자 [CASCADE];\n```\n> WITH GRANT OPTION을 주면 받은 사람이 다른 사람에게 권한을 다시 줄 수 있습니다.\n\n▸ 스키마: 데이터베이스의 구조 정의.\n▸ 집계 함수: 여러 행을 하나의 값으로 요약하는 함수.\n▸ 오름차순: 작은 값에서 큰 값 순서.","alt":"## SQL 3분류 ⭐⭐⭐ (매번 나옴)\n| 분류 | 뭐 하냐 | 명령어 |\n|---|---|---|\n| **DDL** | **구조** 만들기 | **CREATE, ALTER, DROP** |\n| **DML** | **데이터** 다루기 | **SELECT, INSERT, UPDATE, DELETE** |\n| **DCL** | **권한** | **GRANT, REVOKE** |\n\n> 🚨 외우는 법\n> **D**efinition → 뼈대 만들기 (CREATE ALTER DROP)\n> **M**anipulation → 알맹이 만지기 (SELECT INSERT UPDATE DELETE)\n> **C**ontrol → 권한 주고 뺏기 (GRANT REVOKE)\n> COMMIT, ROLLBACK은 TCL로 따로 치기도 함.\n\n## DROP vs DELETE vs TRUNCATE ⭐\n- **DELETE**: 데이터만 지움. 조건 걸 수 있음. **ROLLBACK 됨** (DML)\n- **TRUNCATE**: 데이터 싹 다 지움. 구조는 남음. **못 되돌림** (DDL)\n- **DROP**: **테이블 자체를** 날림 (DDL)\n\n> 🚨 비유: 서랍장으로 치면\n> DELETE = 옷 골라서 버림 / TRUNCATE = 옷 전부 버림 / DROP = 서랍장째 버림\n\n## SELECT 구조\n```\nSELECT 뭐\nFROM 어디서\nWHERE 조건\nGROUP BY 묶기\nHAVING 묶은 거 조건\nORDER BY 정렬\n```\n\n> 🚨 **WHERE = 묶기 전에 거름 / HAVING = 묶은 뒤에 거름**\n> \"부서별 평균 급여가 300 넘는 부서\" → 평균은 묶어야 나오니까 **HAVING**\n> ORDER BY 기본은 **오름차순(ASC)**\n\n### 실행 순서 ⭐\n> **FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY**\n> 쓰는 순서랑 다름. SELECT가 거의 마지막에 실행됨.\n\n## 문법 모음\n- **DISTINCT**: 중복 제거\n- **LIKE**: `%` = 여러 글자, `_` = 한 글자\n  > '김%' = 김으로 시작 / '김_' = 김 + 한 글자\n- **BETWEEN A AND B**: A 이상 B 이하 (양 끝 포함)\n- **IN**: 목록 중 하나\n- **IS NULL**: 🚨 `= NULL` 쓰면 안 됨. 무조건 `IS NULL`\n\n### 집계 함수\nCOUNT, SUM, AVG, MAX, MIN\n> 🚨 COUNT(*) = NULL도 셈 / COUNT(열) = NULL은 안 셈\n\n## 조인\n- **INNER**: 양쪽 다 있는 것만 (교집합)\n- **LEFT OUTER**: 왼쪽 전부 + 오른쪽 맞는 것\n- **FULL OUTER**: 양쪽 전부\n\n## 권한\n```\nGRANT SELECT ON 테이블 TO 사람 WITH GRANT OPTION;\nREVOKE SELECT ON 테이블 FROM 사람 CASCADE;\n```\n> WITH GRANT OPTION = 받은 권한을 남한테 또 줄 수 있음\n\n▸ 집계 함수: 여러 줄을 하나로 요약."},{"sub":"4과목 프로그래밍 언어 활용","title":"⑧ 운영체제","body":"## 프로세스\n**실행 중인 프로그램**입니다. 프로그램은 디스크에 있는 파일이고, 메모리에 올라와 실행되면 프로세스가 됩니다.\n\n### 프로세스 상태\n> **생성 → 준비 → 실행 → 대기 → 종료**\n\n- **준비(Ready)**: CPU만 받으면 바로 실행 가능\n- **실행(Running)**: CPU를 받아 실행 중\n- **대기(Waiting, Blocked)**: 입출력 등을 기다리는 중\n\n### 상태 전이\n- 준비 → 실행: **디스패치**\n- 실행 → 준비: **타임아웃** (할당 시간 끝남)\n- 실행 → 대기: **입출력 요청**\n- 대기 → 준비: **입출력 완료(Wake up)**\n\n> 대기에서 바로 실행으로 가지 않습니다. **반드시 준비를 거칩니다.** 이 함정이 자주 나옵니다.\n\n### PCB\n운영체제가 프로세스를 관리하기 위해 두는 정보 블록입니다. 프로세스 번호, 상태, 프로그램 카운터, 레지스터 정보 등이 들어 있습니다.\n\n### 스레드\n프로세스 안에서 실행되는 **작업 단위**입니다. 같은 프로세스의 스레드는 메모리를 공유해 가볍습니다.\n\n## CPU 스케줄링\n### 비선점형 (한번 받으면 끝날 때까지)\n- **FCFS**: 먼저 온 순서대로\n- **SJF**: 실행 시간이 짧은 것 먼저\n- **HRN**: (대기시간 + 서비스시간) ÷ 서비스시간이 큰 것 먼저. 기아 현상 해결\n\n### 선점형 (도중에 뺏을 수 있음)\n- **RR(라운드 로빈)**: 정해진 시간만큼씩 돌아가며\n- **SRT**: 남은 시간이 가장 짧은 것 먼저\n- 다단계 큐\n\n> **SJF는 비선점, SRT는 선점**입니다. 짧은 걸 먼저 한다는 건 같지만 도중에 뺏느냐가 다릅니다.\n\n## 교착상태 (Deadlock)\n두 프로세스가 서로 상대가 가진 자원을 기다리며 영원히 멈추는 상태입니다.\n\n### 발생 조건 4가지 (모두 충족해야 발생)\n- **상호 배제**: 자원을 한 번에 하나만 사용\n- **점유와 대기**: 자원을 가진 채 다른 자원을 기다림\n- **비선점**: 남의 자원을 강제로 뺏을 수 없음\n- **환형 대기**: 서로 꼬리를 물고 기다림\n\n> 넷 중 **하나만 깨도** 교착상태를 막을 수 있습니다.\n\n### 해결 방법\n예방, 회피(**은행원 알고리즘**), 발견, 회복\n\n## 페이지 교체 알고리즘\n메모리가 꽉 찼을 때 어떤 페이지를 내보낼지 정합니다.\n- **FIFO**: 먼저 들어온 것\n- **LRU**: 가장 오랫동안 **사용하지 않은** 것\n- **LFU**: 사용 **횟수가 가장 적은** 것\n- **OPT**: 앞으로 가장 오래 사용하지 않을 것. 이론상 최적이지만 구현 불가\n\n> LRU와 LFU를 바꿔서 냅니다. **LRU는 최근(Recently), LFU는 빈도(Frequently).**\n\n▸ 선점: 실행 중인 프로세스의 CPU를 빼앗는 것.\n▸ 기아 현상: 우선순위가 낮아 계속 밀려 실행되지 못하는 상태.\n▸ 페이지: 메모리를 일정 크기로 나눈 단위.","alt":"## 프로세스 = 실행 중인 프로그램\n프로그램은 디스크에 있는 파일. 메모리에 올라와서 돌아가면 프로세스.\n\n### 상태 ⭐⭐\n> **생성 → 준비 → 실행 → 대기 → 종료**\n- **준비**: CPU만 주면 바로 달림. 대기열에서 순서 기다림\n- **실행**: CPU 잡고 달리는 중\n- **대기**: 입출력 기다리는 중 (파일 읽기, 키보드 입력)\n\n### 전이 이름 ⭐\n- 준비 → 실행: **디스패치**\n- 실행 → 준비: **타임아웃** (시간 다 씀)\n- 실행 → 대기: **입출력 요청**\n- 대기 → 준비: **Wake up** (입출력 끝남)\n\n> 🚨 **대기에서 바로 실행으로 못 감.** 무조건 준비 거쳐야 함.\n> 입출력 끝났다고 새치기 안 됨. 다시 줄 서야 함. 이거 함정.\n\n- **PCB**: 프로세스 정보 담은 신분증 (번호, 상태, 레지스터 등)\n- **스레드**: 프로세스 안의 작업 단위. 메모리 공유해서 가벼움\n\n## CPU 스케줄링 ⭐\n### 비선점 (한번 잡으면 끝까지)\n- **FCFS**: 먼저 온 놈부터\n- **SJF**: 짧은 놈부터\n- **HRN**: (대기+서비스)÷서비스 큰 놈부터. 오래 기다린 놈 챙겨줌\n\n### 선점 (중간에 뺏을 수 있음)\n- **RR**: 시간 쪼개서 돌아가며 (라운드 로빈)\n- **SRT**: 남은 시간 짧은 놈부터\n\n> 🚨 **SJF = 비선점 / SRT = 선점.** 둘 다 짧은 거 먼저인데 뺏냐 안 뺏냐가 다름.\n\n## 교착상태 (데드락) ⭐⭐\n둘이 서로 상대 거 기다리면서 영원히 멈춤.\n> 좁은 골목에서 차 두 대가 마주쳐서 둘 다 안 비킴.\n\n### 발생 조건 4개 (다 충족해야 터짐)\n- **상호 배제**: 자원을 한 번에 하나만\n- **점유와 대기**: 내 거 쥐고 남의 거 기다림\n- **비선점**: 남의 거 못 뺏음\n- **환형 대기**: 꼬리 물기\n\n> 🚨 외우는 법: **\"상점비환\"**\n> 넷 중 **하나만 깨도** 안 터짐.\n\n해결: 예방 / 회피(**은행원 알고리즘**) / 발견 / 회복\n\n## 페이지 교체 ⭐\n메모리 꽉 차면 누굴 내보내냐.\n- **FIFO**: 먼저 들어온 놈\n- **LRU**: 제일 **오래 안 쓴** 놈\n- **LFU**: **사용 횟수** 제일 적은 놈\n- **OPT**: 앞으로 제일 오래 안 쓸 놈. 최적인데 미래를 알 수 없어서 구현 불가\n\n> 🚨 LRU vs LFU\n> **LRU** = Least **Recently** Used = **최근에** 안 쓴 놈\n> **LFU** = Least **Frequently** Used = **자주** 안 쓴 놈\n\n▸ 기아 현상: 우선순위 낮아서 계속 밀리는 것."},{"sub":"4과목 프로그래밍 언어 활용","title":"⑨ 네트워크","body":"## OSI 7계층 (핵심)\n| 계층 | 이름 | 역할 | 장비·프로토콜 |\n|---|---|---|---|\n| 7 | **응용** | 사용자 서비스 | HTTP, FTP, SMTP, DNS |\n| 6 | **표현** | 암호화, 압축, 형식 변환 | JPEG, MPEG |\n| 5 | **세션** | 연결 관리, 동기화 | — |\n| 4 | **전송** | 종단 간 신뢰성 | **TCP, UDP** |\n| 3 | **네트워크** | 경로 선택(라우팅) | **IP**, **라우터** |\n| 2 | **데이터링크** | 인접 노드 간 전송, 오류 제어 | **스위치**, MAC |\n| 1 | **물리** | 전기 신호 전송 | 허브, 리피터 |\n\n> 아래부터 외우는 문장: **\"물데네전세표응\"** 또는 \"Please Do Not Throw Sausage Pizza Away\".\n\n### 계층별 전송 단위\n- 물리: **비트**\n- 데이터링크: **프레임**\n- 네트워크: **패킷**\n- 전송: **세그먼트**\n\n## TCP와 UDP\n| | TCP | UDP |\n|---|---|---|\n| 연결 | **연결형** | 비연결형 |\n| 신뢰성 | 높음 (재전송, 순서 보장) | 낮음 |\n| 속도 | 느림 | **빠름** |\n| 용도 | 웹, 이메일, 파일 전송 | **실시간 스트리밍, 게임, DNS** |\n\n> TCP는 **3-way handshake**로 연결을 맺습니다. SYN → SYN+ACK → ACK\n\n## IP 주소\n- **IPv4**: **32비트**, 8비트씩 4개로 나눔 (예: 192.168.0.1)\n- **IPv6**: **128비트**, 16비트씩 8개로 나눔\n\n### IPv4 클래스\n- A: 1~126\n- B: 128~191\n- C: 192~223\n- D: 멀티캐스트\n- E: 연구용\n\n### 서브넷 마스크\n네트워크 부분과 호스트 부분을 나눕니다. /24는 앞 24비트가 네트워크라는 뜻입니다.\n\n## 주요 프로토콜\n- **HTTP**: 웹 (80번 포트), **HTTPS**: 암호화된 웹 (443)\n- **FTP**: 파일 전송 (20, 21)\n- **SMTP**: 메일 보내기 (25)\n- **POP3, IMAP**: 메일 받기\n- **DNS**: 도메인을 IP로 변환 (53)\n- **DHCP**: IP를 자동으로 할당\n- **ARP**: IP 주소로 **MAC 주소**를 알아냄\n- **RARP**: MAC 주소로 IP를 알아냄\n\n> ARP와 RARP 방향을 바꿔서 냅니다. **ARP는 IP → MAC, RARP는 반대.**\n\n▸ 프로토콜: 통신을 위한 약속과 규칙.\n▸ MAC 주소: 네트워크 장비에 고유하게 부여된 물리적 주소.\n▸ 포트: 하나의 컴퓨터 안에서 서비스를 구분하는 번호.","alt":"## OSI 7계층 ⭐⭐⭐ (매번 나옴)\n| 계층 | 이름 | 뭐 하냐 | 대표 |\n|---|---|---|---|\n| 7 | 응용 | 사용자 서비스 | HTTP, FTP, DNS |\n| 6 | 표현 | 암호화·압축·변환 | JPEG |\n| 5 | 세션 | 연결 관리 | — |\n| 4 | **전송** | 믿을 만하게 전달 | **TCP, UDP** |\n| 3 | **네트워크** | 길 찾기 | **IP, 라우터** |\n| 2 | **데이터링크** | 옆 노드끼리 전달 | **스위치**, MAC |\n| 1 | 물리 | 전기 신호 | 허브 |\n\n> 🚨 아래부터 외우셈: **\"물데네전세표응\"**\n> 장비 짝이 자주 나옴: **라우터 = 3계층, 스위치 = 2계층, 허브 = 1계층**\n\n### 전송 단위 ⭐\n물리 **비트** / 데이터링크 **프레임** / 네트워크 **패킷** / 전송 **세그먼트**\n> 외우는 법: \"비프패세\" (비프 패스하세)\n\n## TCP vs UDP ⭐⭐\n| | TCP | UDP |\n|---|---|---|\n| 연결 | **연결형** | 비연결형 |\n| 신뢰성 | 높음 | 낮음 |\n| 속도 | 느림 | **빠름** |\n| 용도 | 웹, 메일, 파일 | **스트리밍, 게임, DNS** |\n\n> 🚨 TCP = 등기우편 (받았는지 확인함) / UDP = 전단지 (그냥 뿌림)\n> 게임이나 영상은 좀 빠져도 빠른 게 중요 → UDP\n\n**3-way handshake**: SYN → SYN+ACK → ACK\n> \"여보세요?\" → \"네 들려요, 제 목소리 들리세요?\" → \"네 들려요\"\n\n## IP 주소 ⭐\n- **IPv4 = 32비트** (192.168.0.1)\n- **IPv6 = 128비트**\n\n> 🚨 32 vs 128. 숫자 바꿔서 냄.\n\n### IPv4 클래스\nA 1~126 / B 128~191 / **C 192~223** / D 멀티캐스트 / E 연구용\n> 집 공유기가 192.168... 인 이유 = C클래스\n\n## 프로토콜 모음\n- **HTTP** 80 / **HTTPS** 443\n- **FTP** 20·21\n- **SMTP** 25 (메일 **보내기**)\n- **POP3·IMAP** (메일 **받기**)\n- **DNS** 53 (도메인 → IP)\n- **DHCP**: IP 자동으로 줌\n- **ARP**: IP → **MAC**\n- **RARP**: MAC → IP\n\n> 🚨 **ARP = IP로 MAC 찾기 / RARP = 거꾸로(Reverse)**\n> SMTP는 보내기, POP3는 받기. 이것도 바꿔서 냄.\n\n▸ MAC 주소: 랜카드에 박힌 고유 주소."},{"sub":"5과목 정보시스템 구축관리","title":"⑩ 개발 방법론과 비용 산정","body":"## 소프트웨어 생명주기 모델\n### 폭포수 모형\n단계를 **순차적으로** 진행합니다. 이전 단계로 돌아가기 어렵습니다.\n> 요구사항이 명확하고 변경이 적을 때 적합합니다.\n\n### 프로토타입 모형\n시제품(프로토타입)을 먼저 만들어 사용자 의견을 반영합니다. 요구사항이 불명확할 때 적합합니다.\n\n### 나선형 모형\n여러 번 반복하며 점진적으로 완성합니다. **위험 분석**을 핵심으로 합니다.\n> 계획 수립 → **위험 분석** → 개발 및 검증 → 고객 평가의 반복\n\n### 애자일\n변화에 유연하게 대응하는 방법론의 총칭입니다.\n- **스크럼**: 스프린트(짧은 개발 주기), 제품 백로그, 스크럼 마스터\n- **XP(익스트림 프로그래밍)**: 짝 프로그래밍, 테스트 주도 개발, 지속적 통합\n\n> 애자일 선언의 핵심 가치 네 가지\n> - 프로세스와 도구보다 **개인과 상호작용**\n> - 포괄적인 문서보다 **작동하는 소프트웨어**\n> - 계약 협상보다 **고객과의 협력**\n> - 계획을 따르기보다 **변화에 대응**\n\n## 비용 산정 기법\n### 하향식\n- **전문가 감정**: 전문가의 경험으로 추정\n- **델파이**: 여러 전문가의 의견을 익명으로 여러 번 수렴\n\n### 상향식\n- **LOC(라인 수) 기법**: 예상 코드 라인 수로 추정\n- **COCOMO**: 코드 라인 수를 기반으로 한 모델\n\n### COCOMO 프로젝트 유형\n- **조직형(Organic)**: 5만 라인 이하, 소규모\n- **반분리형(Semi-detached)**: 30만 라인 이하, 중간 규모\n- **내장형(Embedded)**: 30만 라인 이상, 대규모·복잡\n\n> 세 유형의 규모 구분이 시험에 나옵니다.\n\n### 기능 점수(FP)\n기능의 개수와 복잡도로 규모를 산정합니다. 코드 라인과 무관합니다.\n\n## 일정 관리\n- **PERT**: 불확실한 작업 기간을 낙관·보통·비관치로 추정\n- **CPM**: **임계 경로**(가장 긴 경로)를 찾아 일정 관리\n- **간트 차트**: 작업 일정을 막대로 표시\n\n> 임계 경로는 가장 긴 경로이며, 이 경로의 작업이 늦어지면 전체 일정이 늦어집니다.\n\n▸ 스프린트: 스크럼에서 1~4주 단위의 짧은 개발 주기.\n▸ 백로그: 해야 할 일의 우선순위 목록.\n▸ 임계 경로: 프로젝트 전체 기간을 결정하는 가장 긴 작업 경로.","alt":"## 개발 방법론 ⭐\n### 폭포수\n단계별로 **쭉 내려감.** 뒤로 못 돌아감.\n> 요구사항 확실하고 안 바뀔 때만 씀.\n\n### 프로토타입\n**시제품 먼저** 보여주고 의견 받음.\n> 고객이 뭘 원하는지 본인도 모를 때.\n\n### 나선형 ⭐\n빙글빙글 반복하면서 키움. 핵심은 **위험 분석**.\n> 🚨 \"위험 분석\"이 나오면 **나선형**임. 거의 공식.\n\n### 애자일\n변화에 유연하게. 요즘 대세.\n- **스크럼**: 스프린트(1~4주 짧은 주기), 백로그, 스크럼 마스터\n- **XP**: 짝 프로그래밍, 테스트 주도 개발\n\n> 🚨 애자일 4대 가치 (왼쪽이 더 중요)\n> **개인과 상호작용** > 프로세스와 도구\n> **작동하는 소프트웨어** > 포괄적 문서\n> **고객 협력** > 계약 협상\n> **변화 대응** > 계획 따르기\n> \"문서를 중시한다\" 나오면 **오답**임.\n\n## 비용 산정 ⭐\n### 하향식\n- 전문가 감정\n- **델파이**: 전문가 여럿한테 **익명으로** 여러 번 물어봄\n\n### 상향식\n- **LOC**: 코드 몇 줄 나올지로 추정\n- **COCOMO**: 코드 라인 기반 모델\n\n### COCOMO 유형 ⭐⭐\n- **조직형**: **5만** 라인 이하, 소규모\n- **반분리형**: **30만** 라인 이하, 중간\n- **내장형**: **30만** 라인 이상, 대규모\n\n> 🚨 숫자 5만 / 30만 그대로 나옴.\n> 외우는 법: 조직 → 반분리 → 내장 순으로 커짐\n\n### 기능 점수(FP)\n기능 개수랑 복잡도로 잼. **코드 라인이랑 무관.**\n\n## 일정 관리\n- **PERT**: 낙관·보통·비관 3개로 기간 추정\n- **CPM**: **임계 경로** 찾기\n- **간트 차트**: 막대 그래프로 일정\n\n> 🚨 **임계 경로 = 가장 긴 경로.** 가장 짧은 거 아님.\n> 이 경로가 밀리면 전체가 밀림. 그래서 \"임계\"임.\n\n▸ 스프린트: 스크럼의 짧은 개발 주기."},{"sub":"5과목 정보시스템 구축관리","title":"⑪ 보안","body":"## 정보보안 3요소 (CIA)\n- **기밀성(Confidentiality)**: 인가된 사람만 볼 수 있음\n- **무결성(Integrity)**: 인가된 사람만 수정할 수 있음\n- **가용성(Availability)**: 필요할 때 언제든 사용할 수 있음\n\n> DDoS 공격은 서비스를 못 쓰게 만드므로 **가용성**을 해칩니다. 설명을 주고 어느 요소를 침해했는지 묻는 문제가 나옵니다.\n\n## 암호화 방식\n### 대칭키 (비밀키)\n암호화와 복호화에 **같은 키**를 씁니다.\n- 빠르지만 키 배송 문제가 있음\n- **DES, AES, SEED, ARIA**\n\n### 비대칭키 (공개키)\n암호화와 복호화에 **서로 다른 키**를 씁니다. 공개키와 개인키 한 쌍입니다.\n- 느리지만 키 배송 문제가 없음\n- **RSA, ECC**\n\n> 대칭키 알고리즘과 비대칭키 알고리즘을 구분하는 문제가 자주 나옵니다. **RSA와 ECC만 비대칭**이라고 외우면 쉽습니다.\n\n### 해시\n임의 길이 입력을 **고정 길이**로 변환합니다. **복호화가 불가능**한 일방향 함수입니다.\n- **SHA, MD5**\n- 용도: 비밀번호 저장, 무결성 검증\n\n## 주요 공격 기법\n### 서비스 거부\n- **DoS / DDoS**: 대량의 요청으로 서비스를 마비시킴. DDoS는 여러 곳에서 동시에\n- **Ping of Death**: 규정보다 큰 패킷을 보냄\n- **SYN Flooding**: 3-way handshake를 악용해 연결 요청만 계속 보냄\n- **Smurf**: 브로드캐스트를 이용해 대량의 응답을 유도\n\n### 웹 공격\n- **SQL 인젝션**: 입력값에 SQL 코드를 넣어 DB를 조작\n- **XSS**: 웹페이지에 악성 스크립트를 삽입\n- **CSRF**: 사용자가 의도하지 않은 요청을 보내게 함\n\n### 기타\n- **스니핑**: 네트워크를 오가는 데이터를 **엿봄**\n- **스푸핑**: 신분을 **위장**함 (IP, ARP 스푸핑)\n- **피싱**: 가짜 사이트로 개인정보를 빼냄\n- **랜섬웨어**: 파일을 암호화하고 돈을 요구\n\n> 스니핑과 스푸핑을 바꿔서 냅니다. **스니핑은 도청, 스푸핑은 사칭.**\n\n## 접근 통제\n- **DAC(임의적)**: 소유자가 권한을 줌\n- **MAC(강제적)**: 보안 등급에 따라 시스템이 강제\n- **RBAC(역할 기반)**: 역할에 권한을 부여\n\n▸ 복호화: 암호문을 다시 원래 평문으로 되돌리는 것.\n▸ 브로드캐스트: 네트워크의 모든 장비에 한꺼번에 보내는 것.\n▸ 패킷: 네트워크에서 데이터를 나눠 보내는 단위.","alt":"## 보안 3요소 CIA ⭐⭐\n- **기밀성**: 허락된 놈만 **봄**\n- **무결성**: 허락된 놈만 **고침**\n- **가용성**: 필요할 때 **쓸 수 있음**\n\n> 🚨 설명 주고 뭐냐 고르는 문제 나옴\n> DDoS로 사이트 터짐 → 못 씀 → **가용성** 침해\n> 누가 몰래 데이터 조작 → **무결성** 침해\n> 개인정보 유출 → **기밀성** 침해\n\n## 암호화 ⭐⭐\n### 대칭키 = 같은 열쇠\n잠글 때 푸는 때 **같은 키.** 빠른데 키를 어떻게 전달하냐가 문제.\n→ **DES, AES, SEED, ARIA**\n\n### 비대칭키 = 다른 열쇠 (공개키 + 개인키)\n잠그는 키 ≠ 푸는 키. 느린데 키 전달 문제 없음.\n→ **RSA, ECC**\n\n> 🚨 외우는 요령: **RSA, ECC만 비대칭. 나머지는 거의 대칭.**\n> 이것만 알면 구분 문제 다 풂.\n\n### 해시\n아무 길이나 넣어도 **고정 길이**로 나옴. **되돌리기 불가능.**\n→ **SHA, MD5**\n> 비밀번호를 해시로 저장함. 그래서 사이트도 내 비번을 모름. \"비번 찾기\" 말고 \"비번 재설정\"만 되는 이유.\n\n## 공격 기법 ⭐\n### 서비스 마비\n- **DoS/DDoS**: 요청 폭탄. DDoS는 여러 곳에서 동시에\n- **Ping of Death**: 규정보다 큰 패킷\n- **SYN Flooding**: 연결 요청(SYN)만 계속 보내고 마무리 안 함\n- **Smurf**: 브로드캐스트로 응답 폭탄 유도\n\n### 웹 공격\n- **SQL 인젝션**: 입력창에 SQL 코드 넣어서 DB 털기\n- **XSS**: 게시판에 악성 스크립트 심기\n- **CSRF**: 나도 모르게 요청 보내게 만들기\n\n### 기타\n- **스니핑**: 몰래 **엿봄** (도청)\n- **스푸핑**: **위장함** (사칭)\n- **피싱**: 가짜 사이트\n- **랜섬웨어**: 파일 잠그고 돈 요구\n\n> 🚨 **스니핑 = 엿듣기(sniff = 킁킁 냄새 맡기) / 스푸핑 = 사칭(spoof = 속이기)**\n> 이거 바꿔서 매번 냄.\n\n## 접근 통제\n- **DAC**: 주인이 권한 줌 (임의적)\n- **MAC**: 보안 등급으로 시스템이 강제 (강제적)\n- **RBAC**: 역할별로 권한\n\n▸ 복호화: 암호문을 원래대로 푸는 것."}],"questions":[{"sub":"1과목 소프트웨어 설계","q":"다음 중 UML의 구조 다이어그램에 해당하는 것은?","o":["유스케이스 다이어그램","시퀀스 다이어그램","클래스 다이어그램","활동 다이어그램"],"a":2,"e":"클래스, 객체, 컴포넌트, 배치, 패키지, 복합구조가 구조 다이어그램입니다. 유스케이스, 시퀀스, 활동, 상태는 행위 다이어그램입니다."},{"sub":"1과목 소프트웨어 설계","q":"UML 다이어그램 중 객체 간 메시지를 시간 순서대로 표현하는 것은?","o":["클래스 다이어그램","시퀀스 다이어그램","배치 다이어그램","패키지 다이어그램"],"a":1,"e":"시퀀스 다이어그램은 세로축을 시간으로 두고 객체 사이에 주고받는 메시지를 순서대로 보여줍니다."},{"sub":"1과목 소프트웨어 설계","q":"UML의 구성요소가 아닌 것은?","o":["사물","관계","다이어그램","알고리즘"],"a":3,"e":"UML은 사물(Things), 관계(Relationships), 다이어그램(Diagram) 세 가지로 구성됩니다."},{"sub":"1과목 소프트웨어 설계","q":"요구사항 개발 절차로 옳은 것은?","o":["도출 → 분석 → 명세 → 확인","분석 → 도출 → 확인 → 명세","명세 → 도출 → 분석 → 확인","도출 → 명세 → 분석 → 확인"],"a":0,"e":"요구사항은 도출, 분석, 명세, 확인(검증) 순서로 개발됩니다."},{"sub":"1과목 소프트웨어 설계","q":"다음 중 비기능 요구사항에 해당하는 것은?","o":["회원가입 기능 제공","상품 검색 기능 제공","응답 시간 2초 이내 보장","결제 기능 제공"],"a":2,"e":"응답 시간, 보안, 신뢰성, 사용성처럼 시스템의 품질 조건은 비기능 요구사항입니다. 무엇을 하는가는 기능 요구사항입니다."},{"sub":"1과목 소프트웨어 설계","q":"결합도를 낮은 것부터 높은 순서로 나열한 것은?","o":["자료 < 스탬프 < 제어 < 외부 < 공통 < 내용","내용 < 공통 < 외부 < 제어 < 스탬프 < 자료","자료 < 제어 < 스탬프 < 공통 < 외부 < 내용","스탬프 < 자료 < 제어 < 외부 < 내용 < 공통"],"a":0,"e":"자료 결합도가 가장 낮고(좋고) 내용 결합도가 가장 높습니다(나쁩니다). 좋은 설계는 결합도를 낮게 유지합니다."},{"sub":"1과목 소프트웨어 설계","q":"응집도가 가장 높은(가장 바람직한) 것은?","o":["우연적 응집도","논리적 응집도","시간적 응집도","기능적 응집도"],"a":3,"e":"응집도는 기능 > 순차 > 교환 > 절차 > 시간 > 논리 > 우연 순입니다. 기능적 응집도가 가장 바람직합니다."},{"sub":"1과목 소프트웨어 설계","q":"다른 모듈의 내부 기능이나 자료를 직접 참조하는 결합도는?","o":["자료 결합도","스탬프 결합도","공통 결합도","내용 결합도"],"a":3,"e":"내용 결합도는 다른 모듈 내부를 직접 참조하는 가장 나쁜 결합도입니다. 전역변수를 공유하는 것은 공통 결합도입니다."},{"sub":"1과목 소프트웨어 설계","q":"좋은 소프트웨어 설계의 기준으로 옳은 것은?","o":["결합도 높게, 응집도 높게","결합도 낮게, 응집도 높게","결합도 높게, 응집도 낮게","결합도 낮게, 응집도 낮게"],"a":1,"e":"모듈 간 의존은 줄이고(결합도 낮게) 모듈 내부는 한 가지 기능에 집중(응집도 높게)해야 유지보수가 쉽습니다."},{"sub":"1과목 소프트웨어 설계","q":"객체지향 설계 원칙 SOLID 중 '확장에는 열려 있고 수정에는 닫혀 있어야 한다'는 원칙은?","o":["단일 책임 원칙","개방-폐쇄 원칙","리스코프 치환 원칙","의존 역전 원칙"],"a":1,"e":"개방-폐쇄 원칙(OCP)은 기존 코드를 고치지 않고 기능을 확장할 수 있어야 한다는 원칙입니다."},{"sub":"1과목 소프트웨어 설계","q":"자식 클래스는 부모 클래스를 대체할 수 있어야 한다는 원칙은?","o":["SRP","OCP","LSP","ISP"],"a":2,"e":"리스코프 치환 원칙(LSP)입니다. 부모 타입 자리에 자식 객체를 넣어도 프로그램이 정상 동작해야 합니다."},{"sub":"1과목 소프트웨어 설계","q":"GoF 디자인 패턴 중 생성 패턴에 해당하는 것은?","o":["어댑터","옵저버","싱글톤","프록시"],"a":2,"e":"생성 패턴은 싱글톤, 팩토리 메서드, 추상 팩토리, 빌더, 프로토타입입니다. 어댑터와 프록시는 구조, 옵저버는 행위 패턴입니다."},{"sub":"1과목 소프트웨어 설계","q":"클래스의 인스턴스를 하나만 생성하도록 보장하는 디자인 패턴은?","o":["싱글톤","빌더","프로토타입","팩토리 메서드"],"a":0,"e":"싱글톤 패턴은 인스턴스를 하나만 만들고 어디서든 그 하나에 접근하게 합니다. 설정 관리 객체 등에 쓰입니다."},{"sub":"1과목 소프트웨어 설계","q":"호환되지 않는 인터페이스를 가진 클래스를 연결해 함께 동작하게 하는 패턴은?","o":["데코레이터","어댑터","퍼사드","브리지"],"a":1,"e":"어댑터 패턴은 서로 맞지 않는 인터페이스 사이에서 변환기 역할을 합니다. 전원 돼지코를 떠올리면 됩니다."},{"sub":"1과목 소프트웨어 설계","q":"한 객체의 상태가 바뀌면 의존하는 객체들에게 자동으로 알리는 행위 패턴은?","o":["전략","커맨드","옵저버","이터레이터"],"a":2,"e":"옵저버 패턴은 구독-알림 구조입니다. 대상이 변하면 등록된 관찰자들에게 통지합니다."},{"sub":"1과목 소프트웨어 설계","q":"UML 관계 중 전체가 사라지면 부분도 함께 사라지는 강한 전체-부분 관계는?","o":["연관","집합(Aggregation)","포함(Composition)","의존"],"a":2,"e":"포함 관계는 부분이 전체와 생명주기를 같이합니다. 부분이 독립적으로 존재할 수 있으면 집합 관계입니다."},{"sub":"1과목 소프트웨어 설계","q":"상속 관계를 나타내는 UML 관계는?","o":["일반화","실체화","의존","연관"],"a":0,"e":"일반화(Generalization)는 is-a 관계로 상속을 표현합니다. 인터페이스를 구현하는 것은 실체화입니다."},{"sub":"1과목 소프트웨어 설계","q":"사용자와 시스템 간 상호작용을 기능 단위로 표현하며 액터가 등장하는 다이어그램은?","o":["클래스 다이어그램","유스케이스 다이어그램","컴포넌트 다이어그램","상태 다이어그램"],"a":1,"e":"유스케이스 다이어그램은 사용자 관점에서 시스템이 제공하는 기능을 액터와 유스케이스로 표현합니다."},{"sub":"1과목 소프트웨어 설계","q":"모델-뷰-컨트롤러로 역할을 분리하는 아키텍처 패턴은?","o":["레이어 패턴","MVC 패턴","파이프-필터 패턴","브로커 패턴"],"a":1,"e":"MVC는 데이터(모델), 화면(뷰), 제어(컨트롤러)를 분리해 서로의 영향을 줄이는 패턴입니다."},{"sub":"1과목 소프트웨어 설계","q":"UI 설계 원칙 중 누구나 쉽게 이해하고 사용할 수 있어야 한다는 원칙은?","o":["직관성","유효성","유연성","학습성"],"a":0,"e":"직관성은 사용자가 설명 없이도 쉽게 이해하고 쓸 수 있어야 한다는 원칙입니다. 유효성은 목적을 정확히 달성하는 것입니다."},{"sub":"2과목 소프트웨어 개발","q":"스택에 1, 2, 3을 순서대로 push한 뒤 pop, push(4), pop, pop을 수행했을 때 출력 순서는?","o":["3, 4, 2","1, 2, 3","3, 2, 4","2, 4, 3"],"a":0,"e":"스택은 LIFO입니다. [1,2,3]에서 pop하면 3, 4를 넣어 [1,2,4]에서 pop하면 4, 다시 pop하면 2가 나옵니다."},{"sub":"2과목 소프트웨어 개발","q":"먼저 들어온 데이터가 먼저 나가는 자료구조는?","o":["스택","큐","트리","그래프"],"a":1,"e":"큐는 FIFO(First In First Out) 구조입니다. 스택은 LIFO입니다."},{"sub":"2과목 소프트웨어 개발","q":"다음 중 스택의 활용 사례로 가장 적절한 것은?","o":["프린터 대기열","함수 호출과 복귀","작업 스케줄링","너비 우선 탐색"],"a":1,"e":"함수 호출은 나중에 호출된 함수가 먼저 끝나므로 스택을 씁니다. 프린터 대기열과 너비 우선 탐색은 큐를 씁니다."},{"sub":"2과목 소프트웨어 개발","q":"루트 A의 왼쪽 자식 B, 오른쪽 자식 C, B의 왼쪽 자식 D, 오른쪽 자식 E인 트리를 전위 순회한 결과는?","o":["A B D E C","D B E A C","D E B C A","A B C D E"],"a":0,"e":"전위 순회는 루트 → 왼쪽 → 오른쪽입니다. A, 그다음 왼쪽 서브트리 B D E, 그다음 C입니다."},{"sub":"2과목 소프트웨어 개발","q":"같은 트리(루트 A, 왼쪽 B, 오른쪽 C, B의 왼쪽 D, 오른쪽 E)를 중위 순회한 결과는?","o":["A B D E C","D B E A C","D E B C A","B D E A C"],"a":1,"e":"중위 순회는 왼쪽 → 루트 → 오른쪽입니다. D B E를 먼저 돌고 A, 마지막으로 C입니다."},{"sub":"2과목 소프트웨어 개발","q":"같은 트리(루트 A, 왼쪽 B, 오른쪽 C, B의 왼쪽 D, 오른쪽 E)를 후위 순회한 결과는?","o":["A B D E C","D B E A C","D E B C A","D E B A C"],"a":2,"e":"후위 순회는 왼쪽 → 오른쪽 → 루트입니다. D E B, 그다음 C, 마지막에 루트 A입니다."},{"sub":"2과목 소프트웨어 개발","q":"평균 시간복잡도는 O(n log n)이지만 최악의 경우 O(n²)인 정렬은?","o":["합병 정렬","힙 정렬","퀵 정렬","버블 정렬"],"a":2,"e":"퀵 정렬은 평균적으로 빠르지만 피벗이 한쪽으로 치우치면 O(n²)이 됩니다. 합병과 힙은 최악에도 O(n log n)입니다."},{"sub":"2과목 소프트웨어 개발","q":"인접한 두 원소를 비교해 자리를 바꾸는 방식의 정렬은?","o":["선택 정렬","삽입 정렬","버블 정렬","합병 정렬"],"a":2,"e":"버블 정렬은 인접한 원소를 비교하며 큰 값을 뒤로 보내는 방식입니다. 시간복잡도는 O(n²)입니다."},{"sub":"2과목 소프트웨어 개발","q":"그래프 탐색에서 깊이 우선 탐색(DFS)에 주로 사용하는 자료구조는?","o":["큐","스택","힙","해시 테이블"],"a":1,"e":"DFS는 한 방향으로 끝까지 가다가 되돌아오므로 스택을, BFS는 가까운 노드부터 넓게 탐색하므로 큐를 씁니다."},{"sub":"2과목 소프트웨어 개발","q":"다음 중 블랙박스 테스트 기법이 아닌 것은?","o":["동등 분할","경계값 분석","원인-결과 그래프","기초 경로 검사"],"a":3,"e":"기초 경로 검사는 코드 내부 경로를 보는 화이트박스 기법입니다. 나머지는 입출력만 보는 블랙박스 기법입니다."},{"sub":"2과목 소프트웨어 개발","q":"입력 범위의 경계 근처에서 오류가 많이 발생한다는 점에 착안한 테스트 기법은?","o":["동등 분할","경계값 분석","오류 예측","비교 검사"],"a":1,"e":"경계값 분석은 범위의 최솟값, 최댓값과 그 바로 안팎의 값을 집중적으로 테스트합니다."},{"sub":"2과목 소프트웨어 개발","q":"하향식 통합 테스트에서 아직 개발되지 않은 하위 모듈을 대신하는 것은?","o":["드라이버","스텁","테스트 케이스","오라클"],"a":1,"e":"하향식은 위에서 내려오므로 없는 하위 모듈을 스텁으로 대체합니다. 상향식에서 상위 모듈을 대신하는 것은 드라이버입니다."},{"sub":"2과목 소프트웨어 개발","q":"상향식 통합 테스트에서 필요한 것은?","o":["스텁","드라이버","목업","프로토타입"],"a":1,"e":"상향식은 하위 모듈부터 올라가므로 이를 호출해줄 상위 모듈 역할의 드라이버가 필요합니다."},{"sub":"2과목 소프트웨어 개발","q":"사용자 환경에서 사용자가 직접 수행하는 인수 테스트는?","o":["알파 테스트","베타 테스트","단위 테스트","통합 테스트"],"a":1,"e":"베타 테스트는 실제 사용자 환경에서 진행합니다. 알파 테스트는 개발자 환경에서 사용자가 수행합니다."},{"sub":"2과목 소프트웨어 개발","q":"V 모델의 테스트 단계 순서로 옳은 것은?","o":["단위 → 통합 → 시스템 → 인수","통합 → 단위 → 시스템 → 인수","시스템 → 통합 → 단위 → 인수","단위 → 시스템 → 통합 → 인수"],"a":0,"e":"개별 모듈(단위), 모듈 결합(통합), 전체 시스템, 사용자 최종 확인(인수) 순서로 진행됩니다."},{"sub":"2과목 소프트웨어 개발","q":"같은 테스트를 반복하면 더 이상 새로운 결함을 찾지 못한다는 테스트 원리는?","o":["결함 집중","살충제 패러독스","오류-부재의 궤변","완벽한 테스트 불가능"],"a":1,"e":"살충제 패러독스는 벌레가 약에 내성이 생기듯 같은 테스트로는 새 결함을 찾지 못하므로 테스트 케이스를 계속 개선해야 한다는 원리입니다."},{"sub":"2과목 소프트웨어 개발","q":"결함의 대부분이 소수의 모듈에 집중된다는 테스트 원리와 관련된 법칙은?","o":["무어의 법칙","파레토 법칙","머피의 법칙","브룩스의 법칙"],"a":1,"e":"결함 집중 원리는 80%의 결함이 20%의 모듈에서 발생한다는 파레토 법칙과 연결됩니다."},{"sub":"2과목 소프트웨어 개발","q":"소프트웨어의 변경 사항을 체계적으로 관리하는 활동은?","o":["형상 관리","위험 관리","품질 보증","요구사항 관리"],"a":0,"e":"형상 관리는 소스 코드와 문서의 변경 이력을 추적하고 통제하는 활동입니다. Git, SVN 같은 도구를 씁니다."},{"sub":"2과목 소프트웨어 개발","q":"외부 동작은 바꾸지 않고 내부 구조를 개선하는 작업은?","o":["리팩토링","디버깅","컴파일","패키징"],"a":0,"e":"리팩토링은 기능은 그대로 두고 코드를 읽기 쉽고 유지보수하기 좋게 다듬는 작업입니다."},{"sub":"2과목 소프트웨어 개발","q":"정렬된 배열에서 중간값과 비교하며 탐색 범위를 절반씩 줄여나가는 탐색은?","o":["순차 탐색","이진 탐색","해싱","깊이 우선 탐색"],"a":1,"e":"이진 탐색은 정렬된 데이터에서만 쓸 수 있으며 시간복잡도는 O(log n)입니다."},{"sub":"3과목 데이터베이스 구축","q":"릴레이션에서 튜플의 개수를 의미하는 용어는?","o":["차수","카디널리티","도메인","스키마"],"a":1,"e":"카디널리티는 튜플(행)의 개수, 차수(Degree)는 속성(열)의 개수입니다."},{"sub":"3과목 데이터베이스 구축","q":"유일성과 최소성을 모두 만족하는 키는?","o":["슈퍼키","후보키","외래키","복합키"],"a":1,"e":"후보키는 튜플을 유일하게 식별하면서(유일성) 불필요한 속성이 없는(최소성) 키입니다. 슈퍼키는 유일성만 만족합니다."},{"sub":"3과목 데이터베이스 구축","q":"기본키에 NULL이나 중복 값이 올 수 없다는 제약조건은?","o":["참조 무결성","개체 무결성","도메인 무결성","키 무결성"],"a":1,"e":"개체 무결성은 기본키가 NULL이거나 중복될 수 없다는 제약입니다. 외래키 관련은 참조 무결성입니다."},{"sub":"3과목 데이터베이스 구축","q":"다른 릴레이션의 기본키를 참조하는 속성은?","o":["후보키","대체키","외래키","슈퍼키"],"a":2,"e":"외래키는 다른 테이블의 기본키를 참조해 테이블 간 관계를 맺습니다."},{"sub":"3과목 데이터베이스 구축","q":"트랜잭션의 특성 중 '모두 실행되거나 전혀 실행되지 않아야 한다'는 것은?","o":["원자성","일관성","격리성","지속성"],"a":0,"e":"원자성(Atomicity)은 트랜잭션이 쪼개질 수 없는 하나의 단위로 전부 반영되거나 전부 취소되어야 한다는 특성입니다."},{"sub":"3과목 데이터베이스 구축","q":"동시에 실행되는 트랜잭션이 서로 간섭하지 않아야 한다는 특성은?","o":["원자성","일관성","격리성","지속성"],"a":2,"e":"격리성(Isolation)은 한 트랜잭션이 끝나기 전에 다른 트랜잭션이 그 중간 결과를 보거나 간섭하지 못하게 하는 특성입니다."},{"sub":"3과목 데이터베이스 구축","q":"제1정규형(1NF)의 조건으로 옳은 것은?","o":["부분 함수 종속 제거","이행 함수 종속 제거","모든 속성 값이 원자값","결정자가 모두 후보키"],"a":2,"e":"1NF는 모든 속성 값이 더 쪼갤 수 없는 원자값이어야 합니다. 부분 종속 제거는 2NF, 이행 종속 제거는 3NF입니다."},{"sub":"3과목 데이터베이스 구축","q":"제2정규형에서 3정규형으로 가기 위해 제거해야 하는 것은?","o":["원자값이 아닌 속성","부분 함수 종속","이행 함수 종속","다치 종속"],"a":2,"e":"3NF는 이행 함수 종속(A→B, B→C일 때 A→C)을 제거한 상태입니다."},{"sub":"3과목 데이터베이스 구축","q":"결정자가 모두 후보키인 정규형은?","o":["2NF","3NF","BCNF","4NF"],"a":2,"e":"BCNF(보이스-코드 정규형)는 모든 결정자가 후보키여야 하는 정규형입니다."},{"sub":"3과목 데이터베이스 구축","q":"중복 데이터 중 일부만 수정되어 데이터 불일치가 발생하는 이상현상은?","o":["삽입 이상","삭제 이상","갱신 이상","조회 이상"],"a":2,"e":"갱신 이상은 같은 데이터가 여러 곳에 있을 때 일부만 수정되어 모순이 생기는 문제입니다."},{"sub":"3과목 데이터베이스 구축","q":"다음 중 DDL(데이터 정의어)에 해당하는 것은?","o":["SELECT","INSERT","CREATE","GRANT"],"a":2,"e":"DDL은 CREATE, ALTER, DROP처럼 구조를 정의합니다. SELECT와 INSERT는 DML, GRANT는 DCL입니다."},{"sub":"3과목 데이터베이스 구축","q":"다음 중 DML(데이터 조작어)이 아닌 것은?","o":["SELECT","UPDATE","DELETE","ALTER"],"a":3,"e":"ALTER는 테이블 구조를 변경하는 DDL입니다. DML은 SELECT, INSERT, UPDATE, DELETE입니다."},{"sub":"3과목 데이터베이스 구축","q":"사용자에게 권한을 부여하는 SQL 명령은?","o":["GRANT","REVOKE","COMMIT","ROLLBACK"],"a":0,"e":"GRANT는 권한 부여, REVOKE는 권한 회수입니다. 둘 다 DCL입니다."},{"sub":"3과목 데이터베이스 구축","q":"테이블 구조까지 완전히 삭제하는 명령은?","o":["DELETE","TRUNCATE","DROP","REMOVE"],"a":2,"e":"DROP은 테이블 자체를 삭제합니다. DELETE는 데이터만 조건부로 삭제하고, TRUNCATE는 데이터 전부를 삭제하되 구조는 남깁니다."},{"sub":"3과목 데이터베이스 구축","q":"GROUP BY로 묶은 결과에 조건을 걸 때 사용하는 절은?","o":["WHERE","HAVING","ORDER BY","DISTINCT"],"a":1,"e":"HAVING은 그룹화 이후의 조건입니다. WHERE는 그룹화 이전에 행을 거릅니다."},{"sub":"3과목 데이터베이스 구축","q":"SELECT 문의 실행 순서로 옳은 것은?","o":["SELECT → FROM → WHERE → GROUP BY","FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY","WHERE → FROM → SELECT → ORDER BY","FROM → SELECT → WHERE → HAVING"],"a":1,"e":"작성 순서와 달리 FROM부터 실행되고 SELECT는 거의 마지막에 실행됩니다."},{"sub":"3과목 데이터베이스 구축","q":"이름이 '김'으로 시작하는 데이터를 검색하는 조건으로 옳은 것은?","o":["이름 = '김%'","이름 LIKE '김%'","이름 LIKE '%김'","이름 IN '김'"],"a":1,"e":"LIKE와 와일드카드 %를 함께 씁니다. '김%'는 김으로 시작, '%김'은 김으로 끝나는 값입니다."},{"sub":"3과목 데이터베이스 구축","q":"값이 NULL인지 확인하는 올바른 조건은?","o":["컬럼 = NULL","컬럼 == NULL","컬럼 IS NULL","컬럼 LIKE NULL"],"a":2,"e":"NULL은 값이 아니므로 등호로 비교할 수 없습니다. 반드시 IS NULL 또는 IS NOT NULL을 씁니다."},{"sub":"3과목 데이터베이스 구축","q":"뷰(View)에 대한 설명으로 옳지 않은 것은?","o":["가상 테이블이다","뷰 위에 또 다른 뷰를 만들 수 있다","ALTER 문으로 뷰 정의를 변경할 수 있다","보안에 활용할 수 있다"],"a":2,"e":"뷰는 ALTER로 정의를 변경할 수 없고 삭제 후 다시 만들어야 합니다."},{"sub":"3과목 데이터베이스 구축","q":"양쪽 테이블에 모두 존재하는 행만 결합하는 조인은?","o":["INNER JOIN","LEFT OUTER JOIN","RIGHT OUTER JOIN","FULL OUTER JOIN"],"a":0,"e":"INNER JOIN은 조인 조건을 만족하는 행만 가져옵니다. OUTER JOIN은 한쪽 또는 양쪽의 나머지 행도 포함합니다."},{"sub":"4과목 프로그래밍 언어 활용","q":"프로세스 상태 전이 중 '준비 → 실행'을 무엇이라 하는가?","o":["디스패치","타임아웃","블록","웨이크업"],"a":0,"e":"준비 상태의 프로세스가 CPU를 할당받아 실행 상태로 가는 것을 디스패치라고 합니다."},{"sub":"4과목 프로그래밍 언어 활용","q":"입출력이 끝난 프로세스가 이동하는 상태는?","o":["실행","준비","종료","생성"],"a":1,"e":"대기 상태에서 입출력이 완료되면 바로 실행으로 가지 않고 준비 상태로 돌아가 다시 CPU 할당을 기다립니다."},{"sub":"4과목 프로그래밍 언어 활용","q":"운영체제가 프로세스를 관리하기 위해 프로세스 정보를 저장하는 블록은?","o":["PCB","TLB","MMU","DMA"],"a":0,"e":"PCB(Process Control Block)에는 프로세스 번호, 상태, 프로그램 카운터, 레지스터 정보 등이 담깁니다."},{"sub":"4과목 프로그래밍 언어 활용","q":"다음 중 선점형 스케줄링 기법은?","o":["FCFS","SJF","HRN","RR"],"a":3,"e":"RR(라운드 로빈)은 정해진 시간이 지나면 CPU를 빼앗는 선점형입니다. FCFS, SJF, HRN은 비선점형입니다."},{"sub":"4과목 프로그래밍 언어 활용","q":"HRN 스케줄링에서 우선순위를 구하는 식은?","o":["서비스시간 ÷ 대기시간","(대기시간 + 서비스시간) ÷ 서비스시간","대기시간 × 서비스시간","대기시간 − 서비스시간"],"a":1,"e":"HRN은 (대기시간 + 서비스시간) ÷ 서비스시간이 큰 것을 먼저 실행해 오래 기다린 작업을 배려합니다."},{"sub":"4과목 프로그래밍 언어 활용","q":"HRN 방식에서 A(대기 5, 서비스 5), B(대기 10, 서비스 5), C(대기 6, 서비스 2) 중 가장 먼저 실행되는 것은?","o":["A","B","C","모두 같다"],"a":2,"e":"A는 (5+5)/5=2, B는 (10+5)/5=3, C는 (6+2)/2=4이므로 값이 가장 큰 C가 먼저 실행됩니다."},{"sub":"4과목 프로그래밍 언어 활용","q":"교착상태 발생 조건이 아닌 것은?","o":["상호 배제","점유와 대기","선점","환형 대기"],"a":2,"e":"교착상태의 조건은 상호 배제, 점유와 대기, 비선점, 환형 대기입니다. 선점이 가능하면 교착상태가 깨집니다."},{"sub":"4과목 프로그래밍 언어 활용","q":"교착상태를 회피하는 대표적인 알고리즘은?","o":["LRU 알고리즘","은행원 알고리즘","라운드 로빈","다익스트라 최단 경로"],"a":1,"e":"은행원 알고리즘은 자원을 할당해도 안전한 상태가 유지되는지 확인한 뒤 할당해 교착상태를 회피합니다."},{"sub":"4과목 프로그래밍 언어 활용","q":"가장 오랫동안 사용되지 않은 페이지를 교체하는 알고리즘은?","o":["FIFO","LRU","LFU","OPT"],"a":1,"e":"LRU(Least Recently Used)는 최근에 가장 오래 사용되지 않은 페이지를 교체합니다. 사용 횟수가 가장 적은 것은 LFU입니다."},{"sub":"4과목 프로그래밍 언어 활용","q":"OSI 7계층 중 경로 선택(라우팅)을 담당하는 계층은?","o":["데이터링크 계층","네트워크 계층","전송 계층","세션 계층"],"a":1,"e":"네트워크 계층(3계층)은 IP 주소를 바탕으로 목적지까지의 경로를 결정합니다. 라우터가 여기서 동작합니다."},{"sub":"4과목 프로그래밍 언어 활용","q":"OSI 7계층 중 TCP와 UDP가 속한 계층은?","o":["네트워크 계층","전송 계층","세션 계층","응용 계층"],"a":1,"e":"TCP와 UDP는 전송 계층(4계층) 프로토콜로 종단 간 데이터 전달을 담당합니다."},{"sub":"4과목 프로그래밍 언어 활용","q":"스위치가 동작하는 OSI 계층은?","o":["물리 계층","데이터링크 계층","네트워크 계층","전송 계층"],"a":1,"e":"스위치는 MAC 주소를 기반으로 동작하는 2계층(데이터링크) 장비입니다. 라우터는 3계층, 허브는 1계층입니다."},{"sub":"4과목 프로그래밍 언어 활용","q":"OSI 7계층에서 네트워크 계층의 전송 단위는?","o":["비트","프레임","패킷","세그먼트"],"a":2,"e":"물리 계층은 비트, 데이터링크는 프레임, 네트워크는 패킷, 전송 계층은 세그먼트입니다."},{"sub":"4과목 프로그래밍 언어 활용","q":"UDP에 대한 설명으로 옳은 것은?","o":["연결형 프로토콜이다","전송 순서를 보장한다","실시간 스트리밍에 적합하다","3-way handshake를 사용한다"],"a":2,"e":"UDP는 비연결형으로 신뢰성은 낮지만 빠릅니다. 약간의 손실보다 속도가 중요한 스트리밍과 게임에 적합합니다."},{"sub":"4과목 프로그래밍 언어 활용","q":"IPv6 주소의 비트 수는?","o":["32비트","64비트","128비트","256비트"],"a":2,"e":"IPv4는 32비트, IPv6는 128비트입니다."},{"sub":"4과목 프로그래밍 언어 활용","q":"서브넷 마스크가 255.255.255.0(/24)일 때 할당 가능한 호스트 수는?","o":["254개","255개","256개","512개"],"a":0,"e":"호스트 부분이 8비트이므로 2의 8제곱인 256개 중 네트워크 주소와 브로드캐스트 주소 2개를 빼면 254개입니다."},{"sub":"4과목 프로그래밍 언어 활용","q":"IP 주소를 이용해 MAC 주소를 알아내는 프로토콜은?","o":["ARP","RARP","DHCP","DNS"],"a":0,"e":"ARP는 IP로 MAC 주소를 찾고 RARP는 반대로 MAC으로 IP를 찾습니다."},{"sub":"4과목 프로그래밍 언어 활용","q":"도메인 이름을 IP 주소로 변환해주는 프로토콜은?","o":["DHCP","DNS","FTP","SMTP"],"a":1,"e":"DNS는 사람이 읽는 도메인 이름을 IP 주소로 변환합니다. 기본 포트는 53번입니다."},{"sub":"4과목 프로그래밍 언어 활용","q":"전자메일을 전송(발신)할 때 사용하는 프로토콜은?","o":["POP3","IMAP","SMTP","HTTP"],"a":2,"e":"SMTP는 메일을 보낼 때, POP3와 IMAP은 메일을 받을 때 사용합니다."},{"sub":"4과목 프로그래밍 언어 활용","q":"Java 접근 제어자 중 같은 클래스 안에서만 접근할 수 있는 것은?","o":["public","protected","default","private"],"a":3,"e":"private은 선언된 클래스 내부에서만 접근 가능합니다. 범위는 public > protected > default > private 순으로 좁아집니다."},{"sub":"5과목 정보시스템 구축관리","q":"정보보안의 3요소가 아닌 것은?","o":["기밀성","무결성","가용성","익명성"],"a":3,"e":"정보보안 3요소는 기밀성, 무결성, 가용성(CIA)입니다."},{"sub":"5과목 정보시스템 구축관리","q":"DDoS 공격이 주로 침해하는 보안 요소는?","o":["기밀성","무결성","가용성","부인방지"],"a":2,"e":"DDoS는 서비스를 마비시켜 정상 사용자가 이용하지 못하게 하므로 가용성을 침해합니다."},{"sub":"5과목 정보시스템 구축관리","q":"다음 중 대칭키 암호 알고리즘이 아닌 것은?","o":["DES","AES","SEED","RSA"],"a":3,"e":"RSA는 공개키와 개인키를 쓰는 비대칭키 알고리즘입니다. DES, AES, SEED, ARIA는 대칭키입니다."},{"sub":"5과목 정보시스템 구축관리","q":"암호화와 복호화에 서로 다른 키를 사용하는 방식은?","o":["대칭키 암호","비대칭키 암호","해시 함수","블록 암호"],"a":1,"e":"비대칭키(공개키) 암호는 공개키로 암호화하고 개인키로 복호화하는 등 서로 다른 키 쌍을 씁니다."},{"sub":"5과목 정보시스템 구축관리","q":"임의 길이의 입력을 고정 길이로 변환하며 복호화가 불가능한 것은?","o":["대칭키 암호","비대칭키 암호","해시 함수","전자서명"],"a":2,"e":"해시 함수는 일방향 함수로 원래 값을 되돌릴 수 없습니다. SHA, MD5가 대표적이며 비밀번호 저장에 쓰입니다."},{"sub":"5과목 정보시스템 구축관리","q":"입력값에 SQL 구문을 삽입해 데이터베이스를 비정상적으로 조작하는 공격은?","o":["XSS","SQL 인젝션","CSRF","스니핑"],"a":1,"e":"SQL 인젝션은 입력 검증이 부실한 곳에 SQL 코드를 넣어 데이터를 조회하거나 변조하는 공격입니다."},{"sub":"5과목 정보시스템 구축관리","q":"웹페이지에 악성 스크립트를 삽입해 이용자의 브라우저에서 실행되게 하는 공격은?","o":["XSS","SQL 인젝션","Smurf","Ping of Death"],"a":0,"e":"XSS(크로스 사이트 스크립팅)는 게시판 등에 악성 스크립트를 심어 방문자의 정보를 탈취합니다."},{"sub":"5과목 정보시스템 구축관리","q":"네트워크를 오가는 패킷을 몰래 엿보는 공격은?","o":["스푸핑","스니핑","피싱","파밍"],"a":1,"e":"스니핑은 도청입니다. 신분을 위장하는 것은 스푸핑입니다."},{"sub":"5과목 정보시스템 구축관리","q":"3-way handshake를 악용해 연결 요청(SYN)만 대량으로 보내는 공격은?","o":["SYN Flooding","Smurf","Ping of Death","Land Attack"],"a":0,"e":"SYN Flooding은 연결을 끝맺지 않는 요청을 반복해 서버의 연결 자원을 고갈시킵니다."},{"sub":"5과목 정보시스템 구축관리","q":"보안 등급에 따라 시스템이 강제로 접근을 통제하는 방식은?","o":["DAC","MAC","RBAC","ACL"],"a":1,"e":"MAC(강제적 접근통제)는 보안 등급에 근거해 시스템이 통제합니다. DAC는 소유자가, RBAC는 역할에 따라 권한을 부여합니다."},{"sub":"5과목 정보시스템 구축관리","q":"위험 분석을 핵심으로 반복하며 점진적으로 개발하는 생명주기 모형은?","o":["폭포수 모형","프로토타입 모형","나선형 모형","V 모형"],"a":2,"e":"나선형 모형은 계획 수립, 위험 분석, 개발, 고객 평가를 반복합니다. 위험 분석이 핵심 특징입니다."},{"sub":"5과목 정보시스템 구축관리","q":"단계를 순차적으로 진행하며 이전 단계로 되돌아가기 어려운 모형은?","o":["폭포수 모형","나선형 모형","애자일","프로토타입 모형"],"a":0,"e":"폭포수 모형은 선형 순차적 모형으로 요구사항이 명확하고 변경이 적을 때 적합합니다."},{"sub":"5과목 정보시스템 구축관리","q":"애자일 선언의 가치로 옳지 않은 것은?","o":["프로세스와 도구보다 개인과 상호작용","포괄적인 문서보다 작동하는 소프트웨어","계약 협상보다 고객과의 협력","변화 대응보다 계획을 따르기"],"a":3,"e":"애자일은 계획을 따르는 것보다 변화에 대응하는 것을 더 중시합니다."},{"sub":"5과목 정보시스템 구축관리","q":"스크럼에서 1~4주 단위의 짧은 개발 주기를 무엇이라 하는가?","o":["백로그","스프린트","번다운","마일스톤"],"a":1,"e":"스프린트는 스크럼의 반복 개발 주기입니다. 백로그는 해야 할 일의 우선순위 목록입니다."},{"sub":"5과목 정보시스템 구축관리","q":"COCOMO 모델에서 5만 라인 이하의 소규모 프로젝트 유형은?","o":["조직형","반분리형","내장형","분산형"],"a":0,"e":"조직형은 5만 라인 이하, 반분리형은 30만 라인 이하, 내장형은 30만 라인 이상의 대규모 프로젝트입니다."},{"sub":"5과목 정보시스템 구축관리","q":"여러 전문가의 의견을 익명으로 반복 수렴해 비용을 추정하는 기법은?","o":["LOC 기법","델파이 기법","COCOMO","기능 점수"],"a":1,"e":"델파이 기법은 전문가 간 영향력을 배제하려고 익명으로 여러 차례 의견을 모읍니다."},{"sub":"5과목 정보시스템 구축관리","q":"프로젝트 일정에서 임계 경로(Critical Path)에 대한 설명으로 옳은 것은?","o":["가장 짧은 작업 경로이다","가장 긴 작업 경로이다","비용이 가장 적은 경로이다","여유 시간이 가장 많은 경로이다"],"a":1,"e":"임계 경로는 시작부터 끝까지 가장 긴 경로로, 이 경로의 작업이 늦어지면 전체 일정이 늦어집니다."},{"sub":"5과목 정보시스템 구축관리","q":"코드 라인 수와 무관하게 기능의 개수와 복잡도로 규모를 산정하는 기법은?","o":["LOC","기능 점수(FP)","COCOMO","PERT"],"a":1,"e":"기능 점수 기법은 입력, 출력, 조회, 파일 등 기능 요소를 세어 복잡도를 반영해 규모를 산정합니다."},{"sub":"5과목 정보시스템 구축관리","q":"네트워크 트래픽을 감시해 침입을 탐지하는 시스템은?","o":["방화벽","IDS","VPN","NAT"],"a":1,"e":"IDS(침입 탐지 시스템)는 이상 징후를 탐지해 알립니다. 탐지와 함께 차단까지 하면 IPS입니다."},{"sub":"5과목 정보시스템 구축관리","q":"공중망을 이용하면서도 암호화를 통해 전용망처럼 쓰는 기술은?","o":["VPN","NAT","DMZ","SSO"],"a":0,"e":"VPN(가상 사설망)은 인터넷 같은 공용망 위에 암호화된 터널을 만들어 안전하게 통신합니다."}]},{"id":"ksure-mgmt","name":"무역보험공사 경영학","exam":"2026-09-19","note":"필기 400점 · 직무능력평가 140 + 논술 100 + 직업공통 60 + 영어 100(성적 대체)","notes":[{"sub":"보험학","title":"① 보험의 원리","body":"## 보험이 성립하는 이유\n개인에게 사고는 예측 불가능하지만, **많은 사람을 모으면 전체 사고 발생률은 안정적으로 예측**됩니다. 이것이 보험의 출발점입니다.\n\n### 대수의 법칙\n관찰 대상이 많아질수록 실제 발생률이 이론적 확률에 가까워집니다.\n> 보험사가 계약자를 많이 모아야 하는 이유입니다. 계약이 적으면 예측이 빗나가 보험사가 망합니다.\n\n## 보험의 3대 원칙\n### 수지상등의 원칙\n> **보험료 총액 = 보험금 총액 + 사업비**\n보험사 전체로 보아 들어오는 돈과 나가는 돈이 균형을 이루어야 합니다. **단체 기준**의 원칙입니다.\n\n### 급부·반대급부 균등의 원칙\n> **개별 계약자가 내는 보험료 = 사고발생확률 × 보험금**\n**개인 기준**의 원칙입니다. 위험이 큰 사람이 더 많이 내야 공평합니다.\n\n> 두 원칙의 차이는 **단체냐 개인이냐**입니다. 이 구분이 시험에 나옵니다.\n\n### 이득금지의 원칙\n보험으로 이익을 얻어서는 안 됩니다. 손해보험에서 실손보상의 근거가 됩니다.\n> 이익이 생기면 일부러 사고를 내려는 유인이 생기기 때문입니다.\n\n## 보험의 기능\n- **순기능**: 위험 이전과 분산, 경제적 안정, 신용 보완, 자본 형성\n- **역기능**: 도덕적 해이 유발, 보험사기, 사업비 부담\n\n> 무역보험은 특히 **신용 보완** 기능이 핵심입니다. 수출 대금을 못 받을 위험이 보험으로 덮이면 은행이 수출기업에 돈을 빌려줄 수 있게 됩니다.\n\n## 보험가능 위험의 요건\n- 다수의 동질적 위험이 존재할 것\n- 손실이 우연할 것 (고의가 아닐 것)\n- 손실이 명확히 측정 가능할 것\n- 손실이 지나치게 거대하지 않을 것\n- 보험료가 경제적으로 부담 가능할 것\n\n> 전쟁이나 대규모 자연재해는 손실이 거대하고 동시다발적이라 민영보험이 감당하기 어렵습니다. 그래서 **국가가 개입**합니다. 무역보험공사가 존재하는 이유이기도 합니다.\n\n▸ 대수의 법칙: 표본이 클수록 실제 결과가 확률에 수렴하는 현상.\n▸ 실손보상: 실제 손해액만큼만 보상하는 원칙.\n▸ 위험 이전: 개인이 감당하기 어려운 위험을 보험사로 넘기는 것.","alt":"## 보험이 왜 성립함?\n개인한텐 사고가 언제 날지 모름. 근데 **1만 명 모으면 전체 몇 건 날지는 꽤 정확히 예측됨.**\n이게 보험의 전부임.\n\n### 대수의 법칙\n많이 모을수록 실제 발생률이 이론 확률에 가까워짐.\n> 그래서 보험사는 계약자를 많이 모아야 함. 적으면 예측이 빗나가서 망함.\n\n## 3대 원칙 ⭐\n### 수지상등\n> **보험료 총액 = 보험금 총액 + 사업비**\n**단체 기준**. 회사 전체로 들어온 돈 = 나간 돈.\n\n### 급부·반대급부 균등\n> **개인 보험료 = 사고확률 × 보험금**\n**개인 기준**. 위험한 사람이 더 내야 공평함.\n\n> 🚨 둘 차이 = **단체냐 개인이냐.** 이거 딱 하나로 구분됨. 무조건 나옴.\n\n### 이득금지\n보험으로 **돈 벌면 안 됨.**\n> 이익이 나면 일부러 사고 내려 함. 그래서 실손보상이 나옴.\n\n## 보험 기능\n- 순기능: 위험 이전·분산, 경제 안정, **신용 보완**, 자본 형성\n- 역기능: 도덕적 해이, 보험사기, 사업비\n\n> 🚨 무보 논술 대비로 **신용 보완**을 꼭 기억하셈.\n> 수출했는데 돈 떼일까 봐 은행이 대출을 안 해줌 → 무역보험이 그 위험을 덮어줌 → 은행이 대출해줌\n> 보험이 **금융을 가능하게 만드는** 구조임. 이게 무역보험 존재 이유의 절반임.\n\n## 보험가능 위험 요건\n다수의 동질적 위험 / 손실이 **우연** / 측정 가능 / **지나치게 거대하지 않을 것** / 보험료 부담 가능\n\n> 🚨 마지막이 핵심임.\n> 전쟁, 대규모 재해는 **한 방에 다 터짐**. 민영보험이 감당 못 함.\n> 그래서 **국가가 함.** 무역보험공사가 왜 공기업인지가 여기서 나옴. 논술 소재로 쓰기 좋음.\n\n▸ 실손보상: 실제 손해만큼만 줌."},{"sub":"보험학","title":"② 보험계약의 기본원칙","body":"## 최대선의의 원칙\n일반 계약보다 훨씬 높은 수준의 성실을 요구합니다.\n> 보험사는 계약자가 말해주는 정보에 전적으로 의존합니다. 계약자가 자기 건강이나 사업 상태를 숨기면 보험사는 알 방법이 없습니다. 그래서 **고지의무**를 강하게 지웁니다.\n\n- **고지의무**: 계약 체결 시 중요사항을 알릴 의무\n- **통지의무**: 계약 후 위험이 현저히 변경·증가하면 알릴 의무\n\n> 위반하면 보험사가 계약을 해지할 수 있습니다.\n\n## 피보험이익의 원칙\n> 보험 목적물에 대해 **경제적 이해관계**를 가진 사람만 보험에 들 수 있습니다.\n\n남의 집에 화재보험을 들 수 없습니다. 허용하면 남의 집에 불을 지를 유인이 생기기 때문입니다.\n- **도박화 방지**\n- 도덕적 위험 억제\n- 보상 한도의 기준\n\n> 손해보험은 계약 시점과 사고 시점 모두에 피보험이익이 있어야 하고, 생명보험은 계약 시점에만 있으면 됩니다.\n\n## 실손보상의 원칙\n실제 손해액을 넘어 보상받을 수 없습니다. 이득금지 원칙의 구체적 표현입니다.\n> 이를 지키기 위한 장치가 셋 있습니다.\n\n### 보험자대위\n보험금을 지급한 보험사가 계약자의 권리를 넘겨받는 것입니다.\n- **잔존물대위**: 손해를 입은 물건의 잔존물에 대한 권리\n- **청구권대위**: 제3자에 대한 손해배상청구권\n\n> 사고를 낸 제3자가 따로 있는데 보험금까지 받으면 이중 이득이 됩니다. 그래서 보험사가 그 청구권을 가져가 대신 행사합니다.\n\n### 중복보험과 비례분담\n여러 보험에 가입해도 실제 손해액을 넘어 받을 수 없고, 보험사들이 보험금액 비율로 나눠 부담합니다.\n\n### 초과보험과 일부보험\n- **초과보험**: 보험금액이 보험가액을 넘음. 초과 부분은 무효\n- **일부보험**: 보험금액이 보험가액에 못 미침. **비례보상**됨\n\n> 보험가액 1억 물건에 5천만원만 가입하고 4천만원 손해가 나면, 4천만원 전액이 아니라 절반인 2천만원만 받습니다. 이 계산이 자주 나옵니다.\n\n▸ 보험가액: 목적물의 실제 경제적 가치.\n▸ 보험금액: 계약상 보상 한도.\n▸ 대위: 남의 권리를 대신 넘겨받아 행사하는 것.","alt":"## 최대선의의 원칙\n일반 계약보다 **훨씬 빡센 성실**을 요구함.\n> 왜? 보험사는 **계약자 말만 믿을 수밖에 없음.** 내가 지병 숨기면 알 방법이 없음.\n> 그래서 **고지의무**를 세게 걸어둠.\n\n- **고지의무**: 계약할 때 중요사항 알릴 의무\n- **통지의무**: 계약 후 위험이 커지면 알릴 의무\n\n어기면 보험사가 **계약 해지** 가능.\n\n## 피보험이익 ⭐\n> **그 물건에 경제적 이해관계가 있는 사람만** 보험 가능.\n\n🚨 왜 있냐면 **남의 집에 화재보험 들면 불 지를 놈이 나오니까.**\n- 도박화 방지 / 도덕적 위험 억제 / 보상 한도 기준\n\n> 손해보험: 계약 시점 + 사고 시점 **둘 다** 필요\n> 생명보험: **계약 시점만** 있으면 됨\n\n## 실손보상 + 3대 장치 ⭐\n\n### 보험자대위\n보험금 준 보험사가 **계약자 권리를 가져감.**\n- **잔존물대위**: 망가진 물건의 남은 값\n- **청구권대위**: 제3자한테 손해배상 청구할 권리\n\n> 🚨 왜? 사고 낸 놈이 따로 있는데 거기서도 받고 보험금도 받으면 **두 번 먹는** 거잖음.\n> 그래서 보험사가 그 권리 가져가서 대신 받아냄.\n\n### 중복보험\n여러 개 들어도 실제 손해 넘게 못 받음. 보험사끼리 **보험금액 비율로 나눠서** 냄.\n\n### 초과보험 vs 일부보험 ⭐\n- **초과보험**: 보험금액 > 보험가액 → 초과분 무효\n- **일부보험**: 보험금액 < 보험가액 → **비례보상**\n\n> 🚨 계산 나옴\n> 물건 값(보험가액) 1억, 가입금액 5천만원, 손해 4천만원\n> → 4천만원 다 받는 거 아님. **가입 비율 50%만** → **2천만원**\n> \"손해액이 가입금액보다 작으니 전액 받는다\" → 오답. 이거 낚임.\n\n▸ 보험가액: 물건 실제 가치.\n▸ 보험금액: 계약상 보상 한도."},{"sub":"보험학","title":"③ 역선택과 도덕적 해이","body":"## 정보 비대칭에서 나오는 두 문제\n보험은 계약자가 자기 위험을 더 잘 아는 구조입니다. 여기서 두 가지 문제가 생깁니다.\n\n### 역선택 (계약 **전**)\n> 위험이 높은 사람일수록 보험에 가입하려 합니다.\n\n보험사가 평균 위험을 기준으로 보험료를 매기면, 위험이 낮은 사람은 비싸다고 느껴 빠져나가고 위험이 높은 사람만 남습니다. 그러면 보험료를 또 올려야 하고, 그러면 또 빠져나갑니다.\n> 이 악순환이 극단으로 가면 시장 자체가 붕괴합니다. 이를 **레몬시장**이라고 합니다.\n\n**감춰진 특성**의 문제입니다.\n\n### 도덕적 해이 (계약 **후**)\n> 보험에 든 뒤 위험을 줄이려는 노력을 게을리합니다.\n\n화재보험에 들었으니 소화기 점검을 안 하는 식입니다. 고의로 사고를 내는 보험사기와는 구분됩니다.\n\n**감춰진 행동**의 문제입니다.\n\n> 구분 기준은 하나입니다. **계약 전이면 역선택, 계약 후면 도덕적 해이.**\n\n## 대응 수단\n### 역선택 대응\n- **언더라이팅(계약심사)**: 위험을 평가해 인수 여부와 보험료를 결정\n- 고지의무 부과\n- 위험집단별 요율 차등\n- 단체보험, 강제가입\n\n### 도덕적 해이 대응\n- **자기부담금(공제)**: 손해의 일부를 계약자가 부담하게 함\n- **공동보험조항**: 손해의 일정 비율만 보상\n- 보상한도 설정\n- 사고 이력에 따른 요율 조정\n\n> 두 대응의 성격이 다릅니다. 역선택은 **누구를 받을지 가려내는 것**이고, 도덕적 해이는 **가입 후에도 조심하게 만드는 것**입니다.\n\n## 무역보험에서의 적용\n수출기업이 부실한 바이어와 거래하면서 보험만 믿는 상황이 도덕적 해이입니다.\n> 그래서 무역보험공사는 **해외 수입자 신용조사**를 하고 신용등급에 따라 인수 한도와 보험료율을 다르게 적용합니다. 또한 손실의 일정 비율을 수출기업이 부담하게 하는 **부보율** 제도를 둡니다.\n\n▸ 언더라이팅: 위험을 평가해 인수 여부와 조건을 정하는 일.\n▸ 자기부담금: 손해 중 계약자가 스스로 부담하는 몫.\n▸ 부보율: 손실 중 보험으로 보상되는 비율.","alt":"## 정보 비대칭이 낳는 두 문제\n보험은 **계약자가 자기 위험을 더 잘 아는** 구조임. 여기서 두 가지가 터짐.\n\n### 역선택 = 계약 **전** ⭐\n> **위험 높은 놈이 더 열심히 가입함.**\n
