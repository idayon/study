 옳은 것은?","o":["대금을 지급해야 선적서류를 인도한다","환어음을 인수하면 서류를 인도하고 대금은 만기에 받는다","은행이 대금 지급을 보증한다","선적 전에 대금을 받는다"],"a":1,"e":"D/A는 수입자가 환어음을 인수하는 것만으로 서류를 받아 물품을 인수하고 대금은 만기에 지급합니다. 신용을 공여하는 방식이라 수출자의 위험이 D/P보다 큽니다."},{"sub":"국제금융론","q":"브레튼우즈 체제의 특징으로 옳은 것은?","o":["완전한 변동환율제였다","달러를 금에 연동하고 각국 통화를 달러에 고정했다","금본위제를 완전히 폐지했다","각국이 자유롭게 환율을 결정했다"],"a":1,"e":"브레튼우즈 체제는 금환본위제로 미국이 달러의 금 태환을 보장하고 다른 나라는 달러에 환율을 고정했습니다. 1971년 금 태환 정지로 붕괴했고 이후 킹스턴 체제에서 변동환율제가 공식 인정되었습니다."},{"sub":"국제금융론","q":"외환시장에서 현물환 거래의 일반적인 결제일은?","o":["당일","거래일로부터 2영업일 이내","1개월 후","3개월 후"],"a":1,"e":"현물환은 통상 거래일로부터 2영업일 이내에 결제됩니다. 그보다 먼 미래의 결제를 미리 약정하는 것이 선물환입니다."},{"sub":"국제금융론","q":"환위험 관리에서 결제통화를 자국 통화로 지정하는 방법이 속하는 분류는?","o":["내부적 관리기법","외부적 관리기법","파생상품 활용","재보험"],"a":0,"e":"결제통화 조정은 회사 내부의 계약 조건으로 해결하는 방법이라 내부적 기법입니다. 선물환, 옵션, 스왑처럼 금융시장을 이용하는 것이 외부적 기법입니다."},{"sub":"국제금융론","q":"헤지 거래의 목적으로 가장 적절한 것은?","o":["수익을 극대화하는 것","가격 변동에 따른 결과를 안정시키는 것","시장을 조작하는 것","거래 횟수를 늘리는 것"],"a":1,"e":"헤지는 보유 자산의 손실 가능성을 반대 포지션으로 상쇄해 결과의 변동성을 줄이는 것입니다. 유리한 방향의 이익까지 포기하게 되므로 수익 극대화와는 목적이 다릅니다."},{"sub":"국제금융론","q":"외환보유액이 국제수지표에서 분류되는 항목은?","o":["경상수지","자본수지","금융계정의 준비자산","이전소득수지"],"a":2,"e":"외환보유액은 금융계정 내 준비자산으로 분류됩니다. 대외 지급 능력을 유지하고 외환시장 안정을 위해 통화당국이 보유하는 자산입니다."},{"sub":"국제금융론","q":"자유로운 자본이동과 고정환율을 동시에 유지하려면 포기해야 하는 것은?","o":["재정정책","독자적 통화정책","무역정책","외환보유액"],"a":1,"e":"삼불원칙에 따라 셋 중 둘만 선택할 수 있습니다. 자본이 자유롭게 이동하는 상태에서 환율을 고정하려면 금리를 상대국에 맞춰야 하므로 독자적 통화정책을 포기해야 합니다."},{"sub":"경영학","q":"1,000만원을 연 8% 복리로 2년간 예치했을 때 원리금은?","o":["1,080만원","1,160만원","1,166.4만원","1,200만원"],"a":2,"e":"복리는 원금에 붙은 이자에 다시 이자가 붙습니다. 1,000 × 1.08 × 1.08 = 1,166.4만원입니다. 단리라면 1,160만원이므로 차액 6.4만원이 복리 효과입니다."},{"sub":"경영학","q":"이자율이 연 10%일 때 2년 후 받게 될 121만원의 현재가치는?","o":["100만원","105만원","110만원","121만원"],"a":0,"e":"현재가치는 미래가치를 (1+이자율)의 기간 제곱으로 나눕니다. 121 ÷ 1.21 = 100만원입니다. 기간이 2년이므로 1.1로 두 번 나눠야 합니다."},{"sub":"경영학","q":"고정비 3,000만원, 단위당 판매가 5만원, 단위당 변동비 3만원일 때 손익분기점 판매량은?","o":["1,000개","1,500개","2,000개","3,000개"],"a":1,"e":"단위당 공헌이익은 5만 − 3만 = 2만원입니다. 3,000만 ÷ 2만 = 1,500개입니다."},{"sub":"경영학","q":"판매가 5만원, 변동비 3만원인 제품의 공헌이익률은?","o":["30%","40%","50%","60%"],"a":1,"e":"공헌이익률은 단위당 공헌이익을 판매가로 나눈 값입니다. 2만 ÷ 5만 = 40%입니다. 금액 기준 손익분기점을 구할 때 이 값으로 고정비를 나눕니다."},{"sub":"경영학","q":"고정비가 3,000만원이고 공헌이익률이 40%일 때 손익분기점 매출액은?","o":["6,000만원","7,500만원","9,000만원","1억 2,000만원"],"a":1,"e":"손익분기점 매출액은 고정비를 공헌이익률로 나눕니다. 3,000만 ÷ 0.4 = 7,500만원입니다."},{"sub":"경영학","q":"고정비 3,000만원, 단위당 공헌이익 2만원인 기업이 목표이익 1,000만원을 달성하려면 몇 개를 팔아야 하는가?","o":["1,500개","1,750개","2,000개","2,500개"],"a":2,"e":"(고정비 + 목표이익)을 단위당 공헌이익으로 나눕니다. (3,000만 + 1,000만) ÷ 2만 = 2,000개입니다."},{"sub":"경영학","q":"자기자본비용 12%, 세후 타인자본비용 9%, 자기자본 비중 30%, 타인자본 비중 70%일 때 WACC는?","o":["9.6%","9.9%","10.5%","11.1%"],"a":1,"e":"0.3 × 12% + 0.7 × 9% = 3.6% + 6.3% = 9.9%입니다. 타인자본비용은 이자의 절세효과를 반영해 세후로 계산합니다."},{"sub":"경영학","q":"유동자산 1,200만원, 유동부채 800만원일 때 유동비율은?","o":["66.7%","120%","150%","400%"],"a":2,"e":"유동비율은 유동자산 ÷ 유동부채입니다. 1,200 ÷ 800 = 150%이며 일반적으로 200% 이상을 양호하게 봅니다."},{"sub":"경영학","q":"당기순이익 400억원, 자기자본 2,000억원일 때 ROE는?","o":["10%","20%","25%","40%"],"a":1,"e":"ROE는 당기순이익 ÷ 자기자본입니다. 400 ÷ 2,000 = 20%입니다. 총자산으로 나누면 ROA가 됩니다."},{"sub":"경영학","q":"취득원가 900만원, 잔존가치 100만원, 내용연수 4년인 자산의 정액법 연간 감가상각비는?","o":["180만원","200만원","225만원","250만원"],"a":1,"e":"(취득원가 − 잔존가치) ÷ 내용연수이므로 (900 − 100) ÷ 4 = 200만원입니다. 잔존가치를 빼지 않으면 225만원이 나오므로 주의해야 합니다."},{"sub":"경영학","q":"영업이익 200억원, 이자비용 250억원인 기업의 이자보상비율에 대한 해석으로 옳은 것은?","o":["영업이익으로 이자를 충분히 감당한다","영업이익으로 이자도 갚지 못한다","부채가 전혀 없다","순이익이 반드시 흑자이다"],"a":1,"e":"이자보상비율은 영업이익 ÷ 이자비용으로 0.8입니다. 1 미만이면 본업에서 번 돈으로 이자조차 못 내는 상태이며 흔히 한계기업으로 분류됩니다."},{"sub":"경영학","q":"듀폰 분석에서 ROE를 분해하는 세 요소로 옳은 것은?","o":["매출액순이익률, 총자산회전율, 재무레버리지","유동비율, 부채비율, 이자보상비율","매출액, 영업이익, 순이익","자산, 부채, 자본"],"a":0,"e":"ROE는 수익성, 활동성, 레버리지의 곱으로 분해됩니다. ROE가 높아도 그것이 부채를 늘려 만든 결과인지 구분할 수 있게 해줍니다."},{"sub":"경영학","q":"NPV법과 IRR법의 결론이 상충할 때 일반적으로 따르는 기준은?","o":["IRR법","NPV법","회수기간법","수익성지수법"],"a":1,"e":"NPV는 가치가산의 원칙이 성립하고 기업가치 극대화 목표에 부합해 이론적으로 우월합니다. IRR은 복수해가 나올 수 있고 재투자수익률 가정이 비현실적입니다."},{"sub":"경영학","q":"회수기간법의 한계로 옳은 것은?","o":["계산이 복잡하다","화폐의 시간가치를 무시한다","현금흐름을 사용하지 않는다","위험을 과대평가한다"],"a":1,"e":"회수기간법은 시간가치를 반영하지 않고 회수 이후의 현금흐름도 고려하지 않습니다. 이를 보완한 것이 할인회수기간법입니다."},{"sub":"경영학","q":"MM의 자본구조 무관련 명제(법인세가 없는 경우)의 결론으로 옳은 것은?","o":["부채가 많을수록 기업가치가 커진다","자본구조는 기업가치에 영향을 주지 않는다","자기자본만 사용해야 한다","부채비율 100%가 최적이다"],"a":1,"e":"부채를 늘리면 값싼 타인자본 비중이 커지지만 주주 위험이 커져 자기자본비용이 올라 상쇄됩니다. 법인세를 고려하면 절세효과 때문에 결론이 달라집니다."},{"sub":"경영학","q":"발생주의 회계에서 12월에 재화를 인도하고 대금은 다음 해 1월에 받았다면 매출 인식 시점은?","o":["12월","1월","분할하여 인식","인식하지 않는다"],"a":0,"e":"발생주의는 현금 수수와 무관하게 거래가 발생한 시점에 인식합니다. 12월에 매출과 매출채권을 계상하고 1월에 현금이 들어오면 매출채권이 줄어듭니다."},{"sub":"경영학","q":"장부상 이익이 발생했음에도 현금이 부족해 도산하는 현상은?","o":["흑자도산","적자도산","분식회계","감자"],"a":0,"e":"매출채권은 이익으로 잡히지만 현금은 아직 들어오지 않았습니다. 회수가 늦어지면 이익이 나도 지급 능력이 없어 도산할 수 있어 현금흐름표를 함께 봐야 합니다."},{"sub":"경영학","q":"현금흐름표의 세 가지 활동 구분으로 옳은 것은?","o":["영업활동, 투자활동, 재무활동","생산활동, 판매활동, 관리활동","단기활동, 중기활동, 장기활동","국내활동, 해외활동, 기타활동"],"a":0,"e":"영업활동은 본업의 현금, 투자활동은 자산 취득과 처분, 재무활동은 자금 조달과 상환입니다. 영업활동 현금흐름이 계속 음수이면 위험 신호입니다."},{"sub":"경영학","q":"물가가 지속 상승할 때 선입선출법을 적용한 결과로 옳은 것은?","o":["매출원가가 높아지고 이익이 낮아진다","매출원가가 낮아지고 이익과 기말재고가 높아진다","기말재고가 과소평가된다","후입선출법과 결과가 같다"],"a":1,"e":"싼 재고가 먼저 팔린 것으로 보므로 매출원가가 낮고 이익이 커집니다. 남은 재고는 최근의 비싼 것이라 기말재고도 높게 평가됩니다."},{"sub":"경영학","q":"한국채택국제회계기준에서 인정되지 않는 재고자산 평가방법은?","o":["선입선출법","가중평균법","개별법","후입선출법"],"a":3,"e":"후입선출법은 실제 물량 흐름과 맞지 않고 기말재고가 오래된 원가로 남아 재무상태를 왜곡한다는 이유로 K-IFRS에서 허용되지 않습니다."},{"sub":"경영학","q":"감가상각의 성격으로 옳은 것은?","o":["자산의 시장가치를 평가하는 절차","취득원가를 사용 기간에 배분하는 절차","현금을 적립하는 절차","부채를 상환하는 절차"],"a":1,"e":"감가상각은 원가 배분 절차이지 가치 평가가 아닙니다. 실제 현금이 나가지 않으므로 현금흐름표에서 순이익에 다시 더해집니다."},{"sub":"경영학","q":"재무상태표에 관한 설명으로 옳은 것은?","o":["일정 기간의 경영성과를 나타낸다","일정 시점의 재무상태를 나타낸다","현금의 유출입을 나타낸다","자본의 변동 내역을 나타낸다"],"a":1,"e":"재무상태표만 특정 시점을 보여주는 저량 개념이고 손익계산서, 현금흐름표, 자본변동표는 모두 일정 기간을 다루는 유량 개념입니다."},{"sub":"경영학","q":"포터의 본원적 경쟁전략에 해당하지 않는 것은?","o":["원가우위 전략","차별화 전략","집중화 전략","다각화 전략"],"a":3,"e":"본원적 경쟁전략은 원가우위, 차별화, 집중화 세 가지입니다. 다각화는 앤소프 매트릭스의 성장전략에 속합니다."},{"sub":"경영학","q":"BCG 매트릭스에서 시장성장률이 낮고 상대적 시장점유율이 높은 사업의 역할은?","o":["추가 투자 대상","현금 창출원","즉시 철수 대상","선택적 투자 대상"],"a":1,"e":"현금젖소는 투자 부담이 적으면서 안정적으로 현금을 만들어냅니다. 그 자금을 별이나 물음표 사업에 투입하는 것이 기본 흐름입니다."},{"sub":"경영학","q":"매트릭스 조직의 대표적인 단점으로 옳은 것은?","o":["전문성 축적이 어렵다","명령일원화 원칙이 지켜지지 않아 갈등이 생긴다","인력 배치가 경직적이다","환경 변화 대응이 느리다"],"a":1,"e":"기능과 프로젝트 두 계통에서 지시를 받아 보고 체계가 이원화됩니다. 전문성 축적과 인력 활용의 유연성은 오히려 장점입니다."},{"sub":"경영학","q":"브룸의 기대이론에서 세 요소 중 하나라도 0이면 동기의 크기는?","o":["최대가 된다","0이 된다","평균이 된다","변하지 않는다"],"a":1,"e":"기대, 수단성, 유인가의 곱으로 결정되므로 하나라도 0이면 전체가 0입니다. 아무리 노력해도 보상이 없다고 믿으면 수단성이 0이 되어 동기가 사라집니다."},{"sub":"경영학","q":"피들러의 상황적합이론에서 상황이 매우 호의적이거나 매우 비호의적일 때 효과적인 리더십은?","o":["과업지향적 리더십","관계지향적 리더십","위임형 리더십","서번트 리더십"],"a":0,"e":"양극단에서는 과업지향형이, 중간 상황에서는 관계지향형이 효과적입니다. 피들러는 리더 유형이 잘 바뀌지 않는다고 보아 상황에 맞는 사람을 배치하라고 제안했습니다."},{"sub":"경영학","q":"변혁적 리더십의 구성요소에 해당하지 않는 것은?","o":["이상적 영향력(카리스마)","영감적 동기부여","지적 자극","조건적 보상"],"a":3,"e":"조건적 보상은 성과와 보상을 교환하는 거래적 리더십의 요소입니다. 변혁적 리더십은 카리스마, 영감적 동기부여, 지적 자극, 개별적 배려로 구성됩니다."},{"sub":"경영학","q":"신제품을 높은 가격에 출시한 뒤 점차 낮추는 전략이 유효한 조건은?","o":["경쟁자의 진입이 쉬울 때","규모의 경제 효과가 클 때","가격에 둔감한 초기 수용층이 존재할 때","수요가 매우 탄력적일 때"],"a":2,"e":"스키밍은 혁신 수용층에서 마진을 회수하고 경쟁자 진입이 어려울 때 유효합니다. 규모의 경제가 크고 수요가 탄력적이면 침투가격이 적합합니다."},{"sub":"경영학","q":"촉진 수단 중 신뢰도가 높지만 기업이 내용을 통제하기 어려운 것은?","o":["광고","인적판매","판매촉진","PR(홍보)"],"a":3,"e":"PR은 언론이라는 제3자를 통하므로 신뢰도가 높지만 보도 내용을 통제할 수 없습니다. 광고는 통제 가능하지만 광고임을 알기에 신뢰도가 낮습니다."},{"sub":"경영학","q":"유통 집약도에서 전문품에 적합한 방식은?","o":["집약적 유통","선택적 유통","전속적 유통","무점포 유통"],"a":2,"e":"전문품은 브랜드 충성도가 높아 소비자가 특정 점포를 찾아가므로 전속적 유통이 맞습니다. 편의품은 집약적, 선매품은 선택적 유통이 적합합니다."},{"sub":"경영학","q":"EOQ 모형에서 경제적 주문량이 결정되는 지점의 특징으로 옳은 것은?","o":["주문비용이 최소가 된다","재고유지비용이 최소가 된다","연간 주문비용과 연간 재고유지비용이 같아진다","총비용이 최대가 된다"],"a":2,"e":"주문량이 늘면 주문비용은 줄고 재고유지비용은 늘어납니다. 두 비용의 합이 최소가 되는 지점에서 두 값이 일치합니다."},{"sub":"경영학","q":"JIT 생산방식의 특징으로 옳은 것은?","o":["푸시 방식이며 재고를 넉넉히 유지한다","풀 방식이며 재고를 최소화한다","생산계획에서 역산해 자재를 준비한다","공급 중단에 강하다"],"a":1,"e":"JIT는 후공정이 필요한 만큼 요청하는 풀 방식으로 재고를 낭비로 봅니다. 재고가 없어 공급망이 끊기면 라인이 즉시 멈추는 취약성이 있습니다. 역산해 자재를 준비하는 것은 MRP입니다."},{"sub":"경영학","q":"소비자 수요의 작은 변동이 유통 단계를 거슬러 올라가며 증폭되는 현상은?","o":["채찍효과","규모의 경제","파레토 법칙","학습곡선 효과"],"a":0,"e":"수요 예측 왜곡, 일괄주문, 할인 행사, 품절 우려로 인한 과대주문이 원인입니다. 정보 공유와 상시저가정책으로 완화할 수 있습니다."},{"sub":"경영학","q":"6시그마가 목표로 하는 품질 수준은?","o":["100만 개당 결함 34개","100만 개당 결함 3.4개","1만 개당 결함 3.4개","1,000개당 결함 3.4개"],"a":1,"e":"100만 개당 3.4개의 결함을 목표로 합니다. 추진 절차는 정의, 측정, 분석, 개선, 관리의 DMAIC를 따릅니다."},{"sub":"경영학","q":"품질비용 중 고객에게 인도된 후 발견된 불량으로 발생하는 비용은?","o":["예방비용","평가비용","내부실패비용","외부실패비용"],"a":3,"e":"외부실패비용은 리콜과 클레임, 브랜드 신뢰 손상까지 포함해 네 가지 중 가장 큽니다. 그래서 예방에 미리 투자하는 것이 전체 비용을 줄입니다."},{"sub":"경영학","q":"인사평가에서 한 가지 두드러진 특성이 다른 항목 전반에 영향을 미치는 오류는?","o":["관대화 경향","중심화 경향","후광효과","최근효과"],"a":2,"e":"후광효과는 인상적인 한 특성이 전체 평가를 물들이는 오류입니다. 항목별 독립 평가 훈련이나 행동기준평정척도로 완화할 수 있습니다."},{"sub":"경영학","q":"직무 수행에 필요한 사람의 자격요건을 정리한 문서는?","o":["직무기술서","직무명세서","직무평가표","조직도"],"a":1,"e":"직무기술서는 일의 내용과 책임, 작업조건을 담고 직무명세서는 요구되는 학력, 경험, 지식, 기능을 담습니다."},{"sub":"경영학","q":"앤소프 매트릭스에서 기존 시장에 신제품을 출시하는 전략은?","o":["시장침투","시장개발","제품개발","다각화"],"a":2,"e":"기존 시장에 신제품을 내면 제품개발입니다. 기존 제품을 새 시장에 팔면 시장개발, 둘 다 새로우면 다각화로 위험이 가장 큽니다."},{"sub":"경영학","q":"호손실험이 밝혀낸 핵심 결론으로 옳은 것은?","o":["물리적 작업조건이 생산성을 좌우한다","임금 수준이 유일한 동기부여 요인이다","비공식 집단과 심리적 요인이 생산성에 영향을 준다","분업의 정도가 생산성을 결정한다"],"a":2,"e":"조명 밝기 같은 물리적 조건보다 관심받고 있다는 인식과 동료 관계가 크게 작용했습니다. 이것이 인간관계론의 출발점입니다."},{"sub":"경영학","q":"자기주식 취득에 관한 현행 상법상 설명으로 옳은 것은?","o":["어떤 경우에도 금지된다","배당가능이익의 범위에서 취득할 수 있다","제한 없이 취득할 수 있다","주주 전원의 동의가 필요하다"],"a":1,"e":"2011년 개정 상법은 배당가능이익 범위 내에서 자기주식 취득을 허용했습니다. 자본충실을 해치지 않는 선에서 제한한 것입니다."},{"sub":"경영학","q":"재무관리의 목표로 가장 적절한 것은?","o":["당기순이익의 극대화","매출액의 극대화","기업가치(주주 부)의 극대화","시장점유율의 극대화"],"a":2,"e":"이익은 회계 기준에 따라 달라질 수 있고 화폐의 시간가치와 위험을 반영하지 못합니다. 그래서 재무관리는 기업가치 극대화를 목표로 삼습니다."},{"sub":"경영학","q":"사업부제 조직의 단점으로 옳은 것은?","o":["책임 소재가 불분명하다","사업부 간 기능이 중복되어 자원이 낭비될 수 있다","환경 변화 대응이 느리다","제품별 전문화가 어렵다"],"a":1,"e":"사업부제는 책임이 명확하고 대응이 빠르지만 인사, 회계 같은 기능이 사업부마다 중복되어 자원이 낭비됩니다."},{"sub":"국제금융론","q":"원달러 환율이 1,250원에서 1,375원으로 변했다면 원화의 절하율은?","o":["약 9.1%","약 10.0%","약 11.1%","약 12.5%"],"a":0,"e":"원화 절하율은 외화 1단위를 얻는 데 드는 원화 증가분이 아니라 원화 가치 기준으로 계산합니다. 1,250/1,375 = 0.909이므로 원화 가치가 약 9.1% 떨어졌습니다. 환율 상승률 10%와 절하율이 다르다는 점이 함정입니다."},{"sub":"국제금융론","q":"국내 물가상승률이 5%, 미국 물가상승률이 2%일 때 상대적 구매력평가설에 따른 원달러 환율 변화는?","o":["약 3% 하락","약 3% 상승","약 7% 상승","변화 없음"],"a":1,"e":"상대적 PPP에서 환율 변화율은 자국 물가상승률에서 외국 물가상승률을 뺀 값입니다. 5% − 2% = 3%이므로 환율이 약 3% 오르고 원화는 그만큼 절하됩니다."},{"sub":"국제금융론","q":"국내 금리가 4%, 미국 금리가 2%일 때 이자율평가설에 따라 예상되는 원화의 움직임은?","o":["약 2% 절상","약 2% 절하","약 6% 절상","변화 없음"],"a":1,"e":"이자율평가설에서 금리가 높은 통화는 그 차이만큼 절하될 것으로 예상됩니다. 그렇지 않으면 차익거래 기회가 생기기 때문입니다. 4% − 2% = 2%만큼 원화가 절하됩니다."},{"sub":"국제금융론","q":"선물환율이 현물환율보다 높은 상태를 무엇이라 하는가?","o":["선물환 할증(프리미엄)","선물환 할인(디스카운트)","평가절하","평가절상"],"a":0,"e":"선물환율이 현물보다 높으면 프리미엄, 낮으면 디스카운트입니다. 무위험 이자율평가에 따르면 금리가 낮은 통화가 선물환 프리미엄 상태가 됩니다."},{"sub":"국제금융론","q":"스왑레이트(선물환율 − 현물환율)가 결정되는 요인으로 옳은 것은?","o":["양국 물가상승률 차이","양국 명목금리 차이","양국 경상수지 규모","양국 외환보유액 차이"],"a":1,"e":"무위험 이자율평가가 성립하면 스왑레이트는 양국 명목금리 차이와 일치합니다. 어긋나면 차익거래가 들어와 다시 균형으로 돌아갑니다."},{"sub":"국제금융론","q":"빅맥지수가 시사하는 이론으로 옳은 것은?","o":["이자율평가설","구매력평가설","국제피셔효과","포트폴리오 이론"],"a":1,"e":"빅맥지수는 같은 재화가 어디서나 같은 값이어야 한다는 일물일가의 법칙을 응용한 것으로 구매력평가설의 대표적 사례입니다. 각국 빅맥 가격을 비교해 통화의 고평가와 저평가를 판단합니다."},{"sub":"국제금융론","q":"구매력평가설이 현실에서 잘 성립하지 않는 이유로 옳지 않은 것은?","o":["운송비와 관세가 존재한다","비교역재가 존재한다","각국 소비 바스켓이 다르다","금리가 존재한다"],"a":3,"e":"PPP가 어긋나는 이유는 운송비, 관세, 비교역재, 소비 바스켓의 차이 때문입니다. 금리는 이자율평가설의 변수이며 PPP가 성립하지 않는 직접적 이유가 아닙니다."},{"sub":"국제금융론","q":"변동환율제에서 확장적 재정정책의 효과가 제한되는 이유로 옳은 것은?","o":["금리 상승으로 자본이 유입되어 환율이 하락하고 순수출이 감소하기 때문","통화량이 자동으로 줄어들기 때문","물가가 즉시 하락하기 때문","정부지출이 세금으로 상쇄되기 때문"],"a":0,"e":"재정 확대로 금리가 오르면 해외 자본이 유입되어 자국 통화가 강세를 보입니다. 그 결과 수출이 줄어 재정정책 효과가 상쇄됩니다. 이것이 먼델-플레밍 모형의 핵심 논리입니다."},{"sub":"국제금융론","q":"고정환율제에서 확장적 통화정책이 무력한 이유로 옳은 것은?","o":["환율 방어를 위해 외환을 매각하면 통화량이 다시 줄어들기 때문","금리가 변하지 않기 때문","물가가 고정되어 있기 때문","자본이동이 금지되어 있기 때문"],"a":0,"e":"통화를 늘리면 환율 상승 압력이 생기고, 중앙은행이 환율을 지키려 외환을 팔면 그만큼 원화가 회수되어 통화량이 원래대로 돌아갑니다. 그래서 통화정책이 무력해집니다."},{"sub":"국제금융론","q":"외환당국이 시장에 개입하면서 통화량 변동을 상쇄하는 조치를 함께 하는 것은?","o":["불태화 개입","태화 개입","구두 개입","스무딩 오퍼레이션"],"a":0,"e":"불태화 개입은 외환시장 개입으로 생긴 통화량 변화를 공개시장운영 등으로 되돌리는 것입니다. 환율에는 영향을 주되 국내 통화량은 유지하려는 조치입니다."},{"sub":"국제금융론","q":"환율의 급격한 변동을 완화하기 위해 당국이 소규모로 개입하는 것을 무엇이라 하는가?","o":["스무딩 오퍼레이션","불태화 개입","평가절하","환율조작"],"a":0,"e":"스무딩 오퍼레이션은 추세를 바꾸려는 것이 아니라 단기 급변동을 누그러뜨리는 미세조정입니다. 관리변동환율제에서 흔히 쓰입니다."},{"sub":"국제금융론","q":"우리나라 기업이 달러 표시 부채를 보유하고 있을 때 환위험을 줄이는 방법으로 옳은 것은?","o":["달러 선물환 매도","달러 선물환 매입","원화 자산 축소","달러 자산 매각"],"a":1,"e":"달러 부채가 있으면 환율 상승 시 상환 부담이 커집니다. 달러를 미리 정해진 환율에 사두는 선물환 매입으로 위험을 상쇄할 수 있습니다."},{"sub":"국제금융론","q":"수출대금을 3개월 후 달러로 받기로 한 기업의 적절한 헤지 방법은?","o":["달러 선물환 매도","달러 선물환 매입","달러 콜옵션 매도","달러를 추가로 차입"],"a":0,"e":"미래에 달러가 들어오므로 환율 하락이 위험입니다. 미리 정해진 환율에 팔기로 하는 선물환 매도로 수취 원화를 확정할 수 있습니다."},{"sub":"국제금융론","q":"환율 하락 위험을 막으면서 상승 시 이익도 남기고 싶을 때 적합한 수단은?","o":["선물환 매도","달러 풋옵션 매수","달러 콜옵션 매도","통화선물 매도"],"a":1,"e":"풋옵션을 사면 환율이 떨어질 때 정해진 가격에 팔 수 있고, 오르면 권리를 포기하고 시장가로 팔아 이익을 얻습니다. 대신 프리미엄을 지불합니다."},{"sub":"국제금융론","q":"옵션 매도자의 손익 구조로 옳은 것은?","o":["이익과 손실이 모두 제한된다","이익은 프리미엄으로 제한되고 손실은 크게 확대될 수 있다","손실이 프리미엄으로 제한된다","이익이 무제한이다"],"a":1,"e":"매도자는 프리미엄을 받는 것이 이익의 전부이고 시장이 크게 반대로 움직이면 손실이 급격히 커집니다. 그래서 거래소가 매도자에게 증거금을 요구합니다."},{"sub":"국제금융론","q":"외화 수입과 지출의 통화와 시기를 일치시켜 환노출을 줄이는 기법은?","o":["매칭","네팅","리딩","스왑"],"a":0,"e":"매칭은 외화로 벌어 외화로 지출함으로써 환전 필요 자체를 줄이는 방법입니다. 계열사 간 채권채무를 상계하는 것은 네팅입니다."},{"sub":"국제금융론","q":"자연적 헤지(natural hedge)에 해당하는 것은?","o":["수출대금과 같은 통화로 원자재를 수입하는 것","통화선물을 매도하는 것","통화옵션을 매수하는 것","환변동보험에 가입하는 것"],"a":0,"e":"자연적 헤지는 금융상품을 쓰지 않고 사업 구조 자체로 환노출을 상쇄하는 것입니다. 달러로 벌고 달러로 지출하면 환율이 변해도 순노출이 작습니다."},{"sub":"국제금융론","q":"경상수지가 흑자일 때 국민경제 항등식상 함께 나타나는 현상으로 옳은 것은?","o":["국내 저축이 국내 투자보다 크다","국내 투자가 국내 저축보다 크다","정부지출이 조세보다 크다","통화량이 감소한다"],"a":0,"e":"경상수지는 저축에서 투자를 뺀 값과 같습니다. 흑자라는 것은 국내에서 남는 저축이 해외로 나간다는 뜻이며 대외순자산이 늘어납니다."},{"sub":"국제금융론","q":"J커브 효과가 나타나는 이유로 옳은 것은?","o":["단기에는 수출입 물량이 즉시 조정되지 않기 때문","환율이 즉시 반응하지 않기 때문","물가가 즉시 하락하기 때문","금리가 즉시 오르기 때문"],"a":0,"e":"이미 체결된 계약 때문에 물량은 그대로인데 가격 조건만 먼저 나빠집니다. 시간이 지나 물량이 조정되면 경상수지가 개선되어 그래프가 J자를 그립니다."},{"sub":"국제금융론","q":"환율 상승에도 경상수지가 개선되지 않는 경우로 옳은 것은?","o":["수출입 수요탄력성의 합이 1보다 작을 때","수출입 수요탄력성의 합이 1보다 클 때","외환보유액이 충분할 때","금리가 낮을 때"],"a":0,"e":"마셜-러너 조건이 충족되지 않으면 가격 조건만 악화되고 물량이 충분히 반응하지 않아 경상수지가 오히려 나빠질 수 있습니다."},{"sub":"국제금융론","q":"신용장 방식에서 개설은행이 부담하는 위험으로 옳은 것은?","o":["수출자의 계약 불이행 위험","수입자의 대금 미지급 위험","환율 변동 위험만","위험을 전혀 부담하지 않는다"],"a":1,"e":"개설은행은 수입자를 대신해 지급을 확약하므로 수입자가 돈을 내지 못할 위험을 집니다. 그래서 개설 전에 수입자의 신용을 심사하고 담보를 요구합니다."},{"sub":"국제금융론","q":"취소불능신용장(Irrevocable L/C)의 특징으로 옳은 것은?","o":["개설은행이 일방적으로 취소할 수 있다","관계 당사자 전원의 동의 없이는 변경·취소할 수 없다","수입자만 동의하면 취소된다","유효기간이 없다"],"a":1,"e":"취소불능신용장은 개설은행, 수익자, 확인은행 등 관계 당사자 전원의 합의가 있어야 변경하거나 취소할 수 있습니다. 신용장통일규칙상 별도 표시가 없으면 취소불능으로 봅니다."},{"sub":"국제금융론","q":"확인신용장(Confirmed L/C)에서 확인은행의 역할은?","o":["서류를 단순히 전달한다","개설은행과 별도로 지급을 확약한다","수출자에게 자금을 대출한다","환율을 보장한다"],"a":1,"e":"확인은행은 개설은행의 신용에 더해 자신도 독립적으로 지급을 확약합니다. 개설은행 소재국의 신용도가 낮을 때 수출자가 요구합니다."},{"sub":"국제금융론","q":"포페이팅(forfaiting)에 관한 설명으로 옳은 것은?","o":["수출자가 소구권 없이 채권을 매각하는 금융기법이다","수입자가 대금을 선지급하는 방식이다","보험의 일종이다","단기 무역결제 방식이다"],"a":0,"e":"포페이팅은 수출채권을 금융기관에 무소구 조건으로 넘겨 대금을 앞당겨 받는 중장기 금융기법입니다. 이후 대금이 회수되지 않아도 수출자에게 되돌아오지 않습니다."},{"sub":"국제금융론","q":"팩토링(factoring)과 포페이팅의 차이로 옳은 것은?","o":["팩토링은 주로 단기, 포페이팅은 주로 중장기 채권을 대상으로 한다","팩토링은 중장기, 포페이팅은 단기이다","둘은 완전히 같다","포페이팅은 소구권이 있다"],"a":0,"e":"팩토링은 단기 매출채권을 대상으로 하고 회수 업무까지 대행하는 경우가 많습니다. 포페이팅은 중장기 수출채권을 무소구로 할인 매입합니다."},{"sub":"국제금융론","q":"환율제도 중 통화위원회제도(Currency Board)의 특징으로 옳은 것은?","o":["자국 통화 발행을 외화 준비금에 연동시킨다","환율을 완전히 자유화한다","중앙은행이 자유롭게 통화를 발행한다","외환보유액이 필요 없다"],"a":0,"e":"통화위원회제도는 자국 통화 발행량을 보유 외화에 엄격히 연동하는 강한 형태의 고정환율제입니다. 통화정책의 독립성을 거의 완전히 포기하는 대신 환율 신뢰를 얻습니다."},{"sub":"국제금융론","q":"국제수지표에서 오차 및 누락 항목이 생기는 이유로 옳은 것은?","o":["통계 작성 과정의 불일치 때문","정부의 의도적 조작 때문","환율 변동 때문만","경상수지가 흑자이기 때문"],"a":0,"e":"국제수지는 복식부기 원리상 합이 0이 되어야 하지만 자료 출처와 계상 시점의 차이로 불일치가 생깁니다. 이를 조정하는 항목이 오차 및 누락입니다."},{"sub":"국제금융론","q":"자본이 급격히 유출되어 외환보유액이 고갈되는 상황을 무엇이라 하는가?","o":["외환위기","디플레이션","스태그플레이션","환율 절상"],"a":0,"e":"외환위기는 대외 지급 능력이 무너지는 상황으로 급격한 자본 유출, 환율 폭등, 외환보유액 고갈이 함께 나타납니다. 1997년 우리나라가 겪은 사례가 대표적입니다."},{"sub":"국제금융론","q":"외환보유액을 보유하는 주된 목적으로 옳지 않은 것은?","o":["대외 지급 능력 확보","외환시장 안정","국가 신인도 유지","재정적자 보전"],"a":3,"e":"외환보유액은 대외 지급 준비와 시장 안정, 신인도 유지를 위한 것입니다. 재정적자를 메우는 용도로 쓰는 것은 본래 목적이 아니며 보유액의 성격에도 맞지 않습니다."},{"sub":"국제금융론","q":"특별인출권(SDR)에 관한 설명으로 옳은 것은?","o":["IMF가 창출한 보완적 준비자산이다","미국이 발행하는 통화이다","금으로 태환되는 증서이다","민간이 거래하는 금융상품이다"],"a":0,"e":"SDR은 IMF가 회원국에 배분하는 보완적 준비자산으로 주요 통화 바스켓으로 가치가 산정됩니다. 민간 거래 수단이 아니라 공적 준비자산입니다."},{"sub":"국제금융론","q":"환율이 상승할 때 국내 물가에 미치는 영향으로 옳은 것은?","o":["수입 원자재 가격 상승으로 물가 상승 압력이 생긴다","수입품 가격 하락으로 물가가 내린다","물가와 무관하다","항상 디플레이션을 유발한다"],"a":0,"e":"원화가 약해지면 같은 물건을 사는 데 더 많은 원화가 들어 수입 원자재와 에너지 가격이 오릅니다. 이것이 생산비를 밀어 올려 물가 상승 압력으로 이어집니다."},{"sub":"국제금융론","q":"이자율평가설이 성립하지 않을 때 발생하는 것은?","o":["차익거래","헤지","투기적 손실 확정","환율 고정"],"a":0,"e":"금리차와 선물환 프리미엄이 어긋나면 위험 없이 이익을 얻을 기회가 생겨 차익거래가 발생합니다. 거래가 몰리면서 가격이 조정되어 다시 균형이 회복됩니다."},{"sub":"국제금융론","q":"수입자가 부담하는 위험이 가장 큰 결제방식은?","o":["신용장(L/C)","D/P","O/A(사후송금)","선지급(T/T in advance)"],"a":3,"e":"선지급은 물건을 받기 전에 돈을 먼저 보내는 방식이라 수입자가 위험을 집니다. 반대로 O/A는 수출자가 위험을 전부 지는 방식입니다."},{"sub":"국제금융론","q":"무역거래에서 인코텀즈(Incoterms)가 정하는 내용으로 옳은 것은?","o":["매도인과 매수인의 비용과 위험 분기점","대금 결제 시점","환율 적용 기준","관세율"],"a":0,"e":"인코텀즈는 국제상업회의소가 제정한 정형거래조건으로 운송비 부담과 위험 이전 시점을 규정합니다. 대금 결제나 소유권 이전은 다루지 않습니다."},{"sub":"국제금융론","q":"FOB 조건에서 위험이 매도인에서 매수인으로 이전되는 시점은?","o":["계약 체결 시","물품이 본선에 적재된 때","목적항 도착 시","대금 지급 시"],"a":1,"e":"FOB는 선적항에서 물품이 본선에 적재되는 시점에 위험이 이전됩니다. CIF도 위험 이전 시점은 같지만 매도인이 목적항까지 운임과 보험료를 부담한다는 점이 다릅니다."},{"sub":"보험학","q":"보험가액 2억원인 건물에 보험금액 1억 2천만원으로 가입하고 6천만원의 손해가 발생했다. 비례보상 시 지급액은?","o":["2,400만원","3,000만원","3,600만원","6,000만원"],"a":2,"e":"부보비율은 1억 2천만 ÷ 2억 = 60%입니다. 손해액 6,000만원 × 60% = 3,600만원이 지급됩니다. 손해액이 보험금액보다 작아도 전액이 나오지 않는다는 점이 핵심입니다."},{"sub":"보험학","q":"보험사고 발생 시 보험금을 지급받기 위해 필요한 요건으로 옳지 않은 것은?","o":["보험기간 중 사고가 발생할 것","담보되는 위험일 것","피보험이익이 존재할 것","보험사가 사고를 사전에 인지할 것"],"a":3,"e":"보험사가 사고를 미리 알 필요는 없습니다. 우연성이 보험의 전제이기 때문입니다. 보험기간, 담보위험, 피보험이익은 지급을 위한 기본 요건입니다."},{"sub":"보험학","q":"보험계약자가 고의로 사고를 일으킨 경우의 처리로 옳은 것은?","o":["보험금이 감액 지급된다","보험자가 면책된다","보험금이 전액 지급된다","보험료만 반환된다"],"a":1,"e":"고의 사고는 우연성 요건을 충족하지 못하므로 보험자가 면책됩니다. 이를 인정하면 보험이 범죄 수단이 되고 이득금지 원칙에도 어긋납니다."},{"sub":"보험학","q":"보험에서 위험의 동질성이 요구되는 이유로 옳은 것은?","o":["대수의 법칙이 작동하기 위해","보험료를 높이기 위해","재보험을 쉽게 하기 위해","계약을 단순화하기 위해"],"a":0,"e":"성격이 다른 위험을 섞으면 전체 발생률 예측이 부정확해집니다. 동질적인 위험을 모아야 대수의 법칙이 작동해 요율 산정이 가능해집니다."},{"sub":"보험학","q":"공동보험조항(coinsurance)의 주된 목적은?","o":["역선택 방지","도덕적 해이 억제 및 보험료 인하","보험금 지급 지연","보험사 수익 증대"],"a":1,"e":"손해의 일정 비율을 계약자가 부담하게 하면 사고 예방 유인이 생기고 보험료도 낮아집니다. 가입 전 위험을 가려내는 언더라이팅과 달리 가입 후 행동을 관리하는 장치입니다."},{"sub":"보험학","q":"보험기간과 보험료기간의 관계에 관한 설명으로 옳은 것은?","o":["항상 같다","보험기간은 위험을 담보하는 기간이고 보험료기간은 보험료 산출의 기준이 되는 기간이다","보험료기간이 항상 더 길다","보험기간은 계약 체결 전 기간이다"],"a":1,"e":"보험기간은 보험자가 책임을 지는 기간이고, 보험료기간은 위험률을 측정해 보험료를 계산하는 단위 기간입니다. 두 기간이 일치하지 않을 수 있습니다."},{"sub":"보험학","q":"보험자대위가 인정되지 않는 보험은?","o":["화재보험","해상보험","생명보험","자동차보험"],"a":2,"e":"생명보험은 정액보상 방식이라 이득 개념이 성립하지 않으므로 대위가 원칙적으로 인정되지 않습니다. 손해보험에서는 이중이득을 막기 위해 대위가 인정됩니다."},{"sub":"보험학","q":"무역보험의 담보 위험 중 수입국 정부의 수입 금지 조치로 인한 손실은 무엇에 해당하는가?","o":["신용위험","비상위험","환위험","운영위험"],"a":1,"e":"비상위험은 전쟁, 내란, 외환 송금 제한, 수입 금지 등 당사자의 잘못 없이 국가 차원의 사유로 생기는 위험입니다. 수입자의 파산이나 지급 거절은 신용위험입니다."},{"sub":"보험학","q":"무역보험공사가 수출기업에 제공하는 기능 중 은행의 대출 결정을 돕는 것은?","o":["위험 담보 기능","금융 보완 기능","신용정보 제공 기능","손해 방지 기능"],"a":1,"e":"보험증권이 담보 역할을 하여 은행이 대금 미회수 위험 부담 없이 수출기업에 대출할 수 있게 됩니다. 무역보험이 수출금융 인프라로 기능하는 지점입니다."},{"sub":"보험학","q":"환변동보험에서 환율이 유리하게 움직여 이익이 발생한 경우의 처리는?","o":["기업이 전액 보유한다","공사가 환수한다","보험료로 대체한다","다음 계약에 이월된다"],"a":1,"e":"환변동보험은 손실을 보상하는 대신 이익이 나면 환수합니다. 목적이 투기적 이익이 아니라 환율을 사실상 고정해 기업이 영업에 집중하게 하는 데 있기 때문입니다."},{"sub":"보험학","q":"수출보험에서 부보율을 100% 미만으로 설정하는 이유로 옳은 것은?","o":["보험료 수입을 늘리기 위해","수출기업의 도덕적 해이를 억제하기 위해","역선택을 방지하기 위해","재보험 출재를 위해"],"a":1,"e":"손실 전액을 보상하면 수출기업이 바이어 선정과 관리에 소홀해집니다. 일부를 스스로 부담하게 해 사후 관리 유인을 남겨두는 장치입니다."},{"sub":"보험학","q":"보험료 납입이 연체되어 계약의 효력이 상실된 상태에서 일정 요건을 갖추어 되살리는 것은?","o":["부활","추인","갱신","전환"],"a":0,"e":"부활은 실효된 계약을 원래 조건으로 되살리는 제도입니다. 연체보험료와 이자를 내고 다시 고지의무를 이행해야 하며, 보험사의 승낙이 필요합니다."},{"sub":"보험학","q":"위험이 현저하게 증가했을 때 보험계약자가 지는 의무는?","o":["고지의무","통지의무","손해방지의무","보험료 증액의무"],"a":1,"e":"계약 체결 시 알리는 것이 고지의무이고, 계약 후 위험이 현저히 변경·증가하면 알리는 것이 통지의무입니다. 위반하면 보험자가 계약을 해지할 수 있습니다."},{"sub":"보험학","q":"보험사고 발생 시 손해의 확대를 막기 위해 계약자가 지는 의무는?","o":["고지의무","통지의무","손해방지의무","보험료 납입의무"],"a":2,"e":"손해방지의무는 사고가 난 뒤 손해가 커지지 않도록 노력할 의무입니다. 이를 위해 지출한 필요·유익한 비용은 보험자가 부담합니다."},{"sub":"보험학","q":"보험의 사회적 기능으로 보기 어려운 것은?","o":["경제적 안정 제공","자본 형성","신용 보완","투기적 이익 창출"],"a":3,"e":"보험은 위험을 관리하고 경제 활동을 안정시키는 제도입니다. 투기적 이익 추구는 보험의 목적이 아니며 이득금지 원칙과도 어긋납니다."},{"sub":"보험학","q":"보험계약이 성립하기 위한 요건으로 옳은 것은?","o":["보험증권의 교부","보험료의 전액 납입","청약과 승낙의 합치","금융당국의 인가"],"a":2,"e":"보험계약은 낙성계약이므로 청약과 승낙의 합치만으로 성립합니다. 보험증권은 계약 내용을 증명하는 서류일 뿐 성립요건이 아닙니다."},{"sub":"보험학","q":"재보험 거래에서 위험을 넘기는 보험사를 무엇이라 하는가?","o":["출재사","수재사","원수사만","중개사"],"a":0,"e":"위험을 넘기는 쪽이 출재사, 인수하는 쪽이 수재사입니다. 원계약자와 직접 계약한 보험사는 원수보험사라고 부릅니다."},{"sub":"보험학","q":"보험에서 언더라이팅의 핵심 목적으로 옳은 것은?","o":["위험집단의 동질성을 유지하고 역선택을 막는 것","보험금 지급을 줄이는 것","사업비를 절감하는 것","재보험료를 낮추는 것"],"a":0,"e":"언더라이팅은 위험을 평가해 인수 여부와 조건을 정함으로써 위험집단이 균질하게 유지되도록 합니다. 이것이 요율의 공정성과 보험사의 건전성을 지탱합니다."},{"sub":"보험학","q":"무역보험공사가 취급하는 제도 중 원자재 수입을 위한 선급금 미회수 위험을 담보하는 것은?","o":["단기수출보험","수입보험","해외투자보험","수출신용보증"],"a":1,"e":"수입보험은 선급금을 보냈는데 물품이 도착하지 않는 위험이나 수입자금 대출 관련 위험을 담보합니다. 안정적인 원자재 확보를 지원하는 제도입니다."},{"sub":"보험학","q":"보험에서 위험보편의 원칙(all risks)과 열거위험 담보의 차이로 옳은 것은?","o":["위험보편은 면책사유 외의 모든 위험을 담보한다","위험보편은 열거된 위험만 담보한다","둘은 같은 개념이다","열거위험 담보가 보상 범위가 더 넓다"],"a":0,"e":"포괄담보는 면책으로 정한 것을 제외한 모든 위험을 담보하고, 열거담보는 명시된 위험만 담보합니다. 포괄담보에서는 면책 입증 책임이 보험자에게 있습니다."},{"sub":"경영학","q":"총자산 5,000억원, 자기자본 2,000억원인 기업의 부채비율은?","o":["40%","60%","150%","250%"],"a":2,"e":"부채는 5,000 − 2,000 = 3,000억원입니다. 부채비율은 부채를 자기자본으로 나누므로 3,000 ÷ 2,000 = 150%입니다. 총자산으로 나누면 부채구성비율이 되어 60%가 됩니다."},{"sub":"경영학","q":"매출액 1조원, 당기순이익 500억원, 총자산 1조 2,500억원일 때 ROA는?","o":["4%","5%","8%","12.5%"],"a":0,"e":"ROA는 당기순이익을 총자산으로 나눕니다. 500 ÷ 12,500 = 4%입니다. 매출액순이익률은 500 ÷ 10,000 = 5%로 값이 달라 혼동하기 쉽습니다."},{"sub":"경영학","q":"무위험이자율 3%, 시장수익률 9%, 베타 1.5인 주식의 CAPM 기대수익률은?","o":["9%","10.5%","12%","13.5%"],"a":2,"e":"시장위험프리미엄은 9% − 3% = 6%입니다. 3% + 1.5 × 6% = 12%입니다. 시장수익률과 시장위험프리미엄을 혼동하지 않아야 합니다."},{"sub":"경영학","q":"투자액 1,000만원, 매년 300만원씩 4년간 현금유입이 예상될 때 회수기간은?","o":["3년","3년 4개월","4년","4년 6개월"],"a":1,"e":"3년간 900만원을 회수하고 남은 100만원은 4년차 300만원 중 3분의 1 시점에 회수됩니다. 따라서 3년 4개월입니다. 화폐의 시간가치는 고려하지 않은 계산입니다."},{"sub":"경영학","q":"영구연금으로 매년 500만원을 받을 때 할인율이 10%라면 현재가치는?","o":["500만원","1,000만원","5,000만원","1억원"],"a":2,"e":"영구연금의 현재가치는 매년 현금흐름을 할인율로 나눕니다. 500 ÷ 0.1 = 5,000만원입니다."},{"sub":"경영학","q":"배당할인모형에서 내년 배당 1,000원, 요구수익률 10%, 성장률 4%일 때 적정 주가는?","o":["10,000원","14,286원","16,667원","25,000원"],"a":2,"e":"정률성장모형은 배당을 (요구수익률 − 성장률)로 나눕니다. 1,000 ÷ (0.10 − 0.04) = 1,000 ÷ 0.06 = 약 16,667원입니다. 분모가 작아질수록 주가가 급격히 오릅니다."},{"sub":"경영학","q":"주당순이익 2,000원, 주가 24,000원인 기업의 PER은?","o":["8배","10배","12배","20배"],"a":2,"e":"PER은 주가를 주당순이익으로 나눕니다. 24,000 ÷ 2,000 = 12배입니다. 동일 업종 평균과 비교해야 고평가 여부를 판단할 수 있습니다."},{"sub":"경영학","q":"자산 총액이 증가하고 부채는 그대로일 때 자기자본의 변화로 옳은 것은?","o":["감소한다","증가한다","변화 없다","알 수 없다"],"a":1,"e":"회계등식상 자산은 부채와 자본의 합과 같습니다. 부채가 고정된 상태에서 자산이 늘면 그만큼 자본이 증가합니다."},{"sub":"경영학","q":"영업활동 현금흐름이 지속적으로 음수인 기업에 대한 해석으로 가장 적절한 것은?","o":["성장성이 높다는 신호이다","본업에서 현금을 창출하지 못하고 있다는 신호이다","부채가 없다는 뜻이다","이익이 많다는 뜻이다"],"a":1,"e":"영업활동 현금흐름은 본업의 현금 창출력을 보여줍니다. 계속 음수라면 이익이 나더라도 현금이 돌지 않아 외부 자금에 의존해야 하므로 위험 신호입니다."},{"sub":"경영학","q":"재무레버리지 효과에 관한 설명으로 옳은 것은?","o":["부채 사용이 순이익 변동성을 확대한다","부채 사용이 순이익을 항상 증가시킨다","부채와 순이익은 무관하다","부채가 많을수록 안전하다"],"a":0,"e":"고정적인 이자비용이 있으면 영업이익이 조금만 변해도 순이익 변동이 커집니다. 호황에는 이익이 증폭되지만 불황에는 손실도 증폭됩니다."},{"sub":"경영학","q":"기업이 배당을 늘렸을 때 시장이 긍정적으로 반응하는 현상을 설명하는 이론은?","o":["배당무관련설","신호효과 이론","고객효과 이론","MM 명제"],"a":1,"e":"경영진이 미래 현금흐름에 자신이 있을 때 배당을 늘린다고 보아 시장이 이를 긍정적 신호로 해석합니다. 정보 비대칭 상황에서 나타나는 현상입니다."},{"sub":"경영학","q":"매출액 2,000억원, 변동비 1,200억원, 고정비 600억원인 기업의 영업레버리지도(DOL)는?","o":["2.0","3.0","4.0","5.0"],"a":2,"e":"DOL은 공헌이익을 영업이익으로 나눕니다. 공헌이익 800억, 영업이익 800 − 600 = 200억이므로 800 ÷ 200 = 4입니다. 매출이 1% 변할 때 영업이익이 4% 변한다는 뜻입니다."},{"sub":"경영학","q":"자본화원가와 기간비용의 구분 기준으로 옳은 것은?","o":["미래 경제적 효익이 기대되면 자산으로 계상한다","금액이 크면 자산으로 계상한다","현금 지출이 있으면 비용으로 계상한다","경영진이 임의로 선택한다"],"a":0,"e":"지출이 미래에 효익을 가져다줄 것으로 기대되면 자산으로 올리고(자본화), 당기에 효익이 소멸하면 비용으로 처리합니다. 이 판단이 이익 규모를 좌우해 분식회계의 여지가 되기도 합니다."},{"sub":"경영학","q":"수익 인식 시점에 관한 설명으로 옳은 것은?","o":["현금을 받은 시점","고객에게 재화나 용역에 대한 통제가 이전된 시점","계약을 체결한 시점","대금을 청구한 시점"],"a":1,"e":"현행 수익인식 기준은 고객이 재화나 용역을 통제하게 된 시점에 수익을 인식합니다. 계약 체결이나 현금 수취 시점이 아니라는 점이 발생주의의 핵심입니다."},{"sub":"경영학","q":"충당부채를 인식하기 위한 요건으로 옳지 않은 것은?","o":["과거 사건으로 인한 현재의무가 존재할 것","자원의 유출 가능성이 높을 것","금액을 신뢰성 있게 추정할 수 있을 것","채권자가 이미 청구했을 것"],"a":3,"e":"충당부채는 청구 여부와 무관하게 세 요건을 충족하면 인식합니다. 제품보증충당부채가 대표적으로, 아직 클레임이 들어오지 않아도 예상액을 부채로 잡습니다."},{"sub":"경영학","q":"판매가 5,000원인 제품에 20%의 매출총이익률을 적용할 때 매출원가는?","o":["1,000원","3,000원","4,000원","4,167원"],"a":2,"e":"매출총이익률 20%는 매출액의 20%가 이익이라는 뜻이므로 이익은 1,000원, 원가는 4,000원입니다. 원가에 20%를 더하는 원가가산과 혼동하기 쉽습니다."},{"sub":"경영학","q":"원가에 20%의 이익을 붙여 판매가를 정할 때 원가 1,000원 제품의 판매가는?","o":["1,150원","1,200원","1,250원","1,300원"],"a":1,"e":"원가 기준 이익률이므로 1,000 × 1.2 = 1,200원입니다. 판매가 기준 이익률 20%를 원했다면 1,000 ÷ 0.8 = 1,250원이 되어 값이 달라집니다."},{"sub":"경영학","q":"1년 후 300만원, 2년 후 300만원의 현금흐름이 있고 할인율이 10%일 때 현재가치 합계는 약 얼마인가?","o":["약 500만원","약 521만원","약 545만원","약 600만원"],"a":1,"e":"300 ÷ 1.1 = 272.7만원, 300 ÷ 1.21 = 247.9만원이므로 합계는 약 520.7만원입니다. 각 기간마다 할인 횟수가 다르다는 점이 핵심입니다."},{"sub":"경영학","q":"배당할인모형에서 내년 배당 60,000원, 요구수익률 12%, 성장률 4%일 때 적정 주가는?","o":["500,000원","600,000원","750,000원","1,500,000원"],"a":2,"e":"60,000 ÷ (0.12 − 0.04) = 60,000 ÷ 0.08 = 750,000원입니다. 분모가 작아질수록 주가가 급격히 커지므로 성장률 추정이 매우 민감합니다."},{"sub":"경영학","q":"총자산회전율이 1.5회, 매출액이 1,500억원일 때 총자산은?","o":["500억원","1,000억원","1,500억원","2,250억원"],"a":1,"e":"총자산회전율은 매출액 ÷ 총자산이므로 총자산은 1,500 ÷ 1.5 = 1,000억원입니다. 회전율이 높을수록 자산을 효율적으로 활용한다는 뜻입니다."},{"sub":"경영학","q":"재고자산회전율이 낮아졌을 때의 해석으로 가장 적절한 것은?","o":["재고가 빠르게 소진되고 있다","재고가 쌓이고 있어 자금이 묶일 가능성이 있다","매출이 급증했다","원가가 하락했다"],"a":1,"e":"회전율이 낮다는 것은 재고가 오래 머문다는 뜻입니다. 보관비가 늘고 자금이 묶이며 진부화 위험도 커집니다. 다만 의도적인 재고 확보일 수도 있어 맥락을 봐야 합니다."},{"sub":"경영학","q":"경영진이 회계처리 방법을 선택해 이익을 조정하는 행위를 무엇이라 하는가?","o":["이익조정","감가상각","자본화","연결회계"],"a":0,"e":"이익조정은 회계기준이 허용하는 범위에서 재량을 행사해 이익 수치를 바꾸는 것입니다. 기준을 위반하면 분식회계가 되며, 재무제표 분석 시 현금흐름을 함께 봐야 하는 이유이기도 합니다."},{"sub":"경영학","q":"기업의 신용을 평가할 때 재무제표만으로 부족한 이유로 옳지 않은 것은?","o":["과거 실적을 보여줄 뿐 미래를 보장하지 않는다","산업 전망이 반영되지 않는다","경영진의 역량이 드러나지 않는다","금액 단위가 표시되지 않는다"],"a":3,"e":"재무제표에는 금액 단위가 명시됩니다. 신용평가에서 재무 정보를 비재무 정보와 함께 봐야 하는 이유는 과거 지향성, 산업 환경, 경영진 역량 같은 요소가 반영되지 않기 때문입니다."},{"sub":"경영학","q":"자본잉여금에 해당하는 것은?","o":["이익준비금","주식발행초과금","미처분이익잉여금","임의적립금"],"a":1,"e":"자본잉여금은 자본거래에서 생긴 잉여금으로 주식발행초과금, 감자차익 등이 있습니다. 이익준비금과 임의적립금, 미처분이익잉여금은 영업 결과에서 나온 이익잉여금입니다."},{"sub":"경영학","q":"유상증자가 기업 재무에 미치는 영향으로 옳은 것은?","o":["자기자본이 증가하고 부채비율이 하락한다","부채가 증가한다","자산이 감소한다","자본금이 감소한다"],"a":0,"e":"유상증자는 주식을 발행해 자금을 조달하므로 자기자본과 자산이 함께 늘어납니다. 부채는 그대로이므로 부채비율이 낮아져 재무구조가 개선됩니다. 다만 기존 주주의 지분은 희석됩니다."},{"sub":"경영학","q":"기업이 자사주를 매입할 때 일반적으로 기대되는 효과로 옳은 것은?","o":["발행주식 수가 줄어 주당순이익이 상승한다","자기자본이 증가한다","부채비율이 하락한다","배당금 총액이 증가한다"],"a":0,"e":"자사주 매입은 유통주식 수를 줄여 주당순이익과 주당 가치를 높이는 효과가 있습니다. 회사 자금이 빠져나가므로 자기자본은 오히려 감소합니다."},{"sub":"경영학","q":"손익계산서에서 영업이익을 구하는 산식으로 옳은 것은?","o":["매출액 − 매출원가","매출총이익 − 판매비와관리비","영업이익 − 법인세","매출액 − 총비용"],"a":1,"e":"매출액에서 매출원가를 빼면 매출총이익이고, 여기서 판매비와관리비를 빼면 영업이익입니다. 영업이익에서 영업외손익과 법인세를 반영하면 당기순이익이 됩니다."},{"sub":"경영학","q":"EBITDA가 의미하는 것으로 옳은 것은?","o":["이자, 세금, 감가상각비 차감 전 영업이익","당기순이익","매출총이익","영업활동 현금흐름 전액"],"a":0,"e":"EBITDA는 이자와 세금, 감가상각비를 빼기 전 이익으로 영업 현금창출력의 대용치로 쓰입니다. 실제 현금흐름과 완전히 같지는 않으며 운전자본 변동이 반영되지 않습니다."},{"sub":"경영학","q":"순운전자본을 구하는 산식으로 옳은 것은?","o":["유동자산 − 유동부채","총자산 − 총부채","자기자본 − 부채","매출채권 − 매입채무"],"a":0,"e":"순운전자본은 유동자산에서 유동부채를 뺀 값으로 단기 영업활동에 묶인 자금의 규모를 보여줍니다. 지나치게 크면 자금이 비효율적으로 묶여 있다는 뜻일 수 있습니다."},{"sub":"경영학","q":"현금전환주기(Cash Conversion Cycle)를 줄이는 방법으로 옳은 것은?","o":["매출채권 회수기간을 늘린다","재고자산 보유기간을 늘린다","매입채무 지급기간을 늘린다","매입채무를 즉시 상환한다"],"a":2,"e":"현금전환주기는 재고기간에 매출채권 회수기간을 더하고 매입채무 지급기간을 뺍니다. 지급을 늦추면 주기가 짧아져 자금 부담이 줄어듭니다."},{"sub":"경영학","q":"포트폴리오에서 분산투자로 제거할 수 없는 위험은?","o":["비체계적 위험","기업고유 위험","체계적 위험","경영진 관련 위험"],"a":2,"e":"체계적 위험은 금리, 경기, 전쟁처럼 시장 전체에 영향을 주는 요인이라 분산으로 없앨 수 없습니다. CAPM이 베타만으로 기대수익률을 설명하는 이유이기도 합니다."},{"sub":"경영학","q":"두 자산의 상관계수가 −1일 때 포트폴리오 위험은?","o":["최대가 된다","이론적으로 완전히 제거할 수 있다","변하지 않는다","항상 0이 된다"],"a":1,"e":"완전 음의 상관이면 두 자산의 움직임이 정확히 상쇄되어 적절한 비중에서 위험을 0으로 만들 수 있습니다. 현실에서는 이런 조합을 찾기 어렵습니다."},{"sub":"경영학","q":"샤프지수와 트레이너지수의 차이로 옳은 것은?","o":["샤프는 총위험, 트레이너는 베타로 나눈다","샤프는 베타, 트레이너는 총위험으로 나눈다","둘은 동일하다","트레이너는 수익률을 사용하지 않는다"],"a":0,"e":"샤프지수는 초과수익률을 표준편차로 나누고 트레이너지수는 베타로 나눕니다. 분모가 무엇인지로 구분하면 헷갈리지 않습니다."},{"sub":"경영학","q":"젠센의 알파가 양수라는 것의 의미로 옳은 것은?","o":["시장 평균만큼 수익을 냈다","CAPM이 예측한 수준보다 초과 성과를 냈다","위험이 낮았다","수수료가 저렴했다"],"a":1,"e":"알파는 실제 수익률에서 CAPM이 예측한 수익률을 뺀 값으로 운용자의 실력을 나타냅니다. 양수이면 감수한 위험 대비 초과 성과를 냈다는 뜻입니다."},{"sub":"경영학","q":"기업의 사회적 책임(CSR)과 공유가치창출(CSV)의 차이로 옳은 것은?","o":["CSR은 비용, CSV는 사업 자체로 사회 가치를 만든다","둘은 같은 개념이다","CSV는 기부 활동만을 말한다","CSR은 수익을 창출한다"],"a":0,"e":"CSR은 이익을 낸 뒤 사회에 환원하는 성격이 강해 비용으로 인식됩니다. CSV는 사회 문제 해결이 곧 사업 기회가 되도록 설계해 경제적 가치와 사회적 가치를 함께 만듭니다."},{"sub":"경영학","q":"ESG 경영에서 G가 의미하는 것은?","o":["성장(Growth)","지배구조(Governance)","세계화(Globalization)","녹색(Green)"],"a":1,"e":"ESG는 환경(Environmental), 사회(Social), 지배구조(Governance)를 뜻합니다. 지배구조에는 이사회 독립성, 주주권 보호, 감사기구의 실효성 등이 포함됩니다."},{"sub":"경영학","q":"균형성과표(BSC)의 네 가지 관점에 해당하지 않는 것은?","o":["재무 관점","고객 관점","내부 프로세스 관점","경쟁사 관점"],"a":3,"e":"BSC는 재무, 고객, 내부 프로세스, 학습과 성장의 네 관점으로 성과를 봅니다. 재무 지표에만 의존하던 한계를 보완하려는 도구입니다."},{"sub":"경영학","q":"SWOT 분석에서 약점을 보완해 기회를 활용하는 전략은?","o":["SO 전략","ST 전략","WO 전략","WT 전략"],"a":2,"e":"WO는 약점을 메워 외부 기회를 잡는 전략입니다. 강점으로 기회를 활용하면 SO, 강점으로 위협에 대응하면 ST, 약점과 위협을 함께 줄이는 방어적 선택이 WT입니다."},{"sub":"경영학","q":"학습곡선 효과가 의미하는 것으로 옳은 것은?","o":["누적 생산량이 늘수록 단위당 원가가 감소한다","생산량이 늘수록 품질이 떨어진다","고정비가 증가한다","기술이 진부화된다"],"a":0,"e":"반복 생산으로 숙련도가 올라가 작업 시간과 불량이 줄어드는 현상입니다. 규모의 경제가 생산 규모에서 오는 것과 달리 학습곡선은 누적 경험에서 옵니다."},{"sub":"경영학","q":"공급사슬에서 채찍효과를 완화하는 방법으로 옳지 않은 것은?","o":["수요 정보 공유","주문 단위 축소","상시저가정책(EDLP)","대규모 할인행사 확대"],"a":3,"e":"할인행사는 수요를 일시적으로 왜곡해 채찍효과를 키웁니다. 가격을 안정적으로 유지하는 EDLP가 오히려 완화 수단입니다."},{"sub":"경영학","q":"서비스의 특성에 해당하지 않는 것은?","o":["무형성","동시성(생산과 소비의 비분리성)","이질성","저장 가능성"],"a":3,"e":"서비스는 소멸성을 가져 저장할 수 없습니다. 오늘 비어 있던 호텔 객실은 내일 팔 수 없습니다. 이 때문에 수요와 공급의 조절이 서비스 운영의 핵심 과제가 됩니다."},{"sub":"보험학","q":"무역보험의 금융 보완 기능을 설명하는 것으로 가장 적절한 것은?","o":["사고 발생 시 손해액을 보상하는 기능","보험증권이 담보 역할을 해 수출기업의 자금 조달을 가능하게 하는 기능","해외 바이어 신용정보를 제공하는 기능","수출 물량을 확대하는 기능"],"a":1,"e":"무역보험은 손해 보상에 그치지 않고 신용을 보강해 금융을 가능하게 합니다. 담보가 부족한 중소기업이 보험 가입을 통해 은행 대출을 받을 수 있게 되는 것이 대표적입니다."},{"sub":"보험학","q":"담보가 부족한 중소 수출기업이 은행에서 자금을 빌릴 때 무역보험공사가 직접 보증을 제공하는 제도는?","o":["단기수출보험","수출신용보증","환변동보험","해외투자보험"],"a":1,"e":"수출신용보증은 공사가 은행 대출에 보증을 서는 제도로 금융 보완 기능을 가장 직접적으로 수행합니다. 선적 전 제작자금과 선적 후 채권 유동화 모두에 활용됩니다."},{"sub":"보험학","q":"수출기업이 보험금 청구권을 은행에 양도하는 이유로 옳은 것은?","o":["보험료를 줄이기 위해","대출의 담보로 활용하기 위해","보험금을 빨리 받기 위해","부보율을 높이기 위해"],"a":1,"e":"보험금을 받을 권리를 은행에 넘기면 은행은 대금 미회수 시에도 보험금으로 대출을 회수할 수 있습니다. 이 구조 덕분에 담보가 없는 기업도 대출을 받을 수 있습니다."},{"sub":"보험학","q":"무역보험이 없을 경우 예상되는 결과로 가장 적절한 것은?","o":["수출이 담보 여력이 있는 기업 위주로 이루어진다","모든 기업이 수출을 확대한다","환율이 안정된다","은행 대출이 늘어난다"],"a":0,"e":"위험을 덮어줄 장치가 없으면 은행은 신용과 담보가 확실한 기업에만 자금을 공급합니다. 결과적으로 중소기업의 수출 진입 장벽이 높아집니다."},{"sub":"보험학","q":"무역보험 운영에서 재정 건전성을 확보하기 위한 수단으로 보기 어려운 것은?","o":["신용등급별 요율 차등","인수 한도 설정","재보험 출재","부보율을 100%로 상향"],"a":3,"e":"부보율을 100%로 올리면 손실을 전부 공사가 떠안게 되어 재정 부담이 커지고 도덕적 해이도 심해집니다. 요율 차등, 한도 설정, 재보험 출재가 건전성 확보 수단입니다."},{"sub":"의사소통능력","q":"어휘의 쓰임이 옳은 문장은?","o":["이번 사업은 예산 낭비를 지향한다","대금은 법인카드로 결재하였다","팀장이 휴가 신청서를 결재하였다","회사의 위상을 재고할 필요가 있다"],"a":2,"e":"결재는 권한을 가진 사람이 안건을 승인하는 것이고, 결제는 대금을 치르는 것입니다. 지양은 하지 않는 것, 지향은 목표로 삼는 것이며, 제고는 끌어올리는 것, 재고는 다시 생각하는 것입니다."},{"sub":"의사소통능력","q":"띄어쓰기가 옳은 것은?","o":["아는것이 힘이다","할 수 있다","사흘만에 완성했다","그밖에 다른 방법은 없다"],"a":1,"e":"의존명사 수는 앞말과 띄어 씁니다. 것 역시 의존명사이므로 아는 것, 시간의 경과를 뜻하는 만도 의존명사이므로 사흘 만에, 밖에가 그 외라는 뜻일 때는 그 밖에로 띄어 씁니다."},{"sub":"의사소통능력","q":"단어 지양의 뜻으로 옳은 것은?","o":["목표로 삼아 그것을 향해 나아감","더 높은 단계로 오르기 위하여 어떠한 것을 하지 아니함","이미 정한 것을 다시 검토함","수준이나 정도를 끌어올림"],"a":1,"e":"지양은 어떤 것을 하지 않는 것이고, 지향은 목표로 삼아 나아가는 것입니다. 공문서에서 자주 혼동되므로 반대 개념으로 묶어 기억하는 편이 좋습니다."},{"sub":"의사소통능력","q":"공문서 작성 원칙으로 옳지 않은 것은?","o":["육하원칙에 따라 명확하게 작성한다","한 문장은 가급적 짧고 간결하게 쓴다","권위를 위해 한자어와 외래어를 되도록 많이 사용한다","날짜와 숫자는 정확하게 표기한다"],"a":2,"e":"공문서는 누구나 이해할 수 있도록 쉬운 우리말을 쓰는 것이 원칙입니다. 불필요한 한자어와 외래어는 오히려 의미 전달을 방해합니다."},{"sub":"의사소통능력","q":"문서적 의사소통에 해당하지 않는 것은?","o":["기획안 작성","전자우편 발송","회의에서의 구두 보고","업무 매뉴얼 열람"],"a":2,"e":"문서적 의사소통은 문서를 매개로 하는 소통으로 기획서, 공문, 전자우편, 매뉴얼 등이 해당합니다. 구두 보고와 회의 발언, 전화 통화는 언어적 의사소통입니다."},{"sub":"수리능력","q":"농도 10%의 소금물 200g에 물 50g을 더 넣었을 때 소금물의 농도는?","o":["6%","8%","9%","12%"],"a":1,"e":"소금의 양은 200 × 0.1 = 20g으로 변하지 않고, 전체 소금물은 250g이 됩니다. 따라서 농도는 20 ÷ 250 = 8%입니다. 물을 더할 때 용질의 양은 그대로라는 점이 핵심입니다."},{"sub":"수리능력","q":"어떤 일을 A는 혼자 6일, B는 혼자 12일에 끝낸다. 두 사람이 함께하면 며칠이 걸리는가?","o":["3일","4일","5일","9일"],"a":1,"e":"전체 일의 양을 1로 두면 하루 작업량은 A가 6분의 1, B가 12분의 1이고 합하면 4분의 1입니다. 따라서 4일이 걸립니다."},{"sub":"수리능력","q":"자동차가 시속 60km로 2시간, 시속 90km로 2시간을 달렸다. 전체 평균 속력은?","o":["70km/h","72km/h","75km/h","80km/h"],"a":2,"e":"총 이동거리는 120 + 180 = 300km이고 총 소요시간은 4시간이므로 평균 속력은 75km/h입니다. 평균 속력은 속력의 산술평균이 아니라 총거리를 총시간으로 나눈 값입니다."},{"sub":"수리능력","q":"5명 중 3명을 뽑아 일렬로 세우는 경우의 수는?","o":["10가지","20가지","60가지","120가지"],"a":2,"e":"순서가 있으므로 순열입니다. 5 × 4 × 3 = 60가지입니다. 순서를 따지지 않고 3명을 고르기만 한다면 조합으로 10가지가 됩니다."},{"sub":"수리능력","q":"주사위 두 개를 동시에 던질 때 나온 눈의 합이 7일 확률은?","o":["6분의 1","9분의 1","12분의 1","36분의 1"],"a":0,"e":"전체 경우의 수는 36가지이고 합이 7인 경우는 (1,6) (2,5) (3,4) (4,3) (5,2) (6,1)의 6가지입니다. 따라서 6 ÷ 36 = 6분의 1로 두 주사위 합 중 가장 확률이 높습니다."},{"sub":"수리능력","q":"원가에 20%의 이익을 붙여 정가를 정한 뒤, 정가에서 10%를 할인하여 판매하였다. 이때 이익률은?","o":["8%","10%","12%","18%"],"a":0,"e":"원가를 100으로 두면 정가는 120, 10% 할인 판매가는 108입니다. 이익은 8이므로 원가 대비 이익률은 8%입니다. 할인율을 원가가 아닌 정가에 적용한다는 점이 함정입니다."},{"sub":"문제해결능력","q":"명제 비가 오면 소풍을 가지 않는다의 대우로 옳은 것은?","o":["소풍을 가면 비가 오지 않는다","비가 오지 않으면 소풍을 간다","소풍을 가지 않으면 비가 온다","비가 오지 않으면 소풍을 가지 않는다"],"a":0,"e":"대우는 가정과 결론을 뒤바꾸고 각각 부정합니다. p이면 q의 대우는 q가 아니면 p가 아니다입니다. 원명제와 대우는 항상 참거짓이 같지만, 역과 이는 그렇지 않습니다."},{"sub":"문제해결능력","q":"모든 A는 B이고, 모든 B는 C이다. 반드시 참인 것은?","o":["모든 C는 A이다","모든 A는 C이다","어떤 C는 A가 아니다","모든 B는 A이다"],"a":1,"e":"포함관계가 A ⊂ B ⊂ C이므로 모든 A는 C입니다. 나머지는 방향을 뒤집은 진술이라 주어진 조건만으로는 참이라고 단정할 수 없습니다."},{"sub":"문제해결능력","q":"SWOT 분석에서 자사의 약점을 보완하여 외부 기회를 활용하는 전략은?","o":["SO 전략","ST 전략","WO 전략","WT 전략"],"a":2,"e":"WO 전략은 약점(Weakness)을 보완해 기회(Opportunity)를 살리는 방향입니다. SO는 강점으로 기회를 활용, ST는 강점으로 위협에 대응, WT는 약점과 위협을 함께 최소화하는 전략입니다."},{"sub":"문제해결능력","q":"3C 분석의 구성요소에 해당하지 않는 것은?","o":["Customer","Competitor","Company","Cost"],"a":3,"e":"3C는 고객(Customer), 경쟁사(Competitor), 자사(Company)입니다. 환경분석 기법으로 SWOT과 함께 자주 출제되며, Cost는 포함되지 않습니다."},{"sub":"문제해결능력","q":"앞으로 발생할 수 있는 상황을 예상하고 미리 대응 방안을 마련하는 문제 유형은?","o":["발생형 문제","탐색형 문제","설정형 문제","일탈형 문제"],"a":2,"e":"발생형은 이미 일어난 눈에 보이는 문제, 탐색형은 현재 상태를 개선하기 위해 찾아내는 문제, 설정형은 미래 상황에 대응하는 문제입니다. 설정형은 목표 지향적이라 창조적 문제라고도 합니다."},{"sub":"문제해결능력","q":"A는 B보다 앞서 도착했고, C는 A보다 앞서 도착했으며, D는 B보다 늦게 도착했다. 세 번째로 도착한 사람은?","o":["A","B","C","D"],"a":1,"e":"C가 A보다 앞이고 A가 B보다 앞이며 D가 B보다 뒤이므로 순서는 C, A, B, D입니다. 따라서 세 번째는 B입니다. 부등호 방향을 한 줄로 이어 붙이면 빠르게 정리됩니다."},{"sub":"의사소통능력","q":"잠재되어 있는 능력이나 재능을 일깨워 발전시킨다는 뜻의 단어는?","o":["개발","계발","발굴","개척"],"a":1,"e":"계발은 슬기나 재능을 일깨우는 것이고 개발은 새로운 것을 만들거나 자원을 활용하는 것입니다. 자기 계발, 기술 개발로 짝지어 외우면 헷갈리지 않습니다."},{"sub":"의사소통능력","q":"'반증'의 뜻으로 옳은 것은?","o":["어떤 사실을 간접적으로 증명해 주는 자료","어떤 주장이 옳지 않음을 증명하는 근거","이미 제출된 증거를 다시 검토하는 일","증거를 새로 만들어 내는 일"],"a":1,"e":"반증은 반대되는 증거이고, 간접적으로 뒷받침하는 자료는 방증입니다. 두 단어를 바꿔 쓰는 오류가 자주 출제됩니다."},{"sub":"의사소통능력","q":"운동 경기에서 종전 기록을 깨뜨렸을 때 쓰는 말로 옳은 것은?","o":["기록을 갱신하다","기록을 경신하다","기록을 개선하다","기록을 개편하다"],"a":1,"e":"경신은 이미 있던 기록을 깨뜨려 새로 세우는 것이고, 갱신은 계약이나 면허의 기간을 연장하는 것입니다. 계약 갱신, 기록 경신으로 구분합니다."},{"sub":"의사소통능력","q":"이중피동 표현이 사용된 문장은?","o":["문이 열렸다","계획이 세워졌다","그렇게 보여진다","결과가 발표되었다"],"a":2,"e":"보다에 피동 접미사 이와 피동 표현 어지다가 겹쳐 이중피동이 되었습니다. 보인다로 써야 옳으며 잊혀지다, 쓰여지다도 같은 오류입니다."},{"sub":"의사소통능력","q":"높임법이 잘못 사용된 문장은?","o":["주문하신 커피 나오셨습니다","고객님께서 주문하신 상품입니다","사장님께서 말씀하셨습니다","할머니께서 진지를 드십니다"],"a":0,"e":"커피는 높임의 대상이 아니므로 나왔습니다로 써야 합니다. 사물에 존칭을 붙이는 것은 대표적인 과잉 높임 오류입니다."},{"sub":"의사소통능력","q":"어법상 옳은 표현은?","o":["빈칸에 알맞는 답을 고르시오","빈칸에 알맞은 답을 고르시오","빈칸에 맞는 답을 골르시오","빈칸에 알맞을 답을 고르시오"],"a":1,"e":"알맞다는 형용사이므로 관형사형 어미가 은이 붙어 알맞은이 됩니다. 알맞는은 동사에 쓰는 형태라 틀린 표현입니다."},{"sub":"의사소통능력","q":"'로서'와 '로써'의 쓰임이 모두 옳은 것은?","o":["학생으로써 본분을 다하고, 대화로서 해결한다","학생으로서 본분을 다하고, 대화로써 해결한다","학생으로서 본분을 다하고, 대화로서 해결한다","학생으로써 본분을 다하고, 대화로써 해결한다"],"a":1,"e":"로서는 지위나 자격을, 로써는 수단이나 도구를 나타냅니다. 자격은 서, 수단은 써로 기억하면 됩니다."},{"sub":"의사소통능력","q":"맞춤법이 옳은 문장은?","o":["그렇게 하면 안 되요","그렇게 하면 안 돼요","그렇게 하면 않 되요","그렇게 하면 않 돼요"],"a":1,"e":"돼는 되어의 준말이라 되어요를 줄이면 돼요가 됩니다. 되가 들어갈지 돼가 들어갈지 헷갈리면 하와 해를 넣어 보면 구분됩니다."},{"sub":"의사소통능력","q":"다음 중 어미의 쓰임이 옳은 것은?","o":["무엇을 하던지 최선을 다해라","얼마나 춥든지 손이 시렸다","가든지 말든지 마음대로 해라","그때 얼마나 좋든지 몰라"],"a":2,"e":"선택을 나타낼 때는 든지, 과거를 회상할 때는 던지를 씁니다. 가든지 말든지는 선택이므로 든지가 맞습니다."},{"sub":"의사소통능력","q":"외래어 표기가 모두 옳은 것은?","o":["리더쉽, 컨셉, 초콜렛","리더십, 콘셉트, 초콜릿","리더쉽, 콘셉트, 초콜릿","리더십, 컨셉, 초콜렛"],"a":1,"e":"외래어 표기법에 따르면 리더십, 콘셉트, 초콜릿이 옳습니다. 악세사리가 아니라 액세서리, 플랭카드가 아니라 플래카드도 자주 출제됩니다."},{"sub":"의사소통능력","q":"공문서에서 날짜를 표기하는 방법으로 옳은 것은?","o":["2026년 9월 10일","2026-09-10","2026. 9. 10.","2026/9/10"],"a":2,"e":"공문서는 연월일을 마침표로 찍어 표기하며 마지막 일 뒤에도 마침표를 찍습니다. 숫자 사이는 한 칸 띄웁니다."},{"sub":"의사소통능력","q":"공문서에서 금액을 표기하는 방법으로 옳은 것은?","o":["숫자로만 쓴다","한글로만 쓴다","아라비아 숫자로 쓰고 괄호 안에 한글을 함께 적는다","반드시 소수점까지 표기한다"],"a":2,"e":"위조와 변조를 막기 위해 금113,560원(금일십일만삼천오백육십원)처럼 숫자와 한글을 함께 적습니다."},{"sub":"의사소통능력","q":"상급자에게 안건을 올려 승인을 구하는 내부 문서는?","o":["보도자료","품의서","설명서","비즈니스 레터"],"a":1,"e":"품의서는 업무 수행에 필요한 사항을 결재권자에게 올려 승인을 받는 문서입니다. 보도자료는 언론에 배포하는 문서이고, 설명서는 제품 사용법을 안내하는 문서입니다."},{"sub":"의사소통능력","q":"업무 문서를 작성할 때 결론이나 핵심을 앞에 배치하는 방식은?","o":["미괄식","두괄식","양괄식","열거식"],"a":1,"e":"업무 문서는 읽는 사람이 빠르게 판단해야 하므로 결론을 먼저 제시하는 두괄식이 원칙입니다. 배경과 근거는 그 뒤에 붙입니다."},{"sub":"의사소통능력","q":"경청을 방해하는 태도에 해당하지 않는 것은?","o":["상대의 말을 미리 판단하고 결론짓기","다음에 할 말을 생각하며 듣기","상대의 말을 요약해 확인하기","자신의 경험으로 화제를 돌리기"],"a":2,"e":"상대의 말을 요약해 되짚는 것은 적극적 경청의 대표적 기법입니다. 나머지는 짐작하기, 준비하기, 자기 경험과 관련짓기라는 방해 요인입니다."},{"sub":"의사소통능력","q":"문서 이해의 절차에서 가장 먼저 해야 할 일은?","o":["문서의 목적을 이해하는 것","상대방의 의도를 도표로 정리하는 것","문서에 나타난 정보를 요약하는 것","자신에게 요구되는 행동을 파악하는 것"],"a":0,"e":"문서를 왜 작성했는지 목적을 먼저 파악해야 이후의 배경 확인, 내용 요약, 요구 행동 파악이 방향을 잡습니다."},{"sub":"의사소통능력","q":"상대의 의견을 먼저 인정한 뒤 자신의 견해를 제시하는 설득 화법은?","o":["Yes, But 화법","맞장구 화법","반복 화법","질문 화법"],"a":0,"e":"상대를 부정하지 않고 수용한 뒤 대안을 제시하므로 저항이 줄어듭니다. 반대 의견을 낼 때 특히 효과적입니다."},{"sub":"의사소통능력","q":"주어와 서술어의 호응이 옳은 문장은?","o":["이 제품의 특징은 가볍고 튼튼하다","내가 하고 싶은 말은 시간을 지켜 달라는 것이다","우리의 목표는 매출을 늘리겠다","그 이유는 비용이 많이 든다"],"a":1,"e":"말은과 것이다가 호응합니다. 나머지는 특징은 점이다, 목표는 것이다, 이유는 때문이다로 고쳐야 호응이 맞습니다."},{"sub":"의사소통능력","q":"번역투 표현으로 다듬어야 할 문장은?","o":["회의에서 결정했다","업무를 처리하는 데 있어서 주의가 필요하다","보고서를 제출했다","기한을 지켰다"],"a":1,"e":"하는 데 있어서는 영어의 in 구문을 옮긴 번역투이므로 처리할 때로 고치는 것이 자연스럽습니다. 아무리 로 인하여, 되어지다도 같은 유형입니다."},{"sub":"의사소통능력","q":"비언어적 의사소통 수단에 해당하지 않는 것은?","o":["표정","몸짓","목소리의 높낮이","전자우편의 본문"],"a":3,"e":"전자우편 본문은 문자로 이루어진 문서적 의사소통입니다. 표정, 몸짓, 자세, 시선, 목소리 톤은 비언어적 요소로 언어 내용 못지않게 정보를 전달합니다."},{"sub":"의사소통능력","q":"단위 명사의 띄어쓰기가 옳은 것은?","o":["연필 세자루를 샀다","연필 세 자루를 샀다","연필세 자루를 샀다","연필세자루를 샀다"],"a":1,"e":"단위를 나타내는 명사는 앞말과 띄어 씁니다. 다만 순서를 나타내거나 숫자와 어울려 쓸 때는 제1과, 10개처럼 붙여 쓸 수 있습니다."},{"sub":"의사소통능력","q":"기획서를 작성할 때 유의할 점으로 옳지 않은 것은?","o":["상대가 요구하는 바를 정확히 파악해 반영한다","핵심 내용을 먼저 제시한다","분량을 늘려 성의를 보이기 위해 반복 서술한다","인용한 자료의 출처를 밝힌다"],"a":2,"e":"분량을 늘리려는 반복 서술은 핵심을 흐리고 읽는 사람의 시간을 뺏습니다. 기획서는 간결성과 설득력이 생명입니다."},{"sub":"수리능력","q":"농도 8%의 소금물 300g과 농도 12%의 소금물 200g을 섞으면 농도는?","o":["9.2%","9.6%","10.0%","10.4%"],"a":1,"e":"소금은 24g과 24g을 합해 48g이고 소금물은 500g입니다. 48 ÷ 500 = 9.6%입니다."},{"sub":"수리능력","q":"10km 떨어진 두 지점에서 A는 시속 4km, B는 시속 6km로 마주 보고 동시에 출발했다. 몇 시간 후에 만나는가?","o":["0.5시간","1시간","1.5시간","2시간"],"a":1,"e":"마주 보고 움직이면 거리가 두 속력의 합만큼 줄어듭니다. 10 ÷ (4 + 6) = 1시간입니다."},{"sub":"수리능력","q":"길이 200m인 기차가 시속 72km로 달려 길이 800m인 터널을 완전히 통과하는 데 걸리는 시간은?","o":["40초","45초","50초","55초"],"a":2,"e":"시속 72km는 초속 20m입니다. 완전히 통과하려면 터널 길이와 기차 길이를 더한 1,000m를 달려야 하므로 1,000 ÷ 20 = 50초입니다."},{"sub":"수리능력","q":"현재 아버지는 45세, 아들은 15세이다. 아버지의 나이가 아들 나이의 2배가 되는 것은 몇 년 후인가?","o":["10년 후","12년 후","15년 후","20년 후"],"a":2,"e":"45 + x = 2(15 + x)를 풀면 45 + x = 30 + 2x이므로 x = 15입니다. 15년 후 아버지 60세, 아들 30세가 됩니다."},{"sub":"수리능력","q":"원가에 25%의 이익을 붙여 정가를 정한 뒤 정가에서 1,000원을 할인해 팔았더니 원가의 15% 이익이 남았다. 이 상품의 원가는?","o":["8,000원","10,000원","12,000원","15,000원"],"a":1,"e":"원가를 C라 하면 0.25C - 1,000 = 0.15C이므로 0.1C = 1,000, C = 10,000원입니다."},{"sub":"수리능력","q":"연이율 5%의 단리로 200만원을 3년간 예치했을 때 받는 이자는?","o":["20만원","30만원","40만원","50만원"],"a":1,"e":"단리 이자는 원금 × 이율 × 기간이므로 200만 × 0.05 × 3 = 30만원입니다. 복리라면 원금에 이자가 더해져 계산됩니다."},{"sub":"수리능력","q":"어떤 회사의 매출이 재작년 대비 작년에 20% 증가하고, 작년 대비 올해 10% 감소했다. 재작년 대비 올해 매출의 변화는?","o":["10% 증가","8% 증가","8% 감소","10% 감소"],"a":1,"e":"1.2 × 0.9 = 1.08이므로 8% 증가입니다. 증가율과 감소율은 단순히 더하고 빼면 안 되고 곱해야 합니다."},{"sub":"수리능력","q":"12, 18, 30의 최대공약수는?","o":["2","3","6","12"],"a":2,"e":"세 수를 소인수분해하면 공통으로 2와 3을 가지므로 최대공약수는 6입니다. 최소공배수는 180입니다."},{"sub":"수리능력","q":"8명 중에서 3명의 대표를 뽑는 경우의 수는? (순서 무관)","o":["24가지","56가지","112가지","336가지"],"a":1,"e":"순서를 따지지 않으므로 조합입니다. 8 × 7 × 6 ÷ (3 × 2 × 1) = 56가지입니다."},{"sub":"수리능력","q":"동전 3개를 동시에 던질 때 앞면이 정확히 2개 나올 확률은?","o":["8분의 1","4분의 1","8분의 3","2분의 1"],"a":2,"e":"전체 경우의 수는 8가지이고 앞면이 2개인 경우는 3가지이므로 8분의 3입니다."},{"sub":"수리능력","q":"빨간 공 3개와 파란 공 5개가 든 주머니에서 2개를 동시에 꺼낼 때 적어도 1개가 빨간 공일 확률은?","o":["14분의 5","14분의 9","28분의 15","28분의 3"],"a":1,"e":"전체는 28가지이고 둘 다 파란 공인 경우는 10가지입니다. 여사건을 이용하면 1 - 10/28 = 9/14입니다."},{"sub":"수리능력","q":"학생 40명 중 축구를 좋아하는 학생이 22명, 야구를 좋아하는 학생이 18명, 둘 다 좋아하는 학생이 8명이다. 둘 다 좋아하지 않는 학생은?","o":["6명","8명","10명","12명"],"a":1,"e":"적어도 하나를 좋아하는 학생은 22 + 18 - 8 = 32명이므로 40 - 32 = 8명입니다."},{"sub":"수리능력","q":"사과 3개와 배 2개는 8,000원, 사과 2개와 배 3개는 7,500원이다. 사과 1개의 가격은?","o":["1,300원","1,500원","1,800원","2,000원"],"a":2,"e":"두 식을 연립해 풀면 사과는 1,800원, 배는 1,300원입니다. 두 식을 더한 뒤 빼는 방식으로 접근하면 빠릅니다."},{"sub":"수리능력","q":"2, 5, 10, 17, 26 다음에 올 수는?","o":["35","36","37","38"],"a":2,"e":"이웃한 항의 차가 3, 5, 7, 9로 2씩 커집니다. 다음 차는 11이므로 26 + 11 = 37입니다."},{"sub":"수리능력","q":"3시 30분에 시계의 시침과 분침이 이루는 작은 쪽 각도는?","o":["70도","75도","80도","85도"],"a":1,"e":"시침은 3시 30분에 105도, 분침은 180도 위치에 있습니다. 차이는 75도입니다."},{"sub":"수리능력","q":"물통을 가득 채우는 데 A관은 4시간, B관은 6시간이 걸린다. 두 관을 함께 쓰면 얼마나 걸리는가?","o":["2시간","2시간 24분","2시간 30분","3시간"],"a":1,"e":"시간당 작업량은 4분의 1과 6분의 1을 합해 12분의 5입니다. 12 ÷ 5 = 2.4시간이므로 2시간 24분입니다."},{"sub":"수리능력","q":"자료 5, 7, 7, 9, 12의 중앙값과 최빈값을 순서대로 나열한 것은?","o":["7, 7","8, 7","7, 9","9, 7"],"a":0,"e":"크기순으로 정렬했을 때 가운데 값이 중앙값이므로 7이고, 가장 많이 나온 값도 7입니다. 평균은 8입니다."},{"sub":"수리능력","q":"어떤 상품의 가격이 20% 인상되었다가 다시 20% 인하되었다. 처음 가격과 비교하면?","o":["같다","4% 높다","4% 낮다","2% 낮다"],"a":2,"e":"1.2 × 0.8 = 0.96이므로 처음보다 4% 낮습니다. 같은 비율로 올렸다 내리면 원래 가격으로 돌아오지 않습니다."},{"sub":"수리능력","q":"남학생 20명의 평균이 70점, 여학생 30명의 평균이 80점일 때 전체 50명의 평균은?","o":["74점","75점","76점","78점"],"a":2,"e":"총점은 1,400 + 2,400 = 3,800점이고 인원은 50명이므로 76점입니다. 두 평균의 단순 평균인 75점이 아니라는 점이 함정입니다."},{"sub":"수리능력","q":"환율이 1달러당 1,300원일 때 260만원을 달러로 환전하면? (수수료 없음)","o":["1,500달러","2,000달러","2,200달러","2,600달러"],"a":1,"e":"2,600,000 ÷ 1,300 = 2,000달러입니다."},{"sub":"수리능력","q":"어떤 일을 A 혼자 하면 12일이 걸리고, A와 B가 함께 하면 4일이 걸린다. B 혼자 하면 며칠이 걸리는가?","o":["5일","6일","8일","9일"],"a":1,"e":"B의 하루 작업량은 4분의 1에서 12분의 1을 뺀 6분의 1입니다. 따라서 6일이 걸립니다."},{"sub":"수리능력","q":"정가 20,000원인 상품을 30% 할인한 뒤 부가가치세 10%를 더하면 최종 가격은?","o":["14,000원","15,400원","15,000원","16,000원"],"a":1,"e":"할인가는 14,000원이고 여기에 10%를 더하면 15,400원입니다."},{"sub":"수리능력","q":"어떤 수에 4를 더한 다음 3을 곱했더니 27이 되었다. 어떤 수는?","o":["3","5","6","9"],"a":1,"e":"3(x + 4) = 27에서 x + 4 = 9이므로 x = 5입니다."},{"sub":"수리능력","q":"둘레가 36cm이고 가로가 세로보다 4cm 긴 직사각형의 넓이는?","o":["70cm²","72cm²","77cm²","80cm²"],"a":2,"e":"가로와 세로의 합은 18cm이고 차가 4cm이므로 가로 11cm, 세로 7cm입니다. 넓이는 77cm²입니다."},{"sub":"문제해결능력","q":"명제 '성실한 사람은 신뢰받는다'의 역에 해당하는 것은?","o":["신뢰받는 사람은 성실하다","성실하지 않은 사람은 신뢰받지 못한다","신뢰받지 못하는 사람은 성실하지 않다","성실한 사람은 신뢰받지 못한다"],"a":0,"e":"역은 가정과 결론을 뒤바꾼 것입니다. 이는 둘 다 부정한 것, 대우는 뒤바꾸고 부정한 것이며 원명제와 참거짓이 늘 같은 것은 대우뿐입니다."},{"sub":"문제해결능력","q":"'어떤 A는 B이다'가 참일 때 반드시 참인 것은?","o":["모든 A는 B이다","어떤 B는 A이다","모든 B는 A이다","어떤 A는 B가 아니다"],"a":1,"e":"A와 B가 겹치는 부분이 존재한다는 뜻이므로 그 부분을 B 쪽에서 보면 어떤 B는 A입니다. 나머지는 주어진 정보만으로 단정할 수 없습니다."},{"sub":"문제해결능력","q":"모든 공무원은 성실하다. 어떤 성실한 사람은 친절하다. 반드시 참인 것은?","o":["모든 공무원은 친절하다","어떤 공무원은 친절하다","친절한 사람은 모두 공무원이다","알 수 없다"],"a":3,"e":"친절한 성실한 사람이 공무원 집합 안에 있는지 밖에 있는지 알 수 없으므로 결론을 내릴 수 없습니다. 어떤이 포함된 전제 두 개로는 확정적 결론이 나오지 않는 경우가 많습니다."},{"sub":"문제해결능력","q":"A는 C보다 크고, B는 A보다 크며, D는 B보다 크다. 가장 작은 것은?","o":["A","B","C","D"],"a":2,"e":"크기 순서는 D, B, A, C입니다. 부등호를 한 줄로 이어 붙이면 빠르게 정리됩니다."},{"sub":"문제해결능력","q":"다섯 명이 원탁에 앉아 있다. 갑의 맞은편은 없고 을은 갑의 바로 왼쪽, 병은 갑의 바로 오른쪽에 앉았다. 정과 무의 위치로 옳은 것은?","o":["정과 무는 서로 이웃해 앉는다","정은 갑의 바로 옆이다","무는 을의 바로 왼쪽이 아니다","정은 병의 맞은편이다"],"a":0,"e":"갑의 양옆이 을과 병으로 정해지면 남은 두 자리가 붙어 있으므로 정과 무는 반드시 이웃합니다. 나머지는 확정할 수 없습니다."},{"sub":"문제해결능력","q":"SWOT 분석에서 강점을 활용해 외부 위협에 대응하는 전략은?","o":["SO 전략","ST 전략","WO 전략","WT 전략"],"a":1,"e":"ST 전략은 내부 강점으로 외부 위협을 막아내는 방향입니다. 강점과 기회의 결합은 SO, 약점과 위협의 최소화는 WT입니다."},{"sub":"문제해결능력","q":"이미 발생하여 눈에 보이는 문제로, 원상복구가 필요한 문제 유형은?","o":["발생형 문제","탐색형 문제","설정형 문제","잠재형 문제"],"a":0,"e":"발생형 문제는 기준을 이탈해 이미 드러난 문제로 원인 지향적입니다. 탐색형은 현재를 개선하려는 문제, 설정형은 미래에 대응하는 문제입니다."},{"sub":"문제해결능력","q":"문제해결을 위한 기본적 사고에 해당하지 않는 것은?","o":["전략적 사고","분석적 사고","발상의 전환","고정관념의 유지"],"a":3,"e":"문제해결의 기본 사고는 전략적 사고, 분석적 사고, 발상의 전환, 내외부 자원의 활용입니다. 고정관념은 오히려 대표적인 장애 요인입니다."},{"sub":"문제해결능력","q":"브레인스토밍의 진행 원칙으로 옳지 않은 것은?","o":["아이디어를 많이 낼수록 좋다","다른 사람의 아이디어에 편승해도 된다","제시된 아이디어를 즉시 비판하고 걸러낸다","자유분방한 분위기를 유지한다"],"a":2,"e":"비판 금지가 브레인스토밍의 핵심 규칙입니다. 평가는 아이디어를 충분히 모은 뒤 별도 단계에서 진행합니다."},{"sub":"문제해결능력","q":"논리적 오류 중 상대방의 주장을 왜곡해 공격하기 쉬운 형태로 바꾼 뒤 반박하는 오류는?","o":["허수아비 공격의 오류","성급한 일반화의 오류","인신공격의 오류","순환논증의 오류"],"a":0,"e":"허수아비 공격은 원래 주장이 아니라 만들어 낸 약한 주장을 공격합니다. 인신공격은 주장 대신 사람을 문제 삼는 오류입니다."},{"sub":"문제해결능력","q":"일부 사례만 보고 전체가 그렇다고 결론짓는 오류는?","o":["순환논증의 오류","성급한 일반화의 오류","흑백논리의 오류","권위에 호소하는 오류"],"a":1,"e":"표본이 대표성을 갖지 못할 때 발생합니다. 두 가지 선택지만 있다고 전제하면 흑백논리, 결론을 전제로 삼으면 순환논증입니다."},{"sub":"문제해결능력","q":"문제해결 절차의 순서로 옳은 것은?","o":["문제 인식 → 문제 도출 → 원인 분석 → 해결안 개발 → 실행 및 평가","원인 분석 → 문제 인식 → 문제 도출 → 해결안 개발 → 실행 및 평가","문제 도출 → 문제 인식 → 해결안 개발 → 원인 분석 → 실행 및 평가","문제 인식 → 원인 분석 → 문제 도출 → 실행 및 평가 → 해결안 개발"],"a":0,"e":"무엇이 문제인지 인식하고 핵심 문제를 뽑아낸 뒤 원인을 파고들어 해결안을 만들고 실행합니다. 원인 분석이 문제 도출보다 앞설 수 없습니다."},{"sub":"문제해결능력","q":"원인과 결과의 관계를 물고기 뼈 모양으로 정리하는 분석 기법은?","o":["로직 트리","특성요인도","파레토 차트","간트 차트"],"a":1,"e":"특성요인도는 이시카와 다이어그램이라고도 하며 결과에 영향을 준 요인을 큰 뼈와 잔가지로 구조화합니다. 간트 차트는 일정 관리 도구입니다."},{"sub":"문제해결능력","q":"전체 결과의 대부분이 소수의 원인에서 비롯된다는 원리는?","o":["파레토 법칙","머피의 법칙","하인리히 법칙","파킨슨 법칙"],"a":0,"e":"80대 20 법칙이라고도 하며 핵심 원인에 자원을 집중하라는 근거가 됩니다. 하인리히 법칙은 큰 사고 이전에 다수의 경미한 징후가 있다는 원리입니다."},{"sub":"문제해결능력","q":"네 사람이 달리기를 했다. 갑은 을보다 빨랐고, 병은 갑보다 느렸으며, 정은 을보다 느렸다. 병과 정의 순위를 알 수 있는가?","o":["병이 정보다 빠르다","정이 병보다 빠르다","둘의 순위는 확정할 수 없다","둘은 동시에 들어왔다"],"a":2,"e":"갑보다 느린 병, 을보다 느린 정이라는 정보만으로는 병과 정을 직접 비교할 수 없습니다. 확정할 수 없다는 선택지를 두려워하지 말아야 합니다."},{"sub":"문제해결능력","q":"다섯 명 중 한 명만 거짓을 말하고 있다. 이런 유형의 문제를 푸는 접근으로 가장 적절한 것은?","o":["가장 그럴듯한 진술을 참으로 가정한다","각 사람이 거짓말쟁이라고 차례로 가정하고 모순 여부를 확인한다","진술이 짧은 사람부터 제외한다","모든 진술을 참으로 놓고 계산한다"],"a":1,"e":"참거짓 문제는 경우를 나누어 가정한 뒤 모순이 생기지 않는 경우 하나를 찾는 방식이 정석입니다. 서로 상반된 진술을 한 두 사람을 먼저 찾으면 시간이 줄어듭니다."},{"sub":"문제해결능력","q":"현재 상태를 개선하기 위해 눈에 보이지 않는 문제를 찾아내는 문제 유형은?","o":["발생형 문제","탐색형 문제","설정형 문제","일상형 문제"],"a":1,"e":"탐색형 문제는 방치하면 나중에 손실이 커지는 문제로 잠재문제, 예측문제, 발견문제로 나뉩니다. 스스로 찾아야 한다는 점이 특징입니다."},{"sub":"문제해결능력","q":"'모든 신입사원은 교육을 받는다'가 참일 때 반드시 참인 것은?","o":["교육을 받은 사람은 신입사원이다","교육을 받지 않은 사람은 신입사원이 아니다","신입사원이 아니면 교육을 받지 않는다","교육을 받지 않은 신입사원도 있다"],"a":1,"e":"원명제의 대우이므로 반드시 참입니다. 첫 번째는 역, 세 번째는 이에 해당해 참이라고 단정할 수 없습니다."},{"sub":"문제해결능력","q":"창의적 사고를 개발하는 기법 중 서로 관련 없어 보이는 요소를 결합해 새로운 아이디어를 얻는 방법은?","o":["자유연상법","강제연결법","비교발상법","체크리스트법"],"a":1,"e":"강제연결법은 무관한 대상을 억지로 연결해 발상을 끌어냅니다. 자유연상법의 대표가 브레인스토밍, 비교발상법의 대표가 유추법인 시넥틱스입니다."},{"sub":"문제해결능력","q":"다음 조건에서 반드시 참인 것은? 조건 1: 회의에 참석하면 보고서를 제출한다. 조건 2: 보고서를 제출하지 않았다.","o":["회의에 참석했다","회의에 참석하지 않았다","보고서를 제출할 것이다","알 수 없다"],"a":1,"e":"조건 1의 대우는 보고서를 제출하지 않으면 회의에 참석하지 않았다입니다. 조건 2와 결합하면 회의에 참석하지 않았음이 확정됩니다."},{"sub":"문제해결능력","q":"3C 분석에서 자사의 강점과 약점을 파악하는 항목은?","o":["Customer","Competitor","Company","Channel"],"a":2,"e":"Company는 자사의 역량과 자원을 분석하는 항목입니다. Customer는 시장과 고객 요구, Competitor는 경쟁사의 전략과 점유율을 봅니다."},{"sub":"문제해결능력","q":"문제를 큰 항목에서 작은 항목으로 나누어 나무 형태로 구조화하는 기법은?","o":["로직 트리","벤 다이어그램","산점도","히스토그램"],"a":0,"e":"로직 트리는 문제를 중복 없이 누락 없이 나누는 MECE 원칙에 따라 전개합니다. 원인 파악과 해결안 도출 모두에 쓰입니다."},{"sub":"문제해결능력","q":"분석적 사고에 관한 설명으로 옳은 것은?","o":["직관에 의존해 빠르게 결론을 내린다","전체를 요소로 나누어 각각의 의미를 도출한 뒤 결론을 이끈다","경험을 그대로 적용한다","다른 사람의 판단을 그대로 수용한다"],"a":1,"e":"분석적 사고는 대상을 구성 요소로 분해해 의미를 뽑아낸 뒤 종합합니다. 성과 지향, 가설 지향, 사실 지향 문제로 나누어 접근합니다."},{"sub":"문제해결능력","q":"다음 중 MECE 원칙에 맞게 분류한 것은?","o":["직원을 신입, 경력, 우수사원으로 나눈다","고객을 20대, 30대, 40대 이상으로 나눈다","상품을 인기상품과 신상품으로 나눈다","부서를 영업부와 성과가 좋은 부서로 나눈다"],"a":1,"e":"MECE는 항목이 서로 겹치지 않고 전체를 빠짐없이 덮어야 합니다. 연령 구분은 중복이 없고 전체를 포괄하지만 나머지는 기준이 섞여 중복이 생깁니다."},{"sub":"의사소통능력","q":"'왠'과 '웬'의 쓰임이 옳은 문장은?","o":["오늘은 왠지 기분이 좋다","웬지 불안하다","이게 왠 떡이냐","왠일로 이렇게 일찍 왔니"],"a":0,"e":"'왠지'는 '왜인지'의 준말이라 이 한 단어에만 '왠'을 씁니다. 그 밖에는 모두 '웬'이며 '웬 떡', '웬일'이 맞습니다."},{"sub":"의사소통능력","q":"'이따가'와 '있다가'의 쓰임이 옳은 문장은?","o":["이따가 다시 연락할게","있다가 만나자고 했다","잠시 이따 와라","조금 있다가 후에 보자"],"a":0,"e":"시간이 조금 지난 뒤를 뜻할 때는 '이따가', 어떤 곳에 머무르다가의 뜻일 때는 '있다가'를 씁니다."},{"sub":"의사소통능력","q":"'가르치다'와 '가리키다'의 쓰임이 옳은 문장은?","o":["손가락으로 북쪽을 가르쳤다","선생님이 수학을 가리킨다","시계가 열 시를 가리킨다","아이에게 예절을 가리켰다"],"a":2,"e":"'가르치다'는 지식이나 기능을 알려주는 것이고 '가리키다'는 방향이나 대상을 지시하는 것입니다."},{"sub":"의사소통능력","q":"'늘리다'와 '늘이다'의 쓰임이 옳은 문장은?","o":["고무줄을 늘렸다","인원을 늘였다","바지 길이를 늘였다","예산을 늘였다"],"a":2,"e":"'늘이다'는 길이를 길게 하는 것이고 '늘리다'는 수나 양, 크기를 많게 하는 것입니다. 바지 길이는 '늘이다', 인원과 예산은 '늘리다'입니다."},{"sub":"의사소통능력","q":"'곤혹'과 '곤욕'의 쓰임이 옳은 문장은?","o":["예상 못 한 질문에 곤욕스러웠다","심한 모욕을 당해 곤욕을 치렀다","곤욕스러운 표정을 지었다","곤혹을 치르게 하였다"],"a":1,"e":"'곤욕'은 심한 모욕이나 참기 힘든 일 자체를 뜻하고, '곤혹'은 곤란해 어찌할 바를 모르는 상태입니다. '곤혹스럽다'는 있어도 '곤욕스럽다'는 어색합니다."},{"sub":"의사소통능력","q":"'유래'와 '유례'의 쓰임이 옳은 문장은?","o":["유래 없는 폭우가 내렸다","이 축제의 유례를 조사하였다","유례를 찾기 힘든 기록이다","지명의 유례가 오래되었다"],"a":2,"e":"'유래'는 사물이 생겨난 내력, '유례'는 같거나 비슷한 예를 뜻합니다. 비슷한 사례가 없다는 뜻이면 '유례없는'이 맞습니다."},{"sub":"의사소통능력","q":"'일절'과 '일체'의 쓰임이 옳은 문장은?","o":["출입을 일체 금지한다","안주 일절 준비되어 있습니다","비용 일절을 부담하겠다","면회를 일절 사절합니다"],"a":3,"e":"'일절'은 아주, 전혀의 뜻으로 부정이나 금지에 쓰고, '일체'는 모든 것을 뜻합니다. 금지 문맥이므로 '일절'이 맞습니다."},{"sub":"의사소통능력","q":"'부문'과 '부분'의 쓰임이 옳은 문장은?","o":["기술 부분에서 수상하였다","사과의 썩은 부문을 도려냈다","소설 부문 신인상을 받았다","전체의 일부 부문만 확인했다"],"a":2,"e":"'부문'은 전체를 갈래로 나눈 영역이고 '부분'은 전체를 이루는 조각입니다. 시상 분야는 '부문'입니다."},{"sub":"의사소통능력","q":"'보전'과 '보존'의 쓰임이 옳은 문장은?","o":["문화재를 원형대로 보전하였다","생태계를 보존하기 위해 개발을 제한한다","손실을 보전하기 위해 예산을 투입했다","유물을 보전 처리하였다"],"a":2,"e":"'보전'은 온전하게 유지하거나 부족한 것을 메우는 것이고, '보존'은 잘 간수해 그대로 남기는 것입니다. 손실 메우기는 '보전'입니다."},{"sub":"의사소통능력","q":"'혼돈'과 '혼동'의 쓰임이 옳은 문장은?","o":["두 단어를 혼돈하기 쉽다","전쟁으로 사회가 혼동에 빠졌다","앞뒤를 혼동하여 잘못 적었다","가치관의 혼동이 심각하다"],"a":2,"e":"'혼동'은 서로 뒤섞어 구별하지 못하는 것이고, '혼돈'은 질서가 없이 뒤죽박죽인 상태입니다."},{"sub":"의사소통능력","q":"'실재'와 '실제'의 쓰임이 옳은 문장은?","o":["실재로는 그렇지 않다","소설 속 인물이 실제한다","그 인물은 실재 인물이다","실재 상황을 보고하라"],"a":2,"e":"'실재'는 실제로 존재하는 것이고, '실제'는 사실의 경우나 형편을 뜻합니다. 실존 인물은 '실재 인물'입니다."},{"sub":"의사소통능력","q":"'임대'와 '임차'의 쓰임이 옳은 문장은?","o":["세입자가 사무실을 임대하였다","건물주가 사무실을 임대하였다","건물주가 사무실을 임차하였다","임대인은 돈을 내고 빌리는 사람이다"],"a":1,"e":"'임대'는 빌려주는 것, '임차'는 빌리는 것입니다. 건물주가 빌려주므로 임대인, 세입자가 빌리므로 임차인입니다."},{"sub":"의사소통능력","q":"'추돌'과 '충돌'의 쓰임이 옳은 문장은?","o":["마주 오던 차량이 추돌하였다","앞차의 뒤를 들이받는 추돌 사고가 났다","뒤에서 충돌하여 밀려났다","교차로에서 추돌한 두 차량"],"a":1,"e":"'추돌'은 뒤에서 들이받는 것이고 '충돌'은 서로 마주치거나 부딪히는 것입니다."},{"sub":"의사소통능력","q":"'좇다'와 '쫓다'의 쓰임이 옳은 문장은?","o":["도둑을 좇아 달렸다","명예를 쫓는 삶","스승의 뜻을 좇았다","파리를 좇아 버렸다"],"a":2,"e":"'좇다'는 목표나 뜻, 이상을 추구하는 것이고 '쫓다'는 물리적으로 뒤를 따르거나 몰아내는 것입니다."},{"sub":"의사소통능력","q":"'반드시'와 '반듯이'의 쓰임이 옳은 문장은?","o":["반듯이 참석하겠습니다","선을 반듯이 그어라","약속은 반듯이 지켜야 한다","반드시 앉아라"],"a":1,"e":"'반드시'는 꼭, 틀림없이의 뜻이고 '반듯이'는 비뚤어지지 않고 곧게라는 뜻입니다."},{"sub":"의사소통능력","q":"'매다'와 '메다'의 쓰임이 옳은 문장은?","o":["가방을 매고 등교했다","넥타이를 메었다","신발끈을 매었다","어깨에 가방을 매다"],"a":2,"e":"'매다'는 끈이나 줄을 묶는 것이고 '메다'는 어깨에 걸치거나 짊어지는 것입니다. 신발끈은 '매다', 가방은 '메다'입니다."},{"sub":"의사소통능력","q":"'만'의 띄어쓰기가 옳은 것은?","o":["십 년 만에 만났다","십년만에 만났다","십 년만에 만났다","십년 만에 만났다"],"a":0,"e":"'년'은 단위 명사이고 시간의 경과를 뜻하는 '만'도 의존명사이므로 모두 띄어 씁니다."},{"sub":"의사소통능력","q":"'뿐'의 띄어쓰기가 옳은 것은?","o":["최선을 다할 뿐이다","최선을 다할뿐이다","나뿐 아니라 너도","좋을 대로 하라"],"a":0,"e":"'뿐'이 용언 뒤에 오면 의존명사라 띄어 쓰고, 체언 뒤에 오면 조사라 붙여 씁니다. '나뿐'은 붙이고 '다할 뿐'은 띄웁니다."},{"sub":"의사소통능력","q":"문장의 호응이 자연스러운 것은?","o":["나는 결코 그 일을 한 적이 있다","비록 실패하더라도 포기하지 않겠다","만약 내일 비가 오면 좋겠다","반드시 그럴 리가 없다"],"a":1,"e":"'결코', '반드시', '여간' 등은 호응하는 서술어가 정해져 있습니다. '결코'는 부정, '비록'은 양보, '만약'은 가정과 호응합니다."},{"sub":"의사소통능력","q":"사이시옷 표기가 옳은 것은?","o":["최대값","등교길","나뭇잎","해님"],"a":2,"e":"'나뭇잎'은 사이시옷을 받쳐 적습니다. '최댓값', '등굣길'이 맞는 표기이며 '해님'은 사이시옷을 쓰지 않습니다."},{"sub":"의사소통능력","q":"공문서 작성에서 시간을 표기하는 방법으로 옳은 것은?","o":["오후 2시 30분","14:30","14시 30분","PM 2:30"],"a":1,"e":"시각은 24시각제에 따라 숫자로 쓰고 시와 분 사이에 쌍점을 찍습니다."},{"sub":"의사소통능력","q":"효과적인 피드백의 원칙으로 옳지 않은 것은?","o":["구체적인 행동을 대상으로 한다","가능한 한 시기를 놓치지 않는다","사람의 인격을 평가한다","개선 가능한 부분에 초점을 둔다"],"a":2,"e":"피드백은 사람이 아니라 행동과 결과를 대상으로 해야 합니다. 인격을 평가하면 방어적 반응만 부릅니다."},{"sub":"의사소통능력","q":"의사표현에서 상대를 설득할 때 권장되는 방법이 아닌 것은?","o":["상대의 이익을 함께 제시한다","구체적 근거와 자료를 제시한다","상대의 반론을 미리 차단하기 위해 말을 끊는다","결론을 명확히 밝힌다"],"a":2,"e":"말을 끊는 것은 반감을 키웁니다. 반론은 미리 예상해 답변을 준비하는 방식으로 대응해야 합니다."},{"sub":"의사소통능력","q":"문서 작성 시 육하원칙에 해당하지 않는 것은?","o":["누가","언제","얼마나 비싸게","어떻게"],"a":2,"e":"육하원칙은 누가, 언제, 어디서, 무엇을, 어떻게, 왜입니다. 가격은 별도 항목이지 육하원칙 요소가 아닙니다."},{"sub":"의사소통능력","q":"보고서 작성 원칙으로 옳지 않은 것은?","o":["결론을 앞에 제시한다","근거 자료의 출처를 밝힌다","가능한 한 길고 상세하게 작성한다","도표를 활용해 이해를 돕는다"],"a":2,"e":"보고서는 읽는 사람의 시간을 아끼는 문서입니다. 핵심을 앞에 두고 간결하게 쓰는 것이 원칙입니다."},{"sub":"의사소통능력","q":"'제고'의 뜻으로 옳은 것은?","o":["다시 생각함","수준이나 정도를 끌어올림","앞서 만들어 둠","남은 물건"],"a":1,"e":"'제고'는 쳐들어 높인다는 뜻으로 효율 제고, 품질 제고처럼 씁니다. 다시 생각하는 것은 '재고'입니다."},{"sub":"의사소통능력","q":"'지그시'와 '지긋이'의 쓰임이 옳은 문장은?","o":["나이가 지그시 들었다","눈을 지그시 감았다","지긋이 눌러 주세요","지긋이 참고 견뎠다"],"a":1,"e":"'지그시'는 슬며시 힘을 주는 모양이고 '지긋이'는 나이가 비교적 많아 듬직한 모양을 뜻합니다."},{"sub":"의사소통능력","q":"'바라다'와 '바래다'의 쓰임이 옳은 문장은?","o":["성공하길 바래","색이 바랬다","네가 오기를 바랬다","합격하길 바래요"],"a":1,"e":"소망은 '바라다'이므로 '바라', '바랍니다'가 맞습니다. '바래다'는 색이 옅어지거나 배웅한다는 뜻입니다."},{"sub":"의사소통능력","q":"'안치다'와 '앉히다'의 쓰임이 옳은 문장은?","o":["밥을 앉혔다","아이를 의자에 안혔다","솥에 쌀을 안쳤다","손님을 안쳤다"],"a":2,"e":"'안치다'는 밥이나 찌개를 솥에 넣고 불에 올리는 것이고, '앉히다'는 앉게 하는 것입니다."},{"sub":"의사소통능력","q":"'두껍다'와 '두텁다'의 쓰임이 옳은 문장은?","o":["두터운 책을 읽었다","신뢰가 두텁다","얼음이 두텁게 얼었다","두꺼운 정을 나누었다"],"a":1,"e":"'두껍다'는 물리적 두께에, '두텁다'는 신뢰나 정 같은 관계의 깊이에 씁니다."},{"sub":"수리능력","q":"12분 간격으로 출발하는 A버스와 18분 간격으로 출발하는 B버스가 오전 8시에 동시에 출발했다. 다음에 동시에 출발하는 시각은?","o":["오전 8시 24분","오전 8시 36분","오전 8시 48분","오전 9시"],"a":1,"e":"12와 18의 최소공배수는 36이므로 36분 뒤인 8시 36분에 다시 겹칩니다. 동시에 일어나는 주기를 묻는 문제는 최소공배수를 씁니다."},{"sub":"수리능력","q":"농도 12%의 소금물 500g에서 물 100g을 증발시키면 농도는?","o":["13%","14%","15%","16%"],"a":2,"e":"소금의 양은 500 × 0.12 = 60g으로 변하지 않고 전체는 400g이 됩니다. 60 ÷ 400 = 15%입니다."},{"sub":"수리능력","q":"100만원을 연이율 10%의 복리로 2년간 예치했을 때 원리금 합계는?","o":["110만원","120만원","121만원","125만원"],"a":2,"e":"복리는 원금에 이자가 붙고 그 이자에 다시 이자가 붙습니다. 100만 × 1.1 × 1.1 = 121만원이며, 단리라면 120만원입니다."},{"sub":"수리능력","q":"정지한 물에서 시속 10km로 가는 배가 유속 2km/h인 강을 24km 거슬러 올라가는 데 걸리는 시간은?","o":["2시간","2시간 24분","3시간","4시간"],"a":2,"e":"거슬러 올라갈 때의 속력은 10 - 2 = 8km/h이므로 24 ÷ 8 = 3시간입니다. 내려올 때는 12km/h가 됩니다."},{"sub":"수리능력","q":"톱니가 24개인 톱니바퀴 A와 톱니가 36개인 톱니바퀴 B가 맞물려 돌고 있다. A가 3바퀴 돌 때 B는 몇 바퀴 도는가?","o":["1바퀴","2바퀴","3바퀴","4바퀴"],"a":1,"e":"맞물린 톱니 수는 서로 같으므로 24 × 3 = 72개, 72 ÷ 36 = 2바퀴입니다. 톱니 수와 회전수는 반비례합니다."},{"sub":"수리능력","q":"원가가 8,000원인 상품을 팔아 원가의 25% 이익을 남기려면 판매가는?","o":["9,000원","9,600원","10,000원","10,400원"],"a":2,"e":"8,000 × 1.25 = 10,000원입니다. 이익률의 기준이 원가인지 판매가인지 확인하는 것이 이런 문제의 핵심입니다."},{"sub":"수리능력","q":"9,000만원을 2 : 3 : 4의 비율로 나눌 때 가장 큰 몫은?","o":["2,000만원","3,000만원","4,000만원","4,500만원"],"a":2,"e":"비의 합이 9이므로 한 몫은 1,000만원입니다. 가장 큰 몫은 4 × 1,000만 = 4,000만원입니다."},{"sub":"수리능력","q":"6명이 10일 동안 해야 끝나는 일을 4명이 하면 며칠이 걸리는가? (개인별 작업 속도는 같음)","o":["12일","15일","18일","20일"],"a":1,"e":"전체 작업량은 6 × 10 = 60인일입니다. 4명이 하면 60 ÷ 4 = 15일이 걸립니다."},{"sub":"수리능력","q":"불량률이 10%인 제품 중에서 2개를 골랐을 때 둘 다 정상일 확률은? (복원추출)","o":["0.71","0.81","0.90","0.99"],"a":1,"e":"정상일 확률이 0.9이므로 0.9 × 0.9 = 0.81입니다. 적어도 하나가 불량일 확률은 1에서 이를 뺀 0.19입니다."},{"sub":"수리능력","q":"어느 회사의 매출이 250억원에서 300억원으로 늘었다. 증가율은?","o":["16.7%","20%","25%","50%"],"a":1,"e":"증가율은 증가분을 기준연도 값으로 나눕니다. 50 ÷ 250 = 20%입니다. 300을 기준으로 나누지 않도록 주의하세요."},{"sub":"문제해결능력","q":"업무 계획을 세울 때 활용하는 5W2H에서 두 개의 H에 해당하는 것은?","o":["How와 How much","How와 However","How many와 How long","Who와 How"],"a":0,"e":"5W2H는 What, Why, Where, When, Who에 How(방법)와 How much(비용)를 더한 것입니다. 비용까지 함께 고려한다는 점이 특징입니다."},{"sub":"문제해결능력","q":"주장의 내용이 아니라 주장하는 사람의 인격이나 배경을 공격하는 논리적 오류는?","o":["인신공격의 오류","성급한 일반화의 오류","순환논증의 오류","흑백논리의 오류"],"a":0,"e":"인신공격은 논점을 사람으로 옮기는 오류입니다. 결론을 전제로 삼아 다시 결론을 증명하면 순환논증, 선택지를 둘로만 한정하면 흑백논리입니다."},{"sub":"문제해결능력","q":"'모든 A는 B이다'와 '어떤 B는 C이다'가 모두 참일 때 반드시 참인 것은?","o":["모든 A는 C이다","어떤 A는 C이다","어떤 A는 C가 아니다","반드시 참인 것은 없다"],"a":3,"e":"A는 B에 포함되지만 C와 겹치는 B의 부분이 A와 관련 있는지는 알 수 없습니다. 중간 개념이 부분으로만 연결되면 결론을 확정할 수 없습니다."},{"sub":"문제해결능력","q":"분석 결과에서 의미 있는 시사점을 이끌어내는 사고 기법으로, '그래서 무엇인가'를 반복해 묻는 방법은?","o":["So What 기법","5Why 기법","MECE","브레인스토밍"],"a":0,"e":"So What은 자료에서 결론을 끌어내는 기법이고, 5Why는 왜를 반복해 근본 원인을 찾는 기법입니다."},{"sub":"문제해결능력","q":"결론을 정점에 두고 그 아래에 근거를 계층적으로 배치해 논리를 구성하는 방법은?","o":["피라미드 구조","로직트리","간트차트","파레토 차트"],"a":0,"e":"피라미드 구조는 결론과 근거의 관계를 위아래로 정리해 설득력을 높입니다. 로직트리는 문제를 하위 항목으로 쪼개는 데 쓰입니다."},{"sub":"문제해결능력","q":"비판적 사고를 위해 필요한 태도로 보기 어려운 것은?","o":["지적 호기심을 갖는다","자신의 생각을 검토할 줄 안다","다른 관점을 고려한다","권위 있는 사람의 견해를 무조건 수용한다"],"a":3,"e":"비판적 사고는 근거를 따져 판단하는 것입니다. 권위에 기대어 그대로 받아들이는 것은 권위에 호소하는 오류에 가깝습니다."},{"sub":"문제해결능력","q":"문제 인식 단계의 절차로 옳은 것은?","o":["환경 분석 → 주요 과제 도출 → 과제 선정","과제 선정 → 환경 분석 → 주요 과제 도출","주요 과제 도출 → 과제 선정 → 환경 분석","환경 분석 → 과제 선정 → 주요 과제 도출"],"a":0,"e":"먼저 3C나 SWOT으로 환경을 분석하고, 거기서 과제를 뽑은 뒤 우선순위를 매겨 선정합니다."},{"sub":"문제해결능력","q":"갑, 을, 병, 정 네 명이 일렬로 서 있다. 갑은 맨 앞이 아니고, 을은 갑 바로 뒤에 있으며, 병은 맨 뒤에 있다. 맨 앞에 선 사람은?","o":["갑","을","병","정"],"a":3,"e":"병이 4번이고 갑과 을이 붙어 있으므로 갑과 을은 2·3번입니다. 갑이 맨 앞이 아니라는 조건과도 맞으므로 남은 1번은 정입니다."},{"sub":"문제해결능력","q":"서로 관련이 없어 보이는 두 대상을 억지로 연결해 새로운 아이디어를 얻는 창의적 사고 기법은?","o":["강제결합법","체크리스트법","브레인라이팅","델파이법"],"a":0,"e":"강제결합법은 무관한 요소를 결합해 발상의 틀을 깨는 기법입니다. 체크리스트법은 정해진 질문 목록으로 아이디어를 확장합니다."},{"sub":"문제해결능력","q":"'회의에 참석하면 자료를 준비한다'가 참일 때, 자료를 준비하지 않은 사람에 대해 반드시 참인 것은?","o":["회의에 참석했다","회의에 참석하지 않았다","자료를 준비할 예정이다","알 수 없다"],"a":1,"e":"원명제가 참이면 대우도 참입니다. '자료를 준비하지 않으면 회의에 참석하지 않았다'가 대우이므로 반드시 참입니다."}]},{"id":"kosaf-major","name":"장학재단 직무수행능력","exam":"2026-10-18","note":"경영·경제·민상법 · 객관식 50문항 60분 · 50점","questions":[{"sub":"민법총칙","q":"미성년자가 법정대리인의 동의 없이 단독으로 유효하게 할 수 있는 행위는?","o":["부담부 증여를 받는 행위","단순히 권리만을 얻거나 의무를 면하는 행위","자신의 채권에 대한 변제를 수령하는 행위","법정대리인의 동의 없이 체결한 근로계약"],"a":1,"e":"민법 제5조 제1항 단서. 미성년자라도 단순히 권리만을 얻거나 의무를 면하는 행위는 단독으로 할 수 있습니다. 부담부 증여는 의무를 함께 지므로 안 되고, 변제 수령은 기존 채권을 소멸시켜 권리를 잃는 결과가 되므로 단독으로 할 수 없다는 것이 통설입니다."},{"sub":"민법총칙","q":"통정허위표시에 관한 설명으로 옳은 것은?","o":["취소할 수 있는 법률행위이다","당사자 사이에서는 무효이나 선의의 제3자에게 대항하지 못한다","제3자가 보호받으려면 선의이고 과실이 없어야 한다","누구에게나 주장할 수 있는 절대적 무효이다"],"a":1,"e":"민법 제108조. 상대방과 통정한 허위의 의사표시는 무효이지만 그 무효를 선의의 제3자에게 대항하지 못하는 상대적 무효입니다. 제3자는 선의이기만 하면 되고 무과실까지는 요구되지 않는다는 것이 판례입니다."},{"sub":"민법총칙","q":"다음 중 소멸시효기간이 3년인 채권은?","o":["음식점의 음식대금 채권","의사의 치료비 채권","일반 민사채권","상행위로 인하여 생긴 채권"],"a":1,"e":"민법 제163조에 따라 의사·조산사·간호사의 치료비 채권은 3년입니다. 음식대금은 제164조의 1년, 일반 민사채권은 제162조의 10년, 상행위 채권은 상법 제64조의 5년입니다. 네 가지를 한 세트로 외우면 출제 형태가 바뀌어도 대응됩니다."},{"sub":"민법총칙","q":"표현대리에 관한 설명으로 옳지 않은 것은?","o":["본인이 제3자에게 타인에게 대리권을 수여했음을 표시한 경우 성립할 수 있다","대리인이 권한 밖의 행위를 하고 상대방에게 정당한 이유가 있으면 성립한다","대리권이 소멸한 후의 행위에도 성립할 수 있다","표현대리가 성립하면 본인은 그 행위에 대한 책임을 면한다"],"a":3,"e":"표현대리는 대리권을 신뢰한 상대방을 보호하는 제도이므로 성립하면 본인이 책임을 집니다. 나머지는 각각 제125조(대리권 수여의 표시), 제126조(권한을 넘은 표현대리), 제129조(대리권 소멸 후의 표현대리)입니다."},{"sub":"민법총칙","q":"다음 중 무효인 법률행위에 해당하는 것은?","o":["사기에 의한 의사표시","착오로 인한 의사표시","선량한 풍속 기타 사회질서에 위반한 사항을 내용으로 하는 법률행위","미성년자가 법정대리인의 동의 없이 한 법률행위"],"a":2,"e":"민법 제103조의 반사회질서 법률행위는 무효입니다. 사기·강박(제110조), 착오(제109조), 제한능력자의 행위(제5조 제2항)는 모두 취소할 수 있는 법률행위입니다. 무효 사유와 취소 사유의 구분은 출제 빈도가 매우 높습니다."},{"sub":"민법총칙","q":"소멸시효의 중단사유에 해당하지 않는 것은?","o":["청구","압류 또는 가압류, 가처분","승인","천재 기타 사변"],"a":3,"e":"민법 제168조의 중단사유는 청구, 압류·가압류·가처분, 승인 세 가지입니다. 천재 기타 사변은 제182조의 시효 정지사유입니다. 중단은 진행한 기간이 소멸하고 새로 시작되지만, 정지는 일정 기간 완성이 미뤄질 뿐이라는 점에서 다릅니다."},{"sub":"민법총칙","q":"착오로 인한 의사표시에 관한 설명으로 옳은 것은?","o":["동기의 착오는 언제나 취소할 수 있다","법률행위 내용의 중요부분에 착오가 있어도 표의자에게 중대한 과실이 있으면 취소할 수 없다","착오를 이유로 한 취소는 선의의 제3자에게도 대항할 수 있다","착오로 인한 의사표시는 처음부터 무효이다"],"a":1,"e":"민법 제109조. 법률행위 내용의 중요부분에 착오가 있으면 취소할 수 있으나, 그 착오가 표의자의 중대한 과실로 인한 때에는 취소하지 못합니다. 또한 취소는 선의의 제3자에게 대항하지 못합니다."},{"sub":"민법총칙","q":"조건부 법률행위에 관한 설명으로 옳은 것은?","o":["정지조건부 법률행위는 조건이 성취한 때로부터 효력이 생긴다","해제조건부 법률행위는 조건이 성취한 때로부터 효력이 생긴다","조건이 선량한 풍속에 위반하면 그 조건만 무효가 된다","불능조건이 정지조건인 법률행위는 유효하다"],"a":0,"e":"민법 제147조 제1항. 정지조건은 성취 시 효력이 발생하고 해제조건은 성취 시 효력이 소멸합니다. 불법조건이 붙으면 조건만이 아니라 법률행위 전부가 무효이고(제151조), 불능조건이 정지조건이면 법률행위 자체가 무효입니다."},{"sub":"민법총칙","q":"태아를 이미 출생한 것으로 보는 경우에 해당하지 않는 것은?","o":["불법행위로 인한 손해배상청구","상속","유증","근로계약의 체결"],"a":3,"e":"권리능력은 출생한 때부터 시작되나(제3조), 불법행위 손해배상청구(제762조), 상속(제1000조 제3항), 유증(제1064조) 등에서 태아를 예외적으로 이미 출생한 것으로 봅니다. 근로계약 체결은 여기에 포함되지 않습니다."},{"sub":"민법총칙","q":"소멸시효와 제척기간의 비교로 옳은 것은?","o":["제척기간에는 시효의 중단이 인정되지 않는다","제척기간은 당사자가 원용해야 법원이 고려한다","소멸시효는 권리관계를 신속히 확정하기 위한 제도로 중단이 없다","소멸시효의 이익은 미리 포기할 수 있다"],"a":0,"e":"제척기간은 권리관계를 신속히 확정하려는 제도라 중단·정지가 없고 법원이 직권으로 고려합니다. 반면 소멸시효는 중단·정지가 있고 당사자의 원용이 필요합니다. 소멸시효의 이익은 미리 포기할 수 없습니다(제184조 제1항)."},{"sub":"민법총칙","q":"복대리에 관한 설명으로 옳은 것은?","o":["임의대리인은 언제든지 자유롭게 복대리인을 선임할 수 있다","임의대리인은 본인의 승낙이 있거나 부득이한 사유가 있어야 복대리인을 선임할 수 있다","복대리인은 본인의 대리인이 아니라 대리인의 대리인이다","복대리인을 선임하면 원래 대리인의 대리권은 소멸한다"],"a":1,"e":"민법 제120조. 임의대리인은 본인의 승낙이나 부득이한 사유가 있는 때에만 복대리인을 선임할 수 있습니다. 복대리인은 본인의 대리인이며, 복대리인 선임 후에도 원래 대리인의 대리권은 그대로 존속합니다."},{"sub":"민법총칙","q":"진의 아닌 의사표시(비진의표시)의 효력으로 옳은 것은?","o":["언제나 무효이다","원칙적으로 유효하나 상대방이 알았거나 알 수 있었을 경우 무효이다","언제나 취소할 수 있다","상대방이 선의라면 취소할 수 있다"],"a":1,"e":"민법 제107조 제1항. 진의 아닌 의사표시라도 원칙적으로 유효하며, 상대방이 표의자의 진의 아님을 알았거나 알 수 있었을 경우에만 무효입니다. 이 무효도 선의의 제3자에게는 대항하지 못합니다."},{"sub":"상법","q":"상행위로 인하여 생긴 채권의 소멸시효기간은?","o":["1년","3년","5년","10년"],"a":2,"e":"상법 제64조. 상행위로 인한 채권은 다른 규정이 없으면 5년의 소멸시효에 걸립니다. 민법상 일반 채권의 10년보다 짧은 것은 상거래의 신속한 결제를 위한 것입니다."},{"sub":"상법","q":"현행 상법상 주식회사의 자본금에 관한 설명으로 옳은 것은?","o":["최저자본금은 5천만원 이상이어야 한다","최저자본금 제한은 폐지되었다","최저자본금은 1억원 이상이어야 한다","최저자본금은 업종별로 정한다"],"a":1,"e":"2009년 상법 개정으로 주식회사의 최저자본금 제도는 폐지되었습니다. 액면주식의 1주 금액이 100원 이상이어야 한다는 제한만 남아 있습니다."},{"sub":"상법","q":"주주총회 보통결의의 요건으로 옳은 것은?","o":["출석 주주 의결권의 과반수와 발행주식총수의 4분의 1 이상","출석 주주 의결권의 3분의 2 이상과 발행주식총수의 3분의 1 이상","발행주식총수의 과반수","출석 주주 전원의 동의"],"a":0,"e":"상법 제368조 제1항. 보통결의는 출석한 주주 의결권의 과반수와 발행주식총수의 4분의 1 이상으로 성립합니다. 특별결의는 출석 의결권의 3분의 2 이상과 발행주식총수의 3분의 1 이상입니다."},{"sub":"상법","q":"주주총회 특별결의 사항에 해당하지 않는 것은?","o":["정관의 변경","영업 전부의 양도","회사의 합병","이사의 선임"],"a":3,"e":"이사의 선임은 보통결의 사항입니다. 정관 변경, 영업의 전부 또는 중요한 일부의 양도, 합병·분할, 자본금 감소 등은 특별결의 사항입니다. 다만 이사의 해임은 특별결의 사항이라는 점에 주의해야 합니다."},{"sub":"상법","q":"지배인에 관한 설명으로 옳지 않은 것은?","o":["영업주에 갈음하여 영업에 관한 재판상 또는 재판 외의 모든 행위를 할 수 있다","지배인의 대리권에 대한 제한은 선의의 제3자에게 대항하지 못한다","영업주의 허락 없이 동종 영업을 목적으로 하는 회사의 무한책임사원이 될 수 있다","지배인의 선임과 해임은 등기하여야 한다"],"a":2,"e":"상법 제17조의 경업금지의무. 상업사용인은 영업주의 허락 없이 자기 또는 제3자의 계산으로 영업주의 영업부류에 속한 거래를 하거나, 동종 영업을 목적으로 하는 회사의 무한책임사원·이사가 되지 못합니다."},{"sub":"상법","q":"상법상 회사의 종류에 해당하지 않는 것은?","o":["합자회사","유한책임회사","유한회사","익명조합"],"a":3,"e":"상법 제170조가 정한 회사는 합명회사, 합자회사, 유한책임회사, 주식회사, 유한회사 다섯 가지입니다. 익명조합은 상행위편의 계약 유형이지 회사가 아닙니다."},{"sub":"상법","q":"상호에 관한 설명으로 옳은 것은?","o":["회사는 상호 중에 회사의 종류를 표시하여야 한다","상인은 반드시 성명을 상호로 사용하여야 한다","상호는 등기하지 않으면 사용할 수 없다","한 개의 영업에 여러 개의 상호를 사용할 수 있다"],"a":0,"e":"상법 제19조. 회사는 그 종류에 따라 합명회사, 합자회사, 주식회사 등의 문자를 상호에 사용해야 합니다. 상호는 자유롭게 정할 수 있고 등기는 의무가 아니며(회사는 제외), 하나의 영업에는 하나의 상호만 사용해야 합니다."},{"sub":"상법","q":"이사가 자기 또는 제3자의 계산으로 회사와 거래를 하려는 경우 필요한 절차는?","o":["주주총회의 보통결의","이사회의 승인","감사의 동의","별도의 절차가 필요 없다"],"a":1,"e":"상법 제398조. 이사의 자기거래는 미리 이사회에서 해당 거래에 관한 중요사실을 밝히고 이사회의 승인을 받아야 합니다. 경업금지 위반 시에도 이사회의 승인이 요구됩니다."},{"sub":"미시경제","q":"어떤 재화의 가격이 5% 상승하자 수요량이 10% 감소하였다. 이 재화의 수요의 가격탄력성은?","o":["0.5","1","2","5"],"a":2,"e":"수요의 가격탄력성은 수요량 변화율을 가격 변화율로 나눈 절댓값이므로 10 ÷ 5 = 2입니다. 1보다 크므로 탄력적인 재화입니다."},{"sub":"미시경제","q":"기회비용에 관한 설명으로 옳은 것은?","o":["어떤 선택으로 인해 포기한 대안 중 가치가 가장 큰 것","이미 지출되어 회수할 수 없는 비용","생산량과 무관하게 발생하는 비용","실제로 지출한 화폐금액의 합계"],"a":0,"e":"기회비용은 포기한 대안들 가운데 가치가 가장 큰 것을 말하며, 명시적 비용과 암묵적 비용을 모두 포함합니다. 이미 지출되어 회수할 수 없는 비용은 매몰비용이고, 매몰비용은 합리적 의사결정에서 고려하지 않습니다."},{"sub":"미시경제","q":"완전경쟁시장에서 기업의 이윤극대화 조건은?","o":["P = AC","P = MC","MR > MC","AR = AC"],"a":1,"e":"완전경쟁기업은 가격수용자이므로 P = MR이고, 이윤극대화 조건 MR = MC에 대입하면 P = MC가 됩니다. 장기균형에서는 여기에 더해 P = 최소 평균비용이 성립합니다."},{"sub":"미시경제","q":"독점시장에 관한 설명으로 옳은 것은?","o":["가격이 한계수입보다 낮다","가격이 한계수입보다 높다","가격과 한계수입이 항상 같다","한계수입이 항상 0이다"],"a":1,"e":"독점기업은 우하향하는 수요곡선에 직면하므로 판매량을 늘리려면 가격을 낮춰야 하고, 그 결과 한계수입이 가격보다 작아집니다. 즉 P > MR이며, 이윤극대화점에서 P > MC가 되어 자원배분의 비효율이 발생합니다."},{"sub":"미시경제","q":"무차별곡선의 성질로 옳지 않은 것은?","o":["원점에서 멀수록 높은 효용을 나타낸다","일반적으로 원점에 대하여 볼록하다","서로 교차하지 않는다","우상향하는 기울기를 가진다"],"a":3,"e":"무차별곡선은 우하향합니다. 한 재화를 더 소비하려면 다른 재화를 줄여야 같은 효용이 유지되기 때문입니다. 원점에 볼록한 것은 한계대체율이 체감하기 때문이며, 교차하면 이행성에 모순이 생기므로 교차하지 않습니다."},{"sub":"미시경제","q":"정부가 시장 균형가격보다 낮은 수준에서 가격상한제를 실시할 때 나타나는 현상은?","o":["초과공급이 발생한다","초과수요가 발생한다","시장 거래량이 증가한다","가격이 즉시 균형으로 회복된다"],"a":1,"e":"균형가격보다 낮은 가격상한에서는 수요량이 공급량을 초과하여 초과수요, 즉 물량 부족이 발생합니다. 최저임금처럼 균형보다 높은 가격하한제에서는 반대로 초과공급이 나타납니다."},{"sub":"미시경제","q":"공공재의 특성으로 옳은 것은?","o":["경합성과 배제성을 모두 가진다","비경합성과 비배제성을 모두 가진다","경합성은 있으나 배제성은 없다","배제성은 있으나 경합성은 없다"],"a":1,"e":"공공재는 한 사람의 소비가 다른 사람의 소비를 줄이지 않고(비경합성), 대가를 내지 않은 사람을 배제하기 어렵습니다(비배제성). 이 때문에 무임승차 문제가 생겨 시장에서 과소 공급됩니다."},{"sub":"미시경제","q":"수요가 가격에 대해 탄력적인 재화의 가격을 인하하면 판매자의 총수입은?","o":["증가한다","감소한다","변하지 않는다","항상 0이 된다"],"a":0,"e":"탄력적이면 가격 하락률보다 수요량 증가율이 크므로 총수입이 증가합니다. 반대로 비탄력적인 재화는 가격을 인하하면 총수입이 줄고, 탄력성이 1인 단위탄력적일 때 총수입이 극대가 됩니다."},{"sub":"거시경제","q":"우리나라 GDP에 포함되는 것은?","o":["주부의 가사노동","중고차 매매 거래금액","국내에서 외국인 근로자가 생산한 재화의 가치","정부가 지급한 실업급여"],"a":2,"e":"GDP는 속지주의로 국내에서 생산된 부가가치를 집계하므로 외국인 근로자의 국내 생산도 포함됩니다. 시장에서 거래되지 않는 가사노동, 당해 연도 생산이 아닌 중고 거래, 대가 없는 이전지출은 제외됩니다."},{"sub":"거시경제","q":"한계소비성향이 0.8인 경제에서 정부지출을 10조원 늘렸을 때 국민소득의 증가분은? (단순 케인즈 모형)","o":["10조원","20조원","40조원","50조원"],"a":3,"e":"정부지출승수는 1 ÷ (1 - 한계소비성향) = 1 ÷ 0.2 = 5입니다. 따라서 10조원 × 5 = 50조원이 증가합니다. 한계소비성향이 클수록 승수가 커진다는 점을 기억하세요."},{"sub":"거시경제","q":"IS곡선을 오른쪽으로 이동시키는 요인은?","o":["정부지출의 증가","조세의 증가","독립투자의 감소","통화량의 증가"],"a":0,"e":"IS곡선은 생산물시장의 균형을 나타내며 정부지출 증가, 조세 감소, 독립투자·소비 증가가 우측 이동 요인입니다. 통화량 증가는 IS가 아니라 LM곡선을 우측으로 이동시킵니다."},{"sub":"거시경제","q":"고전학파의 화폐수량설을 나타내는 교환방정식은?","o":["Y = C + I + G","MV = PY","S = I","C = a + bY"],"a":1,"e":"MV = PY에서 M은 통화량, V는 화폐유통속도, P는 물가, Y는 실질산출량입니다. V와 Y가 일정하다고 보면 통화량 증가가 물가를 비례적으로 올린다는 화폐중립성 결론이 나옵니다."},{"sub":"거시경제","q":"15세 이상 인구가 2,000만 명, 비경제활동인구가 800만 명, 취업자가 1,080만 명일 때 실업률은?","o":["6%","9%","10%","12%"],"a":2,"e":"경제활동인구는 2,000만 - 800만 = 1,200만 명이고, 실업자는 1,200만 - 1,080만 = 120만 명입니다. 실업률은 실업자를 경제활동인구로 나눈 값이므로 120 ÷ 1,200 = 10%입니다. 15세 이상 인구로 나누지 않도록 주의하세요."},{"sub":"거시경제","q":"중앙은행이 기준금리를 인상할 때 일반적으로 예상되는 효과는?","o":["통화량이 증가하고 총수요가 늘어난다","통화량이 감소하고 총수요가 줄어든다","물가가 상승하고 환율이 오른다","투자가 늘고 소비가 증가한다"],"a":1,"e":"기준금리 인상은 긴축적 통화정책으로 차입비용을 높여 투자와 소비를 위축시키고 통화량과 총수요를 줄입니다. 이는 물가 안정을 목표로 할 때 사용되며, 자국 통화 가치는 오르는 경향이 있습니다."},{"sub":"거시경제","q":"단기 필립스곡선이 나타내는 관계는?","o":["인플레이션율과 실업률의 상충관계","이자율과 투자의 정의 관계","물가와 총공급의 반비례 관계","환율과 수출의 반비례 관계"],"a":0,"e":"단기 필립스곡선은 인플레이션율과 실업률이 반대로 움직이는 상충관계를 보여줍니다. 다만 장기에는 기대인플레이션이 조정되어 자연실업률 수준에서 수직이 된다는 것이 통화주의 학파의 설명입니다."},{"sub":"거시경제","q":"확장적 재정정책이 이자율을 상승시켜 민간투자를 위축시키는 현상을 무엇이라 하는가?","o":["구축효과","유동성 함정","승수효과","피구효과"],"a":0,"e":"구축효과는 정부지출 확대가 이자율을 올려 민간투자를 밀어내는 현상입니다. 이 효과가 클수록 재정정책의 유효성이 떨어지며, 유동성 함정 상태에서는 이자율이 오르지 않아 구축효과가 나타나지 않습니다."},{"sub":"경영학","q":"유동비율을 구하는 산식으로 옳은 것은?","o":["유동자산 ÷ 유동부채","당좌자산 ÷ 유동부채","유동부채 ÷ 자기자본","매출액 ÷ 총자산"],"a":0,"e":"유동비율은 유동자산을 유동부채로 나눈 값으로 단기 지급능력을 봅니다. 재고자산을 뺀 당좌자산으로 계산하면 당좌비율이고, 유동부채를 자기자본으로 나눈 것은 부채비율의 일부 형태입니다."},{"sub":"경영학","q":"일정 시점의 재무상태를 나타내는 재무제표는?","o":["손익계산서","재무상태표","현금흐름표","자본변동표"],"a":1,"e":"재무상태표는 특정 시점의 자산·부채·자본을 보여주는 저량(stock) 개념의 표입니다. 손익계산서, 현금흐름표, 자본변동표는 일정 기간의 변동을 보여주는 유량(flow) 개념입니다."},{"sub":"경영학","q":"이자율이 연 10%일 때 1년 후 받게 될 110만원의 현재가치는?","o":["99만원","100만원","101만원","110만원"],"a":1,"e":"현재가치는 미래가치를 (1 + 이자율)로 나눈 값이므로 110 ÷ 1.1 = 100만원입니다. 화폐의 시간가치 문제는 할인율을 분모에 두는 구조만 익히면 형태가 바뀌어도 대응됩니다."},{"sub":"경영학","q":"고정비가 1,000만원, 단위당 판매가격이 5만원, 단위당 변동비가 3만원일 때 손익분기점 판매량은?","o":["200개","333개","500개","1,000개"],"a":2,"e":"단위당 공헌이익은 5만 - 3만 = 2만원이고, 손익분기점 수량은 고정비를 단위당 공헌이익으로 나눈 값이므로 1,000만 ÷ 2만 = 500개입니다."},{"sub":"경영학","q":"마케팅 믹스 4P에 해당하지 않는 것은?","o":["Product","Price","Promotion","Positioning"],"a":3,"e":"4P는 Product, Price, Place, Promotion입니다. Positioning은 STP 전략의 마지막 단계로 4P와는 다른 층위의 개념입니다."},{"sub":"경영학","q":"STP 전략의 순서로 옳은 것은?","o":["표적시장 선정 → 시장세분화 → 포지셔닝","시장세분화 → 표적시장 선정 → 포지셔닝","포지셔닝 → 시장세분화 → 표적시장 선정","시장세분화 → 포지셔닝 → 표적시장 선정"],"a":1,"e":"먼저 시장을 나누고(Segmentation), 그중 공략할 시장을 고르고(Targeting), 그 시장에서 자사 제품의 위치를 각인시킵니다(Positioning)."},{"sub":"경영학","q":"매슬로우의 욕구단계이론에서 가장 상위에 있는 욕구는?","o":["안전의 욕구","소속과 애정의 욕구","존경의 욕구","자아실현의 욕구"],"a":3,"e":"생리적 욕구 → 안전 → 소속과 애정 → 존경 → 자아실현 순입니다. 하위 욕구가 충족되어야 상위 욕구가 동기부여 요인이 된다는 것이 이 이론의 핵심 가정입니다."},{"sub":"경영학","q":"허즈버그의 2요인이론에서 위생요인에 해당하는 것은?","o":["성취감","인정","작업조건과 임금","일 자체의 책임감"],"a":2,"e":"위생요인은 임금, 작업조건, 회사 정책, 대인관계처럼 충족되지 않으면 불만을 낳지만 충족되어도 적극적 만족을 주지 못하는 요인입니다. 성취, 인정, 책임, 성장은 동기요인입니다."},{"sub":"경영학","q":"포터의 산업구조분석(5 Forces)에 포함되지 않는 것은?","o":["기존 기업 간 경쟁","신규 진입자의 위협","대체재의 위협","정부 규제의 강도"],"a":3,"e":"5 Forces는 기존 경쟁, 신규 진입 위협, 대체재 위협, 구매자의 교섭력, 공급자의 교섭력입니다. 정부 규제는 산업환경 요인이긴 하나 이 모형의 다섯 요인에는 포함되지 않습니다."},{"sub":"경영학","q":"취득원가 1,000만원, 잔존가치 100만원, 내용연수 5년인 기계를 정액법으로 상각할 때 연간 감가상각비는?","o":["150만원","180만원","200만원","220만원"],"a":1,"e":"정액법은 (취득원가 - 잔존가치)를 내용연수로 나눕니다. (1,000만 - 100만) ÷ 5 = 180만원입니다. 잔존가치를 빼지 않고 계산하지 않도록 주의하세요."},{"sub":"민법총칙","q":"신의성실의 원칙에서 파생된 원칙이 아닌 것은?","o":["사정변경의 원칙","실효의 원칙","모순행위 금지의 원칙","사적 자치의 원칙"],"a":3,"e":"사적 자치는 민법의 기본원리이지 신의칙의 파생원칙이 아닙니다. 신의칙에서는 사정변경, 실효, 모순행위 금지(금반언), 권리남용 금지가 파생됩니다."},{"sub":"민법총칙","q":"자연인의 권리능력이 소멸하는 시점은?","o":["실종선고를 받은 때","사망한 때","성년후견이 개시된 때","파산선고를 받은 때"],"a":1,"e":"권리능력은 출생으로 시작해 사망으로 소멸합니다. 실종선고는 사망한 것으로 보는 효과가 있을 뿐이고, 성년후견이나 파산은 행위능력이나 재산관리 권한에 영향을 줄 뿐 권리능력을 없애지 않습니다."},{"sub":"민법총칙","q":"보통실종의 실종기간은?","o":["1년","3년","5년","10년"],"a":2,"e":"생사불명 상태가 5년간 계속되면 이해관계인이나 검사의 청구로 실종선고를 할 수 있습니다. 전쟁, 선박 침몰 등 특별실종은 1년입니다."},{"sub":"민법총칙","q":"재단법인에 관한 설명으로 옳은 것은?","o":["사원총회가 최고의사결정기관이다","설립자가 출연한 재산을 기초로 하며 사원이 존재하지 않는다","영리를 목적으로 설립할 수 있다","정관을 변경할 수 없다"],"a":1,"e":"재단법인은 재산의 결합체로 사원과 사원총회가 없습니다. 사람의 결합체인 사단법인과 달리 설립자가 정한 목적에 구속되며, 비영리 목적으로만 설립할 수 있습니다."},{"sub":"민법총칙","q":"법인의 불법행위책임에 관한 설명으로 옳은 것은?","o":["법인은 성질상 불법행위책임을 지지 않는다","대표기관이 직무에 관하여 타인에게 손해를 가한 때 법인이 배상책임을 진다","피용자의 모든 행위에 대해 법인이 책임진다","대표기관 개인은 책임을 지지 않는다"],"a":1,"e":"민법 제35조에 따라 이사 기타 대표자가 직무에 관하여 가한 손해는 법인이 배상합니다. 이때 대표기관 개인의 책임도 함께 인정되어 연대책임 관계가 됩니다."},{"sub":"민법총칙","q":"주물과 종물에 관한 설명으로 옳은 것은?","o":["종물은 주물의 처분에 따른다","종물은 항상 주물과 별도로 처분해야 한다","주물과 종물은 소유자가 달라도 무방하다","종물은 부동산일 수 없다"],"a":0,"e":"민법 제100조 제2항. 종물은 주물의 처분에 따르는 것이 원칙이나 이는 임의규정이므로 당사자 특약으로 달리 정할 수 있습니다. 주물과 종물은 같은 소유자에게 속해야 합니다."},{"sub":"민법총칙","q":"민법상 부동산에 해당하는 것은?","o":["토지 및 그 정착물","선박","자동차","항공기"],"a":0,"e":"민법 제99조는 토지와 그 정착물을 부동산으로, 그 외의 물건을 동산으로 규정합니다. 선박, 자동차, 항공기는 동산이지만 등기·등록으로 부동산에 준하는 취급을 받습니다."},{"sub":"민법총칙","q":"기간을 일, 주, 월, 년으로 정한 때의 계산 원칙으로 옳은 것은?","o":["기간의 초일을 산입한다","기간의 초일은 산입하지 않는다","항상 24시부터 기산한다","말일이 공휴일이면 그날로 만료한다"],"a":1,"e":"민법 제157조의 초일불산입 원칙입니다. 다만 기간이 오전 0시부터 시작하는 경우와 연령 계산은 초일을 산입하며, 말일이 공휴일이면 그 다음 날 만료합니다."},{"sub":"민법총칙","q":"당사자의 의사로 그 적용을 배제할 수 없는 규정을 무엇이라 하는가?","o":["임의규정","강행규정","보충규정","해석규정"],"a":1,"e":"강행규정은 선량한 풍속 기타 사회질서와 관련되어 당사자가 배제할 수 없는 규정입니다. 임의규정은 당사자의 의사가 우선하고 그 의사가 불분명할 때 보충적으로 적용됩니다."},{"sub":"민법총칙","q":"제3자의 사기로 의사표시를 한 경우에 관한 설명으로 옳은 것은?","o":["언제나 취소할 수 있다","상대방이 그 사실을 알았거나 알 수 있었을 경우에 한하여 취소할 수 있다","전혀 취소할 수 없다","제3자에게만 손해배상을 청구할 수 있고 취소는 불가능하다"],"a":1,"e":"민법 제110조 제2항. 상대방 있는 의사표시에서 제3자가 사기를 한 경우, 상대방이 그 사실을 알았거나 알 수 있었을 때만 취소할 수 있습니다. 선의의 상대방을 보호하기 위한 규정입니다."},{"sub":"민법총칙","q":"무권대리의 상대방이 본인에게 추인 여부의 확답을 촉구할 수 있는 권리는?","o":["최고권","철회권","취소권","해제권"],"a":0,"e":"상대방은 상당한 기간을 정해 추인 여부의 확답을 최고할 수 있고, 본인이 그 기간 내에 확답하지 않으면 추인을 거절한 것으로 봅니다. 철회권은 선의의 상대방만 행사할 수 있습니다."},{"sub":"민법총칙","q":"취소권의 행사기간으로 옳은 것은?","o":["추인할 수 있는 날로부터 3년, 법률행위를 한 날로부터 10년","안 날로부터 1년, 있은 날로부터 5년","언제든지 행사할 수 있다","추인할 수 있는 날로부터 10년"],"a":0,"e":"민법 제146조. 두 기간 중 어느 하나가 먼저 지나면 취소권이 소멸하며, 이 기간은 제척기간이므로 중단이 인정되지 않습니다."},{"sub":"민법총칙","q":"취소할 수 있는 법률행위의 법정추인 사유에 해당하지 않는 것은?","o":["전부나 일부의 이행","이행의 청구","취소권자의 취소 의사표시","취소할 수 있는 행위로 취득한 권리의 양도"],"a":2,"e":"민법 제145조는 이행, 이행청구, 경개, 담보제공, 권리양도, 강제집행을 법정추인 사유로 규정합니다. 취소의 의사표시는 추인이 아니라 정반대의 행위입니다."},{"sub":"민법총칙","q":"무효인 법률행위를 당사자가 무효임을 알고 추인한 경우의 효과는?","o":["처음부터 유효하게 된다","새로운 법률행위를 한 것으로 본다","여전히 아무 효력이 없다","취소할 수 있는 행위가 된다"],"a":1,"e":"민법 제139조. 무효행위의 추인은 소급효가 없고 추인한 때부터 새로운 법률행위를 한 것으로 봅니다. 취소할 수 있는 행위의 추인이 소급하여 확정적으로 유효해지는 것과 다릅니다."},{"sub":"민법총칙","q":"소멸시효의 기산점으로 옳은 것은?","o":["권리가 발생한 때","권리를 행사할 수 있는 때","권리자가 권리를 안 때","의무자가 이행을 거절한 때"],"a":1,"e":"민법 제166조 제1항. 법률상 장애가 없어 권리를 행사할 수 있게 된 때부터 시효가 진행합니다. 권리자가 몰랐다는 사실상의 장애는 원칙적으로 기산점에 영향을 주지 않습니다."},{"sub":"민법총칙","q":"소멸시효가 완성된 경우의 효력 발생 시점은?","o":["시효 완성일부터 장래에 향하여","그 기산일에 소급하여","권리자가 안 날부터","법원의 판결이 확정된 때부터"],"a":1,"e":"민법 제167조. 소멸시효는 그 기산일에 소급하여 효력이 생기므로 그 사이에 발생한 이자 등도 함께 소멸합니다."},{"sub":"민법총칙","q":"임의대리권의 소멸사유에 해당하지 않는 것은?","o":["본인의 사망","대리인의 사망","대리인의 성년후견 개시","대리인의 혼인"],"a":3,"e":"민법 제127조와 제128조에 따라 본인의 사망, 대리인의 사망·성년후견개시·파산, 원인된 법률관계의 종료, 수권행위의 철회로 소멸합니다. 혼인은 사유가 아닙니다."},{"sub":"민법총칙","q":"불공정한 법률행위가 성립하기 위한 요건이 아닌 것은?","o":["당사자의 궁박, 경솔 또는 무경험","급부와 반대급부 사이의 현저한 불균형","상대방이 그러한 사정을 알고 이용하려는 의사","법원의 사전 허가"],"a":3,"e":"민법 제104조의 폭리행위는 피해자의 궁박·경솔·무경험, 현저한 불균형, 폭리자의 악의라는 요건이 모두 갖추어져야 무효가 됩니다."},{"sub":"민법총칙","q":"기한의 이익에 관한 설명으로 옳은 것은?","o":["채권자를 위한 것으로 추정한다","채무자를 위한 것으로 추정한다","항상 양 당사자를 위한 것이다","포기할 수 없다"],"a":1,"e":"민법 제153조 제1항. 기한의 이익은 채무자를 위한 것으로 추정되며 포기할 수 있습니다. 다만 상대방의 이익을 해치지 못합니다."},{"sub":"민법총칙","q":"부동산의 이중매매에 관한 설명으로 옳은 것은?","o":["언제나 반사회질서 행위로 무효이다","제2매수인이 매도인의 배임행위에 적극 가담한 경우 무효이다","제2매수인이 악의이기만 하면 무효이다","등기와 무관하게 제1매수인이 소유권을 취득한다"],"a":1,"e":"단순한 이중매매는 계약자유의 원칙상 유효하고 먼저 등기한 자가 소유권을 취득합니다. 다만 제2매수인이 배임행위에 적극 가담하면 민법 제103조 위반으로 무효가 됩니다."},{"sub":"상법","q":"자기 명의로 상행위를 함으로써 상인이 되는 자를 무엇이라 하는가?","o":["당연상인","의제상인","소상인","민사회사"],"a":0,"e":"상법 제4조의 당연상인은 자기 명의로 상행위를 하는 자입니다. 점포 등 설비를 갖추고 상인적 방법으로 영업하거나 회사 형태를 갖춘 경우는 의제상인입니다."},{"sub":"상법","q":"상업등기의 효력에 관한 설명으로 옳은 것은?","o":["등기 전에는 선의의 제3자에게 대항하지 못한다","등기 여부와 무관하게 누구에게나 대항할 수 있다","등기하면 악의의 제3자에게는 대항할 수 없다","등기는 효력요건이 아니라 아무 효력이 없다"],"a":0,"e":"등기 전에는 선의의 제3자에게 대항하지 못하고, 등기 후에는 원칙적으로 대항할 수 있습니다. 이를 상업등기의 소극적 공시력과 적극적 공시력이라 합니다."},{"sub":"상법","q":"자기 명의로써 타인의 계산으로 물건을 매매하는 것을 영업으로 하는 자는?","o":["대리상","중개인","위탁매매인","운송주선인"],"a":2,"e":"위탁매매인은 자기 이름으로 거래하되 경제적 효과는 위탁자에게 귀속됩니다. 대리상은 본인의 이름으로 거래를 대리하거나 중개하고, 중개인은 타인 간 거래를 중개할 뿐입니다."},{"sub":"상법","q":"상인 간 매매에서 매수인이 목적물을 수령한 때 부담하는 의무는?","o":["지체 없이 검사하고 하자를 발견하면 즉시 통지할 의무","1년 내에 검사할 의무","검사 의무가 없다","대금을 선지급할 의무"],"a":0,"e":"상법 제69조. 상인 간 매매에서 매수인은 지체 없이 검사하고 하자나 수량 부족을 발견하면 즉시 통지해야 하며, 즉시 발견할 수 없는 하자는 6개월 내에 통지해야 합니다."},{"sub":"상법","q":"주식회사의 설립 방법에 관한 설명으로 옳은 것은?","o":["발기설립은 발기인이 주식 전부를 인수하는 방식이다","모집설립은 발기인만이 주식을 인수한다","발기설립에서는 창립총회를 반드시 열어야 한다","설립 방법은 한 가지뿐이다"],"a":0,"e":"발기설립은 발기인이 주식 전부를 인수하는 방식이고, 모집설립은 일부를 인수한 뒤 나머지를 모집합니다. 창립총회는 모집설립에서만 열립니다."},{"sub":"상법","q":"주식회사 이사의 임기에 관한 설명으로 옳은 것은?","o":["3년을 초과하지 못한다","5년을 초과하지 못한다","제한이 없다","1년으로 고정되어 있다"],"a":0,"e":"상법 제383조 제2항에 따라 이사의 임기는 3년을 초과할 수 없습니다. 다만 정관으로 그 임기 중 최종 결산기 정기주주총회 종결까지 연장할 수 있습니다."},{"sub":"상법","q":"이사회의 결의 요건으로 옳은 것은?","o":["이사 전원의 동의","이사 과반수의 출석과 출석이사 과반수의 찬성","이사 3분의 2 이상의 찬성","주주총회의 승인"],"a":1,"e":"상법 제391조. 이사회는 이사 과반수 출석과 출석이사 과반수 찬성으로 결의하며 정관으로 그 비율을 높일 수 있습니다. 이사회에서는 대리 출석이 허용되지 않습니다."},{"sub":"상법","q":"감사 선임 시 주주의 의결권 행사에 관한 제한으로 옳은 것은?","o":["의결권 있는 주식의 3%를 초과하는 부분은 의결권을 행사하지 못한다","의결권 제한이 없다","10%를 초과하는 부분이 제한된다","대주주는 아예 의결권이 없다"],"a":0,"e":"상법 제409조 제2항의 3% 룰입니다. 대주주의 영향력을 줄여 감사의 독립성을 확보하기 위한 장치입니다."},{"sub":"상법","q":"회사가 자기주식을 취득하는 것에 관한 설명으로 옳은 것은?","o":["어떤 경우에도 취득할 수 없다","배당가능이익의 범위에서 취득할 수 있다","제한 없이 자유롭게 취득할 수 있다","주주 전원의 동의가 있어야만 가능하다"],"a":1,"e":"2011년 개정 상법은 배당가능이익 범위 내에서 자기주식 취득을 허용했습니다. 자본충실을 해치지 않는 범위로 제한한 것이며, 특정 목적의 경우에는 별도로 인정됩니다."},{"sub":"상법","q":"사채 발행을 결정하는 권한은 원칙적으로 누구에게 있는가?","o":["주주총회","이사회","대표이사","감사"],"a":1,"e":"상법 제469조에 따라 사채 발행은 이사회가 결정합니다. 사채는 타인자본 조달이므로 자기자본을 늘리는 신주발행과 구분해 기억하면 좋습니다."},{"sub":"상법","q":"신주 발행 시 원칙적으로 신주를 배정받을 권리를 가지는 자는?","o":["기존 주주","회사의 채권자","이사","임직원"],"a":0,"e":"상법 제418조는 주주가 소유 주식 수에 비례해 신주를 배정받을 권리를 갖는다고 규정합니다. 제3자 배정은 정관에 정한 경우로서 경영상 목적 달성에 필요한 때에만 가능합니다."},{"sub":"상법","q":"회사 합병에 관한 설명으로 옳은 것은?","o":["주주총회 보통결의로 가능하다","주주총회 특별결의와 채권자보호절차가 필요하다","이사회 결의만으로 가능하다","채권자의 개별 동의가 반드시 필요하다"],"a":1,"e":"합병은 주주와 채권자의 이해에 큰 영향을 주므로 특별결의를 거치고 채권자 이의제출 공고 절차를 밟아야 합니다. 반대주주에게는 주식매수청구권이 인정됩니다."},{"sub":"상법","q":"유한회사에 관한 설명으로 옳지 않은 것은?","o":["사원은 출자액을 한도로 유한책임을 진다","사채를 발행할 수 없다","지분의 양도가 주식회사보다 제한적이다","반드시 감사를 두어야 한다"],"a":3,"e":"유한회사의 감사는 임의기관이라 정관으로 둘 수 있을 뿐 필수는 아닙니다. 폐쇄적 성격이 강해 사채 발행이 불가능하고 지분 양도도 제약이 있습니다."},{"sub":"상법","q":"합자회사에 관한 설명으로 옳은 것은?","o":["모든 사원이 무한책임을 진다","무한책임사원과 유한책임사원으로 구성된다","모든 사원이 유한책임을 진다","사원이 1인이어야 한다"],"a":1,"e":"합자회사는 회사를 경영하는 무한책임사원과 출자만 하는 유한책임사원으로 구성됩니다. 사원 전원이 무한책임을 지는 것은 합명회사입니다."},{"sub":"상법","q":"주주의 권리 중 공익권에 해당하는 것은?","o":["이익배당청구권","잔여재산분배청구권","의결권","신주인수권"],"a":2,"e":"공익권은 회사 경영에 참여하거나 감독하는 권리로 의결권, 대표소송제기권, 회계장부열람권 등이 해당합니다. 나머지는 경제적 이익을 받는 자익권입니다."},{"sub":"상법","q":"상호의 양도에 관한 설명으로 옳은 것은?","o":["상호는 어떤 경우에도 양도할 수 없다","영업을 폐지하거나 영업과 함께 하는 경우에만 양도할 수 있다","언제든지 자유롭게 양도할 수 있다","등기 없이도 제3자에게 대항할 수 있다"],"a":1,"e":"상법 제25조. 상호는 영업과 분리되면 거래 상대방을 오인시킬 수 있으므로 영업 폐지 또는 영업과 함께인 경우에만 양도할 수 있고, 양도는 등기해야 제3자에게 대항할 수 있습니다."},{"sub":"미시경제","q":"커피 가격이 오르자 홍차의 수요가 증가하였다. 두 재화의 관계는?","o":["보완재","대체재","열등재","기펜재"],"a":1,"e":"한 재화의 가격이 오를 때 다른 재화의 수요가 늘면 대체재입니다. 반대로 수요가 줄면 커피와 설탕처럼 함께 소비되는 보완재입니다."},{"sub":"미시경제","q":"소득이 증가할 때 수요가 오히려 감소하는 재화를 무엇이라 하는가?","o":["정상재","열등재","사치재","공공재"],"a":1,"e":"열등재는 소득탄력성이 음수인 재화입니다. 소득이 늘면 더 나은 대체품으로 옮겨가기 때문이며, 소득탄력성이 1보다 크면 사치재로 분류합니다."},{"sub":"미시경제","q":"소비자잉여에 관한 설명으로 옳은 것은?","o":["소비자가 지불할 용의가 있는 금액에서 실제 지불액을 뺀 값","실제 지불한 금액의 총합","생산비에서 판매가를 뺀 값","시장 전체의 거래금액"],"a":0,"e":"소비자잉여는 수요곡선 아래, 가격선 위의 면적으로 나타납니다. 생산자잉여는 가격선 아래, 공급곡선 위의 면적이며 둘을 합한 것이 사회적 총잉여입니다."},{"sub":"미시경제","q":"재화의 소비량이 늘어날수록 추가 한 단위에서 얻는 만족이 줄어드는 현상은?","o":["한계효용 체감의 법칙","수확체증의 법칙","규모의 경제","기회비용 체증의 법칙"],"a":0,"e":"한계효용 체감의 법칙 때문에 수요곡선이 우하향합니다. 소비자는 한계효용이 가격과 같아지는 지점까지 소비할 때 효용을 극대화합니다."},{"sub":"미시경제","q":"생산가능곡선이 원점에 대하여 오목한 형태를 갖는 이유는?","o":["기회비용이 체감하기 때문","기회비용이 체증하기 때문","기회비용이 일정하기 때문","기회비용이 존재하지 않기 때문"],"a":1,"e":"자원마다 적합한 용도가 달라 한 재화를 늘릴수록 포기해야 하는 다른 재화의 양이 커집니다. 기회비용이 일정하다면 생산가능곡선은 직선이 됩니다."},{"sub":"미시경제","q":"생산량이 증가함에 따라 장기 평균비용이 하락하는 현상은?","o":["규모의 경제","범위의 경제","외부불경제","한계비용 체증"],"a":0,"e":"규모의 경제는 대량생산에 따른 분업, 고정비 분산 등으로 단위당 비용이 낮아지는 현상입니다. 여러 제품을 함께 생산할 때 비용이 절감되면 범위의 경제입니다."},{"sub":"미시경제","q":"공장의 오염물질 배출처럼 부정적 외부효과가 있을 때 시장 생산량은?","o":["사회적 최적 수준보다 적다","사회적 최적 수준과 같다","사회적 최적 수준보다 많다","항상 0이 된다"],"a":2,"e":"생산자가 사회적 비용을 부담하지 않으므로 사적 비용이 사회적 비용보다 작아 과다 생산됩니다. 긍정적 외부효과가 있는 재화는 반대로 과소 생산됩니다."},{"sub":"미시경제","q":"완전경쟁시장의 조건에 해당하지 않는 것은?","o":["다수의 수요자와 공급자","동질적인 재화","진입과 퇴출의 자유","제품 차별화"],"a":3,"e":"완전경쟁은 재화가 동질적이어서 차별화가 없다는 것을 전제합니다. 제품 차별화는 독점적 경쟁시장의 특징입니다."},{"sub":"미시경제","q":"단기에 기업이 생산을 중단해야 하는 조건은?","o":["가격이 평균총비용보다 낮을 때","가격이 평균가변비용의 최저점보다 낮을 때","가격이 한계비용보다 낮을 때","이윤이 0일 때"],"a":1,"e":"가격이 평균가변비용도 회수하지 못하면 생산할수록 손실이 커지므로 조업을 중단합니다. 평균가변비용은 넘지만 평균총비용에 못 미치면 고정비 일부를 회수하므로 단기에는 계속 생산합니다."},{"sub":"미시경제","q":"가격차별이 성립하기 위한 조건이 아닌 것은?","o":["기업이 시장지배력을 가질 것","소비자 집단의 수요탄력성이 다를 것","시장 간 재판매가 불가능할 것","재화가 완전히 동질적일 것"],"a":3,"e":"가격차별은 독점력이 있고 집단별 탄력성이 다르며 재판매를 막을 수 있을 때 성립합니다. 재화의 동질성은 조건이 아닙니다."},{"sub":"미시경제","q":"죄수의 딜레마가 보여주는 것은?","o":["개인의 합리적 선택이 집단적으로는 비효율적 결과를 낳을 수 있다","협력은 항상 이루어진다","독점이 항상 효율적이다","시장은 언제나 균형에 도달한다"],"a":0,"e":"각자가 자기 이익만 좇으면 둘 다 자백하는 열등한 균형에 도달합니다. 이 지점이 내쉬균형이지만 파레토
