한다\n- 한계편익 = 한계비용 → 여기서 멈춘다 (최적)\n\n## 경제 문제의 세 가지\n무엇을, 어떻게, 누구를 위하여 생산할 것인가. 모든 경제체제가 이 셋을 답해야 합니다.\n\n▸ 희소성: 욕구에 비해 자원이 부족한 상태.\n▸ 한계: 한 단위 추가할 때의 변화분.\n▸ 경제적 이윤: 총수입에서 명시적 비용과 암묵적 비용을 모두 뺀 것.","alt":"## 희소성 = 모든 것의 시작\n갖고 싶은 건 많은데 돈은 없음. 이게 희소성임.\n희소하니까 **골라야** 하고, 고르면 **버리는 게** 생김. 경제학은 이 고르는 법을 다룸.\n\n## 기회비용 ⭐\n고르면서 **버린 것 중에 제일 아까운 거**.\n\n> 회사 때려치고 공시 준비함\n> → 비용 = 학원비만? **아님.** 못 받은 월급도 비용임.\n\n두 덩어리로 나뉨.\n- **명시적 비용**: 실제로 돈 나감 (학원비)\n- **암묵적 비용**: 돈은 안 나가는데 포기함 (월급)\n\n> 🚨 경제학에서 \"비용\" = 항상 **기회비용**임. 회계 비용이랑 다름.\n> 그래서 회계상 흑자인데 경제적으로는 적자일 수 있음. 이거 문제로 나옴.\n\n## 매몰비용 ⭐\n이미 써서 못 돌려받는 돈.\n> 🚨 **의사결정에 고려하면 안 됨.**\n> 영화 노잼임. 티켓값 아까워서 끝까지 봄? 비합리적임.\n> 티켓값은 나가든 앉아있든 이미 날아갔음. 남은 건 시간뿐인데 그걸 왜 더 버림.\n\n## 합리적 = 한계로 따짐\n전체 말고 **한 단위 더** 했을 때를 봄.\n- 한계편익 > 한계비용 → 더 함\n- **한계편익 = 한계비용 → 여기서 스톱** (이게 최적)\n\n> 이 공식이 미시경제 전체를 관통함. 소비도 생산도 다 이걸로 풀림.\n\n## 경제 3문제\n무엇을 / 어떻게 / 누구를 위해 생산할 것인가\n\n▸ 한계: 한 개 더 할 때의 변화분.\n▸ 경제적 이윤: 수입 - 명시적비용 - 암묵적비용."},{"title":"② 수요와 공급","sub":"미시경제","body":"## 수요곡선이 우하향하는 이유\n가격이 오르면 사려는 양이 줄어듭니다. 두 가지 이유가 겹칩니다.\n- **대체효과**: 비싸지면 다른 걸로 갈아탐\n- **소득효과**: 비싸지면 실질 구매력이 줄어 덜 삼\n\n## 수요량의 변화 vs 수요의 변화 (제일 중요)\n> **수요량의 변화**: 그 재화의 **가격**이 바뀌어 곡선 **위에서 점이 이동**\n> **수요의 변화**: 가격 외의 요인이 바뀌어 **곡선 자체가 이동**\n\n이 구분을 못 하면 문제를 풀 수 없습니다.\n\n### 수요를 이동시키는 요인\n- 소득 (정상재는 증가 시 우측, 열등재는 좌측)\n- 관련재 가격 (대체재 가격 상승 → 수요 증가, 보완재 가격 상승 → 수요 감소)\n- 기호, 인구, 미래 가격 예상\n\n## 공급\n공급곡선은 우상향합니다. 가격이 오르면 더 팔고 싶어집니다.\n\n### 공급을 이동시키는 요인\n- 생산요소 가격 (원자재값 상승 → 공급 감소, 좌측 이동)\n- 기술 진보 (공급 증가, 우측 이동)\n- 조세와 보조금\n- 공급자 수\n\n## 균형\n수요곡선과 공급곡선이 만나는 점입니다. 여기서 수요량과 공급량이 같아집니다.\n- 가격이 균형보다 높으면 → 초과공급 → 가격 하락 압력\n- 가격이 균형보다 낮으면 → 초과수요 → 가격 상승 압력\n\n## 균형의 변화 (자주 나옴)\n| 상황 | 균형가격 | 균형거래량 |\n|---|---|---|\n| 수요 증가 | 상승 | 증가 |\n| 수요 감소 | 하락 | 감소 |\n| 공급 증가 | 하락 | 증가 |\n| 공급 감소 | 상승 | 감소 |\n\n> 수요와 공급이 **동시에** 움직이면 하나는 확정되고 하나는 알 수 없게 됩니다. 예를 들어 수요와 공급이 모두 증가하면 거래량은 반드시 늘지만 가격은 어느 쪽 이동이 큰지에 따라 달라집니다. 이 유형이 시험에 나옵니다.\n\n▸ 정상재: 소득이 늘면 수요가 느는 재화.\n▸ 열등재: 소득이 늘면 수요가 주는 재화.\n▸ 초과수요: 사려는 양이 팔려는 양보다 많은 상태.","alt":"## 수요곡선이 우하향인 이유\n비싸지면 덜 삼. 이유 2개가 겹침.\n- **대체효과**: 비싸니까 딴 거 삼\n- **소득효과**: 비싸지면 내 돈의 실질 가치가 줄어서 덜 삼\n\n## 수요량 변화 vs 수요 변화 ⭐⭐\n> 🚨 이거 구분 못 하면 미시 못 품. 진짜임.\n> **수요량의 변화** = 그 재화 **가격**이 바뀜 → 곡선 **위에서 점만 이동**\n> **수요의 변화** = 가격 말고 딴 게 바뀜 → **곡선 자체가 통째로 이동**\n\n라면값 오름 → 라면 수요\"량\" 감소 (점 이동)\n소득 늘어서 라면 덜 먹음 → 라면 \"수요\" 감소 (곡선 이동)\n\n### 곡선 옮기는 요인\n- 소득 (정상재 ↑ / 열등재 ↓)\n- 대체재 가격 오름 → 수요 **증가**\n- 보완재 가격 오름 → 수요 **감소**\n- 기호, 인구, 미래 가격 예상\n\n## 공급\n우상향. 비싸지면 더 팔고 싶음.\n옮기는 요인: 원자재값, **기술 진보**(우측), 세금, 공급자 수\n\n## 균형\n- 가격이 높음 → **초과공급** → 가격 내려감\n- 가격이 낮음 → **초과수요** → 가격 올라감\n\n## 균형 변화표 ⭐\n| | 가격 | 거래량 |\n|---|---|---|\n| 수요 ↑ | ↑ | ↑ |\n| 수요 ↓ | ↓ | ↓ |\n| 공급 ↑ | ↓ | ↑ |\n| 공급 ↓ | ↑ | ↓ |\n\n> 🚨 진짜 나오는 유형은 **둘 다 움직일 때**임.\n> 수요↑ + 공급↑ → 거래량은 무조건 증가. 근데 **가격은 알 수 없음.**\n> 누가 더 크게 움직였냐에 달림. 이럴 때 답은 \"알 수 없다\"임.\n\n▸ 정상재: 돈 벌면 더 삼.\n▸ 열등재: 돈 벌면 덜 삼."},{"title":"③ 탄력성","sub":"미시경제","body":"## 탄력성이란\n가격이 1% 변할 때 수요량이 몇 % 변하는지를 나타냅니다. **민감도**입니다.\n\n공식은 이렇습니다.\n> 수요의 가격탄력성 = 수요량 변화율 ÷ 가격 변화율 (절댓값)\n\n## 크기에 따른 구분\n| 값 | 이름 | 예 |\n|---|---|---|\n| 0 | 완전비탄력적 | 곡선이 수직 |\n| 0 < e < 1 | 비탄력적 | 쌀, 소금, 약 |\n| 1 | 단위탄력적 | — |\n| 1 < e < ∞ | 탄력적 | 여행, 외식 |\n| ∞ | 완전탄력적 | 곡선이 수평 |\n\n## 탄력성을 결정하는 요인\n- **대체재가 많을수록** 탄력적 (갈아탈 데가 있으니까)\n- **사치품일수록** 탄력적, 필수품일수록 비탄력적\n- **기간이 길수록** 탄력적 (적응할 시간이 있으니까)\n- 소득에서 차지하는 비중이 클수록 탄력적\n\n## 탄력성과 총수입 (제일 자주 나옴)\n가격을 내리면 개당 마진은 줄지만 많이 팔립니다. 어느 쪽이 큰지가 탄력성으로 결정됩니다.\n> - **탄력적**: 가격 인하 → 총수입 **증가**\n> - **비탄력적**: 가격 인하 → 총수입 **감소**\n> - **단위탄력적**: 총수입 변화 없음 (이때 총수입 최대)\n\n농산물이 풍년인데 농가 소득이 줄어드는 현상이 이것으로 설명됩니다. 농산물은 비탄력적이라 공급이 늘어 가격이 떨어지면 총수입이 오히려 줄어듭니다. 이를 **풍년의 역설**이라고 합니다.\n\n## 다른 탄력성들\n- **소득탄력성**: 수요량 변화율 ÷ 소득 변화율. 음수면 열등재, 0~1이면 필수재, 1 초과면 사치재\n- **교차탄력성**: X 수요량 변화율 ÷ Y 가격 변화율. **양수면 대체재, 음수면 보완재**\n- **공급의 가격탄력성**: 공급량이 가격에 얼마나 민감한지\n\n▸ 탄력적: 민감하게 반응한다는 뜻.\n▸ 총수입: 가격 × 판매량.\n▸ 교차탄력성: 다른 재화 가격에 대한 민감도.","alt":"## 탄력성 = 민감도\n가격 1% 변할 때 수요량 몇 % 변하냐.\n> **탄력성 = 수요량 변화율 ÷ 가격 변화율** (절댓값)\n\n가격 5% 올랐는데 수요량 10% 줄었으면? 10÷5 = **2**. 탄력적임.\n\n## 크기별\n- 0 → 완전비탄력 (수직선)\n- 0~1 → 비탄력 (쌀, 소금, 약)\n- 1 → 단위탄력\n- 1 이상 → 탄력적 (여행, 외식)\n- ∞ → 완전탄력 (수평선)\n\n## 뭐가 탄력적으로 만드냐\n- **대체재 많음** → 탄력적 (갈아탈 데 있으니까)\n- **사치품** → 탄력적 / 필수품 → 비탄력\n- **기간 길수록** → 탄력적 (적응할 시간 있음)\n\n> 기름값 올랐다고 당장 차 안 탐? 못 함. 근데 1년 지나면 경차로 바꿈. 그래서 장기가 더 탄력적임.\n\n## 탄력성 × 총수입 ⭐ (제일 자주 나옴)\n가격 내리면 마진 줄고 판매량 늚. 뭐가 더 크냐가 탄력성으로 결정됨.\n\n> 🚨 **탄력적** → 가격 내림 → 총수입 **증가**\n> **비탄력적** → 가격 내림 → 총수입 **감소**\n> 단위탄력 → 변화 없음 (이때가 총수입 최대)\n\n### 풍년의 역설\n농사 대박남 → 공급 폭증 → 가격 폭락 → **농가 소득 오히려 감소**\n왜? 농산물은 **비탄력적**이라서. 싸다고 밥 두 배로 먹진 않잖음.\n> 이거 사례 문제로 자주 나옴.\n\n## 다른 탄력성들\n- **소득탄력성**: 음수 = 열등재 / 0~1 = 필수재 / 1 초과 = 사치재\n- **교차탄력성**: **양수 = 대체재 / 음수 = 보완재** ⭐\n\n> 교차탄력성 부호는 무조건 외워. 콜라값 오르면 사이다 더 사감(양수, 대체재). 프린터값 오르면 잉크 덜 사감(음수, 보완재).\n\n▸ 총수입: 가격 × 판매량."},{"title":"④ 가격통제와 조세","sub":"미시경제","body":"## 가격상한제\n정부가 **이 가격보다 비싸게 팔지 마라**고 정하는 것입니다. 분양가상한제, 임대료 규제가 예입니다.\n효과가 있으려면 **균형가격보다 낮게** 정해야 합니다. 균형보다 높게 정하면 아무 일도 안 일어납니다.\n\n효과는 이렇습니다.\n- 수요량 > 공급량 → **초과수요**, 즉 물량 부족\n- 암시장이 생김\n- 줄서기, 추첨 같은 가격 아닌 배분 방식이 등장\n- 품질 저하\n\n## 가격하한제\n**이 가격보다 싸게 팔지 마라**고 정하는 것입니다. 최저임금제, 농산물 최저가격제가 예입니다.\n**균형가격보다 높게** 정해야 효과가 있습니다.\n\n효과는 이렇습니다.\n- 공급량 > 수요량 → **초과공급**\n- 노동시장에서는 이 초과공급이 곧 **실업**입니다\n\n## 조세의 부과\n### 누구에게 매기든 결과는 같다\n생산자에게 매기든 소비자에게 매기든 **최종적인 부담 배분은 동일**합니다. 세금을 법적으로 누가 내는지(납세의무자)와 실제로 누가 부담하는지(담세자)는 다릅니다.\n이를 **조세의 전가와 귀착**이라고 합니다.\n\n### 누가 더 부담하나 (핵심)\n> **덜 탄력적인 쪽이 더 많이 부담합니다.**\n> 탄력적이라는 것은 도망갈 데가 있다는 뜻이고, 비탄력적이라는 것은 도망갈 데가 없다는 뜻입니다. 도망 못 가는 쪽이 뒤집어씁니다.\n\n- 수요가 완전비탄력적이면 소비자가 전부 부담\n- 공급이 완전비탄력적이면 생산자가 전부 부담\n\n담배세를 올려도 흡연자가 대부분 부담하는 이유가 이것입니다. 담배 수요가 비탄력적이기 때문입니다.\n\n## 자중손실\n세금이나 가격통제로 거래가 줄면서 사라지는 사회적 후생입니다. 정부도 못 갖고 아무도 못 갖는, 그냥 증발하는 부분입니다.\n> **탄력성이 클수록 자중손실이 커집니다.** 거래가 많이 줄어들기 때문입니다.\n\n▸ 납세의무자: 법적으로 세금을 내는 사람.\n▸ 담세자: 실제로 부담을 지는 사람.\n▸ 자중손실: 시장 왜곡으로 사라지는 잉여. 사중손실이라고도 합니다.","alt":"## 가격상한제\n정부: \"이거보다 비싸게 팔지 마.\" 분양가상한제, 임대료 규제.\n> 🚨 **균형보다 낮게** 정해야 효과 있음. 높게 정하면 아무 일도 안 일어남. 함정으로 나옴.\n\n결과: **초과수요(물량 부족)** → 암시장, 줄서기, 품질 저하\n\n## 가격하한제\n정부: \"이거보다 싸게 팔지 마.\" 최저임금, 농산물 최저가격.\n> **균형보다 높게** 정해야 효과 있음.\n\n결과: **초과공급** → 노동시장에서는 이게 곧 **실업**임.\n\n## 조세 ⭐\n\n### 누구한테 매기든 결과 같음\n> 🚨 생산자한테 매기든 소비자한테 매기든 **최종 부담 배분은 똑같음.**\n> 법적으로 내는 사람(납세의무자)이랑 실제로 부담하는 사람(담세자)은 다름.\n> 이걸 **전가와 귀착**이라 함.\n\n### 누가 더 뒤집어쓰냐 (이게 핵심)\n> 🚨 **덜 탄력적인 쪽이 더 부담함.**\n> 탄력적 = 도망갈 데 있음. 비탄력적 = 도망 못 감.\n> **도망 못 가는 놈이 뒤집어씀.** 이 한 줄만 알면 다 풀림.\n\n담배세 올려도 결국 흡연자가 다 냄. 왜? 담배 수요가 비탄력적이라 끊지를 못하니까.\n\n- 수요 완전비탄력 → 소비자가 100% 부담\n- 공급 완전비탄력 → 생산자가 100% 부담\n\n## 자중손실\n세금이나 규제 때문에 거래가 줄면서 **그냥 증발하는 후생**임.\n정부가 먹는 것도 아니고 누가 먹는 것도 아님. 그냥 사라짐.\n\n> 🚨 **탄력성 클수록 자중손실 큼.**\n> 탄력적이면 세금 붙자마자 사람들이 확 떠나버려서 거래가 많이 줄거든.\n> 그래서 정부가 세금 매길 때 비탄력적인 것(담배, 술, 기름)에 매김. 세수는 잘 걷히고 자중손실은 작으니까.\n\n▸ 자중손실 = 사중손실. 같은 말임."},{"title":"⑤ 소비자잉여와 사회후생","sub":"미시경제","body":"## 잉여란 이득의 크기\n### 소비자잉여\n지불할 용의가 있던 금액에서 실제로 낸 금액을 뺀 값입니다.\n5만원까지 낼 생각이었는데 3만원에 샀다면 소비자잉여는 2만원입니다.\n그래프에서는 **수요곡선 아래, 가격선 위** 면적입니다.\n\n### 생산자잉여\n실제로 받은 금액에서 최소한 받아야 했던 금액을 뺀 값입니다.\n그래프에서는 **가격선 아래, 공급곡선 위** 면적입니다.\n\n### 총잉여\n소비자잉여 + 생산자잉여입니다. 사회 전체가 그 거래에서 얻은 이득입니다.\n\n## 시장균형이 효율적인 이유\n경쟁시장의 균형에서 **총잉여가 최대**가 됩니다.\n그 지점에서 거래량을 늘리면 비용이 편익보다 커지고, 줄이면 얻을 수 있던 이득을 놓칩니다.\n\n> 이것이 보이지 않는 손의 수학적 표현입니다. 각자 자기 이익만 좇았는데 결과적으로 사회 전체 이득이 최대가 됩니다.\n\n## 효율성과 형평성은 다르다\n> 총잉여가 최대라는 것은 **효율적**이라는 뜻이지 **공평**하다는 뜻이 아닙니다.\n> 잉여가 소비자와 생산자 사이에 어떻게 나뉘는지는 효율성이 말해주지 않습니다.\n> 시험에서 \"시장균형은 항상 공평한 분배를 보장한다\"는 선택지는 오답입니다.\n\n## 파레토 효율\n누군가의 처지를 나쁘게 만들지 않고서는 다른 누구의 처지도 좋게 만들 수 없는 상태입니다.\n> 파레토 효율적인 배분은 **여러 개** 있을 수 있습니다. 한 사람이 전부 갖는 상태도 파레토 효율적일 수 있습니다. 효율이 곧 정의가 아니라는 점이 여기서 드러납니다.\n\n## 후생경제학의 정리\n- **제1정리**: 완전경쟁시장의 균형은 파레토 효율적이다\n- **제2정리**: 초기 부존자원을 적절히 재분배하면 어떤 파레토 효율적 배분도 시장을 통해 달성할 수 있다\n\n▸ 잉여: 거래에서 얻은 순이득.\n▸ 파레토 개선: 아무도 손해 보지 않으면서 누군가는 나아지는 변화.\n▸ 부존자원: 처음에 각자가 가지고 있는 자원.","alt":"## 잉여 = 남는 이득\n\n### 소비자잉여\n5만원까지 낼 생각이었는데 3만원에 삼 → **2만원 이득**. 이게 소비자잉여.\n그래프에서 **수요곡선 아래 + 가격선 위** 면적.\n\n### 생산자잉여\n3만원에 팔았는데 2만원만 받아도 됐음 → **1만원 이득**.\n그래프에서 **가격선 아래 + 공급곡선 위** 면적.\n\n### 총잉여 = 둘 합\n사회 전체가 그 거래로 번 이득.\n\n## 시장균형이 효율적인 이유\n경쟁시장 균형에서 **총잉여가 최대**임.\n더 팔면 비용이 편익보다 커지고, 덜 팔면 벌 수 있던 걸 놓침. 딱 그 지점이 최적.\n\n> 이게 \"보이지 않는 손\"을 수학으로 쓴 거임. 다들 자기 이익만 챙겼는데 사회 전체가 최적이 됨.\n\n## 효율 ≠ 공평 ⭐\n> 🚨 총잉여 최대 = **효율적**이라는 뜻이지 **공평**하다는 뜻 아님.\n> 그 이득이 소비자랑 생산자한테 어떻게 나뉘는지는 효율성이 말 안 해줌.\n> \"시장균형은 공평한 분배를 보장한다\" → **오답.** 이거 자주 나옴.\n\n## 파레토 효율\n> 누구 하나 손해 안 보고는 아무도 더 좋아질 수 없는 상태.\n\n> 🚨 파레토 효율인 상태는 **여러 개** 있음.\n> 심지어 한 명이 전부 다 갖고 나머지가 거지여도 **파레토 효율일 수 있음.**\n> 뺏으면 그 사람이 손해 보니까. 효율이 정의가 아니라는 게 여기서 드러남.\n\n## 후생경제학 정리\n- **1정리**: 완전경쟁 균형 = 파레토 효율\n- **2정리**: 처음 자원을 잘 재분배해두면 어떤 파레토 효율 상태든 시장으로 도달 가능\n\n> 2정리가 시사하는 건 이거임. \"효율은 시장에 맡기고 형평은 재분배로 따로 챙겨라.\"\n\n▸ 파레토 개선: 아무도 손해 없이 누군가는 나아짐.\n▸ 부존자원: 처음에 갖고 있던 자원."},{"title":"⑥ 효용과 소비자 선택","sub":"미시경제","body":"## 한계효용이론\n효용은 만족의 크기입니다. 총효용은 전체 만족, 한계효용은 **한 단위 더 소비할 때 늘어나는 만족**입니다.\n\n### 한계효용 체감의 법칙\n많이 먹을수록 추가 한 개의 만족은 줄어듭니다. 첫 잔 맥주와 다섯째 잔 맥주가 다릅니다.\n> 총효용이 최대일 때 한계효용은 **0**입니다. 한계효용이 음수가 되면 더 먹을수록 괴로워지므로 총효용이 줄어듭니다.\n\n### 한계효용 균등의 법칙\n여러 재화를 살 때 만족을 최대로 하려면 이렇게 맞춰야 합니다.\n> **X재 한계효용 ÷ X재 가격 = Y재 한계효용 ÷ Y재 가격**\n\n즉 **1원어치당 만족**이 같아지는 지점입니다. 어느 한쪽이 더 크면 그쪽으로 돈을 옮기는 게 이득이므로 균형이 아닙니다.\n\n## 무차별곡선\n같은 효용을 주는 조합들을 이은 선입니다.\n\n### 성질 네 가지\n- 우하향한다 (하나를 늘리면 하나를 줄여야 하니까)\n- **원점에 볼록하다** (한계대체율 체감)\n- 원점에서 멀수록 효용이 높다\n- **서로 교차하지 않는다** (교차하면 모순이 생김)\n\n### 한계대체율(MRS)\nX를 한 단위 더 얻기 위해 포기할 용의가 있는 Y의 양입니다. 무차별곡선의 기울기입니다.\nX를 이미 많이 갖고 있으면 X 한 개를 위해 포기할 Y가 줄어듭니다. 그래서 체감하고, 곡선이 볼록해집니다.\n\n## 예산선\n소득으로 살 수 있는 조합의 경계선입니다. 기울기는 **두 재화의 상대가격**입니다.\n- 소득 증가 → 예산선이 **바깥으로 평행이동**\n- X재 가격 하락 → X축 절편이 밖으로 이동하며 **기울기가 바뀜**\n\n## 소비자균형\n> **무차별곡선과 예산선이 접하는 점**입니다.\n> 이 점에서 한계대체율 = 상대가격이 성립합니다.\n\n▸ 효용: 소비에서 얻는 만족.\n▸ 한계대체율: 무차별곡선의 기울기. 주관적 교환비율.\n▸ 상대가격: 예산선의 기울기. 시장의 객관적 교환비율.","alt":"## 한계효용\n- 총효용: 전체 만족\n- 한계효용: **한 개 더 먹을 때 늘어나는 만족**\n\n### 체감의 법칙\n치킨 첫 조각 vs 열째 조각. 만족이 줄어듦. 당연함.\n> 🚨 **총효용 최대일 때 한계효용 = 0**임.\n> 더 먹어도 안 늘어나는 지점. 그 뒤로 먹으면 한계효용이 음수 되면서 오히려 괴로워짐.\n> 이거 그래프 문제로 나옴.\n\n### 균등의 법칙 ⭐\n여러 개 살 때 만족 최대로 하려면?\n> **X 한계효용/X 가격 = Y 한계효용/Y 가격**\n\n즉 **1원어치당 만족**을 똑같이 맞춤.\n한쪽이 더 크면? 그쪽으로 돈 옮기는 게 이득이니까 아직 최적 아님.\n\n## 무차별곡선\n같은 만족 주는 조합들을 이은 선.\n\n### 성질 4개 (다 나옴)\n- 우하향\n- **원점에 볼록** (한계대체율 체감 때문)\n- 원점에서 멀수록 효용 높음\n- **교차 안 함**\n\n> 🚨 \"무차별곡선은 서로 교차할 수 있다\" → 오답. 교차하면 같은 점이 두 개의 다른 효용을 갖는 모순이 생김.\n\n### 한계대체율(MRS)\nX 하나 더 얻으려고 포기할 Y의 양. **곡선의 기울기**임.\nX를 이미 많이 갖고 있으면 X 하나가 덜 귀함 → 포기할 Y가 줄어듦 → 체감 → 볼록해짐.\n\n## 예산선\n내 돈으로 살 수 있는 경계선. 기울기 = **상대가격**.\n- 소득 증가 → **평행하게 바깥으로**\n- X 가격 하락 → X축 쪽만 밖으로, **기울기 변함**\n\n> 🚨 평행이동이냐 기울기 변화냐를 물어봄. 소득은 평행, 가격은 기울기.\n\n## 소비자균형 ⭐\n> **무차별곡선이랑 예산선이 접하는 점.**\n> 여기서 한계대체율 = 상대가격.\n> 내 주관적 교환비율이랑 시장의 객관적 교환비율이 같아지는 지점임.\n\n▸ MRS: 무차별곡선 기울기.\n▸ 상대가격: 예산선 기울기."},{"title":"⑦ 소득효과와 대체효과","sub":"미시경제","body":"## 가격이 변하면 두 가지가 동시에 일어난다\nX재 가격이 떨어졌다고 해봅시다. 소비량이 변하는데, 그 변화는 두 힘이 합쳐진 결과입니다.\n\n### 대체효과\nX가 상대적으로 싸졌으니 Y 대신 X를 삽니다.\n> **대체효과는 항상 가격과 반대 방향**입니다. 가격이 내리면 소비가 늘어납니다. 예외가 없습니다.\n\n### 소득효과\nX가 싸지면 같은 돈으로 더 많이 살 수 있게 됩니다. 실질소득이 늘어난 셈입니다.\n> 소득효과의 방향은 **재화의 성격**에 달렸습니다.\n> - 정상재: 실질소득 증가 → 소비 증가 (가격과 반대 방향)\n> - 열등재: 실질소득 증가 → 소비 감소 (가격과 같은 방향)\n\n## 재화별 정리 (핵심 표)\n| 재화 | 대체효과 | 소득효과 | 합계 |\n|---|---|---|---|\n| 정상재 | 반대 | 반대 | 반대 (수요곡선 우하향) |\n| 열등재 | 반대 | 같음 | 대체효과가 커서 반대 |\n| **기펜재** | 반대 | 같음 | **같음 (수요곡선 우상향)** |\n\n> **기펜재는 열등재 중에서 소득효과가 대체효과보다 큰 특수한 경우**입니다.\n> 가격이 올랐는데 오히려 더 사는 재화입니다. 따라서 **모든 기펜재는 열등재지만 모든 열등재가 기펜재는 아닙니다.** 이 포함관계가 시험에 나옵니다.\n\n## 보상수요곡선\n실질소득 변화 효과를 제거하고 **대체효과만** 남긴 수요곡선입니다.\n- 힉스: 효용을 원래대로 유지시키는 방식\n- 슬러츠키: 원래 구매하던 양을 살 수 있게 소득을 조정하는 방식\n\n정상재의 경우 보상수요곡선이 통상수요곡선보다 **가파릅니다.** 소득효과가 빠졌기 때문입니다.\n\n▸ 실질소득: 돈의 액수가 아니라 실제 살 수 있는 양.\n▸ 통상수요곡선: 우리가 보통 말하는 수요곡선.\n▸ 기펜재: 가격이 오르면 수요량이 늘어나는 재화.","alt":"## 가격 변하면 두 힘이 동시에 작동함\nX 가격이 내렸음. 소비가 변하는데 이건 두 힘의 합임.\n\n### 대체효과\nX가 싸졌으니 Y 대신 X를 삼.\n> 🚨 **대체효과는 무조건 가격과 반대 방향.** 예외 없음. 이건 고정임.\n\n### 소득효과\nX가 싸짐 → 같은 돈으로 더 살 수 있음 → 부자가 된 효과.\n> 🚨 근데 방향이 **재화 성격**에 따라 갈림.\n> 정상재: 부자 되면 더 삼 → 가격과 반대\n> 열등재: 부자 되면 덜 삼 → 가격과 **같은 방향**\n\n## 표로 정리 ⭐\n| | 대체효과 | 소득효과 | 최종 |\n|---|---|---|---|\n| 정상재 | 반대 | 반대 | 반대 |\n| 열등재 | 반대 | 같음 | 반대 (대체가 이김) |\n| **기펜재** | 반대 | 같음 | **같음** (소득이 이김) |\n\n> 🚨 **기펜재 = 열등재인데 소득효과가 대체효과보다 큰 놈.**\n> 가격 올랐는데 오히려 더 삼. 수요곡선이 우상향함.\n> **모든 기펜재는 열등재. 근데 모든 열등재가 기펜재는 아님.**\n> 이 포함관계 물어봄. 기펜재가 열등재 안에 쏙 들어간 부분집합임.\n\n## 보상수요곡선\n소득효과 빼고 **대체효과만** 남긴 수요곡선.\n- 힉스: 효용을 원래대로 유지\n- 슬러츠키: 원래 사던 양을 살 수 있게 소득 조정\n\n> 🚨 정상재는 보상수요곡선이 통상수요곡선보다 **더 가파름.**\n> 소득효과가 빠졌으니 덜 움직이는 거임. 덜 움직이면 가파름.\n\n▸ 실질소득: 액수 말고 실제 구매력.\n▸ 기펜재: 비싸질수록 더 사는 이상한 재화."},{"title":"⑧ 생산과 비용","sub":"미시경제","body":"## 단기와 장기\n- **단기**: 고정요소가 존재하는 기간. 공장 크기를 못 바꿉니다\n- **장기**: 모든 요소를 조절할 수 있는 기간\n\n기간의 길이가 아니라 **고정요소가 있느냐**로 나눕니다.\n\n## 수확체감의 법칙\n다른 요소를 고정한 채 한 요소만 계속 늘리면, 어느 순간부터 추가 산출량이 줄어듭니다.\n공장은 그대로인데 사람만 계속 넣으면 서로 부딪혀서 효율이 떨어지는 것입니다.\n\n## 비용의 종류\n- **고정비용(FC)**: 생산량과 무관하게 나가는 비용. 임대료\n- **가변비용(VC)**: 생산량에 따라 변하는 비용. 재료비\n- **총비용(TC) = FC + VC**\n\n여기서 평균과 한계가 나옵니다.\n- **AC = TC ÷ Q** (평균총비용)\n- **AVC = VC ÷ Q** (평균가변비용)\n- **MC = ΔTC ÷ ΔQ** (한계비용)\n\n## 비용곡선의 모양 (그래프 문제 단골)\n평균곡선은 U자입니다. 한계비용곡선도 U자인데 더 가파릅니다.\n\n> **한계비용곡선은 평균비용곡선의 최저점을 아래에서 위로 통과합니다.**\n> 이유는 간단합니다. 시험 평균이 80인데 이번에 70점을 받으면 평균이 내려가고, 90점을 받으면 올라갑니다. 한계값이 평균보다 작으면 평균이 내려가고 크면 올라갑니다. 그래서 딱 만나는 지점이 평균의 최저점입니다.\n\nAVC의 최저점도 MC가 통과합니다. AC 최저점보다 AVC 최저점이 **왼쪽**에 있습니다.\n\n## 장기평균비용\n장기에는 공장 크기까지 조절할 수 있으므로 단기평균비용곡선들의 아래를 감싸는 포락선이 됩니다.\n- 생산량이 늘면서 LAC가 하락 → **규모의 경제**\n- LAC가 상승 → **규모의 불경제**\n- 최소효율규모: LAC가 최소가 되는 최소한의 생산량\n\n## 범위의 경제\n두 제품을 따로 만들 때보다 **함께 만들 때** 비용이 적게 드는 것입니다. 규모의 경제와 구분해야 합니다.\n\n▸ 포락선: 여러 곡선을 아래에서 감싸는 곡선.\n▸ 매몰비용과 고정비용: 고정비용이라도 회수 가능하면 매몰비용이 아닙니다.\n▸ 규모의 경제: 생산 규모가 커질수록 단위당 비용이 낮아지는 현상.","alt":"## 단기 vs 장기\n- **단기**: 못 바꾸는 게 있음 (공장 크기)\n- **장기**: 다 바꿀 수 있음\n\n> 🚨 기간의 길이가 아니라 **고정요소 유무**로 나눔. \"장기는 1년 이상\" 같은 건 오답.\n\n## 수확체감의 법칙\n공장은 그대로인데 사람만 계속 넣음 → 어느 순간부터 추가 생산량이 줄어듦.\n서로 부딪히고 자리도 없고. 당연함.\n\n## 비용 종류\n- **FC 고정비용**: 생산량 무관. 임대료\n- **VC 가변비용**: 생산량 따라 변함. 재료비\n- **TC = FC + VC**\n\n- AC = TC/Q\n- AVC = VC/Q\n- **MC = ΔTC/ΔQ**\n\n## 비용곡선 모양 ⭐ (그래프 단골)\n평균곡선 U자. 한계곡선도 U자인데 더 가파름.\n\n> 🚨 **MC는 AC의 최저점을 아래에서 위로 뚫고 지나감.**\n>\n> 왜 그런지 이해하는 법:\n> 내 시험 평균이 80점임. 이번에 70점 받음 → 평균 내려감. 90점 받음 → 평균 올라감.\n> 즉 **한계값 < 평균 → 평균 하락 / 한계값 > 평균 → 평균 상승**\n> 그러니까 둘이 만나는 순간이 평균의 바닥임. 이거 이해하면 절대 안 까먹음.\n\nAVC 최저점도 MC가 통과함. 그리고 **AVC 최저점이 AC 최저점보다 왼쪽**에 있음.\n\n## 장기평균비용(LAC)\n단기 곡선들을 아래에서 감싸는 포락선.\n- 내려가는 구간 → **규모의 경제**\n- 올라가는 구간 → **규모의 불경제**\n- 최소효율규모: LAC 최소가 되는 최소 생산량\n\n## 범위의 경제\n> 🚨 규모의 경제랑 헷갈리게 냄.\n> **규모**의 경제 = 많이 만들수록 싸짐\n> **범위**의 경제 = 여러 종류를 **같이** 만들면 싸짐\n> 프린터랑 잉크 같이 만드는 거.\n\n▸ 포락선: 여러 곡선을 아래에서 감싸는 선."},{"title":"⑨ 완전경쟁시장","sub":"미시경제","body":"## 완전경쟁의 네 조건\n- 다수의 수요자와 공급자 (아무도 가격에 영향을 못 줌)\n- **동질적인 재화** (제품 차별화가 없음)\n- 진입과 퇴출의 자유\n- 완전한 정보\n\n> \"제품 차별화\"가 선택지에 있으면 그건 독점적 경쟁의 특징이므로 오답입니다.\n\n## 가격수용자\n개별 기업은 시장가격을 그대로 받아들입니다. 내가 값을 올리면 아무도 안 사고, 내릴 이유도 없습니다.\n따라서 개별 기업이 마주하는 수요곡선은 **수평선**입니다.\n> 이때 **P = AR = MR**이 성립합니다. 시장 전체 수요곡선은 여전히 우하향한다는 점을 헷갈리면 안 됩니다.\n\n## 이윤극대화\n모든 기업의 이윤극대화 조건은 **MR = MC**입니다.\n완전경쟁에서는 P = MR이므로 **P = MC**가 됩니다.\n\n## 단기 균형과 조업중단\n단기에는 이윤이 날 수도 손실이 날 수도 있습니다.\n- P > AC → 초과이윤\n- P = AC → 정상이윤 (경제적 이윤 0)\n- AVC < P < AC → **손실이지만 계속 생산** (고정비 일부라도 회수)\n- **P < AVC 최저점 → 조업 중단**\n\n> 조업중단점은 AVC의 최저점입니다. 손익분기점은 AC의 최저점입니다. 둘을 바꿔 내는 문제가 자주 나옵니다.\n\n단기 공급곡선은 **AVC 최저점 위쪽의 MC곡선**입니다.\n\n## 장기 균형\n초과이윤이 나면 새 기업이 들어옵니다. 공급이 늘어 가격이 떨어집니다. 손실이 나면 기업이 나갑니다.\n결국 **경제적 이윤이 0**이 되는 지점에서 멈춥니다.\n\n> 장기균형에서는 **P = MR = MC = AC 최저점**이 모두 성립합니다.\n> 경제적 이윤이 0이라는 것은 망한다는 뜻이 아닙니다. 암묵적 비용까지 다 회수하고 있다는 뜻이라 **정상이윤은 얻고 있는 상태**입니다. 이 함정이 자주 나옵니다.\n\n▸ 가격수용자: 시장가격을 그대로 받아들이는 기업.\n▸ 정상이윤: 그 사업을 계속하게 만드는 최소한의 이윤. 회계상으로는 이익입니다.\n▸ 조업중단점: 생산을 멈추는 것이 나은 가격 수준.","alt":"## 완전경쟁 4조건\n- 다수의 수요자·공급자\n- **동질적 재화**\n- 진입·퇴출 자유\n- 완전한 정보\n\n> 🚨 \"제품 차별화\"가 선택지에 있으면 **오답.** 그건 독점적 경쟁 특징임.\n\n## 가격수용자\n개별 기업은 가격을 못 정함. 올리면 아무도 안 사고 내릴 이유도 없음.\n→ 개별 기업이 보는 수요곡선은 **수평선**.\n→ **P = AR = MR**\n\n> 🚨 근데 **시장 전체 수요곡선은 여전히 우하향**함.\n> 개별 기업이 보는 것 vs 시장 전체. 이거 섞어서 냄.\n\n## 이윤극대화\n모든 시장 공통: **MR = MC**\n완전경쟁은 P = MR이니까 → **P = MC**\n\n## 단기: 언제 문 닫냐 ⭐\n- P > AC → 개꿀. 초과이윤\n- P = AC → 본전 (경제적 이윤 0)\n- AVC < P < AC → **손해인데 계속 함** (고정비라도 건짐)\n- **P < AVC 최저 → 문 닫음**\n\n> 🚨 왜 손해인데 계속 하냐?\n> 임대료는 문 닫아도 나감. 근데 장사하면 재료비 빼고 조금이라도 남아서 임대료에 보탤 수 있음. 문 닫으면 임대료를 통째로 뒤집어씀.\n> 근데 재료비도 못 건지면? 그땐 진짜 문 닫는 게 나음. 그게 AVC 최저점.\n\n> 🚨 **조업중단점 = AVC 최저점 / 손익분기점 = AC 최저점**\n> 이 둘 바꿔서 진짜 자주 냄.\n\n단기 공급곡선 = **AVC 최저점 위의 MC곡선**\n\n## 장기 균형\n돈 벌리면 새 기업 들어옴 → 공급 늘어 가격 떨어짐 → 결국 **경제적 이윤 0**에서 멈춤.\n\n> 장기균형: **P = MR = MC = AC최저점** 다 같아짐.\n\n> 🚨 **경제적 이윤 0 = 망하는 거 아님.**\n> 암묵적 비용(내가 딴 데서 벌 수 있던 돈)까지 다 회수하고 있다는 뜻임.\n> **정상이윤은 벌고 있는 상태**임. 이 함정 자주 나옴.\n\n▸ 정상이윤: 그 일을 계속하게 만드는 최소 이윤. 회계상으론 흑자임."},{"title":"⑩ 독점과 불완전경쟁","sub":"미시경제","body":"## 독점의 발생 원인\n- 규모의 경제 (자연독점)\n- 진입장벽: 특허, 정부 인허가, 원자재 독점\n- 네트워크 효과\n\n## 독점기업의 가격 결정\n독점기업은 시장 전체 수요곡선을 마주합니다. 우하향합니다.\n더 팔려면 가격을 낮춰야 하는데, **이미 팔던 물량까지 싸게** 팔아야 합니다. 그래서 한계수입이 가격보다 작아집니다.\n> **P > MR**입니다. MR곡선은 수요곡선보다 아래에 있고 기울기가 두 배로 가파릅니다.\n\n이윤극대화는 MR = MC에서 결정하고, 가격은 그 수량에 해당하는 **수요곡선 위의 점**에서 받습니다.\n> 결과적으로 **P > MC**가 되어 자원배분이 비효율적입니다. 여기서 자중손실이 생깁니다.\n\n## 독점의 특징\n- 공급곡선이 존재하지 않습니다. 가격과 수량을 함께 정하기 때문입니다\n- **수요가 비탄력적인 구간에서는 생산하지 않습니다.** 그 구간에서는 가격을 올릴수록 총수입이 늘기 때문입니다. 항상 탄력적 구간에서 생산합니다\n\n## 가격차별\n같은 재화를 사람에 따라 다른 가격에 파는 것입니다.\n성립 조건은 세 가지입니다.\n- 시장지배력이 있을 것\n- 집단별 수요탄력성이 다를 것\n- **재판매가 불가능할 것**\n\n- 1급: 소비자마다 최대지불용의만큼 받음. 소비자잉여를 전부 흡수하지만 **자원배분은 효율적**\n- 2급: 구매량에 따라 다른 가격. 대량구매 할인\n- 3급: 집단을 나눠 다른 가격. 학생 할인, 조조할인\n\n## 독점적 경쟁\n다수의 기업이 **차별화된** 제품을 파는 시장입니다. 미용실, 음식점이 예입니다.\n- 단기에는 초과이윤 가능, 장기에는 진입으로 **이윤 0**\n- 다만 장기균형에서 **P > MC**이고 **AC 최저점보다 왼쪽**에서 생산합니다. 이를 **초과설비**라고 합니다\n\n## 과점\n소수의 기업이 지배하는 시장입니다. 기업 간 상호의존성이 핵심입니다.\n- **굴절수요곡선**: 가격을 올리면 아무도 안 따라오고, 내리면 다 따라옵니다. 그래서 수요곡선이 꺾이고 MR에 불연속 구간이 생겨 **가격이 경직적**이 됩니다\n- 담합(카르텔)이 발생하기 쉽지만 배신 유인도 큽니다\n\n▸ 자연독점: 규모의 경제가 커서 한 기업이 공급하는 것이 효율적인 경우.\n▸ 초과설비: 최적 규모보다 작게 생산해 설비가 남는 상태.\n▸ 카르텔: 기업들이 가격이나 생산량을 담합하는 것.","alt":"## 독점 생기는 이유\n규모의 경제(자연독점) / 특허·인허가 같은 진입장벽 / 네트워크 효과\n\n## 독점기업은 왜 P > MR 인가 ⭐\n독점기업은 시장 전체 수요곡선을 마주함. 우하향임.\n더 팔려면 가격을 내려야 하는데, **이미 팔던 것까지 다 싸게** 팔아야 함.\n\n> 100개를 1만원에 팔다가 101개 팔려고 9900원으로 내림\n> → 추가 수입 9900원이 아님. 앞의 100개도 100원씩 깎였으니 -10000원\n> → 실제 한계수입 = 9900 - 10000 = **마이너스**일 수도 있음\n> 그래서 **P > MR**임. MR곡선은 수요곡선보다 아래고 기울기가 **2배** 가파름.\n\n이윤극대화는 MR=MC에서 수량 정하고, 가격은 그 수량의 **수요곡선 위 점**에서 받음.\n결과: **P > MC** → 비효율 → **자중손실** 발생.\n\n## 독점 특징 (함정 2개)\n> 🚨 독점기업은 **공급곡선이 없음.** 가격이랑 수량을 자기가 같이 정하니까 \"이 가격이면 이만큼 공급\" 관계가 성립 안 함.\n> 🚨 독점기업은 **비탄력적 구간에서 생산 안 함.** 거긴 가격 올릴수록 수입이 느니까 안 갈 이유가 없음. 항상 **탄력적 구간**에서 생산함.\n\n## 가격차별\n같은 물건을 사람마다 다른 값에 팖.\n조건 3개: 시장지배력 / 집단별 탄력성 다름 / **재판매 불가**\n\n- 1급: 한 명 한 명 최대로 뜯어냄. 소비자잉여 전부 흡수. **근데 자원배분은 효율적**임 (이게 함정)\n- 2급: 많이 살수록 할인\n- 3급: 학생할인, 조조할인\n\n## 독점적 경쟁\n기업 많은데 **제품이 다름**. 미용실, 음식점.\n- 단기 초과이윤 O / 장기에는 진입으로 **이윤 0**\n> 🚨 근데 장기균형에서 **P > MC**이고 **AC 최저점 왼쪽**에서 생산함.\n> 즉 설비를 다 못 쓰고 남김. 이걸 **초과설비**라 함. 완전경쟁이랑 다른 지점임.\n\n## 과점\n소수가 지배. 서로 눈치 봄.\n> 🚨 **굴절수요곡선**: 내가 가격 올리면 아무도 안 따라옴(손님 다 뺏김). 내리면 다 따라옴(효과 없음).\n> → 수요곡선이 꺾임 → MR에 뚝 끊긴 구간 생김 → **가격이 잘 안 변함(경직성)**\n\n담합하기 쉬운데 배신하고 싶은 마음도 큼. 이게 죄수의 딜레마로 이어짐.\n\n▸ 자연독점: 규모의 경제가 커서 하나가 하는 게 효율적인 경우."},{"title":"⑪ 시장실패","sub":"미시경제","body":"## 시장실패란\n시장에 맡겼는데 효율적인 자원배분이 안 되는 상태입니다. 정부 개입의 근거가 됩니다.\n원인은 크게 넷입니다. 불완전경쟁, 외부효과, 공공재, 정보의 비대칭.\n\n## 외부효과\n거래 당사자가 아닌 제3자에게 이익이나 손해가 가는데 그 대가가 오가지 않는 경우입니다.\n\n### 부정적 외부효과 (공해)\n사적 비용 < 사회적 비용\n> 생산자가 사회적 비용을 다 부담하지 않으므로 **사회적 최적보다 과다 생산**됩니다.\n\n### 긍정적 외부효과 (교육, 예방접종)\n사적 편익 < 사회적 편익\n> **사회적 최적보다 과소 생산**됩니다.\n\n### 해결책\n- **피구세**: 부정적 외부효과에 세금을 매겨 사적 비용을 사회적 비용과 같게 만듦\n- 보조금: 긍정적 외부효과에 지급\n- **코즈 정리**: 재산권이 명확하고 거래비용이 없다면 **누구에게 권리가 있든** 당사자 협상으로 효율적 결과에 도달한다\n- 배출권 거래제\n\n> 코즈 정리의 핵심은 권리를 누구에게 주느냐가 효율성을 바꾸지 않는다는 점입니다. 다만 소득 분배는 달라집니다. 현실에서는 거래비용과 당사자 수 때문에 한계가 있습니다.\n\n## 공공재\n두 가지 성질을 갖습니다.\n- **비경합성**: 한 사람이 써도 다른 사람 몫이 줄지 않음\n- **비배제성**: 돈 안 낸 사람을 막을 수 없음\n\n비배제성 때문에 **무임승차** 문제가 생기고, 아무도 돈을 내려 하지 않아 시장에서 **과소 공급**됩니다.\n\n> 경합성과 배제성의 조합으로 재화를 네 가지로 나눕니다.\n> - 사적재: 경합 O, 배제 O\n> - 공공재: 경합 X, 배제 X\n> - 클럽재: 경합 X, 배제 O (유료 케이블방송)\n> - **공유자원: 경합 O, 배제 X** (바닷속 물고기)\n\n공유자원에서는 **공유지의 비극**이 발생합니다. 누구나 쓸 수 있는데 쓰면 줄어드니 서로 먼저 쓰려다 자원이 고갈됩니다.\n\n## 정보의 비대칭\n- **역선택**: 계약 **전**에 정보가 부족해 나쁜 상대를 고르게 됨. 중고차 시장, 보험 가입\n- **도덕적 해이**: 계약 **후**에 상대가 최선을 다하지 않음. 보험 가입 후 부주의\n\n> 역선택은 감춰진 특성, 도덕적 해이는 감춰진 행동입니다. 시점이 계약 전이냐 후냐로 구분하면 절대 안 틀립니다.\n\n해결책으로 신호 발송(학위, 보증), 선별(보험사의 심사), 유인설계(성과급, 자기부담금)가 있습니다.\n\n▸ 피구세: 외부효과를 교정하기 위한 세금.\n▸ 무임승차: 대가를 내지 않고 이용하는 것.\n▸ 신호 발송: 정보를 가진 쪽이 자기 유형을 알리는 행동.","alt":"## 시장실패 = 시장에 맡겼는데 망함\n정부가 끼어들 명분이 되는 상황들. 원인 4개.\n불완전경쟁 / 외부효과 / 공공재 / 정보 비대칭\n\n## 외부효과\n당사자 아닌 **제3자**한테 이익이나 손해가 가는데 돈은 안 오감.\n\n### 부정적 (공해)\n사적비용 < 사회적비용\n> 공장은 폐수 처리비를 안 냄 → 자기 비용이 실제보다 작아 보임 → **너무 많이 생산함**\n\n### 긍정적 (교육, 백신)\n사적편익 < 사회적편익\n> 내가 백신 맞으면 남도 안전해짐. 근데 그 값은 안 받음 → **너무 적게 생산됨**\n\n### 해결책\n- **피구세**: 부정적 외부효과에 세금 때려서 비용을 맞춰줌\n- 보조금: 긍정적 외부효과에 지원\n- **코즈 정리** ⭐\n- 배출권 거래제\n\n> 🚨 코즈 정리 핵심: 재산권만 명확하면 **누구한테 권리를 주든** 협상으로 효율적 결과 나옴.\n> 권리를 공장에 주든 주민에게 주든 최종 오염량은 같음. 다만 **돈이 누구 주머니로 가느냐만 달라짐.**\n> 현실에선 협상비용 때문에 잘 안 됨.\n\n## 공공재\n- **비경합성**: 내가 써도 남 몫 안 줄어듦\n- **비배제성**: 돈 안 낸 놈 못 막음\n\n비배제성 때문에 **무임승차** 생김 → 아무도 돈 안 냄 → **과소 공급**\n\n### 4분류표 ⭐\n| | 배제 O | 배제 X |\n|---|---|---|\n| **경합 O** | 사적재 | **공유자원** |\n| **경합 X** | 클럽재 | **공공재** |\n\n> 🚨 **공유자원**(경합 O, 배제 X)이 함정임. 바닷속 물고기.\n> 누구나 잡을 수 있는데(배제X) 잡으면 줄어듦(경합O)\n> → 서로 먼저 잡으려다 씨가 마름. 이게 **공유지의 비극**.\n\n## 정보 비대칭 ⭐\n- **역선택**: 계약 **전**. 정보 몰라서 나쁜 걸 고름. 중고차, 보험 가입\n- **도덕적 해이**: 계약 **후**. 상대가 대충함. 보험 들고 나서 부주의해짐\n\n> 🚨 구분법 하나만 기억하면 됨.\n> **계약 전 = 역선택 / 계약 후 = 도덕적 해이**\n> 또는 역선택은 **감춰진 특성**, 도덕적 해이는 **감춰진 행동**.\n> 이 기준으로 보면 절대 안 틀림.\n\n해결: 신호발송(학위·보증서), 선별(보험 심사), 유인설계(성과급·자기부담금)\n\n▸ 피구세: 외부효과 교정용 세금.\n▸ 무임승차: 돈 안 내고 이용."},{"title":"① 국민소득의 측정","sub":"거시경제","body":"## GDP란\n**일정 기간 동안 한 나라 안에서 새로 생산된 최종 생산물의 시장가치 합계**입니다.\n정의 하나하나가 시험 문제입니다.\n\n- **일정 기간**: 유량(flow) 개념입니다. 저량인 국부와 다릅니다\n- **한 나라 안에서**: 속지주의입니다. 외국인이 국내에서 번 것도 포함, 우리 국민이 해외에서 번 것은 제외\n- **새로 생산된**: 중고 거래는 제외됩니다. 다만 중개 수수료는 포함됩니다\n- **최종 생산물**: 중간재는 제외됩니다. 이중계산을 막기 위함입니다\n- **시장가치**: 시장에서 거래되지 않는 가사노동, 자원봉사는 제외됩니다\n\n> 자주 나오는 제외 항목: 주부의 가사노동, 중고차 거래액, 주식 매매 차익, 정부의 이전지출(실업급여, 연금)\n> 포함되는 예외: 자가주택의 귀속임대료, 농가의 자가소비 농산물, 국방·치안 등 정부 서비스\n\n## GDP와 GNI\n- **GDP**: 국내에서 생산 (속지주의)\n- **GNI**: 우리 국민이 벌어들인 소득 (속인주의)\n\n> GNI = GDP + 국외순수취요소소득\n\n## 명목GDP와 실질GDP\n- **명목**: 그해 가격으로 계산. 물가 상승분이 섞여 있음\n- **실질**: 기준연도 가격으로 계산. 진짜 생산량 변화를 봄\n\n> **GDP 디플레이터 = (명목GDP ÷ 실질GDP) × 100**\n> 국내에서 생산된 모든 것을 대상으로 하는 가장 포괄적인 물가지표입니다. 수입품은 포함되지 않습니다.\n\n## 세 가지 접근법\n생산, 분배, 지출 어느 쪽으로 재도 값이 같습니다. 이를 **삼면등가의 원칙**이라고 합니다.\n- 지출 측면: **Y = C + I + G + (X − M)**\n\n## GDP의 한계\n- 시장 밖 활동을 못 잡습니다\n- 소득 분배 상태를 보여주지 못합니다\n- 환경 파괴나 여가를 반영하지 못합니다\n- 지하경제가 빠집니다\n\n▸ 유량: 기간 동안 측정하는 양. 소득, 생산.\n▸ 저량: 특정 시점에 측정하는 양. 재산, 통화량.\n▸ 이전지출: 대가 없이 주는 돈. GDP에 안 들어갑니다.","alt":"## GDP 정의 한 줄\n**일정 기간 / 한 나라 안에서 / 새로 생산된 / 최종생산물의 / 시장가치**\n\n> 🚨 이 다섯 조각이 각각 문제로 나옴. 조각별로 뭐가 빠지는지 보면 됨.\n\n- **일정 기간** → 유량임. 재산(저량) 아님\n- **한 나라 안에서** → **속지주의.** 외국인이 한국에서 번 것 **포함**, 한국인이 미국에서 번 건 **제외**\n- **새로 생산된** → 중고 거래 **제외**. 근데 중개수수료는 포함 (그건 새로 제공한 서비스니까)\n- **최종생산물** → 중간재 제외 (이중계산 방지)\n- **시장가치** → 가사노동, 봉사활동 제외\n\n> 🚨 자주 나오는 제외 목록\n> 주부 가사노동 / 중고차 거래액 / 주식 매매차익 / **이전지출(실업급여, 연금)**\n>\n> 🚨 근데 포함되는 예외도 있음\n> **자가주택 귀속임대료** (내 집에 내가 살아도 임대료 낸 셈 치고 계산함)\n> 농가 자가소비 농산물 / 국방·치안 같은 정부 서비스\n\n## GDP vs GNI\n- **GDP** = 국내에서 생산 (속지)\n- **GNI** = 우리 국민이 번 소득 (속인)\n- GNI = GDP + 국외순수취요소소득\n\n## 명목 vs 실질\n- 명목: 그해 가격. 물가 뻥튀기 섞임\n- 실질: 기준연도 가격. 진짜 생산량\n\n> **GDP 디플레이터 = 명목 ÷ 실질 × 100**\n> 🚨 가장 포괄적인 물가지표임. 근데 **수입품은 안 들어감.** (국내 생산만 보니까)\n> CPI는 수입 소비재 포함. 이 대비 나옴.\n\n## 삼면등가\n생산 = 분배 = 지출. 어느 쪽으로 재도 같음.\n지출 쪽: **Y = C + I + G + (X − M)**\n\n## GDP 한계\n시장 밖 활동 못 잡음 / 분배 상태 모름 / 환경·여가 반영 안 됨 / 지하경제 빠짐\n\n▸ 유량: 기간으로 재는 것.\n▸ 저량: 시점으로 재는 것."},{"title":"② 물가와 인플레이션","sub":"거시경제","body":"## 물가지수\n- **소비자물가지수(CPI)**: 가계가 사는 대표 품목의 가격. **수입 소비재 포함**, 기준연도 수량으로 고정\n- **생산자물가지수(PPI)**: 기업 간 거래 단계의 물가\n- **GDP 디플레이터**: 국내 생산 전체. **수입품 제외**\n\n> CPI는 수량을 고정해두고 재기 때문에 소비자가 비싼 것을 싼 것으로 갈아타는 대체행위를 반영하지 못합니다. 그래서 **물가 상승을 과대평가**하는 경향이 있습니다.\n\n## 인플레이션의 원인\n### 수요견인 인플레이션\n총수요가 늘어 생기는 것입니다. AD곡선 우측 이동.\n> 물가 상승 + 생산 증가. 경기가 좋을 때 나타납니다.\n\n### 비용인상 인플레이션\n원자재값 급등, 임금 상승 등으로 총공급이 줄어 생기는 것입니다. AS곡선 좌측 이동.\n> 물가 상승 + 생산 감소. 이것이 **스태그플레이션**입니다.\n\n## 인플레이션의 비해\n- **구두창 비용**: 현금 보유를 줄이려고 은행을 자주 오가는 비용\n- **메뉴 비용**: 가격표를 바꾸는 비용\n- 조세 왜곡, 자원배분 왜곡\n\n## 예상된 인플레이션과 예상 못 한 인플레이션 (핵심)\n> 예상된 인플레이션은 이자율에 미리 반영되므로 부의 재분배가 크지 않습니다.\n> **예상하지 못한 인플레이션**이 문제입니다. 이때는 부가 이동합니다.\n> - **채무자에게 유리, 채권자에게 불리** (갚을 돈의 실질가치가 줄어드니까)\n> - 실물자산 보유자에게 유리, 현금·예금 보유자에게 불리\n> - 고정된 월급을 받는 사람에게 불리\n\n## 피셔 방정식\n> **명목이자율 = 실질이자율 + 예상인플레이션율**\n\n인플레이션이 예상되면 명목이자율이 그만큼 올라 실질이자율이 유지됩니다. 이를 **피셔 효과**라고 합니다.\n\n## 디플레이션\n물가가 지속적으로 하락하는 것입니다. 좋아 보이지만 위험합니다.\n소비를 미루게 되어 수요가 더 줄고, 실질 부채 부담이 커져 **부채 디플레이션**이 발생할 수 있습니다.\n\n▸ 스태그플레이션: 경기 침체와 물가 상승이 동시에 오는 것.\n▸ 실질이자율: 명목이자율에서 물가상승률을 뺀 것.\n▸ 디스인플레이션: 물가는 오르되 상승률이 낮아지는 것. 디플레이션과 다릅니다.","alt":"## 물가지수 3형제\n- **CPI**: 가계가 사는 것. **수입 소비재 포함**. 기준연도 수량으로 고정\n- **PPI**: 기업 간 거래 물가\n- **GDP 디플레이터**: 국내 생산 전체. **수입품 제외**\n\n> 🚨 CPI는 수량을 고정해두고 잼.\n> 삼겹살 비싸져서 사람들이 닭고기로 갈아탔는데, CPI는 여전히 삼겹살을 원래 양만큼 산다고 계산함.\n> 그래서 **물가 상승을 과대평가**함. 이거 나옴.\n\n## 인플레이션 2종류\n### 수요견인\n총수요 증가 → AD 우측\n> 물가 ↑ + **생산 ↑**. 경기 좋을 때.\n\n### 비용인상\n원자재값·임금 급등 → AS 좌측\n> 물가 ↑ + **생산 ↓** = **스태그플레이션**\n\n> 🚨 방향으로 구분하면 됨. 물가랑 생산이 **같이 오르면 수요견인**, **반대로 가면 비용인상**.\n\n## 인플레 비용\n- **구두창 비용**: 현금 안 들고 다니려고 은행 자주 감 (구두 밑창 닳음)\n- **메뉴 비용**: 가격표 바꾸는 비용\n\n## 예상 vs 예상 못 함 ⭐ (제일 중요)\n> 예상된 인플레는 이자율에 미리 반영돼서 별 문제 없음.\n> **예상 못 한 인플레**가 진짜 문제임. 부가 이동함.\n\n> 🚨 **채무자 유리 / 채권자 불리**\n> 1억 빌렸는데 물가가 두 배 됨 → 갚을 1억의 실질 가치가 반토막 → 빌린 놈이 개이득\n> 실물자산 보유자 유리 / 현금·예금 보유자 불리\n> 고정 월급쟁이 불리\n\n## 피셔 방정식\n> **명목이자율 = 실질이자율 + 예상인플레이션율**\n\n인플레 예상되면 명목이자율이 그만큼 올라감 → 실질이자율은 유지. 이게 **피셔 효과**.\n\n## 디플레이션\n물가가 계속 떨어짐. 좋아 보이는데 위험함.\n> 어차피 내일 더 싸질 텐데 왜 지금 삼? → 소비 미룸 → 수요 더 줄어듦 → 악순환\n> 게다가 빚의 실질 부담은 커짐. 이게 **부채 디플레이션**.\n\n▸ 디스인플레이션: 물가는 오르는데 **상승률**이 낮아지는 것. 디플레이션이랑 다름. 헷갈리게 냄."},{"title":"③ 실업","sub":"거시경제","body":"## 인구 분류부터\n계산 문제가 여기서 나옵니다. 순서를 정확히 기억해야 합니다.\n\n- **15세 이상 인구** = 경제활동인구 + 비경제활동인구\n- **경제활동인구** = 취업자 + 실업자\n- **비경제활동인구**: 학생, 전업주부, 구직 단념자, 은퇴자\n\n> **실업률 = 실업자 ÷ 경제활동인구 × 100**\n> **고용률 = 취업자 ÷ 15세 이상 인구 × 100**\n\n> 실업률의 분모는 **경제활동인구**입니다. 15세 이상 인구가 아닙니다. 이걸 틀리게 하려고 문제를 만듭니다.\n\n## 실업자의 요건\n조사 기간에 일을 하지 않았고, **적극적으로 구직활동**을 했으며, 일이 주어지면 즉시 취업할 수 있어야 합니다.\n> 구직을 포기한 사람은 실업자가 아니라 **비경제활동인구**로 빠집니다. 그래서 구직 단념자가 늘면 실업률이 오히려 **떨어지는** 착시가 생깁니다. 이 논점이 자주 나옵니다.\n> 이 때문에 고용률을 함께 보는 것이 실제 고용 사정을 파악하는 데 낫습니다.\n\n## 실업의 종류\n- **마찰적 실업**: 더 나은 일자리를 찾는 과정에서 생기는 일시적 실업. 불가피하고 어느 정도는 바람직함\n- **구조적 실업**: 산업구조 변화로 기술이 맞지 않아 생기는 실업. 장기화되기 쉬움\n- **경기적 실업**: 경기 침체로 총수요가 부족해 생기는 실업\n- 계절적 실업\n\n> **자연실업률 = 마찰적 실업 + 구조적 실업**입니다. 경기적 실업은 포함되지 않습니다.\n> 완전고용은 실업률 0이 아니라 **경기적 실업이 없는 상태**, 즉 자연실업률 수준입니다. 이 함정이 자주 나옵니다.\n\n## 실업 대책\n- 마찰적 실업: 고용 정보 제공, 직업 알선\n- 구조적 실업: 직업 재훈련, 교육\n- 경기적 실업: 총수요 확대 정책\n\n> 실업의 종류에 따라 대책이 다릅니다. 경기적 실업에 재훈련을 처방하는 식의 오답이 나옵니다.\n\n## 오쿤의 법칙\n실질GDP 증가율과 실업률 변화는 음의 관계에 있습니다. 경제가 성장하면 실업률이 낮아집니다.\n\n▸ 구직 단념자: 일자리를 찾다 포기한 사람. 실업자에 안 들어갑니다.\n▸ 자연실업률: 경제가 정상 상태일 때의 실업률.\n▸ 완전고용: 경기적 실업이 없는 상태.","alt":"## 인구 분류 (계산문제 여기서 나옴) ⭐\n> **15세 이상 인구 = 경제활동인구 + 비경제활동인구**\n> **경제활동인구 = 취업자 + 실업자**\n\n비경제활동인구: 학생, 전업주부, **구직 단념자**, 은퇴자\n\n> 🚨 **실업률 = 실업자 ÷ 경제활동인구**\n> **고용률 = 취업자 ÷ 15세 이상 인구**\n>\n> 분모가 다름. 실업률 분모는 **경제활동인구**임. 15세 이상 인구로 나누면 틀림.\n> 이거 틀리라고 문제 냄. 무조건 분모 확인.\n\n### 계산 예시\n15세 이상 2000만, 비경제활동 800만, 취업자 1080만\n→ 경제활동 = 2000 - 800 = **1200만**\n→ 실업자 = 1200 - 1080 = **120만**\n→ 실업률 = 120/1200 = **10%**\n\n## 실업자 요건\n일 안 했고 + **적극적으로 구직활동** 했고 + 일 주면 바로 할 수 있음\n\n> 🚨 여기가 함정임\n> 구직 **포기**하면 실업자 아님. **비경제활동인구**로 빠짐.\n> → 그럼 분자(실업자)랑 분모(경제활동인구)가 같이 줄어듦\n> → **실업률이 오히려 떨어짐**\n>\n> 경기가 최악이라 다들 취업을 포기했는데 실업률은 좋아 보이는 착시. 그래서 고용률을 같이 봐야 함.\n\n## 실업 종류\n- **마찰적**: 더 좋은 데 찾느라 생김. 어쩔 수 없고 어느 정도는 좋은 거임\n- **구조적**: 산업이 바뀌어 기술이 안 맞음. 오래감\n- **경기적**: 불황이라 일자리 자체가 없음\n\n> 🚨 **자연실업률 = 마찰적 + 구조적.** 경기적은 **안** 들어감.\n> **완전고용 = 실업률 0이 아님.** 경기적 실업만 없는 상태 = 자연실업률 수준.\n> \"완전고용은 실업률이 0인 상태\" → **오답.** 진짜 자주 나옴.\n\n## 대책 매칭\n- 마찰적 → 고용 정보 제공\n- 구조적 → **재훈련·교육**\n- 경기적 → **총수요 확대**\n\n> 🚨 경기적 실업에 재훈련 처방하는 식으로 짝을 바꿔서 냄.\n\n## 오쿤의 법칙\n성장률 ↑ → 실업률 ↓. 음의 관계."},{"title":"④ 소비·투자와 승수","sub":"거시경제","body":"## 케인즈 소비함수\n> **C = a + bY**\n- a: 기초소비. 소득이 0이어도 하는 소비\n- b: **한계소비성향(MPC)**. 소득이 1원 늘 때 소비가 늘어나는 정도. 0과 1 사이\n\n관련 개념도 같이 봅니다.\n- **평균소비성향(APC) = C ÷ Y**. 소득이 늘수록 APC는 감소합니다\n- **MPC + MPS = 1** (소비하지 않으면 저축하므로)\n\n## 다른 소비이론\n- **항상소득가설(프리드먼)**: 사람은 일시소득이 아니라 **항상소득**에 맞춰 소비합니다. 그래서 일회성 보너스나 임시 감세는 소비를 크게 늘리지 못합니다\n- **생애주기가설(모딜리아니)**: 일생 전체 소득을 고려해 소비를 평탄하게 유지합니다\n\n> 이 가설들의 시사점은 같습니다. **단기적 소득 변화는 소비에 큰 영향을 주지 못한다**는 것이며, 이는 재정정책의 효과를 약화시킵니다.\n\n## 투자\n투자는 이자율의 감소함수입니다. 이자율이 낮을수록 투자가 늘어납니다.\n- **현재가치법**: 투자로 얻을 미래수익의 현재가치가 비용보다 크면 투자\n- **내부수익률법**: 투자의 한계효율이 이자율보다 크면 투자\n\n## 승수효과\n정부가 100억을 쓰면 누군가의 소득이 되고, 그 사람이 일부를 소비하면 또 누군가의 소득이 됩니다. 이 연쇄가 반복되면서 최초 지출보다 큰 효과가 납니다.\n\n> **정부지출승수 = 1 ÷ (1 − MPC)**\n> **조세승수 = −MPC ÷ (1 − MPC)**\n\nMPC가 0.8이면 정부지출승수는 1 ÷ 0.2 = **5**입니다. 10조를 쓰면 국민소득이 50조 늘어납니다.\n\n> 조세승수의 절댓값이 정부지출승수보다 **작습니다.** 감세를 하면 그 돈의 일부는 저축되기 때문에 처음부터 전액이 지출되는 정부지출보다 효과가 작습니다. 이 비교가 시험에 나옵니다.\n\n## 균형재정승수\n정부지출과 조세를 같은 금액만큼 늘리면 어떻게 될까요.\n> 두 승수를 더하면 **1**이 됩니다. 즉 국민소득이 그 금액만큼 늘어납니다. 세금을 걷어 그대로 쓰기만 해도 소득이 늘어난다는 결론입니다.\n\n▸ 한계소비성향: 추가 소득 중 소비하는 비율.\n▸ 항상소득: 장기적으로 기대되는 평균적 소득.\n▸ 승수: 최초 지출이 몇 배의 소득 증가를 낳는지 나타내는 값.","alt":"## 케인즈 소비함수\n> **C = a + bY**\n- a = 기초소비 (소득 0이어도 먹고는 살아야 하니까)\n- b = **한계소비성향(MPC)**. 1원 더 벌면 얼마 쓰냐. 0~1 사이\n\n- **APC = C/Y**. 소득 늘수록 감소\n- **MPC + MPS = 1** (쓰거나 모으거나 둘 중 하나)\n\n## 다른 소비이론\n- **항상소득가설(프리드먼)**: 사람은 **항상소득**에 맞춰 씀. 일회성 보너스는 잘 안 씀\n- **생애주기가설(모딜리아니)**: 평생 소득 생각해서 평탄하게 씀\n\n> 🚨 둘 다 시사점이 같음.\n> **단기 소득 변화는 소비를 별로 못 늘림** → 그래서 **재정정책 효과가 약함**\n> 재난지원금 줘도 저축해버리는 게 이거임.\n\n## 투자\n이자율의 **감소함수**. 이자율 낮으면 투자 늘어남.\n- 현재가치법: 미래수익 현재가치 > 비용이면 투자\n- 내부수익률법: 투자의 한계효율 > 이자율이면 투자\n\n## 승수효과 ⭐\n정부가 100억 씀 → 누군가 소득 됨 → 그중 80억 소비 → 또 누군가 소득 → 64억 소비 → ...\n연쇄가 돌면서 최초 지출보다 훨씬 큰 효과 남.\n\n> **정부지출승수 = 1 ÷ (1 − MPC)**\n> **조세승수 = −MPC ÷ (1 − MPC)**\n\nMPC 0.8이면 → 1/0.2 = **5배**. 10조 쓰면 50조 늘어남.\n\n> 🚨 **조세승수 절댓값 < 정부지출승수**\n> 왜? 정부지출 100억은 **전액이 바로 지출**됨.\n> 근데 감세 100억은 그중 80억만 쓰고 20억은 저축함. 시작부터 손해 보고 들어감.\n> 그래서 감세보다 정부지출이 효과가 큼. 이 비교 나옴.\n\n## 균형재정승수\n세금 100억 더 걷고 100억 더 씀. 결과는?\n> 🚨 두 승수 더하면 **1**임.\n> 즉 국민소득이 **100억 늘어남.** 세금 걷어서 그대로 쓰기만 해도 소득이 늘어남.\n> 직관에 반해서 문제로 자주 나옴.\n\n▸ 항상소득: 장기적으로 기대되는 평균 소득."},{"title":"⑤ 화폐와 금융","sub":"거시경제","body":"## 화폐의 기능 세 가지\n- **교환의 매개수단**: 물물교환의 불편을 없앰. 가장 본질적인 기능\n- **가치의 척도**: 가치를 재는 단위\n- **가치의 저장수단**: 부를 보관\n\n> 생산의 원천이나 소득 재분배 기능은 화폐의 기능이 아닙니다. 선택지에 껴 나옵니다.\n\n## 통화지표\n좁은 것에서 넓은 것 순으로 커집니다.\n- **M1 (협의통화)** = 현금통화 + 요구불예금 + 수시입출식 저축성예금\n- **M2 (광의통화)** = M1 + 2년 미만 정기예적금, 시장형 상품, 실적배당형 상품 등\n- Lf (금융기관유동성), L (광의유동성)\n\n> 기준은 **유동성**입니다. 얼마나 쉽게 현금이 되느냐입니다.\n\n## 본원통화와 신용창조\n중앙은행이 찍어낸 돈이 **본원통화**입니다. 이 돈이 은행을 거치며 몇 배로 불어납니다.\n\n은행은 예금 중 일부만 남기고 대출합니다. 대출된 돈이 다시 예금되고 또 대출됩니다. 이것이 **신용창조**입니다.\n\n> **통화승수 = 1 ÷ 지급준비율** (현금 보유와 초과지준이 없다고 가정)\n> 지급준비율이 10%이고 본원통화가 100억이면 통화량은 최대 1,000억이 됩니다.\n\n현실에서는 사람들이 현금을 들고 다니고 은행도 초과지준을 쌓기 때문에 실제 승수는 이보다 작습니다.\n\n## 화폐 공급 조절 수단\n- **공개시장운영**: 국채를 사고팔아 통화량 조절. 가장 많이 쓰이는 수단\n- **지급준비율 조작**: 강력하지만 자주 쓰지 않음\n- **재할인율 조작**\n\n> 중앙은행이 국채를 **매입**하면 시중에 돈이 풀려 통화량이 증가하고 이자율이 하락합니다. 매각하면 반대입니다.\n\n## 화폐수요\n케인즈는 세 가지 동기를 들었습니다.\n- **거래적 동기**: 소득의 증가함수\n- **예비적 동기**: 소득의 증가함수\n- **투기적 동기**: 이자율의 **감소함수**\n\n> 이자율이 높으면 현금을 들고 있는 기회비용이 커지므로 채권을 삽니다. 그래서 화폐수요가 줄어듭니다.\n\n## 유동성 함정\n이자율이 극도로 낮으면 화폐수요가 무한탄력적이 됩니다. 통화를 아무리 풀어도 이자율이 더 내려가지 않습니다.\n> 이때는 **통화정책이 무력**하고 **재정정책이 효과적**입니다.\n\n▸ 지급준비율: 예금 중 은행이 반드시 남겨둬야 하는 비율.\n▸ 유동성: 현금으로 바꾸기 쉬운 정도.\n▸ 공개시장운영: 중앙은행이 채권을 매매해 통화량을 조절하는 것.","alt":"## 화폐 기능 3개\n- **교환의 매개** (제일 본질적)\n- **가치의 척도**\n- **가치의 저장**\n\n> 🚨 \"생산의 원천\", \"소득 재분배\" 이런 게 껴 나오면 오답. 화폐 기능 아님.\n\n## 통화지표\n좁은 것 → 넓은 것 순.\n- **M1** = 현금 + 요구불예금 + 수시입출식 저축\n- **M2** = M1 + 2년 미만 정기예적금 등\n- Lf, L\n\n> 기준은 **유동성**임. 현금으로 바꾸기 쉬운 순서.\n\n## 신용창조 ⭐\n중앙은행이 찍은 돈 = **본원통화**. 이게 은행 거치면서 뻥튀기됨.\n\n100억 예금 → 은행이 10억 남기고 90억 대출 → 그 90억이 또 예금 → 81억 대출 → ...\n이게 **신용창조**임. 없던 돈이 생겨남.\n\n> **통화승수 = 1 ÷ 지급준비율**\n> 지준율 10%, 본원통화 100억 → 통화량 최대 **1000억**\n\n> 🚨 근데 현실에선 이만큼 안 됨. 사람들이 현금 들고 다니고 은행도 여유분 쌓아둠. 실제 승수는 더 작음.\n\n## 통화 조절 수단\n- **공개시장운영** (제일 많이 씀)\n- 지급준비율 조작 (세지만 잘 안 씀)\n- 재할인율 조작\n\n> 🚨 방향 헷갈리지 마셈\n> 중앙은행이 국채 **매입** → 돈 풀림 → 통화량 ↑ → 이자율 ↓\n> 국채 **매각** → 돈 거둬들임 → 통화량 ↓ → 이자율 ↑\n> 채권을 사면 돈을 주는 거니까 시중에 돈이 풀리는 거임.\n\n## 화폐수요 3동기\n- 거래적 → **소득**의 증가함수\n- 예비적 → **소득**의 증가함수\n- **투기적 → 이자율의 감소함수** ⭐\n\n> 이자율 높으면 현금 들고 있는 게 손해임(그 돈으로 채권 사면 이자 받는데). 그래서 화폐수요 줄어듦.\n\n## 유동성 함정\n이자율이 바닥임. 돈을 아무리 풀어도 이자율이 더 안 내려감.\n> 🚨 이때는 **통화정책 무력 / 재정정책 효과적.**\n> 돈을 풀어도 다들 그냥 들고만 있어서 아무 일도 안 일어남. 그럴 땐 정부가 직접 써야 함.\n\n▸ 지급준비율: 예금 중 은행이 남겨둬야 하는 비율."},{"title":"⑥ IS-LM 모형","sub":"거시경제","body":"## 무엇을 보는 모형인가\n생산물시장과 화폐시장을 동시에 균형시키는 **이자율과 국민소득**의 조합을 찾는 모형입니다.\n가로축은 국민소득(Y), 세로축은 이자율(r)입니다.\n\n## IS곡선\n**생산물시장**의 균형을 나타냅니다. 우하향합니다.\n> 이자율이 내려가면 투자가 늘고, 투자가 늘면 국민소득이 늘어납니다. 그래서 r과 Y가 반대로 움직입니다.\n\n### IS곡선을 우측으로 이동시키는 요인\n- 정부지출 증가\n- 조세 감소\n- 독립투자·독립소비 증가\n- 수출 증가\n\n### 기울기\n투자가 이자율에 민감할수록(투자의 이자율탄력성이 클수록) IS곡선이 **완만**해집니다.\n\n## LM곡선\n**화폐시장**의 균형을 나타냅니다. 우상향합니다.\n> 국민소득이 늘면 거래적 화폐수요가 늘고, 통화량이 고정되어 있으면 이자율이 올라갑니다.\n\n### LM곡선을 우측으로 이동시키는 요인\n- **통화량 증가**\n- 물가 하락 (실질통화량이 늘어나므로)\n- 화폐수요 감소\n\n> 정부지출은 IS를, 통화량은 LM을 움직입니다. 이 짝을 바꿔 내는 문제가 많습니다.\n\n## 정책 효과\n### 확장적 재정정책 (정부지출 증가)\nIS 우측 이동 → 국민소득 증가, **이자율 상승**\n> 이자율이 오르면 민간투자가 줄어듭니다. 이것이 **구축효과**입니다. 구축효과 때문에 재정정책의 효과가 깎입니다.\n\n### 확장적 통화정책 (통화량 증가)\nLM 우측 이동 → 국민소득 증가, **이자율 하락**\n\n## 정책 유효성 비교 (핵심)\n> **재정정책이 강력한 경우**: LM곡선이 완만할 때, 유동성 함정일 때, 투자가 이자율에 둔감할 때\n> **통화정책이 강력한 경우**: LM곡선이 가파를 때, 투자가 이자율에 민감할 때\n\n논리는 하나입니다. 구축효과가 작으면 재정정책이 잘 듣고, 이자율 변화가 투자를 많이 움직이면 통화정책이 잘 듣습니다.\n\n▸ 구축효과: 정부지출이 이자율을 올려 민간투자를 밀어내는 현상.\n▸ 실질통화량: 명목통화량을 물가로 나눈 것.\n▸ 정책혼합: 재정정책과 통화정책을 함께 쓰는 것.","alt":"## 뭘 보는 모형이냐\n생산물시장 + 화폐시장을 동시에 균형시키는 **이자율(r)과 소득(Y)** 조합 찾기.\n가로축 Y, 세로축 r.\n\n## IS곡선 = 생산물시장, 우하향\n> 이자율 ↓ → 투자 ↑ → 소득 ↑\n> 그래서 r이랑 Y가 반대로 감. 우하향.\n\n### 우측 이동 요인\n**정부지출 ↑ / 조세 ↓ / 독립투자·소비 ↑ / 수출 ↑**\n\n### 기울기\n투자가 이자율에 민감할수록 → **완만**해짐\n\n## LM곡선 = 화폐시장, 우상향\n> 소득 ↑ → 거래하려고 돈이 더 필요함 → 통화량은 고정 → 이자율 ↑\n> 그래서 우상향.\n\n### 우측 이동 요인\n**통화량 ↑ / 물가 ↓ / 화폐수요 ↓**\n\n> 🚨 짝 바꿔서 냄. **정부지출 = IS / 통화량 = LM.**\n> \"통화량 증가는 IS곡선을 이동시킨다\" → 오답.\n\n## 정책 효과\n### 확장 재정 (정부지출 ↑)\nIS 우측 → 소득 ↑, **이자율 ↑**\n> 🚨 이자율 오르면 민간투자가 줄어듦 = **구축효과**\n> 정부가 민간을 밀어낸 거임. 그래서 효과가 깎임.\n\n### 확장 통화 (통화량 ↑)\nLM 우측 → 소득 ↑, **이자율 ↓**\n\n> 재정은 이자율 올리고, 통화는 이자율 내림. 방향이 반대임. 이거만 알아도 반은 맞음.\n\n## 어느 정책이 잘 드냐 ⭐\n> **재정정책이 강함**: LM 완만 / **유동성 함정** / 투자가 이자율에 둔감\n> **통화정책이 강함**: LM 가파름 / 투자가 이자율에 민감\n\n> 🚨 논리는 하나임.\n> **구축효과가 작으면** → 재정정책이 잘 듦\n> **이자율이 투자를 많이 움직이면** → 통화정책이 잘 듦\n> 이 두 문장으로 다 풀림. 외우지 말고 이해로 가셈.\n\n▸ 구축효과: 정부가 민간투자 밀어내는 현상."},{"title":"⑦ 총수요와 총공급","sub":"거시경제","body":"## AD곡선 (총수요)\n물가와 총수요량의 관계입니다. **우하향**합니다.\n> 미시의 수요곡선과 이유가 다릅니다. 물가가 내리면 실질통화량이 늘어 이자율이 떨어지고 투자가 증가합니다. 또 실질자산가치가 올라 소비가 늘고, 수출품이 상대적으로 싸져 순수출이 늘어납니다.\n> 이를 각각 이자율효과, 실질잔고효과(피구효과), 환율효과라고 합니다.\n\n### AD를 우측으로 이동시키는 요인\n- 소비, 투자, 정부지출, 순수출 증가\n- 통화량 증가\n\n## AS곡선 (총공급)\n### 단기 총공급\n**우상향**합니다. 물가가 오르는데 명목임금은 당장 안 오르므로 실질임금이 낮아져 기업이 고용과 생산을 늘립니다.\n\n### 장기 총공급\n**수직**입니다. 장기에는 임금과 물가가 모두 조정되므로 생산량이 물가와 무관해집니다.\n> 장기 총공급곡선이 서 있는 지점이 **잠재GDP** 또는 자연산출량입니다.\n\n### AS를 이동시키는 요인\n- 원자재 가격, 임금 (상승하면 좌측 이동)\n- 기술 진보, 노동·자본 증가 (우측 이동)\n\n## 균형의 변화 (표로 정리)\n| 충격 | 물가 | 생산 |\n|---|---|---|\n| AD 증가 | 상승 | 증가 |\n| AD 감소 | 하락 | 감소 |\n| AS 감소 | **상승** | **감소** |\n| AS 증가 | 하락 | 증가 |\n\n> **AS 감소가 스태그플레이션**입니다. 물가는 오르는데 생산은 줄어드는 가장 골치 아픈 상황입니다.\n> 이때는 총수요를 늘리면 물가가 더 오르고, 물가를 잡으려 하면 생산이 더 줄어듭니다. 정책으로 양쪽을 동시에 해결할 수 없습니다.\n\n## 학파별 시각\n### 고전학파\n가격이 신축적이므로 AS는 항상 수직입니다. 총수요 정책은 물가만 올릴 뿐 생산에 영향이 없습니다. **화폐의 중립성**이 성립합니다.\n공급이 스스로 수요를 창출한다는 **세이의 법칙**을 전제합니다.\n\n### 케인즈학파\n가격과 임금이 경직적이므로 단기 AS가 완만하거나 수평입니다. 따라서 **총수요 관리 정책이 유효**합니다.\n대공황처럼 수요가 부족한 상황에서는 정부가 개입해야 한다고 봅니다.\n\n> 두 학파의 차이는 결국 **가격이 얼마나 빨리 조정되는가**로 귀결됩니다. 이 한 문장으로 대부분의 학파 비교 문제가 풀립니다.\n\n▸ 잠재GDP: 물가 상승 없이 달성할 수 있는 최대 생산량.\n▸ 화폐의 중립성: 통화량 변화가 실물변수에 영향을 주지 않는다는 것.\n▸ 경직성: 가격이나 임금이 잘 안 바뀌는 성질.","alt":"## AD곡선 (총수요), 우하향\n> 🚨 미시 수요곡선이랑 우하향 이유가 다름. 이거 물어봄.\n> 물가 ↓ → 실질통화량 ↑ → 이자율 ↓ → 투자 ↑ (**이자율효과**)\n> 물가 ↓ → 내 자산 실질가치 ↑ → 소비 ↑ (**피구효과**)\n> 물가 ↓ → 수출품 싸짐 → 순수출 ↑ (**환율효과**)\n\n우측 이동: C, I, G, 순수출 ↑ / 통화량 ↑\n\n## AS곡선 (총공급)\n### 단기 = 우상향\n물가는 오르는데 월급은 당장 안 오름 → 기업 입장에서 실질임금이 싸짐 → 더 고용하고 더 생산함.\n\n### 장기 = **수직**\n장기엔 월급도 다 올라감 → 물가랑 상관없이 생산량 고정.\n> 이 수직선이 서 있는 지점이 **잠재GDP**임.\n\n이동 요인: 원자재값·임금 ↑ → 좌측 / 기술 진보 → 우측\n\n## 균형 변화표 ⭐\n| 충격 | 물가 | 생산 |\n|---|---|---|\n| AD ↑ | ↑ | ↑ |\n| AD ↓ | ↓ | ↓ |\n| **AS ↓** | **↑** | **↓** |\n| AS ↑ | ↓ | ↑ |\n\n> 🚨 **AS 감소 = 스태그플레이션.**\n> 물가는 오르는데 생산은 줄어듦. 최악임.\n> 수요를 늘리면? 물가가 더 오름. 물가를 잡으면? 생산이 더 줄어듦.\n> **정책으로 둘 다 못 잡음.** 이게 스태그플레이션이 무서운 이유고 시험 포인트임.\n\n## 학파 비교 ⭐\n### 고전학파\n가격이 슉슉 조정됨 → AS 항상 **수직** → 총수요 정책은 **물가만 올림**\n**화폐 중립성** 성립. **세이의 법칙**(공급이 수요를 창출) 전제.\n\n### 케인즈학파\n가격·임금이 뻑뻑함(경직적) → 단기 AS 완만 → **총수요 정책 유효**\n대공황 때는 정부가 나서야 함.\n\n> 🚨 학파 문제는 이 한 줄로 다 풀림.\n> **\"가격이 얼마나 빨리 조정되냐\"**\n> 빨리 조정된다 = 고전학파 = 정부 개입 무용\n> 느리게 조정된다 = 케인즈 = 정부 개입 필요\n> 이거 하나만 잡고 있으면 처음 보는 학파 문제도 찍을 수 있음.\n\n▸ 잠재GDP: 물가 안 올리고 낼 수 있는 최대 생산.\n▸ 경직성: 가격·임금이 잘 안 바뀌는 성질."},{"title":"⑧ 필립스곡선과 정책 논쟁","sub":"거시경제","body":"## 단기 필립스곡선\n인플레이션율과 실업률의 **상충관계**를 보여줍니다. 우하향합니다.\n> 실업을 줄이려면 인플레이션을 감수해야 하고, 물가를 잡으려면 실업을 감수해야 합니다.\n\n이는 AD-AS 모형과 연결됩니다. 총수요를 늘리면 생산이 늘어 실업이 줄지만 물가가 오릅니다. 같은 이야기를 다른 축으로 그린 것입니다.\n\n## 장기 필립스곡선\n**수직**입니다. **자연실업률** 수준에서 서 있습니다.\n> 장기에는 사람들이 인플레이션을 예상하고 임금 인상을 요구합니다. 그러면 실질임금이 원래대로 돌아가 고용도 원래대로 돌아갑니다. 결국 물가만 오르고 실업률은 자연실업률로 복귀합니다.\n\n이를 **자연실업률 가설**이라고 합니다. 프리드먼과 펠프스가 주장했습니다.\n\n## 기대의 종류\n- **적응적 기대**: 과거 경험을 보고 예상을 조정합니다. 단기에는 정부가 사람들을 속일 수 있으므로 **단기 정책 효과가 있습니다**\n- **합리적 기대**: 이용 가능한 모든 정보를 활용해 예상합니다. 예상된 정책은 즉시 반영되므로 **단기에도 효과가 없습니다**\n\n> 합리적 기대를 전제하면 **예상된 정책은 무력**하고 **예상하지 못한 정책만** 실물에 영향을 줍니다. 이를 정책무력성 명제라고 합니다.\n\n## 스태그플레이션과 필립스곡선\n1970년대에 물가와 실업이 함께 오르는 일이 벌어졌습니다. 기존 필립스곡선으로는 설명이 안 됐습니다.\n> 이는 필립스곡선 자체가 **위로 이동**한 것으로 설명됩니다. 기대인플레이션이 높아지면 같은 실업률에서도 더 높은 인플레이션이 나타납니다.\n\n## 희생률\n인플레이션을 1%p 낮추기 위해 감수해야 하는 실업률 증가나 생산 감소의 크기입니다.\n> 합리적 기대가 성립하고 정책이 **신뢰**받는다면 희생률 없이 물가를 잡을 수 있습니다. 사람들이 즉시 기대를 낮추기 때문입니다. 그래서 중앙은행의 **신뢰성**이 중요합니다.\n\n## 준칙과 재량\n- **재량**: 상황에 맞게 그때그때 정책을 결정\n- **준칙**: 미리 정해둔 규칙대로 (예: 통화량을 매년 k% 증가)\n\n> 재량에는 **시간 비일관성** 문제가 있습니다. 처음에는 물가를 잡겠다고 해놓고 나중에 실업이 늘면 말을 바꾸고 싶어집니다. 사람들이 이를 알면 애초에 정부 말을 믿지 않습니다. 그래서 준칙이 낫다는 주장이 나옵니다.\n\n▸ 자연실업률: 마찰적·구조적 실업만 있는 상태의 실업률.\n▸ 시간 비일관성: 사전에 최적이던 정책이 사후에는 최적이 아니게 되는 문제.\n▸ 희생률: 물가를 잡는 데 드는 실물 비용.","alt":"## 단기 필립스곡선\n**인플레이션 ↔ 실업률 상충관계.** 우하향.\n> 실업 줄이려면 물가 오르는 거 감수해야 하고, 물가 잡으려면 실업 감수해야 함.\n\nAD-AS랑 같은 얘기임. 총수요 늘리면 생산 ↑(실업 ↓) + 물가 ↑. 축만 바꿔 그린 거.\n\n## 장기 필립스곡선 = **수직** ⭐\n**자연실업률**에서 서 있음.\n\n> 🚨 왜 수직이 되냐면\n> 정부가 돈 풀어서 물가 올림 → 실질임금 싸짐 → 기업이 고용 늘림 → 실업 감소 (여기까진 단기)\n> 근데 노동자들이 바보가 아님. \"물가 올랐네?\" 하고 **임금 인상 요구**함\n> → 실질임금 원상복구 → 고용도 원상복구 → **물가만 올랐고 실업률은 그대로**\n>\n> 이게 **자연실업률 가설**임. 프리드먼·펠프스.\n\n## 기대의 종류 ⭐\n- **적응적 기대**: 과거 보고 조정. 그래서 **단기엔 속일 수 있음** → 단기 정책 효과 O\n- **합리적 기대**: 모든 정보 다 활용. **단기에도 못 속임** → 정책 효과 X\n\n> 🚨 합리적 기대면 **예상된 정책은 무력**함. **예상 못 한 정책만** 먹힘.\n> 이게 정책무력성 명제. \"정부가 뭘 하겠다고 발표하는 순간 효과가 사라진다\"는 논리임.\n\n## 1970년대 스태그플레이션\n물가랑 실업이 **같이** 올라감. 기존 필립스곡선으로 설명 불가.\n> 🚨 답: 곡선 자체가 **위로 이동**한 거임.\n> 기대인플레이션이 높아지면 같은 실업률에서도 물가가 더 높아짐.\n\n## 희생률\n물가 1%p 낮추려면 실업을 얼마나 감수해야 하나.\n> 🚨 근데 정책이 **신뢰**받으면 희생률이 확 줄어듦.\n> 중앙은행이 \"물가 잡겠다\" 했을 때 사람들이 믿으면 → 즉시 기대를 낮춤 → 실업 안 늘고도 물가 잡힘.\n> 그래서 **중앙은행 신뢰성**이 중요하다는 결론이 나옴.\n\n## 준칙 vs 재량\n- 재량: 상황 봐서 그때그때\n- 준칙: 미리 정한 규칙대로\n\n> 🚨 재량의 문제 = **시간 비일관성**\n> 처음엔 \"물가 잡겠다\" 해놓고, 막상 실업 늘면 말 바꾸고 싶어짐.\n> 사람들이 이걸 아니까 애초에 안 믿음 → 정책이 안 먹힘\n> 그래서 차라리 손발 묶어놓는 **준칙이 낫다**는 주장이 나옴.\n\n▸ 시간 비일관성: 미리 최적이던 게 나중엔 최적이 아니게 되는 문제."},{"title":"⑨ 개방경제와 환율","sub":"거시경제","body":"## 환율의 표시\n우리나라는 **자국통화표시법**을 씁니다. 1달러 = 1,300원처럼 씁니다.\n> 환율이 **상승**하면 원화 가치는 **하락**입니다. 이 방향을 반대로 생각하면 문제를 전부 틀립니다.\n> 환율 상승 = 원화 절하 = 평가절하\n\n## 환율 변동의 효과\n| | 환율 상승(원화 약세) | 환율 하락(원화 강세) |\n|---|---|---|\n| 수출 | 증가 | 감소 |\n| 수입 | 감소 | 증가 |\n| 경상수지 | 개선 | 악화 |\n| 국내 물가 | 상승 압력 | 하락 압력 |\n| 외채 부담 | 증가 | 감소 |\n\n> 원화가 싸지면 우리 물건이 외국에서 싸 보여 잘 팔립니다. 대신 수입품 값이 올라 국내 물가를 밀어 올립니다.\n\n## J커브 효과\n환율이 올라도 경상수지가 **처음에는 오히려 나빠졌다가** 시간이 지나야 개선됩니다.\n> 계약이 이미 되어 있어 물량은 당장 안 변하는데 가격만 먼저 반영되기 때문입니다. 그래프가 J자를 그려서 붙은 이름입니다.\n\n## 환율 결정 이론\n- **구매력평가설(PPP)**: 같은 물건은 어디서나 같은 값이어야 한다는 일물일가의 법칙에서 출발합니다. 환율은 **양국 물가수준의 비율**로 결정됩니다. 장기 설명에 적합합니다\n- **이자율평가설**: 환율은 **양국 이자율 차이**로 결정됩니다. 단기 설명에 적합합니다\n\n## 국제수지\n- **경상수지**: 상품수지, 서비스수지, 본원소득수지, 이전소득수지\n- **금융계정**: 직접투자, 증권투자, 파생금융상품, 기타투자, 준비자산\n- 자본수지\n\n> 직접투자와 증권투자는 경상수지가 아니라 **금융계정**입니다. 이걸 경상수지 구성 항목으로 껴 넣는 문제가 자주 나옵니다.\n\n## 먼델-플레밍 모형\n개방경제에서 자본이동이 자유로울 때 정책 효과가 환율제도에 따라 달라집니다.\n> - **변동환율제**: 재정정책 무력, **통화정책 유효**\n> - **고정환율제**: **재정정책 유효**, 통화정책 무력\n\n## 삼불원칙 (트릴레마)\n자유로운 자본이동, 고정환율, 독자적 통화정책. 이 셋 중 **동시에 두 개까지만** 가질 수 있습니다.\n\n▸ 평가절하: 자국 통화 가치가 떨어지는 것.\n▸ 일물일가의 법칙: 같은 재화는 어디서나 같은 가격이어야 한다는 원리.\n▸ 준비자산: 외환보유액.","alt":"## 환율 방향부터 ⭐\n우리나라는 **1달러 = 1300원** 이렇게 씀.\n> 🚨 **환율 상승 = 원화 가치 하락** = 원화 약세 = 평가절하\n> 숫자가 올라가는데 가치는 떨어짐. 이거 반대로 생각하면 문제 다 틀림.\n> 1300원 주던 걸 1400원 줘야 함 → 원화가 더 많이 필요함 → 원화가 싸진 거임.\n\n## 환율 오르면 (원화 약세)\n| | 결과 |\n|---|---|\n| 수출 | **증가** |\n| 수입 | **감소** |\n| 경상수지 | 개선 |\n| 국내 물가 | **상승 압력** |\n| 외채 부담 | **증가** |\n\n> 우리 물건이 외국에서 싸 보임 → 잘 팔림\n> 근데 수입품 값은 오름 → 기름값 오르고 물가 밀어올림\n> 달러 빚 있으면? 갚을 원화가 더 필요해짐 → 부담 증가\n\n## J커브 효과\n> 🚨 환율 올랐는데 경상수지가 **처음엔 오히려 나빠짐.** 나중에 좋아짐.\n> 왜? 계약은 이미 되어 있어서 물량은 당장 안 변하는데 **가격만 먼저** 반영됨.\n> 그래프가 J자 모양이라 J커브. 이거 사례로 나옴.\n\n## 환율 결정 이론\n- **구매력평가설**: **물가 비율**로 결정. **장기** 설명용\n- **이자율평가설**: **이자율 차이**로 결정. **단기** 설명용\n\n> 빅맥지수가 구매력평가설 응용임.\n\n## 국제수지\n- **경상수지** = 상품 + 서비스 + 본원소득 + 이전소득\n- **금융계정** = 직접투자 + 증권투자 + 파생상품 + 기타 + 준비자산\n\n> 🚨 **직접투자·증권투자는 경상수지 아님. 금융계정임.**\n> 경상수지 구성항목 고르라고 하고 여기에 직접투자 껴놓음. 단골 함정.\n\n## 먼델-플레밍 ⭐\n자본이동 자유로울 때 정책 효과가 환율제도에 따라 뒤집힘.\n> **변동환율제 → 통화정책 유효 / 재정정책 무력**\n> **고정환율제 → 재정정책 유효 / 통화정책 무력**\n>\n> 정반대임. 그냥 외우는 게 빠름.\n\n## 삼불원칙 (트릴레마)\n**자본이동 자유 / 고정환율 / 독자적 통화정책**\n이 셋 중 **두 개까지만** 가능. 셋 다는 불가능.\n\n▸ 평가절하: 내 돈 가치 떨어짐."},{"title":"⑩ 경제성장","sub":"거시경제","body":"## 성장의 요인\n장기적으로 생산량을 늘리는 것은 세 가지입니다. 노동, 자본, **기술 진보**입니다.\n\n## 솔로우 성장모형\n### 기본 구조\n자본이 늘수록 생산이 늘지만 **수확체감**이 작용합니다. 자본이 이미 많으면 추가 자본의 효과가 작습니다.\n한편 자본은 감가상각으로 줄어듭니다.\n> 저축으로 새로 쌓이는 자본과 닳아 없어지는 자본이 같아지는 지점에서 멈춥니다. 이것이 **균제상태**입니다.\n\n### 핵심 결론\n> 균제상태에서는 **1인당 소득이 더 이상 늘지 않습니다.**\n> 저축률을 높이면 균제상태의 소득 수준은 올라가지만 **성장률은 다시 0으로 돌아갑니다.** 수준 효과는 있고 성장 효과는 없다는 뜻입니다.\n> 지속적인 성장을 낳는 것은 **기술 진보뿐**입니다.\n\n### 수렴가설\n자본이 적은 나라일수록 자본의 한계생산이 크므로 빠르게 성장합니다. 따라서 가난한 나라가 부자 나라를 따라잡습니다.\n> 다만 이는 저축률, 인구증가율, 기술 수준이 같을 때의 이야기입니다. 이를 **조건부 수렴**이라고 합니다. 현실에서 모든 나라가 수렴하지 않는 이유입니다.\n\n### 황금률\n소비를 극대화하는 자본량 수준입니다. 자본이 너무 많아도 감가상각에 다 들어가 소비할 것이 줄어듭니다.\n\n## 내생적 성장이론\n솔로우 모형에서 기술 진보는 밖에서 주어지는 것으로 취급됩니다. 왜 기술이 발전하는지는 설명하지 않습니다.\n> 내생적 성장이론은 기술 진보를 **모형 안에서** 설명합니다. 교육, 연구개발, 인적자본 축적이 성장을 낳는다고 봅니다.\n> 이 관점에서는 정부의 교육·R&D 투자가 장기 성장률을 높일 수 있습니다. 솔로우 모형과 결론이 다릅니다.\n\n## 성장회계\n경제성장률을 노동 기여분, 자본 기여분, 나머지로 나누는 작업입니다.\n> 설명되지 않고 남는 부분을 **총요소생산성** 또는 솔로우 잔차라고 합니다. 대체로 기술 진보로 해석합니다.\n\n▸ 균제상태: 1인당 자본과 소득이 일정하게 유지되는 상태.\n▸ 수확체감: 요소를 늘릴수록 추가 산출이 줄어드는 현상.\n▸ 총요소생산성: 노동과 자본으로 설명되지 않는 생산성 부분.","alt":"## 성장 요인 3개\n노동 / 자본 / **기술 진보**\n\n## 솔로우 모형 ⭐\n### 구조\n자본 늘리면 생산 늘어남. 근데 **수확체감**. 이미 자본 많으면 하나 더 넣어도 효과가 작음.\n한편 자본은 **감가상각**으로 계속 닳음.\n\n> 새로 쌓이는 자본 = 닳는 자본\n> 이 지점에서 멈춤. 이게 **균제상태**임.\n\n### 핵심 결론 (이게 시험 전부)\n> 🚨 **균제상태에선 1인당 소득이 더 안 늘어남.**\n> 저축률 높이면? 소득 **수준**은 올라감. 근데 **성장률은 다시 0**으로 돌아옴.\n> 즉 한 계단 올라설 뿐 계속 올라가지는 못함.\n>\n> **지속 성장을 만드는 건 기술 진보뿐임.** 이 문장이 결론.\n\n### 수렴가설\n가난한 나라는 자본이 적음 → 자본 한계생산이 큼 → 빨리 성장 → 따라잡음.\n> 🚨 근데 조건이 있음. 저축률·인구증가율·기술 수준이 **같아야** 함.\n> 이걸 **조건부 수렴**이라 함. 현실에서 다 안 따라잡히는 이유임.\n\n### 황금률\n소비를 최대로 만드는 자본량.\n> 자본이 너무 많아도 안 좋음. 감가상각에 다 들어가서 정작 쓸 게 없어짐.\n\n## 내생적 성장이론\n> 🚨 솔로우는 기술 진보를 **밖에서 뚝 떨어지는 것**으로 취급함. 왜 기술이 느는지 설명 안 함.\n> 내생적 성장이론은 그걸 **모형 안에서** 설명함. 교육, R&D, 인적자본이 성장을 만든다고 봄.\n>\n> 결론이 갈림. 솔로우는 \"정부가 뭘 해도 장기 성장률은 못 바꿈\", 내생적 성장론은 \"교육·R&D 투자로 바꿀 수 있음\".\n> 이 대비가 문제로 나옴.\n\n## 성장회계\n성장률을 노동 몫 / 자본 몫 / 나머지로 쪼갬.\n> 설명 안 되고 남는 부분 = **총요소생산성(솔로우 잔차)**. 보통 기술 진보로 해석함.\n\n▸ 균제상태: 1인당 자본·소득이 안 변하는 상태."},{"title":"① 경영학의 흐름","sub":"경영학","body":"## 고전적 관리론\n### 테일러의 과학적 관리법\n주먹구구로 하던 작업을 과학적으로 분석했습니다.\n- **시간연구와 동작연구**로 표준 작업량을 정함\n- **차별성과급**: 표준을 넘으면 높은 임률, 못 미치면 낮은 임률\n- 기능식 직장제도, 계획과 작업의 분리\n\n> 사람을 기계처럼 본다는 비판을 받습니다. 인간을 경제적 유인으로만 움직인다고 전제했기 때문입니다.\n\n### 포드 시스템\n컨베이어 벨트를 이용한 **이동조립법**입니다. 표준화, 단순화, 전문화를 통해 대량생산과 저가격을 실현했습니다.\n> 포드는 저가격·고임금을 주장했습니다. 봉사주의 경영이념이라고 부릅니다.\n\n### 페이욜의 일반관리론\n테일러가 작업 현장을 봤다면 페이욜은 **경영자의 관리 기능**을 봤습니다.\n관리 5요소는 계획, 조직, 지휘, 조정, 통제입니다.\n14가지 관리원칙 중 **명령일원화의 원칙**과 **분업의 원칙**이 자주 나옵니다.\n\n## 인간관계론\n### 호손실험\n조명 밝기를 바꿔가며 생산성을 측정했는데, 밝기와 무관하게 생산성이 올랐습니다.\n> 결론은 이랬습니다. **물리적 조건보다 관심받고 있다는 인식과 동료 관계가 생산성에 영향을 준다.**\n> 비공식 조직의 중요성이 여기서 드러났습니다.\n\n## 현대적 관점\n- **시스템 이론**: 조직을 투입-과정-산출-피드백의 열린 체계로 봄\n- **상황적합이론**: **최선의 방법은 없다.** 환경과 기술, 규모에 따라 적합한 조직이 다르다고 봄\n\n> 상황이론의 핵심 명제는 \"하나의 정답은 없다\"입니다. 고전이론이 유일 최선의 방법을 찾으려 한 것과 대비됩니다.\n\n## 맥그리거의 X이론과 Y이론\n- **X이론**: 사람은 일을 싫어하므로 통제하고 강제해야 한다\n- **Y이론**: 사람은 스스로 동기를 갖고 책임을 진다\n\n> X이론은 과학적 관리법, Y이론은 인간관계론과 이어집니다.\n\n▸ 임률: 단위당 지급하는 임금 비율.\n▸ 비공식 조직: 조직도에 없는 자연발생적 인간관계.\n▸ 상황적합이론: 상황에 맞는 조직 설계가 있다는 이론.","alt":"## 고전 관리론\n### 테일러 과학적 관리법\n주먹구구를 과학으로 바꿈.\n- **시간연구·동작연구**로 표준 작업량 정함\n- **차별성과급**: 표준 넘으면 많이, 못 넘으면 적게\n- 계획이랑 작업을 분리\n\n> 🚨 비판 포인트: 사람을 기계로 봄. **경제적 유인으로만** 움직인다고 전제함. 이게 인간관계론이 나온 이유임.\n\n### 포드 시스템\n컨베이어 벨트 = **이동조립법**. 표준화·단순화·전문화(3S)로 대량생산.\n> 포드는 **저가격 + 고임금** 주장함. 물건 싸게 팔고 직원 월급 많이 줌. 봉사주의 경영이념.\n\n### 페이욜\n> 🚨 테일러는 **작업 현장**을 봤고 페이욜은 **경영자의 관리 기능**을 봄. 시선이 다름.\n> 관리 5요소: 계획 / 조직 / 지휘 / 조정 / 통제\n> 14원칙 중 **명령일원화**랑 **분업**이 자주 나옴.\n\n## 인간관계론\n### 호손실험 ⭐\n조명 밝기 바꿔가며 생산성 측정함. 근데 밝기랑 상관없이 계속 올라감.\n> 왜? \"누가 나를 지켜보고 있다\"는 인식 때문임.\n> 결론: **물리적 조건보다 관심과 인간관계가 생산성에 영향을 줌.**\n> 비공식 조직의 중요성이 여기서 드러남.\n\n## 현대 관점\n- **시스템 이론**: 조직 = 투입-과정-산출-피드백. 열린 체계\n- **상황적합이론**: ⭐ **최선의 방법은 없다**\n\n> 🚨 상황이론 핵심 = \"정답은 없다. 상황 따라 다르다.\"\n> 고전이론이 \"유일 최선의 방법\"을 찾으려 한 거랑 정반대임. 이 대비로 문제 냄.\n\n## 맥그리거 X·Y이론\n- **X**: 사람은 일 싫어함 → 통제하고 강제해야 함\n- **Y**: 사람은 알아서 함 → 자율 주면 됨\n\n> X = 과학적 관리법 계열 / Y = 인간관계론 계열. 이렇게 묶어서 기억."},{"title":"② 경영전략","sub":"경영학","body":"## 전략 수립 절차\n전략목표 설정 → 환경분석 → 경영전략 도출 → 실행 → 평가 및 피드백\n\n> 첫 단계가 **전략목표 설정**입니다. 환경분석이 먼저라고 나오면 오답입니다.\n\n## SWOT 분석\n내부의 강점·약점과 외부의 기회·위협을 교차합니다.\n- **SO**: 강점으로 기회 활용 (공격적)\n- **ST**: 강점으로 위협 회피 (다각화)\n- **WO**: 약점 보완해 기회 활용 (우회)\n- **WT**: 약점과 위협 최소화 (방어적, 철수)\n\n## 포터의 5 Forces\n산업의 매력도를 보는 틀입니다.\n- 기존 기업 간 경쟁\n- 신규 진입자의 위협\n- 대체재의 위협\n- 구매자의 교섭력\n- 공급자의 교섭력\n\n> 정부 규제, 보완재는 5 Forces에 **포함되지 않습니다.** 선택지에 껴 나옵니다.\n\n## 포터의 본원적 경쟁전략\n- **원가우위**: 낮은 비용으로 승부\n- **차별화**: 독특한 가치로 승부\n- **집중화**: 특정 시장에 좁게 집중\n\n> 원가우위와 차별화를 동시에 추구하면 **어중간한 상태(stuck in the middle)**에 빠진다고 봤습니다.\n\n## BCG 매트릭스\n시장성장률과 상대적 시장점유율 두 축입니다.\n| | 점유율 높음 | 점유율 낮음 |\n|---|---|---|\n| **성장률 높음** | 별(Star) | 물음표(Question Mark) |\n| **성장률 낮음** | 현금젖소(Cash Cow) | 개(Dog) |\n\n> **현금젖소**가 벌어들인 돈으로 **물음표**를 키워 **별**로 만드는 것이 기본 흐름입니다.\n> 개는 철수 대상입니다.\n\n## 앤소프의 제품시장 매트릭스\n| | 기존 제품 | 신제품 |\n|---|---|---|\n| **기존 시장** | 시장침투 | 제품개발 |\n| **신시장** | 시장개발 | 다각화 |\n\n> 위험이 가장 낮은 것이 **시장침투**, 가장 높은 것이 **다각화**입니다.\n\n## 가치사슬\n기업 활동을 주활동과 지원활동으로 나눕니다.\n- **주활동**: 물류 투입, 운영, 물류 산출, 마케팅과 판매, 서비스\n- **지원활동**: 기업 하부구조, 인적자원관리, 기술개발, 조달\n\n▸ 본원적 전략: 산업과 무관하게 적용되는 기본 경쟁전략.\n▸ 상대적 시장점유율: 최대 경쟁사 대비 자사 점유율.\n▸ 다각화: 새 시장에 새 제품으로 진출하는 것.","alt":"## 전략 수립 순서\n**전략목표 설정 → 환경분석 → 전략 도출 → 실행 → 평가**\n\n> 🚨 첫 단계가 **목표 설정**임. \"환경분석이 먼저\" 나오면 오답. 어디로 갈지 정하고 나서 지형을 보는 거임.\n\n## SWOT 4전략\n- **SO**: 강점 + 기회 → 공격\n- **ST**: 강점으로 위협 막기\n- **WO**: 약점 보완해서 기회 잡기\n- **WT**: 둘 다 최소화 → 방어, 철수\n\n## 포터 5 Forces\n기존 경쟁 / 신규진입 위협 / 대체재 위협 / **구매자 교섭력** / **공급자 교섭력**\n\n> 🚨 **정부 규제, 보완재는 안 들어감.** 껴놓고 고르라 함.\n\n## 본원적 경쟁전략 3개\n**원가우위 / 차별화 / 집중화**\n\n> 🚨 원가우위랑 차별화를 **동시에 하면 안 됨.**\n> 어중간해져서 이도저도 아니게 됨. 포터가 이걸 \"stuck in the middle\"이라 부름.\n\n## BCG 매트릭스 ⭐\n| | 점유율 ↑ | 점유율 ↓ |\n|---|---|---|\n| **성장률 ↑** | **별** | **물음표** |\n| **성장률 ↓** | **현금젖소** | **개** |\n\n> 흐름: **현금젖소로 돈 벌어서 → 물음표에 투자 → 별로 키움 → 시장 성숙되면 현금젖소 됨**\n> 개는 철수.\n> 성장률 낮은데 점유율 높은 게 왜 좋냐면, 더 투자할 필요가 없어서 돈이 남기 때문임.\n\n## 앤소프 매트릭스\n| | 기존 제품 | 신제품 |\n|---|---|---|\n| **기존 시장** | 시장침투 | 제품개발 |\n| **신시장** | 시장개발 | **다각화** |\n\n> 🚨 위험 최저 = **시장침투** / 위험 최고 = **다각화**\n> 둘 다 새로운 거니까 다각화가 제일 무서운 거임.\n\n## 가치사슬\n- **주활동**: 투입물류, 운영, 산출물류, 마케팅·판매, 서비스\n- **지원활동**: 하부구조, 인적자원, 기술개발, 조달\n\n> 🚨 인적자원관리랑 조달이 **지원활동**임. 주활동에 껴놓고 고르라 함."},{"title":"③ 조직구조와 조직문화","sub":"경영학","body":"## 조직구조의 기본 개념\n- **분업**: 일을 나누는 것\n- **부문화**: 나눈 일을 묶는 기준. 기능별, 제품별, 지역별, 고객별\n- **통제의 범위**: 관리자 한 명이 관리하는 부하 수. 좁으면 조직이 높아지고 넓으면 납작해집니다\n- **집권화와 분권화**: 의사결정 권한이 위에 몰려 있는가\n\n## 조직 형태\n### 기능별 조직\n생산, 영업, 인사처럼 기능으로 묶습니다. 전문성이 쌓이고 중복이 없습니다.\n> 다만 부서 간 벽이 생기고 제품별 책임 소재가 불분명합니다. 환경 변화에 느립니다.\n\n### 사업부제 조직\n제품이나 지역별로 독립된 단위를 만듭니다. 책임이 명확하고 대응이 빠릅니다.\n> 다만 인사·회계 같은 **기능이 사업부마다 중복**되어 자원이 낭비됩니다.\n\n### 매트릭스 조직\n기능과 프로젝트 두 축을 겹칩니다. 인력을 유연하게 쓸 수 있습니다.\n> 다만 두 상사의 지시를 받게 되어 **명령일원화 원칙이 깨지고** 갈등이 생깁니다.\n\n### 네트워크 조직\n핵심 역량만 남기고 나머지는 외부와 계약합니다.\n\n## 기계적 조직 vs 유기적 조직\n| | 기계적 | 유기적 |\n|---|---|---|\n| 규칙 | 엄격 | 느슨 |\n| 권한 | 집권화 | 분권화 |\n| 소통 | 공식적, 수직적 | 비공식적, 수평적 |\n| 적합 환경 | 안정적 | 변화가 심함 |\n\n## 조직문화 7S 모형\n공유가치(Shared Value), 전략(Strategy), 구조(Structure), 제도(System), 구성원(Staff), 기술(Skill), 리더십 스타일(Style)\n> 이 중 **공유가치가 중심**에 있습니다. 나머지 6S를 연결하는 축입니다.\n> 고객(Customer)은 7S에 없습니다. 3C의 요소입니다.\n\n## 공식조직과 비공식조직\n- 공식조직: 조직도에 나타나는 공적 관계\n- 비공식조직: 자연발생적 인간관계\n\n> 비공식조직은 소속감을 높이고 소통을 원활히 하는 순기능이 있습니다. 다만 파벌화되면 공식 목표를 해칠 수 있습니다. 무조건 부정적으로 보는 선택지는 오답입니다.\n\n▸ 통제의 범위: 한 관리자가 감독하는 부하의 수.\n▸ 라인과 스태프: 직접 목표 달성에 관여하는 부문과 지원하는 부문.\n▸ 7S: 조직을 진단하는 일곱 가지 요소.","alt":"## 기본 개념\n- **분업**: 일 나누기\n- **부문화**: 묶는 기준 (기능별/제품별/지역별/고객별)\n- **통제의 범위**: 한 명이 몇 명 관리? 좁으면 조직이 **높아지고** 넓으면 **납작**해짐\n- **집권 vs 분권**: 권한이 위에 몰렸나\n\n## 조직 형태 4개\n### 기능별\n생산·영업·인사로 묶음. 전문성 쌓임, 중복 없음.\n> 단점: 부서 간 벽 생김, 제품별 책임 불분명, 변화에 느림\n\n### 사업부제\n제품·지역별 독립 단위. 책임 명확, 대응 빠름.\n> 🚨 단점: **기능이 사업부마다 중복**됨. 인사팀이 3개 생기는 식. 자원 낭비.\n\n### 매트릭스\n기능 + 프로젝트 두 축 겹침. 인력 유연하게 씀.\n> 🚨 단점: 상사가 둘 → **명령일원화 깨짐** → 갈등. 이게 단골 답임.\n\n### 네트워크\n핵심만 남기고 나머지 외주.\n\n## 기계적 vs 유기적 ⭐\n| | 기계적 | 유기적 |\n|---|---|---|\n| 규칙 | 빡셈 | 느슨 |\n| 권한 | 집권 | 분권 |\n| 소통 | 공식·수직 | 비공식·수평 |\n| 환경 | **안정적** | **변화 심함** |\n\n> 안정된 환경엔 기계적, 변화 심하면 유기적. 이 짝만 맞추면 됨.\n\n## 조직문화 7S\n공유가치 / 전략 / 구조 / 제도 / 구성원 / 기술 / 스타일\n\n> 🚨 **공유가치가 한가운데** 있고 나머지 6개를 연결함.\n> 그리고 **고객(Customer)은 7S 아님.** 그건 3C임. 이거 껴놓고 고르라 함.\n\n## 공식 vs 비공식 조직\n> 🚨 비공식조직을 **무조건 나쁘게** 써놓은 선택지는 오답임.\n> 소속감 높이고 소통 원활하게 하는 **순기능**이 있음.\n> 다만 파벌 되면 문제. 양면성으로 서술한 게 정답임.\n\n▸ 통제의 범위: 한 관리자가 보는 부하 수."},{"title":"④ 동기부여 이론","sub":"경영학","body":"## 내용이론 (무엇이 동기를 만드는가)\n### 매슬로우 욕구단계설\n생리 → 안전 → 소속과 애정 → 존경 → 자아실현\n> 하위 욕구가 충족되어야 상위 욕구가 동기가 됩니다. 이미 충족된 욕구는 더 이상 동기부여 요인이 아닙니다.\n> 한 번에 하나의 욕구만 작용한다고 본 점이 비판받습니다.\n\n### 알더퍼 ERG이론\n매슬로우를 셋으로 줄였습니다. **존재(Existence), 관계(Relatedness), 성장(Growth)**\n> 차이가 중요합니다. 매슬로우와 달리 **여러 욕구가 동시에 작용**할 수 있고, 상위 욕구가 좌절되면 하위로 내려가는 **좌절-퇴행**을 인정합니다.\n\n### 허즈버그 2요인이론\n- **위생요인**: 임금, 작업조건, 회사 정책, 대인관계, 감독. 없으면 불만이 생기지만 있어도 만족을 주지 못함\n- **동기요인**: 성취, 인정, 책임, 일 자체, 성장. 있으면 만족을 줌\n\n> 핵심은 **만족의 반대가 불만족이 아니라는 것**입니다. 불만족의 반대는 불만족 없음일 뿐입니다.\n> 그래서 임금을 아무리 올려도 불만만 없어질 뿐 동기가 생기지는 않습니다. 직무충실화가 처방입니다.\n\n### 맥클리랜드 성취동기이론\n성취욕구, 권력욕구, 친교욕구. 특히 **성취욕구가 높은 사람**은 중간 정도의 난이도와 즉각적 피드백을 선호합니다.\n\n## 과정이론 (어떻게 동기가 생기는가)\n### 브룸 기대이론\n> **동기 = 기대(Expectancy) × 수단성(Instrumentality) × 유인가(Valence)**\n- 기대: 노력하면 성과가 날까\n- 수단성: 성과를 내면 보상이 올까\n- 유인가: 그 보상이 나에게 가치 있나\n\n> **곱셈**이라는 점이 핵심입니다. 하나라도 0이면 동기가 0이 됩니다.\n\n### 아담스 공정성이론\n자신의 투입 대비 산출 비율을 **타인과 비교**합니다. 불공정을 느끼면 이를 줄이려 행동합니다.\n> 투입 조절, 산출 조절, 인지 왜곡, 비교대상 변경, 이직 등의 반응이 나타납니다.\n> 과소보상뿐 아니라 **과대보상도 불공정**으로 인식됩니다.\n\n### 로크 목표설정이론\n구체적이고 어려운 목표가 성과를 높입니다. 다만 수용 가능해야 하고 피드백이 있어야 합니다.\n> MBO의 이론적 근거입니다.\n\n### 강화이론 (스키너)\n- 정적 강화: 좋은 것을 줌\n- 부적 강화: 싫은 것을 없앰\n- 벌: 싫은 것을 줌\n- 소거: 좋은 것을 없앰\n\n> **부적 강화와 벌은 다릅니다.** 부적 강화는 행동을 늘리고 벌은 줄입니다. 이 구분이 자주 나옵니다.\n\n▸ 직무충실화: 일에 자율성과 책임을 더해 동기요인을 늘리는 것.\n▸ 유인가: 보상에 대해 개인이 느끼는 가치.\n▸ 소거: 강화를 중단해 행동을 줄이는 것.","alt":"## 내용이론 = \"뭐가 동기를 만드나\"\n\n### 매슬로우 5단계\n생리 → 안전 → 소속 → 존경 → 자아실현\n> 🚨 **이미 충족된 욕구는 동기가 안 됨.** 배부른 사람한테 밥 주면 감동 없음.\n> 비판: 한 번에 하나씩만 작용한다고 봄.\n\n### 알더퍼 ERG\n매슬로우를 3개로 압축. **존재 / 관계 / 성장**\n> 🚨 매슬로우랑 다른 점 2개가 시험 포인트\n> ① **여러 욕구가 동시에** 작용 가능\n> ② **좌절-퇴행** 인정 (위가 막히면 아래로 내려감)\n> 승진 막히니까 회식이나 하자는 게 좌절-퇴행임.\n\n### 허즈버그 2요인 ⭐\n- **위생요인**: 임금, 작업조건, 회사 정책, 대인관계 → 없으면 불만, 있어도 만족은 없음\n- **동기요인**: 성취, 인정, 책임, 일 자체, 성장 → 있으면 만족\n\n> 🚨 핵심 문장: **만족의 반대는 불만족이 아님.**\n> 불만족의 반대는 그냥 \"불만족 없음\"임.\n> 그래서 월급 아무리 올려줘도 불만만 사라질 뿐 신나서 일하진 않음. 처방은 **직무충실화**.\n\n### 맥클리랜드\n성취 / 권력 / 친교\n> 성취욕구 높은 사람 = **중간 난이도** 선호 + 즉각 피드백 원함.\n> 너무 쉬우면 재미없고 너무 어려우면 운빨이라 성취감이 없음.\n\n## 과정이론 = \"어떻게 동기가 생기나\"\n\n### 브룸 기대이론 ⭐\n> **동기 = 기대 × 수단성 × 유인가**\n- 기대: 노력하면 성과 날까\n- 수단성: 성과 내면 보상 올까\n- 유인가: 그 보상이 나한테 가치 있나\n\n> 🚨 **곱셈**이 핵심임. 하나라도 0이면 전체가 0.\n> 아무리 열심히 해도 승진 안 시켜줄 거 같으면(수단성 0) 동기 0임.\n\n### 아담스 공정성이론\n내 투입 대비 산출을 **남이랑 비교**함.\n> 🚨 **과대보상도 불공정으로 느낌.** 덜 받는 것만 문제가 아님.\n> 반응: 투입 줄이기, 인지 왜곡, 비교대상 바꾸기, 이직\n\n### 로크 목표설정이론\n**구체적이고 어려운** 목표가 성과를 높임. 단 수용 가능하고 피드백 있어야 함.\n> MBO의 근거임.\n\n### 강화이론 (스키너)\n> 🚨 여기 함정 있음\n> **부적 강화 ≠ 벌**\n> 부적 강화 = 싫은 걸 **없애줌** → 행동 **증가**\n> 벌 = 싫은 걸 **줌** → 행동 **감소**\n> 방향이 반대임. 잔소리 안 하는 게 부적 강화, 잔소리 하는 게 벌."},{"title":"⑤ 리더십","sub":"경영학","body":"## 특성이론\n훌륭한 리더에게는 공통된 자질이 있다고 봅니다. 지능, 자신감, 결단력 등입니다.\n> 일관된 특성을 찾지 못해 한계에 부딪혔습니다.\n\n## 행동이론\n### 오하이오 연구\n- **구조주도**: 과업과 역할을 명확히 하는 행동\n- **배려**: 부하의 감정과 관계를 챙기는 행동\n> 두 차원은 독립적입니다. 둘 다 높은 것이 바람직하다고 봤습니다.\n\n### 관리격자 (블레이크와 무튼)\n생산에 대한 관심과 인간에 대한 관심을 각각 9단계로 봅니다.\n- (1,1) 무기력형 / (9,1) 과업형 / (1,9) 컨트리클럽형 / (5,5) 중도형 / **(9,9) 팀형이 이상적**\n\n## 상황이론\n### 피들러의 상황적합이론\n리더십 스타일을 **LPC 점수**로 측정합니다. 가장 싫어하는 동료를 좋게 평가하면 관계지향적, 나쁘게 평가하면 과업지향적입니다.\n> 상황이 매우 유리하거나 매우 불리할 때는 **과업지향적** 리더가, 중간일 때는 **관계지향적** 리더가 효과적입니다.\n> 피들러는 리더의 스타일이 잘 안 바뀐다고 보아 **상황을 리더에 맞추라**고 했습니다.\n\n### 허시와 블랜차드의 상황대응 리더십\n부하의 **성숙도**에 따라 스타일을 바꿉니다.\n- 성숙도 낮음 → 지시형\n- 낮은 중간 → 설득형\n- 높은 중간 → 참여형\n- 성숙도 높음 → 위임형\n\n> 부하가 성장할수록 리더가 손을 떼는 방향입니다.\n\n### 경로-목표이론 (하우스)\n리더는 부하가 목표에 이르는 **길을 닦아주는** 역할을 합니다. 지시적, 지원적, 참여적, 성취지향적 스타일을 상황에 따라 씁니다.\n\n## 현대적 리더십\n### 거래적 리더십\n성과에 대한 보상을 교환합니다. 조건적 보상, 예외에 의한 관리.\n\n### 변혁적 리더십\n> 부하의 가치관과 태도 자체를 바꿔 기대 이상의 성과를 끌어냅니다.\n> 네 요소는 **카리스마(이상적 영향력), 영감적 동기부여, 지적 자극, 개별적 배려**입니다.\n\n### 서번트 리더십\n리더가 구성원을 섬기고 성장시키는 데 초점을 둡니다.\n\n▸ LPC: 가장 선호하지 않는 동료에 대한 평가 점수.\n▸ 성숙도: 부하의 능력과 의지 수준.\n▸ 거래적 vs 변혁적: 보상 교환이냐 가치 변화냐.","alt":"## 특성이론\n훌륭한 리더는 타고난다. 지능·자신감·결단력.\n> 근데 공통 특성을 못 찾아서 망함.\n\n## 행동이론\n### 오하이오 연구\n- **구조주도**: 일 시키고 역할 정하는 행동\n- **배려**: 사람 챙기는 행동\n> 둘은 독립적임. 둘 다 높은 게 좋다고 봄.\n\n### 관리격자\n생산 관심 × 인간 관심, 각각 9단계.\n> (1,1) 무기력 / (9,1) 과업형 / (1,9) 컨트리클럽 / (5,5) 중도 / **(9,9) 팀형 = 이상형**\n> 앞 숫자가 생산, 뒤가 인간임. 순서 헷갈리지 마셈.\n\n## 상황이론\n### 피들러 ⭐\n**LPC 점수**로 스타일 측정. 제일 싫은 동료를 좋게 평가 = 관계지향, 나쁘게 = 과업지향.\n\n> 🚨 결론이 반직관적이라 자주 나옴\n> **상황이 매우 좋거나 매우 나쁠 때 → 과업지향형**\n> **상황이 중간일 때 → 관계지향형**\n>\n> 위기 상황엔 인간적으로 굴 시간이 없음. 완전 편할 때도 굳이 챙길 필요 없음. 애매할 때만 관계가 중요함.\n>\n> 그리고 피들러는 **스타일이 안 바뀐다**고 봐서 **상황을 리더에 맞추라**고 함. 다른 이론들과 반대 방향임.\n\n### 허시-블랜차드\n부하 **성숙도**에 따라 바꿈.\n> 지시 → 설득 → 참여 → **위임**\n> 부하가 클수록 리더가 손 뗌. 순서 그대로 나옴.\n\n### 경로-목표이론 (하우스)\n리더는 부하가 목표까지 가는 **길을 닦아주는** 사람.\n지시적 / 지원적 / 참여적 / 성취지향적\n\n## 현대 리더십 ⭐\n### 거래적\n성과 주면 보상 줌. 거래임.\n\n### 변혁적\n> 부하의 **가치관 자체를 바꿔서** 기대 이상을 끌어냄.\n> 4요소: **카리스마 / 영감적 동기부여 / 지적 자극 / 개별적 배려**\n> 이 4개 그대로 물어봄.\n\n### 서번트\n리더가 구성원을 **섬김**. 성장시키는 데 초점.\n\n▸ LPC: 제일 싫은 동료 평가 점수."},{"title":"⑥ 인사관리","sub":"경영학","body":"## 직무분석\n어떤 일인지, 어떤 사람이 필요한지 정리하는 작업입니다.\n결과물이 두 가지입니다.\n> - **직무기술서**: 일의 내용, 책임, 작업조건. **일**에 관한 문서\n> - **직무명세서**: 학력, 경력, 능력, 자격. **사람**에 관한 문서\n\n이 둘을 바꿔 내는 문제가 자주 나옵니다.\n\n## 직무평가\n직무의 상대적 가치를 매겨 임금 체계의 기초로 삼습니다.\n- 비양적 방법: 서열법, 분류법\n- 양적 방법: **점수법**, 요소비교법\n\n## 직무설계\n- **직무확대**: 수평적으로 일의 범위를 넓힘 (양적 확대)\n- **직무충실화**: 수직적으로 권한과 책임을 더함 (질적 심화)\n- 직무순환: 여러 직무를 돌아가며 경험\n\n> 직무충실화가 허즈버그의 동기요인과 연결됩니다.\n\n### 직무특성모형 (해크만과 올드햄)\n기술다양성, 과업정체성, 과업중요성, **자율성**, **피드백** 다섯 가지가 동기를 높입니다.\n\n## 선발\n### 신뢰성과 타당성\n- **신뢰성**: 같은 사람을 여러 번 측정해도 일관된 결과가 나오는가\n- **타당성**: 측정하려는 것을 실제로 측정하고 있는가\n\n> 신뢰성이 없으면 타당성도 없습니다. 그러나 신뢰성이 있다고 타당성이 보장되지는 않습니다. 이 관계가 시험에 나옵니다.\n\n### 선발 오류\n- 1종 오류: 뽑았어야 할 사람을 탈락시킴\n- 2종 오류: 뽑지 말았어야 할 사람을 채용함\n\n## 인사고과 오류\n- **후광효과**: 한 가지 두드러진 특성이 전체 평가를 물들임\n- **관대화 경향**: 전반적으로 후하게 평가\n- **중심화 경향**: 중간 점수로 몰림\n- **최근효과**: 최근 실적만 반영\n- **대비오차**: 바로 앞 사람과 비교해 평가\n- **상동적 태도**: 출신지, 성별 등 집단 특성으로 판단\n\n> 관대화와 중심화를 막기 위해 **강제할당법**을 씁니다.\n\n## 교육훈련 평가 (커크패트릭 4단계)\n반응 → 학습 → 행동 → 결과\n\n▸ 직무기술서: 일에 관한 문서.\n▸ 직무명세서: 사람에 관한 문서.\n▸ 강제할당법: 등급별 인원 비율을 미리 정해두는 평가 방식.","alt":"## 직무분석 ⭐\n결과물 2개. 이거 바꿔서 진짜 자주 냄.\n> 🚨 **직무기술서 = 일에 대한 문서** (내용, 책임, 작업조건)\n> **직무명세서 = 사람에 대한 문서** (학력, 경력, 능력)\n>\n> 외우는 법: **명**세서에 사람 스펙(성**명** 쓰는 느낌). 기술서는 일을 기술.\n\n## 직무평가\n직무 가치 매겨서 임금 기준 잡기.\n- 비양적: 서열법, 분류법\n- 양적: **점수법**, 요소비교법\n\n## 직무설계 ⭐\n- **직무확대**: 옆으로 넓힘 (일 종류 늘림) = **양적**\n- **직무충실화**: 위로 깊게 (권한·책임 줌) = **질적**\n\n> 🚨 확대는 수평, 충실화는 수직. 이거 바꿔서 냄.\n> 충실화가 허즈버그 **동기요인**이랑 연결됨.\n\n### 직무특성모형\n기술다양성 / 과업정체성 / 과업중요성 / **자율성** / **피드백** 5개.\n\n## 선발\n### 신뢰성 vs 타당성 ⭐\n- **신뢰성**: 재고 또 재도 같은 값 나오나 (일관성)\n- **타당성**: 재려던 걸 제대로 재고 있나 (정확성)\n\n> 🚨 관계가 중요함\n> **신뢰성 없으면 타당성도 없음.** 근데 **신뢰성 있다고 타당성 보장은 안 됨.**\n> 고장난 저울이 매번 5kg 더 나옴 → 신뢰성은 있는데 타당성은 없음. 이 예시로 기억.\n\n### 선발 오류\n- 1종: 뽑았어야 할 사람 떨어뜨림\n- 2종: 뽑지 말았어야 할 사람 뽑음\n\n## 인사고과 오류 (다 나옴)\n- **후광효과**: 하나 잘하면 다 잘해 보임\n- **관대화**: 다 후하게\n- **중심화**: 다 중간으로\n- **최근효과**: 최근 것만 기억\n- **대비오차**: 앞 사람이랑 비교\n- **상동적 태도**: 출신·성별로 판단\n\n> 관대화·중심화 막으려고 **강제할당법** 씀. S등급 몇 %, A등급 몇 % 정해놓는 거.\n\n## 교육훈련 평가 4단계\n**반응 → 학습 → 행동 → 결과** (커크패트릭)"},{"title":"⑦ 보상과 노사관계","sub":"경영학","body":"## 임금 체계\n- **연공급**: 근속연수 기준. 안정적이지만 성과 반영이 어려움\n- **직무급**: 직무의 가치 기준. 동일노동 동일임금 원칙에 맞음\n- **직능급**: 직무수행 능력 기준\n- **성과급**: 성과 기준\n\n## 임금 관련 개념\n- **임금수준**: 얼마나 주느냐. 기업 지불능력, 생계비, 노동시장 수준이 결정\n- **임금체계**: 어떤 기준으로 배분하느냐\n- **임금형태**: 어떻게 지급하느냐 (시급, 월급, 성과급)\n\n### 성과급 제도\n- 개인 성과급: 단순성과급, **테일러식 차별성과급**\n- 집단 성과급: **스캔론 플랜**(매출액 대비 인건비 절감분 배분), **럭커 플랜**(부가가치 기준)\n\n## 복리후생\n- 법정 복리후생: 4대보험, 퇴직급여\n- 법정 외 복리후생: 회사가 자율로 제공\n- **카페테리아식 복리후생**: 직원이 원하는 항목을 골라 쓰는 방식\n\n## 노동조합\n### 조직 형태\n- 직업별 조합, 산업별 조합, 기업별 조합, 일반 조합\n\n### 숍 제도 (자주 나옴)\n> - **클로즈드 숍**: 조합원만 채용할 수 있음. 조합의 힘이 가장 강함\n> - **유니언 숍**: 채용은 자유지만 채용 후 일정 기간 안에 조합에 가입해야 함\n> - **오픈 숍**: 가입 여부가 자유. 조합의 힘이 가장 약함\n\n## 노동쟁의\n- 근로자 측: **파업**, 태업, 보이콧, 피케팅\n- 사용자 측: **직장폐쇄**\n\n> 직장폐쇄는 사용자의 유일한 쟁의행위이며, 노조의 쟁의행위에 대한 **대항수단**으로만 인정됩니다. 선제적으로는 할 수 없습니다.\n\n## 경영참가제도\n- **자본참가**: 우리사주제 등 주식 보유로 참여\n- **이윤참가**: 성과 배분으로 참여\n- **경영참가**: 의사결정에 참여 (노사협의회, 공동결정제)\n\n> 세 가지 유형을 묻고 엉뚱한 것을 껴 넣는 문제가 나옵니다.\n\n▸ 스캔론 플랜: 매출액 대비 인건비 절감액을 나누는 집단 성과급.\n▸ 숍 제도: 조합 가입과 고용의 관계를 정한 제도.\n▸ 직장폐쇄: 사용자가 사업장을 닫아 임금 지급을 면하는 쟁의행위.","alt":"## 임금 체계 4종\n- **연공급**: 근속연수. 안정적인데 성과 반영 안 됨\n- **직무급**: 일의 가치. 동일노동 동일임금\n- **직능급**: 능력 기준\n- **성과급**: 성과 기준\n\n## 헷갈리는 3형제\n- **임금수준**: 얼마 주냐\n- **임금체계**: 무슨 기준으로 나누냐\n- **임금형태**: 어떻게 주냐 (시급/월급/성과급)\n\n### 집단 성과급 ⭐\n- **스캔론 플랜**: **매출액** 대비 인건비 절감분 배분\n- **럭커 플랜**: **부가가치** 기준\n\n> 🚨 매출액이냐 부가가치냐로 갈림. 바꿔서 냄. 스캔론-매출, 럭커-부가가치.\n\n## 복리후생\n- 법정: 4대보험, 퇴직급여\n- 법정 외: 회사 자율\n- **카페테리아식**: 직원이 원하는 항목 **골라 씀**\n\n## 숍 제도 ⭐ (진짜 자주 나옴)\n> **클로즈드 숍**: 조합원만 채용 가능. **조합 힘 최강**\n> **유니언 숍**: 채용은 자유, 근데 들어오면 **일정 기간 내 가입 의무**\n> **오픈 숍**: 가입 자유. **조합 힘 최약**\n\n> 순서: 클로즈드 > 유니언 > 오픈. 조합 힘 세기 순임.\n\n## 쟁의행위\n- 근로자: **파업**, 태업, 보이콧, 피케팅\n- 사용자: **직장폐쇄**\n\n> 🚨 **직장폐쇄는 사용자의 유일한 쟁의수단**임.\n> 그리고 노조가 먼저 쟁의한 다음에만 쓸 수 있는 **대항수단**임. 먼저 못 씀.\n> \"사용자는 언제든 직장폐쇄를 할 수 있다\" → 오답.\n\n## 경영참가 3유형 ⭐\n- **자본참가**: 주식 보유 (우리사주)\n- **이윤참가**: 성과 배분\n- **경영참가**: 의사결정 참여 (노사협의회)\n\n> 🚨 여기에 \"생산참가\", \"단체교섭\" 같은 거 껴놓고 고르라 함. 3개만 있음."},{"title":"⑧ 마케팅의 기초와 STP","sub":"경영학","body":"## 마케팅 개념의 발전\n생산 → 제품 → 판매 → **마케팅** → 사회적 마케팅 순으로 발전했습니다.\n- **생산 개념**: 싸고 많이 만들면 팔린다\n- **제품 개념**: 좋은 제품이면 팔린다. 여기서 **마케팅 근시안**이 생깁니다\n- **판매 개념**: 밀어붙여 팔면 된다\n- **마케팅 개념**: 고객의 욕구에서 출발한다\n- **사회적 마케팅**: 고객과 기업뿐 아니라 사회 전체의 이익까지 고려한다\n\n> **마케팅 근시안**은 제품 자체에 매몰되어 고객이 진짜 원하는 것을 놓치는 오류입니다. 철도회사가 자신을 운송업이 아닌 철도업으로 규정해 쇠퇴한 사례가 유명합니다.\n\n## 시장세분화(Segmentation)\n시장을 비슷한 욕구를 가진 집단으로 나눕니다.\n### 세분화 기준\n- **인구통계적**: 나이, 성별, 소득, 직업\n- **지리적**: 지역, 도시 규모, 기후\n- **심리분석적**: 라이프스타일, 개성, 가치관\n- **행동적**: 사용량, 추구편익, 브랜드 충성도, 사용 상황\n\n### 좋은 세분시장의 조건\n측정 가능성, 접근 가능성, 규모의 적정성, 차별화 가능성, 실행 가능성\n\n## 표적시장 선정(Targeting)\n- **비차별적 마케팅**: 전체를 하나로 보고 동일한 마케팅. 원가 절감에 유리\n- **차별적 마케팅**: 세분시장마다 다른 마케팅. 매출은 늘지만 비용도 늘어남\n- **집중적 마케팅**: 하나의 세분시장에 집중. 자원이 적은 기업에 적합하지만 위험이 큼\n\n## 포지셔닝(Positioning)\n표적 고객의 마음속에 자사 제품의 위치를 심는 작업입니다.\n> 절차: 경쟁자 확인 → 경쟁자 포지션 분석 → 자사 포지션 개발 → 포지셔닝 확인과 재포지셔닝\n> 포지셔닝 맵을 그려 빈 공간을 찾는 방식이 흔히 쓰입니다.\n\n## 마케팅 믹스 4P\n- **Product**: 제품, 품질, 브랜드, 포장, 서비스\n- **Price**: 가격, 할인, 신용조건\n- **Place**: 유통경로, 재고, 물류\n- **Promotion**: 광고, 판매촉진, 인적판매, PR\n\n> 서비스 마케팅에서는 사람(People), 물리적 증거(Physical evidence), 프로세스(Process)를 더해 **7P**로 확장합니다.\n> 고객 관점에서 재구성한 **4C**(Customer value, Cost, Convenience, Communication)도 있습니다.\n\n▸ 마케팅 근시안: 제품에 갇혀 고객 욕구를 놓치는 오류.\n▸ 추구편익: 소비자가 그 제품에서 얻으려는 이득.\n▸ 포지셔닝 맵: 소비자 인식 속 위치를 좌표로 그린 그림.","alt":"## 마케팅 개념 발전 순서\n**생산 → 제품 → 판매 → 마케팅 → 사회적 마케팅**\n- 생산: 싸게 많이 만들면 팔림\n- 제품: 좋게 만들면 팔림 → 여기서 **마케팅 근시안** 생김\n- 판매: 밀어붙여 팔면 됨\n- 마케팅: **고객 욕구에서 출발**\n- 사회적: 사회 전체 이익까지\n\n> 🚨 **마케팅 근시안**\n> 철도회사가 자기를 \"철도업\"이라 규정함 → 자동차·비행기 나오니까 망함\n> \"운송업\"이라고 봤으면 살았음. 제품에 갇혀서 고객이 진짜 원하는 걸 놓친 거임.\n\n## S — 시장세분화\n### 기준 4개\n- **인구통계**: 나이, 성별, 소득\n- **지리적**: 지역, 기후\n- **심리분석**: 라이프스타일, 개성\n- **행동적**: 사용량, 추구편익, 충성도\n\n### 좋은 세분시장 조건\n측정 가능 / 접근 가능 / 규모 적정 / 차별화 가능 / 실행 가능\n\n## T — 표적시장\n- **비차별적**: 전체를 하나로. 원가 절감\n- **차별적**: 세분시장마다 다르게. 매출 ↑ 비용도 ↑\n- **집중적**: 하나에 몰빵. 자원 적은 기업용, 근데 위험함\n\n## P — 포지셔닝\n고객 머릿속에 자리 잡기.\n> 절차: 경쟁자 확인 → 경쟁자 포지션 분석 → 자사 포지션 개발 → 확인·재포지셔닝\n> 포지셔닝 맵 그려서 **빈 칸** 찾는 게 실무 방식.\n\n## 4P\n**Product / Price / Place / Promotion**\n\n> 🚨 **Positioning은 4P 아님.** STP의 P임. 껴놓고 고르라고 함.\n\n확장판도 나옴.\n- 서비스는 **7P**: +People, Physical evidence, Process\n- 고객 관점 **4C**: Customer value, Cost, Convenience, Communication\n\n▸ 추구편익: 소비자가 그 제품에서 얻으려는 이득."},{"title":"⑨ 제품과 가격 전략","sub":"경영학","body":"## 제품의 세 수준\n- **핵심제품**: 고객이 진짜 사는 편익. 드릴을 사는 사람은 구멍을 산다\n- **실제제품**: 브랜드, 품질, 디자인, 포장\n- **확장제품**: 배송, 설치, A/S, 보증\n\n## 제품수명주기(PLC)\n| 단계 | 매출 | 이익 | 전략 |\n|---|---|---|---|\n| 도입기 | 낮음 | 적자 | 인지도 확보, 광고 집중 |\n| 성장기 | 급증 | 증가 | 시장 확대, 유통 확충 |\n| **성숙기** | 정체 | 정점 후 감소 | **경쟁 최고조**, 차별화·시장 세분화 |\n| 쇠퇴기 | 감소 | 감소 | 철수 또는 원가 절감 |\n\n> **경쟁이 가장 치열한 단계는 성숙기**입니다. 시장이 더 안 커지니 남의 몫을 뺏어야 하기 때문입니다.\n\n## 브랜드\n- **브랜드 자산**: 브랜드 때문에 생기는 추가 가치\n- **브랜드 확장**: 기존 브랜드로 새 제품군에 진출\n- **라인 확장**: 같은 제품군 안에서 품목을 늘림\n\n> 확장은 비용이 적게 들지만 실패하면 모브랜드까지 타격을 입습니다.\n\n## 가격 결정 방법\n- **원가기준**: 원가에 마진을 붙임. 계산이 쉽지만 수요를 무시함\n- **경쟁기준**: 경쟁사 가격을 기준으로\n- **소비자기준**: 소비자가 느끼는 가치를 기준으로\n\n## 신제품 가격전략 (자주 나옴)\n- **스키밍(초기고가)**: 처음에 비싸게 받고 점차 내림. 가격에 둔감한 혁신 수용층에서 마진 회수. 경쟁자 진입이 어려울 때 유효\n- **침투가격(초기저가)**: 처음부터 싸게 팔아 점유율 확보. 규모의 경제가 크고 수요가 탄력적일 때 유효\n\n> 방향이 반대이므로 조건도 반대입니다. 어떤 상황에 어느 쪽이 맞는지를 묻습니다.\n\n## 심리적 가격전략\n- **단수가격**: 9,900원처럼 끝자리를 낮춰 싸 보이게 함\n- **관습가격**: 오랫동안 굳어진 가격\n- **준거가격**: 소비자가 마음속에 갖고 있는 기준 가격\n- **명성가격**: 비쌀수록 품질이 좋다고 느끼는 심리를 이용\n\n## 기타 가격전략\n- **묶음가격**: 여러 제품을 묶어 할인\n- **종속제품 가격**: 본체는 싸게, 소모품은 비싸게. 프린터와 잉크\n- **캡티브 프라이싱**: 종속제품 가격의 다른 이름\n\n▸ 모브랜드: 확장의 바탕이 되는 기존 브랜드.\n▸ 혁신 수용층: 신제품을 가장 먼저 사는 소비자 집단.\n▸ 준거가격: 소비자가 적정하다고 여기는 기준 가격.","alt":"## 제품 3수준\n- **핵심제품**: 진짜 사는 이유. 드릴 사는 사람은 **구멍**을 사는 거임\n- **실제제품**: 브랜드, 품질, 디자인, 포장\n- **확장제품**: 배송, 설치, A/S, 보증\n\n## PLC (제품수명주기) ⭐\n| 단계 | 매출 | 이익 | 특징 |\n|---|---|---|---|\n| 도입기 | 낮음 | **적자** | 인지도 확보 |\n| 성장기 | 급증 | 증가 | 시장 확대 |\n| **성숙기** | 정체 | 감소 시작 | **경쟁 최고조** |\n| 쇠퇴기 | 감소 | 감소 | 철수 |\n\n> 🚨 **경쟁이 제일 치열한 건 성장기가 아니라 성숙기**임.\n> 시장이 더 안 커지니까 남의 파이를 뺏는 수밖에 없음. 그래서 치킨게임이 벌어짐.\n> 도입기에 이익이 **적자**라는 것도 자주 나옴. 광고비가 많이 드니까.\n\n## 브랜드\n- 브랜드 자산 / **브랜드 확장**(다른 제품군) / **라인 확장**(같은 제품군 안)\n> 확장은 싸게 먹히는데 망하면 **본 브랜드까지 같이 죽음.**\n\n## 가격 결정 3방법\n원가기준 / 경쟁기준 / 소비자기준(가치기준)\n\n## 신제품 가격 ⭐\n- **스키밍(초기고가)**: 비싸게 시작해서 내림. 초기에 사는 얼리어답터한테 마진 뽑음. **경쟁자 진입 어려울 때**\n- **침투가격(초기저가)**: 싸게 시작해서 점유율 먹음. **규모의 경제 크고 수요 탄력적일 때**\n\n> 🚨 방향이 반대니까 조건도 반대임.\n> 아이폰 = 스키밍 / 쿠팡 초기 = 침투가격\n> 어떤 상황에 뭐가 맞냐를 물어봄.\n\n## 심리적 가격\n- **단수가격**: 9,900원 (10,000원보다 훨씬 싸 보임)\n- **관습가격**: 오래 굳어진 가격\n- **준거가격**: 내 머릿속 기준 가격\n- **명성가격**: 비싸야 좋아 보이는 심리 이용 (명품)\n\n## 기타\n- **묶음가격**: 세트로 할인\n- **종속제품 가격(캡티브)**: **본체 싸게, 소모품 비싸게**\n> 프린터 싸게 팔고 잉크로 뽑아먹기. 면도기랑 면도날도 같음.\n\n▸ 모브랜드: 확장의 바탕이 되는 기존 브랜드."},{"title":"⑩ 유통과 촉진","sub":"경영학","body":"## 유통경로의 기능\n생산자와 소비자 사이의 간극을 메웁니다.\n- 시간, 장소, 소유의 불일치를 해소\n- 거래 횟수를 줄여 효율을 높임\n\n> 생산자 3명과 소비자 3명이 직접 거래하면 9번의 거래가 필요하지만, 중간상 1명을 두면 6번으로 줄어듭니다. 이것이 **총거래수 최소화의 원칙**입니다.\n\n## 유통경로의 유형\n- **소비재**: 생산자 → 도매상 → 소매상 → 소비자\n- **산업재**: 경로가 짧습니다. 직접 판매가 많습니다\n\n## 유통 집약도\n- **집약적(개방적) 유통**: 가능한 한 많은 점포에서 판매. 편의품(음료, 과자)\n- **선택적 유통**: 일정 자격을 갖춘 점포만. 선매품(가전, 의류)\n- **전속적 유통**: 한 지역에 하나의 점포만. 전문품(고급차, 명품)\n\n> 제품 유형과 유통 방식이 짝을 이룹니다. 이 대응을 묻는 문제가 나옵니다.\n\n## 수직적 마케팅 시스템(VMS)\n- **기업형**: 한 회사가 유통 단계를 소유\n- **계약형**: 프랜차이즈처럼 계약으로 결합\n- **관리형**: 힘 있는 기업이 주도\n\n## 촉진 믹스 네 가지\n- **광고**: 대중매체를 통한 비인적 커뮤니케이션. 도달 범위가 넓지만 피드백이 없음\n- **인적판매**: 직접 만나 파는 것. 설득력이 높지만 비용이 큼\n- **판매촉진**: 쿠폰, 할인, 샘플. 단기 효과가 크지만 브랜드 이미지를 해칠 수 있음\n- **PR(홍보)**: 언론 보도 등. 신뢰도가 높지만 통제가 어려움\n\n> 각각의 장단점을 바꿔 내는 문제가 나옵니다. **광고는 통제 가능하지만 신뢰도가 낮고, PR은 신뢰도가 높지만 통제가 어렵다**는 대비를 기억하세요.\n\n## 푸시 전략과 풀 전략\n- **푸시(Push)**: 생산자가 중간상에게, 중간상이 소비자에게 밀어냄. **인적판매와 중간상 판촉** 중심\n- **풀(Pull)**: 소비자가 찾게 만들어 중간상이 따라오게 함. **광고와 소비자 판촉** 중심\n\n▸ 편의품: 자주 사고 비교 없이 사는 저관여 제품.\n▸ 선매품: 여러 곳을 비교하고 사는 제품.\n▸ 전문품: 브랜드 충성도가 높아 대체를 잘 안 하는 제품.","alt":"## 유통경로가 왜 필요하냐\n시간·장소·소유의 불일치를 메움. 그리고 거래 횟수를 줄임.\n\n> 🚨 **총거래수 최소화의 원칙**\n> 생산자 3명 × 소비자 3명 직거래 = **9번**\n> 중간상 1명 끼면 = 3 + 3 = **6번**\n> 중간상이 낀다고 무조건 비효율이 아니라는 논리임. 계산으로 나옴.\n\n## 유통 집약도 ⭐ (제품 유형과 짝)\n- **집약적(개방적)**: 아무 데나 다 깔기 → **편의품** (음료, 과자)\n- **선택적**: 자격 되는 곳만 → **선매품** (가전, 의류)\n- **전속적**: 한 지역에 딱 하나 → **전문품** (명품, 고급차)\n\n> 🚨 짝을 바꿔서 냄. 편의품-집약적 / 선매품-선택적 / 전문품-전속적.\n> 논리는 간단함. 자주 사는 싼 물건일수록 아무 데나 있어야 함.\n\n## VMS (수직적 마케팅 시스템)\n- 기업형: 직접 소유\n- 계약형: **프랜차이즈**\n- 관리형: 힘센 기업이 주도\n\n## 촉진 믹스 4개 ⭐\n| | 장점 | 단점 |\n|---|---|---|\n| 광고 | 도달 범위 넓음, **통제 가능** | 신뢰도 낮음, 피드백 없음 |\n| 인적판매 | 설득력 최고 | **비용 큼** |\n| 판매촉진 | 단기 효과 큼 | **브랜드 이미지 손상** |\n| PR | **신뢰도 높음** | **통제 어려움** |\n\n> 🚨 **광고 = 통제 O, 신뢰도 낮음 / PR = 통제 X, 신뢰도 높음**\n> 이 대비를 뒤집어서 냄. 광고는 내가 돈 내고 하는 거라 마음대로 할 수 있지만 다들 광고인 줄 앎. PR은 기자가 쓰는 거라 못 건드리지만 사람들이 믿음.\n\n## 푸시 vs 풀 ⭐\n- **푸시**: 생산자 → 중간상 → 소비자로 **밀어냄**. **인적판매·중간상 판촉** 중심\n- **풀**: 소비자가 찾게 만들어 중간상이 **끌려오게**. **광고·소비자 판촉** 중심\n\n> 밀 푸시, 당길 풀. 수단이 뭐냐로 구분함.\n\n▸ 편의품: 비교 안 하고 그냥 사는 것.\n▸ 선매품: 여기저기 비교하고 사는 것."},{"title":"⑪ 생산운영관리","sub":"경영학","body":"## 생산방식의 분류\n- **주문생산 vs 계획생산**\n- **소품종 대량생산 vs 다품종 소량생산**\n- 공정별 배치(Job shop) vs 제품별 배치(Flow shop)\n\n> 다품종 소량생산에는 공정별 배치가, 소품종 대량생산에는 제품별 배치가 맞습니다.\n\n## 라인밸런싱\n조립 라인의 각 공정 작업시간을 고르게 맞추는 작업입니다.\n> 전체 생산 속도는 **가장 느린 공정**이 결정합니다. 이를 **애로공정(병목)**이라고 합니다.\n> 병목을 개선하지 않으면 다른 공정을 아무리 빠르게 해도 전체 산출량이 늘지 않습니다.\n\n## 재고관리\n재고를 갖는 이유는 수요 변동 대응, 규모의 경제, 결품 방지입니다. 반면 보관비와 자금 부담이 생깁니다.\n\n### 경제적 주문량(EOQ)\n주문비용과 재고유지비용의 합을 최소로 만드는 주문량입니다.\n> 한 번에 많이 주문하면 주문 횟수가 줄어 주문비용은 감소하지만 쌓아두는 재고가 늘어 유지비가 증가합니다. 이 두 곡선이 교차하는 지점이 EOQ입니다.\n> **EOQ에서는 연간 주문비용과 연간 재고유지비용이 같아집니다.** 이 성질이 시험에 나옵니다.\n\n가정: 수요가 일정하고 알려져 있으며, 조달기간이 일정하고, 재고부족이 없습니다.\n\n### 안전재고와 재주문점\n- 안전재고: 수요나 조달기간의 변동에 대비한 여유 재고\n- 재주문점 = 조달기간 중 예상 수요 + 안전재고\n\n## JIT와 MRP\n- **JIT(적시생산)**: 필요한 때 필요한 만큼만. 재고를 낭비로 봅니다. **풀(Pull) 방식**이며 간판(칸반)으로 신호를 보냅니다\n- **MRP(자재소요계획)**: 생산계획에서 거꾸로 계산해 자재를 준비합니다. **푸시(Push) 방식**\n\n> JIT는 재고를 극도로 줄이므로 공급이 끊기면 라인이 즉시 멈춥니다. 유연성과 취약성이 동전의 양면입니다.\n\n## 공급사슬관리\n### 채찍효과(Bullwhip Effect)\n소비자 수요의 작은 변동이 유통 단계를 거슬러 올라가며 **점점 크게 증폭**되는 현상입니다.\n> 원인: 수요 예측의 왜곡, 일괄주문, 가격 변동과 할인 행사, 결품 우려로 인한 과대주문\n> 대책: 정보 공유, 주문 단위 축소, 상시저가정책(EDLP)\n\n▸ 애로공정: 전체 흐름을 제약하는 가장 느린 공정.\n▸ 칸반: JIT에서 후공정이 전공정에 필요량을 알리는 신호 카드.\n▸ EDLP: 매일 낮은 가격을 유지해 수요 변동을 줄이는 정책.","alt":"## 생산방식\n- 주문생산 vs 계획생산\n- 소품종 대량 vs 다품종 소량\n> **다품종 소량 → 공정별 배치 / 소품종 대량 → 제품별 배치**\n\n## 라인밸런싱 ⭐\n공정마다 작업시간을 고르게 맞추는 것.\n> 🚨 전체 속도는 **제일 느린 공정**이 결정함. 이게 **애로공정(병목)**.\n> 병목 안 고치고 다른 데만 빠르게 해봤자 전체 산출량은 그대로임.\n> 고속도로 공사 구간 하나 때문에 전체가 막히는 거랑 같음.\n\n## 재고관리\n### EOQ (경제적 주문량) ⭐\n주문비용 + 재고유지비용의 합이 **최소**가 되는 주문량.\n\n> 한 번에 많이 주문 → 주문 횟수 ↓ (주문비용 ↓) 근데 쌓아둠 (유지비 ↑)\n> 조금씩 자주 → 반대\n> 두 곡선이 만나는 지점이 EOQ.\n\n> 🚨 **EOQ에서는 연간 주문비용 = 연간 재고유지비용**임. 이 성질 물어봄.\n\n가정: 수요 일정 / 조달기간 일정 / 재고부족 없음\n\n### 재주문점\n= 조달기간 중 예상 수요 + **안전재고**\n\n## JIT vs MRP ⭐\n- **JIT**: 필요할 때 필요한 만큼. 재고 = 낭비. **풀(Pull)** 방식. **칸반**으로 신호\n- **MRP**: 생산계획에서 역산해 자재 준비. **푸시(Push)** 방식\n\n> 🚨 **JIT = Pull / MRP = Push.** 바꿔서 냄.\n> JIT 약점: 재고가 없으니 **공급 끊기면 라인 즉시 정지**. 코로나 때 반도체 없어서 자동차 못 만든 게 이거임.\n\n## 채찍효과 ⭐\n소비자 수요가 조금 변했는데 유통 단계를 거슬러 올라갈수록 **점점 크게 증폭**됨.\n> 채찍 손잡이는 조금 움직였는데 끝은 크게 휘두르는 모양이라 붙은 이름.\n\n원인: 수요 예측 왜곡 / 일괄주문 / **할인 행사** / 품절 무서워서 과대주문\n대책: **정보 공유** / 주문 단위 축소 / **EDLP(상시저가)**\n\n> 할인 행사가 원인인 게 포인트임. 쌀 때 왕창 사두니까 수요가 튀어 보임. 그래서 EDLP로 가격을 고정하면 변동이 줄어듦.\n\n▸ 칸반: 후공정이 전공정에 \"이만큼 필요\" 알리는 카드."},{"title":"⑫ 품질경영","sub":"경영학","body":"## 품질의 개념\n- **설계품질**: 제품을 어떻게 설계했는가\n- **적합품질**: 설계대로 만들어졌는가\n- **사용품질**: 고객이 쓰면서 느끼는 품질\n\n## 품질비용\n- **예방비용**: 불량을 막기 위한 비용. 교육, 설계 개선\n- **평가비용**: 검사와 시험 비용\n- **내부실패비용**: 출하 전에 발견된 불량. 재작업, 폐기\n- **외부실패비용**: 고객에게 간 뒤 발견된 불량. 리콜, 클레임, 신뢰 손상\n\n> 예방비용을 늘리면 실패비용이 크게 줄어듭니다. **뒤로 갈수록 비용이 기하급수적으로 커집니다.** 이것이 예방에 투자하라는 근거입니다.\n\n## TQM (전사적 품질경영)\n품질을 검사 부서만의 일이 아니라 **전 구성원의 일**로 봅니다.\n- 고객 중심\n- 전원 참여\n- **지속적 개선(카이젠)**\n- 사실에 근거한 의사결정\n\n> 기존 품질관리가 만든 뒤 걸러내는 것이었다면, TQM은 **처음부터 잘 만드는 것**으로 초점을 옮겼습니다.\n\n## 6시그마\n100만 개당 결함 **3.4개** 수준을 목표로 하는 품질 혁신 활동입니다.\n> 추진 절차는 **DMAIC**입니다. Define(정의) → Measure(측정) → Analyze(분석) → Improve(개선) → Control(관리)\n> 벨트 제도로 인력을 육성합니다. 챔피언, 마스터 블랙벨트, 블랙벨트, 그린벨트\n\n## 통계적 품질관리\n### 관리도\n공정이 안정적인지 보는 그래프입니다. 중심선과 관리상한선, 관리하한선을 그립니다.\n> 점이 관리한계를 벗어나면 **이상원인**이 있는 것으로 보고 조치합니다. 한계 안에서 흔들리는 것은 **우연원인**으로 보고 두어도 됩니다.\n\n### 표본검사와 전수검사\n- 전수검사: 모두 검사. 파괴검사에는 쓸 수 없음\n- 표본검사: 일부만 검사. 생산자위험과 소비자위험이 존재\n\n## ISO 9000\n품질경영시스템에 대한 국제 표준입니다. 제품 자체가 아니라 **품질을 관리하는 체계**를 인증합니다.\n> 제품 품질을 보증하는 것이 아니라는 점이 시험 포인트입니다.\n\n▸ 카이젠: 작은 개선을 지속적으로 쌓아가는 방식.\n▸ 우연원인: 공정에 늘 존재하는 자연스러운 변동.\n▸ 이상원인: 조치가 필요한 특별한 원인.","alt":"## 품질비용 4종 ⭐\n- **예방비용**: 불량 막으려는 비용 (교육, 설계)\n- **평가비용**: 검사·시험\n- **내부실패**: 출하 전 발견 (재작업, 폐기)\n- **외부실패**: 고객한테 간 뒤 발견 (**리콜, 클레임**)\n\n> 🚨 **뒤로 갈수록 비용이 기하급수로 커짐.**\n> 설계 단계에서 고치면 1원, 공장에서 고치면 10원, 고객이 발견하면 100원 + 브랜드 신뢰 손상.\n> 그래서 예방에 투자하라는 거임. 이 논리가 나옴.\n\n## TQM\n품질은 검사팀 일이 아니라 **전 직원 일**임.\n- 고객 중심 / 전원 참여 / **지속적 개선(카이젠)** / 사실 기반 의사결정\n\n> 🚨 기존 품질관리 = 만들고 나서 **걸러내기**\n> TQM = **처음부터 잘 만들기**\n> 초점이 옮겨간 게 핵심임.\n\n## 6시그마 ⭐\n목표: 100만 개당 결함 **3.4개**\n> 🚨 숫자 그대로 나옴. 3.4 PPM.\n\n절차 = **DMAIC**\n**D**efine → **M**easure → **A**nalyze → **I**mprove → **C**ontrol\n> 이 순서 물어봄. 정의-측정-분석-개선-관리.\n\n인력: 챔피언 / 마스터 블랙벨트 / 블랙벨트 / 그린벨트\n\n## 관리도\n공정이 안정적인지 보는 그래프. 중심선 + 관리상한 + 관리하한.\n> 🚨 **한계 벗어남 → 이상원인** → 조치해야 함\n> **한계 안에서 흔들림 → 우연원인** → 그냥 둬도 됨\n> 다 잡으려 들면 오히려 공정이 망가짐.\n\n## ISO 9000\n> 🚨 **제품 품질을 인증하는 게 아님.**\n> **품질을 관리하는 시스템**을 인증하는 거임.\n> \"ISO 인증 받으면 제품이 좋다는 뜻\" → 오답. 이거 함정.\n\n▸ 카이젠: 작은 개선을 계속 쌓기."},{"title":"⑬ 재무관리의 기초","sub":"경영학","body":"## 재무관리의 목표\n> **기업가치(주주 부)의 극대화**입니다. 이익 극대화가 아닙니다.\n\n이익 극대화를 목표로 하지 않는 이유는 세 가지입니다.\n- 이익은 회계 기준에 따라 달라질 수 있음\n- **시간가치**를 반영하지 못함\n- **위험**을 반영하지 못함\n\n## 화폐의 시간가치\n오늘의 1만원과 1년 뒤의 1만원은 다릅니다. 오늘 받으면 굴릴 수 있기 때문입니다.\n- **미래가치 FV = PV × (1 + r)^n**\n- **현재가치 PV = FV ÷ (1 + r)^n**\n\n> 이자율 10%일 때 1년 뒤 110만원의 현재가치는 110 ÷ 1.1 = 100만원입니다.\n\n### 연금과 영구연금\n- 연금: 일정 금액이 일정 기간 반복되는 현금흐름\n- **영구연금 현재가치 = C ÷ r**\n\n## 투자안 평가 방법\n### 순현재가치법(NPV)\n미래 현금흐름의 현재가치 합에서 투자액을 뺍니다.\n> **NPV > 0이면 채택**합니다. 여러 안 중에서는 NPV가 가장 큰 것을 고릅니다.\n> 가치가산의 원칙이 성립하고 기업가치 극대화 목표에 부합해 **이론적으로 가장 우수**한 방법으로 평가됩니다.\n\n### 내부수익률법(IRR)\nNPV를 0으로 만드는 할인율입니다.\n> **IRR > 자본비용이면 채택**합니다.\n> 한계: 현금흐름 부호가 여러 번 바뀌면 IRR이 복수로 나오거나 존재하지 않을 수 있고, 재투자수익률 가정이 비현실적입니다. NPV와 결론이 엇갈릴 수 있는데 이때는 **NPV를 따릅니다.**\n\n### 회수기간법\n투자금을 회수하는 데 걸리는 기간입니다. 간단하지만 **화폐의 시간가치를 무시**하고 회수 이후의 현금흐름도 무시합니다.\n\n### 수익성지수(PI)\n현금흐름 현재가치 ÷ 투자액. **PI > 1이면 채택**합니다. 투자 규모가 다른 안을 비교할 때 유용합니다.\n\n▸ 자본비용: 자금을 조달하는 데 드는 비용. 할인율로 쓰입니다.\n▸ 가치가산의 원칙: 여러 투자안의 가치를 더할 수 있다는 성질.\n▸ 현금흐름: 실제로 오가는 현금. 회계상 이익과 다릅니다.","alt":"## 재무관리 목표 ⭐\n> 🚨 **기업가치(주주 부)의 극대화.** **이익 극대화가 아님.**\n\n왜 이익 극대화가 아니냐?\n- 이익은 회계 기준 따라 **조작 가능**\n- **시간가치** 무시함 (올해 100억이랑 10년 뒤 100억이 같냐)\n- **위험** 무시함 (도박해서 번 100억이랑 안정적 100억이 같냐)\n\n이 세 가지가 그대로 선택지로 나옴.\n\n## 화폐의 시간가치\n오늘 1만원 ≠ 1년 뒤 1만원. 오늘 받으면 굴릴 수 있으니까.\n- **FV = PV × (1+r)ⁿ**\n- **PV = FV ÷ (1+r)ⁿ**\n\n> 이자율 10%, 1년 뒤 110만원 → 현재가치 = 110/1.1 = **100만원**\n\n- **영구연금 현재가치 = C ÷ r** (이건 공식 외워)\n\n## 투자안 평가 4방법 ⭐\n\n### NPV (순현재가치)\n미래 현금흐름 현재가치 합 − 투자액\n> **NPV > 0 → 채택.** 여러 개면 제일 큰 거.\n> **이론적으로 제일 우수**함. 기업가치 극대화 목표에 딱 맞으니까.\n\n### IRR (내부수익률)\nNPV를 0으로 만드는 할인율.\n> **IRR > 자본비용 → 채택**\n> 🚨 한계: 현금흐름 부호가 여러 번 바뀌면 IRR이 **여러 개** 나옴. 재투자 가정도 비현실적.\n> **NPV랑 결론 갈리면 NPV 따름.** 이거 나옴.\n\n### 회수기간법\n투자금 뽑는 데 걸리는 기간.\n> 🚨 **시간가치 무시** + 회수 후 현금흐름 무시. 간단한 대신 허술함.\n\n### 수익성지수(PI)\n현재가치 ÷ 투자액. **PI > 1 → 채택**\n> 투자 규모가 다른 안 비교할 때 유용.\n\n▸ 자본비용: 돈 빌려오는 비용. 할인율로 씀.\n▸ 현금흐름: 실제 오가는 현금. 회계 이익이랑 다름."},{"title":"⑭ 자본구조와 포트폴리오","sub":"경영학","body":"## 자본조달의 두 갈래\n- **자기자본**: 주식 발행. 갚을 의무가 없지만 배당과 지분 희석 부담\n- **타인자본**: 차입과 사채. 이자를 내야 하지만 **이자비용이 손금으로 인정되어 절세효과**가 있습니다\n\n## 가중평균자본비용(WACC)\n자기자본비용과 타인자본비용을 자본구조 비중으로 가중평균한 값입니다.\n> 타인자본비용은 **세후**로 계산합니다. 이자가 세금을 줄여주기 때문입니다.\n> WACC는 투자안 평가의 할인율로 쓰이며, WACC가 낮을수록 기업가치가 높아집니다.\n\n## MM 이론\n### 무관련 명제 (세금 없는 경우)\n완전자본시장에서는 **자본구조가 기업가치에 영향을 주지 않습니다.** 부채를 늘려도 기업가치는 그대로입니다.\n> 부채를 늘리면 값싼 타인자본 비중이 커지지만, 동시에 주주의 위험이 커져 자기자본비용이 올라가 상쇄됩니다.\n\n### 수정 명제 (법인세 고려)\n이자의 절세효과 때문에 **부채가 많을수록 기업가치가 커집니다.** 이론상 부채비율 100%가 최적이 됩니다.\n\n### 현실의 절충\n파산비용과 대리인비용을 고려하면 부채를 무한정 늘릴 수 없습니다. 절세효과와 파산비용이 균형을 이루는 지점에 **최적 자본구조**가 존재한다고 봅니다. 이를 **상충이론**이라고 합니다.\n\n## 레버리지\n- **영업레버리지**: 고정비 비중이 클수록 매출 변동에 따른 영업이익 변동이 커집니다\n- **재무레버리지**: 부채가 많을수록 영업이익 변동에 따른 순이익 변동이 커집니다\n- 결합레버리지 = 영업 × 재무\n\n> 레버리지는 이익도 손실도 함께 키웁니다. 좋기만 한 것이 아닙니다.\n\n## 포트폴리오 이론\n### 위험의 분류\n- **체계적 위험**: 시장 전체 요인. 금리, 경기, 전쟁. **분산으로 제거 불가**\n- **비체계적 위험**: 개별 기업 요인. 분산으로 제거 가능\n\n> 종목 수를 늘리면 비체계적 위험은 줄지만 일정 수준을 넘으면 감소 효과가 급격히 둔화됩니다. 체계적 위험이 바닥으로 남기 때문입니다.\n\n### 분산효과\n상관계수가 낮을수록 분산효과가 큽니다. **-1이면 위험을 완전히 제거**할 수 있습니다.\n\n### CAPM\n> **기대수익률 = 무위험이자율 + 베타 × (시장수익률 − 무위험이자율)**\n\n베타는 시장 대비 민감도입니다. 1보다 크면 공격적, 작으면 방어적입니다.\n> 무위험이자율 3%, 시장위험프리미엄 6%, 베타 1.2면 → 3 + 1.2 × 6 = **10.2%**\n\n### 배당이론\n- **배당무관련설(MM)**: 완전시장에서 배당정책은 기업가치와 무관\n- **고객효과**: 투자자마다 선호하는 배당 정책이 달라 그에 맞는 주주가 모임\n- **신호효과**: 배당 증가는 경영진이 미래를 긍정적으로 본다는 신호로 해석됨\n\n▸ 손금: 세법상 비용으로 인정되어 소득을 줄여주는 항목.\n▸ 대리인비용: 주주와 경영자, 채권자 사이의 이해 충돌에서 생기는 비용.\n▸ 베타: 시장 변동에 대한 개별 자산의 민감도.","alt":"## 돈 조달하는 2가지\n- **자기자본**(주식): 갚을 의무 없음. 근데 배당 줘야 하고 지분 나눠야 함\n- **타인자본**(빚): 이자 내야 함. 근데 **이자가 비용 처리돼서 세금이 줄어듦(절세효과)**\n\n## WACC\n자기자본비용 + 타인자본비용을 비중으로 가중평균.\n> 🚨 타인자본비용은 **세후**로 계산함. 이자가 세금 깎아주니까.\n> WACC 낮을수록 기업가치 높음.\n\n## MM 이론 ⭐\n### 무관련 명제 (세금 없을 때)\n> **자본구조는 기업가치와 무관.** 빚을 늘려도 가치 그대로.\n>\n> 왜? 빚이 싸긴 한데, 빚이 늘면 주주가 위험해져서 **자기자본비용이 올라감.** 딱 상쇄됨.\n\n### 수정 명제 (법인세 있을 때)\n이자 절세효과 때문에 **빚 많을수록 가치 ↑.** 이론상 부채 100%가 최적.\n\n### 현실\n> 🚨 근데 진짜 100% 빚으로 하면? 망함.\n> **파산비용 + 대리인비용** 때문임. 그래서 절세효과랑 파산비용이 균형 잡히는 지점에 **최적 자본구조**가 있음 = **상충이론**\n\n## 레버리지\n- **영업레버리지**: **고정비** 클수록 영업이익 변동 큼\n- **재무레버리지**: **부채** 많을수록 순이익 변동 큼\n- 결합 = 둘 곱하기\n\n> 🚨 레버리지는 **이익도 손실도 같이** 키움. 좋기만 한 게 아님.\n\n## 포트폴리오\n### 위험 2종\n- **체계적**: 시장 전체. 금리, 경기, 전쟁. **분산으로 제거 불가**\n- **비체계적**: 개별 기업. 분산으로 제거 가능\n\n> 종목 늘리면 비체계적 위험은 줄어듦. 근데 30개쯤 넘으면 효과 거의 없음. 체계적 위험이 바닥으로 깔려 있으니까.\n\n### 분산효과\n상관계수 낮을수록 큼. **-1이면 위험 완전 제거** 가능.\n\n### CAPM ⭐\n> **기대수익률 = 무위험이자율 + 베타 × (시장수익률 − 무위험이자율)**\n\n무위험 3%, 시장프리미엄 6%, 베타 1.2\n→ 3 + 1.2×6 = **10.2%**\n\n베타 1보다 크면 공격적, 작으면 방어적.\n\n## 배당이론\n- **MM 배당무관련설**: 완전시장이면 배당정책 무관\n- **고객효과**: 배당 좋아하는 사람끼리 모임\n- **신호효과**: 배당 늘리면 \"회사가 자신 있나 보다\" 신호로 읽힘\n\n▸ 손금: 세법상 비용 인정되는 항목."},{"title":"⑮ 회계의 기초","sub":"경영학","body":"## 회계등식\n> **자산 = 부채 + 자본**\n\n이것이 재무상태표의 뼈대입니다. 왼쪽에 자산, 오른쪽에 부채와 자본을 놓아 항상 균형을 이룹니다.\n> 자산에서 부채를 뺀 것이 자본, 즉 순자산입니다.\n\n## 재무제표 다섯 가지\n- **재무상태표**: **일정 시점**의 자산·부채·자본. 저량(stock)\n- **손익계산서**: **일정 기간**의 수익·비용·이익. 유량(flow)\n- **현금흐름표**: 일정 기간의 현금 유출입. 영업·투자·재무활동으로 구분\n- **자본변동표**: 일정 기간의 자본 변동\n- **주석**: 본문에 담지 못한 설명\n\n> 시점을 보는 것은 **재무상태표 하나뿐**입니다. 이 구분을 묻는 문제가 자주 나옵니다.\n\n## 발생주의\n현금이 오갔는지가 아니라 **거래가 발생한 시점**에 수익과 비용을 인식합니다.\n> 12월에 물건을 팔고 대금은 1월에 받아도 매출은 12월에 잡습니다.\n> 발생주의 때문에 매출채권, 미지급비용, 선급비용 같은 계정이 생깁니다.\n> 그리고 **이익이 났는데 현금이 없는** 상황이 생길 수 있습니다. 흑자도산의 원인입니다.\n\n## 수익·비용 대응의 원칙\n수익을 인식한 기간에 그 수익을 얻기 위해 쓴 비용을 함께 인식합니다.\n\n## 계정의 분류\n- **자산**: 유동자산(당좌자산, 재고자산), 비유동자산(투자·유형·무형자산)\n- **부채**: 유동부채(1년 내 만기), 비유동부채\n- **자본**: 자본금, 자본잉여금, 이익잉여금 등\n\n> 유동과 비유동을 가르는 기준은 **1년** 또는 정상영업주기입니다.\n\n## 감가상각\n유형자산의 취득원가를 사용 기간에 나누어 비용으로 배분하는 절차입니다.\n> 자산의 가치를 평가하는 것이 아니라 **원가를 배분**하는 것입니다. 이 표현이 그대로 나옵니다.\n\n- **정액법** = (취득원가 − 잔존가치) ÷ 내용연수\n- **정률법**: 기초 장부금액에 일정률을 곱함. 초기에 비용이 크게 잡힘\n- 생산량비례법\n\n> 취득원가 1,000만, 잔존가치 100만, 내용연수 5년 → 정액법 연 **180만원**\n\n## 재고자산 평가\n- **선입선출법(FIFO)**: 먼저 산 것부터 팔린 것으로 봄\n- **후입선출법(LIFO)**: 나중에 산 것부터. **한국채택국제회계기준에서는 인정되지 않습니다**\n- 가중평균법\n\n> 물가 상승기에 선입선출법을 쓰면 싼 재고가 먼저 나가므로 **매출원가가 낮고 이익과 기말재고가 높게** 나타납니다.\n\n▸ 매출채권: 팔았지만 아직 못 받은 돈.\n▸ 흑자도산: 장부상 이익은 났는데 현금이 없어 망하는 것.\n▸ 잔존가치: 내용연수가 끝났을 때 남을 것으로 보는 가치.","alt":"## 회계등식\n> **자산 = 부채 + 자본**\n왼쪽 자산, 오른쪽 부채+자본. 항상 균형.\n자산 − 부채 = 자본(순자산).\n\n## 재무제표 5개 ⭐\n- **재무상태표**: **일정 시점**. 저량\n- **손익계산서**: 일정 기간. 유량\n- **현금흐름표**: 기간. 영업·투자·재무 3구분\n- **자본변동표**: 기간\n- **주석**\n\n> 🚨 **시점을 보는 건 재무상태표 하나뿐임.** 나머지 다 기간.\n> \"일정 시점의 재무상태를 나타내는 것은?\" → 재무상태표. 이거 무조건 나옴.\n\n## 발생주의 ⭐\n현금이 아니라 **거래가 발생한 때** 인식.\n> 12월에 팔고 돈은 1월에 받음 → 매출은 **12월**에 잡음.\n\n> 🚨 그래서 **이익은 났는데 통장에 돈이 없는** 일이 생김.\n> 이게 **흑자도산**임. 장부는 흑자인데 당장 줄 돈이 없어서 망하는 거.\n> 매출채권, 미지급비용, 선급비용 같은 계정이 다 발생주의 때문에 생김.\n\n## 계정 분류\n- 자산: 유동(당좌·재고) / 비유동(투자·유형·무형)\n- 부채: 유동 / 비유동\n- 자본: 자본금, 자본잉여금, 이익잉여금\n\n> 유동/비유동 가르는 기준 = **1년** 또는 정상영업주기\n\n## 감가상각 ⭐\n> 🚨 **가치 평가가 아니라 원가 배분임.**\n> \"자산의 가치를 평가하는 절차\" → **오답.** 얼마짜리인지 재는 게 아니라 산 값을 기간에 나눠 뿌리는 거임.\n\n- **정액법 = (취득원가 − 잔존가치) ÷ 내용연수**\n- **정률법**: 초기에 비용 많이 잡힘\n- 생산량비례법\n\n> 1000만 / 잔존 100만 / 5년 → (1000−100)/5 = **연 180만원**\n> 🚨 잔존가치 빼는 거 까먹지 마셈. 200만원 나오면 틀린 거임.\n\n## 재고자산 평가\n- **선입선출(FIFO)**: 먼저 산 거 먼저 나감\n- **후입선출(LIFO)**: 🚨 **한국채택국제회계기준(K-IFRS)에서 인정 안 됨**\n- 가중평균법\n\n> 🚨 물가 오를 때 선입선출 쓰면?\n> 싼 거 먼저 나감 → **매출원가 낮음 → 이익 높음 → 기말재고도 높음**\n> 방향 하나만 잡으면 나머지가 따라옴.\n\n▸ 흑자도산: 장부는 흑자인데 현금 없어서 망함."},{"title":"⑯ 재무비율과 원가분석","sub":"경영학","body":"## 재무비율 네 갈래\n### 유동성 비율 (단기 지급능력)\n- **유동비율 = 유동자산 ÷ 유동부채**. 200% 이상이면 양호하다고 봅니다\n- **당좌비율 = 당좌자산 ÷ 유동부채**. 재고자산을 뺀 것이라 더 엄격합니다\n\n> 재고는 당장 현금으로 바꾸기 어렵기 때문에 빼고 보는 것입니다.\n\n### 안정성(레버리지) 비율\n- **부채비율 = 부채총계 ÷ 자기자본**. 100% 이하가 안정적\n- 이자보상비율 = 영업이익 ÷ 이자비용. **1 미만이면 영업이익으로 이자도 못 냅니다**\n\n### 수익성 비율\n- **ROE = 당기순이익 ÷ 자기자본**. 주주 관점\n- **ROA = 당기순이익 ÷ 총자산**. 자산 활용 관점\n- 매출액순이익률 = 당기순이익 ÷ 매출액\n\n### 활동성 비율\n- 총자산회전율 = 매출액 ÷ 총자산\n- 재고자산회전율 = 매출원가 ÷ 평균재고. 높을수록 재고가 빨리 돕니다\n\n## 듀폰 분석\n> **ROE = 매출액순이익률 × 총자산회전율 × (총자산 ÷ 자기자본)**\n\n수익성, 활동성, 레버리지 세 요소로 ROE를 분해합니다. ROE가 높아도 그것이 레버리지 때문인지 진짜 수익성 때문인지 구분할 수 있습니다.\n\n## 원가의 분류\n- **고정비 vs 변동비**: 조업도에 따라 변하는가\n- **직접비 vs 간접비**: 특정 제품에 직접 추적할 수 있는가\n- **제품원가 vs 기간원가**\n\n> 직접재료비 + 직접노무비 + 제조간접비 = **제조원가**\n\n## 손익분기점(BEP)\n> **BEP 판매량 = 고정비 ÷ (단위당 판매가 − 단위당 변동비)**\n> 분모를 **단위당 공헌이익**이라고 합니다.\n\n고정비 1,000만원, 판매가 5만원, 변동비 3만원이면\n→ 공헌이익 2만원 → BEP = 1,000만 ÷ 2만 = **500개**\n\n### 목표이익 달성 판매량\n> **(고정비 + 목표이익) ÷ 단위당 공헌이익**\n\n### 공헌이익률\n= 공헌이익 ÷ 매출액. 금액 기준 BEP를 구할 때 씁니다.\n> **BEP 매출액 = 고정비 ÷ 공헌이익률**\n\n## 안전한계\n실제 매출이 손익분기점을 얼마나 넘어서는지를 나타냅니다. 클수록 여유가 있습니다.\n\n▸ 공헌이익: 매출에서 변동비를 뺀 것. 고정비 회수에 기여하는 몫.\n▸ 조업도: 생산이나 판매의 수준.\n▸ 이자보상비율: 영업이익으로 이자를 몇 배 감당할 수 있는지.","alt":"## 재무비율 4갈래\n\n### 유동성 (단기 지급능력)\n- **유동비율 = 유동자산 ÷ 유동부채** (200% 이상 양호)\n- **당좌비율 = 당좌자산 ÷ 유동부채**\n\n> 🚨 차이는 **재고자산**임. 당좌비율은 재고를 뺌.\n> 재고는 당장 현금화가 안 되니까. 더 빡센 기준임.\n\n### 안정성\n- **부채비율 = 부채 ÷ 자기자본** (100% 이하 안정)\n- **이자보상비율 = 영업이익 ÷ 이자비용**\n> 🚨 **1 미만이면 영업해서 번 돈으로 이자도 못 냄.** 좀비기업임.\n\n### 수익성\n- **ROE = 순이익 ÷ 자기자본** (주주 관점)\n- **ROA = 순이익 ÷ 총자산** (자산 관점)\n\n> 🚨 ROE랑 ROA 분모 바꿔서 냄. E는 Equity(자기자본), A는 Asset(자산).\n\n### 활동성\n- 총자산회전율 = 매출액 ÷ 총자산\n- 재고자산회전율 = 매출원가 ÷ 평균재고 (높을수록 잘 돎)\n\n## 듀폰 분석 ⭐\n> **ROE = 매출액순이익률 × 총자산회전율 × (총자산÷자기자본)**\n> = 수익성 × 활동성 × **레버리지**\n\n> 🚨 왜 쓰냐면, ROE가 높아도 그게 **진짜 잘해서인지 빚 왕창 써서인지** 구분하려고.\n> 마지막 항이 레버리지라 빚만 늘려도 ROE가 올라감. 그래서 쪼개보는 거임.\n\n## 원가 분류\n- 고정비 vs 변동비 (조업도 따라 변하나)\n- 직접비 vs 간접비 (제품에 직접 추적되나)\n> **직접재료비 + 직접노무비 + 제조간접비 = 제조원가**\n\n## 손익분기점 ⭐ (계산 무조건 나옴)\n> **BEP 수량 = 고정비 ÷ 단위당 공헌이익**\n> **단위당 공헌이익 = 판매가 − 변동비**\n\n고정비 1000만 / 판매가 5만 / 변동비 3만\n→ 공헌이익 = 2만\n→ BEP = 1000만 ÷ 2만 = **500개**\n\n### 목표이익 있으면\n> **(고정비 + 목표이익) ÷ 단위당 공헌이익**\n> 고정비에 목표이익을 더해서 똑같이 나누면 됨.\n\n### 금액으로 구하려면\n> **BEP 매출액 = 고정비 ÷ 공헌이익률**\n> (공헌이익률
