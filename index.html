\n▸ 인덱스 투자: 지수를 그대로 따라가도록 투자하는 방식."},{"sub":"포트폴리오","q":"자산배분이 투자성과에 미치는 영향에 관한 일반적인 연구 결과로 옳은 것은?","o":["종목 선택이 성과의 대부분을 결정한다","자산배분이 장기 성과 변동의 상당 부분을 설명한다","매매 시점이 유일한 결정 요인이다","성과는 무작위로만 결정된다"],"a":1,"e":"여러 연구에서 장기 성과 차이의 큰 부분은 '무엇을 샀느냐'보다 '주식과 채권에 각각 얼마나 담았느냐'로 설명된다고 나옵니다.\n개별 종목을 잘 고르는 것도 도움이 되지만, 애초에 주식 비중을 80%로 두었느냐 20%로 두었느냐가 훨씬 큰 차이를 만듭니다. 그래서 실무에서는 자산배분을 먼저 정하고 종목 선택을 나중에 봅니다.\n\n▸ 자산배분 효과: 자산군별 비중이 성과에 미치는 영향.\n▸ 종목선택 효과: 같은 자산군 안에서 무엇을 골랐는지가 만드는 차이."},{"sub":"포트폴리오","q":"위험회피형 투자자의 특성으로 옳은 것은?","o":["같은 기대수익률이면 위험이 낮은 쪽을 선택한다","위험이 클수록 무조건 선호한다","기대수익률에 관심이 없다","항상 무위험자산만 보유한다"],"a":0,"e":"대부분의 투자자는 위험회피형입니다. 위험을 아예 안 지겠다는 뜻이 아니라, 위험을 지려면 그만한 보상을 요구한다는 뜻입니다.\n기대수익률이 똑같이 8%인 두 상품이 있는데 하나는 안정적이고 하나는 심하게 출렁인다면 안정적인 쪽을 고릅니다. 출렁이는 쪽을 고르게 하려면 기대수익률을 더 높여줘야 합니다. 그 추가분이 위험프리미엄입니다.\n\n▸ 위험회피형: 같은 조건이면 위험이 적은 쪽을 택하는 성향.\n▸ 위험프리미엄: 위험을 감수한 대가로 요구하는 추가 수익."},{"sub":"포트폴리오","q":"분산투자에서 종목 수를 계속 늘릴 때 나타나는 현상으로 옳은 것은?","o":["위험이 0이 될 때까지 계속 줄어든다","일정 수준을 넘으면 위험 감소 효과가 크게 둔화된다","종목 수와 위험은 무관하다","종목 수가 늘수록 위험이 커진다"],"a":1,"e":"종목을 5개에서 10개로 늘리면 위험이 눈에 띄게 줄어듭니다. 그런데 30개에서 50개로 늘리면 거의 차이가 없습니다.\n개별 기업 위험은 계속 줄어들지만 시장 전체 위험은 남기 때문에, 아무리 많이 담아도 그 아래로는 내려가지 않습니다. 관리 부담과 수수료만 늘어나므로 무작정 종목 수를 늘리는 것이 답은 아닙니다.\n\n▸ 한계효과 체감: 같은 행동을 반복할수록 추가 효과가 줄어드는 현상."},{"sub":"파생상품","q":"선물거래에 관한 설명으로 옳은 것은?","o":["미래의 특정 시점에 정해진 가격으로 사고팔기로 지금 약속하는 계약이다","현물을 즉시 주고받는 거래이다","권리만 있고 의무는 없다","만기가 없다"],"a":0,"e":"농부가 가을에 수확할 쌀값이 떨어질까 걱정한다고 해봅시다. 봄에 미리 '가을에 이 가격으로 팔겠다'고 약속해두면 마음이 놓입니다. 이것이 선물의 출발입니다.\n선물은 미래의 거래 가격을 지금 확정하는 계약입니다. 중요한 것은 약속이라 반드시 지켜야 한다는 점입니다. 가격이 유리하게 움직여도 계약대로 해야 합니다. 이 점에서 '안 해도 되는' 옵션과 다릅니다.\n\n▸ 파생상품: 다른 자산의 가격에서 값이 파생되어 나오는 상품.\n▸ 현물: 지금 당장 주고받는 실제 자산.\n▸ 기초자산: 파생상품의 기준이 되는 대상. 주가지수, 금리, 환율, 원자재 등."},{"sub":"파생상품","q":"옵션과 선물의 가장 큰 차이는?","o":["옵션 매수자는 권리만 가지고 의무는 없다","옵션은 만기가 없다","선물은 프리미엄을 지급한다","옵션은 거래소에서 거래되지 않는다"],"a":0,"e":"선물은 양쪽 다 의무를 집니다. 만기가 되면 무조건 사거나 팔아야 합니다.\n옵션은 다릅니다. 옵션을 산 사람은 '하고 싶으면 한다'는 권리만 가집니다. 유리하면 행사하고 불리하면 그냥 버리면 됩니다. 대신 그 권리를 사는 값으로 프리미엄을 미리 냅니다. 최악의 손실은 이 프리미엄뿐입니다.\n반대로 옵션을 판 사람은 프리미엄을 받는 대신, 상대가 행사하겠다고 하면 무조건 응해야 하는 의무를 집니다.\n\n▸ 프리미엄: 옵션을 사는 데 지불하는 값.\n▸ 행사: 옵션에 붙은 권리를 실제로 사용하는 것.\n▸ 매도자(발행자): 옵션을 판 사람. 의무만 지고 권리는 없습니다."},{"sub":"파생상품","q":"콜옵션 매수자가 이익을 보는 상황은?","o":["기초자산 가격이 행사가격보다 크게 오를 때","기초자산 가격이 크게 떨어질 때","기초자산 가격이 전혀 움직이지 않을 때","금리가 하락할 때"],"a":0,"e":"콜옵션은 '정해진 가격에 살 수 있는 권리'입니다.\n행사가격이 1만원인 콜옵션을 샀는데 주가가 1만 5천원이 되었다면, 1만원에 사서 1만 5천원에 팔 수 있으니 이득입니다. 반대로 주가가 8천원으로 떨어졌다면 굳이 1만원에 살 이유가 없으니 권리를 버립니다. 이때 손실은 처음 낸 프리미엄뿐입니다.\n'살 권리'가 콜, '팔 권리'가 풋입니다. 오를 것 같으면 콜을 사고 내릴 것 같으면 풋을 삽니다.\n\n▸ 행사가격: 옵션에 정해진 사거나 팔 가격.\n▸ 콜옵션: 살 권리.\n▸ 풋옵션: 팔 권리."},{"sub":"파생상품","q":"선물거래에서 증거금 제도를 두는 주된 이유는?","o":["계약 불이행 위험을 줄이기 위해","수수료를 걷기 위해","세금을 매기기 위해","거래량을 줄이기 위해"],"a":0,"e":"선물은 지금 돈을 다 내지 않고 미래에 정산합니다. 그러다 보니 손실이 커진 쪽이 약속을 안 지키고 도망갈 위험이 있습니다.\n그래서 거래를 시작할 때 일정 금액을 맡겨두게 합니다. 이것이 증거금입니다. 매일 손익을 계산해 증거금에서 빼고 더하며, 잔액이 기준 아래로 떨어지면 추가로 채워 넣으라고 요구합니다. 채우지 못하면 강제로 청산됩니다.\n\n▸ 증거금: 계약 이행을 보증하기 위해 맡기는 돈.\n▸ 일일정산: 매일 손익을 계산해 증거금에 반영하는 것.\n▸ 마진콜: 증거금이 부족해 추가 납입을 요구받는 것.\n▸ 청산: 포지션을 정리해 거래를 끝내는 것."},{"sub":"파생상품","q":"헤지(hedge) 거래의 목적으로 옳은 것은?","o":["보유 자산의 가격 변동 위험을 줄이는 것","최대한 큰 수익을 노리는 것","시장을 조작하는 것","거래 횟수를 늘리는 것"],"a":0,"e":"헤지는 우리말로 '울타리를 친다'는 뜻입니다. 이미 갖고 있는 자산이 손해 볼 상황에 대비해 반대 방향 거래를 걸어두는 것입니다.\n예를 들어 주식을 많이 들고 있는데 폭락이 걱정된다면, 주가지수 선물을 매도해 둡니다. 주가가 떨어지면 주식에서 손해를 보지만 선물에서 이익이 나 상쇄됩니다. 대신 주가가 오르면 주식 이익이 선물 손실에 깎입니다. 수익을 키우는 게 아니라 결과를 안정시키는 것이 목적입니다.\n\n▸ 헤지: 위험을 상쇄하기 위한 반대 방향 거래.\n▸ 투기: 가격 변동에서 이익을 얻으려는 거래.\n▸ 차익거래: 같은 자산의 가격 차이를 이용해 위험 없이 이익을 얻는 거래."},{"sub":"파생상품","q":"스왑거래에 관한 설명으로 옳은 것은?","o":["미래의 현금흐름을 서로 교환하기로 약정하는 계약이다","주식을 즉시 매매하는 계약이다","보험계약의 일종이다","만기에 원금만 교환한다"],"a":0,"e":"스왑은 '바꾼다'는 뜻입니다. 서로에게 유리하도록 미래에 주고받을 돈의 흐름을 맞바꾸는 계약입니다.\n대표적인 것이 금리스왑입니다. A기업은 변동금리로 돈을 빌렸는데 금리가 오를까 걱정이고, B기업은 고정금리로 빌렸는데 금리가 내릴 것 같아 아쉽습니다. 두 회사가 이자 지급 의무를 서로 바꾸면 둘 다 원하는 형태가 됩니다. 통화를 바꾸는 통화스왑도 있습니다.\n\n▸ 현금흐름: 시간에 따라 들어오고 나가는 돈의 흐름.\n▸ 변동금리: 시장 금리에 따라 바뀌는 이자율.\n▸ 고정금리: 처음 정한 이자율이 만기까지 유지되는 것."},{"sub":"파생상품","q":"풋옵션 매수자에게 유리한 상황은?","o":["기초자산 가격이 크게 상승할 때","기초자산 가격이 크게 하락할 때","가격이 전혀 변하지 않을 때","만기가 길어질 때만"],"a":1,"e":"풋옵션은 '정해진 가격에 팔 수 있는 권리'입니다.\n행사가격 1만원인 풋옵션을 샀는데 주가가 6천원으로 떨어졌다면, 시장에서 6천원에 사서 1만원에 팔 수 있으니 이익입니다. 주가가 오르면 권리를 안 쓰면 그만이고 손실은 프리미엄까지입니다.\n그래서 주식을 보유한 사람이 하락에 대비해 풋옵션을 사두는 것을 보험에 든다고 표현합니다.\n\n▸ 내재가치: 지금 당장 행사했을 때 얻는 이익.\n▸ 시간가치: 만기까지 남은 기간 동안 유리해질 가능성의 값."},{"sub":"파생상품","q":"선도거래(Forward)와 선물거래(Futures)의 차이로 옳은 것은?","o":["선도는 당사자 간 맞춤 계약이고 선물은 거래소의 표준화된 계약이다","선도가 거래소에서 거래된다","선물은 계약 조건을 자유롭게 정한다","둘은 완전히 같다"],"a":0,"e":"둘 다 미래 가격을 미리 정하는 계약이라는 점은 같습니다. 차이는 어디서 어떻게 거래되느냐입니다.\n선도는 두 당사자가 직접 만나 '수량은 얼마, 만기는 언제'를 자유롭게 정합니다. 맞춤옷 같은 것이라 편리하지만 상대가 약속을 안 지킬 위험이 있습니다. 선물은 거래소가 수량과 만기를 미리 규격화해두고 청산소가 이행을 보증합니다. 기성복 같아서 내 사정에 딱 맞지는 않지만 안전하고 사고팔기 쉽습니다.\n\n▸ 표준화: 계약 조건을 일정한 규격으로 통일하는 것.\n▸ 청산소: 거래 이행을 보증하는 기관.\n▸ 신용위험: 상대방이 약속을 지키지 못할 위험."},{"sub":"파생상품","q":"베이시스(basis)의 정의로 옳은 것은?","o":["선물가격과 현물가격의 차이","두 주식 가격의 합","옵션 프리미엄의 총액","금리와 환율의 곱"],"a":0,"e":"같은 물건인데 지금 사는 가격과 나중에 받기로 하고 사는 가격은 다릅니다. 보관비용이나 이자 때문입니다. 이 두 가격의 차이를 베이시스라고 합니다.\n정상적으로는 선물가격이 현물보다 조금 높습니다. 그 사이 돈을 묶어두는 이자와 보관비가 붙기 때문입니다. 만기가 다가올수록 이 차이는 줄어들어 만기에는 0이 됩니다.\n\n▸ 베이시스: 선물가격에서 현물가격을 뺀 값.\n▸ 콘탱고: 선물가격이 현물보다 높은 상태.\n▸ 백워데이션: 선물가격이 현물보다 낮은 상태."},{"sub":"파생상품","q":"옵션 매도자의 손익 구조에 관한 설명으로 옳은 것은?","o":["이익은 프리미엄으로 제한되고 손실은 크게 확대될 수 있다","이익과 손실이 모두 제한된다","손실은 없고 이익만 있다","프리미엄을 지급한다"],"a":0,"e":"옵션 매수자와 매도자의 처지는 정확히 뒤집혀 있습니다.\n매수자는 프리미엄만 잃을 수 있고 이익은 크게 날 수 있습니다. 매도자는 반대로 프리미엄을 챙기는 것이 이익의 전부이고, 시장이 크게 반대로 움직이면 손실이 눈덩이처럼 불어납니다.\n그래서 옵션 매도는 '푼돈을 줍다가 큰돈을 잃을 수 있는' 전략으로 불리며, 거래소는 매도자에게 증거금을 요구합니다.\n\n▸ 손익 구조: 가격 변화에 따라 이익과 손실이 어떻게 달라지는지의 모양.\n▸ 무제한 손실: 이론상 상한이 없는 손실."},{"sub":"파생상품","q":"주가지수 선물을 매도하는 헤지 전략이 적합한 상황은?","o":["주식 포트폴리오를 보유한 상태에서 시장 하락이 우려될 때","현금만 보유하고 있을 때","주가 상승이 확실할 때","채권만 보유할 때"],"a":0,"e":"주식을 잔뜩 들고 있는 사람이 '시장이 곧 빠질 것 같은데 세금이나 매매비용 때문에 다 팔기는 부담스럽다'고 할 때 쓰는 방법입니다.\n주가지수 선물을 매도해두면 시장이 실제로 떨어졌을 때 선물에서 이익이 나 주식 손실을 메워줍니다. 주식을 팔지 않고도 하락 위험만 덜어내는 효과가 있습니다.\n\n▸ 매도 헤지: 보유 자산의 가격 하락에 대비해 선물을 파는 것.\n▸ 매수 헤지: 앞으로 살 예정인 자산의 가격 상승에 대비해 선물을 사는 것."},{"sub":"파생상품","q":"파생상품의 경제적 기능으로 보기 어려운 것은?","o":["위험의 이전","가격 발견","유동성 공급","원금 보장"],"a":3,"e":"파생상품은 위험을 없애는 도구가 아니라 위험을 옮기는 도구입니다. 위험을 피하고 싶은 사람이 위험을 감수하려는 사람에게 넘기는 장치입니다.\n또한 선물시장의 가격은 시장 참가자들이 미래를 어떻게 보는지를 보여주어 가격 발견 기능을 하고, 적은 돈으로 큰 거래를 할 수 있어 시장에 유동성을 공급합니다. 다만 원금을 보장해주는 기능은 없으며 오히려 손실이 원금을 넘을 수도 있습니다.\n\n▸ 위험의 이전: 위험을 다른 참가자에게 넘기는 것.\n▸ 가격 발견: 거래를 통해 적정 가격이 드러나는 기능.\n▸ 유동성: 원할 때 쉽게 사고팔 수 있는 정도."}],"notes":[{"sub":"세제","title":"① 세금의 기본 구조","body":"## 국세와 지방세\n- **국세**: 소득세, 법인세, 부가가치세, 상속세, 증여세, 종합부동산세\n- **지방세**: 취득세, 재산세, 자동차세, 주민세\n\n> 부동산을 **살 때(취득세)와 갖고 있을 때(재산세)**는 지방세, **팔아서 이익이 났을 때(양도소득세)**는 국세입니다. 이 구분이 자주 나옵니다.\n\n## 소득세의 과세 방식\n우리 소득세법은 **열거주의**입니다. 법에 적힌 소득만 과세합니다.\n> 다만 이자소득과 배당소득은 **유형별 포괄주의**를 씁니다. 금융상품이 계속 새로 나와서 목록으로 따라잡을 수 없기 때문입니다.\n\n열거된 소득은 이자, 배당, 사업, 근로, 연금, 기타, 양도, 퇴직 여덟 가지입니다.\n\n## 납세의무의 성립시기\n- **소득세**: 과세기간이 끝나는 때, 즉 12월 31일\n- **취득세**: 재산을 취득하는 때\n- **원천징수하는 소득세**: 소득을 지급하는 때\n\n> 소득세는 1년치를 모아 정산하는 구조라 기간이 끝나야 의무가 생깁니다.\n\n## 국세부과의 원칙\n- **실질과세**: 명의가 아니라 실제로 번 사람에게 과세\n- **근거과세**: 장부와 증빙에 근거\n- **신의성실**: 과세관청과 납세자 모두에게 적용\n- **세무공무원 재량의 한계**\n\n> 네 가지입니다. \"납세자 편의의 원칙\" 같은 것이 껴 나오면 오답입니다.\n\n▸ 원천징수: 돈을 주는 쪽이 세금을 미리 떼고 나머지만 주는 것.\n▸ 과세기간: 세금을 계산하는 기간 단위. 소득세는 1월 1일부터 12월 31일까지.\n▸ 실질과세: 형식보다 실질을 보고 과세하는 원칙.","alt":"## 국세 vs 지방세\n- **국세**: 소득세, 법인세, 부가세, 상속·증여세, 종부세\n- **지방세**: 취득세, 재산세, 자동차세, 주민세\n\n> 🚨 외우는 요령\n> 부동산 **살 때(취득세) / 갖고 있을 때(재산세)** → **지방세**\n> **팔아서 이익 났을 때(양도세)** → **국세**\n> 시청이 걷냐 나라가 걷냐로 갈림.\n\n## 소득세 과세 방식\n> 🚨 **열거주의**가 원칙. 법에 적힌 것만 세금 매김.\n> 근데 **이자·배당만 유형별 포괄주의**임. 금융상품이 매년 새로 나오는데 법으로 일일이 못 따라잡으니까 \"비슷한 거면 다 과세\"로 열어둔 거임.\n\n열거 소득 8개: 이자 / 배당 / 사업 / 근로 / 연금 / 기타 / 양도 / 퇴직\n\n## 납세의무 성립시기\n- 소득세 → **과세기간 끝나는 때 (12/31)**\n- 취득세 → 취득하는 때\n- 원천징수 소득세 → **지급하는 때**\n\n> 소득세는 1년치 몰아서 정산하니까 연말이 되어야 의무가 생김. 논리로 이해하면 안 까먹음.\n\n## 국세부과 원칙 4개\n**실질과세 / 근거과세 / 신의성실 / 재량의 한계**\n\n> 🚨 \"납세자 편의의 원칙\" 같은 그럴듯한 게 껴 나오면 그게 답임. 없는 원칙임.\n> 실질과세는 명의 빌려서 세금 피하는 거 막으려고 있는 거임.\n\n▸ 원천징수: 주는 쪽이 미리 떼고 주는 것."},{"sub":"세제","title":"② 금융소득과 절세상품","body":"## 금융소득 종합과세\n이자와 배당을 합쳐 **금융소득**이라고 합니다.\n> 연 **2천만원 이하** → 14% 원천징수로 끝 (분리과세)\n> 연 **2천만원 초과** → 초과분을 다른 소득과 합산해 누진세율 적용 (종합과세)\n\n원천징수세율은 14%이고 지방소득세 1.4%를 더해 실제로는 **15.4%**가 떼입니다.\n\n## 이중과세 조정\n회사가 법인세를 내고 남은 돈을 배당하면 주주가 또 배당소득세를 냅니다. 같은 돈에 두 번 과세되는 셈입니다.\n> 이를 덜어주려고 **배당세액공제**를 둡니다. 종합과세될 때 회사가 이미 낸 법인세 일부를 주주의 세금에서 빼줍니다.\n\n## 주식 양도 관련\n- **증권거래세**: 팔 때 이익 여부와 무관하게 매도금액에 부과\n- **양도소득세**: 이익에 부과하되, 상장주식을 장내에서 파는 **소액주주**는 과세되지 않습니다\n\n> 대주주 요건에 해당하면 양도소득세를 냅니다. 소액주주와 대주주의 취급이 다르다는 점이 핵심입니다.\n\n## 펀드 수익의 소득 구분\n펀드에서 난 이익은 **배당소득**으로 봅니다. 여러 사람의 돈을 모아 굴린 성과를 나눠 받는 구조가 배당과 비슷하기 때문입니다.\n> 따라서 금융소득에 포함되어 2천만원 기준을 함께 따집니다.\n\n## 절세상품\n- **연금계좌(연금저축, IRP)**: 넣을 때 세액공제, 받을 때 낮은 연금소득세. 단 만 55세 이후 연금 형태로 받아야 하며 중도인출하면 혜택을 토해냅니다\n- **비과세 종합저축**: 만 65세 이상 고령자, 장애인 등 요건을 갖춘 사람만 가입 가능. 한도 있음\n- **ISA**: 여러 금융상품을 한 계좌에 담고 손익을 통산해 일정액까지 비과세\n\n▸ 누진세율: 소득이 클수록 세율이 올라가는 구조.\n▸ 손익통산: 이익과 손실을 합쳐 순액에 과세하는 것.\n▸ 세액공제: 계산된 세금에서 직접 빼주는 것.","alt":"## 금융소득 종합과세 ⭐\n이자 + 배당 = **금융소득**\n> 🚨 연 **2천만원 이하** → 14%만 떼고 끝 (분리과세)\n> 연 **2천만원 초과** → 월급이랑 합쳐서 누진세율 (종합과세)\n\n실제로 떼이는 건 **15.4%**임. 14% + 지방소득세 1.4%.\n\n## 이중과세 조정\n회사가 법인세 냄 → 남은 돈 배당 → 주주가 또 세금 냄. **같은 돈에 두 번** 매겨짐.\n> 그래서 **배당세액공제**로 회사가 낸 법인세 일부를 빼줌.\n\n## 주식 팔 때\n- **증권거래세**: 이익이든 손해든 **판 금액**에 매김\n- **양도소득세**: 이익에 매김. 근데 **상장주식 장내 매도 + 소액주주면 안 냄**\n\n> 🚨 대주주면 냄. 소액주주냐 대주주냐로 갈리는 게 포인트.\n\n## 펀드 수익은 무슨 소득?\n> 🚨 **배당소득**임. 이자소득 아님.\n> 여러 명 돈 모아서 굴린 성과를 나눠 받는 구조 = 배당이랑 같다고 보는 거임.\n> 그래서 금융소득에 들어가고 2천만원 기준을 같이 따짐.\n\n## 절세상품 3종\n- **연금계좌(연금저축, IRP)**: 넣을 때 세액공제 + 받을 때 낮은 세율\n  > 🚨 조건: **만 55세 이후 연금으로** 받아야 함. 중간에 목돈으로 빼면 혜택 토해냄\n- **비과세 종합저축**: 아무나 못 함. **만 65세 이상, 장애인** 등만\n- **ISA**: 여러 상품 한 계좌에 담고 **손익 통산**해서 일정액까지 비과세\n\n> ISA의 핵심은 손익통산임. A에서 100 벌고 B에서 50 잃으면 50에만 세금. 일반 계좌면 100에 세금 냄.\n\n▸ 손익통산: 이익과 손실 합쳐서 순액에 과세."},{"sub":"금융상품","title":"① 예금과 단기금융상품","body":"## 예금자보호\n은행이 망했을 때 나라가 일정 금액까지 대신 돌려주는 제도입니다.\n> 기준은 하나입니다. **원금을 돌려주기로 약속한 상품인가.**\n> - 보호: 예금, 적금, 원금보전형 금전신탁\n> - 비보호: **펀드, 주식, 채권, CD, RP**\n\n> 펀드는 운용 결과가 투자자에게 그대로 가는 실적배당상품이라 애초에 원금 약속이 없습니다. 그래서 제외됩니다.\n\n## 확정금리형과 실적배당형\n- **확정금리형**: 가입할 때 이자가 정해짐. 예금, 적금, 표지어음\n- **실적배당형**: 굴린 결과에 따라 달라짐. 펀드, 수익증권, ELS\n\n## 주요 단기상품\n- **CD(양도성예금증서)**: 남에게 팔 수 있는 정기예금 증서\n- **CP(기업어음)**: 기업이 단기로 돈을 빌리며 발행하는 증서\n- **RP(환매조건부채권)**: 일정 기간 뒤 되사주기로 하고 파는 채권. 형식은 매매지만 실질은 담보부 단기대출\n- **콜**: 금융기관끼리 하루 이틀 단위로 주고받는 초단기 거래\n- **MMF**: 단기금융상품에 투자하는 펀드. 안전하지만 **원금 보장은 없음**\n\n> 안전한 것과 보장되는 것은 다릅니다. MMF가 대표적인 예입니다.\n\n## CMA\n증권사에서 만드는 수시 입출금 통장입니다. 맡긴 돈을 단기 상품에 굴려 하루 단위로 수익을 줍니다.\n> 종류에 따라 다릅니다. **종금형은 예금자보호가 되지만 RP형과 MMF형은 안 됩니다.**\n\n▸ 실적배당: 운용 성과에 따라 수익이 달라지는 것.\n▸ 표지어음: 금융기관이 보유 어음을 묶어 다시 발행한 단기 확정금리 상품.\n▸ 유동성: 필요할 때 손해 없이 현금으로 바꿀 수 있는 정도.","alt":"## 예금자보호 ⭐\n> 🚨 기준 딱 하나. **\"원금 돌려준다고 약속했냐\"**\n> 보호: 예금, 적금, 원금보전형 신탁\n> **비보호: 펀드, 주식, 채권, CD, RP**\n\n펀드는 잘되면 내가 먹고 망하면 내가 뒤집어쓰는 구조임. 애초에 원금 약속이 없으니 보호 대상이 아님.\n\n## 확정금리 vs 실적배당\n- **확정금리**: 가입할 때 이자 정해짐 (예금, 적금, 표지어음)\n- **실적배당**: 굴린 결과 따라 다름 (펀드, 수익증권, ELS)\n\n## 단기상품 5종\n- **CD**: 남한테 팔 수 있는 정기예금 증서\n- **CP**: 기업이 단기로 돈 빌리는 증서\n- **RP**: 나중에 되사주기로 하고 파는 채권. 형식은 매매인데 **실질은 담보 잡힌 단기대출**\n- **콜**: 은행끼리 하루이틀 빌려주는 초단기\n- **MMF**: 단기상품에 투자하는 펀드\n\n> 🚨 MMF 함정\n> **안전한 거랑 보장되는 건 다름.**\n> MMF는 안전한 데만 투자해서 잘 안 흔들릴 뿐, **원금 보장 없고 예금자보호도 안 됨.**\n> \"MMF는 원금이 보장된다\" → 오답. 진짜 자주 나옴.\n\n## CMA\n증권사 수시입출금 통장. 하루만 맡겨도 이자 붙음.\n> 🚨 **종금형만 예금자보호 됨. RP형·MMF형은 안 됨.**\n> 다 되는 줄 알기 쉬운데 종류 따라 다름.\n\n▸ 표지어음: 금융기관이 어음 묶어 다시 발행한 단기 확정금리 상품."},{"sub":"금융상품","title":"② 펀드와 증권","body":"## 집합투자기구(펀드)의 구조\n여러 사람의 돈을 모아 전문가가 굴리고 성과를 나눠 갖는 구조입니다.\n관여하는 곳이 셋입니다.\n- **자산운용사**: 상품을 만들고 굴림 → 운용보수\n- **판매사(은행·증권사)**: 고객에게 팖 → 판매보수\n- **신탁업자**: 재산을 따로 보관\n\n> 재산을 운용사가 직접 들고 있지 않다는 점이 중요합니다. 운용사가 망해도 펀드 재산은 보호됩니다.\n\n## 개방형과 폐쇄형\n- **개방형**: 언제든 환매 가능. 대신 현금을 남겨둬야 해서 팔기 어려운 자산에 투자하기 힘듦\n- **폐쇄형**: 만기 전 환매 불가. 부동산이나 비상장주식처럼 현금화가 어려운 자산에 투자 가능. 보통 거래소에 상장해 사고팔게 함\n\n## ETF\n펀드를 거래소에 상장시켜 **주식처럼 장중에 사고팔 수 있게** 만든 것입니다.\n> 대개 지수를 그대로 따라가도록 설계해 운용보수가 낮습니다. 한 주만 사도 수백 종목에 분산투자한 효과가 납니다.\n\n## 주식과 채권의 차이\n- **주식**: 회사의 지분. 잘되면 배당과 주가 상승, 망하면 거의 못 건짐. 의결권 있음\n- **채권**: 회사에 빌려준 돈. 아무리 잘돼도 약속한 이자만, 망하면 **주주보다 먼저** 받음\n\n> 위험이 큰 쪽이 기대수익도 큽니다.\n\n## 사채에 붙은 옵션\n- **전환사채(CB)**: 주식으로 바꿀 권리. 바꾸면 사채는 사라짐\n- **신주인수권부사채(BW)**: 주식을 살 권리. 권리를 써도 **사채는 남음**\n- **교환사채(EB)**: 발행회사가 가진 **다른 회사** 주식으로 교환\n\n## ELS와 파생결합증권\n기초자산의 가격 움직임에 따라 수익이 정해집니다.\n> 조건이 지켜지면 예금보다 높은 수익, 조건이 깨지면 큰 손실이 납니다. **위험이 뒤쪽에 몰려 있는 구조**라 설명의무가 특히 강조됩니다.\n\n▸ 환매: 펀드 지분을 팔아 돈을 돌려받는 것.\n▸ 기초자산: 수익을 결정하는 기준 대상.\n▸ 녹인: 기초자산이 하한선 아래로 떨어져 손실 조건이 켜지는 것.","alt":"## 펀드 구조\n여러 명 돈 모아서 전문가가 굴리고 나눠 갖는 거.\n- **자산운용사**: 만들고 굴림 → 운용보수\n- **판매사(은행·증권사)**: 팖 → 판매보수\n- **신탁업자**: 재산 따로 보관\n\n> 🚨 재산을 운용사가 직접 안 들고 있음. **신탁업자가 따로 보관.**\n> 그래서 **운용사 망해도 펀드 재산은 안전함.** 이거 나옴.\n\n## 개방형 vs 폐쇄형\n- **개방형**: 아무 때나 환매 가능. 대신 현금 남겨둬야 해서 부동산 같은 데 투자 못 함\n- **폐쇄형**: 만기 전 환매 불가. 대신 **부동산·비상장주식** 같은 데 투자 가능. 보통 상장해서 사고팔게 해줌\n\n> 논리가 있음. 언제 돈 빼갈지 모르면 묶이는 데 못 넣음.\n\n## ETF\n펀드를 **주식처럼 상장**시킨 거. 장중에 아무 때나 사고팖.\n지수 따라가게 만들어서 보수 낮음. 한 주만 사도 수백 종목 분산 효과.\n\n## 주식 vs 채권 ⭐\n- **주식** = 지분(동업). 잘되면 대박, 망하면 쪽박. **의결권 있음**\n- **채권** = 빚. 잘돼도 약속한 이자만. 근데 망하면 **주주보다 먼저** 받음\n\n> 위험 큰 쪽이 기대수익도 큼. 순서는 채권자 → 주주.\n\n## 사채 옵션 3형제 ⭐\n- **CB(전환사채)**: 주식으로 **바꿈**. 바꾸면 **사채 사라짐**\n- **BW(신주인수권부사채)**: 주식 살 **쿠폰**. 쿠폰 써도 **사채는 남음**\n- **EB(교환사채)**: 발행사가 들고 있던 **다른 회사** 주식으로 교환\n\n> 🚨 CB랑 BW 차이 = **사채가 사라지냐 남냐.** 이걸로 구분하면 안 헷갈림.\n\n## ELS\n주가나 지수 움직임에 따라 수익 결정.\n> 🚨 조건 지켜지면 연 6~8% 꿀. 근데 **깨지면 원금 반토막.**\n> **위험이 뒤에 몰려 있는 구조**라 평소엔 안전해 보임. 그래서 설명의무가 특히 강조되는 상품임.\n\n▸ 녹인: 하한선 뚫려서 손실 조건 켜지는 것."},{"sub":"직무윤리","title":"① 직무윤리의 기본","body":"## 왜 금융에서 유독 윤리를 강조하나\n금융투자업은 **남의 돈을 맡아 굴리는 일**입니다. 정보도 전문성도 한쪽으로 쏠려 있습니다.\n> 고객은 상품을 제대로 판단할 수 없고, 사후에 손해가 나도 그것이 운 때문인지 잘못 때문인지 가리기 어렵습니다. 그래서 사전에 행동 규범을 강하게 걸어둡니다.\n\n## 두 가지 기본 원칙\n- **신의성실의 원칙**: 신의에 따라 성실하게 업무를 수행할 것\n- **고객우선의 원칙**: 고객의 이익을 회사나 자신의 이익보다 앞세울 것\n\n> 이 둘에서 나머지 규정이 전부 파생됩니다.\n\n## 이해상충 방지 (3단계, 핵심)\n고객의 이익과 회사의 이익이 충돌할 수 있는 상황을 관리하는 절차입니다.\n> ① 이해상충 가능성을 **파악·평가**한다\n> ② 가능성이 있으면 **고객에게 알린다**\n> ③ **낮춘 후에** 거래한다\n> ④ 낮추는 것이 **곤란하면 거래하지 않는다**\n\n> 마지막 단계가 중요합니다. **고객이 동의해도 거래할 수 없습니다.** 이 점이 시험에 나옵니다.\n\n### 정보교류 차단(Chinese Wall)\n부서 간 정보가 넘나들지 못하게 벽을 세우는 것입니다. 기업금융 부서가 아는 정보를 자산운용 부서가 쓰면 이해상충이 생기기 때문입니다.\n\n## 이익 우선순위\n> **고객의 이익 > 회사의 이익 > 임직원 개인의 이익**\n\n이 순서가 그대로 출제됩니다.\n\n## 본인·회사·사회에 대한 윤리\n- 법규 준수, 자기혁신, 품위 유지\n- 상호 존중, 경영진의 감독 책임\n- 시장질서 존중, 사회적 책임\n\n▸ 이해상충: 한쪽의 이익이 다른 쪽의 손해가 되는 상황.\n▸ 정보교류 차단: 부서 간 미공개정보 이동을 막는 장치.\n▸ 사전 규제: 사고가 나기 전에 행동을 제약하는 방식.","alt":"## 왜 금융만 윤리를 이렇게 따지냐\n**남의 돈 굴리는 일**이라서임.\n> 고객은 상품을 제대로 못 알아봄. 손해 나도 운이 나빴던 건지 직원이 잘못한 건지 구분이 안 됨.\n> 사후에 못 가리니까 **사전에 행동 규칙을 빡세게** 걸어두는 거임. 이 논리가 직무윤리 전체를 관통함.\n\n## 기본 원칙 2개\n- **신의성실의 원칙**\n- **고객우선의 원칙**\n\n여기서 나머지가 다 나옴.\n\n## 이해상충 방지 3단계 ⭐⭐\n> ① 가능성 **파악·평가**\n> ② 있으면 **알림**\n> ③ **낮춘 후** 거래\n> ④ 낮추기 **곤란하면 거래 금지**\n\n> 🚨 4번이 핵심임.\n> **고객이 \"괜찮아요 하세요\" 해도 못 함.**\n> \"투자자의 동의를 받으면 거래할 수 있다\" → **오답.** 이거 무조건 나옴.\n\n### 차이니즈 월\n부서 간 정보 차단벽.\n> 기업금융팀이 아는 내부정보를 운용팀이 쓰면? 이해상충임. 그래서 벽 세움.\n\n## 이익 우선순위 ⭐\n> **고객 > 회사 > 임직원 개인**\n\n이 순서 그대로 나옴. 내가 제일 뒤임.\n\n## 나머지 윤리\n- 본인: 법규 준수, 자기혁신, 품위 유지\n- 회사: 상호 존중, 경영진 감독 책임\n- 사회: 시장질서 존중, 사회적 책임\n\n▸ 이해상충: 한쪽 이익이 다른 쪽 손해가 되는 상황."},{"sub":"직무윤리","title":"② 투자권유와 고객 보호","body":"## 고객 파악 의무 (Know Your Customer)\n투자권유를 하기 전에 고객의 **투자목적, 재산상황, 투자경험**을 파악하고 서명 등으로 확인받아 유지·관리해야 합니다.\n> 파악하지 않으면 적합성 판단 자체가 불가능하므로 모든 절차의 출발점입니다.\n\n## 적합성 원칙과 적정성 원칙 (구분 필수)\n> **적합성 원칙**: **투자권유를 할 때** 적용. 고객 특성에 비추어 부적합한 상품을 권유해서는 안 됨\n> **적정성 원칙**: **투자권유 없이** 고객이 스스로 파생상품 등 위험상품에 가입하려 할 때 적용. 부적정하다고 판단되면 그 사실을 알려야 함\n\n> 권유가 있었느냐 없었느냐로 갈립니다. 이 기준 하나면 구분이 끝납니다.\n\n## 설명의무\n상품의 내용과 위험을 고객이 이해할 수 있도록 설명하고 이해했음을 확인받아야 합니다.\n> 위반해 손해가 나면 **손해배상책임**을 집니다. 이때 원본손실액이 손해액으로 추정되어 투자자의 입증 부담이 줄어듭니다.\n\n## 부당권유 금지\n- 거짓 내용을 알리거나 단정적 판단을 제공하는 행위\n- **불초청 권유**: 요청하지 않은 고객에게 방문·전화로 권유하는 행위\n- **재권유 금지**: 거부 의사를 밝힌 고객에게 다시 권유하는 행위\n\n> 다만 거부 후 일정 기간이 지났거나 다른 종류의 상품을 권유하는 것은 허용됩니다.\n\n## 손실보전 금지\n사전에 손실을 보전해주겠다고 약속하거나 사후에 손실을 메워주는 행위는 금지됩니다.\n> 이것을 허용하면 위험을 감수한다는 투자의 전제 자체가 무너지고, 회사가 무리한 영업을 하게 됩니다.\n\n## 전문투자자와 일반투자자\n일반투자자에게는 위의 보호 장치가 적용되지만 전문투자자에게는 상당 부분 면제됩니다.\n> 주권상장법인은 전문투자자이지만 **장외파생상품 거래에서는 일반투자자로 대우**받습니다. 별도로 서면 통지를 해야 전문투자자 대우를 받습니다.\n\n▸ 불초청 권유: 요청하지 않은 고객에게 먼저 다가가 권유하는 것.\n▸ 원본손실액: 투자 원금에서 회수한 금액을 뺀 손실.\n▸ 단정적 판단: \"반드시 오른다\" 같은 확정적 표현.","alt":"## KYC (고객 파악 의무)\n권유 전에 **투자목적 / 재산상황 / 투자경험** 파악하고 서명받아 보관.\n> 이걸 안 하면 적합한지 판단 자체가 불가능함. 모든 절차의 출발점.\n\n## 적합성 vs 적정성 ⭐⭐ (진짜 자주 나옴)\n> 🚨 구분 기준 딱 하나. **권유를 했냐 안 했냐.**\n>\n> **적합성** = 내가 **권유할 때**. 고객한테 안 맞는 거 권하면 안 됨\n> **적정성** = 고객이 **혼자 알아서** 파생상품 사려 할 때. \"이거 님한테 안 맞는데요\" 알려줘야 함\n\n이 한 문장이면 끝남.\n\n## 설명의무\n내용이랑 위험 설명하고 **이해했다는 확인** 받아야 함.\n> 🚨 위반해서 손해 나면 **손해배상책임**.\n> 게다가 **원본손실액이 손해액으로 추정**됨. 투자자가 입증 안 해도 됨. 회사가 불리한 구조임.\n\n## 부당권유 금지 3종\n- 거짓말하거나 **\"무조건 오른다\"** 같은 단정적 판단\n- **불초청 권유**: 요청 안 했는데 전화·방문해서 권유\n- **재권유 금지**: 거부한 사람한테 또 권유\n\n> 🚨 근데 예외 있음. 거부 후 **일정 기간 지났거나 다른 종류 상품**이면 가능.\n> \"어떤 경우에도 재권유할 수 없다\" → 오답.\n\n## 손실보전 금지\n\"손해 나면 제가 메워드릴게요\" → **금지.** 사전 약속도 사후 보전도 안 됨.\n> 이거 허용하면 투자가 아니라 그냥 예금이 되고, 회사가 미친 듯이 무리한 영업을 하게 됨.\n\n## 전문투자자 vs 일반투자자\n위 보호장치는 **일반투자자**용. 전문투자자는 상당수 면제.\n> 🚨 **주권상장법인은 전문투자자인데, 장외파생상품 거래에선 일반투자자로 대우받음.**\n> 서면으로 \"저 전문투자자로 해주세요\" 통지해야 전문투자자 됨. 이 예외 나옴.\n\n▸ 불초청 권유: 요청 안 한 사람한테 먼저 들이대는 것."},{"sub":"법규","title":"① 자본시장법의 뼈대","body":"## 금융투자업 여섯 가지\n- **투자매매업**: 자기 계산으로 사고팖\n- **투자중개업**: 남의 매매를 중개\n- **집합투자업**: 여러 사람 돈을 모아 운용\n- **투자자문업**: 조언만 함\n- **투자일임업**: 맡아서 대신 운용\n- **신탁업**\n\n> 여신전문금융업이나 보험업이 껴 나오면 오답입니다. 자본시장법이 다루는 여섯 가지가 아닙니다.\n\n### 자문과 일임의 차이\n자문은 **말만** 해주고 결정은 고객이 합니다. 일임은 **결정까지** 대신합니다. 그래서 일임업의 규제가 더 무겁습니다.\n\n## 금융투자상품의 정의\n> 이익을 얻거나 손실을 피할 목적으로 **현재 또는 장래에 금전을 지급하기로 약정함으로써 취득하는 권리**로서, **원본손실 가능성**이 있는 것\n\n- 원본손실 가능성이 없으면 금융투자상품이 아닙니다. 예금이 그래서 빠집니다\n- **증권**: 손실이 원본까지만\n- **파생상품**: 손실이 원본을 **초과**할 수 있음\n\n> 원본 초과 손실 가능성이 증권과 파생상품을 가르는 기준입니다.\n\n## 투자자 구분\n- **전문투자자**: 국가, 한국은행, 금융기관, 주권상장법인 등\n- **일반투자자**: 그 외\n\n> 주권상장법인은 전문투자자이나 **장외파생상품 거래에서는 일반투자자**로 봅니다.\n\n## 집합투자업자의 운용 제한\n- 각 집합투자기구 자산총액의 **10%**를 초과해 동일 종목 증권에 투자 금지\n- 동일 법인이 발행한 지분증권 총수의 **20%** 초과 취득 금지\n\n> 국채와 통안채 등은 예외입니다. 분산투자를 강제해 펀드 투자자를 보호하려는 규정입니다.\n\n▸ 자기 계산: 손익이 자기에게 귀속되는 것.\n▸ 원본손실 가능성: 투자 원금을 잃을 수 있는 성질.\n▸ 지분증권: 주식처럼 지분을 나타내는 증권.","alt":"## 금융투자업 6개 ⭐\n**투자매매 / 투자중개 / 집합투자 / 투자자문 / 투자일임 / 신탁**\n\n> 🚨 **여신전문금융업, 보험업** 껴 나오면 오답. 자본시장법 소관 아님.\n\n### 자문 vs 일임 (구분 나옴)\n- **자문**: **말만** 해줌. 결정은 고객이\n- **일임**: **결정까지** 대신함\n\n> 그래서 일임이 규제가 더 빡셈. 남의 돈을 내가 굴리는 거니까.\n\n## 금융투자상품 정의\n> 돈 낼 약속으로 얻는 권리인데 **원본손실 가능성**이 있는 것\n\n- 원본손실 가능성 없음 → 금융투자상품 **아님** (예금이 그래서 빠짐)\n- **증권**: 손실이 **원본까지**\n- **파생상품**: 손실이 **원본 초과** 가능\n\n> 🚨 **원본 초과 손실 가능성**이 증권/파생 가르는 기준임.\n> 주식은 다 날려도 0원까지. 파생은 마이너스로 갈 수 있음.\n\n## 투자자 구분\n- 전문: 국가, 한국은행, 금융기관, 주권상장법인\n- 일반: 나머지\n\n> 🚨 주권상장법인은 전문인데 **장외파생상품에선 일반**으로 대우.\n\n## 운용 제한 숫자 ⭐\n- 동일 종목 증권 **10%** 초과 금지\n- 동일 법인 지분증권 총수 **20%** 초과 취득 금지\n\n> 국채·통안채는 예외. 숫자 그대로 나옴.\n\n▸ 자기 계산: 손익이 나한테 오는 것."},{"sub":"법규","title":"② 영업행위 규제와 불공정거래","body":"## 공통 영업행위 규칙\n- **신의성실의무**\n- **이해상충 관리의무**\n- **정보교류 차단(Chinese Wall)**\n- 투자광고 규제\n- 직무 관련 정보의 이용 금지\n\n## 투자권유 관련 규제\n- 적합성 원칙, 적정성 원칙, 설명의무\n- 부당권유 금지 (거짓, 단정적 판단, 불초청 권유, 재권유)\n- **손실보전 및 이익보장 금지**\n\n## 불공정거래 세 가지 (핵심)\n### ① 미공개중요정보 이용행위\n상장법인의 내부자 등이 업무와 관련해 알게 된 미공개 중요정보를 매매에 이용하거나 남에게 알려주는 행위입니다.\n> 회사 임직원뿐 아니라 **준내부자**(회계법인, 인수인 등)와 **정보수령자**도 규제 대상입니다.\n\n### ② 시세조종\n- 통정매매: 서로 짜고 같은 시각에 같은 가격으로 매매\n- 가장매매: 명의만 바꿔 실제 소유권 이전 없이 매매\n- 현실거래에 의한 시세조종, 허위표시\n\n### ③ 부정거래행위\n부정한 수단이나 계획, 기교를 쓰는 행위. 위 둘에 딱 들어맞지 않는 새로운 수법을 포괄하기 위한 규정입니다.\n\n> 여기에 **시장질서 교란행위**가 추가되어, 고의가 뚜렷하지 않거나 2차·3차 정보수령자도 과징금 대상이 됩니다.\n\n## 공시제도\n- **발행시장 공시**: 증권신고서, 투자설명서\n- **유통시장 공시**: 사업보고서, 반기·분기보고서, 주요사항보고서, 수시공시\n\n## 공개매수\n> 불특정 다수를 상대로 장외에서 주식을 매수하겠다고 공고하고 사들이는 것입니다.\n> 6개월간 10인 이상에게서 5% 이상을 장외 취득하려면 반드시 공개매수 절차를 거쳐야 합니다.\n\n## 대량보유 보고 (5% 룰)\n주권상장법인의 주식을 **5% 이상** 보유하게 되거나, 그 후 **1% 이상** 변동하면 5일 이내에 보고해야 합니다.\n\n▸ 준내부자: 회사와 계약 관계 등으로 정보에 접근할 수 있는 자.\n▸ 통정매매: 서로 합의하고 주고받는 매매.\n▸ 과징금: 형벌이 아닌 금전적 행정제재.","alt":"## 공통 영업행위 규칙\n신의성실 / 이해상충 관리 / **정보교류 차단** / 투자광고 규제 / 직무정보 이용 금지\n\n## 불공정거래 3대장 ⭐\n### ① 미공개중요정보 이용\n내부정보로 사고팔거나 남한테 알려주기.\n> 🚨 대상이 넓음. 임직원만이 아님.\n> **준내부자**(회계법인, 인수인) + **정보수령자**도 걸림.\n> \"회사 임직원만 처벌된다\" → 오답.\n\n### ② 시세조종\n- **통정매매**: 서로 짜고 같은 시각 같은 가격에 사고팔기\n- **가장매매**: 명의만 바꾸고 실제 소유권 안 넘김\n- 현실거래 시세조종, 허위표시\n\n### ③ 부정거래행위\n부정한 수단·계획·기교. 위 둘에 안 걸리는 **새로운 수법 잡으려고** 만든 포괄 조항임.\n\n> + **시장질서 교란행위** 추가됨. 고의가 애매하거나 2차·3차 정보수령자도 **과징금** 맞음.\n\n## 공시\n- 발행시장: 증권신고서, 투자설명서\n- 유통시장: 사업보고서, 반기·분기보고서, 주요사항보고서, 수시공시\n\n## 공개매수\n장외에서 불특정 다수한테 \"주식 삽니다\" 공고하고 사는 것.\n> 🚨 **6개월간 10인 이상에게서 5% 이상** 장외 취득 → 반드시 공개매수 절차\n\n## 5% 룰 ⭐\n상장주식 **5% 이상** 보유하게 되거나 이후 **1% 이상** 변동 → **5일 내** 보고\n> 🚨 5% / 1% / 5일. 숫자 세 개 그대로 나옴.\n> 경영권 노리고 몰래 사들이는 거 막으려는 제도임.\n\n> 🚨 그리고 **공개매수 신고는 불공정거래 아님.** 정상 절차인데 불공정거래 고르라고 껴놓음.\n\n▸ 준내부자: 계약 관계로 정보 접근 가능한 자."},{"sub":"거시경제","title":"① 경기와 지표","body":"## 경기순환\n경기는 **회복 → 확장 → 후퇴 → 수축**을 반복합니다.\n저점에서 정점까지가 확장국면, 정점에서 저점까지가 수축국면이며 둘을 합쳐 한 주기입니다.\n\n## 경기종합지수\n- **선행지수**: 경기보다 먼저 움직임. **코스피지수**, 재고순환지표, 경제심리지수, 건설수주액, 장단기금리차, 수출입물가비율\n- **동행지수**: 함께 움직임. 비농림어업취업자수, 광공업생산지수, 소매판매액지수\n- **후행지수**: 뒤따라 움직임. 상용근로자수, 회사채유통수익률\n\n> 주가가 선행지표라는 점이 중요합니다. 주식시장은 미래를 먼저 반영합니다.\n\n## 물가지표\n- **CPI**: 가계 소비 품목. 수입 소비재 **포함**\n- **PPI**: 기업 간 거래 단계\n- **GDP 디플레이터**: 국내 생산 전체. 수입품 **제외**\n\n## 통화정책\n- 기준금리 **인상** → 통화량 감소 → 총수요 감소 → 물가 안정, 자국 통화 강세\n- 기준금리 **인하** → 반대\n\n수단은 공개시장운영, 지급준비율 조작, 재할인율 조작입니다.\n> 중앙은행이 국채를 **매입**하면 시중에 돈이 풀려 이자율이 내려갑니다.\n\n## 금리와 자산가격\n> 금리가 내려가면 **채권가격은 오르고 주가도 대체로 오릅니다.**\n> 할인율이 낮아지면 미래 현금흐름의 현재가치가 커지기 때문입니다. 이 논리가 자산시장 전반에 적용됩니다.\n\n## 수익률곡선\n만기별 금리를 이은 선입니다.\n- **유동성 프리미엄 이론**: 장기채는 위험이 크므로 프리미엄이 붙어 일반적으로 **우상향**\n- **기대이론**: 장기금리는 미래 단기금리 기대의 평균\n- **시장분할이론**: 만기별 시장이 따로 존재\n\n> **장단기금리차 축소나 역전**은 경기 침체 신호로 읽힙니다. 선행지표에 들어가는 이유입니다.\n\n▸ 기준금리: 중앙은행이 정하는 정책금리.\n▸ 장단기금리차: 장기금리에서 단기금리를 뺀 값.\n▸ 할인율: 미래 금액을 현재가치로 바꿀 때 쓰는 이자율.","alt":"## 경기순환\n**회복 → 확장 → 후퇴 → 수축** 반복.\n저점→정점 = 확장, 정점→저점 = 수축. 둘 합쳐 한 주기.\n\n## 경기종합지수 ⭐\n- **선행**: **코스피**, 재고순환지표, 경제심리지수, 건설수주액, **장단기금리차**\n- **동행**: 비농림어업취업자수, 광공업생산지수, 소매판매액지수\n- **후행**: 상용근로자수, 회사채유통수익률\n\n> 🚨 **주가는 선행지표**임. 주식시장은 미래를 먼저 반영하니까.\n> 취업자수는 동행, 상용근로자수는 후행. 이거 섞어서 냄.\n\n## 물가지표 3개\n- **CPI**: 가계 소비. 수입품 **포함**\n- **PPI**: 기업 간 거래\n- **GDP 디플레이터**: 국내 생산 전체. 수입품 **제외**\n\n## 통화정책 방향\n- 금리 **인상** → 통화량 ↓ → 총수요 ↓ → 물가 안정, 원화 강세\n- 금리 **인하** → 반대\n\n> 🚨 중앙은행이 국채 **매입** → 돈 풀림 → 금리 ↓\n> 채권을 사면 돈을 주는 거니까 시중에 돈이 나감. 방향 헷갈리지 마셈.\n\n## 금리와 자산가격 ⭐\n> 🚨 금리 ↓ → **채권가격 ↑, 주가도 대체로 ↑**\n>\n> 왜? 미래에 받을 돈을 현재가치로 바꿀 때 **할인율이 작아지니까** 현재가치가 커짐.\n> 이 논리 하나로 채권도 주식도 부동산도 다 설명됨. 투운사 전체를 관통하는 감각임.\n\n## 수익률곡선\n만기별 금리를 이은 선.\n- **유동성 프리미엄 이론**: 장기채는 위험하니 프리미엄 붙음 → **우상향**\n- **기대이론**: 장기금리 = 미래 단기금리 기대의 평균\n- **시장분할이론**: 만기별로 시장이 따로 있음\n\n> 🚨 **장단기금리 역전 = 경기침체 신호.**\n> 그래서 장단기금리차가 선행지표에 들어감.\n\n▸ 할인율: 미래 돈을 현재가치로 바꾸는 이자율."},{"sub":"채권운용","title":"① 채권의 기초","body":"## 채권이란\n돈을 빌리면서 써주는 차용증입니다. 발행자는 만기에 원금을 갚고 그동안 정해진 이자를 줍니다.\n- **액면가**: 만기에 돌려받을 금액\n- **표면이자율**: 채권에 적힌 이자율\n- **만기수익률(YTM)**: 지금 이 가격에 사서 만기까지 들고 있을 때 실제로 얻는 연 수익률\n\n## 가격과 수익률은 반대로 움직인다\n> 채권가격은 미래에 받을 돈을 시장이자율로 할인한 값입니다.\n> **시장금리가 오르면 할인율이 커져 채권가격이 떨어집니다.** 반대도 성립합니다.\n\n이것이 채권의 가장 기본 원리이고 모든 문제의 출발점입니다.\n\n## 표면이자율과 만기수익률의 관계\n- 표면이자율 = 만기수익률 → 채권가격 = 액면가 (액면발행)\n- 표면이자율 < 만기수익률 → 액면가보다 싸게 (할인발행)\n- 표면이자율 > 만기수익률 → 액면가보다 비싸게 (할증발행)\n\n## 채권의 종류\n- 발행주체별: 국채, 지방채, 특수채, 금융채, 회사채\n- 이자지급별: 이표채(정기적으로 이자 지급), **할인채**(이자 없이 싸게 발행), 복리채\n- 옵션부: 콜옵션부(발행자가 조기상환 가능), 풋옵션부(투자자가 조기상환 요구 가능)\n\n## 신용등급\nAAA부터 D까지 매깁니다.\n> **BBB와 BB 사이가 투자등급과 투기등급의 경계**입니다. BBB에서 BB로 한 칸 떨어지면 기관투자자가 살 수 없게 되어 금리가 급등하고 자금 조달이 막힙니다.\n\n## 채권 투자의 위험\n- **이자율 위험**: 금리 변동으로 가격이 변함\n- **신용위험(부도위험)**: 발행자가 못 갚음\n- **유동성 위험**: 팔고 싶을 때 못 팖\n- **인플레이션 위험**: 물가가 올라 실질 구매력이 줄어듦\n- **중도상환 위험**: 콜옵션부 채권에서 금리가 내릴 때 조기상환당함\n\n▸ 액면가: 만기에 받을 원금.\n▸ 이표채: 정해진 시점마다 이자를 지급하는 채권.\n▸ 투기등급: 원리금 상환이 불확실한 등급. 하이일드라고도 합니다.","alt":"## 채권 = 차용증\n만기에 원금 갚고 그동안 이자 줌.\n- **액면가**: 만기에 받을 돈\n- **표면이자율**: 채권에 적힌 이자율\n- **만기수익률(YTM)**: 지금 가격에 사서 만기까지 들고 있을 때 실제 수익률\n\n## 가격 ↔ 수익률 반대 ⭐⭐\n> 🚨 **금리 오르면 채권가격 떨어짐.** 이거 하나가 채권 문제의 전부임.\n>\n> 왜? 채권가격 = 미래에 받을 돈을 **할인**한 값.\n> 금리(할인율)가 커지면 나누는 수가 커지니까 값이 작아짐.\n>\n> 직관적으로도 맞음. 새로 나온 채권이 5% 주는데 내가 들고 있는 건 3%임. 내 거 팔려면 싸게 내놔야지.\n\n## 표면이자율 vs 만기수익률\n- 같음 → **액면발행** (가격 = 액면가)\n- 표면 < YTM → **할인발행** (싸게)\n- 표면 > YTM → **할증발행** (비싸게)\n\n> 이자를 적게 주면 싸게 팔아야 팔림. 당연한 얘기임.\n\n## 종류\n- 발행주체: 국채 / 지방채 / 특수채 / 금융채 / 회사채\n- 이자지급: **이표채**(정기 이자) / **할인채**(이자 없이 싸게 발행) / 복리채\n- 옵션부: **콜옵션부**(발행자가 조기상환) / **풋옵션부**(투자자가 요구)\n\n## 신용등급 ⭐\nAAA ~ D\n> 🚨 **BBB와 BB 사이가 경계.** BBB까지 투자등급, BB부터 투기등급.\n> 한 칸 떨어지면 연기금·보험사가 법적으로 못 삼 → 수요 증발 → 금리 폭등 → 자금줄 막힘.\n> 그래서 이 한 칸이 회사 생사를 가름.\n\n## 채권 위험 5개\n이자율 위험 / 신용위험 / 유동성 위험 / 인플레이션 위험 / **중도상환 위험**\n> 🚨 중도상환 위험 = 콜옵션부 채권에서 **금리 내릴 때** 발행사가 갚아버림.\n> 발행사는 싼 이자로 갈아타서 좋고, 나는 좋은 채권을 뺏기는 거임.\n\n▸ 하이일드: 투기등급 채권. 정크본드라고도 함."},{"sub":"채권운용","title":"② 듀레이션과 투자전략","body":"## 듀레이션\n투자한 돈을 평균적으로 몇 년 만에 회수하는지를 나타내는 **가중평균 회수기간**입니다.\n동시에 **금리 변화에 대한 가격 민감도**를 뜻하기도 합니다.\n\n> **듀레이션이 길수록 금리 변화에 가격이 크게 움직입니다.**\n\n## 듀레이션을 결정하는 요인\n- **만기가 길수록** 듀레이션이 길다\n- **표면이자율이 낮을수록** 듀레이션이 길다\n- **만기수익률이 낮을수록** 듀레이션이 길다\n\n> 표면이자율이 높으면 돈을 일찍 많이 회수하므로 평균 회수기간이 짧아집니다. 이 논리로 이해하면 외울 필요가 없습니다.\n> **무이표채의 듀레이션은 만기와 같습니다.** 중간에 받는 게 없으니 회수 시점이 만기 하나뿐이기 때문입니다.\n\n## 가격 변화 근사\n> 가격 변화율 ≈ −수정듀레이션 × 금리 변화\n\n수정듀레이션이 5이고 금리가 1%p 오르면 가격은 약 5% 떨어집니다.\n\n## 볼록성(Convexity)\n듀레이션은 직선으로 근사한 값이라 금리가 크게 움직이면 오차가 생깁니다. 실제 가격-금리 관계는 원점에 볼록한 곡선입니다.\n> 그래서 **금리가 내릴 때는 듀레이션 예측보다 더 오르고, 오를 때는 예측보다 덜 떨어집니다.** 볼록성이 큰 채권이 투자자에게 유리합니다.\n\n## 투자전략\n### 적극적 전략\n- **금리 예측 전략**: 금리 하락이 예상되면 듀레이션을 **길게**, 상승이 예상되면 **짧게**\n- **수익률곡선 타기**: 우상향 곡선에서 시간이 지나며 만기가 짧아져 금리가 낮아지는 효과를 노림\n- 스프레드 운용\n\n### 소극적 전략\n- **만기보유 전략**\n- **사다리형**: 만기를 고르게 분산\n- **바벨형**: 단기와 장기에만 집중\n- **면역전략(Immunization)**: 포트폴리오 듀레이션을 목표 투자기간과 일치시켜 금리 변동의 영향을 상쇄\n\n> 면역전략의 원리는 이렇습니다. 금리가 오르면 채권가격은 떨어지지만 받은 이자를 더 높은 금리로 재투자할 수 있습니다. 두 효과가 상쇄되는 지점이 듀레이션과 투자기간이 같아지는 때입니다.\n\n▸ 수정듀레이션: 금리 민감도를 직접 나타내도록 조정한 듀레이션.\n▸ 무이표채: 이자 없이 할인 발행되는 채권.\n▸ 재투자위험: 받은 이자를 다시 굴릴 때 금리가 달라지는 위험.","alt":"## 듀레이션 = 평균 회수기간 + 금리 민감도\n> 🚨 **듀레이션 길수록 금리 변화에 가격이 크게 출렁임.**\n\n## 결정 요인 3개 ⭐\n- **만기 길수록** → 듀레이션 ↑\n- **표면이자율 낮을수록** → 듀레이션 ↑\n- **만기수익률 낮을수록** → 듀레이션 ↑\n\n> 🚨 외우지 말고 이해하셈.\n> 표면이자율이 높으면 **이자로 돈을 일찍 많이 회수**함 → 평균 회수 시점이 앞당겨짐 → 듀레이션 짧아짐.\n> 그래서 **무이표채는 듀레이션 = 만기**임. 중간에 받는 게 하나도 없으니 회수 시점이 만기 딱 하나임.\n\n## 가격 변화 계산\n> **가격 변화율 ≈ −수정듀레이션 × 금리 변화**\n\n수정듀레이션 5, 금리 1%p 상승 → 가격 약 **5% 하락**\n\n## 볼록성\n듀레이션은 직선으로 대충 잰 거라 금리가 크게 움직이면 오차 남.\n> 🚨 실제는 볼록한 곡선이라\n> **금리 내릴 때: 예상보다 더 오름**\n> **금리 오를 때: 예상보다 덜 떨어짐**\n> 투자자한테 유리한 방향임. 그래서 볼록성 큰 채권이 좋음.\n\n## 전략\n### 적극적\n- **금리 예측**: 금리 내릴 것 같으면 듀레이션 **길게** (많이 오르니까) / 오를 것 같으면 **짧게**\n- **수익률곡선 타기**: 시간 지나면서 만기가 짧아져 금리가 내려가는 효과 먹기\n\n### 소극적\n- 만기보유 / **사다리형**(만기 고르게) / **바벨형**(단기+장기만)\n- **면역전략** ⭐\n\n> 🚨 면역전략 원리\n> 금리 오름 → 채권가격 떨어짐 (손해)\n> 근데 받은 이자를 **더 높은 금리로 재투자** 가능 (이득)\n> 이 둘이 딱 상쇄되는 지점이 **듀레이션 = 투자기간**일 때임.\n> 그래서 듀레이션을 목표 기간에 맞춰두면 금리가 어떻게 되든 목표 수익이 나옴.\n\n▸ 재투자위험: 받은 이자 다시 굴릴 때 금리가 달라지는 위험."},{"sub":"주식운용","title":"① 주식 가치평가와 운용전략","body":"## 상대가치평가\n- **PER = 주가 ÷ 주당순이익**. 이익 대비 주가 수준\n- **PBR = 주가 ÷ 주당순자산**. 자산 대비 주가 수준\n- **PSR = 주가 ÷ 주당매출액**. 적자 기업에도 쓸 수 있음\n- **EV/EBITDA**: 기업가치를 영업현금흐름으로 나눈 것\n\n> PER이 낮으면 저평가로 보지만, 성장성이 낮아서 낮을 수도 있습니다. 같은 업종끼리 비교해야 의미가 있습니다.\n\n## 절대가치평가\n### 배당할인모형(DDM)\n주식의 가치는 앞으로 받을 배당의 현재가치 합입니다.\n> **정률성장모형: 주가 = 내년 배당 ÷ (요구수익률 − 성장률)**\n> 요구수익률이 낮아지거나 성장률이 높아지면 주가가 오릅니다. 분모가 작아지기 때문입니다.\n\n### 현금흐름할인모형(DCF)\n미래 잉여현금흐름을 자본비용으로 할인해 기업가치를 구합니다.\n\n## 기본적 분석과 기술적 분석\n- **기본적 분석**: 경제 → 산업 → 기업 순으로 내재가치를 찾습니다(Top-down). 반대로 기업부터 보는 Bottom-up도 있습니다\n- **기술적 분석**: 과거 가격과 거래량 패턴으로 예측합니다. 이동평균선, 추세선, 거래량 지표 등\n\n> 효율적 시장가설이 맞다면 기술적 분석으로 초과수익을 얻을 수 없습니다. 두 입장이 대립합니다.\n\n## 운용전략\n### 패시브\n지수를 그대로 따라가 시장수익률을 목표로 합니다. 운용보수가 낮습니다.\n- 완전복제법, 표본추출법, 최적화법\n\n### 액티브\n초과수익을 노립니다. 보수가 높고 성과가 들쭉날쭉합니다.\n- **가치주 전략**: PER·PBR이 낮은 종목\n- **성장주 전략**: 이익 성장률이 높은 종목\n- **모멘텀 전략**: 오르는 종목을 따라감\n- **역발상 전략**: 시장과 반대로\n\n### 준액티브\n- **인핸스드 인덱스**: 지수를 따라가되 약간의 초과수익을 노림\n\n▸ 내재가치: 그 자산이 본래 가져야 할 가치.\n▸ 잉여현금흐름: 영업으로 번 현금에서 투자를 뺀 것.\n▸ 추적오차: 지수와 펀드 수익률의 차이.","alt":"## 상대가치 (남이랑 비교)\n- **PER = 주가 ÷ 주당순이익**\n- **PBR = 주가 ÷ 주당순자산**\n- PSR = 주가 ÷ 주당매출액 (**적자 기업에도 쓸 수 있음**)\n- EV/EBITDA\n\n> 🚨 PER 낮다고 무조건 싼 게 아님. **성장성이 없어서** 낮을 수도 있음.\n> 같은 업종끼리 비교해야 의미 있음. 은행이랑 바이오 PER 비교하면 무의미.\n\n## 절대가치 (자체 값 계산)\n### 배당할인모형(DDM)\n> **주가 = 내년 배당 ÷ (요구수익률 − 성장률)**\n\n> 🚨 분모가 핵심임. 요구수익률 내려가거나 성장률 올라가면 **분모가 작아져서 주가 폭등.**\n> 금리 내리면 성장주가 많이 오르는 이유가 이거임.\n\n### DCF\n미래 잉여현금흐름을 자본비용으로 할인.\n\n## 기본적 vs 기술적\n- **기본적 분석**: 경제→산업→기업 (Top-down) 또는 기업부터 (Bottom-up). **내재가치** 찾기\n- **기술적 분석**: 과거 **가격과 거래량 패턴**으로 예측\n\n> 🚨 효율적 시장가설이 맞으면 기술적 분석은 무의미함. 이미 가격에 다 반영됐으니까.\n> 두 입장이 대립하는 구도로 문제가 나옴.\n\n## 운용전략 ⭐\n### 패시브\n지수 따라가기. **시장수익률이 목표.** 보수 쌈.\n복제 방법: 완전복제 / 표본추출 / 최적화\n\n### 액티브\n초과수익 노림. 보수 비쌈.\n- **가치주**: PER·PBR 낮은 거\n- **성장주**: 이익 성장률 높은 거\n- **모멘텀**: 오르는 거 따라가기\n- **역발상**: 시장 반대로 가기\n\n> 🚨 모멘텀이랑 역발상은 **정반대 전략**임. 둘 다 나옴.\n\n### 준액티브\n**인핸스드 인덱스**: 지수 따라가되 살짝 초과수익 노림. 중간 지대.\n\n▸ 추적오차: 지수랑 펀드 수익률 차이."},{"sub":"포트폴리오","title":"① 위험과 분산투자","body":"## 위험의 두 종류\n- **체계적 위험**: 시장 전체에 영향을 주는 요인. 금리, 경기, 전쟁, 환율. **분산으로 제거 불가**\n- **비체계적 위험**: 개별 기업 고유 요인. 공장 화재, 경영진 교체. **분산으로 제거 가능**\n\n> 종목 수를 늘리면 비체계적 위험이 줄지만 일정 수준을 넘으면 감소 효과가 급격히 둔화됩니다. 체계적 위험이 바닥에 깔려 있기 때문입니다.\n\n## 분산효과의 핵심은 상관계수\n> 중요한 것은 **몇 개를 담느냐가 아니라 서로 다르게 움직이는 것을 담느냐**입니다.\n> 상관계수가 +1이면 분산효과가 전혀 없고, **-1이면 위험을 완전히 제거**할 수 있습니다.\n\n삼성전자와 SK하이닉스를 함께 담는 것은 분산이 아닙니다. 같은 방향으로 움직이기 때문입니다.\n\n## 효율적 투자선\n같은 위험에서 기대수익률이 가장 높은 포트폴리오들을 이은 곡선입니다. 그 아래 조합은 열등하므로 고를 이유가 없습니다.\n> 여기에 무위험자산을 더하면 **자본시장선(CML)**이 되고, 접점이 **시장포트폴리오**입니다.\n\n## CAPM\n> **기대수익률 = 무위험이자율 + 베타 × (시장수익률 − 무위험이자율)**\n\n베타는 시장 대비 민감도입니다. 1보다 크면 공격적, 작으면 방어적입니다.\n> 무위험 3%, 시장위험프리미엄 6%, 베타 1.2라면 → 3 + 1.2 × 6 = **10.2%**\n\nCAPM이 말하는 것은 하나입니다. **보상받는 위험은 체계적 위험뿐**입니다. 분산으로 없앨 수 있는 위험까지 보상해줄 이유가 없기 때문입니다.\n\n## 증권시장선(SML)과 자본시장선(CML)\n- **CML**: 가로축이 **총위험(표준편차)**. 효율적 포트폴리오만 위에 있음\n- **SML**: 가로축이 **베타**. 개별 종목도 포함해 모든 자산이 위에 있어야 함\n\n> SML 위에 있으면 적정 평가, 위에 있으면 저평가, 아래면 고평가입니다.\n\n▸ 표준편차: 수익률이 평균에서 얼마나 흩어져 있는지.\n▸ 시장포트폴리오: 시장의 모든 자산을 시가총액 비중대로 담은 포트폴리오.\n▸ 위험프리미엄: 위험을 진 대가로 요구하는 추가 수익.","alt":"## 위험 2종 ⭐\n- **체계적 위험**: 시장 전체. 금리, 경기, 전쟁. **분산으로 못 없앰**\n- **비체계적 위험**: 개별 기업. 공장 불남, 사장 사고. **분산으로 없앰**\n\n> 종목 늘리면 비체계적 위험은 줄어듦. 근데 30개쯤 넘으면 효과 거의 없음. 체계적 위험이 바닥에 깔려 있어서.\n\n## 분산의 핵심은 개수가 아니라 상관계수 ⭐\n> 🚨 **몇 개 담느냐가 아니라 서로 다르게 움직이는 걸 담느냐**가 중요함.\n> 상관계수 +1 → 분산효과 **0**\n> 상관계수 -1 → 위험 **완전 제거** 가능\n\n삼성전자 + SK하이닉스 = 분산 아님. 같이 오르고 같이 떨어짐. 그냥 반도체 두 배 산 거임.\n\n## 효율적 투자선\n같은 위험에서 수익 제일 높은 조합들의 선. 그 아래는 고를 이유가 없음.\n> 무위험자산 더하면 **자본시장선(CML)**, 접점이 **시장포트폴리오**.\n\n## CAPM ⭐\n> **기대수익률 = 무위험이자율 + 베타 × (시장수익률 − 무위험이자율)**\n\n무위험 3%, 시장프리미엄 6%, 베타 1.2 → 3 + 7.2 = **10.2%**\n\n> 🚨 CAPM이 하고 싶은 말은 딱 하나임.\n> **보상받는 위험은 체계적 위험뿐임.**\n> 분산으로 없앨 수 있는 위험을 왜 보상해줌? 니가 안 없앤 게 잘못이지. 그래서 베타만 들어가고 총위험은 안 들어감.\n\n## CML vs SML ⭐\n- **CML**: 가로축 **총위험(표준편차)**. **효율적 포트폴리오만**\n- **SML**: 가로축 **베타**. **개별 종목 포함 전부**\n\n> 🚨 가로축이 뭐냐로 구분. 총위험이면 CML, 베타면 SML.\n> SML **위**에 있으면 저평가(사야 함), **아래**면 고평가.\n\n▸ 시장포트폴리오: 시장 전체를 시총 비중대로 담은 것."},{"sub":"포트폴리오","title":"② 자산배분과 성과평가","body":"## 전략적 자산배분과 전술적 자산배분\n- **전략적(SAA)**: 장기 기준 비중을 정하는 것. 주식 60 채권 40처럼. 자주 바꾸지 않음\n- **전술적(TAA)**: 그 틀 안에서 단기 시장 상황에 따라 조정. 저평가 자산을 사고 고평가 자산을 파는 **역발상** 성격\n\n> 여러 연구에서 장기 성과 차이의 상당 부분은 종목 선택이 아니라 **자산배분**으로 설명됩니다. 그래서 배분을 먼저 정하고 종목을 나중에 봅니다.\n\n## 리밸런싱\n시장 변동으로 틀어진 비중을 목표로 되돌리는 작업입니다.\n> 주식이 크게 올라 60에서 70이 되면 일부를 팔아 채권을 삽니다. 자연스럽게 **오른 것을 팔고 내린 것을 사는** 행동이 되어 규율 있는 투자를 돕습니다.\n\n## 포트폴리오 보험전략\n손실 하한선을 정해두고 위험자산 비중을 조절합니다. 주가가 떨어지면 위험자산을 줄이고 오르면 늘립니다.\n> 손실을 제한하는 대신 상승 수익을 온전히 다 가져가지 못합니다. 안전장치를 다는 대가입니다.\n\n## 성과평가 지표\n- **샤프지수 = (포트폴리오 수익률 − 무위험이자율) ÷ 표준편차**\n  총위험 한 단위당 초과수익. 분산이 잘된 포트폴리오 평가에 적합\n- **트레이너지수 = 초과수익률 ÷ 베타**\n  체계적 위험 한 단위당 초과수익\n- **젠센의 알파**: 실제 수익률에서 CAPM이 예측한 수익률을 뺀 값. **운용자의 실력**을 나타냄\n- **정보비율**: 초과수익률 ÷ 추적오차\n\n> 샤프는 총위험, 트레이너는 베타로 나눕니다. 분모가 무엇인지로 구분하면 헷갈리지 않습니다.\n\n## 성과 요인 분해\n전체 성과를 자산배분 효과, 종목선택 효과, 상호작용 효과로 나눠 어디서 성과가 났는지 봅니다.\n\n## 벤치마크\n성과를 비교할 기준입니다. 사전에 정해져야 하고, 투자 가능해야 하며, 명확해야 합니다.\n> 사후에 유리한 벤치마크로 바꾸는 것은 평가의 의미를 없앱니다.\n\n▸ 추적오차: 포트폴리오와 벤치마크 수익률 차이의 변동성.\n▸ 알파: 시장이 설명하지 못하는 초과수익.\n▸ 벤치마크: 성과 비교의 기준이 되는 지수.","alt":"## 전략적 vs 전술적 자산배분\n- **전략적(SAA)**: 장기 기준 비중. \"주식 60 채권 40으로 간다\". 잘 안 바꿈\n- **전술적(TAA)**: 그 안에서 단기 조정. **싼 거 사고 비싼 거 팔기**. 역발상 성격\n\n> 🚨 연구 결과: 장기 성과 차이의 **대부분은 종목 선택이 아니라 자산배분**으로 설명됨.\n> 뭘 골랐냐보다 주식에 얼마 담았냐가 훨씬 큼. 그래서 배분부터 정하고 종목은 나중.\n\n## 리밸런싱\n틀어진 비중을 목표로 되돌리기.\n> 주식이 60 → 70이 됨 → 일부 팔고 채권 삼\n> 자동으로 **오른 거 팔고 내린 거 사는** 행동이 됨. 감정 개입 없이 규율이 생김.\n\n## 포트폴리오 보험\n\"아무리 나빠도 원금 90% 아래론 안 감\" 선 정해두고 위험자산 비중 조절.\n> 떨어지면 줄이고 오르면 늘림.\n> 🚨 대신 **오를 때 수익을 온전히 다 못 먹음.** 보험료 내는 셈임.\n\n## 성과평가 지표 ⭐\n- **샤프지수 = 초과수익률 ÷ 표준편차** → **총위험** 기준\n- **트레이너지수 = 초과수익률 ÷ 베타** → **체계적 위험** 기준\n- **젠센의 알파** = 실제 수익률 − CAPM 예측 수익률 → **운용자 실력**\n- 정보비율 = 초과수익률 ÷ 추적오차\n\n> 🚨 샤프랑 트레이너 구분법: **분모가 뭐냐.**\n> 표준편차면 샤프, 베타면 트레이너. 이것만 보면 됨.\n>\n> 그리고 알파가 왜 실력이냐면, 시장이 올라서 번 건 베타로 설명되고 **거기서 더 번 게 알파**라서임. 운이 아니라 실력 몫.\n\n## 왜 지표가 필요하냐\n> A펀드 20% 벌고 B펀드 10% 벌었으면 A가 잘한 거?\n> A가 개도박해서 번 거면 아님. **위험 대비 얼마 벌었나**를 봐야 함. 그래서 위험으로 나누는 거임.\n\n## 벤치마크\n비교 기준. **사전에 정해져야 하고, 투자 가능해야 하고, 명확해야 함.**\n> 🚨 사후에 유리한 걸로 바꾸면 평가가 무의미해짐.\n\n▸ 알파: 시장으로 설명 안 되는 초과수익."},{"sub":"파생상품","title":"① 선물과 옵션","body":"## 파생상품이란\n다른 자산의 가격에서 값이 **파생되어** 나오는 상품입니다. 기초자산은 주가지수, 금리, 환율, 원자재 등입니다.\n\n## 선물\n미래의 특정 시점에 정해진 가격으로 사고팔기로 **지금 약속**하는 계약입니다.\n> 중요한 것은 약속이라 **반드시 지켜야 한다**는 점입니다. 가격이 유리하게 움직여도 계약대로 해야 합니다.\n\n### 선도와 선물의 차이\n- **선도(Forward)**: 당사자끼리 조건을 자유롭게 정함. 맞춤형이지만 **상대방이 약속을 안 지킬 위험**이 있음\n- **선물(Futures)**: 거래소가 조건을 표준화하고 **청산소가 이행을 보증**. 사고팔기 쉬움\n\n### 증거금과 일일정산\n계약 이행을 보증하기 위해 일정 금액을 맡깁니다. 매일 손익을 계산해 증거금에 반영하고, 잔액이 기준 아래로 떨어지면 **마진콜**이 걸립니다. 채우지 못하면 강제 청산됩니다.\n\n### 베이시스\n> **베이시스 = 선물가격 − 현물가격**\n> 정상적으로는 보관비와 이자 때문에 선물이 조금 비쌉니다(콘탱고). 만기가 다가올수록 차이가 줄어 만기에는 0이 됩니다.\n\n## 옵션\n### 선물과의 결정적 차이\n> 옵션을 **산 사람은 권리만** 가집니다. 유리하면 행사하고 불리하면 버리면 됩니다. 대신 **프리미엄**을 미리 냅니다.\n> 옵션을 **판 사람은 의무만** 집니다. 프리미엄을 받는 대신 상대가 행사하면 응해야 합니다.\n\n### 콜과 풋\n- **콜옵션**: **살** 권리. 가격이 오를 것 같을 때 매수\n- **풋옵션**: **팔** 권리. 가격이 내릴 것 같을 때 매수\n\n### 손익 구조 (핵심)\n> **매수자**: 손실은 프리미엄까지로 **제한**, 이익은 **무제한**\n> **매도자**: 이익은 프리미엄까지로 **제한**, 손실은 **무제한**\n\n옵션 매도가 위험한 이유가 여기 있습니다. 그래서 매도자에게 증거금을 요구합니다.\n\n### 옵션 가격\n- **내재가치**: 지금 당장 행사했을 때 얻는 이익\n- **시간가치**: 만기까지 유리해질 가능성의 값. 만기가 다가올수록 줄어듦\n\n## 스왑\n미래에 주고받을 현금흐름을 맞바꾸는 계약입니다.\n> 금리스왑이 대표적입니다. 변동금리로 빌린 회사와 고정금리로 빌린 회사가 이자 지급 의무를 서로 바꾸면 둘 다 원하는 형태가 됩니다.\n\n## 파생상품의 기능\n위험의 이전, 가격 발견, 유동성 공급.\n> **원금 보장 기능은 없습니다.** 오히려 손실이 원금을 넘을 수 있습니다.\n\n▸ 청산소: 거래 이행을 보증하는 기관.\n▸ 마진콜: 증거금 부족으로 추가 납입을 요구받는 것.\n▸ 콘탱고: 선물가격이 현물보다 높은 상태.","alt":"## 파생상품 = 남의 가격에 얹혀가는 상품\n기초자산: 주가지수, 금리, 환율, 원자재\n\n## 선물\n미래에 정해진 가격으로 사고팔기로 **지금 약속**.\n> 🚨 핵심은 **약속이라 무조건 지켜야 함.** 유리하게 움직여도 계약대로 해야 함.\n> 이게 \"안 해도 되는\" 옵션이랑 결정적 차이임.\n\n### 선도 vs 선물\n- **선도**: 둘이 알아서 조건 정함. **맞춤옷**. 근데 상대가 튈 위험 있음\n- **선물**: 거래소가 규격화 + **청산소가 보증**. **기성복**. 안전하고 사고팔기 쉬움\n\n### 증거금·일일정산\n> 미래에 정산하니까 손실 난 놈이 튈 수 있음. 그래서 돈 맡겨둠 = **증거금**\n> 매일 손익 반영하고, 부족하면 **마진콜**. 못 채우면 강제 청산.\n\n### 베이시스\n> **베이시스 = 선물 − 현물**\n> 보통 선물이 조금 비쌈(보관비+이자). 만기 가까워지면 차이가 **0으로 수렴**.\n\n## 옵션 ⭐\n> 🚨 **산 사람 = 권리만. 판 사람 = 의무만.**\n> 산 사람은 유리하면 쓰고 불리하면 버림. 대신 **프리미엄** 미리 냄.\n> 판 사람은 프리미엄 받는 대신 상대가 하자면 무조건 응해야 함.\n\n### 콜 vs 풋\n- **콜** = **살** 권리 → 오를 것 같을 때\n- **풋** = **팔** 권리 → 내릴 것 같을 때\n\n### 손익 구조 ⭐⭐\n> **매수자**: 손실 **제한**(프리미엄까지) / 이익 **무제한**\n> **매도자**: 이익 **제한**(프리미엄까지) / 손실 **무제한**\n\n> 🚨 옵션 매도는 **푼돈 줍다가 큰돈 날리는** 구조임.\n> 평소엔 프리미엄이 꼬박꼬박 들어와서 꿀인 줄 아는데, 한 번 크게 터지면 그동안 번 거 다 날림.\n> 그래서 매도자한테 증거금 요구함.\n\n### 옵션 가격 = 내재가치 + 시간가치\n- **내재가치**: 지금 행사하면 얼마 남나\n- **시간가치**: 앞으로 유리해질 가능성 값. **만기 가까울수록 녹아 사라짐**\n\n## 스왑\n미래 현금흐름 맞바꾸기.\n> 🚨 금리스왑: 변동금리로 빌린 A는 금리 오를까 걱정, 고정으로 빌린 B는 금리 내릴까 아쉬움\n> → 이자 지급 의무를 **서로 바꿈** → 둘 다 원하는 형태가 됨. 윈윈.\n\n## 파생상품 기능\n위험 이전 / 가격 발견 / 유동성 공급\n> 🚨 **\"원금 보장\"은 기능이 아님.** 오히려 원금 넘어 손실 날 수 있음. 함정으로 나옴.\n\n▸ 마진콜: 증거금 부족해서 더 넣으라는 요구."},{"sub":"투자분석","title":"① 대안투자와 리스크관리","body":"## 대안투자란\n주식과 채권이라는 전통적 자산 **외의** 투자를 말합니다.\n- 부동산, 리츠\n- 헤지펀드\n- 사모투자펀드(PEF)\n- 원자재, 인프라\n- 사모대출\n\n> 국고채나 상장주식은 전통적 자산이므로 대안투자가 아닙니다. 선택지에 껴 나옵니다.\n\n## 대안투자의 특징\n- 전통자산과 **상관관계가 낮아** 분산효과를 기대할 수 있음\n- **유동성이 낮음**. 사고팔기 어렵고 환매가 제한적\n- 정보가 적고 평가가 어려움\n- 운용보수가 높은 편\n\n> 낮은 유동성이 대가입니다. 그 대신 유동성 프리미엄을 기대합니다.\n\n## 헤지펀드와 PEF\n- **헤지펀드**: 다양한 전략으로 절대수익을 추구. 공매도, 레버리지, 파생상품을 적극 활용\n- **PEF**: 비상장기업의 지분을 사서 가치를 높인 뒤 매각. 투자 기간이 길고 경영에 직접 관여\n\n## 리츠(REITs)\n여러 사람의 돈을 모아 부동산에 투자하고 임대수익을 배당하는 회사입니다.\n> 상장 리츠는 주식처럼 사고팔 수 있어 **소액으로 부동산에 투자**하고 현금화도 쉽습니다. 이익의 대부분을 배당해야 해서 배당수익률이 높은 편입니다.\n\n## 리스크의 종류\n- **시장위험**: 가격 변동\n- **신용위험**: 상대방 부도\n- **유동성위험**: 원할 때 못 파는 위험\n- **운영위험**: 내부 절차, 시스템, 사람의 실수나 사고\n- **법률위험**\n\n## VaR (Value at Risk)\n> **정상적인 시장에서 일정 기간 동안 주어진 신뢰수준하에 발생할 수 있는 최대손실예상액**\n\n예를 들어 1일 99% VaR이 10억이라면, 정상적인 상황에서 하루에 10억을 넘는 손실이 날 확률이 1% 정도라는 뜻입니다.\n\n> 한계가 분명합니다. **극단적 상황의 손실은 잡지 못합니다.** 정상적인 시장을 전제하기 때문입니다.\n> 그래서 **스트레스 테스트**로 보완합니다. 과거 위기 상황이나 극단적 시나리오를 가정해 손실을 추정하는 방법입니다.\n\n▸ 공매도: 빌려서 판 뒤 나중에 사서 갚는 거래.\n▸ 유동성 프리미엄: 현금화가 어려운 대가로 요구하는 추가 수익.\n▸ 스트레스 테스트: 극단적 상황을 가정한 손실 점검.","alt":"## 대안투자 = 주식·채권 말고 나머지\n부동산·리츠 / 헤지펀드 / **PEF** / 원자재·인프라 / 사모대출\n\n> 🚨 **국고채, 상장주식은 대안투자 아님.** 전통 자산임. 껴놓고 고르라고 함.\n\n## 특징\n- 전통자산과 **상관관계 낮음** → 분산효과 O\n- **유동성 낮음** → 사고팔기 어렵고 환매 제한\n- 정보 적고 평가 어려움\n- 보수 비쌈\n\n> 유동성이 낮은 게 대가임. 대신 **유동성 프리미엄**을 기대하는 거임. 묶이는 값을 받는 것.\n\n## 헤지펀드 vs PEF\n- **헤지펀드**: 온갖 전략으로 **절대수익** 추구. 공매도·레버리지·파생 적극 활용\n- **PEF**: 비상장기업 사서 가치 올린 뒤 팖. 기간 길고 **경영에 직접 관여**\n\n## 리츠\n돈 모아서 빌딩 사고 임대료를 배당으로 나눠줌.\n> 상장 리츠는 주식처럼 사고팔 수 있음 → **소액으로 부동산 투자** 가능\n> 이익 대부분을 배당해야 해서 배당수익률 높음.\n\n## 리스크 종류\n시장 / 신용 / 유동성 / **운영** / 법률\n> 🚨 **운영위험**이 껴 있음. 내부 절차·시스템·사람 실수로 나는 손실.\n> 시장이랑 상관없이 직원이 사고 쳐서 나는 손실도 리스크임.\n\n## VaR ⭐\n> **정상적인 시장에서, 일정 기간, 주어진 신뢰수준하에, 발생 가능한 최대손실예상액**\n\n1일 99% VaR = 10억 → 평범한 날에 10억 넘게 깨질 확률이 **1% 정도**\n\n> 🚨 한계가 시험 포인트임.\n> **\"정상적인 시장\"이 전제**임. 2008년 같은 극단 상황은 못 잡음.\n> \"VaR은 발생 가능한 손실의 절대 상한선이다\" → **오답.** 그거 넘을 수도 있음.\n>\n> 그래서 **스트레스 테스트**로 보완함. \"IMF 때처럼 되면 얼마 깨지나\" 돌려보는 거.\n\n▸ 공매도: 빌려서 팔고 나중에 사서 갚기."}]},{"id":"comphwal-1-sil","name":"컴퓨터활용능력 1급 실기","note":"상시시험 · 엑셀 계산/분석/기타작업, 액세스 DB구축/쿼리/폼·보고서","questions":[{"sub":"엑셀 함수","q":"VLOOKUP 함수에서 찾을 값과 정확히 일치하는 값만 찾으려면 네 번째 인수에 무엇을 지정하는가?","o":["TRUE 또는 1","FALSE 또는 0","생략","-1"],"a":1,"e":"네 번째 인수 range_lookup에 FALSE(0)를 넣으면 정확히 일치하는 값만 찾습니다. TRUE이거나 생략하면 근사값을 찾으며, 이 경우 첫 열이 오름차순 정렬되어 있어야 합니다."},{"sub":"엑셀 함수","q":"=INDEX(A2:C10, MATCH(\"홍길동\", A2:A10, 0), 3) 의 결과로 옳은 것은?","o":["A열에서 홍길동을 찾아 같은 행의 3번째 열 값","3행의 홍길동 값","홍길동이 있는 열 번호","홍길동의 개수"],"a":0,"e":"MATCH가 A열에서 홍길동의 행 위치를 찾고 INDEX가 그 행의 3번째 열 값을 반환합니다. VLOOKUP과 달리 찾을 열이 왼쪽에 없어도 되는 것이 이 조합의 장점입니다."},{"sub":"엑셀 함수","q":"배열 수식을 입력할 때 사용하는 키 조합은?","o":["Enter","Shift+Enter","Ctrl+Enter","Ctrl+Shift+Enter"],"a":3,"e":"배열 수식은 Ctrl+Shift+Enter로 입력하며 수식 앞뒤에 중괄호가 자동으로 붙습니다. 중괄호를 직접 입력하면 배열 수식으로 인식되지 않습니다."},{"sub":"엑셀 함수","q":"두 배열의 대응하는 요소끼리 곱한 뒤 그 합을 구하는 함수는?","o":["SUMIF","SUMPRODUCT","SUMSQ","SUBTOTAL"],"a":1,"e":"SUMPRODUCT는 배열 수식 없이도 조건별 합계나 가중평균을 구할 수 있어 실기에서 활용도가 높습니다. 조건식을 곱하는 형태로 다중 조건 집계에도 쓰입니다."},{"sub":"엑셀 함수","q":"여러 조건을 모두 만족하는 셀의 개수를 구하는 함수는?","o":["COUNT","COUNTA","COUNTIF","COUNTIFS"],"a":3,"e":"COUNTIF는 조건이 하나일 때, COUNTIFS는 조건이 둘 이상일 때 사용합니다. 합계는 SUMIFS, 평균은 AVERAGEIFS가 같은 구조를 가집니다."},{"sub":"엑셀 함수","q":"수식에서 오류가 발생했을 때 지정한 값을 대신 표시하는 함수는?","o":["IFERROR","ISERROR","IFNA","ERROR.TYPE"],"a":0,"e":"IFERROR(수식, 오류시 표시할 값) 형태로 사용합니다. ISERROR는 오류 여부를 참거짓으로만 판정하므로 IF와 함께 써야 같은 효과를 냅니다."},{"sub":"엑셀 분석작업","q":"고급 필터에서 두 조건을 모두 만족(AND)하는 데이터를 추출하려면 조건을 어떻게 입력하는가?","o":["서로 다른 행에 입력한다","같은 행에 입력한다","한 셀에 이어서 입력한다","조건 범위 없이 자동으로 처리된다"],"a":1,"e":"같은 행에 나란히 쓰면 AND, 서로 다른 행에 쓰면 OR로 처리됩니다. 조건 범위의 필드명은 원본 데이터의 필드명과 정확히 일치해야 합니다."},{"sub":"엑셀 분석작업","q":"부분합을 실행하기 전에 반드시 선행되어야 하는 작업은?","o":["표 서식 적용","그룹화할 기준 필드로 정렬","셀 병합","조건부 서식 적용"],"a":1,"e":"부분합은 기준 필드의 값이 바뀔 때마다 소계를 삽입하므로 미리 그 필드로 정렬되어 있어야 합니다. 정렬하지 않으면 같은 항목이 여러 그룹으로 흩어집니다."},{"sub":"엑셀 분석작업","q":"피벗 테이블의 원본 데이터가 수정되었을 때 결과에 반영하는 방법은?","o":["피벗 테이블을 삭제하고 다시 만든다","새로 고침을 실행한다","자동으로 즉시 반영된다","필드 목록을 다시 배치한다"],"a":1,"e":"피벗 테이블은 원본 변경이 자동 반영되지 않으므로 새로 고침을 실행해야 합니다. 다만 원본 범위 자체가 늘어난 경우에는 데이터 원본 변경으로 범위를 다시 지정해야 합니다."},{"sub":"엑셀 분석작업","q":"특정 범위의 값이나 목록에 있는 값만 입력되도록 제한하는 기능은?","o":["데이터 유효성 검사","조건부 서식","시트 보호","그룹 설정"],"a":0,"e":"데이터 유효성 검사로 정수 범위, 목록, 날짜 등의 제한과 설명 메시지, 오류 경고를 설정할 수 있습니다. 조건부 서식은 입력을 제한하지 않고 서식만 바꿉니다."},{"sub":"엑셀 분석작업","q":"수식의 결과가 원하는 값이 되도록 입력값을 역으로 찾아주는 기능은?","o":["시나리오","목표값 찾기","데이터 표","해 찾기"],"a":1,"e":"목표값 찾기는 변경할 셀이 하나일 때 사용합니다. 변수가 여러 개이고 제약조건이 있으면 해 찾기, 여러 경우의 결과를 비교하려면 시나리오를 사용합니다."},{"sub":"엑셀 분석작업","q":"매크로를 기록할 때 시작 셀 위치가 달라져도 동일하게 동작하도록 하려면?","o":["절대 참조로 기록한다","상대 참조로 기록한다","매크로 보안을 낮춘다","개인용 매크로 통합 문서에 저장한다"],"a":1,"e":"상대 참조로 기록하면 현재 선택된 셀을 기준으로 동작하므로 위치가 바뀌어도 같은 작업이 수행됩니다. 기본값은 절대 참조입니다."},{"sub":"엑셀 기타작업","q":"Access의 VBA에서 폼을 여는 명령으로 옳은 것은?","o":["DoCmd.OpenForm","Application.OpenForm","Form.Open","OpenForm.Execute"],"a":0,"e":"DoCmd 개체를 통해 OpenForm, OpenReport, OpenQuery, Close, RunSQL 등의 동작을 실행합니다. 폼 이름은 큰따옴표로 감싸 전달합니다."},{"sub":"엑셀 기타작업","q":"VBA에서 메시지 창을 화면에 표시하는 함수는?","o":["InputBox","MsgBox","Print","Debug"],"a":1,"e":"MsgBox는 메시지를 보여주고 사용자의 선택을 반환합니다. InputBox는 사용자로부터 값을 입력받는 함수로 목적이 다릅니다."},{"sub":"액세스 쿼리","q":"조회 결과에서 중복된 레코드를 제외하고 표시하는 SQL 예약어는?","o":["UNIQUE","DISTINCT","GROUP","HAVING"],"a":1,"e":"SELECT DISTINCT 필드명 형태로 사용하여 중복 행을 하나로 묶습니다. HAVING은 그룹화한 결과에 조건을 거는 절로 역할이 다릅니다."},{"sub":"액세스 쿼리","q":"기본키(Primary Key)의 특성으로 옳은 것은?","o":["중복될 수 없고 Null 값을 가질 수 없다","중복될 수 있으나 Null은 허용되지 않는다","Null 값을 가질 수 있다","한 테이블에 여러 개를 지정할 수 없다는 제약이 없다"],"a":0,"e":"기본키는 레코드를 유일하게 식별하므로 중복과 Null이 모두 허용되지 않습니다. 여러 필드를 묶어 복합 기본키로 지정할 수는 있지만 기본키 자체는 테이블당 하나입니다."},{"sub":"엑셀 함수","q":"VLOOKUP과 HLOOKUP의 차이로 옳은 것은?","o":["VLOOKUP은 세로 방향, HLOOKUP은 가로 방향으로 찾는다","VLOOKUP은 가로, HLOOKUP은 세로로 찾는다","둘은 완전히 같다","HLOOKUP은 숫자만 찾을 수 있다"],"a":0,"e":"표에서 값을 찾을 때 쓰는 함수인데, 표가 어떻게 생겼느냐에 따라 골라 씁니다.\n대부분의 표는 첫 열에 이름이 세로로 죽 나열되고 오른쪽으로 항목이 펼쳐집니다. 이럴 때 VLOOKUP을 씁니다. V는 Vertical, 세로라는 뜻입니다. 반대로 첫 행에 이름이 가로로 나열된 표라면 HLOOKUP을 씁니다. H는 Horizontal, 가로입니다.\n실기에서는 세로 표가 훨씬 많이 나와서 VLOOKUP을 주로 쓰게 됩니다.\n\n▸ 인수: 함수 괄호 안에 넣는 값들. 쉼표로 구분합니다.\n▸ 범위: 찾을 대상이 되는 셀들의 영역."},{"sub":"엑셀 함수","q":"=CHOOSE(2, \"봄\", \"여름\", \"가을\", \"겨울\") 의 결과는?","o":["봄","여름","가을","겨울"],"a":1,"e":"CHOOSE는 번호를 주면 그 번호에 해당하는 값을 꺼내주는 함수입니다. 첫 번째 인수가 번호이고 그 뒤로 후보들이 줄줄이 이어집니다.\n여기서는 2번을 달라고 했으니 두 번째 후보인 여름이 나옵니다.\n실기에서는 주민등록번호 뒷자리로 성별을 구하거나 날짜에서 분기를 구할 때 자주 등장합니다. MID로 숫자를 뽑아 CHOOSE에 넣는 식입니다.\n\n▸ CHOOSE: 번호에 해당하는 항목을 선택하는 함수.\n▸ 중첩: 함수 안에 다른 함수를 넣어 쓰는 것."},{"sub":"엑셀 함수","q":"문자열 \"20260910\"에서 가운데 두 글자 \"09\"를 뽑아내는 수식은?","o":["=LEFT(A1,2)","=RIGHT(A1,2)","=MID(A1,5,2)","=FIND(A1,5,2)"],"a":2,"e":"글자를 잘라내는 함수는 세 가지입니다.\nLEFT는 왼쪽부터, RIGHT는 오른쪽부터 몇 글자를 가져옵니다. MID는 중간에서 가져오는데, 몇 번째 글자부터 시작해서 몇 글자를 가져올지를 지정합니다.\n20260910에서 09는 다섯 번째 글자부터 시작하는 두 글자이므로 MID(A1, 5, 2)가 됩니다. 시작 위치를 셀 때 첫 글자를 1로 센다는 점을 기억하세요.\n\n▸ 문자열: 글자로 이루어진 데이터.\n▸ MID(문자열, 시작위치, 글자수): 중간에서 잘라내는 함수."},{"sub":"엑셀 함수","q":"=ROUND(3.14159, 2) 의 결과는?","o":["3","3.1","3.14","3.142"],"a":2,"e":"ROUND는 반올림하는 함수입니다. 두 번째 인수는 '소수점 아래 몇 자리까지 남길까'를 뜻합니다.\n2를 넣었으니 소수점 두 자리까지 남기고 그 아래를 반올림해 3.14가 됩니다.\n헷갈리기 쉬운 것이 음수입니다. -1을 넣으면 십의 자리에서 반올림하고, -2를 넣으면 백의 자리에서 반올림합니다. 즉 양수는 소수점 아래, 음수는 정수 쪽으로 간다고 외우면 됩니다.\n\n▸ ROUND: 반올림.\n▸ ROUNDUP: 무조건 올림.\n▸ ROUNDDOWN: 무조건 내림."},{"sub":"엑셀 함수","q":"=MOD(10, 3) 의 결과는?","o":["1","3","3.33","30"],"a":0,"e":"MOD는 나눗셈의 나머지를 구하는 함수입니다. 10을 3으로 나누면 몫이 3이고 나머지가 1이므로 결과는 1입니다.\n실기에서 자주 쓰이는 용도가 두 가지 있습니다. 하나는 홀수와 짝수 판별입니다. 2로 나눈 나머지가 1이면 홀수입니다. 다른 하나는 주민등록번호 뒷자리로 성별을 가릴 때입니다.\n몫만 구하고 싶으면 QUOTIENT를 씁니다.\n\n▸ MOD(숫자, 나눌수): 나머지를 구하는 함수.\n▸ 나머지: 나눗셈에서 더 이상 나눠지지 않고 남는 수."},{"sub":"엑셀 함수","q":"=INT(-3.7) 의 결과는?","o":["-3","-4","3","4"],"a":1,"e":"INT는 소수점을 버리고 정수로 만드는 함수인데, 정확히는 '그 수보다 크지 않은 가장 큰 정수'를 구합니다. 쉽게 말해 수직선에서 왼쪽 방향으로 내립니다.\n-3.7의 왼쪽에 있는 정수는 -4이므로 결과는 -4입니다. 단순히 소수점을 떼는 TRUNC와 다른 점이 여기입니다. TRUNC(-3.7)은 -3이 됩니다.\n양수일 때는 둘이 같은 값을 내므로 음수에서만 구분하면 됩니다.\n\n▸ INT: 내림하여 정수로 만드는 함수.\n▸ TRUNC: 소수 부분을 잘라내는 함수."},{"sub":"엑셀 함수","q":"점수 범위에서 순위를 구할 때 사용하는 함수는?","o":["RANK.EQ","COUNTIF","LARGE","MATCH"],"a":0,"e":"RANK.EQ는 어떤 값이 전체에서 몇 등인지 알려줍니다. 형식은 RANK.EQ(내 점수, 전체 범위, 순서)입니다.\n세 번째 인수가 중요합니다. 0을 넣거나 생략하면 큰 값이 1등인 내림차순이고, 1을 넣으면 작은 값이 1등인 오름차순입니다. 점수 순위는 보통 생략하고, 기록이 짧을수록 좋은 육상 기록 같은 경우에 1을 씁니다.\n또 하나 주의할 점은 전체 범위를 절대참조로 고정해야 한다는 것입니다. 아래로 채우기를 하면 범위가 밀려 내려가 엉뚱한 순위가 나옵니다.\n\n▸ 절대참조: $A$1처럼 달러 기호를 붙여 위치가 밀리지 않게 고정하는 것.\n▸ 내림차순: 큰 값부터 작은 값 순서.\n▸ EQ: Equal. 같은 값에 같은 순위를 준다는 뜻입니다."},{"sub":"엑셀 함수","q":"범위에서 세 번째로 큰 값을 구하는 함수는?","o":["=MAX(범위,3)","=LARGE(범위,3)","=SMALL(범위,3)","=RANK(범위,3)"],"a":1,"e":"MAX는 가장 큰 값 하나만 구합니다. 두 번째, 세 번째로 큰 값이 필요하면 LARGE를 씁니다. LARGE(범위, 3)은 세 번째로 큰 값을 돌려줍니다.\n반대로 작은 쪽에서 세는 것은 SMALL입니다. SMALL(범위, 1)은 최솟값과 같습니다.\n실기에서는 상위 3개 평균을 구하라는 식으로 LARGE를 여러 번 더하는 문제가 자주 나옵니다.\n\n▸ LARGE(범위, k): k번째로 큰 값.\n▸ SMALL(범위, k): k번째로 작은 값."},{"sub":"엑셀 함수","q":"여러 조건을 모두 만족하는 셀들의 평균을 구하는 함수는?","o":["AVERAGE","AVERAGEA","AVERAGEIF","AVERAGEIFS"],"a":3,"e":"조건이 붙는 함수는 뒤에 IF가 붙고, 조건이 여러 개면 IFS로 복수형이 됩니다.\n합계는 SUMIF와 SUMIFS, 개수는 COUNTIF와 COUNTIFS, 평균은 AVERAGEIF와 AVERAGEIFS입니다.\n한 가지 주의할 점이 있습니다. SUMIF는 범위를 먼저 쓰고 합계 범위를 마지막에 쓰는데, SUMIFS는 합계 범위를 맨 앞에 씁니다. 인수 순서가 뒤바뀌는 것이라 시험에서 자주 틀립니다.\n\n▸ AVERAGEIFS(평균범위, 조건범위1, 조건1, ...): 다중 조건 평균.\n▸ 조건: \">=80\" 처럼 큰따옴표로 감싸 적습니다."},{"sub":"엑셀 함수","q":"데이터베이스 함수 DSUM의 인수 구성으로 옳은 것은?","o":["=DSUM(전체범위, 필드, 조건범위)","=DSUM(조건범위, 필드, 전체범위)","=DSUM(필드, 조건, 범위)","=DSUM(범위, 조건)"],"a":0,"e":"DSUM은 표에서 조건에 맞는 행만 골라 특정 열의 값을 더하는 함수입니다. SUMIFS와 비슷한 일을 하지만 조건을 적는 방식이 다릅니다.\n인수는 세 개입니다. 첫째는 제목 행을 포함한 표 전체, 둘째는 더할 열(열 제목을 큰따옴표로 쓰거나 몇 번째 열인지 숫자로 씀), 셋째는 따로 만들어 둔 조건 범위입니다.\n조건 범위는 고급 필터와 똑같은 방식으로 만듭니다. 같은 행에 쓰면 AND, 다른 행에 쓰면 OR입니다.\n\n▸ 데이터베이스 함수: DSUM, DAVERAGE, DCOUNT, DMAX 등 D로 시작하는 함수들.\n▸ 필드: 표의 한 열. 열 제목이 필드명입니다."},{"sub":"엑셀 함수","q":"=IFERROR(VLOOKUP(A1,표,2,0), \"없음\") 이 하는 일은?","o":["항상 없음을 표시한다","VLOOKUP이 오류를 내면 없음을 표시한다","VLOOKUP 결과에 없음을 덧붙인다","오류가 나면 0을 표시한다"],"a":1,"e":"VLOOKUP은 찾는 값이 표에 없으면 #N/A라는 오류를 냅니다. 화면에 오류 코드가 그대로 뜨면 보기 흉하고 그 셀을 참조하는 다른 계산까지 오류가 번집니다.\nIFERROR는 앞의 계산이 오류를 내면 뒤에 적어둔 값을 대신 보여줍니다. 오류가 없으면 원래 결과를 그대로 보여줍니다.\n실기에서는 조회 함수를 감싸는 용도로 거의 습관처럼 쓰입니다.\n\n▸ #N/A: 값을 찾지 못했을 때 나는 오류.\n▸ #DIV/0!: 0으로 나눴을 때 나는 오류.\n▸ #VALUE!: 인수 형식이 맞지 않을 때 나는 오류."},{"sub":"엑셀 함수","q":"두 날짜 사이의 만 나이를 구할 때 사용하는 함수는?","o":["DATEDIF","DAYS","EDATE","NETWORKDAYS"],"a":0,"e":"DATEDIF는 두 날짜 사이의 간격을 년, 월, 일 단위로 구합니다. 형식은 DATEDIF(시작일, 종료일, 단위)이고 단위에 \"Y\"를 넣으면 만으로 몇 년이 지났는지 나옵니다.\n생년월일과 오늘 날짜를 넣고 \"Y\"를 지정하면 만 나이가 됩니다. \"M\"은 개월 수, \"D\"는 일수입니다.\n이 함수는 엑셀 함수 목록에 나오지 않는 숨은 함수라 직접 입력해야 합니다.\n\n▸ TODAY(): 오늘 날짜를 반환하는 함수. 괄호 안이 비어 있습니다.\n▸ 만 나이: 생일이 지나야 한 살을 더하는 계산 방식."},{"sub":"엑셀 함수","q":"주말과 공휴일을 제외한 근무일수를 구하는 함수는?","o":["DAYS","NETWORKDAYS","WORKDAY","WEEKDAY"],"a":1,"e":"NETWORKDAYS는 시작일과 종료일 사이에서 토요일, 일요일을 빼고 실제 일한 날이 며칠인지 세어줍니다. 세 번째 인수에 공휴일 목록이 담긴 범위를 넣으면 그 날짜들도 제외합니다.\n반대로 WORKDAY는 '오늘부터 근무일 기준 10일 뒤는 며칠인가'처럼 날짜를 구할 때 씁니다. 세는 것이 NETWORKDAYS, 날짜를 구하는 것이 WORKDAY라고 기억하면 됩니다.\n\n▸ WEEKDAY: 날짜가 무슨 요일인지 숫자로 알려주는 함수.\n▸ 공휴일 범위: 별도 시트에 적어둔 휴일 날짜 목록."},{"sub":"엑셀 함수","q":"셀 값이 비어 있는지 판정하는 함수는?","o":["ISBLANK","ISERROR","ISNUMBER","ISTEXT"],"a":0,"e":"IS로 시작하는 함수들은 셀이 어떤 상태인지 확인해 TRUE 또는 FALSE를 돌려줍니다.\nISBLANK는 비어 있는지, ISNUMBER는 숫자인지, ISTEXT는 문자인지, ISERROR는 오류인지를 판정합니다. 보통 IF와 함께 써서 상태에 따라 다른 값을 표시하게 만듭니다.\n주의할 점은 수식 결과로 빈 문자열이 들어 있는 셀은 ISBLANK가 FALSE를 낸다는 것입니다. 눈에는 비어 보여도 실제로는 무언가 들어 있기 때문입니다.\n\n▸ TRUE / FALSE: 참과 거짓을 나타내는 논리값.\n▸ 빈 문자열: 아무 글자도 없는 문자. 수식에서는 \"\"로 씁니다."},{"sub":"엑셀 함수","q":"MATCH 함수의 세 번째 인수에 0을 지정하면?","o":["정확히 일치하는 값의 위치를 찾는다","이하인 값 중 최대값을 찾는다","이상인 값 중 최소값을 찾는다","오류가 발생한다"],"a":0,"e":"MATCH는 값이 범위에서 몇 번째에 있는지 위치 번호를 알려주는 함수입니다.\n세 번째 인수는 찾는 방식입니다. 0은 정확히 일치하는 것만 찾습니다. 1은 찾는 값 이하 중 가장 큰 값을 찾는데 범위가 오름차순으로 정렬되어 있어야 합니다. -1은 반대로 이상 중 최소값을 찾고 내림차순 정렬이 필요합니다.\n실기에서는 거의 0을 씁니다. 정렬 조건이 필요 없고 결과가 확실하기 때문입니다.\n\n▸ MATCH(찾을값, 범위, 옵션): 위치 번호를 반환.\n▸ INDEX: 위치 번호를 주면 값을 꺼내는 함수. MATCH와 짝을 이룹니다."},{"sub":"엑셀 함수","q":"기준 셀에서 지정한 행과 열만큼 이동한 위치의 값을 반환하는 함수는?","o":["OFFSET","INDIRECT","ADDRESS","COLUMN"],"a":0,"e":"OFFSET은 기준점에서 몇 칸 아래로, 몇 칸 오른쪽으로 이동한 자리를 가리킵니다. 형식은 OFFSET(기준셀, 행이동, 열이동, 높이, 너비)입니다.\n예를 들어 OFFSET(A1, 2, 1)은 A1에서 아래로 2칸, 오른쪽으로 1칸 간 B3을 가리킵니다. 뒤의 높이와 너비를 지정하면 한 칸이 아니라 영역을 잡을 수도 있어서 동적 범위를 만들 때 씁니다.\n\n▸ INDIRECT: 문자로 적힌 주소를 실제 참조로 바꿔주는 함수.\n▸ 동적 범위: 데이터가 늘어나면 자동으로 함께 늘어나는 범위."},{"sub":"엑셀 함수","q":"여러 셀의 문자열을 하나로 이어 붙이는 방법으로 옳지 않은 것은?","o":["=A1&B1","=CONCAT(A1,B1)","=CONCATENATE(A1,B1)","=SUM(A1,B1)"],"a":3,"e":"문자를 이어 붙이는 것을 연결 또는 결합이라고 합니다. 앰퍼샌드 기호를 쓰거나 CONCAT, CONCATENATE 함수를 씁니다.\nSUM은 숫자를 더하는 함수라 문자에는 쓸 수 없습니다. 문자를 SUM에 넣으면 무시되거나 오류가 납니다.\n사이에 구분 기호를 넣고 싶으면 TEXTJOIN을 쓰면 편합니다. 구분자를 한 번만 지정하면 알아서 사이사이에 끼워 줍니다.\n\n▸ & (앰퍼샌드): 문자열을 잇는 연산자.\n▸ TEXTJOIN(구분자, 빈셀무시, 범위): 구분자를 넣어 이어 붙이는 함수."},{"sub":"엑셀 함수","q":"=TEXT(0.85, \"0%\") 의 결과는?","o":["0.85","85%","0%","85"],"a":1,"e":"TEXT는 숫자를 원하는 모양의 문자로 바꾸는 함수입니다. 두 번째 인수에 표시 형식을 적습니다.\n0.85에 \"0%\" 형식을 적용하면 100을 곱하고 퍼센트 기호를 붙여 85%가 됩니다. \"#,##0\"을 적용하면 천 단위마다 쉼표가 들어가고, \"yyyy-mm-dd\"를 적용하면 날짜 모양이 됩니다.\n주의할 점은 결과가 숫자가 아니라 문자가 된다는 것입니다. 그대로 계산에 넣으면 문제가 생길 수 있습니다.\n\n▸ 표시 형식: 값을 화면에 어떤 모양으로 보여줄지 정하는 규칙.\n▸ 셀 서식과의 차이: 셀 서식은 겉모습만 바꾸고 값은 숫자로 남지만, TEXT는 값 자체를 문자로 바꿉니다."},{"sub":"엑셀 함수","q":"조건에 따라 세 가지 이상으로 결과를 나누어야 할 때 사용할 수 없는 방법은?","o":["IF 함수를 중첩한다","IFS 함수를 사용한다","CHOOSE와 MATCH를 조합한다","SUM 함수를 중첩한다"],"a":3,"e":"점수에 따라 수, 우, 미, 양, 가를 매기는 것처럼 갈래가 여럿일 때 쓰는 방법입니다.\n가장 기본은 IF 안에 IF를 계속 넣는 중첩입니다. 다만 괄호가 많아져 실수하기 쉽습니다. IFS는 조건과 결과를 나란히 나열하면 되어 훨씬 읽기 편합니다. CHOOSE와 MATCH를 조합하거나 VLOOKUP의 근사값 찾기를 쓰는 방법도 있습니다.\nSUM은 더하기만 하는 함수라 조건 분기와 아무 관련이 없습니다.\n\n▸ 중첩: 함수 안에 같은 함수를 다시 넣는 것.\n▸ 조건 분기: 상황에 따라 다른 결과를 내놓는 구조."},{"sub":"엑셀 함수","q":"셀 참조에서 F4 키를 눌렀을 때 A1이 바뀌는 순서로 옳은 것은?","o":["$A$1 → A$1 → $A1 → A1","A$1 → $A$1 → $A1 → A1","$A1 → A$1 → $A$1 → A1","A1 → $A1 → A$1 → $A$1"],"a":0,"e":"F4는 참조 방식을 순서대로 바꿔주는 단축키입니다. A1에 커서를 두고 누르면 절대참조, 행고정, 열고정, 상대참조 순으로 돌아갑니다.\n달러 기호가 붙은 쪽이 고정됩니다. $A$1은 행과 열 모두 고정, A$1은 행만 고정, $A1은 열만 고정, A1은 아무것도 고정하지 않아 복사할 때 함께 밀립니다.\n실기에서 수식을 채우기할 때 참조를 잘못 잡으면 전부 틀리므로 이 감각이 중요합니다.\n\n▸ 상대참조: 복사하면 위치가 함께 이동하는 참조.\n▸ 절대참조: 복사해도 위치가 고정되는 참조.\n▸ 혼합참조: 행이나 열 중 하나만 고정한 참조."},{"sub":"엑셀 배열수식","q":"배열 수식에서 조건들을 곱셈 기호(*)로 연결하는 것의 의미는?","o":["OR 조건","AND 조건","NOT 조건","단순 곱셈"],"a":1,"e":"배열 수식에서는 조건이 참이면 1, 거짓이면 0으로 계산됩니다.\n두 조건을 곱하면 둘 다 1일 때만 1이 되고 하나라도 0이면 0이 됩니다. 곱셈이 AND 역할을 하는 이유입니다. 반대로 더하면 하나라도 1이면 1 이상이 되므로 OR 역할을 합니다.\n그래서 =SUM((조건1)*(조건2)*(값범위)) 형태가 다중 조건 합계의 기본 뼈대가 됩니다.\n\n▸ 배열: 여러 값이 한 덩어리로 묶인 것.\n▸ 논리값: TRUE는 1, FALSE는 0으로 계산에 쓰입니다."},{"sub":"엑셀 배열수식","q":"배열 수식 =SUM((A2:A10=\"영업부\")*(B2:B10>=80)) 이 구하는 값은?","o":["영업부이면서 점수가 80 이상인 건수","영업부 점수의 합계","전체 인원수","80점 이상인 점수의 합"],"a":0,"e":"두 조건이 모두 참인 행에서만 1이 만들어지고 나머지는 0이 됩니다. 이 1들을 SUM으로 다 더하면 조건에 맞는 행이 몇 개인지, 즉 건수가 나옵니다.\n만약 합계를 구하고 싶다면 마지막에 더할 값 범위를 한 번 더 곱해야 합니다. =SUM((A2:A10=\"영업부\")*(B2:B10>=80)*(C2:C10)) 형태가 됩니다.\n건수인지 합계인지는 값 범위를 곱했는지로 갈립니다.\n\n▸ 건수: 조건에 맞는 행의 개수.\n▸ 값 범위: 실제로 더하거나 평균 낼 숫자들이 있는 영역."},{"sub":"엑셀 배열수식","q":"배열 수식으로 조건에 맞는 값 중 최댓값을 구하는 형태로 옳은 것은?","o":["{=MAX(IF(조건, 값범위))}","{=MAX(조건, 값범위)}","{=MAXIF(조건, 값범위)}","{=IF(MAX(조건), 값범위)}"],"a":0,"e":"MAXIFS 함수가 없던 시절부터 쓰던 방식입니다. IF가 조건에 맞는 값만 남기고 나머지는 FALSE로 만들면 MAX가 그중 최댓값을 고릅니다.\n형태는 =MAX(IF(조건, 값범위))이고 반드시 Ctrl+Shift+Enter로 입력해야 중괄호가 생기며 배열 수식으로 동작합니다. 그냥 Enter를 누르면 엉뚱한 값이 나옵니다.\n최솟값은 MIN으로 바꾸면 됩니다.\n\n▸ Ctrl+Shift+Enter: 배열 수식 입력 키. 줄여서 CSE라고 부릅니다.\n▸ 중괄호 { }: 배열 수식임을 나타내는 표시. 직접 입력하면 안 됩니다."},{"sub":"엑셀 배열수식","q":"배열 수식으로 입력된 셀의 일부만 수정하려고 할 때 나타나는 현상은?","o":["정상적으로 수정된다","배열의 일부는 변경할 수 없다는 메시지가 나타난다","셀이 삭제된다","자동으로 일반 수식으로 바뀐다"],"a":1,"e":"배열 수식이 여러 셀에 걸쳐 입력되면 그 셀들은 한 덩어리로 묶입니다. 덩어리 중 한 칸만 고치려고 하면 엑셀이 거부하며 배열의 일부는 변경할 수 없다는 경고를 냅니다.\n고치려면 배열이 입력된 범위 전체를 선택한 뒤 수식을 수정하고 다시 Ctrl+Shift+Enter로 입력해야 합니다.\n\n▸ 배열 범위: 하나의 배열 수식이 결과를 채우고 있는 셀 영역."},{"sub":"엑셀 배열수식","q":"구간별 도수분포를 한 번에 구하는 배열 함수는?","o":["FREQUENCY","COUNTIF","SUBTOTAL","TREND"],"a":0,"e":"FREQUENCY는 값들이 각 구간에 몇 개씩 들어가는지를 한꺼번에 세어줍니다. 형식은 FREQUENCY(데이터 범위, 구간 경계 범위)입니다.\n결과가 여러 칸에 걸쳐 나오므로 먼저 결과가 들어갈 세로 범위를 전부 선택한 뒤 수식을 넣고 Ctrl+Shift+Enter를 눌러야 합니다. 결과 칸을 구간 개수보다 하나 더 잡아야 마지막 구간을 넘는 값도 담깁니다.\n\n▸ 도수분포: 값이 구간별로 몇 개씩 분포하는지를 정리한 것.\n▸ 구간 경계: 각 구간의 상한값들을 적어둔 목록."},{"sub":"엑셀 배열수식","q":"행과 열을 서로 바꾸어 표시하는 배열 함수는?","o":["TRANSPOSE","OFFSET","INDIRECT","INDEX"],"a":0,"e":"TRANSPOSE는 가로로 늘어선 데이터를 세로로, 세로로 늘어선 데이터를 가로로 뒤집습니다.\n3행 5열 데이터를 뒤집으면 5행 3열이 되므로, 결과를 넣을 범위를 미리 5행 3열로 선택한 뒤 수식을 입력하고 Ctrl+Shift+Enter를 눌러야 합니다. 범위를 잘못 잡으면 값이 잘리거나 오류가 채워집니다.\n값만 바꾸면 되는 경우에는 복사한 뒤 선택하여 붙여넣기에서 행열 바꿈을 써도 됩니다.\n\n▸ 전치: 행과 열을 맞바꾸는 것.\n▸ 선택하여 붙여넣기: 값, 서식, 수식 등 원하는 요소만 골라 붙이는 기능."},{"sub":"엑셀 배열수식","q":"배열 상수 {1,2,3}에서 쉼표가 의미하는 것은?","o":["같은 행의 열 구분","같은 열의 행 구분","연산자","주석"],"a":0,"e":"배열 상수는 중괄호 안에 값을 직접 적어 만든 배열입니다. 쉼표는 옆으로 넘어가는 열 구분이고 세미콜론은 아래로 내려가는 행 구분입니다.\n{1,2,3}은 가로 한 줄에 세 개, {1;2;3}은 세로 한 줄에 세 개입니다. {1,2;3,4}는 2행 2열이 됩니다.\n이 표기는 CHOOSE나 SUMPRODUCT 안에서 여러 값을 한꺼번에 넘길 때 쓰입니다.\n\n▸ 배열 상수: 셀을 참조하지 않고 값을 직접 적어 만든 배열.\n▸ 세미콜론: 배열에서 행을 구분하는 기호."},{"sub":"엑셀 배열수식","q":"조건에 맞는 값들의 평균을 배열 수식으로 구하는 형태로 옳은 것은?","o":["{=AVERAGE(IF(조건, 값범위))}","{=AVERAGE(조건, 값범위)}","{=AVERAGEIF(값범위)}","{=SUM(조건)/COUNT(조건)}"],"a":0,"e":"MAX와 같은 원리입니다. IF가 조건에 맞는 값만 남기고 나머지는 FALSE로 만들면 AVERAGE가 남은 값들만 평균 냅니다. AVERAGE는 FALSE를 무시하기 때문에 조건에 맞는 값만 계산에 들어갑니다.\n반드시 Ctrl+Shift+Enter로 입력해야 하며, 그냥 Enter를 누르면 첫 번째 값만 반영되어 잘못된 결과가 나옵니다.\n\n▸ AVERAGEIFS: 같은 일을 배열 수식 없이 처리하는 함수. 실기에서는 두 방법 모두 요구될 수 있습니다."},{"sub":"엑셀 기본작업","q":"사용자 지정 표시 형식에서 코드 [빨강]#,##0;-#,##0 이 의미하는 것은?","o":["양수는 빨강으로 천단위 구분, 음수는 검정으로 표시","모든 숫자를 빨강으로 표시","음수만 빨강으로 표시","글자를 빨강으로 표시"],"a":0,"e":"사용자 지정 형식은 세미콜론으로 구역을 나눕니다. 순서가 정해져 있어서 양수, 음수, 0, 문자 순입니다.\n여기서는 구역이 두 개뿐이라 앞은 양수, 뒤는 음수 규칙입니다. 앞 구역에 대괄호로 색을 지정했으니 양수만 빨강이 됩니다. #,##0은 천 단위마다 쉼표를 넣으라는 뜻입니다.\n실기에서는 조건을 대괄호에 넣어 [>=90][파랑]처럼 쓰는 문제도 나옵니다.\n\n▸ 세미콜론(;): 표시 형식의 구역을 나누는 기호.\n▸ #: 숫자가 없으면 표시하지 않는 자리.\n▸ 0: 숫자가 없어도 0을 표시하는 자리."},{"sub":"엑셀 기본작업","q":"조건부 서식에서 수식을 사용해 특정 행 전체에 서식을 적용하려 할 때 참조 방식으로 옳은 것은?","o":["=$A2=\"완료\" 처럼 열만 고정한다","=A2=\"완료\" 처럼 고정하지 않는다","=$A$2=\"완료\" 처럼 모두 고정한다","=A$2=\"완료\" 처럼 행만 고정한다"],"a":0,"e":"조건부 서식은 선택한 범위의 각 셀마다 수식을 다시 계산합니다. 행 전체를 칠하려면 어느 열에 있든 항상 A열의 값을 봐야 하므로 열을 고정해야 합니다.\n$A2처럼 열에만 달러를 붙이면 B, C, D열로 옮겨가도 계속 A열을 보게 되고, 행 번호는 아래로 내려가며 함께 바뀝니다. 이것이 행 단위 강조의 핵심입니다.\n모두 고정하면 첫 행 조건만 보게 되어 전체가 같은 서식이 되고, 아무것도 고정하지 않으면 각 셀이 자기 열을 봐서 엉뚱해집니다.\n\n▸ 혼합참조: 행이나 열 중 하나만 고정한 참조.\n▸ 조건부 서식: 조건을 만족하는 셀에만 자동으로 서식을 입히는 기능."},{"sub":"엑셀 기본작업","q":"고급 필터에서 조건을 서로 다른 행에 입력하면?","o":["AND 조건으로 처리된다","OR 조건으로 처리된다","조건이 무시된다","오류가 발생한다"],"a":1,"e":"고급 필터의 조건 범위는 위치로 의미가 결정됩니다.\n같은 행에 나란히 적으면 두 조건을 동시에 만족해야 하는 AND가 됩니다. 서로 다른 행에 적으면 둘 중 하나만 만족해도 되는 OR가 됩니다.\n조건 범위의 필드명은 원본 표의 필드명과 정확히 같아야 하며, 수식을 조건으로 쓸 때는 필드명 자리를 비우거나 원본과 다른 이름을 써야 합니다.\n\n▸ 조건 범위: 필터 조건을 적어둔 별도의 셀 영역.\n▸ 필드명: 표의 열 제목."},{"sub":"엑셀 기본작업","q":"텍스트 나누기 기능에서 구분 기호로 사용할 수 없는 것은?","o":["탭","쉼표","공백","셀 색상"],"a":3,"e":"텍스트 나누기는 한 칸에 뭉쳐 있는 데이터를 여러 열로 쪼개는 기능입니다.\n쪼개는 기준은 두 가지입니다. 하나는 탭, 쉼표, 세미콜론, 공백 같은 구분 기호이고 다른 하나는 글자 수를 세어 자르는 너비 고정입니다. 사용자가 직접 기호를 지정할 수도 있습니다.\n색상은 데이터가 아니라 서식이라 나누는 기준이 될 수 없습니다.\n\n▸ 구분 기호: 값과 값 사이를 나누는 문자.\n▸ 너비 고정: 정해진 글자 수마다 잘라 나누는 방식."},{"sub":"엑셀 기본작업","q":"데이터 유효성 검사에서 목록을 지정할 때 사용할 수 없는 방법은?","o":["값을 쉼표로 구분해 직접 입력","셀 범위를 참조","이름 정의를 참조","셀에 입력된 서식을 참조"],"a":3,"e":"유효성 검사의 목록은 드롭다운으로 고를 값들의 후보입니다.\n원본에 사과,배,감 처럼 쉼표로 직접 적을 수도 있고, =$A$1:$A$5처럼 범위를 지정할 수도 있으며, 미리 이름을 정의해 두었다면 =과일 처럼 이름을 쓸 수도 있습니다.\n서식은 값이 아니라 겉모습이므로 목록의 원본이 될 수 없습니다.\n\n▸ 이름 정의: 특정 범위에 별명을 붙여두는 기능.\n▸ 드롭다운: 눌러서 목록에서 고르게 하는 입력 방식."},{"sub":"엑셀 기본작업","q":"셀에 입력된 데이터 중 중복된 값을 한 번에 제거하는 기능은?","o":["중복된 항목 제거","텍스트 나누기","데이터 통합","부분합"],"a":0,"e":"데이터 탭의 중복된 항목 제거를 쓰면 선택한 열을 기준으로 같은 값을 가진 행을 지우고 첫 번째 것만 남깁니다.\n기준 열을 여러 개 선택하면 그 열들의 값이 모두 같을 때만 중복으로 봅니다. 예를 들어 이름과 부서를 함께 기준으로 잡으면 동명이인이 다른 부서에 있을 때는 지워지지 않습니다.\n실행하면 되돌리기 전에는 복구가 어려우므로 원본을 복사해두고 하는 것이 안전합니다.\n\n▸ 기준 열: 중복 여부를 판단할 때 비교하는 열."},{"sub":"엑셀 기본작업","q":"틀 고정에서 3행까지와 A열을 동시에 고정하려면 어느 셀을 선택하고 실행해야 하는가?","o":["A1","B4","A4","B1"],"a":1,"e":"틀 고정은 선택한 셀을 기준으로 그 셀의 위쪽 행과 왼쪽 열을 얼려버립니다.\n3행까지 얼리고 A열을 얼리려면 4행이면서 B열인 셀, 즉 B4를 선택하고 실행하면 됩니다. 선택한 셀 자체는 얼지 않고 그 위와 왼쪽이 언다는 점이 핵심입니다.\n행만 고정하려면 그 아래 행의 A열 셀을, 열만 고정하려면 그 오른쪽 열의 1행 셀을 선택합니다.\n\n▸ 틀 고정: 스크롤해도 특정 행과 열이 화면에 계속 보이게 하는 기능."},{"sub":"엑셀 기본작업","q":"시트 보호를 실행했을 때 특정 셀만 입력이 가능하게 하려면 미리 해야 할 작업은?","o":["해당 셀의 잠금 속성을 해제한다","해당 셀을 병합한다","해당 셀에 색을 칠한다","해당 셀에 메모를 단다"],"a":0,"e":"엑셀의 모든 셀은 기본적으로 잠금 속성이 켜져 있습니다. 다만 시트 보호를 걸기 전까지는 이 속성이 아무 효과가 없습니다.\n따라서 입력을 허용할 셀만 셀 서식에서 잠금을 해제한 뒤 시트 보호를 실행하면, 잠금이 풀린 셀에만 입력할 수 있게 됩니다. 순서를 반대로 하면 셀 서식 자체를 열 수 없습니다.\n\n▸ 잠금: 시트 보호가 걸렸을 때 편집을 막을지 여부를 정하는 셀 속성.\n▸ 시트 보호: 시트의 편집을 제한하는 기능. 암호를 걸 수 있습니다."},{"sub":"엑셀 분석작업","q":"피벗 테이블에서 값 필드에 텍스트 데이터를 넣으면 기본으로 설정되는 계산 방식은?","o":["합계","개수","평균","최댓값"],"a":1,"e":"값 영역에 넣은 데이터가 전부 숫자면 합계가 기본이 되고, 문자가 섞여 있거나 빈 칸이 있으면 개수가 기본이 됩니다.\n원하는 계산으로 바꾸려면 값 필드 설정에서 합계, 평균, 최대, 최소, 표준편차 등으로 변경합니다.\n또한 값 표시 형식을 쓰면 총합계 대비 비율이나 열 합계 대비 비율처럼 비중으로 바꿔 보여줄 수도 있습니다.\n\n▸ 값 필드: 피벗 테이블에서 실제로 계산되는 숫자 영역.\n▸ 값 필드 설정: 계산 방식과 표시 형식을 정하는 대화상자."},{"sub":"엑셀 분석작업","q":"여러 시트에 흩어진 같은 형식의 표를 하나로 합쳐 계산하는 기능은?","o":["통합","부분합","피벗 테이블","시나리오"],"a":0,"e":"데이터 탭의 통합은 지점별로 나뉜 시트처럼 구조가 같은 표 여러 개를 하나로 합칩니다.\n합칠 때 기준을 정할 수 있는데, 첫 행과 왼쪽 열을 레이블로 사용하도록 체크하면 항목 이름을 기준으로 같은 항목끼리 더합니다. 원본 데이터에 연결을 체크하면 원본이 바뀔 때 결과도 함께 갱신됩니다.\n\n▸ 레이블: 표의 항목 이름. 행 제목과 열 제목을 뜻합니다.\n▸ 원본 데이터에 연결: 원본 변경이 결과에 반영되도록 연결하는 옵션."},{"sub":"엑셀 분석작업","q":"여러 개의 변수 조합에 따른 결과를 미리 저장해두고 비교하는 기능은?","o":["목표값 찾기","시나리오","데이터 표","해 찾기"],"a":1,"e":"시나리오는 낙관, 보통, 비관처럼 여러 가정을 각각 저장해두고 필요할 때 불러와 결과를 비교하는 기능입니다.\n변경 셀에 넣을 값 조합을 시나리오별로 저장하고, 요약을 만들면 각 시나리오의 결과를 한 표로 볼 수 있습니다. 변경 셀은 최대 32개까지 지정할 수 있습니다.\n목표값 찾기는 변수가 하나일 때, 데이터 표는 변수 한두 개의 값 변화에 따른 결과를 표로 펼칠 때 씁니다.\n\n▸ 변경 셀: 값이 바뀔 입력 셀.\n▸ 결과 셀: 변경 셀에 따라 값이 달라지는 수식 셀.\n▸ 시나리오 요약: 여러 시나리오의 결과를 정리한 보고서."},{"sub":"엑셀 분석작업","q":"데이터 표 기능에 관한 설명으로 옳은 것은?","o":["한 개 또는 두 개의 입력값 변화에 따른 결과를 한 번에 표로 만든다","세 개 이상의 변수를 동시에 다룰 수 있다","결과의 일부만 삭제할 수 있다","수식 없이도 사용할 수 있다"],"a":0,"e":"데이터 표는 이자율이 3%, 4%, 5%일 때 월 상환액이 각각 얼마인지를 한 번에 계산해 표로 보여주는 기능입니다.\n변수가 하나면 행 또는 열 하나에 값을 나열하고, 두 개면 행과 열에 각각 나열해 교차하는 표를 만듭니다. 세 개 이상은 불가능합니다.\n결과는 배열 수식으로 채워지므로 일부 셀만 지우려 하면 변경할 수 없다는 경고가 나옵니다.\n\n▸ 행 입력 셀: 표의 첫 행에 나열한 값이 들어갈 원래 셀.\n▸ 열 입력 셀: 표의 첫 열에 나열한 값이 들어갈 원래 셀."},{"sub":"엑셀 분석작업","q":"부분합을 두 번 이상 중첩해서 적용하려 할 때 두 번째 실행에서 해제해야 하는 옵션은?","o":["새로운 값으로 대치","그룹 사이에서 페이지 나누기","데이터 아래에 요약 표시","모두 제거"],"a":0,"e":"부분합을 처음 실행하면 기준 항목별로 소계가 들어갑니다. 여기에 다른 계산을 하나 더 얹고 싶을 때가 있습니다. 예를 들어 합계를 먼저 넣고 평균도 넣는 경우입니다.\n이때 새로운 값으로 대치를 체크한 채로 실행하면 앞서 넣은 부분합이 지워지고 새것으로 바뀝니다. 체크를 해제해야 기존 것 위에 겹쳐서 들어갑니다.\n\n▸ 중첩 부분합: 부분합을 여러 겹으로 적용하는 것.\n▸ 그룹화 기준: 소계를 나눌 기준이 되는 필드. 미리 정렬되어 있어야 합니다."},{"sub":"엑셀 분석작업","q":"피벗 테이블에서 그룹화할 수 없는 것은?","o":["날짜를 월별로 묶기","숫자를 구간별로 묶기","선택한 항목을 임의로 묶기","서로 다른 시트의 필드를 묶기"],"a":3,"e":"피벗 테이블의 그룹화는 같은 필드 안의 값들을 묶는 기능입니다.\n날짜는 일, 월, 분기, 연도 단위로 자동으로 묶을 수 있고, 숫자는 시작과 끝, 간격을 정해 구간으로 묶을 수 있습니다. 문자는 원하는 항목들을 선택해 임의로 묶을 수 있습니다.\n다른 시트의 필드끼리 묶는 것은 그룹화가 아니라 데이터 모델이나 통합의 영역입니다.\n\n▸ 그룹화: 값들을 일정 기준으로 묶어 상위 항목을 만드는 것."},{"sub":"엑셀 분석작업","q":"정렬에서 지정할 수 있는 기준이 아닌 것은?","o":["셀 값","셀 색","글꼴 색","셀에 입력된 수식의 길이"],"a":3,"e":"정렬 기준은 셀 값, 셀 색, 글꼴 색, 조건부 서식 아이콘 네 가지입니다.\n또한 사용자 지정 목록을 만들면 월화수목금토일이나 대리 과장 차장 부장처럼 사전순이 아닌 임의의 순서로도 정렬할 수 있습니다. 실기에서는 이 사용자 지정 정렬이 자주 나옵니다.\n정렬 기준은 최대 64개까지 추가할 수 있습니다.\n\n▸ 사용자 지정 목록: 원하는 순서를 직접 등록해두는 기능."},{"sub":"엑셀 분석작업","q":"목표값 찾기를 사용할 수 있는 조건으로 옳은 것은?","o":["결과 셀이 수식이고 변경할 셀이 그 수식에 영향을 주는 값이어야 한다","결과 셀과 변경 셀이 모두 값이어야 한다","변경할 셀이 여러 개여야 한다","수식이 없어도 된다"],"a":0,"e":"목표값 찾기는 결과를 정해놓고 거꾸로 입력값을 찾아주는 기능입니다.\n예를 들어 평균이 80이 되려면 마지막 시험 점수가 몇 점이어야 하는지를 구합니다. 이때 결과 셀은 반드시 수식이어야 하고, 변경할 셀은 그 수식이 참조하는 값 셀이어야 합니다.\n변경할 셀은 하나만 지정할 수 있습니다. 여러 개를 동시에 다루려면 해 찾기를 써야 합니다.\n\n▸ 수식 셀: 결과가 계산되어 나오는 셀.\n▸ 찾는 값: 결과 셀이 되기를 바라는 목표 숫자."},{"sub":"엑셀 분석작업","q":"피벗 테이블의 원본 범위가 늘어났을 때 반영하는 방법으로 옳은 것은?","o":["새로 고침만 하면 된다","데이터 원본 변경으로 범위를 다시 지정한다","피벗 테이블을 삭제해야만 한다","자동으로 반영된다"],"a":1,"e":"새로 고침은 이미 지정된 범위 안에서 값이 바뀐 것을 반영합니다. 범위 자체가 아래로 늘어난 경우에는 피벗이 그 부분을 모르므로 새로 고침만으로는 부족합니다.\n피벗 테이블 분석 탭의 데이터 원본 변경에서 범위를 다시 잡아줘야 합니다. 처음부터 원본을 표로 만들어두면 범위가 자동으로 확장되어 이 문제가 생기지 않습니다.\n\n▸ 표로 만들기: 범위를 엑셀 표 개체로 변환해 자동 확장되게 하는 기능."},{"sub":"엑셀 분석작업","q":"부분합을 실행하기 전 반드시 해야 하는 작업은?","o":["그룹화할 기준 필드로 정렬","표 서식 적용","셀 병합","조건부 서식 적용"],"a":0,"e":"부분합은 위에서 아래로 훑으며 기준 필드의 값이 바뀌는 지점마다 소계를 끼워 넣습니다.\n그래서 미리 정렬되어 있지 않으면 같은 항목이 여기저기 흩어져 소계가 여러 번 쪼개져 들어갑니다. 예를 들어 부서별 합계를 내려면 먼저 부서로 정렬해야 합니다.\n\n▸ 소계: 그룹별로 계산한 중간 합계.\n▸ 총합계: 전체를 대상으로 한 합계."},{"sub":"엑셀 기타작업","q":"매크로 이름으로 사용할 수 없는 것은?","o":["매출집계","Macro_1","1분기집계","집계A"],"a":2,"e":"매크로 이름에는 규칙이 있습니다. 첫 글자는 반드시 문자여야 하고 숫자로 시작할 수 없습니다.\n또한 공백을 쓸 수 없고 마침표, 느낌표, 물음표 같은 기호도 안 됩니다. 단어를 붙이거나 밑줄로 잇는 방식을 씁니다. 셀 주소와 같은 이름도 쓸 수 없습니다.\n1분기집계는 숫자로 시작하므로 사용할 수 없습니다.\n\n▸ 매크로: 반복 작업을 기록해두고 한 번에 실행하는 기능.\n▸ 밑줄(_): 공백 대신 단어를 잇는 데 쓰는 기호."},{"sub":"엑셀 기타작업","q":"기록한 매크로를 도형이나 단추에 연결하는 방법은?","o":["도형 우클릭 후 매크로 지정","도형에 조건부 서식 적용","도형에 하이퍼링크 삽입","도형 이름을 매크로와 같게 변경"],"a":0,"e":"매크로를 만들어두면 실행할 방법이 필요합니다. 개발 도구에서 목록을 열어 실행할 수도 있지만, 실기에서는 보통 도형이나 양식 단추를 시트에 놓고 거기에 연결합니다.\n도형을 우클릭해 매크로 지정을 고르고 목록에서 해당 매크로를 선택하면 됩니다. 이후 그 도형을 누를 때마다 매크로가 실행됩니다.\n\n▸ 양식 컨트롤: 단추, 확인란 등 시트에 놓는 조작 도구.\n▸ 개발 도구: 매크로와 VBA 기능이 모인 리본 탭. 옵션에서 켜야 보입니다."},{"sub":"엑셀 기타작업","q":"차트에서 데이터 계열이 의미하는 것은?","o":["같은 항목으로 묶인 데이터 값들의 집합","차트의 제목","가로 축의 눈금","범례의 위치"],"a":0,"e":"차트는 몇 가지 요소로 이루어집니다.\n데이터 계열은 하나의 묶음으로 그려지는 값들입니다. 월별 매출 차트라면 서울 지점 매출 전체가 하나의 계열이고, 부산 지점이 또 다른 계열입니다. 계열마다 색이 다르게 표시되고 그 색이 무엇인지 알려주는 것이 범례입니다.\n가로 축에 나열되는 월 이름은 항목 또는 축 레이블이라고 합니다.\n\n▸ 데이터 계열: 하나의 색으로 표현되는 값들의 묶음.\n▸ 범례: 계열의 이름과 색을 표시한 안내.\n▸ 데이터 레이블: 각 값 위에 숫자를 직접 표시한 것."},{"sub":"엑셀 기타작업","q":"값의 크기 차이가 매우 큰 두 계열을 한 차트에 표현할 때 적절한 방법은?","o":["보조 축을 사용한다","차트를 삭제한다","값을 임의로 수정한다","범례를 숨긴다"],"a":0,"e":"매출액은 억 단위인데 달성률은 퍼센트 단위라면, 같은 축에 그릴 경우 퍼센트 막대가 바닥에 붙어 보이지 않습니다.\n이럴 때 한 계열을 보조 축에 배치하면 오른쪽에 별도의 눈금이 생겨 두 계열을 함께 읽을 수 있습니다. 보통 단위가 다른 계열은 차트 종류도 다르게 지정해 막대와 꺾은선을 섞은 콤보 차트로 만듭니다.\n\n▸ 보조 축: 오른쪽에 추가로 생기는 세로 축.\n▸ 콤보 차트: 서로 다른 차트 종류를 한 화면에 섞은 차트."},{"sub":"엑셀 기타작업","q":"차트 종류 중 전체에 대한 각 항목의 비율을 나타내기에 가장 적절한 것은?","o":["원형 차트","꺾은선형 차트","분산형 차트","주식형 차트"],"a":0,"e":"차트는 목적에 맞게 골라야 합니다.\n원형은 전체를 100으로 보고 각 조각이 차지하는 비중을 보여줍니다. 다만 계열을 하나만 표현할 수 있습니다. 꺾은선형은 시간에 따른 변화를, 분산형은 두 숫자 사이의 관계를, 막대형은 항목 간 크기 비교를 보여줍니다.\n비중을 보되 여러 계열을 함께 보고 싶다면 100% 기준 누적 막대형을 씁니다.\n\n▸ 분산형: 두 변수의 상관관계를 점으로 찍는 차트.\n▸ 누적 막대형: 막대 하나를 여러 조각으로 쌓아 구성비를 보여주는 차트."},{"sub":"엑셀 기타작업","q":"VBA에서 사용자 정의 함수를 만들 때 사용하는 선언 키워드는?","o":["Sub","Function","Dim","Private"],"a":1,"e":"VBA에서 코드 덩어리는 두 종류입니다.\nSub는 동작을 실행하고 끝나는 프로시저입니다. 값을 돌려주지 않습니다. Function은 계산 결과를 돌려주는 것이라, 시트에서 일반 함수처럼 =내함수(A1) 형태로 쓸 수 있습니다.\n실기 계산작업에서 사용자 정의 함수를 만들라는 문제가 나오면 Function으로 선언하고, 마지막에 함수 이름에 결과를 대입해야 값이 돌아갑니다.\n\n▸ 프로시저: VBA에서 하나의 작업 단위가 되는 코드 묶음.\n▸ Dim: 변수를 선언하는 키워드.\n▸ 대입: 함수 이름 = 결과값 형태로 반환할 값을 넣는 것."},{"sub":"엑셀 기타작업","q":"VBA에서 조건에 따라 여러 갈래로 나누는 구문으로 옳은 것은?","o":["For ... Next","Select Case","Dim ... As","With ... End With"],"a":1,"e":"조건 분기 구문은 두 가지입니다. If ... ElseIf ... Else ... End If는 조건을 하나씩 검사하고, Select Case는 한 값을 두고 여러 경우를 나열합니다.\n점수에 따라 등급을 매기는 것처럼 갈래가 많을 때는 Select Case가 훨씬 읽기 쉽습니다. Case 90 To 100 처럼 범위를 지정할 수도 있고, Case Else로 나머지를 처리합니다.\nFor ... Next는 반복, With는 같은 개체의 속성을 여러 줄 설정할 때 쓰는 구문입니다.\n\n▸ 분기: 조건에 따라 실행 경로가 갈리는 것.\n▸ 반복문: 같은 작업을 여러 번 실행하는 구문."},{"sub":"엑셀 기타작업","q":"폼의 명령 단추를 클릭했을 때 실행되는 이벤트 프로시저의 선언으로 옳은 것은?","o":["Private Sub cmd조회_Click()","Private Sub Click_cmd조회()","Sub cmd조회.Click()","Function cmd조회_Click()"],"a":0,"e":"이벤트 프로시저는 컨트롤이름_이벤트명 형식으로 이름이 정해집니다. 사이를 밑줄로 잇고 마침표는 쓰지 않습니다.\n단추 이름이 cmd조회이고 클릭 이벤트라면 cmd조회_Click이 됩니다. 이 이름은 직접 타이핑하기보다 속성 창의 이벤트 탭에서 코드 작성기를 열면 자동으로 만들어지므로 그 방법을 쓰는 것이 안전합니다.\n\n▸ 이벤트: 클릭, 열기, 변경처럼 사용자의 동작이나 상황을 뜻합니다.\n▸ 컨트롤: 폼 위에 놓인 단추, 텍스트 상자 같은 구성 요소."},{"sub":"액세스 DB구축","q":"참조 무결성을 설정했을 때 나타나는 효과로 옳은 것은?","o":["기본 테이블에 없는 값을 관련 테이블에 입력할 수 없다","모든 필드가 자동으로 채워진다","중복 입력이 허용된다","기본키가 필요 없어진다"],"a":0,"e":"참조 무결성은 두 테이블의 관계가 어그러지지 않도록 지키는 규칙입니다.\n예를 들어 부서 테이블에 없는 부서코드를 사원 테이블에 넣을 수 없게 막습니다. 존재하지 않는 부서에 소속된 사원이 생기는 것을 방지하는 것입니다.\n여기에 관련 필드 모두 업데이트를 체크하면 부서코드를 바꿀 때 사원 쪽도 함께 바뀌고, 관련 레코드 모두 삭제를 체크하면 부서를 지울 때 소속 사원도 함께 지워집니다.\n\n▸ 외래키: 다른 테이블의 기본키를 참조하는 필드.\n▸ 일대다 관계: 한 부서에 여러 사원이 속하는 형태의 관계."},{"sub":"액세스 DB구축","q":"필드 속성 중 입력 시 반드시 값을 넣도록 강제하는 것은?","o":["필수","인덱스","기본값","유효성 검사 규칙"],"a":0,"e":"테이블 디자인 보기에서 각 필드에는 여러 속성을 줄 수 있습니다.\n필수를 예로 설정하면 그 칸을 비워둔 채 저장할 수 없습니다. 기본값은 새 레코드를 만들 때 미리 채워둘 값이고, 유효성 검사 규칙은 입력된 값이 조건을 만족하는지 검사합니다. 인덱스는 검색 속도를 높이는 색인입니다.\n빈 문자열 허용 속성은 필수와 함께 자주 헷갈리는데, Null과 빈 문자열은 다른 것이라 별도로 설정합니다.\n\n▸ 유효성 검사 규칙: >=0 처럼 조건식을 적어 잘못된 값을 막는 속성.\n▸ 인덱스: 자주 찾는 필드에 걸어 검색을 빠르게 하는 장치."},{"sub":"액세스 DB구축","q":"입력 마스크를 사용하는 목적으로 옳은 것은?","o":["정해진 형식대로만 입력되도록 안내하고 제한한다","값을 자동으로 계산한다","레코드를 정렬한다","테이블 관계를 설정한다"],"a":0,"e":"입력 마스크는 전화번호나 주민등록번호처럼 형식이 정해진 데이터를 입력할 때 틀을 잡아줍니다.\n0은 숫자를 반드시 입력해야 하는 자리, 9는 숫자나 공백을 넣을 수 있는 자리, L은 영문자를 반드시 입력하는 자리입니다. 하이픈 같은 기호를 화면에 함께 저장할지 여부도 지정할 수 있습니다.\n유효성 검사 규칙이 입력된 값을 사후에 검사한다면, 입력 마스크는 입력하는 동안 형식을 강제합니다.\n\n▸ 입력 마스크: 입력 형식을 미리 정해두는 필드 속성."},{"sub":"액세스 DB구축","q":"데이터 형식 중 계산에 사용할 수 없는 것은?","o":["숫자","통화","일련 번호","긴 텍스트"],"a":3,"e":"액세스의 필드에는 데이터 형식을 지정합니다.\n숫자와 통화는 당연히 계산에 쓰이고, 일련 번호도 정수라 계산이 가능하지만 자동으로 매겨지는 값이라 보통 기본키로만 씁니다. 날짜와 시간도 내부적으로는 숫자라 뺄셈이 가능합니다.\n긴 텍스트는 메모 성격의 문자 데이터라 계산 대상이 아닙니다.\n\n▸ 일련 번호: 레코드가 추가될 때마다 1씩 자동으로 증가하는 형식.\n▸ 데이터 형식: 필드에 어떤 종류의 값이 들어갈지 정하는 설정."},{"sub":"액세스 DB구축","q":"조회 속성을 콤보 상자로 설정하는 이유로 옳은 것은?","o":["미리 정해진 목록에서 값을 선택하게 해 입력 오류를 줄이기 위해","계산 속도를 높이기 위해","테이블 용량을 줄이기 위해","기본키를 자동 생성하기 위해"],"a":0,"e":"부서명을 직접 타이핑하게 하면 영업부, 영업팀, 영업 부처럼 제각각 입력되어 나중에 집계가 되지 않습니다.\n조회 속성을 콤보 상자로 지정하고 원본을 부서 테이블로 잡아두면 목록에서 고르게 되어 표기가 통일됩니다. 목록 값만 허용 속성을 예로 두면 목록에 없는 값은 아예 입력할 수 없습니다.\n\n▸ 콤보 상자: 눌러서 목록에서 고르는 입력 컨트롤.\n▸ 행 원본: 콤보 상자에 표시할 목록의 출처."},{"sub":"액세스 쿼리","q":"실행할 때마다 사용자에게 조건을 입력받는 쿼리는?","o":["매개 변수 쿼리","크로스탭 쿼리","통합 쿼리","불일치 검색 쿼리"],"a":0,"e":"매번 다른 조건으로 조회해야 할 때 쿼리를 여러 개 만드는 대신 하나로 해결하는 방법입니다.\n조건 칸에 대괄호를 써서 [조회할 부서명을 입력하시오] 처럼 적어두면, 실행할 때 그 문구가 뜬 입력 창이 나타나고 사용자가 넣은 값이 조건으로 들어갑니다.\n대괄호 안의 문구가 필드명과 같으면 안 됩니다. 같으면 그 필드 값으로 인식해 입력 창이 뜨지 않습니다.\n\n▸ 쿼리: 원하는 조건으로 데이터를 뽑아내는 질의.\n▸ 매개 변수: 실행할 때 바깥에서 넣어주는 값."},{"sub":"액세스 쿼리","q":"행과 열 양쪽에 필드를 배치해 교차 지점에 집계 값을 표시하는 쿼리는?","o":["선택 쿼리","크로스탭 쿼리","추가 쿼리","삭제 쿼리"],"a":1,"e":"엑셀의 피벗 테이블과 같은 일을 하는 쿼리입니다. 예를 들어 행에는 부서, 열에는 월, 교차 지점에는 매출 합계를 놓는 식입니다.\n만들 때 세 가지를 반드시 지정해야 합니다. 행 머리글, 열 머리글, 그리고 값입니다. 행 머리글은 여러 개 지정할 수 있지만 열 머리글과 값은 각각 하나만 지정할 수 있습니다.\n\n▸ 행 머리글: 왼쪽에 세로로 나열되는 항목.\n▸ 열 머리글: 위쪽에 가로로 나열되는 항목.\n▸ 집계: 합계, 평균, 개수 등으로 요약하는 것."},{"sub":"액세스 쿼리","q":"한쪽 테이블에만 있고 다른 쪽에는 없는 레코드를 찾는 쿼리는?","o":["중복 데이터 검색 쿼리","불일치 검색 쿼리","업데이트 쿼리","테이블 만들기 쿼리"],"a":1,"e":"주문한 적이 없는 고객을 찾거나, 배정되지 않은 사원을 찾을 때 씁니다. 두 테이블을 비교해 한쪽에만 존재하는 레코드를 골라냅니다.\n마법사로 만들 수도 있고, 직접 만들려면 두 테이블을 조인한 뒤 조인 속성을 외부 조인으로 바꾸고 상대 테이블의 필드가 Is Null인 조건을 겁니다.\n\n▸ 조인: 두 테이블을 공통 필드로 연결하는 것.\n▸ 외부 조인: 한쪽 테이블의 레코드를 모두 포함시키는 조인 방식.\n▸ Is Null: 값이 비어 있는지 확인하는 조건."},{"sub":"액세스 쿼리","q":"기존 테이블의 데이터를 조건에 맞게 한꺼번에 수정하는 쿼리는?","o":["선택 쿼리","업데이트 쿼리","크로스탭 쿼리","매개 변수 쿼리"],"a":1,"e":"실행 쿼리는 데이터를 실제로 바꾸는 쿼리들입니다. 업데이트는 값을 수정하고, 추가는 다른 테이블에 레코드를 넣고, 삭제는 조건에 맞는 레코드를 지우고, 테이블 만들기는 결과를 새 테이블로 저장합니다.\n실행 쿼리는 되돌릴 수 없으므로 먼저 선택 쿼리로 만들어 대상 레코드를 확인한 뒤 종류를 바꾸는 것이 안전합니다.\n\n▸ 실행 쿼리: 데이터를 실제로 변경하는 쿼리.\n▸ 선택 쿼리: 조회만 하고 데이터를 바꾸지 않는 쿼리."},{"sub":"액세스 쿼리","q":"쿼리에서 그룹별로 집계를 하려 할 때 사용하는 행은?","o":["정렬","요약","표시","조건"],"a":1,"e":"쿼리 디자인 보기에서 요약 단추를 누르면 요약 행이 생깁니다. 여기서 필드마다 묶는 방법, 합계, 평균, 개수 등을 고를 수 있습니다.\n기준이 되는 필드는 묶는 방법으로 두고, 계산할 필드에 합계나 평균을 지정하면 그룹별 집계가 됩니다.\n조건을 걸 때 주의할 점이 있습니다. 그룹으로 묶기 전에 거르려면 조건에 where를 지정하고, 묶은 결과에 조건을 걸려면 집계 필드의 조건 칸에 씁니다.\n\n▸ 묶는 방법: Group By. 같은 값끼리 묶는 기준입니다.\n▸ Where 조건: 집계하기 전에 레코드를 걸러내는 조건."},{"sub":"액세스 쿼리","q":"SQL에서 중복된 값을 제외하고 조회하는 예약어는?","o":["UNIQUE","DISTINCT","GROUP","HAVING"],"a":1,"e":"SELECT DISTINCT 부서명 FROM 사원 이라고 쓰면 같은 부서명이 여러 번 나와도 한 번씩만 표시됩니다.\nHAVING은 GROUP BY로 묶은 결과에 조건을 거는 절이라 역할이 다릅니다. 묶기 전에 거르는 것은 WHERE, 묶은 뒤에 거르는 것은 HAVING입니다.\n\n▸ SELECT: 어떤 필드를 보여줄지 지정하는 절.\n▸ FROM: 어느 테이블에서 가져올지 지정하는 절.\n▸ WHERE: 조건에 맞는 레코드만 고르는 절."},{"sub":"액세스 쿼리","q":"SQL문 SELECT * FROM 사원 WHERE 급여 >= 300 ORDER BY 급여 DESC 의 결과는?","o":["급여가 300 이상인 사원을 급여 내림차순으로 조회","급여가 300 이하인 사원을 오름차순으로 조회","모든 사원을 이름순으로 조회","급여를 300으로 변경"],"a":0,"e":"SQL은 영어 문장처럼 읽으면 이해가 쉽습니다. 사원 테이블에서 모든 필드를 골라, 급여가 300 이상인 것만, 급여가 큰 순서대로 보여달라는 뜻입니다.\n별표는 모든 필드를 뜻합니다. ORDER BY 뒤의 DESC는 내림차순이고 ASC는 오름차순이며 생략하면 오름차순이 기본입니다.\n\n▸ DESC: Descending. 큰 값에서 작은 값 순서.\n▸ ASC: Ascending. 작은 값에서 큰 값 순서."},{"sub":"액세스 쿼리","q":"두 테이블을 공통 필드로 연결해 조회할 때 사용하는 SQL 구문은?","o":["INNER JOIN","UNION","INSERT INTO","CREATE TABLE"],"a":0,"e":"사원 테이블에는 부서코드만 있고 부서명은 부서 테이블에 있을 때, 두 테이블을 부서코드로 이어 붙여야 사원 이름과 부서명을 함께 볼 수 있습니다. 이때 쓰는 것이 조인입니다.\nINNER JOIN은 양쪽에 모두 있는 것만 보여주고, LEFT JOIN은 왼쪽 테이블 것을 모두 보여주면서 오른쪽에 짝이 없으면 빈칸으로 둡니다.\nUNION은 두 조회 결과를 위아래로 이어 붙이는 것이라 성격이 다릅니다.\n\n▸ INNER JOIN: 양쪽에 모두 존재하는 레코드만 연결하는 조인.\n▸ ON: 어떤 필드로 연결할지 지정하는 절."},{"sub":"액세스 폼·보고서","q":"기본 폼과 하위 폼을 연결할 때 사용하는 속성은?","o":["기본 필드 연결과 하위 필드 연결","레코드 원본","컨트롤 원본","조회 마법사"],"a":0,"e":"거래처 정보를 위에 보여주고 그 거래처의 주문 목록을 아래에 보여주는 화면이 하위 폼 구조입니다.\n하위 폼 컨트롤의 속성에서 기본 필드 연결에 기본 폼 쪽의 필드를, 하위 필드 연결에 하위 폼 쪽의 필드를 지정하면 위에서 거래처를 바꿀 때마다 아래 목록이 자동으로 따라 바뀝니다. 보통 일대다 관계의 기본키와 외래키를 연결합니다.\n\n▸ 하위 폼: 폼 안에 들어가 있는 또 다른 폼.\n▸ 컨트롤 원본: 컨트롤에 표시할 필드나 수식을 지정하는 속성."},{"sub":"액세스 폼·보고서","q":"보고서에서 그룹마다 합계를 표시하려면 어느 구역에 계산 컨트롤을 넣어야 하는가?","o":["보고서 머리글","그룹 바닥글","페이지 머리글","본문"],"a":1,"e":"보고서는 구역으로 나뉘어 있고 각 구역이 인쇄되는 시점이 다릅니다.\n보고서 머리글은 맨 처음 한 번, 페이지 머리글은 매 페이지 위, 그룹 머리글은 그룹이 시작될 때, 본문은 레코드마다, 그룹 바닥글은 그룹이 끝날 때, 보고서 바닥글은 맨 마지막 한 번 나옵니다.\n부서별 합계는 부서가 끝나는 시점에 나와야 하므로 그룹 바닥글에 =Sum([급여]) 형태의 컨트롤을 넣습니다. 전체 합계는 보고서 바닥글입니다.\n\n▸ 구역: 보고서를 이루는 영역 단위.\n▸ 계산 컨트롤: 컨트롤 원본에 수식을 넣어 값을 계산하는 컨트롤."},{"sub":"액세스 폼·보고서","q":"보고서에서 페이지 번호를 표시하기에 적절한 구역은?","o":["보고서 머리글","페이지 바닥글","그룹 머리글","본문"],"a":1,"e":"페이지 번호는 모든 페이지에 나와야 하므로 매 페이지마다 인쇄되는 페이지 머리글이나 페이지 바닥글에 넣습니다. 보통 아래쪽에 두므로 페이지 바닥글을 씁니다.\n수식은 =[Page] & \" / \" & [Pages] 형태로 씁니다. Page는 현재 페이지, Pages는 전체 페이지 수입니다.\n보고서 머리글에 넣으면 첫 페이지에만 나오게 되어 목적에 맞지 않습니다.\n\n▸ [Page]: 현재 페이지 번호를 담은 내장 값.\n▸ [Pages]: 전체 페이지 수를 담은 내장 값."},{"sub":"액세스 폼·보고서","q":"폼에서 레코드 원본으로 지정할 수 없는 것은?","o":["테이블","쿼리","SQL문","보고서"],"a":3,"e":"폼이나 보고서는 어떤 데이터를 보여줄지 정해야 하는데 그것이 레코드 원본 속성입니다.\n여기에는 테이블 이름, 쿼리 이름, 또는 SQL문을 직접 넣을 수 있습니다. 보고서는 데이터를 출력하는 개체이지 데이터의 출처가 아니므로 레코드 원본이 될 수 없습니다.\n\n▸ 레코드 원본: 폼이나 보고서가 표시할 데이터의 출처.\n▸ 바운드 폼: 레코드 원본이 지정되어 데이터와 연결된 폼."},{"sub":"액세스 폼·보고서","q":"보고서에서 특정 필드를 기준으로 묶어 출력하려 할 때 사용하는 기능은?","o":["그룹화 및 정렬","조건부 서식","페이지 설정","필터"],"a":0,"e":"보고서 디자인 보기에서 그룹화 및 정렬을 열면 기준 필드를 지정할 수 있습니다. 지정하면 그룹 머리글과 그룹 바닥글 구역이 생겨 그룹별 제목과 소계를 넣을 수 있습니다.\n같은 그룹이 페이지를 넘어가며 잘리는 것이 싫다면 같은 페이지에 표시 옵션을 쓰고, 그룹마다 새 페이지에서 시작하게 하려면 페이지 바꿈 속성을 설정합니다.\n\n▸ 그룹 머리글: 그룹이 시작될 때 한 번 인쇄되는 구역.\n▸ 페이지 바꿈: 특정 지점에서 새 페이지로 넘기는 설정."},{"sub":"액세스 폼·보고서","q":"폼의 탭 순서(Tab Order)를 설정하는 목적은?","o":["Tab 키를 눌렀을 때 컨트롤 간 이동 순서를 정하기 위해","컨트롤의 색을 바꾸기 위해","레코드를 정렬하기 위해","보고서를 인쇄하기 위해"],"a":0,"e":"폼에서 값을 입력할 때 마우스를 쓰지 않고 Tab 키로 다음 칸으로 넘어가는 것이 훨씬 빠릅니다.\n컨트롤을 나중에 추가하거나 위치를 옮기면 이동 순서가 화면 배치와 어긋나 엉뚱한 칸으로 튀는 일이 생깁니다. 탭 순서에서 순서를 다시 잡거나 자동 순서를 누르면 위에서 아래, 왼쪽에서 오른쪽 순으로 정리됩니다.\n\n▸ 탭 정지: 해당 컨트롤에 Tab으로 멈출지 여부를 정하는 속성."},{"sub":"엑셀 함수","q":"SUMIF와 SUMIFS의 인수 순서에 관한 설명으로 옳은 것은?","o":["SUMIF는 합계범위를 마지막에, SUMIFS는 합계범위를 맨 앞에 쓴다","둘 다 합계범위를 맨 앞에 쓴다","둘 다 합계범위를 마지막에 쓴다","SUMIFS에는 합계범위가 없다"],"a":0,"e":"이 둘은 하는 일이 비슷한데 인수 순서가 정반대라 실기에서 가장 많이 틀리는 지점입니다.\nSUMIF는 조건을 볼 범위를 먼저 쓰고, 조건을 쓰고, 실제 더할 범위를 맨 뒤에 씁니다. SUMIFS는 조건이 여러 개라 뒤로 계속 이어져야 하므로 더할 범위를 아예 맨 앞으로 뺐습니다.\nCOUNTIF와 COUNTIFS는 세는 함수라 더할 범위가 없어 이 문제가 없습니다. AVERAGEIF와 AVERAGEIFS는 SUMIF 계열과 같은 규칙을 따릅니다.\n\n▸ 조건 범위: 조건에 맞는지 검사할 셀 영역.\n▸ 합계 범위: 조건을 만족할 때 실제로 더할 값이 있는 영역."},{"sub":"엑셀 함수","q":"숫자와 문자가 섞인 범위에서 비어 있지 않은 셀의 개수를 세는 함수는?","o":["COUNT","COUNTA","COUNTBLANK","COUNTIF"],"a":1,"e":"세는 함수는 대상이 다릅니다.\nCOUNT는 숫자만 셉니다. 문자가 들어 있으면 빼고 셉니다. COUNTA는 숫자든 문자든 무언가 들어 있으면 다 셉니다. COUNTBLANK는 반대로 비어 있는 칸을 셉니다.\n출석 인원처럼 이름이 적힌 칸을 세야 한다면 COUNTA를 써야 하고, 점수가 입력된 칸만 세려면 COUNT를 씁니다.\n\n▸ COUNTA: A는 All의 뜻으로 모든 값을 센다는 의미입니다.\n▸ 빈 셀: 아무것도 입력되지 않은 셀."},{"sub":"엑셀 함수","q":"VLOOKUP의 세 번째 인수인 열 번호를 세는 기준으로 옳은 것은?","o":["워크시트 전체의 A열부터 센다","지정한 표 범위의 첫 열을 1로 세어 센다","항상 1부터 시작하되 역순으로 센다","행 번호를 센다"],"a":1,"e":"열 번호는 시트 전체가 아니라 VLOOKUP에 넣은 표 범위 안에서 셉니다.\n예를 들어 범위를 C2:F10으로 잡았다면 C열이 1번, D열이 2번, E열이 3번, F열이 4번입니다. A열이나 B열은 범위 밖이라 세지 않습니다.\n또 하나 규칙이 있습니다. 찾을 값은 반드시 지정한 범위의 첫 열에 있어야 합니다. 첫 열보다 왼쪽에서 값을 가져와야 한다면 VLOOKUP으로는 안 되고 INDEX와 MATCH를 조합해야 합니다.\n\n▸ 표 범위: VLOOKUP의 두 번째 인수로 지정하는 조회 영역."},{"sub":"엑셀 함수","q":"문자열 앞뒤와 중간의 불필요한 공백을 정리하는 함수는?","o":["TRIM","CLEAN","LEFT","REPLACE"],"a":0,"e":"다른 시스템에서 내려받은 데이터에는 눈에 안 보이는 공백이 붙어 있는 경우가 많습니다. 이 공백 때문에 VLOOKUP이 값을 못 찾거나 조건이 안 맞는 일이 자주 생깁니다.\nTRIM은 앞뒤 공백을 전부 없애고 단어 사이의 연속된 공백은 하나만 남깁니다. CLEAN은 인쇄되지 않는 제어 문자를 없애는 함수로 역할이 다릅니다.\n\n▸ 공백: 스페이스로 입력된 빈 칸.\n▸ 제어 문자: 줄바꿈처럼 화면에 보이지 않는 특수 문자."},{"sub":"엑셀 함수","q":"문자열에서 특정 문자를 다른 문자로 바꾸되, 위치가 아니라 찾을 문자를 기준으로 바꾸는 함수는?","o":["REPLACE","SUBSTITUTE","MID","FIND"],"a":1,"e":"바꾸는 함수는 두 가지인데 기준이 다릅니다.\nREPLACE는 위치 기준입니다. 다섯 번째 글자부터 세 글자를 이걸로 바꿔라 하는 식입니다. SUBSTITUTE는 내용 기준입니다. 문자열 안의 서울을 부산으로 바꿔라 하는 식입니다.\nSUBSTITUTE는 네 번째 인수로 몇 번째 것만 바꿀지 지정할 수도 있고, 생략하면 전부 바꿉니다.\n\n▸ REPLACE(문자열, 시작위치, 글자수, 새문자): 위치로 바꾸기.\n▸ SUBSTITUTE(문자열, 찾을문자, 새문자, [n번째]): 내용으로 바꾸기."},{"sub":"엑셀 함수","q":"기준일로부터 지정한 개월 수 뒤의 월 마지막 날짜를 구하는 함수는?","o":["EDATE","EOMONTH","DATE","DAY"],"a":1,"e":"EOMONTH는 End Of Month의 줄임말로 그 달의 마지막 날을 돌려줍니다. EOMONTH(기준일, 0)은 이번 달 말일, EOMONTH(기준일, 1)은 다음 달 말일입니다.\nEDATE는 같은 방식으로 개월 수를 더하지만 말일이 아니라 같은 날짜를 돌려줍니다. 3월 15일에 EDATE로 1을 더하면 4월 15일이 됩니다.\n계약 만료일이나 결제일 계산에 자주 쓰입니다.\n\n▸ 일련번호: 엑셀이 날짜를 저장하는 방식. 1900년 1월 1일을 1로 두고 하루에 1씩 늘어납니다.\n▸ 말일: 그 달의 마지막 날. 달마다 28일에서 31일로 다릅니다."},{"sub":"엑셀 함수","q":"필터로 숨겨진 행을 제외하고 합계를 구할 수 있는 함수는?","o":["SUM","SUBTOTAL","SUMPRODUCT","AGGREGATE만 가능"],"a":1,"e":"SUM은 화면에 안 보여도 범위 안의 모든 값을 더합니다. 필터를 걸어 일부만 보이게 해도 합계는 변하지 않습니다.\nSUBTOTAL은 다릅니다. 첫 번째 인수에 함수 번호를 넣는데, 9를 넣으면 필터로 걸러진 행을 빼고 더하고, 109를 넣으면 필터뿐 아니라 사용자가 직접 숨긴 행까지 뺍니다.\n부분합 기능이 자동으로 만드는 수식도 이 SUBTOTAL입니다.\n\n▸ 함수 번호: 1은 평균, 2는 개수, 3은 COUNTA, 4는 최대, 9는 합계입니다.\n▸ 100번대 번호: 수동으로 숨긴 행도 제외하는 옵션."},{"sub":"엑셀 함수","q":"미래에 받을 금액의 현재가치를 구하는 재무 함수는?","o":["FV","PV","PMT","RATE"],"a":1,"e":"재무 함수는 이름이 뜻을 그대로 담고 있습니다.\nPV는 Present Value, 현재가치입니다. 나중에 받을 돈이 지금 기준으로 얼마인지 계산합니다. FV는 Future Value, 미래가치로 지금 넣은 돈이 나중에 얼마가 되는지 구합니다. PMT는 Payment로 대출을 갚을 때 매달 얼마씩 내야 하는지 구합니다.\n주의할 점은 결과가 음수로 나오는 경우가 많다는 것입니다. 돈이 나가는 방향을 음수로 표시하기 때문이며, 앞에 마이너스를 붙여 양수로 만들곤 합니다.\n\n▸ 이율: 기간당 이자율. 연이율을 월 단위로 쓰려면 12로 나눕니다.\n▸ 기간수: 총 납입 횟수."},{"sub":"엑셀 함수","q":"=IF(AND(A1>=80, B1>=80), \"합격\", \"불합격\") 이 합격을 표시하는 조건은?","o":["A1과 B1 중 하나라도 80 이상","A1과 B1 모두 80 이상","A1만 80 이상","B1만 80 이상"],"a":1,"e":"AND는 안에 넣은 조건이 모두 참일 때만 참이 됩니다. 하나라도 거짓이면 전체가 거짓입니다.\n반대로 OR는 하나라도 참이면 참입니다. 두 과목 모두 80점을 넘어야 합격이면 AND, 하나만 넘어도 되면 OR를 씁니다.\nNOT은 참과 거짓을 뒤집습니다. 조건이 세 개 이상이어도 AND(조건1, 조건2, 조건3)처럼 쉼표로 이어 쓰면 됩니다.\n\n▸ AND: 모두 참일 때만 참.\n▸ OR: 하나라도 참이면 참.\n▸ 논리 함수: 참과 거짓을 판정하는 함수들."},{"sub":"엑셀 함수","q":"문자로 저장된 숫자 \"1,234\"를 계산 가능한 숫자로 바꾸는 함수는?","o":["TEXT","VALUE","FIXED","DOLLAR"],"a":1,"e":"외부에서 가져온 데이터는 숫자처럼 보여도 실제로는 문자인 경우가 있습니다. 이런 값은 더해지지 않고 왼쪽으로 정렬되어 있어 구분할 수 있습니다.\nVALUE는 문자를 숫자로 바꿔줍니다. 반대로 TEXT는 숫자를 원하는 모양의 문자로 바꾸는 함수라 방향이 반대입니다.\n간단히는 그 셀에 1을 곱하거나 0을 더해도 숫자로 바뀝니다.\n\n▸ VALUE: 문자 형태의 숫자를 실제 숫자로 변환.\n▸ 오른쪽 정렬: 엑셀에서 숫자가 기본으로 정렬되는 방향."},{"sub":"엑셀 함수","q":"문자열의 길이를 구하는 함수와 오른쪽에서 잘라내는 함수를 조합해 첫 글자를 제외한 나머지를 구하는 수식은?","o":["=RIGHT(A1, LEN(A1)-1)","=LEFT(A1, LEN(A1)-1)","=MID(A1, LEN(A1), 1)","=LEN(RIGHT(A1,1))"],"a":0,"e":"LEN은 글자 수를 세는 함수입니다. 전체 길이에서 1을 빼면 첫 글자를 뺀 길이가 나오고, 그만큼을 오른쪽에서 가져오면 첫 글자만 잘려나갑니다.\n반대로 마지막 글자를 빼려면 LEFT를 써서 =LEFT(A1, LEN(A1)-1)로 씁니다. 잘라낼 방향과 남길 길이를 짝지어 생각하면 헷갈리지 않습니다.\n\n▸ LEN: 문자열의 글자 수를 반환하는 함수. 공백도 한 글자로 셉니다."},{"sub":"엑셀 함수","q":"특정 문자가 문자열에서 몇 번째 위치에 있는지 찾되 대소문자를 구분하는 함수는?","o":["FIND","SEARCH","MATCH","LOOKUP"],"a":0,"e":"FIND와 SEARCH는 둘 다 위치를 찾아주지만 두 가지가 다릅니다.\nFIND는 대소문자를 구분하고 와일드카드를 쓸 수 없습니다. SEARCH는 대소문자를 구분하지 않고 물음표나 별표 같은 와일드카드를 쓸 수 있습니다.\n실기에서는 하이픈이나 괄호의 위치를 찾아 MID와 조합하는 데 자주 쓰입니다. 찾는 문자가 없으면 오류가 나므로 IFERROR로 감싸는 경우가 많습니다.\n\n▸ 와일드카드: 별표는 아무 글자 여러 개, 물음표는 아무 글자 한 개를 뜻하는 기호."},{"sub":"엑셀 배열수식","q":"배열 수식으로 상위 3개 값의 합을 구하는 형태로 옳은 것은?","o":["{=SUM(LARGE(범위,{1,2,3}))}","{=SUM(LARGE(범위,3))}","{=LARGE(SUM(범위),3)}","{=SUM(범위,3)}"],"a":0,"e":"LARGE는 원래 k번째로 큰 값 하나만 돌려줍니다. 그런데 k 자리에 배열 상수 {1,2,3}을 넣으면 1등, 2등, 3등 값을 한꺼번에 돌려줍니다.\n이 세 값을 SUM으로 감싸면 상위 3개의 합이 됩니다. 하위 3개는 LARGE 대신 SMALL을 쓰면 됩니다.\n최신 엑셀에서는 그냥 Enter로도 동작하지만, 시험 환경에서는 Ctrl+Shift+Enter로 입력하는 것이 안전합니다.\n\n▸ 배열 상수: 중괄호 안에 값을 직접 나열해 만든 배열."},{"sub":"엑셀 배열수식","q":"배열 수식 {=COUNT(IF(조건, 1))} 이 구하는 값은?","o":["조건을 만족하는 셀의 개수","전체 셀의 개수","조건을 만족하는 값의 합","조건의 개수"],"a":0,"e":"IF가 조건에 맞는 자리에만 1을 남기고 나머지는 FALSE로 만듭니다. COUNT는 숫자만 세므로 FALSE는 빼고 1의 개수만 셉니다. 결국 조건을 만족하는 셀 수가 나옵니다.\n같은 일을 COUNTIF나 COUNTIFS로도 할 수 있지만, 조건이 복잡해 함수로 표현하기 어려울 때 이 배열 형태를 씁니다.\n\n▸ COUNT: 숫자가 든 셀만 세는 함수.\n▸ FALSE: 논리값 거짓. COUNT는 이를 세지 않습니다."},{"sub":"엑셀 배열수식","q":"두 개 이상의 조건을 만족하는 행의 값을 조회하는 배열 수식 형태로 옳은 것은?","o":["{=INDEX(값범위, MATCH(1, (조건1)*(조건2), 0))}","{=VLOOKUP(조건1, 조건2, 2, 0)}","{=MATCH(INDEX(범위), 1, 0)}","{=SUM(INDEX(범위))}"],"a":0,"e":"VLOOKUP은 조건을 하나만 쓸 수 있습니다. 사번처럼 유일한 값이 없고 부서와 이름을 동시에 만족하는 행을 찾아야 할 때 이 형태를 씁니다.\n두 조건을 곱하면 둘 다 참인 행만 1이 되고 나머지는 0이 됩니다. MATCH로 그 1이 몇 번째인지 찾고, INDEX로 그 위치의 값을 꺼냅니다.\n반드시 Ctrl+Shift+Enter로 입력해야 조건 곱셈이 배열로 계산됩니다.\n\n▸ 다중 조건 조회: 조건 두 개 이상으로 값을 찾아오는 것."},{"sub":"엑셀 배열수식","q":"배열 수식을 입력한 뒤 중괄호가 표시되지 않았다면 원인으로 옳은 것은?","o":["Ctrl+Shift+Enter가 아니라 Enter로 입력했다","셀 서식이 잘못되었다","범위가 너무 넓다","함수 이름을 잘못 썼다"],"a":0,"e":"배열 수식임을 알리는 중괄호는 사용자가 타이핑하는 것이 아니라 Ctrl+Shift+Enter로 입력했을 때 엑셀이 자동으로 붙여주는 표시입니다.\n중괄호가 없다면 일반 수식으로 들어간 것이고, 결과가 오류이거나 첫 값만 반영된 엉뚱한 숫자가 나옵니다. 수식 입력줄을 클릭해 다시 Ctrl+Shift+Enter를 누르면 됩니다.\n중괄호를 직접 타이핑하면 문자로 인식되어 오류가 납니다.\n\n▸ 수식 입력줄: 시트 위쪽에 수식이 표시되는 줄."},{"sub":"엑셀 기본작업","q":"사용자 지정 표시 형식에서 문자를 표시하는 자리를 나타내는 코드는?","o":["#","0","@","?"],"a":2,"e":"표시 형식 코드에는 숫자용과 문자용이 따로 있습니다.\n샵은 유효한 숫자만 표시하고 없으면 아무것도 안 보여줍니다. 0은 자리가 비어도 0을 채웁니다. 물음표는 자릿수를 맞추기 위해 공백을 넣습니다. 그리고 골뱅이는 입력된 문자가 들어갈 자리입니다.\n예를 들어 @\"님\"이라고 쓰면 홍길동을 입력했을 때 홍길동님으로 보입니다. 실제 값은 홍길동 그대로입니다.\n\n▸ 표시 형식: 값을 화면에 어떻게 보일지 정하는 규칙. 값 자체는 바뀌지 않습니다."},{"sub":"엑셀 기본작업","q":"조건부 서식에서 여러 규칙이 동시에 적용될 때의 처리 방식으로 옳은 것은?","o":["규칙 목록의 위쪽 규칙이 우선 적용된다","아래쪽 규칙이 항상 우선한다","무작위로 적용된다","모든 규칙이 무시된다"],"a":0,"e":"규칙 관리자에서 규칙들이 목록으로 나열되는데, 위에 있는 것이 먼저 적용됩니다. 순서는 화살표 단추로 올리고 내릴 수 있습니다.\n서로 충돌하지 않는 서식이라면 여러 규칙이 겹쳐서 함께 적용됩니다. 예를 들어 하나는 글꼴 색을, 다른 하나는 배경색을 바꾼다면 둘 다 나타납니다.\n조건이 맞으면 아래 규칙을 아예 검사하지 않게 하려면 True일 경우 중지를 체크합니다.\n\n▸ 규칙 관리자: 조건부 서식 규칙들을 한 화면에서 관리하는 대화상자."},{"sub":"엑셀 기본작업","q":"고급 필터에서 결과를 원본이 아닌 다른 위치에 표시하려면?","o":["다른 장소에 복사를 선택하고 복사 위치를 지정한다","조건 범위를 비워둔다","자동 필터를 함께 실행한다","시트를 새로 만든다"],"a":0,"e":"고급 필터에는 두 가지 방식이 있습니다. 현재 위치에 필터는 원본 표에서 조건에 안 맞는 행을 숨기는 것이고, 다른 장소에 복사는 결과만 골라 지정한 자리에 새로 써 넣는 것입니다.\n다른 장소에 복사를 고르면 복사 위치 칸이 활성화됩니다. 여기에 결과가 시작될 셀 하나만 지정하면 됩니다. 특정 열만 뽑고 싶으면 그 자리에 원하는 필드명을 미리 적어두고 그 범위를 복사 위치로 잡습니다.\n\n▸ 복사 위치: 필터 결과가 놓일 시작 지점."},{"sub":"엑셀 기본작업","q":"자동 필터와 고급 필터의 차이로 옳은 것은?","o":["고급 필터는 별도의 조건 범위를 만들어 복잡한 조건을 지정할 수 있다","자동 필터가 더 복잡한 조건을 지원한다","고급 필터는 결과를 다른 곳에 복사할 수 없다","둘은 완전히 같다"],"a":0,"e":"자동 필터는 열 제목의 화살표를 눌러 목록에서 고르는 방식입니다. 빠르고 간편하지만 조건을 조합하는 데 한계가 있습니다.\n고급 필터는 시트 어딘가에 조건 범위를 따로 만들어 두고 그걸 참조합니다. 같은 행이면 AND, 다른 행이면 OR로 자유롭게 조합할 수 있고, 수식을 조건으로 쓸 수도 있으며 결과를 다른 위치에 복사할 수도 있습니다.\n\n▸ 조건 범위: 필드명과 조건을 적어둔 별도 영역."},{"sub":"엑셀 기본작업","q":"통합 문서 보호와 시트 보호의 차이로 옳은 것은?","o":["통합 문서 보호는 시트의 추가·삭제·이름 변경을 막는다","통합 문서 보호는 셀 입력을 막는다","시트 보호는 시트 삭제를 막는다","둘은 같은 기능이다"],"a":0,"e":"보호 기능은 대상이 다릅니다.\n시트 보호는 그 시트 안의 셀을 못 고치게 막습니다. 잠금이 해제된 셀만 입력할 수 있게 됩니다. 통합 문서 보호는 시트 자체의 구조를 건드리지 못하게 막습니다. 시트를 추가하거나 지우거나 이름을 바꾸거나 숨기는 작업이 금지됩니다.\n둘은 별개라 필요에 따라 하나만 걸 수도 있고 둘 다 걸 수도 있습니다.\n\n▸ 구조 보호: 시트의 추가, 삭제, 이동, 숨기기를 막는 설정."},{"sub":"엑셀 기본작업","q":"이름 정의에서 사용할 수 없는 이름은?","o":["매출자료","_2026실적","A1","합계_영업부"],"a":2,"e":"이름 정의는 범위나 상수에 별명을 붙이는 기능입니다. 규칙이 몇 가지 있습니다.\n첫 글자는 문자나 밑줄이어야 하고 숫자로 시작할 수 없습니다. 공백을 쓸 수 없어 밑줄로 잇습니다. 그리고 A1이나 B2처럼 셀 주소와 같은 이름은 쓸 수 없습니다. 엑셀이 주소인지 이름인지 구분할 수 없기 때문입니다.\n정의한 이름은 수식에서 =SUM(매출자료)처럼 범위 대신 쓸 수 있습니다.\n\n▸ 이름 상자: 수식 입력줄 왼쪽의 칸. 여기에 입력해도 이름을 정의할 수 있습니다."},{"sub":"엑셀 기본작업","q":"인쇄할 때 모든 페이지 위쪽에 표의 제목 행을 반복해서 나오게 하는 설정은?","o":["인쇄 제목의 반복할 행","머리글/바닥글","페이지 나누기","인쇄 영역"],"a":0,"e":"표가 여러 장에 걸쳐 인쇄되면 두 번째 장부터는 열 제목이 없어 무슨 값인지 알 수 없습니다.\n페이지 레이아웃 탭의 인쇄 제목에서 반복할 행에 제목 행을 지정하면 모든 페이지 위에 그 행이 다시 인쇄됩니다. 세로로 넓은 표라면 반복할 열도 같은 방식으로 지정합니다.\n머리글과 바닥글은 페이지 번호나 문서 제목처럼 표와 무관한 내용을 넣는 자리라 역할이 다릅니다.\n\n▸ 인쇄 영역: 인쇄할 범위만 따로 지정하는 기능."},{"sub":"엑셀 기본작업","q":"셀에 입력된 데이터를 그대로 두고 화면 표시만 특정 형식으로 바꾸는 기능은?","o":["셀 서식의 표시 형식","텍스트 나누기","찾기 및 바꾸기","데이터 유효성 검사"],"a":0,"e":"표시 형식은 값을 건드리지 않고 겉모습만 바꿉니다. 0.85를 85%로 보이게 하거나 20260910을 2026-09-10으로 보이게 해도 셀 안의 실제 값은 그대로라 계산에 그대로 쓸 수 있습니다.\n반면 TEXT 함수나 텍스트 나누기는 값 자체를 바꾸므로 결과가 문자가 되거나 셀이 분리됩니다. 화면만 바꿀 것인지 값을 바꿀 것인지 구분해서 도구를 골라야 합니다.\n\n▸ 셀 서식: Ctrl+1로 여는 대화상자. 표시 형식, 맞춤, 글꼴, 테두리 등을 설정합니다."},{"sub":"엑셀 분석작업","q":"피벗 테이블에서 항목을 시각적으로 골라 필터링하는 도구는?","o":["슬라이서","스파크라인",
