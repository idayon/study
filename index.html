 = 공헌이익 ÷ 매출액)\n\n## 안전한계\n실제 매출이 BEP를 얼마나 넘냐. 클수록 여유 있음.\n\n▸ 공헌이익: 매출 − 변동비. 고정비 갚는 데 기여하는 몫."}]},{"id":"kosaf-ncs","name":"장학재단 직업기초능력","exam":"2026-10-18","note":"NCS 5영역 · 객관식 50문항 60분 · 50점","questions":[{"sub":"의사소통능력","q":"어휘의 쓰임이 옳은 문장은?","o":["이번 사업은 예산 낭비를 지향한다","대금은 법인카드로 결재하였다","팀장이 휴가 신청서를 결재하였다","회사의 위상을 재고할 필요가 있다"],"a":2,"e":"결재는 권한을 가진 사람이 안건을 승인하는 것이고, 결제는 대금을 치르는 것입니다. 지양은 하지 않는 것, 지향은 목표로 삼는 것이며, 제고는 끌어올리는 것, 재고는 다시 생각하는 것입니다."},{"sub":"의사소통능력","q":"띄어쓰기가 옳은 것은?","o":["아는것이 힘이다","할 수 있다","사흘만에 완성했다","그밖에 다른 방법은 없다"],"a":1,"e":"의존명사 수는 앞말과 띄어 씁니다. 것 역시 의존명사이므로 아는 것, 시간의 경과를 뜻하는 만도 의존명사이므로 사흘 만에, 밖에가 그 외라는 뜻일 때는 그 밖에로 띄어 씁니다."},{"sub":"의사소통능력","q":"단어 지양의 뜻으로 옳은 것은?","o":["목표로 삼아 그것을 향해 나아감","더 높은 단계로 오르기 위하여 어떠한 것을 하지 아니함","이미 정한 것을 다시 검토함","수준이나 정도를 끌어올림"],"a":1,"e":"지양은 어떤 것을 하지 않는 것이고, 지향은 목표로 삼아 나아가는 것입니다. 공문서에서 자주 혼동되므로 반대 개념으로 묶어 기억하는 편이 좋습니다."},{"sub":"의사소통능력","q":"공문서 작성 원칙으로 옳지 않은 것은?","o":["육하원칙에 따라 명확하게 작성한다","한 문장은 가급적 짧고 간결하게 쓴다","권위를 위해 한자어와 외래어를 되도록 많이 사용한다","날짜와 숫자는 정확하게 표기한다"],"a":2,"e":"공문서는 누구나 이해할 수 있도록 쉬운 우리말을 쓰는 것이 원칙입니다. 불필요한 한자어와 외래어는 오히려 의미 전달을 방해합니다."},{"sub":"의사소통능력","q":"문서적 의사소통에 해당하지 않는 것은?","o":["기획안 작성","전자우편 발송","회의에서의 구두 보고","업무 매뉴얼 열람"],"a":2,"e":"문서적 의사소통은 문서를 매개로 하는 소통으로 기획서, 공문, 전자우편, 매뉴얼 등이 해당합니다. 구두 보고와 회의 발언, 전화 통화는 언어적 의사소통입니다."},{"sub":"수리능력","q":"농도 10%의 소금물 200g에 물 50g을 더 넣었을 때 소금물의 농도는?","o":["6%","8%","9%","12%"],"a":1,"e":"소금의 양은 200 × 0.1 = 20g으로 변하지 않고, 전체 소금물은 250g이 됩니다. 따라서 농도는 20 ÷ 250 = 8%입니다. 물을 더할 때 용질의 양은 그대로라는 점이 핵심입니다."},{"sub":"수리능력","q":"어떤 일을 A는 혼자 6일, B는 혼자 12일에 끝낸다. 두 사람이 함께하면 며칠이 걸리는가?","o":["3일","4일","5일","9일"],"a":1,"e":"전체 일의 양을 1로 두면 하루 작업량은 A가 6분의 1, B가 12분의 1이고 합하면 4분의 1입니다. 따라서 4일이 걸립니다."},{"sub":"수리능력","q":"자동차가 시속 60km로 2시간, 시속 90km로 2시간을 달렸다. 전체 평균 속력은?","o":["70km/h","72km/h","75km/h","80km/h"],"a":2,"e":"총 이동거리는 120 + 180 = 300km이고 총 소요시간은 4시간이므로 평균 속력은 75km/h입니다. 평균 속력은 속력의 산술평균이 아니라 총거리를 총시간으로 나눈 값입니다."},{"sub":"수리능력","q":"5명 중 3명을 뽑아 일렬로 세우는 경우의 수는?","o":["10가지","20가지","60가지","120가지"],"a":2,"e":"순서가 있으므로 순열입니다. 5 × 4 × 3 = 60가지입니다. 순서를 따지지 않고 3명을 고르기만 한다면 조합으로 10가지가 됩니다."},{"sub":"수리능력","q":"주사위 두 개를 동시에 던질 때 나온 눈의 합이 7일 확률은?","o":["6분의 1","9분의 1","12분의 1","36분의 1"],"a":0,"e":"전체 경우의 수는 36가지이고 합이 7인 경우는 (1,6) (2,5) (3,4) (4,3) (5,2) (6,1)의 6가지입니다. 따라서 6 ÷ 36 = 6분의 1로 두 주사위 합 중 가장 확률이 높습니다."},{"sub":"수리능력","q":"원가에 20%의 이익을 붙여 정가를 정한 뒤, 정가에서 10%를 할인하여 판매하였다. 이때 이익률은?","o":["8%","10%","12%","18%"],"a":0,"e":"원가를 100으로 두면 정가는 120, 10% 할인 판매가는 108입니다. 이익은 8이므로 원가 대비 이익률은 8%입니다. 할인율을 원가가 아닌 정가에 적용한다는 점이 함정입니다."},{"sub":"문제해결능력","q":"명제 비가 오면 소풍을 가지 않는다의 대우로 옳은 것은?","o":["소풍을 가면 비가 오지 않는다","비가 오지 않으면 소풍을 간다","소풍을 가지 않으면 비가 온다","비가 오지 않으면 소풍을 가지 않는다"],"a":0,"e":"대우는 가정과 결론을 뒤바꾸고 각각 부정합니다. p이면 q의 대우는 q가 아니면 p가 아니다입니다. 원명제와 대우는 항상 참거짓이 같지만, 역과 이는 그렇지 않습니다."},{"sub":"문제해결능력","q":"모든 A는 B이고, 모든 B는 C이다. 반드시 참인 것은?","o":["모든 C는 A이다","모든 A는 C이다","어떤 C는 A가 아니다","모든 B는 A이다"],"a":1,"e":"포함관계가 A ⊂ B ⊂ C이므로 모든 A는 C입니다. 나머지는 방향을 뒤집은 진술이라 주어진 조건만으로는 참이라고 단정할 수 없습니다."},{"sub":"문제해결능력","q":"SWOT 분석에서 자사의 약점을 보완하여 외부 기회를 활용하는 전략은?","o":["SO 전략","ST 전략","WO 전략","WT 전략"],"a":2,"e":"WO 전략은 약점(Weakness)을 보완해 기회(Opportunity)를 살리는 방향입니다. SO는 강점으로 기회를 활용, ST는 강점으로 위협에 대응, WT는 약점과 위협을 함께 최소화하는 전략입니다."},{"sub":"문제해결능력","q":"3C 분석의 구성요소에 해당하지 않는 것은?","o":["Customer","Competitor","Company","Cost"],"a":3,"e":"3C는 고객(Customer), 경쟁사(Competitor), 자사(Company)입니다. 환경분석 기법으로 SWOT과 함께 자주 출제되며, Cost는 포함되지 않습니다."},{"sub":"문제해결능력","q":"앞으로 발생할 수 있는 상황을 예상하고 미리 대응 방안을 마련하는 문제 유형은?","o":["발생형 문제","탐색형 문제","설정형 문제","일탈형 문제"],"a":2,"e":"발생형은 이미 일어난 눈에 보이는 문제, 탐색형은 현재 상태를 개선하기 위해 찾아내는 문제, 설정형은 미래 상황에 대응하는 문제입니다. 설정형은 목표 지향적이라 창조적 문제라고도 합니다."},{"sub":"문제해결능력","q":"A는 B보다 앞서 도착했고, C는 A보다 앞서 도착했으며, D는 B보다 늦게 도착했다. 세 번째로 도착한 사람은?","o":["A","B","C","D"],"a":1,"e":"C가 A보다 앞이고 A가 B보다 앞이며 D가 B보다 뒤이므로 순서는 C, A, B, D입니다. 따라서 세 번째는 B입니다. 부등호 방향을 한 줄로 이어 붙이면 빠르게 정리됩니다."},{"sub":"자원관리능력","q":"시간관리 매트릭스에서 장기적 성과를 위해 가장 비중을 늘려야 하는 영역은?","o":["긴급하고 중요한 일","긴급하지 않지만 중요한 일","긴급하지만 중요하지 않은 일","긴급하지도 중요하지도 않은 일"],"a":1,"e":"긴급하지 않지만 중요한 영역에는 계획 수립, 예방, 역량 개발, 관계 구축이 들어갑니다. 이 영역에 시간을 투자할수록 긴급하고 중요한 일이 줄어든다는 것이 이 모형의 핵심입니다."},{"sub":"자원관리능력","q":"다음 중 직접비용에 해당하는 것은?","o":["건물 관리비","광고선전비","출장 여비","보험료"],"a":2,"e":"직접비용은 제품 생산이나 서비스 창출에 직접 소요된 비용으로 재료비, 인건비, 출장비, 시설비 등이 해당합니다. 보험료, 광고비, 건물관리비, 통신비는 간접비용입니다."},{"sub":"자원관리능력","q":"4명이 3박 4일 출장을 간다. 1인 1박 숙박비 7만원, 1인 1일 식비 3만원일 때 총 비용은?","o":["120만원","132만원","144만원","156만원"],"a":1,"e":"숙박비는 4명 × 3박 × 7만 = 84만원, 식비는 4명 × 4일 × 3만 = 48만원으로 합계 132만원입니다. 3박과 4일을 각각 다른 수로 곱해야 한다는 점이 함정입니다."},{"sub":"자원관리능력","q":"인력배치의 원칙 중 적재적소주의에 해당하는 설명은?","o":["팀원의 능력과 성격을 고려해 가장 적합한 위치에 배치한다","팀원 모두에게 동일한 업무량을 배분한다","근속연수가 긴 사람을 우선 배치한다","본인이 희망하는 부서에 무조건 배치한다"],"a":0,"e":"적재적소주의는 개인의 능력과 성격을 고려해 최적의 위치에 배치하는 원칙입니다. 이와 함께 능력주의, 균형주의가 인력배치의 3원칙으로 제시됩니다."},{"sub":"조직이해능력","q":"기계적 조직의 특징으로 옳은 것은?","o":["의사결정 권한이 분권화되어 있다","규칙과 규정이 엄격하고 위계질서가 명확하다","비공식적 소통이 활발하다","환경 변화에 유연하게 대응한다"],"a":1,"e":"기계적 조직은 규칙과 절차가 명확하고 권한이 집중되며 위계가 뚜렷합니다. 반대로 유기적 조직은 분권화, 비공식적 소통, 유연한 대응이 특징이며 변화가 심한 환경에 적합합니다."},{"sub":"조직이해능력","q":"조직에서 전결의 의미로 옳은 것은?","o":["결재권자가 부재중일 때 차하위자가 대신 결재하는 것","조직의 장이 위임한 사항에 대하여 위임받은 사람이 최종 결재하는 것","여러 부서가 공동으로 결재하는 것","결재를 보류하고 재검토를 요청하는 것"],"a":1,"e":"전결은 위임받은 사람이 최종 결재권을 행사하는 것이고, 결재권자가 부재중일 때 대신 결재한 뒤 사후 보고하는 것은 대결입니다. 두 개념을 바꾸어 출제하는 경우가 많습니다."},{"sub":"조직이해능력","q":"매킨지 7S 모형의 구성요소에 해당하지 않는 것은?","o":["공유가치(Shared Value)","전략(Strategy)","고객(Customer)","제도와 절차(System)"],"a":2,"e":"7S는 공유가치, 전략, 구조, 제도와 절차, 구성원, 기술, 리더십 스타일입니다. 고객은 3C 분석의 요소이지 7S에는 포함되지 않습니다."},{"sub":"조직이해능력","q":"주주총회 및 이사회 개최 관련 업무를 주로 담당하는 부서는?","o":["인사부","총무부","영업부","회계부"],"a":1,"e":"총무부는 주주총회와 이사회 운영, 문서·집기 관리, 사내외 행사, 법인 인감 관리 등을 담당합니다. 인사부는 채용과 인사평가, 회계부는 결산과 세무를 맡습니다."},{"sub":"조직이해능력","q":"경영전략 추진 과정의 순서로 옳은 것은?","o":["환경분석 → 전략목표 설정 → 경영전략 도출 → 실행 → 평가","전략목표 설정 → 환경분석 → 경영전략 도출 → 실행 → 평가","경영전략 도출 → 전략목표 설정 → 환경분석 → 실행 → 평가","전략목표 설정 → 경영전략 도출 → 환경분석 → 실행 → 평가"],"a":1,"e":"비전과 미션을 담은 전략목표를 먼저 세우고, 내외부 환경을 분석한 뒤, 조직·사업·부문 전략을 도출하고 실행한 다음 평가와 피드백으로 순환합니다."},{"sub":"의사소통능력","q":"잠재되어 있는 능력이나 재능을 일깨워 발전시킨다는 뜻의 단어는?","o":["개발","계발","발굴","개척"],"a":1,"e":"계발은 슬기나 재능을 일깨우는 것이고 개발은 새로운 것을 만들거나 자원을 활용하는 것입니다. 자기 계발, 기술 개발로 짝지어 외우면 헷갈리지 않습니다."},{"sub":"의사소통능력","q":"'반증'의 뜻으로 옳은 것은?","o":["어떤 사실을 간접적으로 증명해 주는 자료","어떤 주장이 옳지 않음을 증명하는 근거","이미 제출된 증거를 다시 검토하는 일","증거를 새로 만들어 내는 일"],"a":1,"e":"반증은 반대되는 증거이고, 간접적으로 뒷받침하는 자료는 방증입니다. 두 단어를 바꿔 쓰는 오류가 자주 출제됩니다."},{"sub":"의사소통능력","q":"운동 경기에서 종전 기록을 깨뜨렸을 때 쓰는 말로 옳은 것은?","o":["기록을 갱신하다","기록을 경신하다","기록을 개선하다","기록을 개편하다"],"a":1,"e":"경신은 이미 있던 기록을 깨뜨려 새로 세우는 것이고, 갱신은 계약이나 면허의 기간을 연장하는 것입니다. 계약 갱신, 기록 경신으로 구분합니다."},{"sub":"의사소통능력","q":"이중피동 표현이 사용된 문장은?","o":["문이 열렸다","계획이 세워졌다","그렇게 보여진다","결과가 발표되었다"],"a":2,"e":"보다에 피동 접미사 이와 피동 표현 어지다가 겹쳐 이중피동이 되었습니다. 보인다로 써야 옳으며 잊혀지다, 쓰여지다도 같은 오류입니다."},{"sub":"의사소통능력","q":"높임법이 잘못 사용된 문장은?","o":["주문하신 커피 나오셨습니다","고객님께서 주문하신 상품입니다","사장님께서 말씀하셨습니다","할머니께서 진지를 드십니다"],"a":0,"e":"커피는 높임의 대상이 아니므로 나왔습니다로 써야 합니다. 사물에 존칭을 붙이는 것은 대표적인 과잉 높임 오류입니다."},{"sub":"의사소통능력","q":"어법상 옳은 표현은?","o":["빈칸에 알맞는 답을 고르시오","빈칸에 알맞은 답을 고르시오","빈칸에 맞는 답을 골르시오","빈칸에 알맞을 답을 고르시오"],"a":1,"e":"알맞다는 형용사이므로 관형사형 어미가 은이 붙어 알맞은이 됩니다. 알맞는은 동사에 쓰는 형태라 틀린 표현입니다."},{"sub":"의사소통능력","q":"'로서'와 '로써'의 쓰임이 모두 옳은 것은?","o":["학생으로써 본분을 다하고, 대화로서 해결한다","학생으로서 본분을 다하고, 대화로써 해결한다","학생으로서 본분을 다하고, 대화로서 해결한다","학생으로써 본분을 다하고, 대화로써 해결한다"],"a":1,"e":"로서는 지위나 자격을, 로써는 수단이나 도구를 나타냅니다. 자격은 서, 수단은 써로 기억하면 됩니다."},{"sub":"의사소통능력","q":"맞춤법이 옳은 문장은?","o":["그렇게 하면 안 되요","그렇게 하면 안 돼요","그렇게 하면 않 되요","그렇게 하면 않 돼요"],"a":1,"e":"돼는 되어의 준말이라 되어요를 줄이면 돼요가 됩니다. 되가 들어갈지 돼가 들어갈지 헷갈리면 하와 해를 넣어 보면 구분됩니다."},{"sub":"의사소통능력","q":"다음 중 어미의 쓰임이 옳은 것은?","o":["무엇을 하던지 최선을 다해라","얼마나 춥든지 손이 시렸다","가든지 말든지 마음대로 해라","그때 얼마나 좋든지 몰라"],"a":2,"e":"선택을 나타낼 때는 든지, 과거를 회상할 때는 던지를 씁니다. 가든지 말든지는 선택이므로 든지가 맞습니다."},{"sub":"의사소통능력","q":"외래어 표기가 모두 옳은 것은?","o":["리더쉽, 컨셉, 초콜렛","리더십, 콘셉트, 초콜릿","리더쉽, 콘셉트, 초콜릿","리더십, 컨셉, 초콜렛"],"a":1,"e":"외래어 표기법에 따르면 리더십, 콘셉트, 초콜릿이 옳습니다. 악세사리가 아니라 액세서리, 플랭카드가 아니라 플래카드도 자주 출제됩니다."},{"sub":"의사소통능력","q":"공문서에서 날짜를 표기하는 방법으로 옳은 것은?","o":["2026년 9월 10일","2026-09-10","2026. 9. 10.","2026/9/10"],"a":2,"e":"공문서는 연월일을 마침표로 찍어 표기하며 마지막 일 뒤에도 마침표를 찍습니다. 숫자 사이는 한 칸 띄웁니다."},{"sub":"의사소통능력","q":"공문서에서 금액을 표기하는 방법으로 옳은 것은?","o":["숫자로만 쓴다","한글로만 쓴다","아라비아 숫자로 쓰고 괄호 안에 한글을 함께 적는다","반드시 소수점까지 표기한다"],"a":2,"e":"위조와 변조를 막기 위해 금113,560원(금일십일만삼천오백육십원)처럼 숫자와 한글을 함께 적습니다."},{"sub":"의사소통능력","q":"상급자에게 안건을 올려 승인을 구하는 내부 문서는?","o":["보도자료","품의서","설명서","비즈니스 레터"],"a":1,"e":"품의서는 업무 수행에 필요한 사항을 결재권자에게 올려 승인을 받는 문서입니다. 보도자료는 언론에 배포하는 문서이고, 설명서는 제품 사용법을 안내하는 문서입니다."},{"sub":"의사소통능력","q":"업무 문서를 작성할 때 결론이나 핵심을 앞에 배치하는 방식은?","o":["미괄식","두괄식","양괄식","열거식"],"a":1,"e":"업무 문서는 읽는 사람이 빠르게 판단해야 하므로 결론을 먼저 제시하는 두괄식이 원칙입니다. 배경과 근거는 그 뒤에 붙입니다."},{"sub":"의사소통능력","q":"경청을 방해하는 태도에 해당하지 않는 것은?","o":["상대의 말을 미리 판단하고 결론짓기","다음에 할 말을 생각하며 듣기","상대의 말을 요약해 확인하기","자신의 경험으로 화제를 돌리기"],"a":2,"e":"상대의 말을 요약해 되짚는 것은 적극적 경청의 대표적 기법입니다. 나머지는 짐작하기, 준비하기, 자기 경험과 관련짓기라는 방해 요인입니다."},{"sub":"의사소통능력","q":"문서 이해의 절차에서 가장 먼저 해야 할 일은?","o":["문서의 목적을 이해하는 것","상대방의 의도를 도표로 정리하는 것","문서에 나타난 정보를 요약하는 것","자신에게 요구되는 행동을 파악하는 것"],"a":0,"e":"문서를 왜 작성했는지 목적을 먼저 파악해야 이후의 배경 확인, 내용 요약, 요구 행동 파악이 방향을 잡습니다."},{"sub":"의사소통능력","q":"상대의 의견을 먼저 인정한 뒤 자신의 견해를 제시하는 설득 화법은?","o":["Yes, But 화법","맞장구 화법","반복 화법","질문 화법"],"a":0,"e":"상대를 부정하지 않고 수용한 뒤 대안을 제시하므로 저항이 줄어듭니다. 반대 의견을 낼 때 특히 효과적입니다."},{"sub":"의사소통능력","q":"주어와 서술어의 호응이 옳은 문장은?","o":["이 제품의 특징은 가볍고 튼튼하다","내가 하고 싶은 말은 시간을 지켜 달라는 것이다","우리의 목표는 매출을 늘리겠다","그 이유는 비용이 많이 든다"],"a":1,"e":"말은과 것이다가 호응합니다. 나머지는 특징은 점이다, 목표는 것이다, 이유는 때문이다로 고쳐야 호응이 맞습니다."},{"sub":"의사소통능력","q":"번역투 표현으로 다듬어야 할 문장은?","o":["회의에서 결정했다","업무를 처리하는 데 있어서 주의가 필요하다","보고서를 제출했다","기한을 지켰다"],"a":1,"e":"하는 데 있어서는 영어의 in 구문을 옮긴 번역투이므로 처리할 때로 고치는 것이 자연스럽습니다. 아무리 로 인하여, 되어지다도 같은 유형입니다."},{"sub":"의사소통능력","q":"비언어적 의사소통 수단에 해당하지 않는 것은?","o":["표정","몸짓","목소리의 높낮이","전자우편의 본문"],"a":3,"e":"전자우편 본문은 문자로 이루어진 문서적 의사소통입니다. 표정, 몸짓, 자세, 시선, 목소리 톤은 비언어적 요소로 언어 내용 못지않게 정보를 전달합니다."},{"sub":"의사소통능력","q":"단위 명사의 띄어쓰기가 옳은 것은?","o":["연필 세자루를 샀다","연필 세 자루를 샀다","연필세 자루를 샀다","연필세자루를 샀다"],"a":1,"e":"단위를 나타내는 명사는 앞말과 띄어 씁니다. 다만 순서를 나타내거나 숫자와 어울려 쓸 때는 제1과, 10개처럼 붙여 쓸 수 있습니다."},{"sub":"의사소통능력","q":"기획서를 작성할 때 유의할 점으로 옳지 않은 것은?","o":["상대가 요구하는 바를 정확히 파악해 반영한다","핵심 내용을 먼저 제시한다","분량을 늘려 성의를 보이기 위해 반복 서술한다","인용한 자료의 출처를 밝힌다"],"a":2,"e":"분량을 늘리려는 반복 서술은 핵심을 흐리고 읽는 사람의 시간을 뺏습니다. 기획서는 간결성과 설득력이 생명입니다."},{"sub":"수리능력","q":"농도 8%의 소금물 300g과 농도 12%의 소금물 200g을 섞으면 농도는?","o":["9.2%","9.6%","10.0%","10.4%"],"a":1,"e":"소금은 24g과 24g을 합해 48g이고 소금물은 500g입니다. 48 ÷ 500 = 9.6%입니다."},{"sub":"수리능력","q":"10km 떨어진 두 지점에서 A는 시속 4km, B는 시속 6km로 마주 보고 동시에 출발했다. 몇 시간 후에 만나는가?","o":["0.5시간","1시간","1.5시간","2시간"],"a":1,"e":"마주 보고 움직이면 거리가 두 속력의 합만큼 줄어듭니다. 10 ÷ (4 + 6) = 1시간입니다."},{"sub":"수리능력","q":"길이 200m인 기차가 시속 72km로 달려 길이 800m인 터널을 완전히 통과하는 데 걸리는 시간은?","o":["40초","45초","50초","55초"],"a":2,"e":"시속 72km는 초속 20m입니다. 완전히 통과하려면 터널 길이와 기차 길이를 더한 1,000m를 달려야 하므로 1,000 ÷ 20 = 50초입니다."},{"sub":"수리능력","q":"현재 아버지는 45세, 아들은 15세이다. 아버지의 나이가 아들 나이의 2배가 되는 것은 몇 년 후인가?","o":["10년 후","12년 후","15년 후","20년 후"],"a":2,"e":"45 + x = 2(15 + x)를 풀면 45 + x = 30 + 2x이므로 x = 15입니다. 15년 후 아버지 60세, 아들 30세가 됩니다."},{"sub":"수리능력","q":"원가에 25%의 이익을 붙여 정가를 정한 뒤 정가에서 1,000원을 할인해 팔았더니 원가의 15% 이익이 남았다. 이 상품의 원가는?","o":["8,000원","10,000원","12,000원","15,000원"],"a":1,"e":"원가를 C라 하면 0.25C - 1,000 = 0.15C이므로 0.1C = 1,000, C = 10,000원입니다."},{"sub":"수리능력","q":"연이율 5%의 단리로 200만원을 3년간 예치했을 때 받는 이자는?","o":["20만원","30만원","40만원","50만원"],"a":1,"e":"단리 이자는 원금 × 이율 × 기간이므로 200만 × 0.05 × 3 = 30만원입니다. 복리라면 원금에 이자가 더해져 계산됩니다."},{"sub":"수리능력","q":"어떤 회사의 매출이 재작년 대비 작년에 20% 증가하고, 작년 대비 올해 10% 감소했다. 재작년 대비 올해 매출의 변화는?","o":["10% 증가","8% 증가","8% 감소","10% 감소"],"a":1,"e":"1.2 × 0.9 = 1.08이므로 8% 증가입니다. 증가율과 감소율은 단순히 더하고 빼면 안 되고 곱해야 합니다."},{"sub":"수리능력","q":"12, 18, 30의 최대공약수는?","o":["2","3","6","12"],"a":2,"e":"세 수를 소인수분해하면 공통으로 2와 3을 가지므로 최대공약수는 6입니다. 최소공배수는 180입니다."},{"sub":"수리능력","q":"8명 중에서 3명의 대표를 뽑는 경우의 수는? (순서 무관)","o":["24가지","56가지","112가지","336가지"],"a":1,"e":"순서를 따지지 않으므로 조합입니다. 8 × 7 × 6 ÷ (3 × 2 × 1) = 56가지입니다."},{"sub":"수리능력","q":"동전 3개를 동시에 던질 때 앞면이 정확히 2개 나올 확률은?","o":["8분의 1","4분의 1","8분의 3","2분의 1"],"a":2,"e":"전체 경우의 수는 8가지이고 앞면이 2개인 경우는 3가지이므로 8분의 3입니다."},{"sub":"수리능력","q":"빨간 공 3개와 파란 공 5개가 든 주머니에서 2개를 동시에 꺼낼 때 적어도 1개가 빨간 공일 확률은?","o":["14분의 5","14분의 9","28분의 15","28분의 3"],"a":1,"e":"전체는 28가지이고 둘 다 파란 공인 경우는 10가지입니다. 여사건을 이용하면 1 - 10/28 = 9/14입니다."},{"sub":"수리능력","q":"학생 40명 중 축구를 좋아하는 학생이 22명, 야구를 좋아하는 학생이 18명, 둘 다 좋아하는 학생이 8명이다. 둘 다 좋아하지 않는 학생은?","o":["6명","8명","10명","12명"],"a":1,"e":"적어도 하나를 좋아하는 학생은 22 + 18 - 8 = 32명이므로 40 - 32 = 8명입니다."},{"sub":"수리능력","q":"사과 3개와 배 2개는 8,000원, 사과 2개와 배 3개는 7,500원이다. 사과 1개의 가격은?","o":["1,300원","1,500원","1,800원","2,000원"],"a":2,"e":"두 식을 연립해 풀면 사과는 1,800원, 배는 1,300원입니다. 두 식을 더한 뒤 빼는 방식으로 접근하면 빠릅니다."},{"sub":"수리능력","q":"2, 5, 10, 17, 26 다음에 올 수는?","o":["35","36","37","38"],"a":2,"e":"이웃한 항의 차가 3, 5, 7, 9로 2씩 커집니다. 다음 차는 11이므로 26 + 11 = 37입니다."},{"sub":"수리능력","q":"3시 30분에 시계의 시침과 분침이 이루는 작은 쪽 각도는?","o":["70도","75도","80도","85도"],"a":1,"e":"시침은 3시 30분에 105도, 분침은 180도 위치에 있습니다. 차이는 75도입니다."},{"sub":"수리능력","q":"물통을 가득 채우는 데 A관은 4시간, B관은 6시간이 걸린다. 두 관을 함께 쓰면 얼마나 걸리는가?","o":["2시간","2시간 24분","2시간 30분","3시간"],"a":1,"e":"시간당 작업량은 4분의 1과 6분의 1을 합해 12분의 5입니다. 12 ÷ 5 = 2.4시간이므로 2시간 24분입니다."},{"sub":"수리능력","q":"자료 5, 7, 7, 9, 12의 중앙값과 최빈값을 순서대로 나열한 것은?","o":["7, 7","8, 7","7, 9","9, 7"],"a":0,"e":"크기순으로 정렬했을 때 가운데 값이 중앙값이므로 7이고, 가장 많이 나온 값도 7입니다. 평균은 8입니다."},{"sub":"수리능력","q":"어떤 상품의 가격이 20% 인상되었다가 다시 20% 인하되었다. 처음 가격과 비교하면?","o":["같다","4% 높다","4% 낮다","2% 낮다"],"a":2,"e":"1.2 × 0.8 = 0.96이므로 처음보다 4% 낮습니다. 같은 비율로 올렸다 내리면 원래 가격으로 돌아오지 않습니다."},{"sub":"수리능력","q":"남학생 20명의 평균이 70점, 여학생 30명의 평균이 80점일 때 전체 50명의 평균은?","o":["74점","75점","76점","78점"],"a":2,"e":"총점은 1,400 + 2,400 = 3,800점이고 인원은 50명이므로 76점입니다. 두 평균의 단순 평균인 75점이 아니라는 점이 함정입니다."},{"sub":"수리능력","q":"환율이 1달러당 1,300원일 때 260만원을 달러로 환전하면? (수수료 없음)","o":["1,500달러","2,000달러","2,200달러","2,600달러"],"a":1,"e":"2,600,000 ÷ 1,300 = 2,000달러입니다."},{"sub":"수리능력","q":"어떤 일을 A 혼자 하면 12일이 걸리고, A와 B가 함께 하면 4일이 걸린다. B 혼자 하면 며칠이 걸리는가?","o":["5일","6일","8일","9일"],"a":1,"e":"B의 하루 작업량은 4분의 1에서 12분의 1을 뺀 6분의 1입니다. 따라서 6일이 걸립니다."},{"sub":"수리능력","q":"정가 20,000원인 상품을 30% 할인한 뒤 부가가치세 10%를 더하면 최종 가격은?","o":["14,000원","15,400원","15,000원","16,000원"],"a":1,"e":"할인가는 14,000원이고 여기에 10%를 더하면 15,400원입니다."},{"sub":"수리능력","q":"어떤 수에 4를 더한 다음 3을 곱했더니 27이 되었다. 어떤 수는?","o":["3","5","6","9"],"a":1,"e":"3(x + 4) = 27에서 x + 4 = 9이므로 x = 5입니다."},{"sub":"수리능력","q":"둘레가 36cm이고 가로가 세로보다 4cm 긴 직사각형의 넓이는?","o":["70cm²","72cm²","77cm²","80cm²"],"a":2,"e":"가로와 세로의 합은 18cm이고 차가 4cm이므로 가로 11cm, 세로 7cm입니다. 넓이는 77cm²입니다."},{"sub":"문제해결능력","q":"명제 '성실한 사람은 신뢰받는다'의 역에 해당하는 것은?","o":["신뢰받는 사람은 성실하다","성실하지 않은 사람은 신뢰받지 못한다","신뢰받지 못하는 사람은 성실하지 않다","성실한 사람은 신뢰받지 못한다"],"a":0,"e":"역은 가정과 결론을 뒤바꾼 것입니다. 이는 둘 다 부정한 것, 대우는 뒤바꾸고 부정한 것이며 원명제와 참거짓이 늘 같은 것은 대우뿐입니다."},{"sub":"문제해결능력","q":"'어떤 A는 B이다'가 참일 때 반드시 참인 것은?","o":["모든 A는 B이다","어떤 B는 A이다","모든 B는 A이다","어떤 A는 B가 아니다"],"a":1,"e":"A와 B가 겹치는 부분이 존재한다는 뜻이므로 그 부분을 B 쪽에서 보면 어떤 B는 A입니다. 나머지는 주어진 정보만으로 단정할 수 없습니다."},{"sub":"문제해결능력","q":"모든 공무원은 성실하다. 어떤 성실한 사람은 친절하다. 반드시 참인 것은?","o":["모든 공무원은 친절하다","어떤 공무원은 친절하다","친절한 사람은 모두 공무원이다","알 수 없다"],"a":3,"e":"친절한 성실한 사람이 공무원 집합 안에 있는지 밖에 있는지 알 수 없으므로 결론을 내릴 수 없습니다. 어떤이 포함된 전제 두 개로는 확정적 결론이 나오지 않는 경우가 많습니다."},{"sub":"문제해결능력","q":"A는 C보다 크고, B는 A보다 크며, D는 B보다 크다. 가장 작은 것은?","o":["A","B","C","D"],"a":2,"e":"크기 순서는 D, B, A, C입니다. 부등호를 한 줄로 이어 붙이면 빠르게 정리됩니다."},{"sub":"문제해결능력","q":"다섯 명이 원탁에 앉아 있다. 갑의 맞은편은 없고 을은 갑의 바로 왼쪽, 병은 갑의 바로 오른쪽에 앉았다. 정과 무의 위치로 옳은 것은?","o":["정과 무는 서로 이웃해 앉는다","정은 갑의 바로 옆이다","무는 을의 바로 왼쪽이 아니다","정은 병의 맞은편이다"],"a":0,"e":"갑의 양옆이 을과 병으로 정해지면 남은 두 자리가 붙어 있으므로 정과 무는 반드시 이웃합니다. 나머지는 확정할 수 없습니다."},{"sub":"문제해결능력","q":"SWOT 분석에서 강점을 활용해 외부 위협에 대응하는 전략은?","o":["SO 전략","ST 전략","WO 전략","WT 전략"],"a":1,"e":"ST 전략은 내부 강점으로 외부 위협을 막아내는 방향입니다. 강점과 기회의 결합은 SO, 약점과 위협의 최소화는 WT입니다."},{"sub":"문제해결능력","q":"이미 발생하여 눈에 보이는 문제로, 원상복구가 필요한 문제 유형은?","o":["발생형 문제","탐색형 문제","설정형 문제","잠재형 문제"],"a":0,"e":"발생형 문제는 기준을 이탈해 이미 드러난 문제로 원인 지향적입니다. 탐색형은 현재를 개선하려는 문제, 설정형은 미래에 대응하는 문제입니다."},{"sub":"문제해결능력","q":"문제해결을 위한 기본적 사고에 해당하지 않는 것은?","o":["전략적 사고","분석적 사고","발상의 전환","고정관념의 유지"],"a":3,"e":"문제해결의 기본 사고는 전략적 사고, 분석적 사고, 발상의 전환, 내외부 자원의 활용입니다. 고정관념은 오히려 대표적인 장애 요인입니다."},{"sub":"문제해결능력","q":"브레인스토밍의 진행 원칙으로 옳지 않은 것은?","o":["아이디어를 많이 낼수록 좋다","다른 사람의 아이디어에 편승해도 된다","제시된 아이디어를 즉시 비판하고 걸러낸다","자유분방한 분위기를 유지한다"],"a":2,"e":"비판 금지가 브레인스토밍의 핵심 규칙입니다. 평가는 아이디어를 충분히 모은 뒤 별도 단계에서 진행합니다."},{"sub":"문제해결능력","q":"논리적 오류 중 상대방의 주장을 왜곡해 공격하기 쉬운 형태로 바꾼 뒤 반박하는 오류는?","o":["허수아비 공격의 오류","성급한 일반화의 오류","인신공격의 오류","순환논증의 오류"],"a":0,"e":"허수아비 공격은 원래 주장이 아니라 만들어 낸 약한 주장을 공격합니다. 인신공격은 주장 대신 사람을 문제 삼는 오류입니다."},{"sub":"문제해결능력","q":"일부 사례만 보고 전체가 그렇다고 결론짓는 오류는?","o":["순환논증의 오류","성급한 일반화의 오류","흑백논리의 오류","권위에 호소하는 오류"],"a":1,"e":"표본이 대표성을 갖지 못할 때 발생합니다. 두 가지 선택지만 있다고 전제하면 흑백논리, 결론을 전제로 삼으면 순환논증입니다."},{"sub":"문제해결능력","q":"문제해결 절차의 순서로 옳은 것은?","o":["문제 인식 → 문제 도출 → 원인 분석 → 해결안 개발 → 실행 및 평가","원인 분석 → 문제 인식 → 문제 도출 → 해결안 개발 → 실행 및 평가","문제 도출 → 문제 인식 → 해결안 개발 → 원인 분석 → 실행 및 평가","문제 인식 → 원인 분석 → 문제 도출 → 실행 및 평가 → 해결안 개발"],"a":0,"e":"무엇이 문제인지 인식하고 핵심 문제를 뽑아낸 뒤 원인을 파고들어 해결안을 만들고 실행합니다. 원인 분석이 문제 도출보다 앞설 수 없습니다."},{"sub":"문제해결능력","q":"원인과 결과의 관계를 물고기 뼈 모양으로 정리하는 분석 기법은?","o":["로직 트리","특성요인도","파레토 차트","간트 차트"],"a":1,"e":"특성요인도는 이시카와 다이어그램이라고도 하며 결과에 영향을 준 요인을 큰 뼈와 잔가지로 구조화합니다. 간트 차트는 일정 관리 도구입니다."},{"sub":"문제해결능력","q":"전체 결과의 대부분이 소수의 원인에서 비롯된다는 원리는?","o":["파레토 법칙","머피의 법칙","하인리히 법칙","파킨슨 법칙"],"a":0,"e":"80대 20 법칙이라고도 하며 핵심 원인에 자원을 집중하라는 근거가 됩니다. 하인리히 법칙은 큰 사고 이전에 다수의 경미한 징후가 있다는 원리입니다."},{"sub":"문제해결능력","q":"네 사람이 달리기를 했다. 갑은 을보다 빨랐고, 병은 갑보다 느렸으며, 정은 을보다 느렸다. 병과 정의 순위를 알 수 있는가?","o":["병이 정보다 빠르다","정이 병보다 빠르다","둘의 순위는 확정할 수 없다","둘은 동시에 들어왔다"],"a":2,"e":"갑보다 느린 병, 을보다 느린 정이라는 정보만으로는 병과 정을 직접 비교할 수 없습니다. 확정할 수 없다는 선택지를 두려워하지 말아야 합니다."},{"sub":"문제해결능력","q":"다섯 명 중 한 명만 거짓을 말하고 있다. 이런 유형의 문제를 푸는 접근으로 가장 적절한 것은?","o":["가장 그럴듯한 진술을 참으로 가정한다","각 사람이 거짓말쟁이라고 차례로 가정하고 모순 여부를 확인한다","진술이 짧은 사람부터 제외한다","모든 진술을 참으로 놓고 계산한다"],"a":1,"e":"참거짓 문제는 경우를 나누어 가정한 뒤 모순이 생기지 않는 경우 하나를 찾는 방식이 정석입니다. 서로 상반된 진술을 한 두 사람을 먼저 찾으면 시간이 줄어듭니다."},{"sub":"문제해결능력","q":"현재 상태를 개선하기 위해 눈에 보이지 않는 문제를 찾아내는 문제 유형은?","o":["발생형 문제","탐색형 문제","설정형 문제","일상형 문제"],"a":1,"e":"탐색형 문제는 방치하면 나중에 손실이 커지는 문제로 잠재문제, 예측문제, 발견문제로 나뉩니다. 스스로 찾아야 한다는 점이 특징입니다."},{"sub":"문제해결능력","q":"'모든 신입사원은 교육을 받는다'가 참일 때 반드시 참인 것은?","o":["교육을 받은 사람은 신입사원이다","교육을 받지 않은 사람은 신입사원이 아니다","신입사원이 아니면 교육을 받지 않는다","교육을 받지 않은 신입사원도 있다"],"a":1,"e":"원명제의 대우이므로 반드시 참입니다. 첫 번째는 역, 세 번째는 이에 해당해 참이라고 단정할 수 없습니다."},{"sub":"문제해결능력","q":"창의적 사고를 개발하는 기법 중 서로 관련 없어 보이는 요소를 결합해 새로운 아이디어를 얻는 방법은?","o":["자유연상법","강제연결법","비교발상법","체크리스트법"],"a":1,"e":"강제연결법은 무관한 대상을 억지로 연결해 발상을 끌어냅니다. 자유연상법의 대표가 브레인스토밍, 비교발상법의 대표가 유추법인 시넥틱스입니다."},{"sub":"문제해결능력","q":"다음 조건에서 반드시 참인 것은? 조건 1: 회의에 참석하면 보고서를 제출한다. 조건 2: 보고서를 제출하지 않았다.","o":["회의에 참석했다","회의에 참석하지 않았다","보고서를 제출할 것이다","알 수 없다"],"a":1,"e":"조건 1의 대우는 보고서를 제출하지 않으면 회의에 참석하지 않았다입니다. 조건 2와 결합하면 회의에 참석하지 않았음이 확정됩니다."},{"sub":"문제해결능력","q":"3C 분석에서 자사의 강점과 약점을 파악하는 항목은?","o":["Customer","Competitor","Company","Channel"],"a":2,"e":"Company는 자사의 역량과 자원을 분석하는 항목입니다. Customer는 시장과 고객 요구, Competitor는 경쟁사의 전략과 점유율을 봅니다."},{"sub":"문제해결능력","q":"문제를 큰 항목에서 작은 항목으로 나누어 나무 형태로 구조화하는 기법은?","o":["로직 트리","벤 다이어그램","산점도","히스토그램"],"a":0,"e":"로직 트리는 문제를 중복 없이 누락 없이 나누는 MECE 원칙에 따라 전개합니다. 원인 파악과 해결안 도출 모두에 쓰입니다."},{"sub":"문제해결능력","q":"분석적 사고에 관한 설명으로 옳은 것은?","o":["직관에 의존해 빠르게 결론을 내린다","전체를 요소로 나누어 각각의 의미를 도출한 뒤 결론을 이끈다","경험을 그대로 적용한다","다른 사람의 판단을 그대로 수용한다"],"a":1,"e":"분석적 사고는 대상을 구성 요소로 분해해 의미를 뽑아낸 뒤 종합합니다. 성과 지향, 가설 지향, 사실 지향 문제로 나누어 접근합니다."},{"sub":"문제해결능력","q":"다음 중 MECE 원칙에 맞게 분류한 것은?","o":["직원을 신입, 경력, 우수사원으로 나눈다","고객을 20대, 30대, 40대 이상으로 나눈다","상품을 인기상품과 신상품으로 나눈다","부서를 영업부와 성과가 좋은 부서로 나눈다"],"a":1,"e":"MECE는 항목이 서로 겹치지 않고 전체를 빠짐없이 덮어야 합니다. 연령 구분은 중복이 없고 전체를 포괄하지만 나머지는 기준이 섞여 중복이 생깁니다."},{"sub":"자원관리능력","q":"자원관리의 기본 과정 순서로 옳은 것은?","o":["필요한 자원의 종류와 양 확인 → 이용 가능한 자원 수집 → 자원 활용 계획 수립 → 계획대로 수행","이용 가능한 자원 수집 → 필요 자원 확인 → 계획 수립 → 수행","계획 수립 → 자원 확인 → 자원 수집 → 수행","자원 수집 → 계획 수립 → 자원 확인 → 수행"],"a":0,"e":"무엇이 얼마나 필요한지 먼저 확인한 뒤 확보하고 계획을 세워 실행합니다. 자원의 종류에는 시간, 예산, 물적자원, 인적자원이 있습니다."},{"sub":"자원관리능력","q":"시간자원의 특성으로 옳지 않은 것은?","o":["누구에게나 동일하게 주어진다","저장하거나 아껴 둘 수 없다","사용하지 않아도 소멸한다","돈으로 구입해 늘릴 수 있다"],"a":3,"e":"시간은 매 순간 사라지며 총량을 늘릴 수 없습니다. 그래서 관리의 초점이 확보가 아니라 배분에 놓입니다."},{"sub":"자원관리능력","q":"다음 중 간접비용에 해당하는 것은?","o":["원재료비","인건비","건물 임대료","시설장비 구입비"],"a":2,"e":"간접비용은 특정 제품이나 서비스에 직접 대응시키기 어려운 비용으로 보험료, 광고비, 임대료, 공과금 등이 해당합니다."},{"sub":"자원관리능력","q":"예산 수립 시 과업세부도를 작성하는 주된 이유는?","o":["필요한 모든 활동을 빠짐없이 파악해 예산 누락을 막기 위해","보고서 분량을 늘리기 위해","상급자의 결재를 받기 위해","조직도를 정리하기 위해"],"a":0,"e":"과업세부도는 업무를 세분화해 각 활동에 드는 비용을 산정하게 해 줍니다. 빠뜨린 활동이 있으면 그만큼 예산이 부족해집니다."},{"sub":"자원관리능력","q":"물적자원 관리가 제대로 되지 않는 원인으로 보기 어려운 것은?","o":["보관 장소를 파악하지 못함","훼손이나 분실","사용 목적에 따라 분류해 보관함","무분별한 구매로 인한 과잉 재고"],"a":2,"e":"목적에 따라 분류해 보관하는 것은 올바른 관리 방법입니다. 동일 물품은 한곳에, 유사 물품은 인접한 곳에 두는 것이 원칙입니다."},{"sub":"자원관리능력","q":"바코드나 QR코드를 물품 관리에 활용하는 주된 이유는?","o":["물품의 위치와 수량을 신속하고 정확하게 파악하기 위해","물품의 가격을 올리기 위해","보관 공간을 줄이기 위해","직원 수를 줄이기 위해"],"a":0,"e":"코드로 물품을 식별하면 입출고와 재고 확인이 자동화되어 오류와 시간이 줄어듭니다."},{"sub":"자원관리능력","q":"인력배치의 3원칙에 해당하지 않는 것은?","o":["적재적소주의","능력주의","균형주의","연공주의"],"a":3,"e":"인력배치는 적재적소주의, 능력주의, 균형주의를 원칙으로 합니다. 근속연수를 기준으로 삼는 연공주의는 여기에 포함되지 않습니다."},{"sub":"자원관리능력","q":"시간관리를 통해 얻을 수 있는 효과로 보기 어려운 것은?","o":["스트레스 감소","생산성 향상","목표 달성","업무량의 절대적 감소"],"a":3,"e":"시간관리는 같은 시간에 더 나은 성과를 내도록 돕지만 해야 할 일 자체를 없애지는 않습니다."},{"sub":"자원관리능력","q":"출장비를 정산할 때 3박 4일 일정에서 숙박비를 계산하는 기준은?","o":["4박 기준","3박 기준","2박 기준","일수와 무관하게 정액"],"a":1,"e":"3박 4일이면 숙박은 3회, 식비는 4일 기준으로 계산합니다. 박과 일을 혼동해 곱하는 것이 가장 흔한 실수입니다."},{"sub":"자원관리능력","q":"A안은 초기비용 500만원에 연 유지비 100만원, B안은 초기비용 300만원에 연 유지비 150만원이다. 5년간 총비용을 비교하면?","o":["A안이 50만원 더 적다","B안이 50만원 더 적다","A안이 150만원 더 적다","두 안의 비용이 같다"],"a":0,"e":"A안은 500 + 100 × 5 = 1,000만원, B안은 300 + 150 × 5 = 1,050만원입니다. 초기비용이 커도 유지비가 낮으면 기간이 길어질수록 유리해집니다."},{"sub":"자원관리능력","q":"시간관리 매트릭스에서 긴급하지만 중요하지 않은 일에 해당하는 것은?","o":["장기 계획 수립","불필요한 잦은 회의와 방문","위기 상황 대응","자기 계발"],"a":1,"e":"형식적인 회의, 갑작스러운 방문, 일부 전화와 메일이 여기에 속합니다. 이 영역은 위임하거나 줄이는 것이 관리의 핵심입니다."},{"sub":"자원관리능력","q":"효과적인 예산관리를 위해 가장 바람직한 상태는?","o":["책정 비용이 실제 비용보다 훨씬 크다","책정 비용이 실제 비용보다 훨씬 작다","책정 비용과 실제 비용이 비슷하다","예산을 책정하지 않는다"],"a":2,"e":"책정 비용이 크면 자원이 낭비되고 작으면 사업 진행에 차질이 생깁니다. 두 값이 근접할 때 이상적인 예산관리라고 봅니다."},{"sub":"자원관리능력","q":"시간 낭비 요인 중 내적 요인에 해당하는 것은?","o":["예고 없는 방문객","계획 없이 일을 시작하는 습관","교통 체증","동료의 잡담"],"a":1,"e":"내적 요인은 자기 통제 가능한 습관과 태도이고, 외적 요인은 타인이나 환경에서 비롯됩니다. 내적 요인이 실제로는 더 큰 비중을 차지합니다."},{"sub":"자원관리능력","q":"팀원의 능력과 성격이 아니라 팀 전체의 능력 향상과 화합을 고려해 배치하는 원칙은?","o":["적재적소주의","능력주의","균형주의","성과주의"],"a":2,"e":"균형주의는 개인이 아니라 팀 전체를 하나의 단위로 보고 모든 구성원의 균형을 고려합니다."},{"sub":"자원관리능력","q":"직접비용에 해당하지 않는 것은?","o":["재료비","시설비","출장비","사무비품비"],"a":3,"e":"일반적인 사무비품비는 특정 사업에 직접 귀속시키기 어려워 간접비로 분류합니다. 재료비, 원료와 장비, 시설비, 출장비, 인건비가 직접비입니다."},{"sub":"자원관리능력","q":"4명이 2박 3일 워크숍을 간다. 1인 1박 숙박비 6만원, 1인 1일 식비 4만원일 때 총비용은?","o":["72만원","84만원","96만원","120만원"],"a":2,"e":"숙박비는 4 × 2 × 6 = 48만원, 식비는 4 × 3 × 4 = 48만원으로 합계 96만원입니다."},{"sub":"조직이해능력","q":"조직의 유형 중 공식조직에 해당하는 것은?","o":["사내 동호회","고향 친목회","회사의 영업본부","점심 모임"],"a":2,"e":"공식조직은 조직의 목표 달성을 위해 의도적으로 만들어진 구조입니다. 동호회와 친목회처럼 자연발생적으로 생긴 것은 비공식조직입니다."},{"sub":"조직이해능력","q":"조직목표의 기능으로 보기 어려운 것은?","o":["조직이 나아갈 방향을 제시한다","구성원의 의사결정 기준이 된다","조직 구성원의 행동을 억압한다","조직 운영의 정당성을 제공한다"],"a":2,"e":"조직목표는 방향 제시, 행동 지침, 정당성 근거, 수행 평가 기준의 역할을 합니다. 억압이 아니라 응집력을 높이는 기능을 합니다."},{"sub":"조직이해능력","q":"유기적 조직의 특징으로 옳은 것은?","o":["엄격한 위계와 규정","분권화된 의사결정과 유연한 소통","높은 업무 표준화","좁은 통솔 범위"],"a":1,"e":"유기적 조직은 권한이 분산되고 수평적 소통이 활발해 변화가 빠른 환경에 적합합니다. 규정과 위계를 강조하는 것은 기계적 조직입니다."},{"sub":"조직이해능력","q":"조직문화의 기능으로 옳지 않은 것은?","o":["구성원에게 일체감과 정체성을 부여한다","조직 몰입을 높인다","구성원의 행동 지침이 된다","조직의 변화와 혁신을 촉진한다"],"a":3,"e":"강한 조직문화는 안정성을 주지만 지나치면 변화에 대한 저항으로 작용합니다. 혁신 촉진은 조직문화의 일반적 기능으로 보지 않습니다."},{"sub":"조직이해능력","q":"경영의 4요소에 해당하지 않는 것은?","o":["경영목적","인적자원","자금","고객"],"a":3,"e":"경영의 구성요소는 경영목적, 인적자원, 자금, 경영전략입니다. 고객은 경영 대상이자 환경 요인입니다."},{"sub":"조직이해능력","q":"마이클 포터가 제시한 본원적 경쟁전략에 해당하지 않는 것은?","o":["원가우위 전략","차별화 전략","집중화 전략","다각화 전략"],"a":3,"e":"본원적 경쟁전략은 원가우위, 차별화, 집중화 세 가지입니다. 다각화는 사업 영역을 넓히는 성장전략으로 층위가 다릅니다."},{"sub":"조직이해능력","q":"결재권자가 출장 등으로 부재중일 때 차하위자가 대신 결재하고 사후에 보고하는 것은?","o":["전결","대결","합의","공람"],"a":1,"e":"대결은 사후 보고가 전제되며, 위임받은 사람이 최종 결재권을 행사하는 전결과 구분됩니다."},{"sub":"조직이해능력","q":"조직도를 통해 파악할 수 있는 정보로 보기 어려운 것은?","o":["부서 간 위계 관계","업무의 분화 정도","보고 체계","직원 개인의 성과 수준"],"a":3,"e":"조직도는 구조적 정보를 담을 뿐 개인의 성과는 나타내지 않습니다. 공식적 구조를 파악하는 기초 자료입니다."},{"sub":"조직이해능력","q":"기능식 조직의 장점으로 옳은 것은?","o":["제품별 책임 소재가 명확하다","전문성이 축적되고 규모의 경제를 얻기 쉽다","환경 변화에 빠르게 대응한다","부서 간 조정이 필요 없다"],"a":1,"e":"기능식 조직은 유사한 업무를 묶어 전문성과 효율을 높입니다. 다만 부서 간 장벽이 생기고 환경 변화 대응이 느린 것이 단점입니다."},{"sub":"조직이해능력","q":"채용, 교육훈련, 인사평가, 급여를 담당하는 부서는?","o":["총무부","인사부","기획부","회계부"],"a":1,"e":"인사부는 사람과 관련한 업무 전반을 맡습니다. 기획부는 경영계획과 예산 편성, 회계부는 결산과 세무를 담당합니다."},{"sub":"조직이해능력","q":"조직 경영에서 최고경영층이 주로 수행하는 의사결정은?","o":["일상적 업무 처리","전략적 의사결정","단순 반복 작업","현장 감독"],"a":1,"e":"최고경영층은 조직 전체의 방향과 자원 배분을 결정하는 전략적 의사결정을 담당합니다. 중간관리층은 관리적, 하위층은 운영적 의사결정을 맡습니다."},{"sub":"조직이해능력","q":"업무의 특성에 관한 설명으로 옳지 않은 것은?","o":["공통된 조직의 목적을 지향한다","독립적으로 수행되며 다른 업무와 관계가 없다","요구되는 지식과 기술이 다르다","다른 업무와 순서 관계를 갖는다"],"a":1,"e":"업무는 조직 목표를 달성하기 위해 서로 연결되어 있으며 순서와 흐름을 가집니다. 완전히 독립적인 업무는 드뭅니다."},{"sub":"조직이해능력","q":"국제 비즈니스 상황에서 명함을 받았을 때 적절한 행동은?","o":["받자마자 주머니에 넣는다","받은 자리에서 내용을 확인하고 대화 중 테이블 위에 둔다","명함에 즉시 메모한다","한 손으로 건네받는다"],"a":1,"e":"명함은 상대의 얼굴로 여겨지므로 받은 즉시 확인하고 정중히 다룹니다. 상대 앞에서 바로 메모하거나 함부로 넣는 것은 결례입니다."},{"sub":"조직이해능력","q":"조직 내 의사결정이 점진적으로 이루어지며 기존 결정을 조금씩 수정해 나가는 모형은?","o":["합리모형","점증모형","만족모형","쓰레기통모형"],"a":1,"e":"점증모형은 현실의 제약 속에서 기존 정책을 부분적으로 수정하는 방식입니다. 합리모형은 모든 대안을 비교해 최적안을 고른다고 가정합니다."},{"sub":"조직이해능력","q":"경영참가제도의 유형에 해당하지 않는 것은?","o":["경영참가","이윤참가","자본참가","고객참가"],"a":3,"e":"근로자의 경영참가제도는 의사결정에 참여하는 경영참가, 성과를 나누는 이윤참가, 주식을 갖는 자본참가로 나뉩니다."},{"sub":"조직이해능력","q":"조직의 규모가 커질수록 일반적으로 나타나는 현상은?","o":["공식화 정도가 낮아진다","분업과 전문화가 심화된다","의사결정이 단순해진다","비공식조직이 사라진다"],"a":1,"e":"규모가 커지면 업무가 세분화되고 규정과 절차가 늘어 공식화 수준이 높아집니다. 비공식조직은 규모와 무관하게 존재합니다."},{"sub":"조직이해능력","q":"경영전략 유형 중 원가우위 전략을 추구하는 기업의 특징은?","o":["차별화된 브랜드 이미지에 집중한다","대량생산과 비용 절감으로 낮은 가격을 무기로 한다","특정 시장에만 집중한다","제품 다양성을 극대화한다"],"a":1,"e":"원가우위는 규모의 경제와 공정 효율로 경쟁사보다 낮은 원가 구조를 만드는 전략입니다. 시장을 좁혀 집중하는 것은 집중화 전략입니다."},{"sub":"조직이해능력","q":"회사에서 문서를 여러 부서가 함께 확인하도록 돌려 보는 것을 무엇이라 하는가?","o":["전결","대결","공람","기안"],"a":2,"e":"공람은 관련자들이 문서 내용을 확인하도록 회람하는 절차입니다. 기안은 문서를 처음 작성해 결재를 올리는 것입니다."},{"sub":"조직이해능력","q":"조직변화의 과정 순서로 옳은 것은?","o":["환경 변화 인지 → 조직변화 방향 수립 → 조직변화 실행 → 변화 결과 평가","조직변화 실행 → 환경 변화 인지 → 방향 수립 → 결과 평가","방향 수립 → 환경 변화 인지 → 실행 → 평가","결과 평가 → 방향 수립 → 환경 변화 인지 → 실행"],"a":0,"e":"외부 환경 변화를 감지하는 것이 출발점이며 이후 방향을 정하고 실행한 뒤 결과를 평가해 다시 반영합니다."},{"sub":"조직이해능력","q":"업무수행 계획을 세울 때 활용하는 도구로, 일정별 업무를 막대 형태로 표시한 것은?","o":["간트 차트","워크플로 시트","체크리스트","특성요인도"],"a":0,"e":"간트 차트는 단계별 소요 시간과 업무 간 겹침을 한눈에 보여 줍니다. 워크플로 시트는 업무 흐름을, 체크리스트는 항목별 진행 여부를 점검합니다."},{"sub":"의사소통능력","q":"'왠'과 '웬'의 쓰임이 옳은 문장은?","o":["오늘은 왠지 기분이 좋다","웬지 불안하다","이게 왠 떡이냐","왠일로 이렇게 일찍 왔니"],"a":0,"e":"'왠지'는 '왜인지'의 준말이라 이 한 단어에만 '왠'을 씁니다. 그 밖에는 모두 '웬'이며 '웬 떡', '웬일'이 맞습니다."},{"sub":"의사소통능력","q":"'이따가'와 '있다가'의 쓰임이 옳은 문장은?","o":["이따가 다시 연락할게","있다가 만나자고 했다","잠시 이따 와라","조금 있다가 후에 보자"],"a":0,"e":"시간이 조금 지난 뒤를 뜻할 때는 '이따가', 어떤 곳에 머무르다가의 뜻일 때는 '있다가'를 씁니다."},{"sub":"의사소통능력","q":"'가르치다'와 '가리키다'의 쓰임이 옳은 문장은?","o":["손가락으로 북쪽을 가르쳤다","선생님이 수학을 가리킨다","시계가 열 시를 가리킨다","아이에게 예절을 가리켰다"],"a":2,"e":"'가르치다'는 지식이나 기능을 알려주는 것이고 '가리키다'는 방향이나 대상을 지시하는 것입니다."},{"sub":"의사소통능력","q":"'늘리다'와 '늘이다'의 쓰임이 옳은 문장은?","o":["고무줄을 늘렸다","인원을 늘였다","바지 길이를 늘였다","예산을 늘였다"],"a":2,"e":"'늘이다'는 길이를 길게 하는 것이고 '늘리다'는 수나 양, 크기를 많게 하는 것입니다. 바지 길이는 '늘이다', 인원과 예산은 '늘리다'입니다."},{"sub":"의사소통능력","q":"'곤혹'과 '곤욕'의 쓰임이 옳은 문장은?","o":["예상 못 한 질문에 곤욕스러웠다","심한 모욕을 당해 곤욕을 치렀다","곤욕스러운 표정을 지었다","곤혹을 치르게 하였다"],"a":1,"e":"'곤욕'은 심한 모욕이나 참기 힘든 일 자체를 뜻하고, '곤혹'은 곤란해 어찌할 바를 모르는 상태입니다. '곤혹스럽다'는 있어도 '곤욕스럽다'는 어색합니다."},{"sub":"의사소통능력","q":"'유래'와 '유례'의 쓰임이 옳은 문장은?","o":["유래 없는 폭우가 내렸다","이 축제의 유례를 조사하였다","유례를 찾기 힘든 기록이다","지명의 유례가 오래되었다"],"a":2,"e":"'유래'는 사물이 생겨난 내력, '유례'는 같거나 비슷한 예를 뜻합니다. 비슷한 사례가 없다는 뜻이면 '유례없는'이 맞습니다."},{"sub":"의사소통능력","q":"'일절'과 '일체'의 쓰임이 옳은 문장은?","o":["출입을 일체 금지한다","안주 일절 준비되어 있습니다","비용 일절을 부담하겠다","면회를 일절 사절합니다"],"a":3,"e":"'일절'은 아주, 전혀의 뜻으로 부정이나 금지에 쓰고, '일체'는 모든 것을 뜻합니다. 금지 문맥이므로 '일절'이 맞습니다."},{"sub":"의사소통능력","q":"'부문'과 '부분'의 쓰임이 옳은 문장은?","o":["기술 부분에서 수상하였다","사과의 썩은 부문을 도려냈다","소설 부문 신인상을 받았다","전체의 일부 부문만 확인했다"],"a":2,"e":"'부문'은 전체를 갈래로 나눈 영역이고 '부분'은 전체를 이루는 조각입니다. 시상 분야는 '부문'입니다."},{"sub":"의사소통능력","q":"'보전'과 '보존'의 쓰임이 옳은 문장은?","o":["문화재를 원형대로 보전하였다","생태계를 보존하기 위해 개발을 제한한다","손실을 보전하기 위해 예산을 투입했다","유물을 보전 처리하였다"],"a":2,"e":"'보전'은 온전하게 유지하거나 부족한 것을 메우는 것이고, '보존'은 잘 간수해 그대로 남기는 것입니다. 손실 메우기는 '보전'입니다."},{"sub":"의사소통능력","q":"'혼돈'과 '혼동'의 쓰임이 옳은 문장은?","o":["두 단어를 혼돈하기 쉽다","전쟁으로 사회가 혼동에 빠졌다","앞뒤를 혼동하여 잘못 적었다","가치관의 혼동이 심각하다"],"a":2,"e":"'혼동'은 서로 뒤섞어 구별하지 못하는 것이고, '혼돈'은 질서가 없이 뒤죽박죽인 상태입니다."},{"sub":"의사소통능력","q":"'실재'와 '실제'의 쓰임이 옳은 문장은?","o":["실재로는 그렇지 않다","소설 속 인물이 실제한다","그 인물은 실재 인물이다","실재 상황을 보고하라"],"a":2,"e":"'실재'는 실제로 존재하는 것이고, '실제'는 사실의 경우나 형편을 뜻합니다. 실존 인물은 '실재 인물'입니다."},{"sub":"의사소통능력","q":"'임대'와 '임차'의 쓰임이 옳은 문장은?","o":["세입자가 사무실을 임대하였다","건물주가 사무실을 임대하였다","건물주가 사무실을 임차하였다","임대인은 돈을 내고 빌리는 사람이다"],"a":1,"e":"'임대'는 빌려주는 것, '임차'는 빌리는 것입니다. 건물주가 빌려주므로 임대인, 세입자가 빌리므로 임차인입니다."},{"sub":"의사소통능력","q":"'추돌'과 '충돌'의 쓰임이 옳은 문장은?","o":["마주 오던 차량이 추돌하였다","앞차의 뒤를 들이받는 추돌 사고가 났다","뒤에서 충돌하여 밀려났다","교차로에서 추돌한 두 차량"],"a":1,"e":"'추돌'은 뒤에서 들이받는 것이고 '충돌'은 서로 마주치거나 부딪히는 것입니다."},{"sub":"의사소통능력","q":"'좇다'와 '쫓다'의 쓰임이 옳은 문장은?","o":["도둑을 좇아 달렸다","명예를 쫓는 삶","스승의 뜻을 좇았다","파리를 좇아 버렸다"],"a":2,"e":"'좇다'는 목표나 뜻, 이상을 추구하는 것이고 '쫓다'는 물리적으로 뒤를 따르거나 몰아내는 것입니다."},{"sub":"의사소통능력","q":"'반드시'와 '반듯이'의 쓰임이 옳은 문장은?","o":["반듯이 참석하겠습니다","선을 반듯이 그어라","약속은 반듯이 지켜야 한다","반드시 앉아라"],"a":1,"e":"'반드시'는 꼭, 틀림없이의 뜻이고 '반듯이'는 비뚤어지지 않고 곧게라는 뜻입니다."},{"sub":"의사소통능력","q":"'매다'와 '메다'의 쓰임이 옳은 문장은?","o":["가방을 매고 등교했다","넥타이를 메었다","신발끈을 매었다","어깨에 가방을 매다"],"a":2,"e":"'매다'는 끈이나 줄을 묶는 것이고 '메다'는 어깨에 걸치거나 짊어지는 것입니다. 신발끈은 '매다', 가방은 '메다'입니다."},{"sub":"의사소통능력","q":"'만'의 띄어쓰기가 옳은 것은?","o":["십 년 만에 만났다","십년만에 만났다","십 년만에 만났다","십년 만에 만났다"],"a":0,"e":"'년'은 단위 명사이고 시간의 경과를 뜻하는 '만'도 의존명사이므로 모두 띄어 씁니다."},{"sub":"의사소통능력","q":"'뿐'의 띄어쓰기가 옳은 것은?","o":["최선을 다할 뿐이다","최선을 다할뿐이다","나뿐 아니라 너도","좋을 대로 하라"],"a":0,"e":"'뿐'이 용언 뒤에 오면 의존명사라 띄어 쓰고, 체언 뒤에 오면 조사라 붙여 씁니다. '나뿐'은 붙이고 '다할 뿐'은 띄웁니다."},{"sub":"의사소통능력","q":"문장의 호응이 자연스러운 것은?","o":["나는 결코 그 일을 한 적이 있다","비록 실패하더라도 포기하지 않겠다","만약 내일 비가 오면 좋겠다","반드시 그럴 리가 없다"],"a":1,"e":"'결코', '반드시', '여간' 등은 호응하는 서술어가 정해져 있습니다. '결코'는 부정, '비록'은 양보, '만약'은 가정과 호응합니다."},{"sub":"의사소통능력","q":"사이시옷 표기가 옳은 것은?","o":["최대값","등교길","나뭇잎","해님"],"a":2,"e":"'나뭇잎'은 사이시옷을 받쳐 적습니다. '최댓값', '등굣길'이 맞는 표기이며 '해님'은 사이시옷을 쓰지 않습니다."},{"sub":"의사소통능력","q":"공문서 작성에서 시간을 표기하는 방법으로 옳은 것은?","o":["오후 2시 30분","14:30","14시 30분","PM 2:30"],"a":1,"e":"시각은 24시각제에 따라 숫자로 쓰고 시와 분 사이에 쌍점을 찍습니다."},{"sub":"의사소통능력","q":"효과적인 피드백의 원칙으로 옳지 않은 것은?","o":["구체적인 행동을 대상으로 한다","가능한 한 시기를 놓치지 않는다","사람의 인격을 평가한다","개선 가능한 부분에 초점을 둔다"],"a":2,"e":"피드백은 사람이 아니라 행동과 결과를 대상으로 해야 합니다. 인격을 평가하면 방어적 반응만 부릅니다."},{"sub":"의사소통능력","q":"의사표현에서 상대를 설득할 때 권장되는 방법이 아닌 것은?","o":["상대의 이익을 함께 제시한다","구체적 근거와 자료를 제시한다","상대의 반론을 미리 차단하기 위해 말을 끊는다","결론을 명확히 밝힌다"],"a":2,"e":"말을 끊는 것은 반감을 키웁니다. 반론은 미리 예상해 답변을 준비하는 방식으로 대응해야 합니다."},{"sub":"의사소통능력","q":"문서 작성 시 육하원칙에 해당하지 않는 것은?","o":["누가","언제","얼마나 비싸게","어떻게"],"a":2,"e":"육하원칙은 누가, 언제, 어디서, 무엇을, 어떻게, 왜입니다. 가격은 별도 항목이지 육하원칙 요소가 아닙니다."},{"sub":"의사소통능력","q":"보고서 작성 원칙으로 옳지 않은 것은?","o":["결론을 앞에 제시한다","근거 자료의 출처를 밝힌다","가능한 한 길고 상세하게 작성한다","도표를 활용해 이해를 돕는다"],"a":2,"e":"보고서는 읽는 사람의 시간을 아끼는 문서입니다. 핵심을 앞에 두고 간결하게 쓰는 것이 원칙입니다."},{"sub":"의사소통능력","q":"'제고'의 뜻으로 옳은 것은?","o":["다시 생각함","수준이나 정도를 끌어올림","앞서 만들어 둠","남은 물건"],"a":1,"e":"'제고'는 쳐들어 높인다는 뜻으로 효율 제고, 품질 제고처럼 씁니다. 다시 생각하는 것은 '재고'입니다."},{"sub":"의사소통능력","q":"'지그시'와 '지긋이'의 쓰임이 옳은 문장은?","o":["나이가 지그시 들었다","눈을 지그시 감았다","지긋이 눌러 주세요","지긋이 참고 견뎠다"],"a":1,"e":"'지그시'는 슬며시 힘을 주는 모양이고 '지긋이'는 나이가 비교적 많아 듬직한 모양을 뜻합니다."},{"sub":"의사소통능력","q":"'바라다'와 '바래다'의 쓰임이 옳은 문장은?","o":["성공하길 바래","색이 바랬다","네가 오기를 바랬다","합격하길 바래요"],"a":1,"e":"소망은 '바라다'이므로 '바라', '바랍니다'가 맞습니다. '바래다'는 색이 옅어지거나 배웅한다는 뜻입니다."},{"sub":"의사소통능력","q":"'안치다'와 '앉히다'의 쓰임이 옳은 문장은?","o":["밥을 앉혔다","아이를 의자에 안혔다","솥에 쌀을 안쳤다","손님을 안쳤다"],"a":2,"e":"'안치다'는 밥이나 찌개를 솥에 넣고 불에 올리는 것이고, '앉히다'는 앉게 하는 것입니다."},{"sub":"의사소통능력","q":"'두껍다'와 '두텁다'의 쓰임이 옳은 문장은?","o":["두터운 책을 읽었다","신뢰가 두텁다","얼음이 두텁게 얼었다","두꺼운 정을 나누었다"],"a":1,"e":"'두껍다'는 물리적 두께에, '두텁다'는 신뢰나 정 같은 관계의 깊이에 씁니다."},{"sub":"수리능력","q":"12분 간격으로 출발하는 A버스와 18분 간격으로 출발하는 B버스가 오전 8시에 동시에 출발했다. 다음에 동시에 출발하는 시각은?","o":["오전 8시 24분","오전 8시 36분","오전 8시 48분","오전 9시"],"a":1,"e":"12와 18의 최소공배수는 36이므로 36분 뒤인 8시 36분에 다시 겹칩니다. 동시에 일어나는 주기를 묻는 문제는 최소공배수를 씁니다."},{"sub":"수리능력","q":"농도 12%의 소금물 500g에서 물 100g을 증발시키면 농도는?","o":["13%","14%","15%","16%"],"a":2,"e":"소금의 양은 500 × 0.12 = 60g으로 변하지 않고 전체는 400g이 됩니다. 60 ÷ 400 = 15%입니다."},{"sub":"수리능력","q":"100만원을 연이율 10%의 복리로 2년간 예치했을 때 원리금 합계는?","o":["110만원","120만원","121만원","125만원"],"a":2,"e":"복리는 원금에 이자가 붙고 그 이자에 다시 이자가 붙습니다. 100만 × 1.1 × 1.1 = 121만원이며, 단리라면 120만원입니다."},{"sub":"수리능력","q":"정지한 물에서 시속 10km로 가는 배가 유속 2km/h인 강을 24km 거슬러 올라가는 데 걸리는 시간은?","o":["2시간","2시간 24분","3시간","4시간"],"a":2,"e":"거슬러 올라갈 때의 속력은 10 - 2 = 8km/h이므로 24 ÷ 8 = 3시간입니다. 내려올 때는 12km/h가 됩니다."},{"sub":"수리능력","q":"톱니가 24개인 톱니바퀴 A와 톱니가 36개인 톱니바퀴 B가 맞물려 돌고 있다. A가 3바퀴 돌 때 B는 몇 바퀴 도는가?","o":["1바퀴","2바퀴","3바퀴","4바퀴"],"a":1,"e":"맞물린 톱니 수는 서로 같으므로 24 × 3 = 72개, 72 ÷ 36 = 2바퀴입니다. 톱니 수와 회전수는 반비례합니다."},{"sub":"수리능력","q":"원가가 8,000원인 상품을 팔아 원가의 25% 이익을 남기려면 판매가는?","o":["9,000원","9,600원","10,000원","10,400원"],"a":2,"e":"8,000 × 1.25 = 10,000원입니다. 이익률의 기준이 원가인지 판매가인지 확인하는 것이 이런 문제의 핵심입니다."},{"sub":"수리능력","q":"9,000만원을 2 : 3 : 4의 비율로 나눌 때 가장 큰 몫은?","o":["2,000만원","3,000만원","4,000만원","4,500만원"],"a":2,"e":"비의 합이 9이므로 한 몫은 1,000만원입니다. 가장 큰 몫은 4 × 1,000만 = 4,000만원입니다."},{"sub":"수리능력","q":"6명이 10일 동안 해야 끝나는 일을 4명이 하면 며칠이 걸리는가? (개인별 작업 속도는 같음)","o":["12일","15일","18일","20일"],"a":1,"e":"전체 작업량은 6 × 10 = 60인일입니다. 4명이 하면 60 ÷ 4 = 15일이 걸립니다."},{"sub":"수리능력","q":"불량률이 10%인 제품 중에서 2개를 골랐을 때 둘 다 정상일 확률은? (복원추출)","o":["0.71","0.81","0.90","0.99"],"a":1,"e":"정상일 확률이 0.9이므로 0.9 × 0.9 = 0.81입니다. 적어도 하나가 불량일 확률은 1에서 이를 뺀 0.19입니다."},{"sub":"수리능력","q":"어느 회사의 매출이 250억원에서 300억원으로 늘었다. 증가율은?","o":["16.7%","20%","25%","50%"],"a":1,"e":"증가율은 증가분을 기준연도 값으로 나눕니다. 50 ÷ 250 = 20%입니다. 300을 기준으로 나누지 않도록 주의하세요."},{"sub":"문제해결능력","q":"업무 계획을 세울 때 활용하는 5W2H에서 두 개의 H에 해당하는 것은?","o":["How와 How much","How와 However","How many와 How long","Who와 How"],"a":0,"e":"5W2H는 What, Why, Where, When, Who에 How(방법)와 How much(비용)를 더한 것입니다. 비용까지 함께 고려한다는 점이 특징입니다."},{"sub":"문제해결능력","q":"주장의 내용이 아니라 주장하는 사람의 인격이나 배경을 공격하는 논리적 오류는?","o":["인신공격의 오류","성급한 일반화의 오류","순환논증의 오류","흑백논리의 오류"],"a":0,"e":"인신공격은 논점을 사람으로 옮기는 오류입니다. 결론을 전제로 삼아 다시 결론을 증명하면 순환논증, 선택지를 둘로만 한정하면 흑백논리입니다."},{"sub":"문제해결능력","q":"'모든 A는 B이다'와 '어떤 B는 C이다'가 모두 참일 때 반드시 참인 것은?","o":["모든 A는 C이다","어떤 A는 C이다","어떤 A는 C가 아니다","반드시 참인 것은 없다"],"a":3,"e":"A는 B에 포함되지만 C와 겹치는 B의 부분이 A와 관련 있는지는 알 수 없습니다. 중간 개념이 부분으로만 연결되면 결론을 확정할 수 없습니다."},{"sub":"문제해결능력","q":"분석 결과에서 의미 있는 시사점을 이끌어내는 사고 기법으로, '그래서 무엇인가'를 반복해 묻는 방법은?","o":["So What 기법","5Why 기법","MECE","브레인스토밍"],"a":0,"e":"So What은 자료에서 결론을 끌어내는 기법이고, 5Why는 왜를 반복해 근본 원인을 찾는 기법입니다."},{"sub":"문제해결능력","q":"결론을 정점에 두고 그 아래에 근거를 계층적으로 배치해 논리를 구성하는 방법은?","o":["피라미드 구조","로직트리","간트차트","파레토 차트"],"a":0,"e":"피라미드 구조는 결론과 근거의 관계를 위아래로 정리해 설득력을 높입니다. 로직트리는 문제를 하위 항목으로 쪼개는 데 쓰입니다."},{"sub":"문제해결능력","q":"비판적 사고를 위해 필요한 태도로 보기 어려운 것은?","o":["지적 호기심을 갖는다","자신의 생각을 검토할 줄 안다","다른 관점을 고려한다","권위 있는 사람의 견해를 무조건 수용한다"],"a":3,"e":"비판적 사고는 근거를 따져 판단하는 것입니다. 권위에 기대어 그대로 받아들이는 것은 권위에 호소하는 오류에 가깝습니다."},{"sub":"문제해결능력","q":"문제 인식 단계의 절차로 옳은 것은?","o":["환경 분석 → 주요 과제 도출 → 과제 선정","과제 선정 → 환경 분석 → 주요 과제 도출","주요 과제 도출 → 과제 선정 → 환경 분석","환경 분석 → 과제 선정 → 주요 과제 도출"],"a":0,"e":"먼저 3C나 SWOT으로 환경을 분석하고, 거기서 과제를 뽑은 뒤 우선순위를 매겨 선정합니다."},{"sub":"문제해결능력","q":"갑, 을, 병, 정 네 명이 일렬로 서 있다. 갑은 맨 앞이 아니고, 을은 갑 바로 뒤에 있으며, 병은 맨 뒤에 있다. 맨 앞에 선 사람은?","o":["갑","을","병","정"],"a":3,"e":"병이 4번이고 갑과 을이 붙어 있으므로 갑과 을은 2·3번입니다. 갑이 맨 앞이 아니라는 조건과도 맞으므로 남은 1번은 정입니다."},{"sub":"문제해결능력","q":"서로 관련이 없어 보이는 두 대상을 억지로 연결해 새로운 아이디어를 얻는 창의적 사고 기법은?","o":["강제결합법","체크리스트법","브레인라이팅","델파이법"],"a":0,"e":"강제결합법은 무관한 요소를 결합해 발상의 틀을 깨는 기법입니다. 체크리스트법은 정해진 질문 목록으로 아이디어를 확장합니다."},{"sub":"문제해결능력","q":"'회의에 참석하면 자료를 준비한다'가 참일 때, 자료를 준비하지 않은 사람에 대해 반드시 참인 것은?","o":["회의에 참석했다","회의에 참석하지 않았다","자료를 준비할 예정이다","알 수 없다"],"a":1,"e":"원명제가 참이면 대우도 참입니다. '자료를 준비하지 않으면 회의에 참석하지 않았다'가 대우이므로 반드시 참입니다."},{"sub":"자원관리능력","q":"물품을 보관할 때 같은 품종은 같은 장소에 보관하는 원칙은?","o":["동일성의 원칙","유사성의 원칙","회전대응 보관 원칙","중량특성의 원칙"],"a":0,"e":"동일성의 원칙은 같은 품종을 같은 곳에, 유사성의 원칙은 비슷한 품목을 가까운 곳에 두는 것입니다. 둘 다 물품을 빨리 찾기 위한 원칙입니다."},{"sub":"자원관리능력","q":"입출고 빈도가 높은 물품을 출입구 가까운 곳에 보관하는 원칙은?","o":["동일성의 원칙","유사성의 원칙","회전대응 보관 원칙","네트워크 보관 원칙"],"a":2,"e":"회전대응 보관 원칙은 자주 쓰는 물품일수록 접근이 쉬운 자리에 두어 이동 시간을 줄이는 것입니다."},{"sub":"자원관리능력","q":"바코드와 비교한 RFID의 특징으로 옳은 것은?","o":["반드시 직접 인식시켜야 한다","여러 개를 동시에 비접촉으로 인식할 수 있다","정보를 수정할 수 없다","가격이 더 저렴하다"],"a":1,"e":"RFID는 전파를 이용해 여러 태그를 동시에 비접촉으로 읽고 정보 수정도 가능합니다. 대신 바코드보다 비용이 높습니다."},{"sub":"자원관리능력","q":"자원 낭비의 원인으로 보기 어려운 것은?","o":["비계획적 행동","편리성만 추구하는 태도","자원에 대한 인식 부재","명확한 목표 설정"],"a":3,"e":"자원 낭비의 대표적 원인은 비계획적 행동, 편리성 추구, 자원에 대한 인식 부재, 노하우 부족입니다. 목표를 명확히 하는 것은 오히려 낭비를 줄입니다."},{"sub":"자원관리능력","q":"시간계획을 세울 때 총 가용시간의 일정 비율만 계획하고 나머지는 예비로 남겨두는 원칙은?","o":["60 대 40 규칙","80 대 20 규칙","50 대 50 규칙","70 대 30 규칙"],"a":0,"e":"계획된 행동에 60%를 배정하고 계획 외 행동과 자발적 행동에 각각 20%씩 남겨둡니다. 돌발 상황을 흡수하기 위한 여유입니다."},{"sub":"자원관리능력","q":"시급 12,000원인 아르바이트생 4명이 하루 6시간씩 5일간 근무했을 때 총 인건비는?","o":["1,440,000원","1,584,000원","1,728,000원","1,800,000원"],"a":0,"e":"12,000 × 4 × 6 × 5 = 1,440,000원입니다. 시급 문제는 인원, 시간, 일수를 빠짐없이 곱했는지 확인해야 합니다."},{"sub":"자원관리능력","q":"4명이 2박 3일 워크숍에 참석한다. 1인 1박 숙박비 6만원, 1인 1일 식비 4만원일 때 총비용은?","o":["84만원","96만원","108만원","120만원"],"a":1,"e":"숙박비는 4 × 2 × 6만 = 48만원, 식비는 4 × 3 × 4만 = 48만원으로 합계 96만원입니다. 박과 일의 수가 다르다는 점이 함정입니다."},{"sub":"자원관리능력","q":"인맥관리에서 핵심인맥과 파생인맥의 구분으로 옳은 것은?","o":["핵심인맥은 직접 알고 지내는 사람, 파생인맥은 그를 통해 알게 된 사람","핵심인맥은 회사 밖 사람만 가리킨다","파생인맥은 관리할 필요가 없다","둘은 같은 개념이다"],"a":0,"e":"핵심인맥은 자신이 직접 관계를 맺은 사람이고, 파생인맥은 그 사람을 통해 연결된 사람입니다. 파생인맥까지 관리하면 인적자원의 폭이 넓어집니다."},{"sub":"자원관리능력","q":"예산관리에서 가장 바람직한 상태로 옳은 것은?","o":["책정 비용이 실제 비용보다 훨씬 큰 상태","실제 비용이 책정 비용보다 훨씬 큰 상태","책정 비용과 실제 비용이 비슷한 상태","예산을 전혀 책정하지 않는 상태"],"a":2,"e":"책정 비용이 과도하면 자원이 묶여 경쟁력이 떨어지고, 부족하면 적자가 납니다. 두 값이 근접할 때 이상적인 예산관리가 됩니다."},{"sub":"자원관리능력","q":"물적자원을 효과적으로 관리하기 위한 첫 단계로 옳은 것은?","o":["사용 물품과 보관 물품을 구분한다","물품을 모두 폐기한다","보관 장소를 무작위로 정한다","물품 목록 작성을 생략한다"],"a":0,"e":"먼저 지금 쓸 물품과 보관할 물품을 구분한 뒤, 동일성과 유사성 기준으로 분류하고 특성에 맞는 장소에 보관합니다."},{"sub":"조직이해능력","q":"매트릭스 조직의 특징으로 옳은 것은?","o":["명령일원화 원칙이 철저히 지켜진다","기능별 조직과 프로젝트 조직을 결합한 형태이다","의사결정이 항상 신속하다","환경이 단순할 때 적합하다"],"a":1,"e":"매트릭스 조직은 기능과 프로젝트 두 축을 결합해 인력을 유연하게 쓰지만, 두 계통의 지시를 받아 명령일원화가 깨지고 갈등이 생기기 쉽습니다."},{"sub":"조직이해능력","q":"사업부제 조직의 단점으로 옳은 것은?","o":["환경 변화에 대응하기 어렵다","사업부 간 기능이 중복되어 자원이 낭비될 수 있다","책임 소재가 불분명하다","제품별 전문화가 어렵다"],"a":1,"e":"사업부제는 제품이나 지역별로 독립성이 높아 책임이 명확하고 대응이 빠릅니다. 다만 인사나 회계 같은 기능이 사업부마다 중복됩니다."},{"sub":"조직이해능력","q":"SWOT 분석에서 약점을 최소화하면서 위협을 회피하는 전략은?","o":["SO 전략","ST 전략","WO 전략","WT 전략"],"a":3,"e":"WT 전략은 방어적 성격으로 사업 축소나 철수 같은 선택이 여기 해당합니다. 강점으로 위협에 맞서면 ST 전략입니다."},{"sub":"조직이해능력","q":"비공식조직의 순기능으로 옳은 것은?","o":["구성원의 심리적 안정과 정보 공유에 기여한다","공식 목표 달성을 항상 방해한다","조직도에 명시되어 관리가 쉽다","반드시 해체해야 한다"],"a":0,"e":"비공식조직은 친목과 정보 교류를 통해 소속감을 높이고 소통을 원활히 합니다. 다만 파벌화되면 공식 목표를 저해할 수 있습니다."},{"sub":"조직이해능력","q":"국제 비즈니스에서 악수를 할 때의 매너로 옳은 것은?","o":["상대의 눈을 보며 오른손으로 적당한 힘을 주어 잡는다","고개를 숙이고 두 손으로 잡는다","손끝만 살짝 잡는다","왼손으로 잡는다"],"a":0,"e":"서양식 악수는 눈을 마주치고 오른손으로 자신 있게 잡는 것이 기본입니다. 고개를 숙이거나 손끝만 잡는 것은 자신감이 없어 보입니다."},{"sub":"조직이해능력","q":"서울이 오후 3시일 때 런던의 시각은? (서울 UTC+9, 런던 UTC+0, 서머타임 미적용)","o":["오전 6시","오전 9시","오후 6시","자정"],"a":0,"e":"서울이 런던보다 9시간 빠르므로 15시에서 9시간을 빼면 오전 6시입니다. 서머타임이 적용되면 런던이 UTC+1이 되어 오전 7시가 됩니다."},{"sub":"조직이해능력","q":"근로자가 주식을 보유하여 기업의 소유에 참여하는 경영참가 유형은?","o":["경영참가","이윤참가","자본참가","단체교섭"],"a":2,"e":"자본참가는 우리사주제처럼 근로자가 주식을 보유해 소유에 참여하는 방식입니다. 의사결정 참여는 경영참가, 성과 배분은 이윤참가입니다."},{"sub":"조직이해능력","q":"업무수행 성과를 높이는 방법으로 보기 어려운 것은?","o":["비슷한 업무를 묶어서 처리한다","일의 우선순위를 정한다","모든 업무를 혼자 처리하려 한다","회사와 팀의 규칙을 파악한다"],"a":2,"e":"혼자 떠안으면 병목이 생기고 전체 성과가 떨어집니다. 위임과 협업을 활용하는 것이 성과 향상의 기본입니다."}]},{"id":"tuja-unyongsa","name":"투자자산운용사","exam":"2026-11-08","note":"제47회 · 100문항 120분 · 전체 70점 이상, 과목별 40% 이상","questions":[{"sub":"세제","q":"현행 소득세법의 과세방식으로 옳은 것은?","o":["모든 소득에 과세하는 포괄주의를 원칙으로 한다","법에 열거된 소득만 과세하는 열거주의를 원칙으로 한다","소득 종류와 무관하게 단일세율을 적용한다","거주자와 비거주자를 구분하지 않는다"],"a":1,"e":"세금을 매기는 방식에는 두 가지 태도가 있습니다. 하나는 '돈이 들어왔으면 일단 다 세금 대상'이라고 보는 방식이고, 다른 하나는 '법에 적어둔 것만 세금 대상'이라고 보는 방식입니다. 우리 소득세법은 뒤쪽입니다. 법전에 이자소득, 배당소득, 사업소득, 근로소득, 연금소득, 기타소득, 양도소득, 퇴직소득이라고 목록을 적어두고 그 목록에 없으면 원칙적으로 세금을 매기지 않습니다.\n다만 이자와 배당은 예외입니다. 금융상품이 워낙 빠르게 새로 생겨서 목록을 아무리 적어도 따라가지 못하기 때문에, 이 둘은 '목록에 없어도 성격이 비슷하면 과세한다'는 방식을 씁니다. 이걸 유형별 포괄주의라고 부릅니다.\n\n▸ 열거주의: 법에 하나하나 적어둔 것만 세금을 매기는 방식.\n▸ 포괄주의: 적어두지 않았어도 소득이면 다 세금을 매기는 방식.\n▸ 거주자: 국내에 주소를 두거나 183일 이상 산 사람. 전 세계에서 번 소득 전부에 세금을 냅니다."},{"sub":"세제","q":"거주자의 금융소득이 종합과세 대상이 되는 기준금액은?","o":["1천만원 초과","2천만원 초과","3천만원 초과","5천만원 초과"],"a":1,"e":"은행 이자나 주식 배당으로 번 돈을 금융소득이라고 합니다. 이 돈이 1년에 2천만원 이하면 은행이나 증권사가 알아서 14%를 떼고 끝냅니다. 세금 신고를 따로 할 필요가 없습니다. 이걸 분리과세라고 합니다.\n그런데 2천만원을 넘으면 이야기가 달라집니다. 넘는 부분을 월급이나 사업소득 같은 다른 소득과 합쳐서 세금을 다시 계산합니다. 우리나라 소득세는 많이 벌수록 세율이 올라가는 구조라서, 합쳐지면 세율이 14%보다 훨씬 높아질 수 있습니다. 부자일수록 세금을 더 내게 하려는 장치입니다.\n\n▸ 분리과세: 다른 소득과 합치지 않고 그것만 따로 떼어 세금을 끝내는 것.\n▸ 종합과세: 여러 소득을 다 합쳐서 한 번에 세금을 계산하는 것.\n▸ 누진세율: 소득이 많아질수록 세율이 단계적으로 올라가는 구조."},{"sub":"세제","q":"거주자의 이자소득과 배당소득에 대한 원천징수세율은? (지방소득세 제외)","o":["6%","14%","20%","25%"],"a":1,"e":"원천징수란 돈을 주는 쪽이 세금을 미리 떼고 나머지만 건네주는 방식입니다. 예금 이자 100만원이 생기면 은행이 14만원을 떼고 86만원만 통장에 넣어줍니다. 개인이 일일이 신고하러 다니지 않아도 되니 편하고, 국가 입장에서는 세금을 놓칠 일이 없습니다.\n실제로는 여기에 지방소득세가 붙습니다. 지방소득세는 소득세의 10%라서 14%의 10%인 1.4%가 추가되고, 합치면 15.4%가 됩니다. 통장에 찍히는 숫자가 15.4%인 이유입니다.\n\n▸ 원천징수: 돈을 지급하는 사람이 세금을 미리 떼어 대신 내주는 제도.\n▸ 지방소득세: 소득세의 10%만큼 지방자치단체에 내는 세금."},{"sub":"세제","q":"국세와 지방세의 구분으로 옳은 것은?","o":["취득세는 국세이다","법인세는 지방세이다","상속세와 증여세는 국세이다","재산세는 국세이다"],"a":2,"e":"세금은 누가 걷어서 누가 쓰느냐로 나뉩니다. 나라가 걷으면 국세, 시청이나 도청이 걷으면 지방세입니다.\n국세에는 소득세, 법인세, 부가가치세, 상속세, 증여세, 종합부동산세가 있습니다. 지방세에는 취득세, 재산세, 자동차세, 주민세가 있습니다. 구분하는 요령이 하나 있는데, 부동산을 '살 때'와 '갖고 있을 때' 내는 세금은 지방세이고 '팔아서 이익이 났을 때' 내는 양도소득세는 국세입니다.\n\n▸ 국세: 중앙정부가 걷는 세금.\n▸ 지방세: 지방자치단체가 걷는 세금.\n▸ 취득세: 부동산이나 자동차를 살 때 한 번 내는 세금.\n▸ 재산세: 부동산을 보유하고 있는 동안 매년 내는 세금."},{"sub":"세제","q":"납세의무의 성립시기에 관한 설명으로 옳은 것은?","o":["소득세는 과세기간이 끝나는 때 성립한다","소득세는 소득이 발생하는 즉시 성립한다","부가가치세는 매년 12월 31일에 성립한다","취득세는 재산을 보유하는 동안 매일 성립한다"],"a":0,"e":"세금을 내야 할 의무가 '언제 생기느냐'를 정해두는 이유는, 그 시점을 기준으로 세법을 적용하고 소멸시효를 계산하기 때문입니다.\n소득세는 1년치를 모아서 계산하는 세금입니다. 1월에 번 돈이든 12월에 번 돈이든 그해 12월 31일에 한꺼번에 정산하므로, 납세의무도 과세기간이 끝나는 12월 31일에 생깁니다. 취득세는 재산을 취득하는 순간, 원천징수하는 세금은 소득을 지급하는 때 생깁니다.\n\n▸ 납세의무의 성립: 세금을 내야 할 의무가 법적으로 생기는 시점.\n▸ 과세기간: 세금을 계산하는 기간의 단위. 소득세는 1월 1일부터 12월 31일까지입니다.\n▸ 소멸시효: 일정 기간이 지나면 권리가 사라지는 것. 국세는 보통 5년입니다."},{"sub":"세제","q":"상장주식을 장내에서 매도할 때 소액주주인 개인에게 일반적으로 적용되는 세금은?","o":["양도소득세만 과세된다","증권거래세가 과세된다","부가가치세가 과세된다","아무 세금도 없다"],"a":1,"e":"주식을 팔면 두 가지 세금을 생각해야 합니다. 하나는 이익에 매기는 양도소득세, 다른 하나는 거래 자체에 매기는 증권거래세입니다.\n일반 개인이 상장주식을 증권거래소에서 팔 때는 이익이 났든 손해가 났든 판 금액에 대해 증권거래세를 냅니다. 반면 양도소득세는 지분을 많이 가진 대주주에게만 매깁니다. 소액주주는 상장주식을 장내에서 팔아 이익이 나도 양도소득세를 내지 않습니다.\n\n▸ 양도소득세: 재산을 팔아 이익이 났을 때 그 이익에 매기는 세금.\n▸ 증권거래세: 주식을 팔 때 이익 여부와 무관하게 매도금액에 매기는 세금.\n▸ 소액주주: 지분율이나 보유금액이 세법 기준에 못 미치는 일반 투자자.\n▸ 장내: 증권거래소를 통한 거래. 개인끼리 직접 사고파는 것은 장외입니다."},{"sub":"세제","q":"집합투자기구(펀드)에서 발생한 이익에 대한 소득 구분으로 옳은 것은?","o":["사업소득","배당소득","양도소득","기타소득"],"a":1,"e":"펀드에 돈을 넣어 수익이 나면 그 돈을 무슨 소득으로 볼지가 문제입니다. 펀드는 여러 사람의 돈을 모아 굴리는 회사 비슷한 구조이고, 투자자는 그 성과를 나눠 받는 사람입니다. 주주가 회사에서 배당을 받는 것과 성격이 비슷하다고 보아 배당소득으로 분류합니다.\n따라서 펀드 수익은 이자와 함께 금융소득에 들어가고, 연간 2천만원을 넘으면 종합과세 대상이 됩니다.\n\n▸ 집합투자기구: 여러 투자자의 돈을 모아 전문가가 대신 운용하는 기구. 흔히 말하는 펀드입니다.\n▸ 배당소득: 회사나 펀드가 벌어들인 이익을 지분에 따라 나눠 받는 소득."},{"sub":"세제","q":"국세부과의 원칙에 해당하지 않는 것은?","o":["실질과세의 원칙","신의성실의 원칙","근거과세의 원칙","납세자 편의의 원칙"],"a":3,"e":"국가가 세금을 매길 때 지켜야 하는 기본 원칙들이 있습니다.\n실질과세는 서류상 이름이 아니라 실제로 누가 돈을 벌었는지를 보고 세금을 매긴다는 뜻입니다. 명의를 빌려 세금을 피하는 것을 막기 위한 원칙입니다. 근거과세는 장부 같은 증거에 근거해 세금을 계산하라는 것이고, 신의성실은 세무공무원과 납세자 모두 신의에 따라 성실하게 행동하라는 것입니다. 여기에 세무공무원의 재량은 한계가 있다는 원칙이 더해집니다. '납세자 편의의 원칙'이라는 것은 없습니다.\n\n▸ 실질과세: 형식보다 실질을 기준으로 세금을 매기는 것.\n▸ 근거과세: 장부와 증빙에 근거해 과세하는 것.\n▸ 재량: 공무원이 스스로 판단해 결정할 수 있는 여지."},{"sub":"세제","q":"증여세의 납세의무자는 원칙적으로 누구인가?","o":["증여자","수증자","증여자와 수증자 공동","국가"],"a":1,"e":"증여는 대가 없이 재산을 주는 것입니다. 아버지가 아들에게 아파트를 그냥 주면 아들은 공짜로 재산이 늘어난 셈이니, 그 늘어난 만큼 세금을 냅니다. 즉 받은 사람이 냅니다.\n상속세도 마찬가지로 재산을 물려받은 상속인이 냅니다. 다만 상속세는 사망한 사람의 전체 재산을 기준으로 계산하고, 증여세는 받은 사람별로 계산한다는 차이가 있습니다.\n\n▸ 증여자: 재산을 주는 사람.\n▸ 수증자: 재산을 받는 사람. 증여세를 내는 당사자입니다.\n▸ 상속: 사람이 사망해 재산이 넘어가는 것. 살아 있을 때 주면 증여입니다."},{"sub":"세제","q":"연금계좌(연금저축, IRP)에서 연금 형태로 수령할 때의 세제 혜택으로 옳은 것은?","o":["전액 비과세된다","낮은 세율의 연금소득세가 적용된다","일반 소득세율이 그대로 적용된다","증권거래세가 부과된다"],"a":1,"e":"국가는 국민이 노후 자금을 스스로 준비하도록 유도하려고 세금으로 당근을 줍니다. 연금계좌에 넣을 때는 세액공제를 해주고, 나중에 연금으로 나눠 받을 때는 일반 세율보다 낮은 연금소득세만 매깁니다.\n다만 조건이 있습니다. 만 55세 이후에 연금 형태로 나눠 받아야 하고, 중간에 목돈으로 빼면 혜택을 도로 토해내야 합니다. 이때는 기타소득세가 붙어 오히려 손해가 됩니다.\n\n▸ IRP: 개인형 퇴직연금. 퇴직금이나 여유자금을 넣어 굴리는 노후 계좌입니다.\n▸ 세액공제: 계산된 세금에서 일정액을 직접 빼주는 것. 소득에서 빼주는 소득공제보다 체감 혜택이 큽니다.\n▸ 중도인출: 연금 개시 전에 돈을 빼는 것."},{"sub":"세제","q":"비과세 종합저축에 관한 설명으로 옳은 것은?","o":["누구나 가입할 수 있다","고령자, 장애인 등 특정 요건을 갖춘 자만 가입할 수 있다","가입 한도가 없다","이자소득에 14%가 과세된다"],"a":1,"e":"비과세 종합저축은 이자와 배당에 세금을 아예 매기지 않는 통장입니다. 혜택이 크기 때문에 아무나 만들 수 없고, 만 65세 이상 고령자나 장애인, 국가유공자 등 사회적 배려가 필요한 사람에게만 열어둡니다. 가입 한도도 정해져 있습니다.\n\n▸ 비과세: 세금을 아예 매기지 않는 것.\n▸ 감면: 세금을 매기되 일부를 깎아주는 것. 비과세와 구분해야 합니다."},{"sub":"세제","q":"금융소득 종합과세 시 이중과세를 조정하기 위해 배당소득에 적용하는 제도는?","o":["배당세액공제","외국납부세액공제","근로소득세액공제","기장세액공제"],"a":0,"e":"회사가 이익을 내면 먼저 법인세를 냅니다. 그러고 남은 돈을 주주에게 배당하면 주주가 또 배당소득세를 냅니다. 같은 돈에 세금이 두 번 붙는 셈입니다. 이걸 이중과세라고 합니다.\n이 문제를 덜어주려고 배당소득을 종합과세할 때 회사가 이미 낸 법인세 일부를 주주의 세금에서 빼줍니다. 이것이 배당세액공제입니다.\n\n▸ 이중과세: 같은 소득에 세금이 두 번 매겨지는 것.\n▸ 법인세: 회사가 번 이익에 매기는 세금.\n▸ 세액공제: 계산된 세금에서 직접 빼주는 것."},{"sub":"금융상품","q":"예금자보호법에 따른 보호 대상 금융상품이 아닌 것은?","o":["은행의 정기예금","은행의 보통예금","집합투자증권(펀드)","원금이 보전되는 금전신탁"],"a":2,"e":"예금자보호는 은행이 망했을 때 나라가 대신 일정 금액까지 돌려주는 제도입니다. 다만 모든 상품이 대상은 아닙니다.\n기준은 '원금을 돌려주기로 약속한 상품이냐'입니다. 예금은 은행이 원금과 이자를 주기로 약속한 것이니 보호됩니다. 반면 펀드는 운용 결과에 따라 손익이 투자자에게 그대로 돌아가는 상품입니다. 애초에 원금 약속이 없으니 보호 대상이 아닙니다. 주식, 채권, CD, RP도 같은 이유로 제외됩니다.\n\n▸ 실적배당상품: 운용 성과에 따라 수익이 달라지는 상품. 원금 보장이 없습니다.\n▸ CD(양도성예금증서): 남에게 팔 수 있는 정기예금 증서.\n▸ RP(환매조건부채권): 일정 기간 뒤 되사주기로 약속하고 파는 채권."},{"sub":"금융상품","q":"MMF에 관한 설명으로 옳은 것은?","o":["원금과 이자가 보장되는 확정금리 상품이다","단기금융상품에 투자하는 집합투자기구로 원금이 보장되지 않는다","주식 편입비율이 60% 이상인 상품이다","가입 후 1년간 해지할 수 없다"],"a":1,"e":"MMF는 잠깐 맡겨둘 돈을 넣는 펀드입니다. 만기가 짧은 국공채나 기업어음 같은 안전한 상품에만 투자해서 가격이 거의 흔들리지 않고, 하루만 맡겨도 이자가 붙습니다.\n다만 이름에 펀드가 들어가는 데서 알 수 있듯 실적배당상품입니다. 안전해 보여도 원금 보장은 없고 예금자보호도 되지 않습니다. 안전한 것과 보장되는 것은 다릅니다.\n\n▸ MMF: Money Market Fund. 단기 자금시장에 투자하는 펀드.\n▸ 기업어음(CP): 기업이 단기로 돈을 빌리려고 발행하는 증서.\n▸ 편입비율: 펀드 재산 중 특정 자산이 차지하는 비중."},{"sub":"금융상품","q":"사채권자가 미리 정한 조건으로 발행회사의 주식으로 바꿀 수 있는 권리가 붙은 사채는?","o":["전환사채(CB)","신주인수권부사채(BW)","교환사채(EB)","이익참가부사채(PB)"],"a":0,"e":"회사가 돈을 빌리는 방법 중 하나가 사채입니다. 그냥 빌리면 이자만 받고 끝이지만, 여기에 옵션을 붙여 투자자를 끌어들이는 상품들이 있습니다.\n전환사채는 '나중에 주가가 오르면 이 빚을 주식으로 바꿔 가져도 된다'는 권리가 붙은 것입니다. 주식으로 바꾸면 빚은 사라집니다. 신주인수권부사채는 '주식을 살 수 있는 쿠폰'이 붙은 것이라 쿠폰을 써도 빚은 그대로 남습니다. 교환사채는 발행한 회사가 갖고 있던 다른 회사 주식으로 바꿔주는 것입니다.\n\n▸ 사채: 회사가 발행하는 차용증. 만기에 원금을 갚고 그동안 이자를 줍니다.\n▸ 전환: 하나가 다른 것으로 바뀌면서 원래 것은 사라지는 것.\n▸ 신주: 회사가 새로 발행하는 주식."},{"sub":"금융상품","q":"ELS(주가연계증권)에 관한 설명으로 옳은 것은?","o":["예금자보호 대상이다","기초자산의 가격 움직임에 따라 수익이 결정되는 파생결합증권이다","원금이 항상 보장된다","만기가 없다"],"a":1,"e":"ELS는 특정 주식이나 주가지수의 움직임에 따라 수익이 정해지는 상품입니다. 예를 들어 '3년 안에 코스피가 처음보다 50% 아래로 떨어지지 않으면 매년 6%를 준다'는 식의 조건이 붙습니다.\n조건만 지켜지면 예금보다 높은 수익을 주지만, 조건이 깨지면 원금 손실이 크게 납니다. 발행한 증권사가 망해도 보호받지 못합니다. 겉보기에 안정적으로 보이지만 위험이 뒤쪽에 몰려 있는 구조라 설명의무가 특히 강조되는 상품입니다.\n\n▸ 기초자산: 상품의 수익을 결정하는 기준이 되는 대상. 주식, 지수, 환율, 원자재 등.\n▸ 파생결합증권: 기초자산의 가격에 연동해 수익이 정해지는 증권.\n▸ 녹인(Knock-In): 기초자산이 정해진 하한선 아래로 떨어져 손실 조건이 켜지는 것."},{"sub":"금융상품","q":"ETF에 관한 설명으로 옳은 것은?","o":["증권시장에 상장되어 주식처럼 사고팔 수 있는 펀드이다","환매에 반드시 3영업일이 걸린다","반드시 액티브 운용된다","개별 종목만 담을 수 있다"],"a":0,"e":"일반 펀드는 사고팔 때 신청하고 며칠을 기다려야 합니다. ETF는 그 불편을 없앤 상품으로, 펀드를 주식처럼 거래소에 상장시켜 장중에 아무 때나 사고팔 수 있게 만들었습니다.\n대개 코스피200 같은 지수를 그대로 따라가도록 설계되어 운용보수가 낮습니다. 한 주만 사도 그 지수에 포함된 수백 개 종목에 나눠 투자한 효과가 생겨 분산투자 수단으로 널리 쓰입니다.\n\n▸ ETF: Exchange Traded Fund. 상장지수펀드.\n▸ 상장: 거래소에서 사고팔 수 있도록 등록하는 것.\n▸ 환매: 펀드에 넣은 돈을 되돌려 받는 것.\n▸ 운용보수: 자산을 굴려주는 대가로 떼는 수수료."},{"sub":"금융상품","q":"주식과 채권의 차이에 관한 설명으로 옳은 것은?","o":["주식은 빚이고 채권은 지분이다","주식은 지분이고 채권은 빚이다","둘 다 만기가 정해져 있다","채권 보유자는 주주총회에서 의결권을 행사한다"],"a":1,"e":"회사가 돈을 구하는 방법은 크게 두 가지입니다. 하나는 동업자를 들이는 것이고, 다른 하나는 빌리는 것입니다.\n주식을 사면 회사의 주인이 됩니다. 회사가 잘되면 배당과 주가 상승으로 이익을 보지만 망하면 돈을 거의 못 건집니다. 채권을 사면 채권자가 됩니다. 회사가 아무리 잘돼도 약속한 이자만 받지만, 망했을 때는 주주보다 먼저 돈을 받습니다. 위험이 큰 쪽이 기대수익도 큰 구조입니다.\n\n▸ 지분: 회사에 대한 소유권의 몫.\n▸ 의결권: 주주총회에서 안건에 찬반을 표시할 권리. 채권자에게는 없습니다.\n▸ 변제 순위: 회사가 망했을 때 돈을 받아가는 순서. 채권자가 주주보다 앞섭니다."},{"sub":"금융상품","q":"확정급여형(DB) 퇴직연금에 관한 설명으로 옳은 것은?","o":["근로자가 직접 운용하고 결과를 책임진다","근로자가 받을 퇴직급여가 미리 정해져 있고 운용 책임은 회사에 있다","퇴직급여가 운용성과에 따라 달라진다","회사가 적립할 의무가 없다"],"a":1,"e":"퇴직연금에는 두 종류가 있습니다.\nDB형은 '퇴직할 때 얼마를 준다'가 미리 정해져 있습니다. 회사가 돈을 굴리다가 손해를 봐도 약속한 금액은 줘야 하므로 위험은 회사가 집니다. DC형은 회사가 매년 정해진 금액을 근로자 계좌에 넣어주고, 그다음부터는 근로자가 직접 굴립니다. 잘 굴리면 더 받고 못 굴리면 덜 받으므로 위험은 근로자가 집니다.\n\n▸ DB: Defined Benefit. 받을 금액이 확정된 형태.\n▸ DC: Defined Contribution. 회사가 넣어주는 금액이 확정된 형태.\n▸ 적립: 미래에 줄 돈을 미리 쌓아두는 것."},{"sub":"금융상품","q":"다음 중 실적배당형 상품에 해당하는 것은?","o":["정기예금","정기적금","수익증권","표지어음"],"a":2,"e":"금융상품은 크게 두 부류입니다. 처음부터 이자율이 정해진 확정금리형과 굴린 결과에 따라 수익이 달라지는 실적배당형입니다.\n예금과 적금은 은행이 이자율을 약속하니 확정금리형입니다. 수익증권은 펀드에 투자했다는 증서라서 운용 성과에 따라 수익이 달라지는 실적배당형입니다. 실적배당형은 원금 손실이 날 수 있고 예금자보호도 되지 않습니다.\n\n▸ 수익증권: 펀드에 투자한 몫을 표시한 증서.\n▸ 표지어음: 금융기관이 보유한 어음을 묶어 다시 발행한 단기 확정금리 상품.\n▸ 확정금리형: 가입할 때 받을 이자가 정해지는 상품."},{"sub":"금융상품","q":"채권의 신용등급에서 투자등급과 투기등급을 나누는 경계는?","o":["AAA와 AA 사이","A와 BBB 사이","BBB와 BB 사이","B와 CCC 사이"],"a":2,"e":"신용평가사는 '이 회사가 빌린 돈을 제때 갚을 수 있을까'를 판단해 등급을 매깁니다. AAA가 가장 안전하고 D로 갈수록 위험합니다.\n실무에서 중요한 선은 BBB와 BB 사이입니다. BBB까지는 투자등급이라 연기금이나 보험사 같은 기관이 살 수 있지만, BB부터는 투기등급이라 살 수 없는 곳이 많습니다. 그래서 BBB에서 BB로 한 칸 떨어지면 금리가 급격히 뛰고 자금 조달이 어려워집니다.\n\n▸ 신용등급: 돈을 갚을 능력을 평가해 매긴 등급.\n▸ 투기등급: 원리금 상환이 불확실한 등급. 하이일드 또는 정크본드라고도 합니다.\n▸ 연기금: 국민연금처럼 장기 자금을 운용하는 기관."},{"sub":"금융상품","q":"환매조건부채권(RP)에 관한 설명으로 옳은 것은?","o":["일정 기간 후 정해진 가격으로 되사주기로 약속하고 파는 채권이다","만기가 반드시 10년 이상이다","주식으로 전환할 수 있다","예금자보호 대상이다"],"a":0,"e":"RP는 형식은 채권 매매지만 실질은 담보를 잡힌 단기 대출입니다. 금융기관이 채권을 잠시 넘기고 돈을 받은 뒤, 며칠이나 몇 달 후 약속한 가격에 되사갑니다. 돈을 맡긴 쪽은 그 차액을 이자처럼 받습니다.\n채권을 담보로 잡고 있어 비교적 안전하지만 예금이 아니므로 예금자보호 대상은 아닙니다.\n\n▸ 환매: 팔았던 것을 다시 사들이는 것.\n▸ 담보: 돈을 못 갚을 경우를 대비해 잡아두는 재산."},{"sub":"금융상품","q":"CMA에 관한 설명으로 옳은 것은?","o":["증권사 등에서 취급하며 수시 입출금이 가능하고 하루만 맡겨도 수익이 발생한다","가입 후 1년간 출금이 불가능하다","반드시 주식에 투자한다","모든 CMA가 예금자보호 대상이다"],"a":0,"e":"CMA는 증권사에서 만드는 수시 입출금 통장입니다. 은행 보통예금은 하루 맡겨도 이자가 거의 없지만, CMA는 맡긴 돈을 단기 채권 등에 굴려 하루 단위로 수익을 붙여줍니다. 월급 통장으로 쓰는 사람이 많은 이유입니다.\n다만 종류에 따라 다릅니다. 종금형 CMA는 예금자보호가 되지만 RP형이나 MMF형은 보호되지 않습니다.\n\n▸ CMA: Cash Management Account. 종합자산관리계좌.\n▸ 수시 입출금: 만기와 관계없이 아무 때나 넣고 뺄 수 있는 것.\n▸ 종금형: 종합금융회사가 취급하는 형태."},{"sub":"금융상품","q":"보험상품에서 순보험료와 부가보험료의 구분으로 옳은 것은?","o":["순보험료는 보험금 지급 재원이고 부가보험료는 사업비 재원이다","순보험료는 사업비 재원이고 부가보험료는 보험금 재원이다","둘 다 보험금 지급에만 쓰인다","둘 다 사업비로만 쓰인다"],"a":0,"e":"우리가 내는 보험료는 두 덩어리로 쪼개집니다. 하나는 나중에 사고가 났을 때 보험금으로 나갈 돈이고, 다른 하나는 보험사가 설계사에게 주는 수당이나 사무실 운영비로 쓰는 돈입니다. 앞쪽이 순보험료, 뒤쪽이 부가보험료입니다.\n같은 보장이라도 부가보험료가 크면 보험료가 비싸집니다. 온라인 전용 보험이 싼 이유가 여기에 있습니다.\n\n▸ 사업비: 보험사가 영업과 관리에 쓰는 비용.\n▸ 예정이율: 보험사가 받은 보험료를 굴려 얻을 것으로 가정한 수익률. 높을수록 보험료가 싸집니다."},{"sub":"금융상품","q":"부동산투자회사(REITs)에 관한 설명으로 옳은 것은?","o":["투자자로부터 자금을 모아 부동산에 투자하고 수익을 배당하는 회사이다","반드시 개인만 투자할 수 있다","부동산을 직접 사야만 투자할 수 있다","배당을 하지 않는다"],"a":0,"e":"빌딩 한 채를 사려면 수백억이 듭니다. 개인이 혼자 하기는 어렵습니다. 리츠는 여러 사람의 돈을 모아 회사를 만들고 그 회사가 빌딩을 사서 임대료를 받은 뒤, 투자자에게 배당으로 나눠주는 구조입니다.\n상장된 리츠는 주식처럼 사고팔 수 있어 소액으로도 부동산에 투자할 수 있고 현금화도 쉽습니다. 이익의 대부분을 배당해야 하는 의무가 있어 배당수익률이 높은 편입니다.\n\n▸ REITs: Real Estate Investment Trusts. 부동산투자회사.\n▸ 배당수익률: 주가 대비 배당금의 비율.\n▸ 유동성: 필요할 때 손해 없이 현금으로 바꿀 수 있는 정도."},{"sub":"금융상품","q":"단기금융상품에 해당하지 않는 것은?","o":["CD","CP","RP","30년 만기 국고채"],"a":3,"e":"단기금융상품은 만기가 보통 1년 이내인 상품을 말합니다. 잠깐 남는 돈을 굴리는 데 쓰이며 가격 변동이 작습니다.\nCD, CP, RP, 콜, MMF가 여기에 속합니다. 반면 30년 만기 국고채는 대표적인 장기채권으로, 금리가 조금만 움직여도 가격이 크게 흔들립니다.\n\n▸ 만기: 돈을 돌려받기로 정해진 시점.\n▸ 콜: 금융기관끼리 하루 이틀 단위로 돈을 빌려주는 초단기 거래.\n▸ 국고채: 정부가 발행하는 채권. 국내에서 가장 안전한 채권으로 취급됩니다."},{"sub":"금융상품","q":"개방형 펀드와 폐쇄형 펀드의 차이로 옳은 것은?","o":["개방형은 언제든 환매가 가능하고 폐쇄형은 만기 전 환매가 제한된다","개방형은 환매가 불가능하다","폐쇄형은 언제든 환매가 가능하다","두 형태에 차이가 없다"],"a":0,"e":"개방형 펀드는 투자자가 원할 때 돈을 빼갈 수 있습니다. 대신 운용사는 언제 환매 요청이 올지 몰라 현금을 어느 정도 남겨둬야 하고, 팔기 어려운 자산에는 투자하기 힘듭니다.\n폐쇄형 펀드는 만기까지 돈을 뺄 수 없습니다. 운용사가 자금 유출을 걱정하지 않아도 되니 부동산이나 비상장주식처럼 현금화가 어려운 자산에 투자할 수 있습니다. 대신 투자자의 자금이 묶이므로 보통 거래소에 상장해 사고팔 수 있게 합니다.\n\n▸ 환매: 펀드 지분을 팔아 돈을 돌려받는 것.\n▸ 비상장주식: 거래소에 등록되지 않아 자유롭게 사고팔기 어려운 주식."},{"sub":"금융상품","q":"펀드에서 판매보수와 운용보수의 차이로 옳은 것은?","o":["판매보수는 파는 회사가, 운용보수는 굴리는 회사가 가져간다","둘 다 운용사가 가져간다","둘 다 판매사가 가져간다","보수는 투자자가 부담하지 않는다"],"a":0,"e":"펀드에는 여러 회사가 관여합니다. 상품을 만들고 굴리는 자산운용사, 그 상품을 고객에게 파는 은행이나 증권사, 재산을 따로 보관하는 신탁업자입니다.\n각자 일한 대가를 가져가는데 굴린 대가가 운용보수, 판 대가가 판매보수입니다. 보수는 매일 펀드 재산에서 조금씩 떼어가기 때문에 눈에 잘 띄지 않지만 장기 수익률에 큰 영향을 줍니다.\n\n▸ 보수: 매년 일정 비율로 계속 떼는 수수료.\n▸ 수수료: 가입하거나 환매할 때 한 번 내는 비용.\n▸ 신탁업자: 펀드 재산을 운용사와 분리해 보관하는 기관."},{"sub":"직무윤리","q":"금융투자업자가 이해상충 가능성을 낮추는 것이 곤란하다고 판단한 경우 취해야 할 조치는?","o":["투자자에게 알린 뒤 그대로 거래한다","해당 매매나 거래를 하여서는 안 된다","내부통제기준에 기록만 남기고 진행한다","투자자의 동의를 받으면 제한 없이 거래할 수 있다"],"a":1,"e":"자본시장법상 이해상충 관리는 알리고, 낮춘 후 거래하며, 낮추는 것이 곤란하면 거래를 하지 않아야 하는 3단계 구조입니다. 마지막 단계에서는 투자자 동의가 있어도 거래할 수 없습니다."},{"sub":"직무윤리","q":"투자자의 투자목적과 재산상황, 투자경험에 비추어 적합하지 않은 투자권유를 해서는 안 된다는 원칙은?","o":["적정성 원칙","적합성 원칙","신의성실 원칙","설명의무"],"a":1,"e":"적합성 원칙은 투자권유를 할 때 적용되며, 적정성 원칙은 투자권유 없이 파생상품 등 위험상품을 거래하려는 경우에 적용됩니다. 두 원칙의 적용 국면을 구분해 기억해야 합니다."},{"sub":"직무윤리","q":"금융투자업자가 설명의무를 위반하여 일반투자자에게 손해를 입힌 경우의 효과는?","o":["과태료만 부과된다","손해배상책임을 진다","계약이 자동으로 무효가 된다","아무런 책임을 지지 않는다"],"a":1,"e":"자본시장법 제48조에 따라 설명의무 위반으로 손해가 발생하면 손해배상책임을 집니다. 이때 원본손실액이 손해액으로 추정되어 투자자의 입증 부담이 완화됩니다."},{"sub":"법규","q":"자본시장법상 금융투자업에 해당하지 않는 것은?","o":["투자중개업","집합투자업","투자일임업","여신전문금융업"],"a":3,"e":"자본시장법상 금융투자업은 투자매매업, 투자중개업, 집합투자업, 투자자문업, 투자일임업, 신탁업의 여섯 가지입니다. 여신전문금융업은 여신전문금융업법이 규율하는 별개의 업입니다."},{"sub":"법규","q":"주권상장법인의 투자자 지위에 관한 설명으로 옳은 것은?","o":["모든 거래에서 항상 전문투자자로 대우받는다","장외파생상품 거래 시에는 일반투자자로 대우받는다","항상 일반투자자로 대우받는다","투자자 구분이 적용되지 않는다"],"a":1,"e":"주권상장법인은 원칙적으로 전문투자자이지만, 장외파생상품 거래에서는 전문투자자 대우를 받겠다는 의사를 서면으로 통지하지 않는 한 일반투자자로 봅니다."},{"sub":"법규","q":"집합투자업자가 각 집합투자기구 자산총액 기준으로 동일 종목의 증권에 투자할 수 있는 한도는?","o":["5%","10%","20%","30%"],"a":1,"e":"분산투자 원칙에 따라 각 집합투자기구 자산총액의 10%를 초과하여 동일 종목 증권에 투자할 수 없습니다. 국채와 통안채 등은 예외가 인정됩니다."},{"sub":"법규","q":"자본시장법상 불공정거래행위에 해당하지 않는 것은?","o":["미공개중요정보 이용행위","시세조종행위","부정거래행위","공개매수 신고서의 제출"],"a":3,"e":"공개매수 신고서 제출은 법이 요구하는 정상적인 공시 절차입니다. 불공정거래의 3대 유형은 미공개중요정보 이용, 시세조종, 부정거래이며 시장질서 교란행위가 추가되어 규율됩니다."},{"sub":"거시경제","q":"경기순환의 국면 순서로 옳은 것은?","o":["회복 → 확장 → 후퇴 → 수축","확장 → 회복 → 수축 → 후퇴","수축 → 후퇴 → 회복 → 확장","회복 → 후퇴 → 확장 → 수축"],"a":0,"e":"경기는 회복, 확장, 후퇴, 수축의 네 국면을 반복합니다. 저점에서 정점까지가 확장국면, 정점에서 저점까지가 수축국면이며 두 국면을 합쳐 한 주기가 됩니다."},{"sub":"거시경제","q":"경기선행종합지수의 구성지표에 해당하는 것은?","o":["비농림어업 취업자수","코스피지수","소비재 수입액","상용근로자수"],"a":1,"e":"코스피지수는 대표적인 선행지표로 재고순환지표, 경제심리지수, 건설수주액, 장단기금리차 등과 함께 선행종합지수를 구성합니다. 취업자수는 동행, 상용근로자수는 후행지표입니다."},{"sub":"거시경제","q":"유동성 프리미엄 이론에 따른 수익률곡선의 일반적인 형태는?","o":["수평","우상향","우하향","U자형"],"a":1,"e":"장기채권은 유동성이 낮고 가격변동 위험이 크므로 투자자가 추가 프리미엄을 요구합니다. 그 결과 기대이자율이 일정하더라도 수익률곡선은 우상향하는 형태가 됩니다."},{"sub":"채권운용","q":"시장이자율이 하락할 때 채권가격의 변화로 옳은 것은?","o":["상승한다","하락한다","변하지 않는다","표면이자율에 따라 결정되지 않는다"],"a":0,"e":"채권가격은 미래 현금흐름을 시장이자율로 할인한 값이므로 이자율과 반대로 움직입니다. 이자율이 내리면 할인율이 낮아져 채권가격이 오릅니다."},{"sub":"채권운용","q":"채권의 듀레이션에 관한 설명으로 옳은 것은?","o":["만기가 길수록, 표면이자율이 낮을수록 듀레이션이 길다","만기가 길수록, 표면이자율이 높을수록 듀레이션이 길다","표면이자율과 듀레이션은 무관하다","무이표채의 듀레이션은 항상 0이다"],"a":0,"e":"듀레이션은 현금흐름의 가중평균 회수기간으로 만기가 길수록 길어지고 표면이자율이 높을수록 조기 회수 비중이 커져 짧아집니다. 무이표채의 듀레이션은 만기와 같습니다."},{"sub":"주식운용","q":"시장 평균수익률을 추종하는 것을 목표로 하는 운용전략은?","o":["액티브 운용전략","패시브 운용전략","롱숏 전략","차익거래 전략"],"a":1,"e":"패시브 전략은 인덱스펀드처럼 벤치마크를 복제해 시장수익률을 따라가는 것을 목표로 하며 운용보수가 낮습니다. 액티브 전략은 초과수익을 노리고 종목을 선별합니다."},{"sub":"주식운용","q":"주가수익비율(PER)의 산식으로 옳은 것은?","o":["주가 ÷ 주당순이익","주가 ÷ 주당순자산","주당순이익 ÷ 주가","시가총액 ÷ 매출액"],"a":0,"e":"PER은 주가를 주당순이익으로 나눈 값으로 이익 대비 주가 수준을 봅니다. 주가를 주당순자산으로 나누면 PBR이 됩니다."},{"sub":"투자분석","q":"대안투자상품에 해당하지 않는 것은?","o":["부동산 펀드","헤지펀드","사모투자펀드(PEF)","국고채"],"a":3,"e":"대안투자는 전통적 자산인 주식과 채권 외의 투자를 말하며 부동산, 헤지펀드, PEF, 원자재, 인프라 등이 포함됩니다. 국고채는 전통적 자산입니다."},{"sub":"투자분석","q":"VaR(Value at Risk)에 관한 설명으로 옳은 것은?","o":["정상적인 시장에서 일정 기간 주어진 신뢰수준하에 발생할 수 있는 최대손실예상액","발생 가능한 손실의 절대 상한선","항상 실현되는 확정 손실액","수익률의 산술평균값"],"a":0,"e":"VaR은 정상적인 시장 조건에서 특정 기간과 신뢰수준을 전제로 한 최대손실 추정치입니다. 극단적 상황의 손실은 포착하지 못하므로 스트레스 테스트로 보완합니다."},{"sub":"직무윤리","q":"금융투자업 종사자가 지켜야 할 가장 기본이 되는 두 가지 원칙은?","o":["신의성실의무와 고객우선의무","비밀유지와 성실근무","이익극대화와 효율성","신속처리와 비용절감"],"a":0,"e":"고객 돈을 다루는 사람이 지켜야 할 두 기둥입니다. 고객 이익을 먼저 생각하고(고객우선), 정직하고 성실하게 일하라(신의성실)는 것입니다.\n\n왜 이게 특별히 강조될까요? 금융업은 정보가 한쪽으로 쏠려 있습니다. 직원은 그 상품이 얼마나 위험한지 알지만 고객은 모릅니다. 이 정보 차이를 이용해 돈을 벌 수 있는 자리에 있기 때문에, 스스로를 묶는 원칙이 필요한 것입니다.\n\n용어 ▸ 신의성실 = 믿음과 정직으로 상대를 대하는 것. 정보 비대칭 = 거래 당사자 중 한쪽만 정보를 많이 가진 상태."},{"sub":"직무윤리","q":"'이해상충'이 발생하는 상황으로 가장 적절한 것은?","o":["회사나 임직원의 이익과 고객의 이익이 충돌하는 경우","고객끼리 서로 의견이 다른 경우","상품 설명이 어려운 경우","시장이 하락하는 경우"],"a":0,"e":"이해상충은 '내가 이득을 보면 고객이 손해를 보는' 상황입니다.\n\n예를 들어 회사가 팔아야 할 재고 상품이 있는데, 고객에게는 다른 상품이 더 맞다고 합시다. 재고를 밀어내면 회사는 이득이고 고객은 손해입니다. 이게 이해상충입니다.\n\n또는 직원이 미리 주식을 사둔 뒤 고객에게 그 종목을 추천해 가격을 올리는 것도 마찬가지입니다.\n\n용어 ▸ 이해 = 이익과 손해. 상충 = 서로 부딪히는 것."},{"sub":"직무윤리","q":"금융투자회사가 이해상충을 관리하기 위해 부서 간 정보 교류를 차단하는 장치를 무엇이라 하는가?","o":["정보교류 차단장치(Chinese Wall)","내부고발제도","준법감시인","성과보상체계"],"a":0,"e":"회사 안에 보이지 않는 벽을 세워 부서끼리 정보를 못 넘기게 하는 장치입니다.\n\n예를 들어 기업금융 부서는 A회사가 곧 인수합병된다는 사실을 압니다. 이 정보가 주식 운용 부서로 넘어가면 미리 사둘 수 있고, 이건 명백한 불공정거래입니다. 그래서 부서 간에 자료 공유, 사무공간, 전산 접근을 물리적으로 갈라놓습니다.\n\n용어 ▸ 정보교류 차단 = 부서 사이에 민감한 정보가 넘나들지 못하게 막는 것. 준법감시인 = 회사가 법을 지키는지 내부에서 감시하는 담당자."},{"sub":"직무윤리","q":"투자권유 시 '설명의무'의 내용으로 옳은 것은?","o":["상품의 내용과 위험을 투자자가 이해할 수 있도록 설명해야 한다","좋은 점만 강조해 설명해야 한다","서면 교부만 하면 설명은 생략할 수 있다","전문투자자에게도 동일하게 적용된다"],"a":0,"e":"상품의 내용과 위험을 고객이 실제로 알아듣도록 설명해야 한다는 의무입니다.\n\n핵심은 '이해할 수 있도록'입니다. 서류를 내밀고 사인만 받는 것으로는 부족합니다. 나이가 많거나 투자 경험이 없는 고객이라면 그 수준에 맞춰 더 쉽게 설명해야 합니다.\n\n또 위험을 빼놓고 수익률만 말하면 설명의무 위반입니다. 손실 가능성은 반드시 알려야 합니다.\n\n용어 ▸ 교부 = 서류를 건네주는 것. 전문투자자 = 금융 지식과 자산이 충분해 보호 필요성이 낮다고 보는 투자자."},{"sub":"직무윤리","q":"투자자에게 손실의 일부나 전부를 보전해 주겠다고 약속하는 행위는?","o":["허용된다","원칙적으로 금지된다","고객이 원하면 가능하다","서면으로 하면 가능하다"],"a":1,"e":"'손해 나면 제가 메워드릴게요'라는 약속은 법으로 금지되어 있습니다.\n\n왜 금지할까요? 이런 약속이 허용되면 투자자는 위험을 따지지 않고 아무 상품이나 삽니다. 회사는 고객을 끌려고 무리한 약속을 남발하고, 결국 감당 못 해 무너집니다. 시장 전체가 흔들립니다.\n\n투자는 본인 판단과 책임으로 하는 것이라는 원칙을 지키기 위한 규정입니다. 손실 보전뿐 아니라 사전에 이익을 보장하는 약속도 금지됩니다.\n\n용어 ▸ 보전 = 부족한 부분을 메워주는 것. 자기책임 원칙 = 투자 결과는 투자자 본인이 진다는 원칙."},{"sub":"직무윤리","q":"'적정성 원칙'이 적용되는 상황으로 옳은 것은?","o":["투자권유를 하는 경우","투자권유 없이 투자자가 스스로 파생상품 등 위험상품을 거래하려는 경우","예금에 가입하는 경우","단순 조회 업무를 하는 경우"],"a":1,"e":"고객이 먼저 위험한 상품을 사겠다고 찾아왔을 때 적용되는 원칙입니다.\n\n적합성 원칙은 회사가 권유할 때 '이 고객에게 안 맞는 건 권하지 마라'는 것입니다. 적정성 원칙은 권유하지 않았는데 고객이 스스로 파생상품을 사겠다고 할 때 '당신에게 적정하지 않을 수 있다'고 알려주라는 것입니다.\n\n권유했느냐 안 했느냐가 두 원칙을 가르는 기준입니다.\n\n용어 ▸ 파생상품 = 주식·환율 등의 가격 변동에 따라 손익이 결정되는 계약. 손실이 원금을 넘을 수도 있음."},{"sub":"직무윤리","q":"금융투자업 종사자의 비밀유지의무에 관한 설명으로 옳은 것은?","o":["고객 정보는 퇴직 후에도 누설해서는 안 된다","재직 중에만 지키면 된다","동료에게는 자유롭게 알려도 된다","고객이 유명인이면 예외이다"],"a":0,"e":"고객 정보를 지킬 의무는 회사를 그만둔 뒤에도 계속됩니다.\n\n고객은 자산 규모, 투자 내역, 가족 관계처럼 남에게 알리고 싶지 않은 정보를 회사에 맡깁니다. 이 정보가 새면 고객은 금융회사를 믿지 못하게 됩니다.\n\n그래서 업무상 알게 된 정보는 필요한 사람에게만, 필요한 범위에서만 쓸 수 있고, 퇴직했다고 해서 풀리지 않습니다.\n\n용어 ▸ 누설 = 비밀을 밖으로 흘리는 것. 직무상 알게 된 정보 = 일하면서 알게 된 정보."},{"sub":"직무윤리","q":"금융투자업자가 투자자에게 투자권유를 하기 전에 먼저 해야 할 일은?","o":["투자자의 투자목적, 재산상황, 투자경험을 파악하는 것","수익률을 먼저 제시하는 것","계약서에 서명을 받는 것","상품 판매 실적을 확인하는 것"],"a":0,"e":"권유하기 전에 이 사람이 어떤 사람인지부터 알아야 합니다. 이를 고객 파악 의무라고 합니다.\n\n의사가 약을 주기 전에 어디가 아픈지, 지병이 있는지, 알레르기가 있는지 묻는 것과 같습니다. 묻지도 않고 약을 주면 위험합니다.\n\n투자목적(안정이냐 수익이냐), 재산상황(잃어도 되는 돈인가), 투자경험(위험을 이해할 수 있는가)을 확인하고 서명으로 남깁니다.\n\n용어 ▸ 투자목적 = 왜 투자하는지, 얼마나 위험을 감수할지. 재산상황 = 소득과 자산의 규모."},{"sub":"직무윤리","q":"직무윤리를 준수해야 하는 근본적인 이유로 가장 적절한 것은?","o":["처벌이 두렵기 때문","금융투자업은 고객의 신뢰를 기반으로 존립하기 때문","회사 규정이기 때문","상사가 지시하기 때문"],"a":1,"e":"금융업은 신뢰가 무너지면 사업 자체가 성립하지 않기 때문입니다.\n\n음식점은 맛이 없으면 손님이 줄어드는 정도지만, 금융회사는 '저기 못 믿겠다'는 소문이 돌면 하루아침에 돈이 다 빠져나갑니다. 눈에 보이지 않는 약속만으로 고객 돈을 맡아두고 있기 때문입니다.\n\n그래서 직무윤리는 착하게 살자는 도덕 이야기가 아니라 산업의 생존 조건입니다.\n\n용어 ▸ 존립 = 존재하여 유지되는 것. 평판위험 = 신뢰를 잃어 손실이 생길 위험."},{"sub":"직무윤리","q":"금융투자상품 광고 시 지켜야 할 사항으로 옳은 것은?","o":["과거 수익률만 강조해도 된다","손실 가능성 등 투자자가 알아야 할 사항을 함께 표시해야 한다","금융회사 자율에 맡겨져 있다","광고에는 아무 제한이 없다"],"a":1,"e":"광고에는 좋은 점과 함께 위험도 반드시 적어야 합니다.\n\n'작년 수익률 30%!'만 크게 써 놓으면 사람들은 앞으로도 그럴 거라고 착각합니다. 그래서 원금 손실 가능성, 수수료, 과거 실적이 미래를 보장하지 않는다는 문구를 함께 넣도록 하고 있습니다.\n\n또 광고를 내보내기 전에 준법감시인의 확인을 받아야 합니다.\n\n용어 ▸ 준법감시인 = 회사 활동이 법규를 지키는지 내부에서 점검하는 담당자."},{"sub":"직무윤리","q":"임직원이 자기 계산으로 금융투자상품을 매매할 때 지켜야 할 사항으로 옳은 것은?","o":["아무 제한 없이 자유롭게 할 수 있다","회사에 신고한 하나의 계좌를 이용하는 등 제한을 받는다","고객 계좌를 이용할 수 있다","매매 내역을 숨겨도 된다"],"a":1,"e":"금융회사 직원이 자기 돈으로 주식을 사고파는 것은 자유가 아니라 신고 대상입니다.\n\n직원은 남보다 정보를 빨리 접합니다. 고객 주문을 미리 보고 앞질러 사거나, 회사 정보를 이용할 수 있는 위치입니다. 이를 막으려고 계좌를 하나로 정해 신고하게 하고 거래 내역을 회사가 볼 수 있게 합니다.\n\n용어 ▸ 자기 계산 = 자기 돈으로, 자기 이익을 위해. 선행매매 = 고객 주문 정보를 미리 알고 먼저 거래하는 것."},{"sub":"법규","q":"자본시장법이 정의하는 '금융투자상품'의 핵심 요건으로 옳은 것은?","o":["원본 손실 가능성이 있을 것","원금이 보장될 것","만기가 1년 이상일 것","정부가 발행할 것"],"a":0,"e":"원금을 잃을 수 있으면 금융투자상품, 잃을 일이 없으면 아닙니다.\n\n은행 예금은 넣은 돈이 그대로 보장되니 금융투자상품이 아닙니다. 주식, 펀드, 파생상품은 넣은 돈보다 적게 돌아올 수 있으니 금융투자상품입니다.\n\n이 구분이 왜 중요할까요? 금융투자상품으로 분류되면 설명의무, 적합성 원칙 같은 투자자 보호 규정이 적용되기 때문입니다.\n\n용어 ▸ 원본 = 처음 투자한 원금. 투자성 = 원금을 잃을 수 있는 성질."},{"sub":"법규","q":"증권과 파생상품을 구분하는 기준으로 옳은 것은?","o":["증권은 추가 지급의무가 없고, 파생상품은 원본을 초과하는 손실이 가능하다","증권이 파생상품보다 위험하다","둘은 같은 개념이다","파생상품은 원금이 보장된다"],"a":0,"e":"잃을 수 있는 최대 금액이 어디까지냐로 나뉩니다.\n\n주식을 100만원어치 샀다면 최악의 경우 100만원을 다 잃습니다. 그 이상 물어낼 일은 없습니다. 이게 증권입니다.\n\n선물이나 옵션 매도 같은 파생상품은 다릅니다. 100만원을 넣었는데 300만원을 더 물어내야 하는 상황이 생길 수 있습니다. 원금을 넘는 손실이 가능하다는 게 결정적 차이입니다.\n\n용어 ▸ 추가 지급의무 = 처음 낸 돈 외에 더 내야 할 의무. 선물 = 미래의 정해진 날에 정해진 가격으로 사고팔기로 한 계약."},{"sub":"법규","q":"투자매매업과 투자중개업의 차이로 옳은 것은?","o":["투자매매업은 자기 계산으로, 투자중개업은 타인의 계산으로 거래한다","둘은 같은 업무이다","투자중개업은 자기 돈으로만 거래한다","투자매매업은 수수료만 받는다"],"a":0,"e":"내 돈으로 직접 사고파느냐, 남의 주문을 대신 처리해 주느냐의 차이입니다.\n\n투자매매업은 증권사가 자기 돈으로 주식을 사서 되파는 것입니다. 잘되면 회사가 벌고 못되면 회사가 잃습니다.\n\n투자중개업은 고객이 '삼성전자 10주 사줘'라고 하면 대신 주문을 넣고 수수료를 받는 일입니다. 손익은 고객 몫입니다.\n\n용어 ▸ 계산 = 손익이 누구에게 돌아가는지를 뜻하는 말. 중개 = 사이에서 거래를 이어주는 일."},{"sub":"법규","q":"투자자문업과 투자일임업의 차이로 옳은 것은?","o":["투자자문업은 조언만 하고, 투자일임업은 자산을 맡아 직접 운용한다","둘 다 자산을 직접 운용한다","투자일임업은 조언만 한다","둘은 같은 업무이다"],"a":0,"e":"말만 해주느냐, 아예 돈을 맡아서 굴리느냐의 차이입니다.\n\n투자자문업은 'A종목이 좋아 보입니다'라고 알려주는 데서 끝납니다. 실제로 살지 말지는 고객이 정합니다.\n\n투자일임업은 고객이 돈을 맡기고 '알아서 굴려주세요'라고 하는 것입니다. 회사가 직접 사고팝니다. 권한이 훨씬 크기 때문에 규제도 더 엄격합니다.\n\n용어 ▸ 일임 = 판단과 실행을 통째로 맡기는 것. 자문 = 의견을 구하고 답을 얻는 것."},{"sub":"법규","q":"미공개중요정보 이용행위에 관한 설명으로 옳은 것은?","o":["회사 내부자가 공개되지 않은 중요정보를 이용해 거래하는 것으로 금지된다","정보를 안 사람은 누구나 자유롭게 거래할 수 있다","친구에게 알려주는 것은 문제없다","공시 직후 거래하면 위법이다"],"a":0,"e":"아직 세상에 알려지지 않은 중요한 정보를 미리 알고 주식을 사고파는 행위입니다.\n\n예를 들어 회사 임원이 '다음 주에 대규모 계약 발표'라는 사실을 미리 알고 주식을 사두면, 발표 후 오른 만큼을 확실하게 법니다. 다른 투자자는 모르는 채로 손해를 봅니다.\n\n중요한 점은 정보를 전해 들은 사람도 처벌 대상이라는 것입니다. 친구에게 알려주는 것 자체가 위반입니다.\n\n용어 ▸ 미공개 = 아직 일반에 공개되지 않은. 공시 = 회사가 투자 판단에 중요한 사실을 공식적으로 알리는 것."},{"sub":"법규","q":"시세조종행위에 해당하는 것은?","o":["인위적으로 주가를 올리거나 내려 다른 투자자를 오인하게 하는 행위","기업 실적을 공시하는 행위","장기 보유하는 행위","분산투자하는 행위"],"a":0,"e":"주가가 저절로 움직이는 것처럼 보이게 만들어 남들을 속이는 행위입니다.\n\n대표적인 수법이 통정매매입니다. 두 사람이 짜고 서로 사고팔아 거래량이 많은 것처럼 꾸밉니다. 남들이 보기엔 인기 있는 종목처럼 보여 몰려듭니다. 가격이 오르면 조작한 사람이 빠져나가고 뒤늦게 산 사람이 물립니다.\n\n시장 가격은 실제 수요와 공급이 만든 것이어야 한다는 원칙을 깨뜨리는 행위입니다.\n\n용어 ▸ 통정매매 = 서로 짜고 같은 가격에 사고파는 것. 오인 = 잘못 알게 되는 것."},{"sub":"법규","q":"공개매수(공개매수제도)에 관한 설명으로 옳은 것은?","o":["불특정 다수로부터 장외에서 주식을 사겠다고 공개적으로 알리고 매수하는 것","장내에서 몰래 주식을 사 모으는 것","회사가 자기 주식을 소각하는 것","신주를 발행하는 것"],"a":0,"e":"'여러분 주식을 이 가격에 사겠습니다'라고 공개적으로 알리고 사 모으는 제도입니다.\n\n어떤 회사를 인수하려면 주식을 많이 모아야 합니다. 그런데 몰래 사 모으면 기존 주주들은 경영권이 넘어가는 줄도 모르고 싼값에 팔게 됩니다.\n\n그래서 일정 비율 이상을 장외에서 사려면 가격과 기간을 공개하고 모두에게 같은 기회를 주도록 했습니다. 주주 보호 장치입니다.\n\n용어 ▸ 장외 = 거래소 밖. 경영권 = 회사를 지배하고 경영진을 정할 수 있는 힘."},{"sub":"법규","q":"금융투자업자의 신의성실의무를 규정한 자본시장법상 원칙으로 옳은 것은?","o":["투자자의 이익을 해치면서 자기 이익을 추구해서는 안 된다","수익 극대화를 최우선으로 해야 한다","고객보다 회사 이익을 우선해야 한다","이익 충돌은 고려하지 않아도 된다"],"a":0,"e":"고객을 밟고 올라서서 돈을 벌지 말라는 원칙입니다.\n\n금융투자업자는 고객 자산을 다루는 지위에 있습니다. 마음만 먹으면 고객에게 불리하고 자기에게 유리한 거래를 만들 수 있습니다. 법은 이를 정면으로 금지합니다.\n\n이 원칙에서 이해상충 관리의무, 설명의무, 적합성 원칙 같은 구체적인 규정들이 갈라져 나옵니다.\n\n용어 ▸ 추구 = 목적을 이루려고 좇는 것. 선관주의의무 = 선량한 관리자로서 주의를 다할 의무."},{"sub":"법규","q":"집합투자재산의 보관과 관리를 담당하는 자는?","o":["집합투자업자","신탁업자(수탁회사)","판매회사","일반사무관리회사"],"a":1,"e":"펀드의 돈은 굴리는 회사가 아니라 다른 회사가 따로 보관합니다.\n\n왜 나눠 놓을까요? 굴리는 사람이 돈까지 들고 있으면 빼돌릴 수 있기 때문입니다. 운용회사는 '이 주식 사라'고 지시만 하고, 실제 돈과 자산은 신탁업자가 보관합니다.\n\n덕분에 운용회사가 망해도 펀드에 든 내 돈은 안전합니다. 투자자 보호의 핵심 구조입니다.\n\n용어 ▸ 수탁 = 맡아서 보관하고 관리하는 것. 집합투자업자 = 펀드를 운용하는 자산운용회사."},{"sub":"법규","q":"펀드를 투자자에게 판매하는 역할을 하는 회사는?","o":["집합투자업자","판매회사(은행·증권사 등)","신탁업자","한국거래소"],"a":1,"e":"펀드를 만드는 회사와 파는 회사가 다릅니다.\n\n자산운용사가 펀드를 만들어 굴리고, 은행이나 증권사가 창구에서 고객에게 팝니다. 우리가 은행에서 펀드에 가입해도 그 은행이 돈을 굴리는 건 아닙니다.\n\n그래서 상품 설명이 부실했다면 판매회사가 책임을 지고, 운용을 잘못했다면 운용회사가 책임을 집니다.\n\n용어 ▸ 판매회사 = 펀드를 투자자에게 파는 창구 역할을 하는 금융회사."},{"sub":"법규","q":"금융소비자보호법상 6대 판매원칙에 해당하지 않는 것은?","o":["적합성 원칙","설명의무","부당권유 금지","수익보장 의무"],"a":3,"e":"수익을 보장하라는 원칙은 없습니다. 오히려 보장 약속은 금지 대상입니다.\n\n6대 판매원칙은 적합성 원칙, 적정성 원칙, 설명의무, 불공정영업행위 금지, 부당권유행위 금지, 허위·과장광고 금지입니다. 전부 '팔 때 이렇게 하지 마라'는 내용이지 '얼마를 벌어줘라'는 내용이 아닙니다.\n\n투자 결과는 투자자가 지는 것이 원칙이기 때문입니다.\n\n용어 ▸ 부당권유 = 거짓을 말하거나 불확실한 것을 확실하다고 단정해 권하는 것."},{"sub":"법규","q":"투자자가 계약 체결 후 일정 기간 내에 계약을 취소할 수 있는 제도는?","o":["청약철회권","손해배상청구권","환매청구권","의결권"],"a":0,"e":"충동적으로 가입했더라도 일정 기간 안에는 무를 수 있게 해주는 제도입니다.\n\n금융상품은 구조가 복잡해서 집에 와서 다시 보면 '이게 아닌데' 싶은 경우가 있습니다. 그래서 일부 상품은 계약 후 정해진 기간 안에 아무 이유 없이 취소하고 낸 돈을 돌려받을 수 있게 했습니다.\n\n불이익 없이 되돌릴 기회를 준다는 점이 핵심입니다.\n\n용어 ▸ 청약 = 계약을 맺겠다는 의사표시. 철회 = 이미 한 의사표시를 거두어들이는 것."},{"sub":"거시경제","q":"기준금리를 올리면 채권 가격은 일반적으로 어떻게 되는가?","o":["오른다","내린다","변하지 않는다","항상 두 배가 된다"],"a":1,"e":"금리가 오르면 이미 발행된 채권의 가격은 떨어집니다.\n\n작년에 연 3% 이자를 주는 채권을 샀다고 합시다. 그런데 올해 금리가 올라 새로 나오는 채권이 연 5%를 줍니다. 이제 아무도 내 3%짜리를 제값에 사주지 않습니다. 팔려면 값을 깎아야 합니다.\n\n금리와 채권 가격이 반대로 움직이는 이유가 이것입니다. 투자에서 가장 자주 나오는 관계이니 통째로 외워두세요.\n\n용어 ▸ 기준금리 = 중앙은행이 정하는 돈의 기본 가격. 표면이자 = 채권에 적힌 약속된 이자율."},{"sub":"거시경제","q":"인플레이션이 발생하면 돈을 빌린 사람(채무자)에게 미치는 영향은?","o":["실질적인 빚 부담이 늘어난다","실질적인 빚 부담이 줄어든다","아무 영향이 없다","즉시 빚이 사라진다"],"a":1,"e":"물가가 오르면 빚진 사람이 유리해집니다.\n\n1억을 빌렸는데 그 사이 물가가 두 배로 뛰었다고 합시다. 갚아야 할 돈은 여전히 1억이지만, 그 1억의 값어치는 예전의 5천만원 수준으로 쪼그라들었습니다. 실질적으로 절반만 갚는 셈입니다.\n\n반대로 돈을 빌려준 사람은 손해입니다. 그래서 인플레이션이 예상되면 대출 금리가 올라갑니다.\n\n용어 ▸ 인플레이션 = 물가가 지속적으로 오르는 현상. 실질 = 물가 변동을 걷어내고 본 실제 가치."},{"sub":"거시경제","q":"경기가 나쁠 때 중앙은행이 일반적으로 취하는 정책은?","o":["기준금리 인상","기준금리 인하","지급준비율 인상","국채 매각"],"a":1,"e":"경기가 나쁘면 금리를 내려 돈이 돌게 만듭니다.\n\n금리를 내리면 대출 이자가 싸집니다. 기업은 돈을 빌려 공장을 짓고, 개인은 대출로 집을 삽니다. 예금 이자가 낮아지니 저축 대신 소비를 합니다. 이렇게 돈이 돌면 경기가 살아납니다.\n\n반대로 경기가 과열되고 물가가 뛰면 금리를 올려 돈을 묶습니다.\n\n용어 ▸ 확장적 통화정책 = 돈을 풀어 경기를 부양하는 정책. 지급준비율 = 은행이 예금 중 의무적으로 남겨둬야 하는 비율."},{"sub":"거시경제","q":"실질이자율을 구하는 방법으로 옳은 것은?","o":["명목이자율 + 물가상승률","명목이자율 - 물가상승률","명목이자율 × 물가상승률","물가상승률 ÷ 명목이자율"],"a":1,"e":"통장에 찍힌 이자에서 물가가 오른 만큼을 빼야 진짜 번 것입니다.\n\n은행이 연 3% 이자를 줬는데 물가가 3% 올랐다면, 통장 숫자는 늘었지만 살 수 있는 물건의 양은 그대로입니다. 실질이자율은 0입니다.\n\n물가가 5% 올랐다면 실질이자율은 마이너스 2%로 오히려 손해입니다. 은행에 넣어두면 무조건 안전하다는 생각이 틀릴 수 있는 이유입니다.\n\n용어 ▸ 명목 = 겉에 표시된 숫자 그대로. 실질 = 물가 영향을 뺀 진짜 가치. (피셔 방정식)"},{"sub":"거시경제","q":"환율이 1달러 1,200원에서 1,300원이 되었다. 이 상황을 표현하는 말로 옳은 것은?","o":["원화 가치 상승, 환율 하락","원화 가치 하락, 환율 상승","원화 가치 상승, 환율 상승","달러 가치 하락"],"a":1,"e":"환율 숫자가 커지면 원화 가치는 떨어진 것입니다.\n\n예전에는 1달러를 사는 데 1,200원이면 됐는데 이제 1,300원을 줘야 합니다. 같은 1달러를 사는 데 우리 돈이 더 많이 들어가니 원화의 힘이 약해진 것입니다.\n\n헷갈리면 이렇게 생각하세요. 환율은 '달러의 가격'입니다. 달러 값이 오르면 상대적으로 원화 값은 내려갑니다.\n\n용어 ▸ 절하 = 통화 가치가 떨어지는 것. 절상 = 통화 가치가 오르는 것."},{"sub":"거시경제","q":"경기종합지수 중 앞으로의 경기 흐름을 미리 보여주는 지표군은?","o":["선행종합지수","동행종합지수","후행종합지수","물가종합지수"],"a":0,"e":"경기보다 먼저 움직이는 지표들을 모아 만든 것이 선행지수입니다.\n\n주가는 보통 실제 경기보다 6개월쯤 앞서 움직입니다. 건설수주도 마찬가지로 지금 계약하면 몇 달 뒤에 공사가 시작됩니다. 이런 지표를 모으면 앞날을 가늠할 수 있습니다.\n\n동행지수는 지금 상태를 보여주고(취업자 수 등), 후행지수는 뒤늦게 확인해 주는 지표입니다.\n\n용어 ▸ 선행 = 앞서가는 것. 수주 = 주문을 받는 것."},{"sub":"거시경제","q":"스태그플레이션이란 무엇인가?","o":["경기 침체와 물가 상승이 동시에 나타나는 현상","경기 호황과 물가 하락이 동시에 나타나는 현상","물가가 계속 하락하는 현상","실업률이 0이 되는 현상"],"a":0,"e":"경기는 나쁜데 물가는 오르는, 최악의 조합입니다.\n\n보통은 경기가 나쁘면 사람들이 안 사니까 물가도 떨어집니다. 그런데 원유 가격이 폭등하는 것처럼 생산비 자체가 치솟으면 다릅니다. 기업은 생산을 줄이고(경기 침체), 그러면서 가격은 올립니다(물가 상승).\n\n금리를 내리면 물가가 더 뛰고, 올리면 경기가 더 죽어서 정책으로 풀기가 어렵습니다.\n\n용어 ▸ 스태그네이션(침체) + 인플레이션(물가상승)을 합친 말. 비용인상 인플레이션 = 생산비가 올라 생기는 물가 상승."},{"sub":"거시경제","q":"디플레이션이 경제에 미치는 부정적 영향으로 옳은 것은?","o":["소비를 미루게 되어 경기가 더 위축된다","소비가 즉시 늘어난다","빚의 실질 부담이 줄어든다","기업 이익이 늘어난다"],"a":0,"e":"물가가 계속 떨어지면 사람들이 소비를 미루게 됩니다.\n\n'다음 달이면 더 싸질 텐데 지금 왜 사?'라는 생각이 퍼집니다. 모두가 기다리면 물건이 안 팔리고, 기업은 생산을 줄이고 직원을 자릅니다. 소득이 줄면 소비가 더 줄어드는 악순환이 생깁니다.\n\n또 물가가 떨어지면 빚의 실질 부담은 오히려 커집니다. 갚아야 할 돈의 값어치가 올라가기 때문입니다.\n\n용어 ▸ 디플레이션 = 물가가 지속적으로 떨어지는 현상. 위축 = 오그라들어 활력을 잃는 것."},{"sub":"채권운용","q":"채권의 액면가, 표면이자율, 만기가 의미하는 것으로 옳은 것은?","o":["액면가는 만기에 돌려받는 원금, 표면이자율은 약속된 이자율, 만기는 원금 상환일","액면가는 시장에서 거래되는 가격이다","표면이자율은 시장금리와 항상 같다","만기는 이자를 처음 받는 날이다"],"a":0,"e":"채권은 차용증이라고 생각하면 쉽습니다.\n\n'10년 뒤에 100만원 갚을게, 그때까지 매년 3%씩 이자 줄게'라고 적힌 종이입니다. 여기서 100만원이 액면가, 3%가 표면이자율, 10년 뒤가 만기입니다.\n\n중요한 건 이 세 가지가 발행할 때 정해져 바뀌지 않는다는 점입니다. 바뀌는 건 시장에서 사고팔리는 '가격'뿐입니다.\n\n용어 ▸ 액면가 = 채권에 적힌 원금 액수. 상환 = 빌린 돈을 갚는 것."},{"sub":"채권운용","q":"채권 가격이 액면가보다 낮게 거래되는 상태를 무엇이라 하는가?","o":["할증발행","할인발행","액면발행","무상발행"],"a":1,"e":"액면가보다 싸게 거래되면 할인, 비싸게 거래되면 할증입니다.\n\n액면가 100만원짜리 채권이 95만원에 팔린다면 할인된 상태입니다. 왜 싸게 팔릴까요? 이 채권의 이자율이 요즘 시장 금리보다 낮기 때문입니다. 이자가 적은 만큼 가격을 깎아줘야 팔립니다.\n\n반대로 표면이자율이 시장금리보다 높으면 웃돈을 주고도 사려 하니 할증됩니다.\n\n용어 ▸ 할인 = 값을 깎는 것. 할증 = 값을 더 얹는 것."},{"sub":"채권운용","q":"만기수익률(YTM)이 의미하는 것으로 옳은 것은?","o":["채권을 현재 가격에 사서 만기까지 보유할 때 얻는 연평균 수익률","표면이자율과 같은 개념","채권의 액면가","1년간 받는 이자 금액"],"a":0,"e":"지금 이 가격에 사서 끝까지 들고 있으면 결국 연 몇 퍼센트를 버는가를 나타낸 숫자입니다.\n\n표면이자율은 채권에 적힌 고정된 숫자이고, 만기수익률은 '내가 실제로 얼마에 샀느냐'를 반영한 진짜 수익률입니다.\n\n액면가보다 싸게 샀다면 만기에 액면가를 받으니 그 차익까지 포함해 표면이자율보다 높은 수익률이 나옵니다.\n\n용어 ▸ YTM = Yield To Maturity. 보유 = 팔지 않고 계속 가지고 있는 것."},{"sub":"채권운용","q":"신용스프레드가 확대되었다는 것의 의미로 옳은 것은?","o":["회사채와 국채의 금리 차이가 벌어져 신용위험에 대한 우려가 커졌다","회사채 금리가 국채와 같아졌다","국채 금리가 사라졌다","채권시장이 안정되었다"],"a":0,"e":"국채와 회사채의 금리 차이가 벌어졌다는 뜻이고, 시장이 불안해졌다는 신호입니다.\n\n국채는 나라가 갚는 것이라 가장 안전합니다. 회사채는 회사가 망할 수 있으니 이자를 더 줘야 합니다. 이 차이가 신용스프레드입니다.\n\n경제가 불안해지면 투자자들은 '회사가 위험한데 이 정도 이자로는 못 사겠다'며 더 높은 금리를 요구합니다. 그래서 차이가 벌어집니다.\n\n용어 ▸ 스프레드 = 두 금리 사이의 차이. 국채 = 국가가 발행한 채권."},{"sub":"채권운용","q":"듀레이션이 5년인 채권의 금리가 1%p 상승할 때 가격 변화로 가장 가까운 것은?","o":["약 5% 상승","약 5% 하락","약 1% 하락","변화 없음"],"a":1,"e":"듀레이션은 금리가 1%p 움직일 때 가격이 몇 % 움직이는지를 알려주는 숫자입니다.\n\n듀레이션 5년이면 금리가 1%p 오를 때 가격이 대략 5% 떨어집니다. 금리가 내리면 반대로 5% 오릅니다.\n\n그래서 금리가 오를 것 같으면 듀레이션이 짧은 채권으로 갈아타고, 내릴 것 같으면 긴 채권을 삽니다. 채권 운용에서 가장 실전적인 도구입니다.\n\n용어 ▸ %p(퍼센트포인트) = 비율 간의 차이. 3%에서 4%가 되면 1%p 상승. 민감도 = 어떤 변화에 얼마나 크게 반응하는지."},{"sub":"채권운용","q":"이표채(coupon bond)에 관한 설명으로 옳은 것은?","o":["만기까지 정기적으로 이자를 지급하는 채권","이자 없이 할인 발행되는 채권","만기에 이자를 한 번에 주는 채권","주식으로 전환되는 채권"],"a":0,"e":"정해진 주기마다 이자를 꼬박꼬박 주는 채권입니다.\n\n옛날에는 채권 종이에 이자 받는 표(쿠폰)가 여러 장 붙어 있었습니다. 이자 지급일마다 한 장씩 떼어 가서 돈을 받았습니다. 그래서 이표채라고 부릅니다.\n\n이자를 아예 안 주는 대신 처음부터 싸게 파는 것은 할인채(무이표채)이고, 만기에 원금과 이자를 한꺼번에 주는 것은 복리채입니다.\n\n용어 ▸ 이표 = 이자를 받을 수 있는 표. 무이표채 = 이자 지급 없이 할인해서 발행하는 채권."},{"sub":"채권운용","q":"수익률곡선이 우하향하는 상태가 의미하는 것으로 옳은 것은?","o":["단기금리가 장기금리보다 높은 상태로 경기 침체 신호로 해석되기도 한다","장기금리가 단기금리보다 높은 정상적 상태","금리가 모두 같은 상태","금리가 존재하지 않는 상태"],"a":0,"e":"짧게 빌려주는 게 길게 빌려주는 것보다 이자가 높은, 뒤집힌 상태입니다.\n\n보통은 오래 빌려줄수록 위험하니 이자를 더 받습니다. 그런데 가끔 반대가 됩니다. 앞으로 경기가 나빠져 금리가 내려갈 거라고 시장이 예상하면 장기금리가 미리 내려앉기 때문입니다.\n\n실제로 이 현상이 나타난 뒤 경기 침체가 온 경우가 많아 경고 신호로 봅니다.\n\n용어 ▸ 수익률곡선 = 만기별 금리를 이어 그린 선. 장단기 금리 역전 = 단기금리가 장기금리를 넘어선 상태."},{"sub":"채권운용","q":"채권 투자에서 '재투자위험'이란 무엇인가?","o":["받은 이자를 다시 굴릴 때 금리가 낮아져 예상 수익에 못 미칠 위험","채권 발행사가 망할 위험","환율이 변동할 위험","채권을 팔지 못할 위험"],"a":0,"e":"받은 이자를 다시 굴려야 하는데 그때 금리가 낮아져 있을 위험입니다.\n\n연 5% 채권을 샀다고 처음 계산한 수익률에는 '받은 이자도 계속 5%로 굴린다'는 가정이 깔려 있습니다. 그런데 3년 뒤 금리가 2%로 떨어지면 이자를 2%로밖에 못 굴립니다. 결과적으로 처음 기대한 수익에 못 미칩니다.\n\n금리가 떨어질 때 생기는 위험이라는 점에서 가격위험과 방향이 반대입니다.\n\n용어 ▸ 재투자 = 받은 돈을 다시 투자하는 것. 가격위험 = 금리가 올라 채권 값이 떨어질 위험."},{"sub":"채권운용","q":"콜옵션부채권(수의상환채권)이 발행회사에 유리한 이유는?","o":["금리가 하락하면 기존 채권을 조기상환하고 낮은 금리로 다시 발행할 수 있기 때문","투자자가 언제든 팔 수 있기 때문","이자를 안 줘도 되기 때문","만기가 무한하기 때문"],"a":0,"e":"발행한 회사가 '중간에 갚아버릴 수 있는 권리'를 가진 채권입니다.\n\n연 6%로 채권을 발행했는데 금리가 3%로 떨어졌다고 합시다. 회사 입장에서는 6%씩 계속 주는 게 아깝습니다. 이때 조기에 갚아버리고 3%로 새로 빌리면 이자 부담이 반으로 줍니다.\n\n투자자는 손해입니다. 좋은 조건의 채권을 강제로 빼앗기니까요. 그래서 이런 채권은 금리를 조금 더 얹어서 발행합니다.\n\n용어 ▸ 수의상환 = 발행자가 원할 때 미리 갚는 것. 조기상환 = 만기 전에 갚는 것."},{"sub":"주식운용","q":"PBR(주가순자산비율)이 1보다 작다는 것의 의미로 옳은 것은?","o":["주가가 회사의 장부상 순자산 가치보다 낮게 평가되고 있다","회사가 반드시 적자이다","주가가 고평가되어 있다","배당을 하지 않는다"],"a":0,"e":"회사를 지금 당장 청산해서 나눠줘도 주가보다 많이 받는다는 뜻입니다.\n\nPBR은 주가를 주당순자산으로 나눈 값입니다. 1보다 작다는 건 회사가 가진 순재산보다 주식 값이 싸다는 의미입니다.\n\n저평가 신호로 보기도 하지만, 그 회사가 앞으로 돈을 못 벌 것 같아서 시장이 낮게 매긴 것일 수도 있습니다. 싸다고 다 좋은 건 아닙니다.\n\n용어 ▸ 순자산 = 자산에서 부채를 뺀 것, 곧 자본. 청산 = 회사를 정리하고 재산을 나누는 것."},{"sub":"주식운용","q":"배당수익률을 구하는 산식으로 옳은 것은?","o":["주당배당금 ÷ 주가","주당배당금 ÷ 주당순이익","주가 ÷ 주당배당금","당기순이익 ÷ 주가"],"a":0,"e":"지금 이 주식을 사면 배당만으로 연 몇 퍼센트를 받는지 보는 지표입니다.\n\n주가가 10,000원인데 배당을 500원 준다면 배당수익률은 5%입니다. 은행 예금 금리와 직접 비교할 수 있는 숫자라 편합니다.\n\n참고로 배당금을 순이익으로 나눈 것은 배당성향이라고 하며, 회사가 번 돈 중 얼마를 나눠줬는지를 봅니다.\n\n용어 ▸ 주당배당금 = 주식 한 주당 받는 배당. 배당성향 = 순이익 중 배당으로 지급한 비율."},{"sub":"주식운용","q":"가치주 투자전략의 특징으로 옳은 것은?","o":["기업의 내재가치보다 저평가된 주식을 사서 제값을 찾을 때까지 보유한다","성장률이 가장 높은 기업만 산다","단기 매매를 반복한다","지수를 그대로 복제한다"],"a":0,"e":"제 가치보다 싸게 팔리는 주식을 사서 값이 제자리를 찾을 때까지 기다리는 방식입니다.\n\n만원짜리 물건이 어떤 이유로 6천원에 나와 있다면 사두는 것입니다. 언젠가 시장이 알아보고 만원으로 돌아올 것이라 믿는 것이죠.\n\n반대로 성장주 투자는 지금은 비싸도 앞으로 훨씬 크게 성장할 회사를 사는 방식입니다. 가치주는 PER·PBR이 낮은 종목, 성장주는 높은 종목이 많습니다.\n\n용어 ▸ 내재가치 = 그 기업이 실제로 지닌 본래 가치. 저평가 = 실제 가치보다 낮게 매겨진 상태."},{"sub":"주식운용","q":"'상향식(Bottom-up)' 종목 선정 방식에 관한 설명으로 옳은 것은?","o":["개별 기업 분석에서 출발해 종목을 고르는 방식","경제 전체를 먼저 보고 산업, 기업 순으로 좁히는 방식","지수를 복제하는 방식","무작위로 고르는 방식"],"a":0,"e":"개별 회사부터 뜯어보고 좋은 회사를 골라내는 방식입니다.\n\n하향식은 반대로 '내년에 금리가 내리겠네 → 그럼 건설업이 좋겠네 → 건설사 중에 A가 낫네' 순으로 좁혀갑니다. 큰 그림에서 시작합니다.\n\n상향식은 경제 상황과 무관하게 '이 회사 자체가 튼튼하고 싸다'를 기준으로 삼습니다. 워런 버핏 방식이 여기에 가깝습니다.\n\n용어 ▸ 상향식 = 아래(개별 기업)에서 위로. 하향식 = 위(거시경제)에서 아래로."},{"sub":"주식운용","q":"포트폴리오의 '리밸런싱'이란 무엇인가?","o":["가격 변동으로 틀어진 자산 비중을 원래 목표 비중으로 되돌리는 것","보유 주식을 전부 파는 것","새로운 계좌를 만드는 것","수수료를 정산하는 것"],"a":0,"e":"처음 정한 비율이 흐트러졌을 때 다시 맞춰주는 작업입니다.\n\n주식 50%, 채권 50%로 시작했는데 주식이 많이 올라 70대 30이 되었다고 합시다. 그냥 두면 위험이 처음 계획보다 커집니다. 그래서 오른 주식을 조금 팔고 채권을 사서 50대 50으로 되돌립니다.\n\n자연스럽게 오른 걸 팔고 내린 걸 사게 되어 규율 있는 투자가 됩니다.\n\n용어 ▸ 비중 = 전체에서 차지하는 비율. 자산배분 = 자금을 자산 종류별로 나누는 일."},{"sub":"주식운용","q":"벤치마크(benchmark)의 역할로 옳은 것은?","o":["운용 성과를 비교 평가하는 기준이 된다","투자 원금을 보장한다","수수료를 결정한다","세금을 계산한다"],"a":0,"e":"내 운용이 잘된 건지 판단하는 기준선입니다.\n\n올해 수익률 10%가 잘한 걸까요? 시장 전체가 20% 올랐다면 못한 것이고, 시장이 마이너스 5%였다면 아주 잘한 것입니다. 절대 숫자만으로는 판단할 수 없습니다.\n\n그래서 코스피200 같은 지수를 기준으로 정해두고 그보다 얼마나 더 벌었는지를 봅니다. 이 차이를 초과수익이라고 합니다.\n\n용어 ▸ 벤치마크 = 비교 기준이 되는 지수. 초과수익(알파) = 벤치마크보다 더 낸 수익."},{"sub":"주식운용","q":"공매도(short selling)에 관한 설명으로 옳은 것은?","o":["주식을 빌려서 판 뒤 나중에 되사서 갚는 거래로 주가가 내려야 이익이다","주식을 싸게 사서 비싸게 파는 것이다","주가가 올라야 이익이다","배당을 받기 위한 거래이다"],"a":0,"e":"없는 주식을 빌려서 먼저 팔고, 나중에 싸게 사서 갚는 거래입니다.\n\n1만원짜리 주식을 빌려서 지금 팝니다. 나중에 7천원으로 떨어지면 사서 갚습니다. 3천원이 남습니다. 값이 떨어져야 버는 구조입니다.\n\n위험이 큽니다. 값이 오르면 손실에 한계가 없습니다. 3만원이 되면 2만원을 물어내야 합니다.\n\n용어 ▸ 공매도 = 없는 것을 판다는 뜻. 상환 = 빌린 주식을 되갚는 것."},{"sub":"포트폴리오","q":"분산투자를 통해 제거할 수 없는 위험은?","o":["비체계적 위험","기업고유 위험","체계적 위험","경영진 교체에 따른 위험"],"a":2,"e":"위험은 두 종류로 나눕니다.\n하나는 그 회사만의 문제입니다. 공장에 불이 나거나 사장이 사고를 치는 것 같은 일입니다. 이건 여러 회사에 나눠 투자하면 서로 상쇄됩니다. A회사가 망해도 B회사가 잘되면 되니까요. 이런 위험을 비체계적 위험이라고 합니다.\n다른 하나는 모든 회사가 함께 맞는 문제입니다. 금리 인상, 전쟁, 경기 침체 같은 것들입니다. 이건 아무리 여러 종목에 나눠 담아도 피할 수 없습니다. 시장 전체가 같이 내려가기 때문입니다. 이걸 체계적 위험이라고 합니다.\n\n▸ 체계적 위험: 시장 전체에 영향을 주어 분산으로 없앨 수 없는 위험. 시장위험이라고도 합니다.\n▸ 비체계적 위험: 개별 기업에만 생기는 위험. 분산으로 없앨 수 있습니다.\n▸ 상쇄: 서로 반대 방향으로 움직여 효과가 지워지는 것."},{"sub":"포트폴리오","q":"베타가 1.5인 주식에 대한 설명으로 옳은 것은?","o":["시장수익률이 1% 변할 때 평균 1.5% 변동한다","시장보다 변동성이 작다","무위험자산과 동일하다","항상 시장보다 1.5%p 높은 수익을 낸다"],"a":0,"e":"베타는 '시장이 흔들릴 때 이 주식은 얼마나 더 흔들리나'를 나타내는 숫자입니다.\n베타가 1이면 시장과 똑같이 움직입니다. 시장이 10% 오르면 이 주식도 대략 10% 오릅니다. 베타가 1.5면 시장이 10% 오를 때 15% 오르고, 시장이 10% 내릴 때 15% 내립니다. 더 크게 먹고 더 크게 잃는 공격적인 주식입니다. 베타가 0.5면 반대로 시장보다 덜 움직이는 방어적인 주식입니다.\n주의할 점은 베타가 높다고 항상 수익이 높다는 뜻이 아니라는 겁니다. 변동 폭이 크다는 뜻일 뿐입니다.\n\n▸ 베타: 시장 변동에 대한 개별 자산의 민감도.\n▸ 변동성: 값이 위아래로 출렁이는 정도.\n▸ 방어적 자산: 시장이 나빠도 상대적으로 덜 떨어지는 자산."},{"sub":"포트폴리오","q":"무위험이자율이 3%, 시장위험프리미엄이 6%, 베타가 1.2일 때 CAPM에 의한 기대수익률은?","o":["7.2%","9.0%","10.2%","13.2%"],"a":2,"e":"CAPM은 '이 정도 위험을 지면 최소 이만큼은 벌어야 한다'를 계산하는 공식입니다.\n계산은 두 덩어리입니다. 먼저 위험을 전혀 안 져도 받을 수 있는 이자(무위험이자율 3%)가 기본으로 깔립니다. 여기에 위험을 진 대가를 더합니다. 그 대가는 시장 평균 대가(6%)에 이 주식이 시장보다 얼마나 위험한지(베타 1.2)를 곱한 값입니다.\n3% + 1.2 × 6% = 3% + 7.2% = 10.2%입니다.\n\n▸ CAPM: 자본자산가격결정모형. 위험과 기대수익률의 관계를 나타내는 공식.\n▸ 무위험이자율: 떼일 걱정이 없는 국채 같은 자산의 이자율.\n▸ 시장위험프리미엄: 시장 전체에 투자한 대가로 무위험이자율보다 더 받는 몫."},{"sub":"포트폴리오","q":"두 자산으로 포트폴리오를 구성할 때 분산효과가 가장 큰 상관계수는?","o":["+1","+0.5","0","-1"],"a":3,"e":"상관계수는 두 자산이 같은 방향으로 움직이는지를 -1에서 +1 사이 숫자로 나타낸 것입니다.\n+1이면 완전히 똑같이 움직입니다. 삼성전자 주식 두 주를 산 것과 다를 게 없어서 나눠 담은 의미가 없습니다. 0이면 서로 무관하게 움직입니다. -1이면 정반대로 움직입니다. 하나가 오를 때 다른 하나가 내리니 손익이 서로 지워져 전체 변동이 거의 사라집니다.\n그래서 분산투자를 할 때는 '많은 종목'보다 '서로 다르게 움직이는 종목'을 고르는 것이 핵심입니다.\n\n▸ 상관계수: 두 값이 함께 움직이는 정도를 나타내는 지표. -1에서 +1 사이입니다.\n▸ 분산효과: 여러 자산에 나눠 담아 전체 위험이 줄어드는 효과."},{"sub":"포트폴리오","q":"효율적 투자선(효율적 프론티어)에 관한 설명으로 옳은 것은?","o":["같은 위험에서 기대수익률이 가장 높은 포트폴리오들을 이은 선","위험이 가장 큰 포트폴리오들의 집합","수익률이 0인 지점들의 집합","무위험자산만으로 구성된 선"],"a":0,"e":"여러 자산을 이렇게도 섞고 저렇게도 섞으면 수많은 조합이 나옵니다. 이 조합들을 위험과 기대수익률 두 축의 그래프에 점으로 찍어보면 구름처럼 퍼집니다.\n이 중에서 같은 위험을 감수했을 때 수익이 가장 높은 점들만 골라 이으면 위쪽 가장자리에 곡선이 그려집니다. 이것이 효율적 투자선입니다. 이 선 아래에 있는 조합은 같은 위험에 더 낮은 수익이니 굳이 고를 이유가 없습니다.\n\n▸ 효율적: 같은 위험이면 수익이 더 높거나, 같은 수익이면 위험이 더 낮은 상태.\n▸ 프론티어: 경계선. 더 이상 나아질 수 없는 한계선을 뜻합니다.\n▸ 지배원리: 더 나은 대안이 있으면 열등한 대안을 버린다는 원칙."},{"sub":"포트폴리오","q":"샤프지수(Sharpe Ratio)가 의미하는 것은?","o":["총위험 한 단위당 초과수익률","베타 한 단위당 초과수익률","절대 수익금액","거래 횟수"],"a":0,"e":"펀드 A는 20% 벌었고 펀드 B는 10% 벌었다면 A가 더 좋은 펀드일까요? 꼭 그렇지 않습니다. A가 훨씬 위험한 방식으로 굴렸다면 운이 좋았던 것일 수 있습니다.\n샤프지수는 '위험을 얼마나 지고 그 수익을 냈는지'를 봅니다. 수익률에서 무위험이자율을 뺀 뒤 그 수익의 출렁임 정도로 나눕니다. 값이 클수록 적은 위험으로 많이 번 것이니 운용을 잘한 겁니다.\n비슷한 지표로 트레이너지수가 있는데, 이건 총위험 대신 베타로 나눕니다.\n\n▸ 초과수익률: 무위험이자율을 넘어선 수익률.\n▸ 총위험: 수익률이 출렁인 정도 전체. 표준편차로 잽니다.\n▸ 표준편차: 값들이 평균에서 얼마나 떨어져 있는지를 나타내는 숫자."},{"sub":"포트폴리오","q":"전략적 자산배분과 전술적 자산배분의 차이로 옳은 것은?","o":["전략적은 장기 기준 비중을 정하는 것이고 전술적은 단기 시장 상황에 따라 비중을 조정하는 것","전략적은 단기, 전술적은 장기이다","둘은 같은 개념이다","전술적 자산배분은 비중을 바꾸지 않는다"],"a":0,"e":"자산배분이란 주식에 몇 %, 채권에 몇 %를 담을지 정하는 일입니다.\n전략적 자산배분은 '우리는 앞으로 몇 년간 주식 60, 채권 40으로 간다'고 큰 틀을 정하는 것입니다. 자주 바꾸지 않습니다. 전술적 자산배분은 그 틀 안에서 '지금 주식이 싸 보이니 65까지 늘리자'처럼 단기적으로 조정하는 것입니다.\n전술적 배분은 저평가된 자산을 사고 고평가된 자산을 파는 역발상 성격을 띱니다.\n\n▸ 자산배분: 투자금을 자산 종류별로 나누는 것.\n▸ 저평가: 실제 가치보다 가격이 싸게 매겨진 상태.\n▸ 리밸런싱: 비중이 틀어졌을 때 원래 목표 비중으로 되돌리는 것."},{"sub":"포트폴리오","q":"포트폴리오 보험전략에 해당하는 것은?","o":["일정 수준 이하로 손실이 나지 않도록 하면서 상승 가능성을 남겨두는 전략","수익을 포기하고 전액 예금하는 전략","레버리지를 최대한 높이는 전략","한 종목에 집중 투자하는 전략"],"a":0,"e":"보험전략은 최악의 경우를 미리 막아두는 방식입니다. 예를 들어 '아무리 나빠져도 원금의 90% 아래로는 내려가지 않게 한다'는 선을 정해두고, 주가가 떨어지면 위험자산 비중을 줄이고 오르면 늘립니다.\n손실을 제한하는 대신 상승할 때 수익을 온전히 다 가져가지는 못합니다. 안전장치를 다는 대가라고 보면 됩니다.\n\n▸ 위험자산: 주식처럼 가격 변동이 큰 자산.\n▸ 안전자산: 국채나 예금처럼 원금 손실 가능성이 작은 자산.\n▸ 레버리지: 빚을 내어 투자 규모를 키우는 것."},{"sub":"포트폴리오","q":"리밸런싱에 관한 설명으로 옳은 것은?","o":["시장 변동으로 틀어진 자산 비중을 목표 비중으로 되돌리는 것","수익이 난 자산을 계속 늘리는 것","한 번 정한 비중을 영원히 유지하는 것","펀드를 전부 환매하는 것"],"a":0,"e":"처음에 주식 50, 채권 50으로 맞췄다고 해봅시다. 1년 뒤 주식이 크게 올라 주식 65, 채권 35가 되었습니다. 가만두면 원래 계획보다 훨씬 위험한 포트폴리오가 됩니다.\n리밸런싱은 오른 주식 일부를 팔고 채권을 사서 다시 50 대 50으로 맞추는 작업입니다. 자연스럽게 '오른 것을 팔고 내린 것을 사는' 행동이 되어 규율 있는 투자를 돕습니다.\n\n▸ 목표 비중: 처음에 정해둔 자산별 비율.\n▸ 규율: 감정에 휘둘리지 않고 정해둔 규칙대로 하는 것."},{"sub":"포트폴리오","q":"자산배분에서 상관관계가 낮은 자산을 함께 담는 주된 이유는?","o":["수익률을 무조건 높이기 위해","전체 포트폴리오의 변동성을 낮추기 위해","세금을 줄이기 위해","거래수수료를 낮추기 위해"],"a":1,"e":"함께 움직이지 않는 자산을 섞으면 한쪽이 나쁠 때 다른 쪽이 버텨줍니다. 전체 성과가 덜 출렁이게 되고, 그만큼 투자자가 공포에 못 이겨 바닥에서 파는 일도 줄어듭니다.\n주식과 채권을 함께 담는 전통적 배분이 대표적입니다. 경기가 나빠지면 주식은 떨어지지만 금리 인하 기대로 채권 가격은 오르는 경향이 있기 때문입니다.\n\n▸ 변동성: 수익률이 위아래로 흔들리는 정도.\n▸ 전통적 자산: 주식과 채권처럼 오래전부터 투자에 쓰인 자산."},{"sub":"포트폴리오","q":"시장이 효율적이라고 보는 효율적 시장가설에서 도출되는 투자 시사점은?","o":["초과수익을 얻기 위해 잦은 매매를 해야 한다","공개된 정보로는 지속적인 초과수익을 얻기 어렵다","기술적 분석으로 항상 이길 수 있다","내부정보를 이용해도 된다"],"a":1,"e":"효율적 시장가설은 '주가에는 이미 알려진 정보가 전부 반영되어 있다'는 주장입니다. 어떤 회사가 좋다는 뉴스가 나오면 그 순간 사람들이 몰려 가격이 이미 올라버리기 때문에, 뉴스를 보고 사서는 남는 게 없다는 논리입니다.\n이 가설이 맞다면 열심히 종목을 고르고 자주 사고파는 것은 수수료만 축내는 일이 됩니다. 그래서 지수를 따라가는 인덱스 투자가 합리적이라는 결론으로 이어집니다.\n\n▸ 효율적 시장: 정보가 가격에 즉시 반영되는 시장.\n▸ 초과수익: 시장 평균보다 더 얻은 수익.
